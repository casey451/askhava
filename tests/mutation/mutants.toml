  { name = "multiplier 4 -> 5", find = "pub const RECURRING_MONTHS: u128 = 4;", replace = "pub const RECURRING_MONTHS: u128 = 5;" },
  { name = "multiplier 4 -> 2 (the superseded rule)", find = "pub const RECURRING_MONTHS: u128 = 4;", replace = "pub const RECURRING_MONTHS: u128 = 2;" },
  { name = "recurring quote charged at face value", find = "let basis = four_months(quote, period)?;", replace = "let _ = period;\n    let basis = basis_of(quote, job.job)?.unwrap_or(0);" },
  { name = "weekly converted x4 instead of x52/12", find = "Self::Weekly => (52, 12),", replace = "Self::Weekly => (4, 1)," },
  { name = "every-two-weeks x2 instead of x26/12", find = "Self::EveryTwoWeeks => (26, 12),", replace = "Self::EveryTwoWeeks => (2, 1)," },
  { name = "yearly /4 instead of /12", find = "Self::Yearly => (1, 12),", replace = "Self::Yearly => (1, 4)," },
  { name = "a one-time job in a recurring category charged at 4 months (D-037)", find = "            return Err(FeeError::NeedsPeriod);\n        }\n", replace = "            return Err(FeeError::NeedsPeriod);\n        }\n        if job.service == Service::OneTimeJobType {\n            return period_fee_for(quote, Some(Period::Monthly), job);\n        }\n" },
  { name = "a period accepted in a non-recurring category", find = "if job.service == Service::NotRecurring {", replace = "if false && job.service == Service::NotRecurring {" },
  { name = "the $75 recurring cap removed (D-196)", find = "    let tier = Tier::for_basis(basis);\n    let tier = if job.service == Service::RecurringJobType {\n        tier.min(job.cap.0)", replace = "    let tier = Tier::for_basis(basis);\n    let tier = if job.service == Service::RecurringJobType {\n        tier" },
