  { name = "the recurring cap removed in flat mode (D-196)", find = "            let tier = flat_tier(job.job.visit_tier, flat_edit);\n            let tier = if job.service == Service::RecurringJobType {\n                tier.min(job.cap.0)", replace = "            let tier = flat_tier(job.job.visit_tier, flat_edit);\n            let tier = if job.service == Service::RecurringJobType {\n                tier" },
]

