# Named mutants (docs/test-design.md section 4; D-481). Protected (BUILD_BRIEF.md:70).
#
# scripts/run_named_mutants.py applies each entry in place: `find` must occur exactly once in
# `file`, it is replaced by `replace`, and `cargo test --locked -p <package> <target> -- <tests>`
# must fail; the file is then restored. A group's keys apply to each of its mutants; a mutant may
# override any of them. `target` defaults to "--lib" (the in-crate tests under src/tests/).
# Ci runs the mutants whose file or test files a pull request changed (every mutant when this
# file or the script changes; a `find` a later task's edit made stale is reported, not failed);
# nightly-main runs them all and fails on a survivor or a stale `find` (BUILD_BRIEF.md:472).
# The task that writes rule code adds its mutants here (T056 stage 2, T073 the money rules and
# the license check at pick, TD-PICK-09, D-479).
#
# TD-LIC-13 (LIC-033): the license filter mutants below, with tests/coverage_floor.json's 95%
# branch floors on app/licensing/ and app/privacy/ (PRIV-022).
#
# cargo-mutants (nightly-main) runs on these files with the in-crate tests (test-design line 60).
# app/catalog/ has no rules.rs (D-1286); T073 added app/payments/src/rules.rs.
cargo_mutants_files = [
  "app/payments/src/rules.rs",
  "app/licensing/src/rules.rs",
  "app/quotes/src/rules.rs",
  "app/messaging/src/rules.rs",
  "app/intake/src/rules.rs",
]

