# The Ask Hava Cargo workspace (docs/architecture.md sections 2 and 11; SEC-029, D-453, D-481, D-488).
# One crate per module under app/, each named askhava-<module> (D-484). T175 adds tests/integration and
# T168 and T010 their test crates to `members`; a `tests/*` glob is never used (that folder holds Python).
# Every approved crate is pinned here at its exact section 11 version; members name them with
# `workspace = true` and every member sets `[lints] workspace = true`.
[workspace]
resolver = "3"
members = ["app/*", "tests/integration", "tests/security", "tests/recovery", "tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
askhava-core = { path = "app/core" }
askhava-ops = { path = "app/ops" }
askhava-adapters = { path = "app/adapters" }
askhava-privacy = { path = "app/privacy" }
axum = { version = "=0.8.9", features = ["multipart"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["set-header", "limit", "fs", "trace", "request-id", "timeout", "catch-panic", "sensitive-headers"] }
askama = "=0.16.1"
askama_web = { version = "=0.16.0", features = ["axum-0.8"] }
pulldown-cmark = "=0.13.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = "=2.0.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "uuid", "json", "sqlx-toml"] }
jiff = { version = "=0.2.38", features = ["tzdb-bundle-always"] }
jiff-sqlx = "=0.2.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
unicode-normalization = "=0.1.24"
hmac = "=0.13.0"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
webauthn-rs = "=0.5.5"
totp-rs = "=6.0.0"
rand = "=0.10.3"
subtle = "=2.6.1"
secrecy = "=0.10.3"
zeroize = "=1.9.1"
uuid = "=1.28.0"
image = { version = "=0.25.10", features = ["jpeg", "png", "webp"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
sentry = { version = "=0.49.3", features = ["rustls", "reqwest", "tracing", "panic", "backtrace"] }
thiserror = "=2.0.21"
base64 = "=0.23.1"
proptest = "=1.12.0"
trybuild = "=1.0.122"
toml = "=1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# Thresholds live in clippy.toml (too-many-lines 50, excessive-nesting 4; D-585).
[workspace.lints.clippy]
too_many_lines = "deny"
excessive_nesting = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
allow_attributes_without_reason = "deny"

[profile.dev]
debug = "line-tables-only"
