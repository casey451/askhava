[package]
name = "askhava-intake"
description = "Ask Hava intake: the first reply to a request, consent text first on every path (CON-001 to CON-004, CON-026, CON-027, CON-031), the 911-list screen and the emergency flow (INT-002 to INT-006, INT-029, INT-030, INT-033, INT-037), what opens a job, duplicates, exact answers and the under-18 reply (INT-007 to INT-012, INT-027, INT-032, INT-038), and the intake tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
askhava-ai = { workspace = true }
askhava-businesses = { workspace = true }
askhava-catalog = { workspace = true }
askhava-core = { workspace = true }
askhava-jobs = { workspace = true }
askhava-messaging = { workspace = true }
askhava-ops = { workspace = true }
askhava-picks = { workspace = true }
askhava-privacy = { workspace = true }
askhava-quotes = { workspace = true }
jiff = { workspace = true }
jiff-sqlx = { workspace = true, features = ["postgres"] }
secrecy = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
