<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F3ECE0;color:#1F1D1B;font-family:Arial,Helvetica,sans-serif;">
<main style="max-width:600px;margin:0 auto;padding:24px;font-size:16px;line-height:1.5;">
{% block content %}
<p>{{ message }}</p>
{% endblock %}
</main>
<footer style="max-width:600px;margin:0 auto;padding:0 24px 24px;font-size:14px;line-height:1.5;color:#4F4A43;">
<p>{{ why }}</p>
<p><a href="{{ manage_url }}" style="color:#6B4A1E;text-decoration:underline;">{{ manage_label }}</a></p>
<p>Ask Hava LLC, {{ postal }}</p>
</footer>
</body>
</html>
