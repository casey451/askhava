<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F7F5F0;color:#1E2926;font-family:Arial,Helvetica,sans-serif;">
<main style="max-width:600px;margin:0 auto;padding:24px;background:#FFFFFF;font-size:16px;line-height:1.5;">
{% block content %}
<p>{{ message }}</p>
{% endblock %}
</main>
<footer style="max-width:600px;margin:0 auto;padding:0 24px 24px;font-size:16px;line-height:1.5;color:#4A5952;">
<p>{{ why }}</p>
<p><a href="{{ manage_url }}" style="color:#245849;text-decoration:underline;">{{ manage_label }}</a></p>
<p>{{ legal }}, {{ postal }}</p>
</footer>
</body>
</html>
