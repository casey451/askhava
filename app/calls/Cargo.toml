jiff = { workspace = true }
jiff-sqlx = { workspace = true, features = ["postgres"] }
secrecy = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
