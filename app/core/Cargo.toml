[package]
name = "askhava-core"
description = "Ask Hava shared kernel: settings, database, clock, task queue, rate limits (D-090)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
jiff = { workspace = true }
jiff-sqlx = { workspace = true, features = ["postgres"] }
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true }
sentry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The one allowed feature (SEC-035, D-491): the test-control router. Never enabled by a
# dependency line or the Docker build; e2e builds pass `--features askhava-core/test-control`.
[features]
test-control = ["dep:reqwest"]

[dev-dependencies]
proptest = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

[lints]
workspace = true
