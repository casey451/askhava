[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unlicense", "MPL-2.0", "MIT-0", "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0", "BSD-2-Clause"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [{ id = "RUSTSEC-2026-0374", reason = "basic-toml is used only at compile time by askama_derive (architecture section 11)" }]
