# AI smell: words, patterns and design habits that make copy or a page read as machine-made (WORD-027, D-452).
# scripts/check_ai_smell.py fails on any hit in customer-facing words or pages. docs/voice.md says what to write instead.
# A hit is fixed by rewriting the line in plain words, never by adding an exemption. Exemptions are only for
# wording the spec fixes for legal or safety reasons, listed by requirement ID under "exempt_requirements".

