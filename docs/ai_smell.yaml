# Regular expressions (Python syntax, case-insensitive). Each has a name, the pattern and what to do instead.
patterns:
  - name: em dash
    regex: "—|\\s–\\s|\\s--\\s"
    fix: Use a period or a comma. People texting don't type dashes.
  - name: not just X but Y
    regex: "\\bnot (just|only|merely) [^.?!]{1,40}(,|;)? ?(but|it's|it is)\\b"
    fix: Say the one thing that is true.
  - name: it's not X, it's Y
    regex: "\\b(it's|it is|this is|that's) not [^.?!]{1,40}[,;] ?(it's|it is|this is|that's)\\b"
    fix: Say what it is.
  - name: three-beat slogan
    regex: "(?:^|[.?!]\\s+)(?:[A-Za-z']+\\s?){1,4}[.!]\\s+(?:[A-Za-z']+\\s?){1,4}[.!]\\s+(?:[A-Za-z']+\\s?){1,4}[.!](?:\\s|$)"
    fix: Write it as one plain sentence ("Text us the job and you'll get quotes from local businesses.").
  - name: from X to Y range
    regex: "\\b(everything )?from (a |an |the )?[a-z]+ [a-z]+ to (a |an |the )?[a-z]+ [a-z]+\\b"
    fix: Name the actual jobs, or leave the list out.
  - name: exclamation mark
    regex: "!"
    fix: A calm period. Excitement reads as a sales pitch.
  - name: emoji
    regex: "[\U0001F300-\U0001FAFF☀-⛿✨⭐]"
    fix: Words only.
  - name: rhetorical opener
    regex: "(?:^|[.!]\\s)(need|looking for|tired of|ready to|want) [^.?!]{1,40}\\?"
    fix: Start with what we do or what happens next.
  - name: colon reveal
    regex: "\\b(the result|the best part|the secret|here's how|the difference|the catch)\\s?:"
    fix: Just say it.

# Invitation patterns no notice may hold (TXT-046, D-490, D-4258). Notices stay transactional: a text or email about a job, a
# pick, a fee or an opt-out never recruits, asks for a referral, offers a discount, sends a survey, announces a feature or asks
# for a social-media follow. Six lists of case-insensitive regular expressions; tests/docs/test_brain_phrases.py fails any
# notice source (message templates, the email layout, the email text built in app/messaging/src) that matches one, with no
# negation allowance. Add a pattern here, never an exemption in the test.
notice_invitations:
  recruiting:
    - '\bjoin (?:laftly|us|our)\b'
    - '\b(?:sign|signs|signing) up (?:your|a) business\b'
    - '\blist your business\b'
    - '\bbecome an? (?:partner|pro|member|laftly business)\b'
    - '\bwe(?:''re| are) hiring\b'
    - '\bapply to join\b'
    - '\bknow an? (?:business|contractor|plumber|electrician|pro|tradesperson)\b'
    - '\b(?:invite|tell) (?:a|your|other) (?:business(?:es)?|contractors?|pros?)\b'
    - '\b[uú]nase a\b'
    - '\bregistre su negocio\b'
    - '\b(?:conoce|conozca) (?:a )?(?:un|alg[uú]n) (?:negocio|contratista)\b'
  referral:
    - '\brefer(?:ral|rals)\b'
    - '\brefer (?:a|your|other|us)\b'
    - '\brefer(?:s|red|ring)?\s+(?:a |your |other )?(?:friends?|neighbou?rs?|family|business(?:es)?|contractors?|pros?)\b'
    - '\brefer(?:s|red|ring)?\s+(?:someone|anyone|them|people)\b'
    - '\breferred by\b'
    - '\b(?:tell|invite) (?:a |your )?(?:friends?|neighbou?rs?|family)\b'
    - '\bshare (?:laftly|us|this (?:link|service|app))\b'
    - '\bspread the word\b'
    - '\bpass (?:it|this|us) (?:on|along)\b'
    - '\brecomi[eé]nd(?:e|enos|elo)\b'
    - '\b(?:invite|cu[eé]ntele) a (?:sus? )?(?:amigos?|vecinos?|familia)\b'
    - '\bcomparta (?:laftly|esto|este enlace)\b'
    - '\bcorra la voz\b'
    - '\breferid\w*'
  discount:
    - '\bdiscount\w*'
    - '\bcoupons?\b'
    - '\bpromo(?:s|tion|tions|tional| code)?\b'
    - '\b\d+\s?%\s*off\b'
    - '\$\d+\s+off\b'
    - '\bfree (?:month|trial|introduction|first)\b'
    - '\bspecial (?:offer|deal|price)s?\b'
    - '\blimited[- ]time\b'
    - '\bsave \$?\d'
    - '\bdescuentos?\b'
    - '\bcup[oó]n(?:es)?\b'
    - '\bpromoci[oó]n(?:es)?\b'
    - '\boferta especial\b'
    - '\bc[oó]digo promocional\b'
  survey:
    - '\bsurveys?\b'
    - '\bquestionnaires?\b'
    - '\bpoll\b'
    - '\brate (?:us|your experience|laftly)\b'
    - '\bhow did we do\b'
    - '\bhow likely\b'
    - '\bleave (?:us )?an? (?:review|rating)\b'
    - '\breview us\b'
    - '\b(?:review|rate) (?:us|laftly) on\b'
    - '\bencuestas?\b'
    - '\bcuestionarios?\b'
    - '\bcalif[ií]quenos\b'
    - '\bd[eé]jenos una (?:rese[ñn]a|calificaci[oó]n)\b'
  new_feature:
    - '\bnew features?\b'
    - '\bnow available\b'
    - '\bintroducing\b'
    - '\bcoming soon\b'
    - '\bwhat''s new\b'
    - '\bcheck out (?:our|the new)\b'
    - '\bwe(?:''ve| have) (?:added|launched)\b'
    - '\bnuevas? (?:funci[oó]n|funciones|herramientas?)\b'
    - '\bya disponible\b'
    - '\bpresentamos\b'
    - '\bpr[oó]ximamente\b'
    - '\bnovedades\b'
  social:
    - '\bfacebook\b'
    - '\binstagram\b'
    - '\btwitter\b'
    - '\btiktok\b'
    - '\bnextdoor\b'
    - '\byoutube\b'
    - '\blinkedin\b'
    - '\bx\.com\b'
    - '\bfollow us\b'
    - '\blike us\b'
    - '\bsocial media\b'
    - '\bs[ií]ganos\b'
    - '\bredes sociales\b'

# Page habits that read as generated (checked in .html and .css files only).
design_patterns:
  - name: linear gradient
    regex: "linear-gradient\\("
    fix: Flat color or a real texture. The two wall-wash lights are radial-gradient only (DESIGN_SPEC section 5).
    allow_in: ["docs/design/reference/", "app/site/static/site.css"]
  - name: colored left border accent
    regex: "border-left\\s*:\\s*[2-9]px"
    fix: Use spacing or a rule line, not a stripe.
  - name: badge or pill
    regex: "class=\"[^\"]*\\b(badge|pill|chip|tag)\\b"
    fix: Plain text. No labels that look like stickers.
  - name: icon font or sparkle
    regex: "(font-awesome|material-icons|lucide|heroicons|sparkle)"
    fix: Words only. Icons only where a real control needs one.

# Requirements whose exact words are fixed for legal or safety reasons; their quoted text is not scanned.
exempt_requirements:
  - INT-004   # the 911 text
  - INT-037   # the 911 text, Spanish
  - CON-018   # the HELP reply carriers require

# Rows whose quotes are examples of what someone else types, or lists of banned words, not our copy.
not_copy_requirements:
  - INT-012   # examples of homeowner replies ("Yes!")
  - WORD-024  # lists the pressure words the voice rule bans ("hurry")
  - WORD-026  # lists words business copy must never use ("unlock")
  - WORD-027  # names the AI-smell examples it bans
  - WORD-028  # describes the cold read

# Phrases the spec requires verbatim that contain a listed word; each names the requirement that fixes it.
allowed_phrases:
  - phrase: "Laftly is not a contractor and does not perform, bid on or supervise work"
    requirement: WORD-002
