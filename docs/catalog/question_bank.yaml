# Ask Hava intake question bank (LIC-040, INT-039, INT-042, D-394). Fake data only.
#
# Checked by scripts/check_catalog.py. One versioned set per category that can be switched on:
# 3 to 8 questions in the order that most improves a business's ability to quote. Every
# question is a fixed template: an English text and a Spanish draft marked for native-speaker
# review (TXT-003). With AI off these are asked word for word; with AI on the AI may reword the
# next one or ask one follow-up from the set's knowledge-base trade, within AI-019 (D-430, D-431).
#
#   kb_trade     the trade file in docs/catalog/trade_kb/trades/ this set draws on (expert brief)
#   photos       up to 3 photo asks, ids from that file's photos_to_request, asked in order
#                after the questions (INT-044, D-432); English wording from the file, Spanish
#                drafted before Spanish conversations go on (TXT-039)
#
#   id           unique within the set
#   en, es       the question, English and Spanish draft
#   options_en, options_es   numbered answers for a multiple-choice question (same count);
#                "Not sure" ("No sé") is always added by the app (INT-039) and is not listed
#   card_field   true: the answer goes on the job card (CARD-007); multiple choice only
#   size_band    true: the answer is a size or budget band compared with a business's
#                largest-job answer (BIZ-049, CARD-001); options carry the band's dollar floor
#   ask_if       ask only when an earlier question got one of the listed answer numbers
#   emergency    true: asked even on a job chosen as an emergency (after the cards go, INT-039)
#
# The INT-042 safety prompts were withdrawn (D-436): only the INT-004 911 text exists.
#
# A question is added or changed only by a logged catalog change. Source of every set below:
# a draft from trade practice and the catalog, to be confirmed with 2 or 3 businesses per trade
# in recruiting ("What do you need to know to quote this without a visit?"); a business that
# says a question changes its price is logged in that set's confirmed_by list.

version: 1
as_of: "2026-10-28"
default_source: "Draft from trade practice and the catalog (D-394); confirm with 2 or 3 businesses per trade in recruiting."
spanish_status: "Draft; native-speaker review before Spanish goes live (TXT-003)."

