# Ask Hava category catalog (K2b).
#
# Derived from the changes file, sections 2, 3, 7 and 7.1
# (sources/01_spec/Changes_Since_v9.3_AUTHORITATIVE.md:32-49, :196-210, :231-256)
# and the 25-category list in
# sources/06_briefs_sent_to_other_ais/Havasu_Home_Quotes_Full_Business_Simulation_for_Grok.md:77-103.
# Decisions: docs/decisions.md D-031 to D-036. Checked by scripts/check_catalog.py.
#
# Field meanings (LIC-001):
#   enabled           true | false. A category not listed here, or listed false, is never routed (LIC-003).
#   license.kind      none (city business-license list only) | roc | state_agency | roc_and_state_agency
#   license.classes   ROC classes that may receive the card.
#   license.agency    the other state agency whose record is checked.
#   handyman_allowed  handymen (no license) may also receive cards in this category, only for
#                     construction-type jobs under $1,000 total with no permit, no gas, no hardwired
#                     smoke alarms and no fire sprinklers (LIC-019 to LIC-025).
#   construction_type the $1,000 handyman limit applies to this category's work (LIC-019, LIC-020).
#   recurring         fee basis is 4 months of the monthly price (REC-002).
#   trip_fee_tier     the set introduction fee in dollars for a trip-fee-plus-estimate quote (FEE-004).
#   after_hours_emergency  the category takes after-hours emergency requests.
#   refused / routed_to    job types this category never takes, and where they go instead.
#   review            who confirmed the row and what an attorney may still look at.

version: 1
as_of: "2026-10-27"
reviewed_by: "Claude (K2b self-check); Casey reviews at the end (BUILD_BRIEF.md:536)"

not_offered_at_launch:
