# Ask Hava category catalog (K2b).
#
# Derived from the changes file, sections 2, 3, 7 and 7.1
# (sources/01_spec/Changes_Since_v9.3_AUTHORITATIVE.md:32-49, :196-210, :231-256)
# and the 25-category list in
# sources/06_briefs_sent_to_other_ais/Havasu_Home_Quotes_Full_Business_Simulation_for_Grok.md:77-103.
# Decisions: docs/decisions.md D-031 to D-036. Checked by scripts/check_catalog.py.
#
# Field meanings (LIC-001):
#   enabled           true | false. A category not listed here, or listed false, is never routed (LIC-003).
#   license.kind      none (city business-license list only) | roc | state_agency | roc_and_state_agency
#   license.classes   ROC classes that may receive the card.
#   license.agency    the other state agency whose record is checked.
#   handyman_allowed  handymen (no license) may also receive cards in this category, only for
#                     construction-type jobs under $1,000 total with no permit, no gas, no hardwired
#                     smoke alarms and no fire sprinklers (LIC-019 to LIC-025).
#   construction_type the $1,000 handyman limit applies to this category's work (LIC-019, LIC-020).
#   recurring         fee basis is 4 months of the monthly price (REC-002).
#   one_time_job_types  in a recurring category, the job types that are one-time jobs:
#                     quoted with no period and priced at face value, no 4-month rule.
#   trip_fee_tier     the set introduction fee in dollars for a diagnostic-visit (visit fee plus
#                     estimate) quote, used only when quote_format is diagnostic_visit: $25 by
#                     default, never above $75 (FEE-004, D-399, D-418, D-441).
#   launch_open       true: "Open now" at Gate C and takes homeowner requests once it has 2 or more
#                     active businesses; false: "Coming later", waitlist sign-ups only (LIC-046, D-396,
#                     D-418). A launch-open category must be enabled.
#   fee_free_job_types  job types whose pick charges no introduction fee (FEE-045, D-403).
#   licensed_only_decision  pest control only: the decision that switched it on for Department
#                     licensees only (LIC-012, D-402).
#
# license.classes lists the narrowest residential classes for reading. Which classes (dual CR-,
# general B and KB, subclassifications) receive which job types is decided only by
# docs/catalog/license_map.yaml (LIC-043, D-392). The question set for each category is in
# docs/catalog/question_bank.yaml (LIC-040, D-394, D-431).
#   quote_format      the one quote format every quote for this category uses (PICK-053, D-441):
#                     range | monthly | tiers | firm | diagnostic_visit. A recurring category is
#                     monthly (its one_time_job_types are quoted firm); only a diagnostic_visit
#                     category takes a visit-fee quote (FEE-004).
#   job_type_formats  a job type whose quotes use another format than the category's, so every
#                     quote for that job type lines up (PICK-053); never a visit fee outside a
#                     diagnostic_visit category's own job types.
#   design            true: inspiration pictures and, while the switch is on, a labeled AI concept
#                     image (INT-045, INT-046, D-433); range categories only.
#   after_hours_emergency  the category takes after-hours emergency requests.
#   refused / routed_to    job types this category never takes, and where they go instead.
#   review            who confirmed the row and what an attorney may still look at.

