# Matching worked examples (D-110): who receives a job card, written before any routing code
# and apart from both the app and the twin, so the two cannot share one licensing mistake (F07).
# Rows M01 to M16 are docs/test-design.md section 7.2; `table` keeps that table's job name and
# `candidates` uses the catalog's job-type names (categories.yaml, refused jobs included).
# Rules: CARD-001, CARD-002, CARD-003, LIC-012, LIC-013, LIC-014, LIC-016, LIC-017, LIC-021,
# LIC-022, LIC-035. Checked by scripts/check_catalog.py; the app's matching tests (TD-LIC-02)
# and the Twin gate's license table are checked against it.
#
# Every business is active and verified. Fields:
#   job:      category, candidates (the job types still possible), town, table (7.2's name)
#   business: roc (ROC class rows of license_map.yaml), agencies (agency `license` names of
#             license_map.yaml), handyman, city_list (on the city business-license list),
#             ticked (job types it ticked at sign-up), towns (towns it serves)
#   expected: outcome (card, no_card or refused_at_intake), rules (requirement IDs),
#             map_covers (whether the business's ROC classes and agency licenses cover every
#             candidate as license_map.yaml says; null when it holds none), condition (a limit
#             the card carries, required on a handyman card)
# All names and towns are fake or public place names; no homeowner data.

version: 1
examples:
  - id: M01
    job: {category: hvac_repair, candidates: [AC not cooling], town: Lake Havasu City, table: AC repair}
    business: {roc: [R-39], agencies: [], handyman: false, city_list: false, ticked: [AC not cooling], towns: [Lake Havasu City]}
    expected: {outcome: card, rules: [CARD-001], map_covers: true}
  - id: M02
    job: {category: hvac_repair, candidates: [furnace repair], town: Lake Havasu City, table: furnace repair}
    business:
      roc: [R-39R Air Conditioning and Refrigeration]
      agencies: []
      handyman: false
      city_list: false
      ticked: [AC not cooling, thermostat, duct repair, furnace repair, evaporative (swamp) cooler repair]
      towns: [Lake Havasu City]
    expected: {outcome: no_card, rules: [LIC-035], map_covers: false}
