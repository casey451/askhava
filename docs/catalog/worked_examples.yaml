# Ask Hava worked fee examples (K2b). Fake data only: no real homeowner or business.
#
# Each example is a chosen quote and the introduction fee the business pays when it
# confirms the pick. scripts/check_catalog.py recomputes every row from the rules below
# (FEE-001 to FEE-013, FEE-039, REC-002 to REC-005, LIC-019, LIC-020) and fails on any mismatch.
# A recurring quote (one with a period) never pays more than recurring_fee_cap (FEE-039, D-196).
# FEE-034: the app's fee unit tests are built from these rows.
#
# Money is written as quoted strings so no amount is ever read as a float.
#
# quote.type      fixed | range | trip_fee (trip fee plus estimate: the category's set tier)
# quote.period    recurring only: weekly | every_two_weeks | monthly | quarterly | yearly.
#                 A quote with no period is a one-time job at face value, even in a
#                 recurring category; it must then name one of the category's
#                 one_time_job_types in job_type.
# business        qualified (holds what the category requires, which may be nothing) |
#                 handyman_exemption (unlicensed, under A.R.S. 32-1121(A)(14)). The $1,000
#                 limit applies to construction-type work by a handyman_exemption business or
#                 in a no-license category; never to non-construction work (LIC-019, LIC-020)
# situation       new_customer | repeat_customer (always $0, FEE-013) |
#                 free_first_win ($0 charged, tier fee recorded as waived, FEE-012)
# expected        outcome (charged | refused), fee_basis (null for trip fee or refused),
#                 fee (dollars charged), waived (dollars waived by a free first win)

fee_rules:
  tiers:
    - {fee: 25, basis_below: "500.00"}
    - {fee: 75, basis_from: "500.00", basis_up_to_and_including: "1500.00"}
    - {fee: 199, basis_above: "1500.00"}
  recurring_months: 4
  recurring_fee_cap: 75
  monthly_conversion:
    weekly: "x 52 / 12"
    every_two_weeks: "x 26 / 12"
    monthly: "x 1"
    quarterly: "/ 3"
    yearly: "/ 12"
  range_basis: midpoint
  basis_rounding: "round down to the whole cent before choosing the tier (D-033)"
  handyman_limit: "1000.00"

examples:

  # ---- One-time fixed quotes, including the exact tier edges (D-009) ----

  - id: W01
    description: Small leak repair
    category: plumbing_repair
    business: qualified
    situation: new_customer
    quote: {type: fixed, amount: "180.00"}
    expected: {outcome: charged, fee_basis: "180.00", fee: 25, waived: 0}

