# Ask Hava trade knowledge file: septic
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: septic
display_name: Septic pumping & service
summary: 'Septic tank pumping and related work: routine pumping, emergency pump-outs for backups, locating and digging
  up lids, riser installs, transfer-of-ownership inspections for home sales, baffle/filter cleaning, and septic
  repairs or new systems. Most of Lake Havasu City moved to city sewer under the Wastewater System Expansion Program
  (completed around 2011), but some homes and many nearby county areas still use septic [judgment: share not confirmed].
  Pumping trucks are licensed by ADEQ; repairs and installs need ROC licenses and county permits. Ask Hava never
  says if a system is failing.'
