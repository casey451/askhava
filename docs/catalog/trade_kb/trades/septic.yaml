emergency_signals:
- id: es_sewage_backing_up_into_the_hou
  signal: Sewage backing up into the house
  emergency: 'yes'
  safety_step: Stop using water in the house, keep people away from the sewage, and call a licensed septic business.
  source: EPA SepticSmart homeowner brochure - https://www.epa.gov/sites/default/files/2015-06/documents/septicsmart_short_rack_brochure_english-print-ready.pdf
    ; EPA SepticSmart, Resolving Septic System Malfunctions - https://www.epa.gov/septic/resolving-septic-system-malfunctions
  then_route_to: septic
- id: es_broken_or_open_septic_lid_wher
  signal: Broken or open septic lid where kids or pets can fall in
  emergency: 'yes'
  safety_step: Keep kids and pets away and cover the opening with something strong until it is fixed. [judgment
    on wording]
  source: EPA SepticSmart homeowner brochure - https://www.epa.gov/sites/default/files/2015-06/documents/septicsmart_short_rack_brochure_english-print-ready.pdf
  then_route_to: septic
- id: es_someone_went_into_or_fell_into
  signal: Someone went into or fell into a tank
  emergency: 'yes'
  safety_step: Never go into a septic tank. Gases inside can kill in minutes, even rescuers. Call 911.
  source: CDC/NIOSH, A Guide to Safety in Confined Spaces - https://stacks.cdc.gov/view/cdc/5830
  then_route_to: septic
- id: es_strong_sewer_gas_smell_inside
  signal: Strong sewer gas smell inside
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: septic
safety_step:
- when: Anyone thinking of going into a tank, or someone fell in
  step: Never go into a septic tank. Gases inside can kill in minutes, even rescuers. Call 911.
  source: CDC/NIOSH, A Guide to Safety in Confined Spaces - https://stacks.cdc.gov/view/cdc/5830
- when: Open or broken lid
  step: Keep kids and pets away and cover the opening with something strong until it is fixed. [judgment on wording]
  source: EPA SepticSmart homeowner brochure - https://www.epa.gov/sites/default/files/2015-06/documents/septicsmart_short_rack_brochure_english-print-ready.pdf
- when: Sewage backing up
  step: Stop using water in the house, keep people away from the sewage, and call a licensed septic business.
  source: EPA SepticSmart homeowner brochure - https://www.epa.gov/sites/default/files/2015-06/documents/septicsmart_short_rack_brochure_english-print-ready.pdf
    ; EPA SepticSmart, Resolving Septic System Malfunctions - https://www.epa.gov/septic/resolving-septic-system-malfunctions
