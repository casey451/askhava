questions:
- id: need
  text: What do you need?
  options:
  - Routine pumping
  - Backup or sewage smell now
  - Inspection for home sale
  - Find tank / add risers
  - Repair
  - New system
  - Switch to city sewer
  ask_if: always
  changes_price: 'yes'
- id: sewage_inside
  text: Is sewage coming up inside the house?
  options:
  - 'Yes'
  - No, slow drains only
  - Sewage or wet spot in yard
  ask_if: need == Backup or sewage smell now
  changes_price: 'yes'
- id: tank_size
  text: Do you know the tank size or number of bedrooms?
  options:
  - 1-2 bedrooms
  - 3 bedrooms
  - 4+ bedrooms
  - Tank size known (type it)
  - Not sure
  ask_if: need in [Routine pumping, Backup or sewage smell now, Inspection for home sale]
  changes_price: 'yes'
- id: lids_exposed
  text: Are the tank lids easy to get to?
  options:
  - Yes, risers at ground level
  - Buried, I know where
  - Buried, not sure where
  - Not sure
  ask_if: need in [Routine pumping, Backup or sewage smell now, Inspection for home sale, Find tank / add risers]
  changes_price: 'yes'
- id: last_pumped
  text: When was it last pumped?
  options:
  - Under 3 years
  - 3-5 years
  - Over 5 years
  - Never / don't know
  ask_if: need in [Routine pumping, Inspection for home sale]
  changes_price: 'no'
- id: in_city
