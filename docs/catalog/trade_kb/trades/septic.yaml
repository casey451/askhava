  work: Permits for new or changed systems
  classes:
  - Mohave County Development Services, Environmental Quality, under ADEQ delegation
  citation: Mohave County Development Services, Environmental Quality (septic permits under ADEQ delegation, [number removed, see source])
    - https://www.mohave.gov/departments/development-services/
  other_agency: null
  notes: ''
- job_type:
  - sewer_hookup
  work: Sewer connection and septic abandonment in the city
  classes:
  - R-37 Plumbing or CR-80 / A-12 for sewer lines; city permit likely [judgment / open question]
  citation: A.A.C. R4-9-103 Residential contractor license classes (Cornell LII copy) - https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-9-103
    ; A.A.C. R4-9-104 Dual contractor license classes (Cornell LII copy) - https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-9-104;
    A.A.C. R4-9-102 [S1] (commercial classes)
  other_agency: null
  notes: ''
handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: No. Pumping needs an ADEQ-licensed truck. Repairs and installs need an ROC license and county permit, so
    the handyman exemption (A.R.S. 32-1121(A)(14)) does not apply when a permit is required.
local_notes:
- 'Lake Havasu City''s Wastewater System Expansion Program converted most of the city (about 85%) to sewer and removed
  over 20,000 septic systems. Sources: Water Education Foundation, Lake Havasu City water supply and wastewater
  (Wastewater System Expansion Program) - https://www.watereducation.org/sites/main/files/file-attachments/wlsonlake_havasu_city_water_supply_and_wastewater_treatment.pdf
  ; Lake Havasu City 2022 Wastewater Master Plan - https://www.lhcaz.gov/DocumentCenter/View/1587/Lake-Havasu-City-Wastewater-Master-Plan-2022-PDF'
- Remaining septic is mostly in some city areas and county areas such as Desert Hills [judgment / open question].
- 'Mohave County runs septic permits under ADEQ delegation [number removed, see source]). Source: Mohave County Development Services,
  Environmental Quality (septic permits under ADEQ delegation, [number removed, see source]) - https://www.mohave.gov/departments/development-services/'
- 'Cesspools are not allowed in Arizona. Source: A.A.C. R18-9-A309 General requirements (cesspools prohibited) -
  https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R18-9-A309'
- Caliche can make finding and digging up tanks slow [judgment].
