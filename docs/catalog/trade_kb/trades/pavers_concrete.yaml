- id: es_hole_or_collapse_under_a_slab_
  signal: Hole or collapse under a slab people walk on
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: pavers_concrete
- id: es_hit_a_buried_gas_or_power_line
  signal: Hit a buried gas or power line
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: pavers_concrete
- id: es_wet_concrete_burn_on_skin
  signal: Wet concrete burn on skin
  emergency: 'yes'
  safety_step: Wet cement can burn skin; wash it off with clean water and see a doctor for a burn.
  source: CDC/NIOSH, Skin exposures and effects (wet cement) - https://www.cdc.gov/niosh/topics/skin/
  then_route_to: pavers_concrete
safety_step:
- when: Digging or breaking ground
  step: Call 811 (1-800-STAKE-IT) at least two working days before digging.
  source: Arizona 811 (call 811 or 1-800-STAKE-IT at least two working days before digging) - https://www.arizona811.com/
- when: Cutting or grinding concrete
  step: Concrete dust has silica that harms lungs; keep kids and pets away during cutting. [judgment on homeowner
    wording]
  source: OSHA, Silica in construction - https://www.osha.gov/silica-crystalline/construction
- when: Wet concrete on skin
  step: Wet cement can burn skin; wash it off with clean water and see a doctor for a burn.
  source: CDC/NIOSH, Skin exposures and effects (wet cement) - https://www.cdc.gov/niosh/topics/skin/
- when: Summer pours
  step: Heat can be deadly for anyone working outside; take water and shade breaks.
  source: National Weather Service, Heat Safety - https://www.weather.gov/safety/heat
