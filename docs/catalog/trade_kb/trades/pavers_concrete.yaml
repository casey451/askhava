handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: 'Small repairs only. A.R.S. 32-1121(A)(14): a person may do ''casual or minor'' work without an ROC license
    only if the whole job (labor, materials, everything) is under $1,000, no building permit is needed, it is not
    part of a larger job or split up to get under the limit, and their ads say ''not a licensed contractor''. Per
    32-1121(D) the exemption never covers work that connects to natural gas, propane or other fuel gas, or hardwired/interconnected
    fire-safety devices. Lake Havasu City''s permit list decides whether a permit is needed (https://www.lhcaz.gov/development-permitting/building).
    Most new patios and driveways go over $1,000 [judgment], and city right-of-way driveway approaches likely need
    a permit [judgment / open question].'
local_notes:
- Caliche layers can make digging and base prep slow [judgment].
- Summer heat makes concrete set fast; many crews pour very early in the morning [judgment].
- Driveway work in the city right-of-way likely needs a Lake Havasu City permit; not confirmed [open question].
- Monsoon rain can undermine pavers near drains and washes [judgment].
