# Ask Hava trade knowledge file: pavers_concrete
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: pavers_concrete
display_name: Pavers & concrete
summary: 'Flatwork and hardscape: concrete patios, walkways, driveways, slabs (RV pads, sheds), paver patios and
  pool decks, paver repair (sunken or lifted pavers), crack repair, decorative or stamped concrete, coatings, and
  short block garden walls. Caliche and expansive desert soils can affect digging and base prep [judgment]. Ask
  Hava collects size, use and photos only.'
