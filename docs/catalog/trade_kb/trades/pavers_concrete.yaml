questions:
- id: project
  text: What is the project?
  options:
  - New patio or walkway
  - Driveway
  - Slab / pad (RV, shed, AC)
  - Fix pavers
  - Fix cracks
  - Pool deck
  - Coating / seal / stain
  - Short wall or fire pit
  ask_if: always
  changes_price: 'yes'
- id: material
  text: What material do you want?
  options:
  - Plain concrete
  - Stamped / colored concrete
  - Pavers
  - Travertine or stone
  - Not sure / want options
  ask_if: project in [New patio or walkway, Driveway, Slab / pad (RV, shed, AC), Pool deck]
  changes_price: 'yes'
- id: size
  text: About how big?
  options:
  - Under 100 sq ft (about 10x10)
  - 100-300 sq ft
  - 300-600 sq ft
  - Over 600 sq ft
  - Not sure
  ask_if: always
  changes_price: 'yes'
- id: remove_old
  text: Does old concrete, pavers or rock need to come out first?
  options:
  - 'Yes'
  - No, it's bare dirt
  - Not sure
  ask_if: project not in [Fix cracks, Coating / seal / stain]
  changes_price: 'yes'
- id: vehicle_load
  text: Will cars, RVs or boats drive or park on it?
  options:
  - Cars
  - RV or boat
  - Foot traffic only
  ask_if: project in [Driveway, Slab / pad (RV, shed, AC), New patio or walkway]
  changes_price: 'yes'
- id: access
  text: Can a concrete truck get close?
  options:
  - Yes, from the street
  - Only through a side gate
  - Back yard, no access
  - Not sure
  ask_if: project not in [Coating / seal / stain, Fix cracks]
  changes_price: 'yes'
