# Ask Hava trade knowledge file: generator_ev
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: generator_ev
display_name: Generators and EV chargers
summary: Standby (whole-home) generators, transfer switches and inlets for portable generators, generator service,
  and home EV chargers (Level 2 circuits and charger installs). This is electrical work (R-11/CR-11); a natural
  gas or propane feed to a standby generator is gas piping work (R-37) and is never handyman work [S2][S4]. Ask
  Hava learns which device, fuel, panel photos and distance, then writes a card. It never sizes a generator or charger,
  never says a panel can handle a load, and never says whether a permit is needed beyond what the city lists.
