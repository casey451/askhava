    or fans running. Run it only outside, far from windows, doors and vents, with the exhaust pointed away from
    buildings. If anyone feels sick, dizzy or weak while a generator is running, get to fresh air right away and
    call 911. If a CO alarm is sounding, do not look for the cause. Get everyone outside to fresh air right away.
    Call 911 or the fire department from outside. Count heads. Do not go back in until responders say it is safe.
    Do not use the fuel-burning appliance again until it has been checked.'
  source: '[CPSC-GEN][S26][S31]'
- when: Generator plugged into a house outlet to power the home (backfeeding)
  step: 'CPSC: never power house wiring by plugging a generator into a wall outlet (backfeeding). It can electrocute
    utility workers and neighbors. If one is plugged in this way now, it is safest to shut off the generator from
    outside without touching wet parts. CDC also says connecting a generator to home wiring without a transfer switch
    is dangerous and illegal.'
  source: '[CPSC-GEN][S31]'
- when: Generator fire, fuel leak or fuel spill on a hot engine
  step: 'CPSC: turn the generator off and let it cool before refueling; gasoline spilled on hot parts can catch
    fire. Store fuel outside living areas in labeled safety cans, not near a gas water heater. If there is fire,
    get away and call 911.'
  source: '[CPSC-GEN][NFPA-ESCAPE]'
- when: Gas or propane smell at a standby generator
  step: Leave the home or area right away. Do not use a phone, light switch or anything that can make a spark inside.
    Do not smoke or light a match. If you are outside, do not start a car. Do not try to find the leak. From a safe
    place, call 911 and the UniSource 24-hour line, [number removed, see source]. Do not go back until UniSource or the fire department
    says it is safe. Only UniSource may turn gas service back on.
  source: '[UNS-GAS][S22][S25]'
- when: EV charger, plug or cord melted, sparking, smoking or very hot
  step: 'ESFI: never use a damaged charger or cable. Stop charging and do not touch a charger, plug or cord that
    is melted, sparking, smoking or very hot. If there is smoke or fire at the charger or vehicle, get everyone
    out, stay out, and call 911 from outside.'
  source: '[ESFI-EV][NFPA-ESCAPE]'
license_classes:
- job_type:
  - standby_generator
  classes:
  - R-11 Electrical / CR-11 (electrical, transfer switch)
  - R-37 Plumbing, Including Solar / CR-77 (natural gas or propane piping to the unit)
  citation: R4-9-103 (R-11 'install and repair residential electrical systems'; R-37 includes gas piping) [S2];
    R4-9-104 (CR-11, CR-77) [S3]
  other_agency: UniSource for gas meter size or service; LHC permit [S17][judgment]
  notes: The R-11 + R-37 pairing for standby generators is [judgment] (foundation). Gas or propane connections are
    never handyman work [S4]. Many generator dealers hold both or subcontract [judgment].
- job_type:
  - transfer_switch
  classes:
  - R-11 Electrical
  - CR-11 Electrical
  citation: R4-9-103; R4-9-104 [S2][S3]
  other_agency: null
  notes: Interlock kits and inlets change panel wiring [judgment].
- job_type:
  - generator_service
  classes:
  - R-11 / CR-11 for electrical repair
  - 'Engine tune-up only: may be no ROC class if not part of a structure [judgment]'
  citation: R4-9-103 [S2]; A.A.C. R4-9-104 [S3] (CR- dual classes)
  other_agency: null
  notes: '[judgment]: portable generator engine repair is small-engine work, not contracting; route to appliance_repair
    if no dealer.'
- job_type:
  - ev_charger
  classes:
  - R-11 Electrical
  - CR-11 Electrical
  citation: R4-9-103; R4-9-104 [S2][S3]
  other_agency: LHC permit likely for a new circuit [S17][judgment]
  notes: 'ESFI: chargers should be installed by a qualified electrician [ESFI-EV]. Same classes for ev_charger_repair
    and battery_backup.'
handyman_ok:
  allowed_examples:
  - Plugging in a plug-in charger to an existing outlet needs no contractor [judgment]
  not_allowed_examples:
  - Any new 240V circuit, charger hardwire or transfer switch (permit) [S17][judgment]
  - Any gas or propane hookup to a generator [S4]
  - Any job $1,000 or more [S4]
  rule_reminder: 'A person without an ROC license may take a job only if ALL are true: total price (labor + materials
    + everything) is under $1,000; the work is casual, minor or inconsequential; no local building permit is required;
    it is not part of a larger job or split up to stay under $1,000; and any ad says ''not a licensed contractor''.
    The exemption never covers work that connects to natural gas, propane or other fuel gas, or fire-safety work
    such as hardwired/interconnected smoke alarms. Source: A.R.S. 32-1121(A)(14) and (D) [S4]. In Lake Havasu City,
    check the city permit list: a needed permit removes the exemption [S17].'
local_notes:
- Summer outages in extreme heat raise generator interest; Ask Hava gives heat safety steps first if someone is
  without AC [S27][judgment].
- Standby generators run on natural gas (UniSource) in town; outlying areas often use propane [judgment].
- Golf carts are common in Havasu; outlet requests for cart charging route here (circuit) or to golf_cart (cart
  repair) [judgment].
- 'Digging for a buried line: Arizona 811, 1-800-STAKE-IT, at least two working days before digging; state law requires
  it [S24][AZ811].'
- UniSource Energy Services is the electric and gas utility in Lake Havasu City; 24/7 line [number removed, see source] [S22].
- EPA explains Level 1 (standard outlet) vs Level 2 (240V) charging [EPA-EV]. Ask Hava never says which a vehicle
  needs.
sample_card: 'REQ-0214 | EV charger | Lake Havasu City, north

  Install a Level 2 charger in garage; owner has the charger.

  Panel photo: 200 amp, same wall, about 15 ft run.'
