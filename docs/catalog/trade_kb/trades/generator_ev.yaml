questions:
- id: q1_job
  text: What do you need?
  options:
  - New whole-home generator
  - Hook up a portable generator
  - Fix or service a generator
  - New EV charger or outlet
  - Fix an EV charger
  - Battery backup
  ask_if: always
  changes_price: 'yes'
  why: Each is a different kind of job. [judgment]
- id: q2_fuel
  text: What fuel would the generator use?
  options:
  - Natural gas (UniSource)
  - Propane tank
  - Gasoline or diesel (portable)
  - Not sure
  ask_if: q1_job in ['New whole-home generator', 'Fix or service a generator']
  changes_price: 'yes'
  why: A gas or propane feed adds gas piping by a licensed plumber or gas contractor. [S2][judgment]
- id: q3_distance
  text: About how far is the panel from where the generator or charger would go?
  options:
  - Same wall or very close
  - Under 25 feet
  - 25-50 feet
  - More than 50 feet or a detached spot
  - Not sure
  ask_if: q1_job in ['New whole-home generator', 'Hook up a portable generator', 'New EV charger or outlet', 'Battery
    backup']
  changes_price: 'yes'
  why: Wire runs are a big part of the price. [judgment]
- id: q4_panel
  text: Can you send a photo of your main electrical panel with the door open?
  options:
  - Sent a photo
  - Can't get to it
  - Not sure where it is
  ask_if: q1_job != 'Fix or service a generator'
  changes_price: 'yes'
  why: Panel size and open spaces shape the job; a business decides if the panel can take the load. [judgment]
- id: q5_charger
  text: Do you already have the charger?
  options:
  - Yes, I have it
  - I want a 240V outlet only
  - I need the charger too
  - Not sure
  ask_if: q1_job == 'New EV charger or outlet'
  changes_price: 'yes'
  why: Hardwired chargers and outlets are priced differently. [EPA-EV][judgment]
quote_without_visit_needs:
- EV charger or outlet close to the panel with clear panel photos [judgment]
- Generator inlet/interlock with panel photo and location [judgment]
site_visit_usually_needed:
- Standby generators (pad, gas line, clearances, permits) [S17][judgment]
- Long runs, trenching or detached garages (Arizona 811 before digging) [S24][AZ811]
- Generator repairs [judgment]
- Battery backup [judgment]
photos_to_request:
- id: p1_panel
  ask: A photo of the main electrical panel with the door open, and the label inside the door if you can read it.
  for_job_types:
  - standby_generator
  - transfer_switch
  - ev_charger
  - battery_backup
  - ev_charger_repair
- id: p2_spot
  ask: A photo of where the generator or charger would go, showing the panel or meter if you can.
  for_job_types:
  - standby_generator
  - transfer_switch
  - ev_charger
  - battery_backup
- id: p3_gen
  ask: A photo of the generator's label and its control screen or lights.
  for_job_types:
  - generator_service
  - transfer_switch
- id: p4_meter
  ask: A photo of the gas meter or propane tank from a safe distance.
  for_job_types:
  - standby_generator
- id: p5_charger
  ask: A photo of the charger, its lights and its label.
  for_job_types:
  - ev_charger_repair
photo_cues:
- photo_id: p1_panel
  look_for:
  - Main breaker amps; open breaker spaces; brand; existing 240V breakers [judgment]
  - FPE Stab-Lok or Zinsco names (note only; route to electrical) [judgment]
  neutral_wording_example: 200 amp main; about 4 open spaces; panel in garage.
- photo_id: p2_spot
  look_for:
  - Distance to panel; side yard clearance; windows and doors near a generator spot [CPSC-GEN][judgment]
  neutral_wording_example: Garage wall next to panel; about 10 feet to parking spot.
- photo_id: p3_gen
  look_for:
  - Brand, kW size, fuel type, fault message; record only [judgment]
  neutral_wording_example: Generac 22 kW; screen shows a fault code.
- photo_id: p4_meter
  look_for:
  - Natural gas meter vs propane tank; tank size label [judgment]
  neutral_wording_example: UniSource gas meter on east side; about 30 feet to the proposed pad.
- photo_id: p5_charger
  look_for:
  - Charger brand; light color; melted or scorched plug [ESFI-EV]
  neutral_wording_example: Tesla wall connector; red light; plug looks clean.
photo_red_flags:
- flag: Generator running inside a garage, shed or near open windows
  safety_step_ref: es_gen_co
- flag: Generator cord plugged into a wall outlet (dryer or regular outlet) to power the house
  safety_step_ref: es_backfeed
- flag: Melted, scorched or smoking charger, plug or cord
  safety_step_ref: es_ev
emergency_signals:
- id: es_gen_co
  signal: Generator running indoors or in a garage, or people feel sick, dizzy or weak; CO alarm sounding
  emergency: 'yes'
  safety_step: 'CPSC: never run a generator inside a home, garage, crawlspace or shed, even with doors or windows
    open or fans running. Run it only outside, far from windows, doors and vents, with the exhaust pointed away
    from buildings. If anyone feels sick, dizzy or weak while a generator is running, get to fresh air right away
    and call 911. If a CO alarm is sounding, do not look for the cause. Get everyone outside to fresh air right
    away. Call 911 or the fire department from outside. Count heads. Do not go back in until responders say it is
    safe. Do not use the fuel-burning appliance again until it has been checked.'
  source: '[CPSC-GEN][S26][S31]'
  then_route_to: generator_ev
- id: es_backfeed
  signal: Generator plugged into a house outlet to power the home (backfeeding)
  emergency: 'yes'
  safety_step: 'CPSC: never power house wiring by plugging a generator into a wall outlet (backfeeding). It can
    electrocute utility workers and neighbors. If one is plugged in this way now, it is safest to shut off the generator
    from outside without touching wet parts. CDC also says connecting a generator to home wiring without a transfer
    switch is dangerous and illegal.'
  source: '[CPSC-GEN][S31]'
  then_route_to: generator_ev
- id: es_gen_fire
  signal: Generator fire, fuel leak or fuel spill on a hot engine
  emergency: 'yes'
  safety_step: 'CPSC: turn the generator off and let it cool before refueling; gasoline spilled on hot parts can
    catch fire. Store fuel outside living areas in labeled safety cans, not near a gas water heater. If there is
    fire, get away and call 911.'
  source: '[CPSC-GEN][NFPA-ESCAPE]'
  then_route_to: generator_ev
- id: es_gas_smell
  signal: Gas or propane smell at a standby generator
  emergency: 'yes'
  safety_step: Leave the home or area right away. Do not use a phone, light switch or anything that can make a spark
    inside. Do not smoke or light a match. If you are outside, do not start a car. Do not try to find the leak.
    From a safe place, call 911 and the UniSource 24-hour line, [number removed, see source]. Do not go back until UniSource or
    the fire department says it is safe. Only UniSource may turn gas service back on.
  source: '[UNS-GAS][S22][S25]'
  then_route_to: gas_lines
- id: es_ev
  signal: EV charger, plug or cord melted, sparking, smoking or very hot
  emergency: 'yes'
  safety_step: 'ESFI: never use a damaged charger or cable. Stop charging and do not touch a charger, plug or cord
    that is melted, sparking, smoking or very hot. If there is smoke or fire at the charger or vehicle, get everyone
    out, stay out, and call 911 from outside.'
  source: '[ESFI-EV][NFPA-ESCAPE]'
  then_route_to: generator_ev
- id: es_outage
  signal: Whole home has no power (deciding about a generator)
  emergency: depends
  safety_step: 'Call UniSource at [number removed, see source] to report the outage. CPSC: never run a generator inside a home,
    garage, crawlspace or shed, even with doors or windows open or fans running. Run it only outside, far from windows,
    doors and vents, with the exhaust pointed away from buildings. If anyone feels sick, dizzy or weak while a generator
    is running, get to fresh air right away and call 911.'
  source: '[S25][CPSC-GEN]'
  then_route_to: electrical
safety_step:
