  site_visit_usually_needed: 'yes'
  handyman_ok: 'yes'
- id: labor_only
  label: 'Labor only: load/unload a truck or container'
  site_visit_usually_needed: 'no'
  handyman_ok: 'yes'
- id: heavy_item
  label: Single heavy item (piano, safe, hot tub on dolly)
  site_visit_usually_needed: sometimes
  handyman_ok: 'yes'
- id: in_home
