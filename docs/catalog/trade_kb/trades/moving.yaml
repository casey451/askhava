# Ask Hava trade knowledge file: moving
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: moving
display_name: Moving Help
summary: Local and long-distance household moves, labor-only loading/unloading of trucks or PODS-style containers,
  single heavy items (piano, safe, gun safe), and in-home furniture moves. Arizona has no state mover license; AZ
  DPS tells consumers to check that an in-state mover is registered with the Arizona Corporation Commission, and
  A.R.S. 44-1613 bars an in-state mover from refusing to unload or threatening a lien once it has the goods. Interstate
  moves (Havasu to California or Nevada is interstate) need an FMCSA-registered mover with a USDOT number. Disconnecting
  gas appliances is licensed work and never handyman work. Summer heat is a real safety issue for crews.
