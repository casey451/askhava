questions:
- id: q1_distance
  text: Where is the move going?
  options:
  - Within Lake Havasu City
  - Elsewhere in Arizona
  - Another state
  - Within the home or to storage
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: In-state and interstate moves follow different rules and pricing.
- id: q2_size
  text: How much are you moving?
  options:
  - A few items
  - Studio or 1 bedroom
  - 2-3 bedrooms
  - 4+ bedrooms
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Home size sets crew size and truck time.
- id: q3_service
  text: What help do you need?
  options:
  - Full service with truck
  - Labor only (I have a truck/container)
  - Packing too
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Labor-only, full service and packing are priced very differently.
- id: q4_heavy
  text: Any very heavy items?
  options:
  - Piano
  - Gun safe
  - Pool table
  - None
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Pianos and safes need special equipment and extra crew.
- id: q5_access
  text: Stairs or long walks at either end?
  options:
  - No, ground level
  - Stairs
  - Long walk or tight access
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Stairs and long carries add time.
