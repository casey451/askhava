emergency_signals:
- id: es_moving_1
  signal: Crew member or helper with signs of heat stroke
  emergency: 'yes'
  safety_step: 'Heat stroke (confusion, hot skin, passing out) is an emergency: call 911 and move the person to
    a cooler place. For heat exhaustion, move to a cool place, loosen clothes, sip water.'
  source: '[S27]'
  then_route_to: none
  note: 'Routing: none (911 first)'
- id: es_moving_2
  signal: Gas smell after an appliance was unhooked
  emergency: 'yes'
  safety_step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call
    911 and UniSource at [number removed, see source].
  source: '[S23][S22]'
  then_route_to: none
  note: 'Routing: none (leave, call 911 and UES)'
- id: es_moving_3
  signal: Mover refuses to unload or demands more money to release goods
  emergency: depends
  safety_step: Under Arizona law an in-state mover that has your goods may not refuse to deliver or unload them.
    Call the AZ DPS household goods line at [number removed, see source].
  source: '[S37]'
  then_route_to: none
  note: 'Routing: none (AZ DPS or FMCSA)'
- id: es_moving_4
  signal: Routine move
  emergency: 'no'
  safety_step: Anchor TVs and furniture with anti-tip devices; reinstall range anti-tip brackets.
  source: '[T-cpsc_anchor]'
  then_route_to: moving
safety_step:
- when: Worker or homeowner shows heat illness
  step: 'Heat stroke (confusion, hot skin, passing out) is an emergency: call 911 and move the person to a cooler
    place. For heat exhaustion, move to a cool place, loosen clothes, sip water.'
  source: '[S27]'
- when: Gas smell
  step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call 911
    and UniSource at [number removed, see source].
  source: '[S23][S22]'
- when: In-state mover holding goods or adding fees
  step: Under Arizona law an in-state mover that has your goods may not refuse to deliver or unload them. Call the
    AZ DPS household goods line at [number removed, see source].
  source: '[S37]'
- when: Setting up furniture and TVs in the new home
  step: Anchor TVs and furniture with anti-tip devices; reinstall range anti-tip brackets.
  source: '[T-cpsc_anchor]'
license_classes:
- job_type:
  - local_move
  - labor_only
  - heavy_item
  - in_home
  classes:
  - none
  citation: '[S36]; [S37]'
  other_agency: Arizona Corporation Commission registration; AZ DPS HHG enforcement [S36]
  notes: 'No Arizona state mover license for in-state moves. AZ DPS says to check the mover is registered with the
    Arizona Corporation Commission. Consumer protections: A.R.S. 44-1612 to 44-1615.'
- job_type:
  - interstate_move
  classes:
  - none
  citation: '[T-fmcsa]'
  other_agency: FMCSA ([number removed, see source])
  notes: Interstate movers must be registered with FMCSA and have a USDOT number. Default 'released value' coverage
    is $0.60 per pound per item unless you choose full value protection.
- job_type:
  - disconnect_route
  classes:
  - R-37
  - R-63
  - R-11
  citation: A.R.S. 32-1121(D)(2) [S4]; A.A.C. R4-9-103 [S2] R-37, R-63, R-11
  other_agency: none
  notes: 'Gas appliance disconnect/reconnect: a licensed contractor with gas piping in scope (R-37 includes gas
    piping; R-63 excludes gas lines); never handyman work. New dryer outlet: R-11.'
handyman_ok:
  allowed_examples:
  - Moving labor is not construction
  not_allowed_examples:
  - Gas appliance disconnect or reconnect
  - Hardwired appliance disconnects
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'Havasu to California, Nevada or Utah is an interstate move: FMCSA rules apply. Source: [T-fmcsa].'
- 'AZ DPS consumer line [number removed, see source]; DPS sends interstate complaints to FMCSA. Source: [S36].'
- 'Summer afternoons in Havasu often pass 110°F; crews often start at dawn [judgment]. Source for heat safety: [S27].'
- Many winter visitors move in fall and out in spring, so those are busy seasons [judgment].
