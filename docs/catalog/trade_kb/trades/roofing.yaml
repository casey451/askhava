questions:
- id: q1_roof_type
  text: What kind of roof is it?
  options:
  - Tile (clay or concrete)
  - Flat foam or coated
  - Shingle
  - Metal
  - Mobile/manufactured home roof
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Tile, foam and shingle are different crews, materials and methods.
- id: q2_scope
  text: What do you need?
  options:
  - Fix one spot
  - Several spots
  - Whole roof redone
  - Just a check-up
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: A patch, an underlayment job and a full reroof are very different jobs.
- id: q3_roof_size
  text: About how big is the home?
  options:
  - Under 1,500 sq ft
  - 1,500-2,500 sq ft
  - Over 2,500 sq ft
  - Not sure
  ask_if: scope in [Whole roof redone, Several spots]
  changes_price: 'yes'
  why: Roof area drives material and labor in every quote.
- id: q4_stories
  text: How many stories?
  options:
  - 1 story
  - 2 stories
  - Higher or steep roof
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Two-story and steep roofs need more safety setup and time. [judgment]
- id: q5_leaking_now
  text: Is water coming in right now?
  options:
  - Yes, dripping now
  - Only when it rains
  - Old stain, not wet now
  - No leak
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: An active leak changes urgency and may need a tarp visit first.
- id: q6_roof_age
  text: About how old is the roof?
  options:
  - Under 10 years
  - 10-20 years
  - Over 20 years
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Older underlayment under tile often fails before the tile does. [judgment]
quote_without_visit_needs:
- Roof type
- Home size and stories
- Photos of damage from the ground or a drone
- Leak location inside
- Roof age if known
site_visit_usually_needed:
- 'Almost all leaks: the wet spot inside is often not where water gets in [judgment]'
- Tile underlayment and re-roof quotes (measurements, deck condition)
- 'Foam roofs: core samples or adhesion checks before recoat [judgment]'
- Manufactured home roof-overs (permit and structure)
photos_to_request:
- id: p1
  ask: 'Inside: the stain or drip, with a wide shot of the room'
  for_job_types:
  - all
- id: p2
  ask: 'Outside from the ground: each side of the roof'
  for_job_types:
  - all
- id: p3
  ask: Close-ups of any broken tile or blistered coating if a photo can be taken safely from the ground or by drone
  for_job_types:
  - all
- id: p4
  ask: Attic view of the wet area if easy to reach
  for_job_types:
  - all
photo_cues:
- photo_id: all
  look_for:
  - 'Do not climb on the roof to take photos; tile breaks underfoot and falls are serious [judgment] (ladder safety:
    [T-osha_ladder])'
  - Zoom from the ground or a window
  - Show the roof edge, valleys and anything mounted on the roof (AC, cooler, solar)
photo_red_flags:
- flag: Sagging ceiling with water bulge
  safety_step_ref: es_roofing_1
- flag: Light coming through roof deck in the attic
  safety_step_ref: null
- flag: Sagging roof line or soft deck
  safety_step_ref: es_roofing_1
- flag: Wet insulation near light fixtures or wiring
  safety_step_ref: null
- flag: Exposed black felt between slipped tiles
  safety_step_ref: null
- flag: Foam roof with bare yellow/brown foam showing (coating worn through) [judgment]
  safety_step_ref: null
- flag: Ponding water days after rain on a flat roof
  safety_step_ref: null
- flag: Mold on ceiling
  safety_step_ref: null
emergency_signals:
- id: es_roofing_1
  signal: Ceiling sagging or bulging with water
  emergency: 'yes'
  intake_note:
  - Move people and pets out of the room and stay out from under it. [judgment]
  safety_step: Stay away from the wet area. If you can reach the breaker without standing in water, turn that area
    off; otherwise call 911 or UniSource.
  source: '[S29]'
  then_route_to: roofing
- id: es_roofing_2
  signal: Water dripping near light fixtures, outlets or the electrical panel
  emergency: 'yes'
  safety_step: Stay away from the wet area. If you can reach the breaker without standing in water, turn that area
    off; otherwise call 911 or UniSource.
  source: '[S29]'
  then_route_to: electrical
- id: es_roofing_3
  signal: Tree or large debris on the roof after a storm
  emergency: 'yes'
  safety_step: No official step on file for this signal. If anyone is hurt or in danger, call 911. [judgment]
  source: '[judgment]'
  then_route_to: roofing
- id: es_roofing_4
  signal: Downed power line on or near the house
  emergency: 'yes'
  safety_step: Stay far away and call 911 and UniSource.
  source: '[S25]'
  then_route_to: none
  note: 'Routing: none (911 / UES first)'
- id: es_roofing_5
  signal: Active drip into a bucket, ceiling firm
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: Dry wet materials within 24-48 hours to limit mold.
  source: '[T-epa_mold]'
  then_route_to: roofing
- id: es_roofing_6
  signal: Old dry stain, no current rain
  emergency: 'no'
  safety_step: Dry wet materials within 24-48 hours to limit mold.
  source: '[T-epa_mold]'
  then_route_to: roofing
safety_step:
- when: Water near lights, outlets or panel
  step: Stay away from the wet area. If you can reach the breaker without standing in water, turn that area off;
    otherwise call 911 or UniSource.
  source: '[S29]'
- when: Downed power line
  step: Stay far away and call 911 and UniSource.
  source: '[S25]'
- when: Thunderstorm/monsoon
  step: Do not go on the roof or a ladder during a storm. When thunder roars, go indoors.
  source: '[T-nws_lightning]'
- when: Ladder use
  step: Keep 3 points of contact, extend ladder 3 ft above the roof edge, set on firm level ground.
  source: '[T-osha_ladder]'
- when: Wet drywall/insulation
  step: Dry wet materials within 24-48 hours to limit mold.
  source: '[T-epa_mold]'
intake_notes_judgment:
- 'Sagging wet ceiling: Move people and pets out of the room and stay out from under it. [judgment]'
license_classes:
- job_type:
  - tile_repair
  - tile_underlayment
  - foam_coating
  - shingle_repair
  - reroof
  - leak_repair
  - storm_damage
  - flashing_skylight
  classes:
  - R-42
  - CR-42
  - B
  citation: A.A.C. R4-9-103 [S2] R-42; R4-9-104 [S3] CR-42; R4-9-102 [S1] C-42
  other_agency: none
  notes: ROC R-42 Roofing (residential), CR-42 (dual) or B General Residential. R-42 covers tile, shingles, shakes,
    slate, metal, urethane foam and coatings on or above the deck; may replace up to 10% of substrate found after
    contract; may install skylights without framing change; may replace up to 24 linear feet of fascia; may lift
    HVAC units but duct changes need a sub.
- job_type:
  - flashing_skylight
  classes:
  - R-45
  citation: A.A.C. R4-9-103 [S2] R-45
  other_agency: none
  notes: Sheet metal gutters, flashings and metal roofing also fit ROC R-45 Sheet Metal.
- job_type:
  - manufactured_home_roof
  classes:
  - R-42
  - I-10C
  - I-10D
  citation: A.R.S. 41-4047; A.R.S. 41-4048(C); ADOH licensing page; A.A.C. R4-9-103 [S2] (R- residential classes)
  other_agency: none
  notes: 'Coating or repairing the existing roof covering: ROC R-42 [judgment on scope]. A roof-over/added roof
    structure or anything that alters the home: AZ Dept. of Housing licensed installer (I-10C General or I-10D Accessory
    Structures) and a permit. Pre-June 15, 1976 mobile homes have extra rehabilitation rules.'
- job_type:
  - reroof
  classes:
  - none
  citation: LHC Building Permits page [S17]; LHC Ord. 25-1370 IRC R105.2
  other_agency: none
  notes: 'LHC: replacing roof covering needs no permit; replacing roof sheathing does. 2024 IRC R105.2 as amended
    lets in-kind reroofing skip a permit when sheathing removed/replaced is 25% or less of roof area.'
handyman_ok:
  allowed_examples:
  - Clearing debris off a low roof [judgment]
  - Resetting one or two slipped tiles is roofing work; most homeowners should still route to R-42 [judgment]
  not_allowed_examples:
  - Re-roofs, underlayment, foam recoats (well over $1,000)
  - Anything needing a sheathing permit
  - Manufactured home roof-overs
  - Work tied to a rooftop gas pack or gas heater
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
  note: Roofing rarely fits the exemption; route to R-42/CR-42/B.
local_notes:
- 'Monsoon season runs June 15-Sept 30; demand spikes after storms and quote times stretch [judgment]. Source for
  season: [T-az_monsoon].'
- 'Tile roofs: TRI says underlayment is the secondary barrier and should be checked before tile is relaid; do not
  relay tile over damaged underlayment. Source: [T-tri_storm].'
- Older 30-lb felt under tile in Mohave County heat is often brittle after about 15-25 years; synthetic and modified
  underlayments are common upgrades [judgment].
- 'SPF roofs: inspect twice a year and after storms; recoat on a cycle that depends on the coating (about 10-20
  years); do not mix silicone over acrylic without the coating maker''s OK. Source: [T-ibhs_spf].'
- Rooftop evaporative coolers and AC units are common leak points at curbs and lines [judgment].
- Many Havasu homes have rooftop solar; panel removal/reinstall may be needed for roof work and is electrical work
  (R-11/solar) [judgment].
- Summer roof surfaces get extremely hot; pros work early mornings [judgment].
sample_card: 'REQ-0187 | Roofing | Lake Havasu City, south side

  Concrete tile roof, 1 story, about 1,800 sq ft, roof age 20+ years. Stain in hallway ceiling after monsoon rain,
  not dripping now.

  Wants leak repair quote; open to underlayment options. 4 photos from ground and inside.

  '
