# Ask Hava trade knowledge file: roofing
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: roofing
display_name: Roofing
summary: Roof leaks, repairs, re-roofs and coatings. Lake Havasu roofs are mostly concrete or clay tile on pitched
  roofs, spray polyurethane foam (SPF) or elastomeric coatings on flat/low-slope roofs, some asphalt shingle, and
  metal or coated roofs on manufactured homes. On tile roofs the tile sheds most water and the underlayment underneath
  is the real waterproof layer (Tile Roofing Institute). In desert sun and heat, older felt underlayment often dries
  out and cracks long before the tile wears out [judgment]. Monsoon storms (June 15-Sept 30) bring wind-lifted tile,
  blown-off shingles and flat-roof ponding. Roofing work needs ROC R-42 (or CR-42, or a B general). Ask Hava does
  not diagnose a leak or say what a roof needs; it captures roof type, leak facts and photos.
