# from a cited source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: trash_can_cleaning
display_name: Trash-can cleaning
summary: >
  Washing and deodorizing the trash and recycling carts that sit at the curb, on a monthly or every-three-months
  plan or as a one-time wash. Some businesses also wash extra bins, HOA or business dumpsters, and the pad where
  bins are kept. Cleaning only: Republic Services collects the trash in Lake Havasu City and owns the carts.
  Most washers come on the home's trash pickup day, after the truck empties the bins, so the pickup day goes on
  the card. Ask Hava collects bin count, how often, condition and pickup day, then sends an anonymous job card.
