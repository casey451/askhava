questions:
- id: q1_bins
  text: How many bins?
  options:
  - '1'
  - '2'
  - 3 or more
  - Dumpster (HOA or business)
  ask_if: always
  changes_price: 'yes'
  why: Most bin washers quote per bin, so the count sets the price. [judgment]
- id: q2_how_often
  text: How often?
  options:
  - Once
  - Monthly
  - Every three months
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Businesses often offer monthly, every-three-months and one-time plans at different per-wash rates. [T-bin_news][judgment]
- id: q3_condition
  text: How are the bins right now?
  options:
  - Normal use
  - Strong smell
  - Maggots or flies
  - Not cleaned in a long time
  - Not sure
  ask_if: job_type in [recurring_wash, one_time_wash, extra_bins_commercial, bin_area_wash]
  changes_price: 'yes'
  why: A first wash on a very dirty bin can take longer than a plan wash. [judgment]
- id: q4_dumpster
  text: What size dumpster?
  options:
  - Small (2 to 3 yards)
  - Large (4 yards or more)
  - More than one
  - Not sure
  ask_if: job_type == extra_bins_commercial or q1_bins == "Dumpster (HOA or business)"
  changes_price: 'yes'
  why: Dumpsters take more water, time and truck space than home carts. [judgment]
- id: q5_pickup_day
  text: What is your trash pickup day?
  options:
  - Monday
  - Tuesday
  - Wednesday
  - Thursday
  - Friday
  - Not sure
  ask_if: always
  changes_price: 'no'
  why: Washers plan routes around pickup day so the bins are empty. Homeowners can look up their day on the city's trash
    page. [T-lhc_trash][T-bin_news]
- id: q6_curb_access
  text: Can the bins stay at the curb after pickup on wash day?
  options:
  - 'Yes'
  - No, someone brings them in
  - Vacation rental or second home
  - Not sure
  ask_if: job_type in [recurring_wash, one_time_wash, deodorize_only, bin_area_wash]
  changes_price: 'no'
  why: The washer needs the bins where the truck can reach them after pickup. [judgment]
quote_without_visit_needs:
- Number of bins, or dumpster size [judgment]
- One-time, monthly or every three months [judgment]
- Trash pickup day [T-lhc_trash][judgment]
- Bin condition (smell, maggots, long time since last wash) [judgment]
- Whether the bins can stay at the curb after pickup [judgment]
site_visit_usually_needed:
- HOA or business dumpsters with locked enclosures or tight access [judgment]
- Bin pad or enclosure wash with heavy stains [judgment]
photos_to_request:
- id: p1_bins_curb
  ask: A photo of the bins together, lids closed, where they sit on pickup day.
  for_job_types:
  - recurring_wash
  - one_time_wash
  - extra_bins_commercial
  - deodorize_only
- id: p2_inside_bin
  ask: A photo looking inside one bin after it has been emptied.
  for_job_types:
  - recurring_wash
  - one_time_wash
  - deodorize_only
- id: p3_dumpster
  ask: A photo of the dumpster and the space around it.
  for_job_types:
  - extra_bins_commercial
- id: p4_bin_area
  ask: A photo of the spot where the bins are kept between pickups.
  for_job_types:
  - bin_area_wash
  - one_time_wash
  - recurring_wash
photo_cues:
- photo_id: p1_bins_curb
  look_for:
  - Number of bins and lid colors
  - Room for a truck to park near the curb
  - Cracked lids or missing wheels
  neutral_wording_example: Photo shows 2 carts at the curb, one with a cracked lid.
- photo_id: p2_inside_bin
  look_for:
  - Residue at the bottom
  - Visible maggots or flies
  - Stuck-on bags or liquid
  neutral_wording_example: Photo shows dark residue at the bottom of the cart and some flies.
- photo_id: p3_dumpster
  look_for:
  - Dumpster size label
  - Gate, lock or enclosure walls
  - Drain or wash nearby
  neutral_wording_example: Photo shows one dumpster inside a block enclosure with a metal gate.
- photo_id: p4_bin_area
  look_for:
  - Surface (concrete, pavers, gravel)
  - Stains on the pad or walls
  - Distance from the street
  neutral_wording_example: Photo shows a concrete pad beside the garage with dark stains.
photo_red_flags:
- flag: Smoke or flames from a bin or dumpster
  safety_step_ref: es_trash_can_cleaning_1
- flag: Cracked or broken cart body (carts belong to Republic Services; cart questions go to the hauler)
  safety_step_ref: null
- flag: Needles, sharp objects or loose chemicals in the bin
  safety_step_ref: null
emergency_signals:
- id: es_trash_can_cleaning_1
  signal: Smoke or fire in a bin or dumpster
  emergency: 'yes'
  safety_step: Not used by the app. Ask Hava sends only the fixed INT-004 911 text for smoke or fire. [judgment]
  source: INT-004 (D-436)
  then_route_to: none
  note: 'Routing: none until the 911 text is sent and the homeowner says they are safe.'
- id: es_trash_can_cleaning_2
  signal: Smelly bin, maggots or flies
  emergency: 'no'
  safety_step: No safety step. Not an emergency. [judgment]
  source: '[judgment]'
  then_route_to: trash_can_cleaning
safety_step:
- when: Smoke or fire in a bin or dumpster
  step: Ask Hava sends only the fixed INT-004 911 text. No other safety wording is used. [judgment]
  source: INT-004 (D-436)
license_classes:
- job_type:
  - recurring_wash
  - one_time_wash
  - extra_bins_commercial
  - deodorize_only
  - bin_area_wash
  work: Bin, dumpster and bin pad washing
  classes:
  - none
  citation: foundation az_license_master section 5 (cleaning trades, no ROC class) [judgment]
  other_agency: Lake Havasu City storm water rules (City Code Ch. 8.28) cover what reaches storm drains and washes
    [T-lhc_storm]. City business and transaction privilege tax licensing may apply [judgment; not verified].
  notes: No ROC license applies to washing bins; it is not construction [judgment]. Wash water handling is the
    business's own matter; the city defines an illicit discharge as any discharge to the storm system that is not
    entirely stormwater [T-lhc_storm].
handyman_ok:
  allowed_examples:
  - Bin washing is not construction, so the handyman rule does not come into play [judgment]
  not_allowed_examples:
  - Building or rebuilding a block bin enclosure that needs a permit [judgment]
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000; the work is casual or minor; no local building permit is
    needed; it is not part of a larger job and not split into small contracts to dodge the limit; and any ad says
    ''not a licensed contractor''. Never covers work connected to natural gas, propane or other fuel gas, or
    hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
  note: The catalog does not send these cards to handyman businesses (categories.yaml handyman_allowed false).
local_notes:
- 'Republic Services provides refuse and recycling service in Lake Havasu City. Carts stay with the home and remain
  the property of Republic Services; residents should not paint or deface them. Source: [T-lhc_trash].'
- 'Residents find their pickup day with the city''s online "Find your day of trash pickup" map. Source: [T-lhc_trash].'
- 'Carts go out the night before pickup, within 3 feet of the street (not in it) with 4 feet of clearance. Collection
  runs 5 am to 6 pm, so a washer may not know the exact time the truck comes. Source: [T-lhc_trash]; timing note
  [judgment].'
- 'No pickup on Thanksgiving, Christmas or New Year''s Day; collection moves one day later after those holidays, so a
  wash day may move too. Source: [T-lhc_trash]; wash-day note [judgment].'
- 'A 2021 news report said the city is split into five zones, one per weekday, from the south side on Monday to the
  north side on Friday, and that about 6,700 homes got a new day that year. Routes may have changed since. Source:
  [T-lhc_routes].'
- 'Residents can get an extra trash or recycling cart for a monthly fee, so 3 or more carts is common. Source:
  [T-lhc_trash]; "common" is [judgment].'
- 'Vacation rentals: trash stays in proper containers and out of public view no more than 12 hours before collection
  (City Code Ch. 5.20), so rental bins may need to go back in after a wash. Source: [T-lhc_vr]; wash note [judgment].'
- Summer heat (June to September) speeds up odor and flies in bins, so monthly plans are popular in summer [judgment].
- 'Monsoon season runs June 15 to September 30; wind and dust storms can tip bins and blow dust into them. Season
  dates: [T-nws_monsoon]; bin note [judgment].'
- 'City water is hard (about 19 grains per gallon, range 18 to 20), which can leave white spots on dark carts.
  Hardness: [LHC-CCR]; spot note [judgment].'
- Seasonal residents and vacant second homes may have no one to set bins out on wash day [judgment].
- Some HOAs have rules on where bins are kept between pickups [judgment].
- Mobile home and RV parks often use shared dumpsters rather than home carts [judgment].
- 'The city storm system includes gutters, storm drains, open channels and washes, and storm runoff flows to the lake
  untreated. Source: [T-lhc_storm].'
sample_card: |
  REQ-0187 | Trash-can cleaning | Lake Havasu City, south side
  2 carts (trash and recycling), monthly plan, pickup day Tuesday.
  Strong smell and some flies in the trash cart. Carts can stay at the curb after pickup. 2 photos.
