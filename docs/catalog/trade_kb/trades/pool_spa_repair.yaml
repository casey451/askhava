questions:
- id: equipment_area
  text: What part needs help?
  options:
  - Pump or motor
  - Filter
  - Salt system
  - Heater or heat pump
  - Leak / losing water
  - Lights or controls
  - Tile, scale or surface
  - Hot tub / spa
  - Not sure
  ask_if: always
  changes_price: 'yes'
- id: repair_or_replace
  text: Do you want it fixed or are you open to new equipment?
  options:
  - Fix it if possible
  - Open to replacing
  - Want quotes for both
  - Not sure
  ask_if: equipment_area in [Pump or motor, Filter, Salt system, Heater or heat pump]
  changes_price: 'yes'
- id: brand
  text: 'What brand is on the label? (A photo also shows the filter type: cartridge, DE or sand.)'
  options:
  - Pentair
  - Hayward
  - Jandy / Zodiac
  - Other
  - Can't tell - I'll send a photo
  ask_if: equipment_area in [Pump or motor, Filter, Salt system, Heater or heat pump, Lights or controls]
  changes_price: 'yes'
- id: heater_fuel
  text: Is the heater gas or electric?
  options:
  - Natural gas
  - Propane
  - Electric heat pump
  - Not sure
  ask_if: equipment_area == Heater or heat pump
  changes_price: 'yes'
- id: water_loss
  text: How fast is the water going down?
  options:
  - About 1/4 inch a day or less
  - About 1/2 inch a day
  - 1 inch a day or more
  - Only when the pump runs
  - Not sure
  ask_if: equipment_area == Leak / losing water
  changes_price: 'yes'
- id: surface_scope
  text: How big is the surface job?
  options:
  - Just the tile line
  - Some spots or a few tiles
  - Whole pool surface
  - Not sure
  ask_if: equipment_area == Tile, scale or surface
  changes_price: 'yes'
quote_without_visit_needs:
- Clear photo of the equipment label (brand, model, horsepower or size)
- Wide photo of the whole equipment pad
- Short video with sound if the pump is noisy or humming
- Filter pressure gauge reading
- Error code on salt system or heater display
- Pool size if known (gallons or length x width)
- Whether the pool is running now or off
site_visit_usually_needed:
- leak
- automation_electrical
- surface_tile when whole-surface
- heater (gas)
- drain_cover_safety
