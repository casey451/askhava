photo_cues:
- photo_id: all
  look_for:
  - 'White crust on tile line or salt cell plates [judgment: common with Havasu hard water]'
  - Water dripping at pump lid, union or shaft seal area
  - Rust or corrosion on heater cabinet or burner tray
  - Gauge reading for the business to compare with clean pressure
  - Display error codes (for example 'check cell', 'no flow', 'high pressure')
  - 'Cartridge vs DE vs sand: cartridge tanks have no backwash valve; DE and sand have a multiport or push-pull
    valve [judgment]'
photo_red_flags:
- flag: Burn marks, melted wire insulation or scorched breaker at the pad
  safety_step_ref: null
- flag: Exposed or wet wiring near water
  safety_step_ref: null
- flag: Cracked or missing main drain cover
  safety_step_ref: es_missing_or_broken_drain_cover_
- flag: Gas smell or scorched heater cabinet
  safety_step_ref: es_gas_smell_at_the_heater
- flag: Bonding wire cut or missing [judgment]
  safety_step_ref: null
- flag: Large crack in pool shell or deck pulling away
  safety_step_ref: null
emergency_signals:
- id: es_anyone_feels_a_tingle_or_shock
  signal: Anyone feels a tingle or shock in or near the water
  emergency: 'yes'
  safety_step: Get out of the water without using a metal ladder. If someone else is in trouble, turn off all power
    to the pool and call 911. Do not go into the water to help.
  source: CPSC, Don't Swim with Shocks (electrical safety in and around pools, hot tubs and spas) - https://www.cpsc.gov/Safety-Education/Safety-Guides/Sports-Fitness-and-Recreation/Pools-and-Spas
  then_route_to: pool_spa_repair
- id: es_breaker_sparking_smoke_or_burn
  signal: Breaker sparking, smoke or burning smell at equipment
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: pool_spa_repair
- id: es_gas_smell_at_the_heater
  signal: Gas smell at the heater
  emergency: 'yes'
  safety_step: 'Leave the area right away; do not use switches or flames. From a safe place, call 911 and UniSource
    at [number removed, see source] (propane: call your propane supplier).'
  source: 'UniSource Energy Services, Natural Gas Safety (gas emergency: leave, then call 911 and [number removed, see source])
    - https://www.uesaz.com/gas-safety/ ; Propane Education and Research Council, Safety Guide for Propane Users
    - https://propane.com/safety/safety-guide-for-propane-users/'
  then_route_to: pool_spa_repair
- id: es_missing_or_broken_drain_cover_
  signal: Missing or broken drain cover in use
  emergency: 'yes'
  safety_step: Keep everyone out of the pool or spa until the cover is fixed.
  source: CPSC, Pool and Spa Drain Covers FAQ (VGBA) - https://www.cpsc.gov/FAQ/Pool-and-Spa-Drain-Covers
  then_route_to: pool_spa_repair
- id: es_pool_water_dropping_fast_enoug
  signal: Pool water dropping fast enough to flood a yard or house
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: pool_spa_repair
- id: es_chemical_cloud_or_fumes_after_
  signal: Chemical cloud or fumes after mixing chemicals
  emergency: 'yes'
  safety_step: Move away from the fumes to fresh air. Never mix pool chemicals together, and add chemicals to water,
    never water to chemicals. If someone is sick, call Poison Help [number removed, see source] or 911.
  source: CDC, Pool Chemical Safety - https://www.cdc.gov/healthy-swimming/toolkit/pool-chemical-safety.html
  then_route_to: pool_spa_repair
safety_step:
- when: Tingle or shock in or near pool or spa
  step: Get out of the water without using a metal ladder. If someone else is in trouble, turn off all power to
    the pool and call 911. Do not go into the water to help.
  source: CPSC, Don't Swim with Shocks (electrical safety in and around pools, hot tubs and spas) - https://www.cpsc.gov/Safety-Education/Safety-Guides/Sports-Fitness-and-Recreation/Pools-and-Spas
- when: Broken, loose or missing drain cover
  step: Keep everyone out of the pool or spa until the cover is fixed.
  source: CPSC, Pool and Spa Drain Covers FAQ (VGBA) - https://www.cpsc.gov/FAQ/Pool-and-Spa-Drain-Covers
- when: Gas smell at heater
  step: 'Leave the area right away; do not use switches or flames. From a safe place, call 911 and UniSource at
    [number removed, see source] (propane: call your propane supplier).'
  source: 'UniSource Energy Services, Natural Gas Safety (gas emergency: leave, then call 911 and [number removed, see source])
    - https://www.uesaz.com/gas-safety/ ; Propane Education and Research Council, Safety Guide for Propane Users
    - https://propane.com/safety/safety-guide-for-propane-users/'
- when: Chemical fumes or mixing
  step: Move away from the fumes to fresh air. Never mix pool chemicals together, and add chemicals to water, never
    water to chemicals. If someone is sick, call Poison Help [number removed, see source] or 911.
  source: CDC, Pool Chemical Safety - https://www.cdc.gov/healthy-swimming/toolkit/pool-chemical-safety.html
