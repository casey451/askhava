# Ask Hava trade knowledge file: pool_spa_repair
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: pool_spa_repair
display_name: Pool & spa repair
summary: 'Repair of residential pool and spa equipment and surfaces: pumps and motors (Pentair, Hayward, Jandy),
  filters (cartridge, DE, sand), salt chlorine generators and salt cells, heaters and heat pumps, automation, leaks,
  lights, drain covers, and tile or surface problems. In Lake Havasu City the water is very hard (about 19 grains
  per gallon), so calcium scale on tile lines and salt cells is common. Ask Hava only gathers facts and photos and
  sends an anonymous job card; it does not figure out what is wrong or what it costs.'
job_types:
- id: pump_motor
  label: Pump or motor not running, loud, or leaking
- id: filter
  label: Filter problem (cartridge, DE or sand), high pressure, leaking tank
- id: salt_system
  label: Salt system / salt cell error, low chlorine output, scaled cell
- id: heater
  label: Gas heater or electric heat pump not heating
  site_visit_usually_needed: 'yes'
- id: leak
  label: Losing water, leak at equipment, pipe or shell
  site_visit_usually_needed: 'yes'
- id: automation_electrical
  label: Timer, automation panel, breaker trips, pool light out
  site_visit_usually_needed: 'yes'
- id: surface_tile
  label: Calcium scale on tile, rough or stained plaster, loose tile, resurfacing
  site_visit_usually_needed: 'yes'
- id: spa_hot_tub
  label: Stand-alone hot tub / spa not heating, jets, control pack
- id: drain_cover_safety
  label: Broken or missing drain cover, barrier gate or safety item
  site_visit_usually_needed: 'yes'
- id: equipment_replace
  label: Replace pump, filter or heater with new
