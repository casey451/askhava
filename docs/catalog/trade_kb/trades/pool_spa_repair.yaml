handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: 'Sometimes. A.R.S. 32-1121(A)(14): a person may do ''casual or minor'' work without an ROC license only
    if the whole job (labor, materials, everything) is under $1,000, no building permit is needed, it is not part
    of a larger job or split up to get under the limit, and their ads say ''not a licensed contractor''. Per 32-1121(D)
    the exemption never covers work that connects to natural gas, propane or other fuel gas, or hardwired/interconnected
    fire-safety devices. Lake Havasu City''s permit list decides whether a permit is needed (https://www.lhcaz.gov/development-permitting/building).
    Example [judgment]: swapping a cartridge or a pump lid o-ring under $1,000 may fit; a new variable-speed pump
    with electrical work, any gas heater work, or anything needing a permit does not. Businesses can check their
    own license at roc.az.gov.'
local_notes:
- 'Lake Havasu City water is about 19 grains per gallon hardness (range about 18-20), so calcium scale on tile and
  salt cells is common. Some areas are served by EPCOR instead, at about 6-8 grains per gallon. Sources: Lake Havasu
  City annual drinking water quality report (total hardness about 19 grains per gallon, range 18-20) - https://www.lhcaz.gov/DocumentCenter/View/3233
  ; EPCOR Water Arizona, Lake Havasu system water quality (hardness about 6-8 grains per gallon) - https://www.epcor.com/'
- Summer heat is extreme; pumps often run long hours and green pools can happen fast if a pump stops in July or
  August [judgment].
- 'Arizona pool barrier law (A.R.S. 36-1681) applies to homes with children under 6; cities may have stricter codes.
  Ask Hava does not inspect barriers. Source: A.R.S. 36-1681 Residential pool enclosure (barrier) requirements -
  https://www.azleg.gov/ars/36/01681.htm'
- Many winter visitors leave pools on timers while away; requests may come from out of town [judgment].
