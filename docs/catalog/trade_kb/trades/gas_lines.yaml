  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: connector_valve
  label: Replace a flex connector or appliance shutoff valve
  site_visit_usually_needed: sometimes
  handyman_ok: 'no'
- id: pressure_test
