license_classes:
- job_type:
  - new_gas_line
  classes:
  - R-37 Plumbing, Including Solar (includes gas piping)
  - CR-37 Plumbing (dual)
  - CR-77 Plumbing including Solar (dual)
  - R-37R Gas Piping (legacy; no new licenses)
  citation: 'R4-9-103 (R-37: ''water and gas piping systems''; includes all R-37R subclasses; R-37R Gas Piping no
    longer issued) [S2]; R4-9-104 [S3]'
  other_agency: UniSource (meter, service line up to the meter, gas turn-on) [S25]; LHC permit [S17]
  notes: Same classes for gas_leak repairs, red_tag_repair, move_cap_line, connector_valve, pressure_test and propane_conversion.
    R-63 Appliances may not install or repair gas lines [S2]. R-6 pool service excludes gas lines; R-21 hardscape
    must subcontract gas for fire pits and BBQs [S2].
- job_type:
  - gas_restore
  classes:
  - UniSource only (not a contractor)
  citation: UniSource outage page [S25]
  other_agency: UniSource [number removed, see source]
  notes: A contractor may be needed first if UniSource found a problem [judgment].
- job_type:
  - propane_conversion
  classes:
  - R-37 / CR-37 / CR-77 for piping
  citation: R4-9-103 [S2]; A.A.C. R4-9-104 [S3] (CR- dual classes)
  other_agency: Propane company (tank owner); state LP-gas rules not researched [judgment]
  notes: Appliance conversion kits may also involve the appliance maker's instructions [judgment].
handyman_ok:
  allowed_examples: []
  not_allowed_examples:
  - Any gas or propane piping, connector or appliance connection, at any price [S4]
  - Any job needing an LHC permit (gas lines) [S17]
  rule_reminder: 'A person without an ROC license may take a job only if ALL are true: total price (labor + materials
    + everything) is under $1,000; the work is casual, minor or inconsequential; no local building permit is required;
    it is not part of a larger job or split up to stay under $1,000; and any ad says ''not a licensed contractor''.
    The exemption never covers work that connects to natural gas, propane or other fuel gas, or fire-safety work
    such as hardwired/interconnected smoke alarms. Source: A.R.S. 32-1121(A)(14) and (D) [S4]. In Lake Havasu City,
    check the city permit list: a needed permit removes the exemption [S17].'
local_notes:
- UniSource Energy Services provides natural gas and electric service in Lake Havasu City; 24/7 emergency line [number removed, see source]
  [S22][UNS-GAS].
- Only UniSource field employees may turn gas service back on after a shutoff; customers must not restore meters
  or relight pilots [S25].
- 'UniSource: if you turn the gas off, you will need a professional to turn it back on [S24].'
- Arizona law requires contacting Arizona 811 at least two full working days before digging for any reason (BBQ
  lines, fire pits) [UNS-GASPAGE][AZ811].
- Outdoor BBQ islands, fire pits and pool heaters are the most common new gas line requests in Havasu [judgment].
- Some homes in outlying areas use propane tanks; the tank is often owned by the propane company [judgment; not
  researched].
- Gas lines need an LHC building permit [S17].
