- id: gas_leak
  label: Smell gas, hissing, or a suspected leak (emergency first)
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: red_tag_repair
  label: Line repair after UniSource shut off gas or red-tagged an appliance
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: new_gas_line
  label: New gas line to an appliance, BBQ, fire pit, pool heater or generator
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: move_cap_line
