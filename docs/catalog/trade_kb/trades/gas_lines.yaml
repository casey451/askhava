# Ask Hava trade knowledge file: gas_lines
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: gas_lines
display_name: Gas lines (natural gas and propane piping)
summary: 'Natural gas and propane piping inside and outside the home: new lines for a range, dryer, BBQ, fire pit,
  pool heater, generator or patio heater, gas leak repair after UniSource red-tags, moving or capping a line, gas
  pressure tests, and flex connector or shutoff valve replacement. In Arizona this is plumbing-class work: R-37
  covers ''water and gas piping systems'' [S2]. It is never handyman work, at any price [S4]. Gas lines need an
  LHC permit [S17]. Ask Hava gives the gas leak safety step first, then learns the appliance, length and access.
  It never tells anyone a line or connector is safe, never sizes pipe, and never says whether gas can be turned
  back on.'
