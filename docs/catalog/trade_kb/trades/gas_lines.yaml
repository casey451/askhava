questions:
- id: q0_safe
  text: Do you smell gas or hear hissing right now?
  options:
  - 'Yes'
  - 'No'
  ask_if: always (ask first; if Yes, give the gas leak step before anything else)
  changes_price: 'no'
  why: Safety first. [UNS-GASPAGE]
- id: q1_job
  text: What do you need?
  options:
  - New gas line to something
  - Fix a line after the gas was shut off
  - Move or cap a line
  - Replace a connector or valve
  - Pressure test
  - Propane work
  ask_if: q0_safe == 'No'
  changes_price: 'yes'
  why: New runs, repairs and tests are quoted very differently. [judgment]
- id: q2_fuel
  text: Is it natural gas from UniSource or propane from a tank?
  options:
  - Natural gas (meter)
  - Propane tank
  - Not sure
  ask_if: q0_safe == 'No'
  changes_price: 'yes'
  why: Propane systems involve the tank owner or propane company. [judgment]
- id: q3_length
  text: About how far is it from the gas meter (or tank) or the closest gas appliance to the new spot?
  options:
  - Under 15 feet
  - 15-40 feet
  - More than 40 feet
  - Not sure
  ask_if: q1_job in ['New gas line to something', 'Move or cap a line']
  changes_price: 'yes'
  why: Pipe length and trenching drive price. Arizona 811 is required before digging. [UNS-GASPAGE][judgment]
- id: q4_route
  text: Where would the line run?
  options:
  - Through the attic
  - Along an outside wall
  - Underground in the yard
  - Through a garage
  - Not sure
  ask_if: q1_job in ['New gas line to something', 'Move or cap a line']
  changes_price: 'yes'
  why: Underground vs attic changes materials and labor. [judgment]
- id: q5_tag
  text: Did UniSource leave a tag or paper? A photo of it helps (cover any account number).
  options:
  - Yes, sending a photo
  - No tag
  - Not sure
  ask_if: q1_job == 'Fix a line after the gas was shut off'
  changes_price: 'yes'
  why: The tag tells the business what UniSource found. [judgment]
quote_without_visit_needs:
- Short appliance hookup or connector swap with photos (ballpark only) [judgment]
site_visit_usually_needed:
- Leak repairs, red tags and pressure tests [judgment]
- New lines, trenching and moves (permit; Arizona 811) [S17][UNS-GASPAGE]
- Propane systems [judgment]
photos_to_request:
- id: p1_meter
  ask: A photo of the gas meter or propane tank, from a safe spot. Only if you do not smell gas.
  for_job_types:
  - new_gas_line
  - move_cap_line
  - red_tag_repair
  - propane_conversion
  - pressure_test
- id: p2_spot
  ask: A photo of where the new line would go (BBQ, fire pit, range, heater or generator spot).
  for_job_types:
  - new_gas_line
  - move_cap_line
- id: p3_connector
  ask: A photo of the gas connector and valve behind the appliance. Only if you do not smell gas. Do not move the
    appliance if it is hard to move.
  for_job_types:
  - connector_valve
- id: p4_tag
  ask: A photo of the UniSource tag or paper, with any account number covered.
  for_job_types:
  - red_tag_repair
  - gas_restore
photo_cues:
- photo_id: p3_connector
  look_for:
  - Coated stainless flex vs old uncoated brass connector [judgment]
  - Valve handle type; kinks or rust [judgment]
  neutral_wording_example: Yellow-coated flex connector behind range; quarter-turn valve visible.
- photo_id: p1_meter
  look_for:
  - Meter location vs the new spot; existing branch lines; yellow CSST tubing (bonding is a pro question) [judgment]
  neutral_wording_example: Meter on north side; black steel pipe going into the wall.
- photo_id: p2_spot
  look_for:
  - Patio, pavers or lawn between meter and spot (trench); distance [judgment]
  neutral_wording_example: BBQ island about 30 feet from meter across pavers.
- photo_id: p4_tag
  look_for:
  - Tag wording only; never interpret it [judgment]
  neutral_wording_example: Owner has a UniSource tag on the water heater.
photo_red_flags:
- flag: Person says they smell gas, or hear hissing, while taking photos
  safety_step_ref: es_gas_leak
- flag: Dug or damaged pipe in a trench or yard
  safety_step_ref: es_dig_damage
- flag: Broken or bent pipe at the meter
  safety_step_ref: es_gas_leak
emergency_signals:
- id: es_gas_leak
  signal: Natural gas smell (rotten eggs), hissing, whistling or roaring, a mist or cloud, dead patches of plants,
    bubbling water or blowing dust over a gas line
  emergency: 'yes'
  safety_step: Leave the home or area right away. Do not use a phone, light switch or anything that can make a spark
    inside. Do not smoke or light a match. If you are outside, do not start a car. Do not try to find the leak.
    From a safe place, call 911 and the UniSource 24-hour line, [number removed, see source]. Do not go back until UniSource or
    the fire department says it is safe. Only UniSource may turn gas service back on.
  source: '[UNS-GASPAGE][UNS-GAS][S22]'
  then_route_to: gas_lines
- id: es_propane
  signal: Propane smell or a propane gas detector alarm
  emergency: 'yes'
  safety_step: 'Propane industry safety guide: get everyone out of the building or area. Do not touch light switches,
    appliances or phones near the leak; no smoking or flames. Once away, call 911 or the fire department and your
    propane company. Only if it is safe, close the tank valve by turning it to the right (clockwise), unless the
    leak seems to be at the tank. Do not go back until responders or the propane company say it is safe, and never
    turn the gas back on at the tank yourself.'
  source: '[PERC-PROPANE]'
  then_route_to: gas_lines
- id: es_dig_damage
  signal: Digging hit or scraped a gas line
  emergency: 'yes'
  safety_step: 'UniSource: if digging damages or breaks a gas line, call [number removed, see source] right away, and call 911
    if there is a threat of fire or injury. Even a scratch or dent in a gas line needs to be checked by UniSource.
    Leave the home or area right away. Do not use a phone, light switch or anything that can make a spark inside.
    Do not smoke or light a match. If you are outside, do not start a car. Do not try to find the leak. From a safe
    place, call 911 and the UniSource 24-hour line, [number removed, see source]. Do not go back until UniSource or the fire department
    says it is safe. Only UniSource may turn gas service back on.'
  source: '[UNS-GASPAGE]'
  then_route_to: gas_lines
- id: es_co
  signal: CO alarm sounding, or people feel sick near a gas appliance
  emergency: 'yes'
  safety_step: If a CO alarm is sounding, do not look for the cause. Get everyone outside to fresh air right away.
    Call 911 or the fire department from outside. Count heads. Do not go back in until responders say it is safe.
    Do not use the fuel-burning appliance again until it has been checked.
  source: '[S26]'
  then_route_to: hvac
- id: es_restore
  signal: Gas was turned off (by UniSource, a shutoff, or an outage) and they want it back on
  emergency: 'no'
  safety_step: 'UniSource: after gas service is shut off, only UniSource field employees may turn it back on. Do
    not try to turn on the meter or relight pilot lights yourself. Call UniSource at [number removed, see source]. If you smell
    gas, leave and call 911 and UniSource.'
  source: '[S25][S24]'
  then_route_to: gas_lines
safety_step:
- when: Natural gas smell (rotten eggs), hissing, whistling or roaring, a mist or cloud, dead patches of plants,
