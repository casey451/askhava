# Ask Hava trade knowledge file: window_cleaning
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: window_cleaning
display_name: Window Cleaning
summary: Inside and outside window washing, screen and track cleaning, solar-screen removal and cleaning, and hard-water
  spot removal on glass. No state license applies. Havasu's hard water from sprinklers leaves mineral spots that
  regular washing may not remove; spot removal is a separate, slower service [judgment]. Ladder work near overhead
  lines follows the UES 15-foot rule.
job_types:
- id: regular_wash
  label: Window washing inside/outside
  site_visit_usually_needed: 'no'
  handyman_ok: 'yes'
- id: hard_water
  label: Hard-water spot removal
  site_visit_usually_needed: sometimes
  handyman_ok: 'yes'
- id: screens_tracks
  label: Screens, solar screens and tracks
  site_visit_usually_needed: 'no'
  handyman_ok: 'yes'
- id: high_windows
  label: High or 2-story windows
  site_visit_usually_needed: sometimes
  handyman_ok: 'yes'
- id: repair_route
  label: Broken glass or screens (route to windows_doors)
  site_visit_usually_needed: sometimes
  handyman_ok: limited
