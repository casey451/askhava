photo_cues:
- photo_id: all
  look_for:
  - Count of panes
  - Sprinkler heads aimed at glass
  - Power lines near the house
photo_red_flags:
- flag: Cracked or broken glass
  safety_step_ref: null
- flag: Overhead power line close to windows (ladder safety)
  safety_step_ref: es_window_cleaning_2
- flag: Fogged dual-pane glass (seal failure, not dirt; route to windows_doors)
  safety_step_ref: null
emergency_signals:
- id: es_window_cleaning_1
  signal: Broken glass, home can't be secured
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: No official step on file for this signal. If anyone is hurt or in danger, call 911. [judgment]
  source: '[judgment]'
  then_route_to: windows_doors
- id: es_window_cleaning_2
  signal: Downed power line near the house
  emergency: 'yes'
  safety_step: Stay far away and call 911 and UniSource.
  source: '[S25]'
  then_route_to: none
  note: 'Routing: none (911 / UES first)'
- id: es_window_cleaning_3
  signal: Routine washing
  emergency: 'no'
  safety_step: Keep 3 points of contact, set the ladder on firm level ground, and extend it 3 ft above the roof
    edge.
  source: '[T-osha_ladder]'
  then_route_to: window_cleaning
safety_step:
- when: Ladder use
  step: Keep 3 points of contact, set the ladder on firm level ground, and extend it 3 ft above the roof edge.
  source: '[T-osha_ladder]'
- when: Ladders or poles near overhead power lines
  step: Keep yourself, ladders and poles at least 15 feet from overhead power lines.
  source: '[S24]'
- when: Downed power line
  step: Stay far away and call 911 and UniSource.
  source: '[S25]'
license_classes:
- job_type:
  - regular_wash
  - hard_water
  - screens_tracks
  - high_windows
  classes:
  - none
  citation: foundation az_license_master §5 [judgment]
  other_agency: none
  notes: No state license is needed for this cleaning work [judgment, per foundation az_license_master §5]. It is
    not construction under ROC rules.
- job_type:
  - repair_route
  classes:
  - R-65
  - R-7
  citation: A.A.C. R4-9-103 [S2] R-65, R-7
  other_agency: none
  notes: 'Glass replacement: ROC R-65 Glazing; window replacement R-7.'
handyman_ok:
  allowed_examples:
  - All window washing (not construction)
  - Re-screening a few screens under $1,000
  not_allowed_examples:
  - Window replacement with a size change (permit)
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- Fogging between dual-pane glass is a failed seal; washing will not fix it [judgment].
- 'Monsoon dust storms (June 15-Sept 30) leave heavy dust on glass. Source: [T-az_monsoon].'
- Many Havasu homes have solar screens; some cleaners remove and wash them [judgment].
sample_card: 'REQ-0335 | Window cleaning | Lake Havasu City, east side

