questions:
- id: q1_count
  text: About how many windows?
  options:
  - Under 10
  - 10-20
  - 21-35
  - 36+
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Window count is how most window cleaners quote.
- id: q2_sides
  text: Inside, outside or both?
  options:
  - Outside only
  - Inside and outside
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Inside and outside roughly doubles the work. [judgment]
- id: q3_stories
  text: How many stories?
  options:
  - 1 story
  - 2 stories
  - High windows over 12 ft
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Second-story and high glass need ladders or poles and more time.
- id: q4_spots
  text: Do the windows have white hard-water spots?
  options:
  - Yes, heavy
  - Some
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Hard-water spot removal is slower than washing.
- id: q5_screens
  text: Clean screens or solar screens too?
  options:
  - Yes, regular screens
  - Yes, solar screens
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Solar screens often come off and back on, adding time.
quote_without_visit_needs:
- Window count
- Stories
- Inside/outside
- Hard-water level
- Screens
site_visit_usually_needed:
- Heavy hard-water etching (test spot first) [judgment]
- Very large or custom glass
