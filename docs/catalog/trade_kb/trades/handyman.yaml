questions:
- id: q1_scope_size
  text: How many things do you need done?
  options:
  - 1 small thing
  - 2-4 small things
  - 5 or more
  - One bigger project
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Total job size decides who can legally take it (under $1,000 for the exemption) and how businesses price
    it.
- id: q2_touches_utility
  text: Does any of it touch wiring, gas, water pipes or the AC?
  options:
  - 'No'
  - Electrical (outlets, lights, fans)
  - Gas
  - Water pipes or fixtures
  - AC or vents
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Any wiring, plumbing or gas moves the job to a licensed trade; gas is never handyman work [S4].
- id: q3_materials
  text: Do you already have the parts or items?
  options:
  - Yes, I have them
  - No, please bring them
  - Some of them
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Who buys materials changes the quote and can push the total over $1,000.
- id: q4_height_access
  text: Is any of it high up or outside?
  options:
  - No, all indoors at normal height
  - Needs a tall ladder (over 8 ft)
  - On the roof
  - Outside, ground level
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Ladders over about 10 ft or high ceilings change time and crew size. [judgment]
- id: q5_mount_surface
  text: What will it hang on?
  options:
  - Drywall
  - Tile
  - Brick or block
  - Stucco outside
  - Not sure
  ask_if: job_type == mount_hang
  changes_price: 'yes'
  why: Stucco, block, tile or drywall each need different anchors and time. [judgment]
- id: q6_home_age
  text: About when was the home built?
  options:
  - 1978 or later
  - Before 1978
  - Mobile or manufactured home
  - Not sure
  ask_if: work will sand, cut or scrape paint, drywall or ceiling texture
  changes_price: 'yes'
  why: Pre-1978 homes trigger EPA lead-safe rules for paint disturbance; older textures may hold asbestos.
quote_without_visit_needs:
- Itemized list of tasks
- Photo of each item or area
- Whether parts are on hand
- Wall surface for mounting
- Ceiling height if high work
site_visit_usually_needed:
- Long lists with unclear scope
- Anything that may turn out to need a licensed trade
- Rot, water damage or soft spots found behind a small repair
photos_to_request:
- id: p1
  ask: Each item or spot, one photo per task
  for_job_types:
  - all
- id: p2
  ask: Wide shot of the wall or room for mounting
  for_job_types:
  - all
- id: p3
  ask: Box or model label of anything being installed
  for_job_types:
  - all
photo_cues:
- photo_id: all
  look_for:
  - Tape measure in frame for holes or gaps
  - Show the wall from a step back so studs/outlets nearby are visible
  - Photograph the back/label of the TV mount or product
photo_red_flags:
- flag: Scorch marks, melted outlet or warm switch plate (electrical, route to R-11)
  safety_step_ref: es_handyman_2
- flag: Water stain or soft drywall around the 'small hole' (possible leak, route to plumbing/roofing)
  safety_step_ref: null
- flag: Popcorn ceiling or old vinyl tile to be cut or drilled (possible asbestos)
  safety_step_ref: null
- flag: Peeling paint in a pre-1978 home (possible lead)
  safety_step_ref: null
- flag: Gas line or flex connector in the photo (never handyman)
  safety_step_ref: es_handyman_1
- flag: Cracks wider than a pencil in walls or slab [judgment]
  safety_step_ref: null
emergency_signals:
- id: es_handyman_1
  signal: Smell of gas or hissing near a stove, dryer or water heater
  emergency: 'yes'
  safety_step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call
    911 and UniSource at [number removed, see source].
  source: '[S23][S22]'
  then_route_to: plumbing
- id: es_handyman_2
  signal: Sparking, burning smell, smoking outlet or switch
  emergency: 'yes'
  safety_step: If it is safe, turn off power at the breaker. If there is smoke or fire, get out and call 911.
  source: '[S29]'
  then_route_to: electrical
- id: es_handyman_3
  signal: Water actively pouring from a pipe or ceiling
  emergency: 'yes'
  safety_step: No official step on file for this signal. If anyone is hurt or in danger, call 911. [judgment]
  source: '[judgment]'
  then_route_to: plumbing
- id: es_handyman_4
  signal: TV or furniture fell or is about to tip over a child
  emergency: 'yes'
  safety_step: Keep kids away; anchor TVs and furniture with anti-tip devices.
  source: '[T-cpsc_anchor]'
  then_route_to: handyman
- id: es_handyman_5
  signal: Smoke/CO alarm sounding (not chirping)
  emergency: 'yes'
  safety_step: Get out, stay out, call 911. Go outside or to an open window or door, call 911, stay there until
    help arrives.
  source: '[T-nfpa_sounds] [T-nfpa_sounds]'
  then_route_to: none
  note: 'Routing: none (911 / fire dept first)'
- id: es_handyman_6
  signal: Single smoke alarm chirp every 30-60 seconds
  emergency: 'no'
  safety_step: That usually means a low battery; an alarm 10 years old or older should be replaced.
  source: '[T-nfpa_sounds]'
  then_route_to: handyman
safety_step:
- when: Gas smell
  step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call 911
    and UniSource at [number removed, see source].
  source: '[S23][S22]'
- when: Sparking or burning smell from an outlet or switch
  step: If it is safe, turn off power at the breaker. If there is smoke or fire, get out and call 911.
  source: '[S29]'
- when: Smoke alarm sounding
  step: Get out, stay out, call 911.
  source: '[T-nfpa_sounds]'
- when: CO alarm (4 beeps, pause, repeat)
  step: Go outside or to an open window or door, call 911, stay there until help arrives.
  source: '[T-nfpa_sounds]'
- when: Chirp every 30-60 seconds
  step: That usually means a low battery; an alarm 10 years old or older should be replaced.
  source: '[T-nfpa_sounds]'
- when: Heavy item tipping
  step: Keep kids away; anchor TVs and furniture with anti-tip devices.
  source: '[T-cpsc_anchor]'
license_classes:
- job_type:
  - mount_hang
  - furniture_assembly
  - small_drywall_patch
  - caulk_grout
  - door_drawer_adjust
  - exterior_minor
  - minor_repairs_list
  classes:
  - B-3
  - R-61
  - R-62
  citation: A.R.S. 32-1121(A)(14) [S4]; A.A.C. R4-9-103 [S2] (B-3, R-61, R-62)
  other_agency: none
  notes: No ROC license required IF every handyman-exemption condition is met; otherwise ROC B, B-3, R-61 (projects
    $50,000 or less) or R-62 (projects $5,000 or less, no structural work).
- job_type:
  - route_elsewhere
  classes:
  - R-11
  - CR-11
  citation: A.A.C. R4-9-103 [S2] R-11; LHC permit list (rewire, panel); A.A.C. R4-9-104 [S3] (CR- dual classes)
  other_agency: none
  notes: 'Outlets, switches, light fixtures, ceiling fans, new circuits: ROC R-11 Electrical (or CR-11/B with sub).'
- job_type:
  - route_elsewhere
  classes:
  - R-37
  - R-63
  citation: A.R.S. 32-1121(D)(2) [S4]; A.A.C. R4-9-103 [S2] R-37, R-63 (R-63 excludes gas lines)
  other_agency: none
  notes: 'Anything connected to natural gas or propane (gas dryer, range, water heater, fireplace, grill line):
    licensed contractor only, never the handyman exemption. Gas piping is in R-37 Plumbing; R-63 appliance installers
    may not do gas lines.'
- job_type:
  - route_elsewhere
  classes:
  - R-11
  - R-16
  citation: A.R.S. 32-1121(D)(1) [S4]; A.A.C. R4-9-103 [S2] R-16
  other_agency: none
  notes: 'Hardwired or interconnected smoke alarms, fire sprinklers: licensed contractor only (R-11 or R-16 Fire
    Protection). A single battery alarm screwed to the ceiling is not ''fire safety'' work under (D).'
- job_type:
  - route_elsewhere
  classes:
  - R-37
  citation: A.A.C. R4-9-103 [S2] R-37; LHC permit list
  other_agency: none
  notes: 'Faucets, toilets, disposals, water heaters, re-pipes: ROC R-37 Plumbing. Water heater swap in same spot
    needs no LHC permit, but gas units still fall under (D)(2).'
- job_type:
  - route_elsewhere
  classes:
  - B-3
  - R-61
  citation: LHC Building Permits page [S17]; A.R.S. 32-1121(A)(14)(a) [S4]; A.A.C. R4-9-103 [S2] (R- residential
    classes)
  other_agency: none
  notes: 'Wall removal, new walls, structural framing, patio covers: permit required in LHC, so the exemption is
    out. ROC B, B-3 or R-61.'
- job_type:
  - route_elsewhere
  classes:
  - I-10C
  - I-10D
  citation: A.R.S. 41-4047; ADOH licensing page
  other_agency: none
  notes: 'Changes to a manufactured/mobile home structure, add-on rooms, carports, awnings attached to it: AZ Dept.
    of Housing licensed installer (I-10C/I-10D) plus permit.'
handyman_ok:
  allowed_examples:
  - Hang art, shelves, mirrors, curtain rods
  - Mount a TV on a plain wall mount with no in-wall wiring
  - Assemble furniture
  - 'Patch a small drywall hole (LHC: minor patching needs no permit)'
  - Caulk, weatherstrip, door sweep
  - Adjust doors, swap cabinet hardware and hinges
  - Change a battery-only smoke alarm or battery
  - Install battery or plug-in smart lock/doorbell camera on existing wiring-free mount
  - Fix a gate latch or a few fence boards
  not_allowed_examples:
  - Any gas connection, even 'just reconnecting' a dryer or stove (32-1121(D)(2))
  - Hardwired or interconnected smoke alarms, sprinklers (32-1121(D)(1))
  - 'Any job that needs an LHC permit: wall removal, window size change, new circuits, panel work, gas lines, patio
    covers, re-pipes, added fixtures'
  - Several 'small' jobs that are really one larger project, or one project split into bills under $1,000 (32-1121(A)(14)(b))
  - A job whose total including materials is $1,000 or more
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
  gray_areas_judgment:
  - Swapping a light fixture or ceiling fan on an existing box needs no LHC permit for like-for-like, but it is
    electrical work; most pros treat it as R-11 work [judgment]
  - Replacing a faucet or toilet needs no LHC permit, but price creep past $1,000 with parts is common [judgment]
  - TV mount with in-wall power kit = electrical; route to R-11 if a new outlet is added [judgment]
  card_tag: 'Job card should show ''Handyman-size: under $1,000, no permit, no gas/electrical'' only as the homeowner''s
    description, never as Ask Hava''s ruling.'
local_notes:
- 'LHC no-permit list includes paint, floor covering, minor drywall hole patching, minor non-structural repairs
  (glass, trim, cabinets, hardware), and replacing existing plumbing fixtures. Source: [S17].'
- 'LHC permit list includes drywall work beyond patching, wall removal/install, window size changes, gas lines,
  panel change-outs and rewires, re-pipes, added or relocated fixtures, patio covers. Source: [S17].'
- Lots of part-time residents and vacation rentals in Lake Havasu; 'list of things before winter visitors arrive'
  is a common request shape [judgment].
- 'Licensed handyman-style ROC classes: R-62 Minor Home Improvements (projects $5,000 or less, no structural work)
  and R-61 (projects $50,000 or less); both must subcontract electrical, plumbing, AC and boilers. R-2 is Excavating,
  not a handyman class. CR-62 is not a dual handyman class. Source: [S2].'
- Many older Havasu homes date from the 1960s-70s; pre-1978 lead paint and popcorn ceilings are common [judgment].
  EPA RRP applies to paid work disturbing over 6 sq ft per room inside or 20 sq ft outside in pre-1978 homes.
- Summer heat over 110F makes exterior, attic and garage work slow and dangerous midday; pros often start early
  [judgment].
- Homeowners can self-check any license at the ROC contractor search. Ask Hava does not verify licenses.
sample_card: 'REQ-0142 | Handyman | Lake Havasu City, north side

  3 small tasks: hang 2 shelves on drywall, fix sticking bedroom door, recaulk tub. Homeowner has the parts.

  Indoors, normal ceiling height. Homeowner says no wiring, gas or plumbing. 3 photos attached.

  '
