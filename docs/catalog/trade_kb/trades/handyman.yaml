# Ask Hava trade knowledge file: handyman
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: handyman
display_name: Handyman
summary: 'Small, casual repairs and installs around the house: patching, hanging things, assembly, caulking, minor
  fixture swaps, door and drawer fixes. In Arizona an unlicensed handyman may legally take a job only under the
  A.R.S. 32-1121(A)(14) ''handyman exemption'': whole job under $1,000, casual or minor, no permit, not part of
  a bigger job and not split up, and ads must say ''not a licensed contractor''. Gas-connected work and hardwired/interconnected
  smoke alarms or sprinklers are never covered. Many requests that start as ''handyman'' really belong to a licensed
  trade; this file is mostly about spotting those and routing them. Ask Hava does not decide whether a job qualifies;
  it tags the card so licensed and unlicensed businesses both see the facts.'
