# Written by Claude (expert layer, Oct 29 2026), not part of the Grok delivery (D-431). AI research, not legal advice.
# Ask Hava trade knowledge file: pressure_washing. Schema: foundation/schema.yaml (v2). Items marked [judgment] are
# not from a cited source; [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, ranks or supervises work.
trade: pressure_washing
display_name: Pressure washing
summary: >-
  Pressure washing and soft washing of outdoor surfaces: driveways and garage floors, patios and pool decks, house
  walls (stucco, block, siding and eaves), roofs, fences and block walls, and private docks or boat ramps.
  Businesses quote a firm price from the surface, the size, the stains and the number of stories [judgment].
  Lake Havasu City water is hard (about 19 grains per gallon), so white or orange sprinkler marks on walls and
  concrete are common requests [judgment]. Sealing, staining or painting after a wash is not part of this category
  and goes to painting (R-34). The asphalt roofing trade group says not to use a power washer on asphalt shingle
  roofs, so roof jobs carry extra questions [T-arma_algae].
