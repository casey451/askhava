questions:
- id: q1_surface
  text: What needs washing?
  options:
  - Driveway or garage
  - Patio or pool deck
  - House walls
  - Roof
  - Wall, fence or dock
  - Several areas
  ask_if: always
  changes_price: 'yes'
  why: The surface sets the method, the equipment and the time. [judgment]
- id: q2_area_size
  text: About how big is the area?
  options:
  - Small (1 car or less)
  - Medium (2 to 3 cars)
  - Large (more than 3 cars)
  - Not sure
  ask_if: q1_surface in ['Driveway or garage', 'Patio or pool deck', 'Wall, fence or dock', 'Several areas']
  changes_price: 'yes'
  why: Flat work is quoted by area, and car-size bands are easy to picture. [judgment]
- id: q3_home_size
  text: About how big is the home?
  options:
  - Under 1,500 sq ft
  - 1,500 to 2,500 sq ft
  - Over 2,500 sq ft
  - Not sure
  ask_if: q1_surface in ['House walls', 'Roof', 'Several areas']
  changes_price: 'yes'
  why: House and roof washes are quoted by the size of the home. [judgment]
- id: q4_stories
  text: How many stories?
  options:
  - '1'
  - 2 or more
  - Not sure
  ask_if: q1_surface in ['House walls', 'Roof', 'Several areas']
  changes_price: 'yes'
  why: Second stories and roofs need ladders, poles or more hose and more time. [judgment]
- id: q5_stains
  text: Any stains that need extra work?
  options:
  - Oil or grease
  - Orange or white sprinkler marks
  - Rust
  - Green or black growth
  - No, just dirt
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Stain treatment is often a separate step or add-on in a quote. [judgment]
- id: q6_material
  text: What is the surface made of?
  options:
  - Plain concrete
  - Pavers or stone
  - Painted or coated concrete
  - Stucco or block
  - Wood or composite
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Coated, painted and wood surfaces take lower pressure and more care. [judgment]
- id: q7_water
  text: Is there a working outdoor faucet the business can use?
  options:
  - 'Yes'
  - No, the water is off or the home is empty
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: With no water on site, the business brings its own, which can add to the quote. [judgment]
quote_without_visit_needs:
- Which surfaces, and roughly how big (car-size bands or home size) [judgment]
- Number of stories for house and roof washes [judgment]
- Surface material (plain concrete, pavers, coated, stucco, wood) [judgment]
- Stain types (oil, sprinkler marks, rust, green or black growth) [judgment]
- Whether an outdoor faucet works [judgment]
- A wide photo of each area and a close photo of the worst stain [judgment]
site_visit_usually_needed:
- Roof washes, where the business may want to see the roof type and access first [judgment]
- Very large lots, long driveways or several areas at once [judgment]
- Docks or ramps that are hard to reach from land [judgment]
- Older paint or coatings that may lift during a wash [judgment]
photos_to_request:
- id: p1_whole_area
  ask: A wide photo of the whole area you want washed.
  for_job_types:
  - all
- id: p2_worst_stain
  ask: A close photo of the worst stain or mark.
  for_job_types:
  - driveway_garage
  - patio_pool_deck
  - house_wash
  - fence_wall
  - dock_ramp
- id: p3_house_front
  ask: A photo of the front of the house from the street, showing the whole height.
  for_job_types:
  - house_wash
  - roof_wash
- id: p4_roof
  ask: A photo of the roof from the ground or a window, if you can do it safely from where you stand.
  for_job_types:
  - roof_wash
- id: p5_faucet
  ask: A photo of the outdoor faucet nearest the area.
  for_job_types:
  - all
photo_cues:
- photo_id: p1_whole_area
  look_for:
  - Size of the area (car spaces, length of wall)
  - Surface type (plain concrete, pavers, coated or painted)
  - Plants, pool or open water next to the area
  - Street gutter or drain near the area
  neutral_wording_example: Two-car driveway, plain concrete, street gutter at the bottom edge.
- photo_id: p2_worst_stain
  look_for:
  - Stain color and size (dark, orange, white, green or black)
  - Whether the stain is on bare concrete, coating or paint
  neutral_wording_example: Dark stain about 3 ft wide in the center of the garage floor.
- photo_id: p3_house_front
  look_for:
  - Number of stories
  - Wall material (stucco, block, siding)
  - Eaves and overhangs
  - Power lines near the house
  neutral_wording_example: Single-story stucco home, tile roof, service line at the left corner.
- photo_id: p4_roof
  look_for:
  - Roof type (tile, shingle, foam, metal)
  - Pitch and height
  - Visible broken or missing pieces
  neutral_wording_example: Concrete tile roof, low pitch, dark streaks on the north side.
- photo_id: p5_faucet
  look_for:
  - Faucet location and distance to the area
  - Faucet handle present
  neutral_wording_example: Hose faucet on the garage wall, about 20 ft from the driveway.
photo_red_flags:
- flag: Power line down on the ground or across the yard
  safety_step_ref: es_pressure_washing_1
- flag: Overhead service line close to walls or roof edge
  safety_step_ref: null
- flag: Cracked, lifted or sunken concrete or pavers (repair goes to pavers_concrete)
  safety_step_ref: null
- flag: Broken, slipped or missing roof tiles (repair goes to roofing)
  safety_step_ref: null
- flag: Peeling or flaking paint on walls or a coated floor
  safety_step_ref: null
- flag: Soft, split or missing boards on a dock or fence (repair goes to boat_dock or handyman)
  safety_step_ref: null
emergency_signals:
- id: es_pressure_washing_1
  signal: Downed power line near the house, yard or dock
  emergency: 'yes'
  safety_step: Stay away from downed power lines. Never touch them. If you see a downed line or other damaged equipment,
    call 911 right away.
  source: '[S25]'
  then_route_to: none
  note: The app uses its one fixed 911 text for a downed power line (D-436). No card until everyone is safe. [judgment]
- id: es_pressure_washing_2
  signal: Routine washing request
  emergency: 'no'
  safety_step: No special safety step; normal job card.
  source: none
  then_route_to: pressure_washing
safety_step:
- when: Downed power line
  step: Stay away from downed power lines. Never touch them. If you see a downed line or other damaged equipment, call
    911 right away.
  source: '[S25]'
intake_notes_judgment:
- One message often names two or three areas; "Several areas" plus one photo per area keeps the card clear. [judgment]
- Sealing, staining or painting after a wash is a separate painting card (catalog refused list). [judgment]
- Washing a boat goes to boat_dock (detailing); washing solar panels goes to gutter_solar_cleaning. [judgment]
license_classes:
- job_type:
  - driveway_garage
  - patio_pool_deck
  - house_wash
  - fence_wall
  - dock_ramp
  work: Washing outdoor surfaces
  classes:
  - none
  citation: foundation az_license_master section 5 (cleaning trades) [judgment]; A.A.C. R4-9-103 [S2]
  other_agency: City business and transaction privilege tax licensing may apply [judgment; not checked on lhcaz.gov]
  notes: No ROC class was found for washing; cleaning is not listed in the R4-9-103 scopes [judgment]. Whether
    a for-hire soft wash that uses a registered algaecide or mildewcide counts as pest management under the AZ
    Dept of Agriculture (A.R.S. 3-3615 business license) is an [open question] [S9].
- job_type:
  - roof_wash
  work: Roof washing
  classes:
  - none for washing [judgment]
  - R-42 Roofing for repair, coatings or tile work
  citation: A.A.C. R4-9-103 [S2] (R-42 scope includes "roof insulation or coatings on or above the roof deck")
  other_agency: none found
  notes: '[open question] R-42 covers roof coatings and repair, not cleaning. A wash-only roof job reads as no ROC
    class [judgment], but a roof wash sold together with a coating or tile repair is R-42 work. The asphalt roofing
    trade group says not to use a power washer on asphalt shingle roofs [T-arma_algae]. Broken tiles go to roofing.'
- job_type:
  - seal_paint_route
  work: Sealing, staining, coating or painting
  classes:
  - R-34 Painting and Wall Covering
  - CR-34 (dual)
  citation: A.A.C. R4-9-103 [S2] (R-34 scope includes "liquid floor and wall coatings"); R4-9-104 [S3]
  other_agency: none
  notes: Catalog routes sealing or painting to painting as R-34 work (categories.yaml, pressure_washing refused list).
    Concrete coatings also appear under R-8 [S2]. Concrete repair goes to pavers_concrete (R-9, R-21).
handyman_ok:
  allowed_examples:
  - Washing a driveway, patio, house, wall, fence or dock (cleaning, not construction) [judgment]
  not_allowed_examples:
  - Roof coating sold with a roof wash (R-42) [judgment]
  - Sealing or painting jobs over $1,000 or tied to a larger job (R-34) [S4]
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting labor,
    materials and everything else, is under $1,000; the work is casual or minor; no local building permit is needed;
    it is not part of a larger job and not split into small contracts to dodge the limit; and any ad says ''not a
    licensed contractor''. Never covers work connected to natural gas, propane or other fuel gas, or hardwired or
    interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
  note: The catalog sets handyman_allowed false and construction_type false for this category, so the $1,000 handyman
    limit does not apply to washing jobs here. Ask Hava never tells a homeowner a business is licensed. [judgment]
local_notes:
- 'Hard water: about 19 grains per gallon (range 18 to 20), and white or orange marks where sprinklers hit
  stucco, block and concrete are common requests [judgment]. Source: Lake Havasu City 2025 Annual Drinking Water Quality Report
  [T-lhc_water_quality].'
- 'Lake Havasu City storm drains, gutters and washes carry water to Lake Havasu untreated, and the city treats any
  discharge to that system that is not made up entirely of stormwater as an illicit discharge. Businesses may ask
  where wash water will go. Source: [T-lhc_stormwater]; wash-water practice: [T-sd_powerwash].'
- Heat June to September; many businesses work early in the morning, and some jobs move to cooler months. [judgment]
- Monsoon July to September brings dust and mud on walls, patios and pool decks; post-storm washes are common. [judgment]
- Some HOAs set rules for wall and house colors; a wash needs no HOA approval in most cases, but a paint or stain
  change may. [judgment]
- Seasonal residents and vacant second homes may have the water shut off; q7_water and photos let a business quote
  while the owner is away. [judgment]
- Many manufactured homes have metal or vinyl siding and skirting; businesses may ask about siding type. [judgment]
- Lakefront homes may have private docks and ramps; boat washing goes to boat_dock, and dock repair goes to boat_dock.
  [judgment]
- Cool-deck style coated pool decks are common around Havasu pools; q6_material flags coated surfaces. [judgment]
sample_card: 'REQ-0142 | Pressure washing | Lake Havasu City, south side

  Driveway and garage floor, 2 to 3 car size, plain concrete. Oil stain in garage, orange sprinkler marks along the
  edge.

  Outdoor faucet works. 3 photos.

  '
