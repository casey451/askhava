photo_red_flags:
- flag: Gas flex line kinked or old uncoated brass connector [judgment]
  safety_step_ref: es_appliance_repair_1
- flag: Scorch marks on cord or outlet
  safety_step_ref: es_appliance_repair_2
- flag: Crushed or plastic-foil dryer vent
  safety_step_ref: null
- flag: Range not anchored (no anti-tip bracket)
  safety_step_ref: null
- flag: Water pooling under dishwasher or fridge
  safety_step_ref: null
emergency_signals:
- id: es_appliance_repair_1
  signal: Gas smell near range or dryer
  emergency: 'yes'
  safety_step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call
    911 and UniSource at [number removed, see source].
  source: '[S23][S22]'
  then_route_to: none
  note: 'Routing: none (leave, call 911 and UES)'
- id: es_appliance_repair_2
  signal: Smoke, burning smell or sparks
  emergency: 'yes'
  safety_step: Unplug or shut off the breaker only if safe. If there is fire, get out and call 911.
  source: '[S29]'
  then_route_to: appliance_repair
- id: es_appliance_repair_3
  signal: CO alarm sounding
  emergency: 'yes'
  safety_step: Go outside, call 911, stay outside.
  source: '[T-nfpa_sounds]'
  then_route_to: hvac
- id: es_appliance_repair_4
  signal: Water leaking onto floor, can't stop it
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  intake_note:
  - Turn off the water valve behind the appliance if you can reach it safely [judgment].
  safety_step: No official step on file for this signal. If anyone is hurt or in danger, call 911. [judgment]
  source: '[judgment]'
  then_route_to: plumbing
- id: es_appliance_repair_5
  signal: Fridge not cooling with food inside
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: No official step on file for this signal. If anyone is hurt or in danger, call 911. [judgment]
  source: '[judgment]'
  then_route_to: appliance_repair
- id: es_appliance_repair_6
  signal: Noise, slow cycles
  emergency: 'no'
  safety_step: Clean the lint filter every load; failure to clean is the leading cause of dryer fires. Use metal
    vent duct and have the vent checked.
  source: '[T-usfa_dryer]'
  then_route_to: appliance_repair
safety_step:
- when: Gas smell
  step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call 911
    and UniSource at [number removed, see source].
  source: '[S23][S22]'
- when: CO alarm (4 beeps, pause, repeat)
  step: Go outside, call 911, stay outside.
  source: '[T-nfpa_sounds]'
- when: Smoke or sparking
  step: Unplug or shut off the breaker only if safe. If there is fire, get out and call 911.
  source: '[S29]'
- when: Dryer
  step: Clean the lint filter every load; failure to clean is the leading cause of dryer fires. Use metal vent duct
    and have the vent checked.
  source: '[T-usfa_dryer]'
- when: Range
  step: Every range should have an anti-tip bracket installed so it cannot tip onto a child.
  source: '[T-cpsc_range]'
intake_notes_judgment:
- 'Leak: Turn off the water valve behind the appliance if you can reach it safely [judgment].'
license_classes:
- job_type:
  - fridge
  - washer
  - dryer
  - dishwasher
  - range_oven
  - microwave
  - appliance_install
  classes:
  - R-63
  - CR-63
  citation: A.A.C. R4-9-103 [S2] R-63; R4-9-104 [S3] CR-63
  other_agency: none
  notes: ROC R-63 Appliances (install and repair, but not gas, electrical or plumbing lines) or CR-63. Whether a
    repair-only service visit on an existing appliance needs an ROC license is [unverified]. Plug-in appliances
    sold as-is are left out of the $1,000 handyman total (32-1121(A)(14)). Gas appliance connections are never handyman
    work.
- job_type:
  - range_oven
  - dryer
  - appliance_install
  classes:
  - R-37
  citation: A.R.S. 32-1121(D)(2) [S4]; A.A.C. R4-9-103 [S2] (R- residential classes)
  other_agency: none
  notes: 'Gas connection: licensed contractor only; handyman exemption never applies. Gas piping: R-37 or equivalent.'
- job_type:
  - fridge
  classes:
  - none
  citation: EPA Section 608
  other_agency: US EPA Section 608 technician certification [S38]
  notes: 'Opening the sealed refrigerant system: EPA Section 608 certified technician; disposal of fridges requires
    refrigerant recovery.'
- job_type:
  - appliance_install
  classes:
  - R-11
  - R-37
  citation: A.A.C. R4-9-103 [S2] R-11, R-37
  other_agency: none
  notes: 'New 240V outlet or circuit: R-11. New water line: R-37.'
handyman_ok:
  allowed_examples:
  - Plugging in and leveling an electric appliance, connecting a washer to existing hoses, dryer vent cleaning (unmodified
    plug-in appliances are left out of the $1,000 total)
  not_allowed_examples:
  - Any gas dryer, range or water heater connection
  - New circuits or water lines
  - Refrigerant work without EPA 608
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- Hard water (Havasu sits on Colorado River water) causes scale in dishwashers, ice makers and washer inlet screens
  [judgment].
- Garage fridges struggle in 115F+ heat [judgment].
- 'UniSource is the gas utility in Lake Havasu. Source: [S23][S22].'
- 'Old appliances with refrigerant need recovery before disposal; LHC landfill rules apply. Source: [T-epa_608].'
sample_card: 'REQ-0272 | Appliance Repair | Lake Havasu City, central

