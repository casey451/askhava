# Ask Hava trade knowledge file: appliance_repair
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: appliance_repair
display_name: Appliance Repair
summary: 'Repair and install of refrigerators, washers, dryers, dishwashers, ranges/ovens, microwaves, ice makers
  and disposals. ROC R-63 covers installing and repairing appliances but NOT gas, electrical or plumbing lines.
  Anything that connects to gas or propane is never handyman work (A.R.S. 32-1121(D)(2)). Refrigerant work needs
  EPA Section 608 certification. The model/serial label is the most useful thing for a quote: fridges usually inside
  the fresh-food side wall or ceiling; dishwashers on the inside door edge or tub edge; ranges behind the oven door
  or drawer; top-load washers under the lid; dryers inside the door opening (GE location guide). Havasu hard water
  is hard on dishwashers, ice makers and washer valves [judgment].'
