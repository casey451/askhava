questions:
- id: q1_appliance
  text: Which appliance?
  options:
  - Refrigerator/freezer
  - Washer
  - Dryer
  - Dishwasher
  - Range/oven/cooktop
  - Microwave or other
  ask_if: always
  changes_price: 'yes'
  why: Each appliance type uses different parts and techs.
- id: q2_fuel
  text: Is it gas or electric?
  options:
  - Electric
  - Gas or propane
  - Not sure
  ask_if: appliance in [Dryer, Range/oven/cooktop]
  changes_price: 'yes'
  why: Gas units need gas-qualified licensed techs; gas is never handyman work [S4].
- id: q3_model
  text: Can you send a photo of the model/serial sticker?
  options:
  - Yes, sending photo
  - Can't find it
  - Brand only
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Model and serial numbers let a business check parts before the visit.
- id: q4_symptom
  text: What is it doing?
  options:
  - Won't turn on
  - Runs but not cooling/heating
  - Leaking
  - Loud noise
  - Error code
  - Other
  ask_if: always
  changes_price: 'yes'
  why: Symptoms help a business bring likely parts. [judgment]
- id: q5_age
  text: About how old is it?
  options:
  - Under 5 years
  - 5-10 years
  - Over 10 years
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Age affects parts availability. [judgment]
- id: q6_warranty
  text: Is it still under warranty?
  options:
  - 'Yes'
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: A unit under warranty may have to go to the maker's service network.
