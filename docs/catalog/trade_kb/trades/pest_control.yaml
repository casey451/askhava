photo_cues:
- photo_id: all
  look_for:
  - 'Bark scorpion: small (about 1.5 inches), thin tail and pincers, a strong climber'
  - Pencil-width mud tubes on stem walls (subterranean termites)
  - Bees flying in and out of a wall crack or meter box (established colony)
  - Debris and droppings under solar panels
photo_red_flags:
- flag: Large bee colony near walkways, pool or play area
  safety_step_ref: null
- flag: Bees attacking people or pets
  safety_step_ref: es_bees_stinging_people_or_pets_n
- flag: Rodent droppings in kitchen or HVAC [judgment]
  safety_step_ref: null
- flag: Child or pet stung by scorpion
  safety_step_ref: es_child_stung_by_a_scorpion
emergency_signals:
- id: es_bees_stinging_people_or_pets_n
  signal: Bees stinging people or pets now
  emergency: 'yes'
  safety_step: Run to a car or building; cover your face with your shirt. Do not swat or jump into water or a pool.
    Call 911 for a serious attack. Scrape stingers out sideways with a card or fingernail.
  source: USDA ARS Carl Hayden Bee Research Center, Bee Safety - https://www.ars.usda.gov/pacific-west-area/tucson-az/carl-hayden-bee-research-center/docs/bee-safety/bee-safety/
  then_route_to: pest_control
- id: es_child_stung_by_a_scorpion
  signal: Child stung by a scorpion
  emergency: 'yes'
  safety_step: Wash with soap and water and use a cool compress. Call Poison Help [number removed, see source]. Small children
    are at highest risk; call 911 for jerky body or wild eye movements or trouble breathing.
  source: Arizona Poison and Drug Information Center (University of Arizona), Scorpions - https://azpoison.com/venom/scorpions
  then_route_to: pest_control
- id: es_trouble_breathing_face_swellin
  signal: Trouble breathing, face swelling after a sting
  emergency: 'yes'
  safety_step: Wash with soap and water and use a cool compress. Call Poison Help [number removed, see source]. Small children
    are at highest risk; call 911 for jerky body or wild eye movements or trouble breathing.
  source: Arizona Poison and Drug Information Center (University of Arizona), Scorpions - https://azpoison.com/venom/scorpions
  then_route_to: pest_control
- id: es_strong_jerky_muscle_movements_
  signal: Strong jerky muscle movements, roving eyes or drooling after a scorpion sting
  emergency: 'yes'
  safety_step: Wash with soap and water and use a cool compress. Call Poison Help [number removed, see source]. Small children
    are at highest risk; call 911 for jerky body or wild eye movements or trouble breathing.
  source: Arizona Poison and Drug Information Center (University of Arizona), Scorpions - https://azpoison.com/venom/scorpions
  then_route_to: pest_control
- id: es_someone_sick_after_pesticide_e
  signal: Someone sick after pesticide exposure
  emergency: 'yes'
  safety_step: Call Poison Help [number removed, see source], or 911 if someone is having trouble breathing.
  source: Arizona Poison and Drug Information Center (University of Arizona), Scorpions - https://azpoison.com/venom/scorpions
  then_route_to: pest_control
safety_step:
- when: Bee attack
  step: Run to a car or building; cover your face with your shirt. Do not swat or jump into water or a pool. Call
    911 for a serious attack. Scrape stingers out sideways with a card or fingernail.
  source: USDA ARS Carl Hayden Bee Research Center, Bee Safety - https://www.ars.usda.gov/pacific-west-area/tucson-az/carl-hayden-bee-research-center/docs/bee-safety/bee-safety/
- when: Bee colony found
  step: Leave it alone and keep people and pets away. Do not spray, burn, or throw things at it, and do not try
    to remove it yourself.
  source: USDA ARS Carl Hayden Bee Research Center, Bee Safety - https://www.ars.usda.gov/pacific-west-area/tucson-az/carl-hayden-bee-research-center/docs/bee-safety/bee-safety/
- when: Scorpion sting
  step: Wash with soap and water and use a cool compress. Call Poison Help [number removed, see source]. Small children are at
    highest risk; call 911 for jerky body or wild eye movements or trouble breathing.
  source: Arizona Poison and Drug Information Center (University of Arizona), Scorpions - https://azpoison.com/venom/scorpions
- when: Pesticide exposure
  step: Call Poison Help [number removed, see source], or 911 if someone is having trouble breathing.
  source: Arizona Poison and Drug Information Center (University of Arizona), Scorpions - https://azpoison.com/venom/scorpions
license_classes:
- job_type:
  - general_pest
  - scorpions
  - rodents
  - pigeons_birds
  - bed_bugs_other
  - bees_wasps
  work: Any pest management for hire (inspect, report, bid, apply) including scorpions, general pests, rodents,
    birds with pesticides or devices
  classes:
  - Arizona Department of Agriculture Pest Management Division business license, a registered qualifying party,
    and certified applicators. ROC license not needed (A.R.S. 32-1121(A)(8)).
  citation: A.R.S. 3-3615 Pest management business license; financial security; termite and WDIIR bonds - https://www.azleg.gov/ars/3/03615.htm
    ; A.R.S. 3-3616 Qualifying party registration - https://www.azleg.gov/ars/3/03616.htm ; A.R.S. 32-1121 Persons
    not required to be licensed (handyman exemption (A)(14), pest (A)(8), gardener (A)(16), fuel-gas carve-out (D))
    - https://www.azleg.gov/ars/32/01121.htm
  other_agency: null
  notes: ''
- job_type:
  - general_pest
  - scorpions
  - bees_wasps
  - rodents
  - pigeons_birds
  work: General pests, scorpions, bees, rodents, birds
  classes:
  - 'Applicator Category 1: Industrial, institutional, structural and health-related'
  citation: A.R.S. 3-3614 Applicator certification categories - https://www.azleg.gov/ars/3/03614.htm ; A.A.C. R3-8-102
    Pest management certification category scopes - https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R3-8-102
  other_agency: null
  notes: ''
- job_type:
  - termites
  - termite_inspection
  work: Termite treatment and wood-destroying insect inspection reports
  classes:
  - Category 2 Wood-destroying organism (2a treatment; 2b inspection). Termite businesses must carry a $100,000
    bond or insurance rider; WDIIR businesses a $100,000 errors and omissions bond or rider.
  citation: A.R.S. 3-3614 Applicator certification categories - https://www.azleg.gov/ars/3/03614.htm ; A.A.C. R3-8-102
    Pest management certification category scopes - https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R3-8-102
    ; A.R.S. 3-3615 Pest management business license; financial security; termite and WDIIR bonds - https://www.azleg.gov/ars/3/03615.htm
  other_agency: null
  notes: ''
- job_type:
  - weed_control
  work: Pre-emergent and weed control
  classes:
  - Category 3 Ornamental and turf (covers weeds and bare ground). Landscaper exemption does not cover preemergents
    or sterilants.
  citation: A.A.C. R3-8-102 Pest management certification category scopes - https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R3-8-102
    ; A.R.S. 3-3613 Landscaper herbicide exemption and its limits (preemergents and sterilants excluded) - https://www.azleg.gov/ars/3/03613.htm
  other_agency: null
  notes: ''
- job_type:
  - termites
  - bed_bugs_other
  work: Fumigation (tenting)
  classes:
  - Category 6 Fumigation
  citation: A.R.S. 3-3614 Applicator certification categories - https://www.azleg.gov/ars/3/03614.htm
  other_agency: null
  notes: ''
- job_type:
  - general_pest
  work: Homeowner treating own home
  classes:
  - No license needed for non-restricted products on property you own and occupy
  citation: A.R.S. 3-3611 Pest license and registration exemptions (owner-occupant; OTC antimicrobial to treat a
    swimming pool) - https://www.azleg.gov/ars/3/03611.htm
  other_agency: null
  notes: ''
- job_type:
  - pigeons_birds
  work: Pigeon netting or spikes with no pesticide
  classes:
  - Unclear whether exclusion-only work counts as pest management [judgment / open question]; any pesticide or trapping
    device for hire needs the license.
  citation: A.R.S. 3-3601 Pest management definitions - https://www.azleg.gov/ars/3/03601.htm
  other_agency: null
  notes: ''
handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: 'No for pest treatment: pest management for hire needs an Arizona Department of Agriculture license (A.R.S.
    3-3615). The ROC handyman exemption does not apply to pesticide work.'
local_notes:
- 'Bark scorpions are the only one of about 30 Arizona scorpion species seen as life-threatening; most stings happen
  at night in warm months. Source: Arizona Poison and Drug Information Center (University of Arizona), Scorpions
  - https://azpoison.com/venom/scorpions'
- 'Arizona subterranean termites (Heterotermes aureus) swarm after monsoon rains, generally July-September. Source:
  University of Arizona Cooperative Extension AZ1369, Arizona Termites of Economic Importance - https://extension.arizona.edu/sites/extension.arizona.edu/files/pubs/az1369.pdf'
- 'Africanized honey bees are present in Arizona; colonies nest in walls, meter boxes, irrigation boxes, palm skirts
  and rock crevices. Source: USDA ARS Carl Hayden Bee Research Center, Bee Safety - https://www.ars.usda.gov/pacific-west-area/tucson-az/carl-hayden-bee-research-center/docs/bee-safety/bee-safety/'
- Pigeons nesting under rooftop solar panels is a common request [judgment].
- Pre-emergent is often applied before winter and monsoon rains [judgment].
- 'The Pest Management Division keeps license lookups; Ask Hava does not check or vouch for licenses. Source: Arizona
  Department of Agriculture, Pest Management Division - https://agriculture.az.gov/pestspest-control'
