# Ask Hava trade knowledge file: pest_control
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: pest_control
display_name: Pest control
summary: 'Pest management for homes: general pests (ants, roaches, crickets, spiders), bark scorpions, subterranean
  termites (treatment and wood-destroying insect inspections for home sales), pre-emergent and post-emergent weed
  control around homes and rock yards, bees and wasps (including Africanized honey bees), and pigeons, rats and
  mice (exclusion, trapping, baiting). In Arizona, pest work for hire is licensed by the Arizona Department of Agriculture,
  Pest Management Division, not the ROC. Ask Hava does not identify pests or say what treatment is needed.'
job_types:
- id: general_pest
  label: General pest (ants, roaches, crickets, spiders) one-time or ongoing
- id: scorpions
  label: Scorpions (bark scorpions) treatment or blacklight check
- id: termites
  label: Termite treatment (subterranean, drywood)
  site_visit_usually_needed: 'yes'
- id: termite_inspection
  label: Termite / wood-destroying insect inspection (WDIIR) for a home sale
  site_visit_usually_needed: 'yes'
- id: weed_control
  label: Pre-emergent or weed spraying in rock yard
- id: bees_wasps
  label: Bees (swarm or hive), wasps, hornets
  site_visit_usually_needed: 'yes'
- id: pigeons_birds
  label: Pigeons or birds (under solar panels, roof, patio)
- id: rodents
  label: Rats, mice, pack rats
  site_visit_usually_needed: 'yes'
- id: bed_bugs_other
  label: Bed bugs, fleas, other
