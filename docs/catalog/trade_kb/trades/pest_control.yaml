questions:
- id: pest_type
  text: What pest is it?
  options:
  - Scorpions
  - Ants, roaches, spiders or crickets
  - Termites
  - Termite inspection for home sale
  - Weeds / pre-emergent
  - Bees or wasps
  - Pigeons or birds
  - Rats or mice
  - Other / not sure
  ask_if: always
  changes_price: 'yes'
- id: frequency
  text: One time or ongoing service?
  options:
  - One time
  - Monthly
  - Every other month / quarterly
  - Not sure
  ask_if: pest_type in [Scorpions, Ants, roaches, spiders or crickets, Weeds / pre-emergent]
  changes_price: 'yes'
- id: home_size
  text: About how big is the home and yard?
  options:
  - Under 1,500 sq ft home
  - 1,500-2,500 sq ft
  - Over 2,500 sq ft
  - Big lot / acre or more
  - Not sure
  ask_if: pest_type not in [Bees or wasps]
  changes_price: 'yes'
- id: bee_location
  text: Where are the bees?
  options:
  - Swarm hanging in a ball (tree, bush)
  - Going in and out of the wall or roof
  - In a meter box, irrigation box or ground
  - In a palm or tree
  - Wasp nest under eave
  ask_if: pest_type == Bees or wasps
  changes_price: 'yes'
- id: termite_signs
  text: What did you see?
  options:
  - Mud tubes on walls or foundation
  - Flying swarmers inside
  - Damaged wood
  - Just want a check / home sale
  ask_if: pest_type == Termites
  changes_price: 'yes'
- id: weed_area
  text: What area needs weed control?
  options:
  - Front rock yard
  - Back rock yard
  - Front and back
  - Around the whole lot
  - Not sure
  ask_if: pest_type == Weeds / pre-emergent
  changes_price: 'yes'
quote_without_visit_needs:
- Pest type and where seen
- Home square footage and lot size
- One time vs ongoing
- 'For bees: photo from a safe distance and location'
- 'For termites: photo of mud tubes or damage'
- 'For pigeons: photo of solar array and roof, and where they roost'
- 'For bees: whether live removal is wanted'
site_visit_usually_needed:
- termites
- termite_inspection
- bees_wasps (in wall)
- rodents
