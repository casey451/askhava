photo_cues:
- photo_id: all
  look_for:
  - Etched logos in glass corners help identify the maker and tempered glass
  - Show the bottom track for sliders
photo_red_flags:
- flag: Broken glass still in frame (cut hazard)
  safety_step_ref: null
- flag: Water stain below window (leak)
  safety_step_ref: null
- flag: Peeling paint on old wood frames in pre-1978 home (lead)
  safety_step_ref: null
- flag: Long looped blind cords in a child's room
  safety_step_ref: null
- flag: Bedroom window that won't open (escape route) [judgment]
  safety_step_ref: null
