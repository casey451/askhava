# Ask Hava trade knowledge file: windows_doors
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: windows_doors
display_name: Windows & Doors
summary: Window replacement and repair, glass and dual-pane seal replacement, sliding door rollers and tracks, entry
  and interior doors, security screen doors, screens, window film, blinds and shutters. ROC R-7 covers carpentry
  incl. windows, metal doors and frames; R-60 finish carpentry covers door trim and metal doors; R-65 Glazing covers
  glass, window film, blinds and shutters. LHC requires a permit when the window size changes. In pre-1978 homes,
  window replacement is always covered by EPA RRP. CPSC says cordless window coverings are safest and screens do
  not stop child falls.
