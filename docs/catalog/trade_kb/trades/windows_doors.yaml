questions:
- id: q1_count
  text: How many windows or doors?
  options:
  - '1'
  - 2-4
  - 5-10
  - Whole house
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Number of openings is the main price driver.
- id: q2_job
  text: What needs to happen?
  options:
  - Replace whole unit
  - Fix glass only
  - Fix rollers, lock or track
  - Screens or shades
  - Adjust so it closes right
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Glass, full window, door and screens are different jobs.
- id: q3_size_change
  text: Same size opening?
  options:
  - Yes, same size
  - Bigger or smaller
  - New opening
  - Not sure
  ask_if: job == Replace whole unit
  changes_price: 'yes'
  why: Changing the opening size needs an LHC permit and framing work.
- id: q4_access
  text: Any on a second floor?
  options:
  - No, all ground floor
  - Yes, some upstairs
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Second-story or hard-to-reach openings add time.
- id: q5_home_age
  text: About when was the home built?
  options:
  - 1978 or later
  - Before 1978
  - Not sure
  ask_if: job == Replace whole unit
  changes_price: 'yes'
  why: Pre-1978 window replacement falls under EPA lead-safe rules.
- id: q6_security_now
  text: Is the home open or unlockable right now?
  options:
  - Yes, broken and open
  - No, it still closes and locks
  - Not sure
  ask_if: always
  changes_price: 'no'
  why: A home that can't be secured needs a fast board-up or lock visit.
quote_without_visit_needs:
- Count and rough sizes (width x height)
- Frame type (aluminum, vinyl)
- Photos inside and out
- Same size or not
site_visit_usually_needed:
