safety_step:
- when: Windows and kids
  step: Screens do not stop falls. Use window guards or stops that limit openings to 4 inches, and keep furniture
    away from windows.
  source: '[T-cpsc_falls]'
- when: Corded blinds
  step: Cordless window coverings are the safest choice in homes with young children.
  source: '[T-cpsc_cords]'
- when: Pre-1978 window replacement
  step: Window replacement in pre-1978 homes is covered by EPA RRP; use a certified renovation firm and keep kids
    away from dust.
  source: '[T-epa_rrp]'
intake_notes_judgment:
- 'Child fell from window or is badly cut: Call 911. [judgment]'
license_classes:
- job_type:
  - window_replace
  - door_replace
  - door_adjust
  - slider_repair
  - security_door
  classes:
  - R-7
  - CR-7
  - R-60
  - B
  - B-3
  - R-61
  citation: A.A.C. R4-9-103 [S2] R-7, R-60; A.A.C. R4-9-104 [S3] (CR- dual classes)
  other_agency: none
  notes: ROC R-7 Carpentry (windows, metal doors and frames, hardware) or CR-7; R-60 Finish Carpentry (door trim,
    metal doors, automatic closers); B/B-3/R-61.
- job_type:
  - glass_repair
  - film_blinds
  - screens
  classes:
  - R-65
  - CR-65
  citation: A.A.C. R4-9-103 [S2] R-65; R4-9-104 [S3] CR-65
  other_agency: none
  notes: ROC R-65 Glazing (glass, window film, blinds and shutters, glass-holding members) or CR-65.
- job_type:
  - window_replace
  classes:
  - none
  citation: LHC Building Permits page [S17]; 40 CFR 745 Subpart E
  other_agency: none
  notes: LHC permit when window size changes; RRP firm certification for pre-1978 homes.
handyman_ok:
  allowed_examples:
  - Screens, blinds, slider rollers, door adjustments, one door slab, under $1,000 total (glass repair is on LHC
    no-permit list)
  not_allowed_examples:
  - Window size changes (permit)
  - Multi-window replacement over $1,000
  - Pre-1978 window replacement without EPA RRP certification
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'LHC: glass repair is a minor non-structural repair without permit; window replacement changing size needs a permit.
  Source: [S17].'
- Older Havasu homes often have single-pane aluminum windows; sun screens and low-E glass are common heat requests
  [judgment].
- Dust and sand wear slider rollers and tracks [judgment].
- Monsoon wind can break glass; boarding up is a stopgap [judgment].
