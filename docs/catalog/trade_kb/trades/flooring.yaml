# Ask Hava trade knowledge file: flooring
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: flooring
display_name: Flooring
summary: Install and repair tile, luxury vinyl plank (LVP), laminate, hardwood, carpet, and concrete coatings. ROC
  R-8 Floor Covering covers carpet, tile, wood, linoleum, vinyl, asphalt, rubber and concrete coatings; R-48 covers
  tile; R-60 covers wood flooring. LHC needs no permit for floor covering. Old 9x9 inch vinyl tile and black mastic
  may contain asbestos; EPA says leave intact material alone and do not sand or scrape it. Slab homes are the norm
  in Havasu, so moisture and slab cracks matter for LVP and tile [judgment].
