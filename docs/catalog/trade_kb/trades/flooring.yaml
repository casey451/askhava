questions:
- id: q1_area
  text: About how much floor?
  options:
  - 1 small room or bath
  - 2-3 rooms
  - Most of the house
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Square footage is the main price driver.
- id: q2_material
  text: What floor do you want?
  options:
  - Tile
  - Vinyl plank (LVP) or laminate
  - Wood
  - Carpet
  - Not sure yet
  ask_if: always
  changes_price: 'yes'
  why: Tile, LVP, carpet and wood each take different crews and time.
- id: q3_removal
  text: What is on the floor now?
  options:
  - Nothing, bare slab
  - Carpet
  - Tile
  - Vinyl/linoleum
  - Wood or laminate
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Tearing out old tile or glued floors adds a lot of labor.
- id: q4_materials_supplied
  text: Who buys the flooring?
  options:
  - I will
  - Installer
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Who buys flooring changes the quote.
- id: q5_furniture
  text: Will rooms be empty?
  options:
  - Yes, empty
  - Furniture needs moving
  - Appliances too
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Moving furniture and appliances adds time.
- id: q6_home_age
  text: About when was the home built?
  options:
  - 1981 or later
  - Before 1981
  - Not sure
  ask_if: removal == Vinyl/linoleum
  changes_price: 'yes'
  why: Old vinyl tile and mastic may contain asbestos.
