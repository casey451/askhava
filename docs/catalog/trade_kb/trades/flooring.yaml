- job_type:
  - old_floor_removal
  classes:
  - none
  citation: EPA asbestos guidance
  other_agency: none
  notes: 'Suspect asbestos flooring: test, then accredited asbestos professional if positive.'
handyman_ok:
  allowed_examples:
  - 'Replacing a few cracked tiles or planks, re-stretching a carpet seam, under $1,000 total (LHC: floor covering
    needs no permit)'
  not_allowed_examples:
  - Room or whole-house installs over $1,000
  - Disturbing suspected asbestos flooring
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'LHC: floor covering needs no building permit. Source: [S17].'
- Havasu homes are mostly slab-on-grade; slab moisture and cracks affect LVP and tile [judgment].
- Large-format porcelain is popular in Havasu remodels [judgment].
- Vacation rentals often ask for LVP for durability [judgment].
- Asbestos was common in vinyl tile, sheet vinyl backing and black mastic made before about 1980; the home_age cutoff
  in questions is a rough screen, not a test [judgment].
