photo_red_flags:
- flag: Old 9x9 inch tiles or black glue under flooring (possible asbestos)
  safety_step_ref: null
- flag: Cracks running through many tiles in a line (slab movement) [judgment]
  safety_step_ref: null
- flag: Water staining or swelling planks (leak first)
  safety_step_ref: null
- flag: Soft spots
  safety_step_ref: null
emergency_signals:
- id: es_flooring_1
  signal: Flooring is almost never an emergency
  emergency: 'no'
  safety_step: No special safety step; normal job card.
  source: none
  then_route_to: flooring
- id: es_flooring_2
  signal: Water spreading across floor from unknown source
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: Find and stop the water source; dry materials within 24-48 hours.
  source: '[T-epa_mold]'
  then_route_to: plumbing
safety_step:
- when: Popcorn/acoustic ceiling, old vinyl tile or old drywall texture to be disturbed
  step: Leave it alone if intact. Do not sand, scrape, drill or cut it. Have it tested or handled by an accredited
    asbestos professional before remodeling.
  source: '[T-epa_asb]'
- when: Water under flooring
  step: Find and stop the water source; dry materials within 24-48 hours.
  source: '[T-epa_mold]'
- when: Cutting tile or stone indoors
  step: Silica dust from cutting is a lung hazard; wet cutting and dust control are standard.
  source: '[T-osha_silica]'
