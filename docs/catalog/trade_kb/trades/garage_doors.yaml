# Ask Hava trade knowledge file: garage_doors
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: garage_doors
display_name: Garage Doors
summary: 'Garage door springs, cables, rollers, tracks, panels, openers and remotes. Two spring types: torsion springs
  sit on a bar above the door and are wound under high tension; extension springs run along the side tracks and
  should have safety cables through them [judgment]. A broken spring often sounds like a loud bang and the door
  becomes very heavy [judgment]. Federal rules (16 CFR 1211) require openers to reverse and to have photo eyes or
  edge sensors, and require manuals to warn that springs, cables and hardware are under high tension and should
  be fixed by qualified people. Arizona has no separate garage door license class; door work fits ROC R-7 (carpentry,
  metal doors, hardware) and opener wiring R-11. Confirm with ROC.'
