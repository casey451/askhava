questions:
- id: q1_problem
  text: What is going on?
  options:
  - Spring broke or loud bang
  - Cable off or snapped
  - Door off track or crooked
  - Opener not working
  - Want a new door or opener
  - Noisy or slow
  ask_if: always
  changes_price: 'yes'
  why: Spring, cable, opener and panel jobs use different parts.
- id: q2_door_size
  text: What size door?
  options:
  - 1-car (about 8-9 ft wide)
  - 2-car (about 16 ft wide)
  - RV or tall door
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Single or double doors take different springs and panels.
- id: q3_spring_type
  text: Where are the springs?
  options:
  - On a bar above the door
  - Along the side tracks
  - Not sure
  ask_if: problem in [Spring broke or loud bang, Cable off or snapped, Noisy or slow]
  changes_price: 'yes'
  why: Torsion and extension springs are priced differently.
- id: q4_car_trapped
  text: Is a car stuck inside, or is the door open and won't close?
  options:
  - Car stuck inside
  - Door stuck open
  - Neither
  - Not sure
  ask_if: always
  changes_price: 'no'
  why: A trapped car or open door changes urgency.
- id: q5_opener_age
  text: About how old is the opener?
  options:
  - Under 10 years
  - Over 10 years
  - No opener
  - Not sure
  ask_if: problem in [Opener not working, Want a new door or opener]
  changes_price: 'yes'
  why: Older openers may lack current safety features, which can change repair vs replace options. [judgment]
