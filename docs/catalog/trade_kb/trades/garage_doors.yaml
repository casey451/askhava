emergency_signals:
- id: es_garage_doors_1
  signal: Door crooked, hanging, or partly out of track
  emergency: 'yes'
  safety_step: Do not use the opener or try to lift the door. Keep people and pets away from under it. Springs,
    cables and hardware are under high tension; repairs should be done by qualified people.
  source: '[T-cfr_1211]'
  then_route_to: garage_doors
- id: es_garage_doors_2
  signal: Person or pet trapped or hit by door
  emergency: 'yes'
  intake_note:
  - Call 911. [judgment]
  safety_step: Do not use the opener or try to lift the door. Keep people and pets away from under it. Springs,
    cables and hardware are under high tension; repairs should be done by qualified people.
  source: '[T-cfr_1211]'
  then_route_to: none
  note: 'Routing: none (911 first)'
- id: es_garage_doors_3
  signal: Car trapped inside; door stuck open so home can't be secured
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: Do not use the opener or try to lift the door. Keep people and pets away from under it. Springs,
    cables and hardware are under high tension; repairs should be done by qualified people.
  source: '[T-cfr_1211]'
  then_route_to: garage_doors
- id: es_garage_doors_4
  signal: Noisy door, slow opener
  emergency: 'no'
  safety_step: 'Test the auto-reverse each month: place a 1-1/2 inch object (a 2x4 laid flat) under the door; it
    should reverse when it hits it.'
  source: '[T-cfr_1211]'
  then_route_to: garage_doors
safety_step:
- when: Broken spring, frayed cable or crooked door
  step: Do not use the opener or try to lift the door. Keep people and pets away from under it. Springs, cables
    and hardware are under high tension; repairs should be done by qualified people.
  source: '[T-cfr_1211]'
- when: Monthly check
  step: 'Test the auto-reverse each month: place a 1-1/2 inch object (a 2x4 laid flat) under the door; it should
    reverse when it hits it.'
  source: '[T-cfr_1211]'
intake_notes_judgment:
- 'Someone hit or trapped by door: Call 911. [judgment]'
license_classes:
- job_type:
  - broken_spring
  - cable_off
  - off_track
  - door_replace
  - panel_repair
  - tune_up
  classes:
  - R-7
  - R-60
  - B
  - B-3
  - R-61
  - R-14
  citation: A.A.C. R4-9-103 [S2] R-7; [T-roc_classes] [judgment on mapping]
  other_agency: none
  notes: 'No dedicated ROC garage door class. Door, spring and hardware work most likely fits ROC R-7 Carpentry
    (metal doors, hardware) or R-60 Finish Carpentry (metal doors, automatic door closers), or B/B-3/R-61 [judgment].
    Automatic driveway gates are a named class: R-14. Confirm classification with ROC.'
- job_type:
  - opener_install
  - opener_repair
  classes:
  - R-11
  citation: A.A.C. R4-9-103 [S2] R-11; A.R.S. 32-1121(A)(14) [S4]
  other_agency: none
  notes: Opener on an existing outlet is usually installed with the door contractor; new circuit or outlet is R-11
    Electrical. Plug-in opener is an appliance under (A)(14) cost rule only if unmodified.
handyman_ok:
  allowed_examples:
  - Remote/keypad programming
  - Weatherseal, lubricating, a roller swap
  not_allowed_examples:
  - Jobs over $1,000 such as new doors
  - New electrical circuits for openers
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
  note: Spring work is legally possible under the exemption if small, but CPSC rule manuals warn it needs qualified
    people; most homeowners route spring and cable work to a garage door contractor [judgment].
local_notes:
- Desert heat dries rollers and weatherseal fast; garage temps above 120F in summer are common [judgment].
- Monsoon gusts can push wide doors in; wind-rated doors and struts exist [judgment].
- Many Havasu homes have RV garages with tall doors that need heavier springs [judgment].
