questions:
- id: q1_what
  text: What do you need?
  options:
  - Locked out of home
  - Locked out of car
  - Rekey or change locks
  - New lock install
  - Safe
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Lockouts, rekeys and installs are priced differently.
- id: q2_anyone_inside
  text: Is a child, pet or anyone who needs help inside?
  options:
  - 'Yes'
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'no'
  why: A child or pet in a locked car or home means call 911 first.
- id: q3_count
  text: How many locks?
  options:
  - '1'
  - 2-3
  - 4+
  - Not sure
  ask_if: rekey or install
  changes_price: 'yes'
  why: Rekeys are usually priced per lock. [judgment]
- id: q4_lock_type
  text: What kind of lock?
  options:
  - Regular key lock
  - Smart/keypad lock
  - High-security lock
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Smart and high-security locks take different parts and skills.
- id: q5_when
  text: How soon?
  options:
  - Right now
  - Today
  - This week
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: After-hours calls often cost more. [judgment]
