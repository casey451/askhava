# Ask Hava trade knowledge file: locksmith
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: locksmith
display_name: Locksmith
summary: House and car lockouts, rekeying after a move, lock installs and repairs, smart locks, safes, and mailbox
  locks. No Arizona state locksmith license was found (third-party sources only; treat as [unverified]). Door or
  frame replacement is ROC carpentry work (R-7/R-60). Wired access control or alarm work needs ROC R-67 and BTR
  alarm certification. A child or pet locked in a hot car is a 911 call first.
