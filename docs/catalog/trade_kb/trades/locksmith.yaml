- job_type:
  - home_lockout
  - car_lockout
  - rekey
  - lock_install
  - safe
  classes:
  - none
  citation: '[T-lock_3p_lowrate]; [T-lock_3p_map] [unverified, third-party]; foundation §5'
  other_agency: none
  notes: No Arizona state locksmith license found. Third-party sources only; treat as [unverified]. Rekeying and
    lock repair are not ROC construction [judgment].
- job_type:
  - door_route
  classes:
  - R-7
  - R-60
  citation: A.A.C. R4-9-103 [S2] R-7, R-60
  other_agency: none
  notes: 'Door or frame replacement: ROC R-7 Carpentry or R-60 Finish Carpentry.'
- job_type:
  - access_route
  classes:
  - R-67
  citation: A.A.C. R4-9-103 [S2] R-67; [S7]; [S8]
  other_agency: AZ Board of Technical Registration
  notes: 'Wired access control or alarm: ROC R-67 Low Voltage Communication Systems plus BTR alarm business/agent
    certification.'
handyman_ok:
  allowed_examples:
  - Swapping a lockset or battery smart lock under $1,000
  not_allowed_examples:
  - Wired access control (R-67 + BTR)
  - Door frame replacement needing a permit
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'Summer heat makes car lockouts with kids or pets dangerous quickly. Source: [T-nhtsa_heat].'
- Boat and RV lockouts are common in Havasu [judgment].
- Rekeying after buying a home or after renters leave is a common request [judgment].
