  site_visit_usually_needed: 'yes'
  handyman_ok: 'yes'
- id: rekey
  label: Rekey locks
  site_visit_usually_needed: 'yes'
  handyman_ok: 'yes'
- id: lock_install
  label: Install/replace locks, deadbolts, smart locks
  site_visit_usually_needed: 'yes'
  handyman_ok: 'yes'
- id: safe
  label: Safe opening or repair
  site_visit_usually_needed: 'yes'
  handyman_ok: 'yes'
- id: door_route
  label: Damaged door or frame (route to windows_doors)
  site_visit_usually_needed: 'yes'
  handyman_ok: limited
- id: access_route
  label: Wired keypad/access control (route to security_alarm)
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
