photo_cues:
- photo_id: all
  look_for:
  - Corroded battery terminals or cables [judgment]
  - Low water or bulging lead-acid batteries
  - Melted or burned cable ends
  - Charger brand and connector type
photo_red_flags:
- flag: Swollen, smoking or hissing battery
  safety_step_ref: es_battery_smoking_sparking_hissi
- flag: Burned wires or melted terminals
  safety_step_ref: es_smell_of_burning_while_chargin
- flag: Charging indoors next to living space [judgment]
  safety_step_ref: null
emergency_signals:
- id: es_battery_smoking_sparking_hissi
  signal: Battery smoking, sparking, hissing or on fire
  emergency: 'yes'
  safety_step: Stop using or charging it, get everyone away, close doors if safe, and call 911 from a safe place.
    Do not try to put out a lithium battery fire yourself.
  source: NFPA, Lithium-Ion Battery Safety - https://www.nfpa.org/education-and-research/energy-transition/lithium-ion-batteries
    ; U.S. Fire Administration (FEMA), Lithium-ion batteries community education - https://www.usfa.fema.gov/a-z/lithium-ion-batteries/community-education/
  then_route_to: golf_cart
- id: es_smell_of_burning_while_chargin
  signal: Smell of burning while charging
  emergency: 'yes'
  safety_step: Stop using or charging it, get everyone away, close doors if safe, and call 911 from a safe place.
    Do not try to put out a lithium battery fire yourself.
  source: NFPA, Lithium-Ion Battery Safety - https://www.nfpa.org/education-and-research/energy-transition/lithium-ion-batteries
    ; U.S. Fire Administration (FEMA), Lithium-ion batteries community education - https://www.usfa.fema.gov/a-z/lithium-ion-batteries/community-education/
  then_route_to: golf_cart
- id: es_cart_rolled_with_someone_hurt
  signal: Cart rolled with someone hurt
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: golf_cart
safety_step:
- when: Battery smoking, hissing or on fire
  step: Stop using or charging it, get everyone away, close doors if safe, and call 911 from a safe place. Do not
    try to put out a lithium battery fire yourself.
  source: NFPA, Lithium-Ion Battery Safety - https://www.nfpa.org/education-and-research/energy-transition/lithium-ion-batteries
    ; U.S. Fire Administration (FEMA), Lithium-ion batteries community education - https://www.usfa.fema.gov/a-z/lithium-ion-batteries/community-education/
- when: Charging
  step: Follow the cart maker's manual. Charge in a place with good airflow; lead-acid batteries give off flammable
    hydrogen gas while charging.
  source: 'Manufacturer owner''s manual (Club Car / E-Z-GO / Yamaha) [judgment: manual not opened]; NFPA, Lithium-Ion
    Battery Safety - https://www.nfpa.org/education-and-research/energy-transition/lithium-ion-batteries'
- when: Street use
  step: Carts on public streets must meet state rules (registration, equipment). Ask Hava does not decide if a cart
    is street legal.
  source: ADOT, Motorcycle / Golf Cart (street-use registration) - https://azdot.gov/az-cities/motorcycle-golf-cart
