  classes:
  - ADOT Motor Vehicle Division, not a contractor license
  citation: ADOT, Motorcycle / Golf Cart (street-use registration) - https://azdot.gov/az-cities/motorcycle-golf-cart
  other_agency: null
  notes: ''
handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: 'Yes for cart repair [judgment: vehicle, no ROC license]. A new 240V circuit or outlet for a charger at
    the house is electrical work: A.R.S. 32-1121(A)(14): a person may do ''casual or minor'' work without an ROC
    license only if the whole job (labor, materials, everything) is under $1,000, no building permit is needed,
    it is not part of a larger job or split up to get under the limit, and their ads say ''not a licensed contractor''.
    Per 32-1121(D) the exemption never covers work that connects to natural gas, propane or other fuel gas, or hardwired/interconnected
    fire-safety devices. Lake Havasu City''s permit list decides whether a permit is needed (https://www.lhcaz.gov/development-permitting/building).'
local_notes:
- 'Street use of carts follows state law; Lake Havasu City code requires state-law compliance for odd vehicles on
  streets. Sources: ADOT, Motorcycle / Golf Cart (street-use registration) - https://azdot.gov/az-cities/motorcycle-golf-cart
  ; Lake Havasu City Code 10.20 and 11.08.335 (off-road and miscellaneous vehicles) - https://codelibrary.amlegal.com/codes/lakehavasucity/latest/lakehavasu_az/0-0-0-7008'
- Summer heat shortens lead-acid battery life [judgment].
- Lithium conversions are a common request [judgment].
