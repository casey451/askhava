questions:
- id: power_type
  text: Is the cart electric or gas?
  options:
  - Electric
  - Gas
  - Not sure
  ask_if: always
  changes_price: 'yes'
- id: problem
  text: What is going on?
  options:
  - Won't move / dead
  - Slow or dies fast
  - Batteries
  - Charger
  - Brakes, tires or steering
  - Upgrades / add-ons
  - Routine service
  ask_if: always
  changes_price: 'yes'
- id: battery_type
  text: What batteries does it have?
  options:
  - Lead-acid (refill with water)
  - Lithium
  - Not sure
  ask_if: power_type == Electric and problem in [Won't move / dead, Slow or dies fast, Batteries, Charger]
  changes_price: 'yes'
- id: brand
  text: What brand and about what year?
  options:
  - Club Car
  - E-Z-GO
  - Yamaha
  - ICON / Evolution / other
  - Not sure
  ask_if: always
  changes_price: 'yes'
- id: upgrade_kind
  text: What upgrades?
  options:
  - Lift kit / tires
  - Lights / turn signals / mirrors
  - Seats / rear seat
  - Lithium conversion
  - Other
  ask_if: problem == Upgrades / add-ons
  changes_price: 'yes'
- id: transport
  text: Can the cart be worked on at home, or does it need pickup?
  options:
  - At my home
  - Needs pickup
  - I can drop it off
  ask_if: always
  changes_price: 'yes'
