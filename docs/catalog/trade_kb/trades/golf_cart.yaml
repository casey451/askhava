# Ask Hava trade knowledge file: golf_cart
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: golf_cart
display_name: Golf cart repair
summary: 'Golf cart and low-speed vehicle repair: electric carts (lead-acid or lithium batteries), gas carts, chargers,
  motors and controllers, brakes, tires, lift kits, lights, seats, and street-legal upgrades. Common brands are
  Club Car, E-Z-GO, Yamaha, ICON and Evolution. Many Havasu carts are used in neighborhoods and to go to the lake
  [judgment]. Ask Hava gathers facts and photos; it never says what is wrong or if a cart is street legal.'
