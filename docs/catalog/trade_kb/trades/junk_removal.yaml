emergency_signals:
- id: es_junk_removal_1
  signal: Gas smell while moving an appliance
  emergency: 'yes'
  safety_step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call
    911 and UniSource at [number removed, see source].
  source: '[S23][S22]'
  then_route_to: none
  note: 'Routing: none (leave, call 911 and UES)'
- id: es_junk_removal_2
  signal: Someone hurt lifting in the heat
  emergency: 'yes'
  safety_step: 'Heat stroke (confusion, hot skin, passing out) is an emergency: call 911 and move the person to
    a cooler place. For heat exhaustion, move to a cool place, loosen clothes, sip water.'
  source: '[S27]'
  then_route_to: none
  note: 'Routing: none (911 first)'
- id: es_junk_removal_3
  signal: Routine haul
  emergency: 'no'
  safety_step: No special safety step; normal job card.
  source: none
  then_route_to: junk_removal
safety_step:
- when: Gas smell
  step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call 911
    and UniSource at [number removed, see source].
  source: '[S23][S22]'
- when: Fridge, freezer or AC unit disposal
  step: Refrigerant must be recovered by a certified technician or the disposal site before the unit is scrapped.
  source: '[T-epa_608]'
- when: Leftover paint
  step: Let latex paint dry out (open lid or use hardener) and then put it in regular trash. Spray paint can be
    sprayed onto cardboard and trashed.
  source: '[T-lhc_hhw]'
- when: Old materials that may contain asbestos
  step: Leave it alone if intact. Do not sand, scrape, drill or cut it. Have it tested or handled by an accredited
    asbestos professional.
  source: '[T-epa_asb]'
- when: Worker or homeowner shows heat illness
  step: 'Heat stroke (confusion, hot skin, passing out) is an emergency: call 911 and move the person to a cooler
    place. For heat exhaustion, move to a cool place, loosen clothes, sip water.'
  source: '[S27]'
