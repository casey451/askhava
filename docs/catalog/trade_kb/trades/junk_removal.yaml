# Ask Hava trade knowledge file: junk_removal
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: junk_removal
display_name: Junk Removal
summary: Hauling away furniture, appliances, yard waste, construction debris, estate and garage cleanouts, and small
  demolition such as sheds or hot tubs. No state license is needed to haul. Demolition of structures is ROC R-57
  Wrecking; disconnecting a hot tub or appliance from power, water or gas is licensed work. Fridges, freezers and
  AC units need refrigerant recovered before disposal under EPA Section 608. The Lake Havasu City landfill charges
  by weight, cash only; paint must be dried, and other household hazards go to collection days.
