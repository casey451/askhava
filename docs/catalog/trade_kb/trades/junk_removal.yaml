questions:
- id: q1_volume
  text: How much stuff?
  options:
  - A few items
  - Pickup-truck load
  - Half a trailer
  - Full garage or house
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Most haulers price by how much of the truck you fill.
- id: q2_type
  text: What kind of items?
  options:
  - Furniture
  - Appliances
  - Yard waste
  - Construction debris
  - Mixed
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Heavy debris and appliances weigh more, and the landfill charges by weight.
- id: q3_demo
  text: Does anything need to be taken apart or torn down?
  options:
  - 'No'
  - Yes, furniture or playset
  - Yes, shed or deck
  - Yes, hot tub
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Tear-down adds labor; structure demolition and disconnects may need licenses.
- id: q4_hazards
  text: Any paint, chemicals, propane or fridges/AC units?
  options:
  - 'Yes'
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Hazards need special handling or separate drop-off.
- id: q5_access
  text: Where is it?
  options:
  - Curb or driveway
  - Garage
  - Inside the house
  - Backyard
  - Upstairs
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Carrying from inside or upstairs adds time.
