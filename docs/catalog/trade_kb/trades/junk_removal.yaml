handyman_ok:
  allowed_examples:
  - Hauling (not construction)
  - Taking apart furniture or a playset
  not_allowed_examples:
  - Gas disconnects
  - Wired hot tub disconnects
  - Demolishing a shed or deck over $1,000 or needing a permit
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'The Lake Havasu City landfill charges by weight, cash only, and takes e-waste such as computers and printers.
  Source: [T-lhc_hhw].'
- 'Republic Services (the city hauler) offers residents of single-family homes in city limits up to six scheduled
  bulk curbside pickups a year, 4 items each. Source: [T-lhc_hhw].'
- 'Household hazardous waste is collected on two collection days a year; local stores take batteries and bulbs.
  Source: [T-lhc_hhw].'
- Palm fronds are heavy and spiky; many haulers price them separately [judgment].
