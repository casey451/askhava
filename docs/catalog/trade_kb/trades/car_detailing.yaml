questions:
  - id: q1_vehicle
    text: "What kind of vehicle?"
    options: ["Car", "Truck, SUV or van", "RV or motorhome", "Travel trailer or fifth wheel", "Side-by-side or UTV"]
    ask_if: "always"
    changes_price: "yes"
    why: "Vehicle size sets the time and products needed. [judgment]"
  - id: q2_rv_length
    text: "About how long is it?"
    options: ["Under 25 ft", "25 to 35 ft", "Over 35 ft", "Not sure"]
    ask_if: "q1_vehicle in [RV or motorhome, Travel trailer or fifth wheel]"
    changes_price: "yes"
    why: "RV and trailer detailing is often quoted by the foot. [judgment]"
  - id: q3_service
    text: "What do you need?"
    options: ["Inside only", "Outside only", "Inside and outside", "Ceramic coating or paint polish", "RV roof cleaning", "Not sure"]
    ask_if: "always"
    changes_price: "yes"
    why: "Inside, outside and paint work each take different time and gear. [judgment]"
  - id: q4_condition
    text: "How is it right now?"
    options: ["Normal use", "Heavy dirt or mud", "Lots of pet hair", "Smoke or other smell", "Stains or spills", "Not sure"]
    ask_if: "always"
    changes_price: "yes"
    why: "Heavy dirt, pet hair and smells add hours to a detail. [judgment]"
  - id: q5_paint
    text: "What paint work do you want?"
    options: ["Polish out swirls or light scratches", "Ceramic coating", "Both", "Not sure"]
    ask_if: "job_type == ceramic_paint_correction or q3_service == Ceramic coating or paint polish"
    changes_price: "yes"
    why: "Paint polish and coating are separate steps, and doing both takes much longer. [judgment]"
  - id: q6_where
    text: "Where is the vehicle parked?"
    options: ["At home", "Storage lot", "RV park or campground", "Somewhere else"]
    ask_if: "always"
    changes_price: "yes"
    why: "Most local detailers come to the vehicle, and the spot sets travel and setup. [judgment]"
  - id: q7_water_shade
    text: "Is there a water spigot and shade or a garage there?"
    options: ["Water and shade or garage", "Water only", "Shade or garage only", "Neither", "Not sure"]
    ask_if: "q3_service != Inside only"
    changes_price: "yes"
    why: "A business with no water or shade on site may bring its own water or pick a cooler time of day. [judgment]"
quote_without_visit_needs:
  - "Vehicle type, and length for an RV or trailer [judgment]"
  - "Service wanted: inside, outside, both, paint work or RV roof [judgment]"
  - "Condition: dirt, mud, pet hair, smells, stains [judgment]"
  - "Where it is parked, and whether water, power and shade are there [judgment]"
  - "Photos of the vehicle and the worst area [judgment]"
site_visit_usually_needed:
  - "Paint correction, where a business may want to check the paint in person first [judgment]"
  - "Large RVs with heavy oxidation or roof work, where size and condition are hard to judge from photos [judgment]"
photos_to_request:
  - id: p1_vehicle_wide
    ask: "A photo of the whole vehicle from the side. Please leave the license plate out of the shot."
    for_job_types: [all]
  - id: p2_interior
    ask: "A photo of the front seats and floor from an open door."
    for_job_types: [interior_detail, full_detail, odor_pet_hair, rv_large_vehicle]
  - id: p3_worst_area
    ask: "A close photo of the dirtiest or most stained spot."
    for_job_types: [all]
  - id: p4_paint_closeup
    ask: "A close photo of the paint in daylight, showing swirls, scratches or dull spots."
    for_job_types: [exterior_detail, ceramic_paint_correction, rv_large_vehicle]
  - id: p5_parking_spot
    ask: "A photo of where the vehicle is parked, with the nearest water spigot if there is one."
    for_job_types: [exterior_detail, full_detail, rv_large_vehicle, ceramic_paint_correction]
photo_cues:
  - photo_id: p1_vehicle_wide
    look_for: ["vehicle type and size", "overall dirt or dust level", "dull or chalky paint", "RV length and slide-outs"]
    neutral_wording_example: "Photo shows a full-size pickup with a layer of dust on the body and wheels."
  - photo_id: p2_interior
    look_for: ["seat material (cloth or leather)", "pet hair on seats or floor", "trash or items left inside", "floor mats"]
    neutral_wording_example: "Photo shows cloth seats with light-colored hair on the back seat and floor."
  - photo_id: p3_worst_area
    look_for: ["stain size and color", "mud or caked dirt", "water spots on glass or paint"]
    neutral_wording_example: "Photo shows a dark stain about the size of a hand on the driver seat."
  - photo_id: p4_paint_closeup
    look_for: ["swirl marks in light", "scratches", "faded or chalky areas", "sticky residue or bird droppings"]
    neutral_wording_example: "Photo shows fine circular marks on the hood in sunlight and a faded area on the roof."
  - photo_id: p5_parking_spot
    look_for: ["driveway, lot or RV pad", "nearby spigot", "shade, carport or garage", "room to walk around the vehicle"]
    neutral_wording_example: "Photo shows the vehicle on a driveway in full sun with a spigot on the garage wall."
photo_red_flags:
  - flag: "Smoke or flames coming from the vehicle"
    safety_step_ref: es_vehicle_smoke_fire
  - flag: "License plate, VIN, house number or mail with a name visible (crop before the card goes out)"
    safety_step_ref: null
  - flag: "Rodent droppings or nest material inside the vehicle or RV"
    safety_step_ref: null
