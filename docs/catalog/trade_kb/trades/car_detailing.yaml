# Written by Claude (expert layer, Oct 29 2026), not part of the Grok delivery (D-431). AI research, not legal advice.
# Ask Hava trade knowledge file: car_detailing. Schema: foundation/schema.yaml (v2). Items marked [judgment] are not
# from a cited source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: car_detailing
display_name: "Car, truck and RV detailing"
summary: >-
  Interior and exterior detailing for cars, trucks, SUVs, side-by-sides, RVs and travel trailers, plus paint polish,
  ceramic coating, and pet hair or odor work. In Lake Havasu City most detailers come to the home, storage lot or RV
  park, so where the vehicle sits, water access and shade shape the quote [judgment]. City water is hard (about 19
  grains per gallon), and summer heat can make products dry fast on hot paint. Ask Hava collects vehicle type and
  size, the service, condition and site details, then sends an anonymous job card. Businesses quote in their own
  words.
job_types:
  - id: interior_detail
    label: "Interior detail (vacuum, seats, carpets, dash, glass)"
    site_visit_usually_needed: "no"
    handyman_ok: "yes"
  - id: exterior_detail
    label: "Exterior detail (hand wash, wax or sealant, wheels, trim)"
    site_visit_usually_needed: "no"
    handyman_ok: "yes"
  - id: full_detail
    label: "Full detail (inside and out)"
    site_visit_usually_needed: "no"
    handyman_ok: "yes"
  - id: rv_large_vehicle
    label: "RV, trailer or other large vehicle detailing"
    site_visit_usually_needed: "sometimes"
    handyman_ok: "yes"
  - id: ceramic_paint_correction
    label: "Ceramic coating or paint correction (polish out swirls)"
    site_visit_usually_needed: "sometimes"
    handyman_ok: "yes"
  - id: odor_pet_hair
    label: "Odor, smoke smell or heavy pet hair"
    site_visit_usually_needed: "no"
    handyman_ok: "yes"
