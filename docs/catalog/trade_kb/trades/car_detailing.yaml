    then_route_to: none
    note: "Routing: 911 text first, no card. [judgment]"
  - id: es_car_detailing_routine
    signal: "Routine detailing, dirt, stains, smells or pet hair"
    emergency: "no"
    safety_step: ""
    source: "[judgment]"
    then_route_to: car_detailing
    note: "Not an emergency. Normal intake. [judgment]"
safety_step: []
license_classes:
  - job_type: [interior_detail, exterior_detail, full_detail, rv_large_vehicle, ceramic_paint_correction, odor_pet_hair]
    work: "Vehicle cleaning, polish and coating"
    classes: ["none"]
    citation: "foundation az_license_master §5 [judgment]; A.R.S. 32-1121 [S4]"
    other_agency: "Lake Havasu City business license for business done within city limits; some businesses also need a privilege tax license (https://www.lhcaz.gov/business-license)"
    notes: "No ROC license is needed. Vehicles are not structures, so this is not contracting under ROC rules [judgment]. RV roof repair or resealing goes to rv_services [judgment]."
handyman_ok:
  allowed_examples:
    - "All vehicle detailing (not construction, so the exemption is not needed) [judgment]"
  not_allowed_examples:
    - "Not applicable: no ROC work in this trade [judgment]"
  rule_reminder: "Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit; and any ad says 'not a licensed contractor'. Never covers work connected to natural gas, propane or other fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]"
  note: "Detailing is not contracting; handyman_ok is shown as yes because no ROC license is involved. The catalog row has handyman_allowed false, so the handyman category does not take these cards. [judgment]"
local_notes:
  - "Mobile detailing at the home, storage lot or RV park is the norm here, so the card should say where the vehicle is and what is on site. [judgment]"
  - "Summer heat runs June to September. Some coating makers say not to apply in direct sunlight and to work at about 5 to 25 C (41 to 77 F), so shade, a garage or early hours matter for paint work. Sources: Gtechniq Crystal Serum Light product page (https://theragcompany.com/products/gtechniq-crystal-serum-light); Britemax Amethyst Quartz instructions (https://cleanandshiny.co.uk/pages/britemax-amethyst-quartz-7h-instructions)."
  - "City water is hard, about 19 grains per gallon (range 18 to 20), so tap water that dries on paint or glass can leave white spots. Some detailers bring filtered water. Hardness: Lake Havasu City water quality report (https://www.lhcaz.gov/DocumentCenter/View/3233); the rest is [judgment]."
  - "Lake Havasu City stormwater tips say: if you wash your vehicle at home, wash it on an unpaved surface, not the driveway, and never put illicit discharges into a storm drain, wash or drainage ditch. Source: https://www.lhcaz.gov/docs/default-source/department-documents/stormwaterfactsheet.pdf?sfvrsn=4. Whether the city has a specific rule for mobile detailers was not checked [unverified]."
  - "Monsoon storms, roughly July to September, bring dust and wind that coat vehicles and RVs. [judgment; see part1 monsoon note]"
  - "Many seasonal residents store RVs, trailers and side-by-sides in storage lots or at vacant second homes. Some lots may not allow washing or have no water. [judgment]"
  - "HOAs may limit washing or commercial work in driveways. [judgment]"
  - "Side-by-sides and trucks often come back from desert trails caked in mud or dust. [judgment]"
  - "Boats go to boat_dock (detailing job type), which the boat_detailing category uses. [judgment]"
sample_card: |
  REQ-0142 | Car, truck and RV detailing | Lake Havasu City, south side
  Full-size pickup, inside and outside. Lots of dog hair on cloth seats, dust on body.
  Parked at home in a driveway, water spigot, no shade. 3 photos.
