- id: palm_trim
  label: Palm trimming (fronds, seed pods, skinning)
- id: tree_prune
  label: Prune or thin mesquite, palo verde, ironwood, other tree
- id: tree_removal
  label: Remove a tree or palm
  site_visit_usually_needed: 'yes'
- id: stump
  label: Stump grinding or removal
- id: storm_damage
  label: Tree or big limb down after wind/monsoon
  site_visit_usually_needed: 'yes'
- id: haul
  label: Haul away branches/fronds
- id: near_power_lines
  label: Tree touching or near power lines (route to utility)
