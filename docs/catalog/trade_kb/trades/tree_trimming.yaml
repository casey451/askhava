    - https://www.uesaz.com/vegetation-management/
  other_agency: null
  notes: ''
handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: Yes for trimming (gardener exemption, A.R.S. 32-1121(A)(16)). Never for work near power lines; that goes
    to UniSource.
local_notes:
- 'UniSource Energy Services is the electric utility in Lake Havasu City; it clears around distribution lines on
  a cycle (about every 3 years), and homeowners are responsible for keeping trees away from the service drop to
  the house. Source: UniSource Energy Services, Vegetation Management (15 ft clearance, free temporary disconnect,
  [number removed, see source]) - https://www.uesaz.com/vegetation-management/'
- Monsoon winds often break palo verde and mesquite limbs [judgment].
- Palm skirts can hide bees, pigeons, rats and scorpions [judgment].
- Green waste rules and dump fees were not checked [open question].
sample_card: 'REQ-0425 | Palm trimming

  Lake Havasu City, Havasu Foothills area

  4 fan palms about 30 ft, back yard, side gate access. Trim fronds and seed pods, haul away.

  No power lines nearby per homeowner.'
