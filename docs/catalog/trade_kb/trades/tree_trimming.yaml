# Ask Hava trade knowledge file: tree_trimming
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: tree_trimming
display_name: Tree & palm trimming
summary: 'Tree and palm work: palm trimming (frond and seed-pod removal, ''skinning'' trunks), mesquite and palo
  verde pruning and thinning, tree removal, stump grinding, storm cleanup after monsoon winds, and hauling. Work
  near overhead power lines is not sent to businesses: Ask Hava points the homeowner to UniSource Energy Services
  first. Ask Hava never judges if a tree is safe or sick.'
