questions:
- id: power_lines
  text: Is the tree within about 15 feet of a power line?
  options:
  - Yes, touching or very close
  - Maybe / not sure
  - 'No'
  ask_if: always
  changes_price: 'no'
- id: tree_type
  text: What kind of tree?
  options:
  - Palm
  - Mesquite
  - Palo verde
  - Other / not sure
  ask_if: power_lines != Yes, touching or very close
  changes_price: 'yes'
- id: work_kind
  text: What do you want done?
  options:
  - Trim
  - Remove
  - Remove plus stump
  - Stump only
  - Clean up fallen tree
  ask_if: power_lines != Yes, touching or very close
  changes_price: 'yes'
- id: height
  text: About how tall is it?
  options:
  - Under 15 ft (one story)
  - 15-30 ft (two story)
  - Over 30 ft
  - Not sure
  ask_if: power_lines != Yes, touching or very close
  changes_price: 'yes'
- id: count
  text: How many trees or palms?
  options:
  - '1'
  - 2-3
  - 4-6
  - More than 6
  ask_if: power_lines != Yes, touching or very close
  changes_price: 'yes'
- id: access
  text: Can a truck or lift get near it?
  options:
  - Yes, open access
  - Only through a side gate
  - Back yard, no gate access
  - Over a pool, roof or wall
  ask_if: work_kind != Stump only
  changes_price: 'yes'
quote_without_visit_needs:
- Full-height photo of each tree with the house for scale
- Count of palms/trees
- Access path photo (gate width)
- What is under the tree (pool, roof, wall, yard)
- Whether debris should be hauled away
site_visit_usually_needed:
- tree_removal (large)
- storm_damage
- trees over structures
photos_to_request:
- id: p1
  ask: Whole tree from far enough to see the top
  for_job_types:
  - all
- id: p2
  ask: Where it is near the house, pool or wall
  for_job_types:
  - all
- id: p3
  ask: Overhead wires near the tree
  for_job_types:
  - all
- id: p4
  ask: Gate or access path
  for_job_types:
  - all
- id: p5
  ask: Any split, crack or leaning base
  for_job_types:
  - all
photo_cues:
- photo_id: all
  look_for:
  - Height vs roof line
  - 'Dead skirt of fronds on fan palms [judgment: fire and pest habitat]'
  - Lean, cracked trunk or lifted soil
  - 'Bees flying in and out of palm skirt or tree cavity [judgment: Africanized bees often nest there]'
photo_red_flags:
- flag: Branches touching or near overhead wires
  safety_step_ref: es_tree_or_limb_on_a_power_line
- flag: Tree on a house or car
  safety_step_ref: null
- flag: Bees swarming in the tree
  safety_step_ref: es_bee_swarm_in_tree_attacking
- flag: Downed wire under the tree
  safety_step_ref: es_downed_power_line
emergency_signals:
- id: es_tree_or_limb_on_a_power_line
  signal: Tree or limb on a power line
  emergency: 'yes'
  safety_step: Do not trim it or let anyone trim it. Call UniSource Customer Care at [number removed, see source]; they can schedule
    a free temporary disconnect so work is safe. Keep trees 15 feet from overhead lines.
  source: UniSource Energy Services, Vegetation Management (15 ft clearance, free temporary disconnect, [number removed, see source])
    - https://www.uesaz.com/vegetation-management/
  then_route_to: tree_trimming
- id: es_downed_power_line
  signal: Downed power line
  emergency: 'yes'
  safety_step: Stay far away from the line and anything touching it, and call 911.
  source: UniSource Energy Services, Vegetation Management (15 ft clearance, free temporary disconnect, [number removed, see source])
    - https://www.uesaz.com/vegetation-management/
  then_route_to: tree_trimming
- id: es_tree_fell_on_house_with_people
  signal: Tree fell on house with people inside or damage
  emergency: 'yes'
  safety_step: Leave them alone and keep others away. If attacked, run to a car or building and cover your face.
    Do not jump into a pool. Call 911 for a serious attack.
  source: USDA ARS Carl Hayden Bee Research Center, Bee Safety - https://www.ars.usda.gov/pacific-west-area/tucson-az/carl-hayden-bee-research-center/docs/bee-safety/bee-safety/
  then_route_to: tree_trimming
- id: es_bee_swarm_in_tree_attacking
  signal: Bee swarm in tree attacking
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: tree_trimming
safety_step:
- when: Tree touching or near power lines
  step: Do not trim it or let anyone trim it. Call UniSource Customer Care at [number removed, see source]; they can schedule a
    free temporary disconnect so work is safe. Keep trees 15 feet from overhead lines.
  source: UniSource Energy Services, Vegetation Management (15 ft clearance, free temporary disconnect, [number removed, see source])
    - https://www.uesaz.com/vegetation-management/
- when: Downed power line
  step: Stay far away from the line and anything touching it, and call 911.
  source: UniSource Energy Services, Vegetation Management (15 ft clearance, free temporary disconnect, [number removed, see source])
    - https://www.uesaz.com/vegetation-management/
- when: Bees in the tree
  step: Leave them alone and keep others away. If attacked, run to a car or building and cover your face. Do not
    jump into a pool. Call 911 for a serious attack.
  source: USDA ARS Carl Hayden Bee Research Center, Bee Safety - https://www.ars.usda.gov/pacific-west-area/tucson-az/carl-hayden-bee-research-center/docs/bee-safety/bee-safety/
- when: Chainsaw or loud tools near bees
  step: Check for bee colonies before using loud tools; noise and vibration can set them off.
  source: USDA ARS Carl Hayden Bee Research Center, Bee Safety - https://www.ars.usda.gov/pacific-west-area/tucson-az/carl-hayden-bee-research-center/docs/bee-safety/bee-safety/
