# Ask Hava trade knowledge file: electrical
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: electrical
display_name: Electrical (panels, outlets, wiring, lighting)
summary: 'Home electrical work on the owner''s side of the meter: outlets, switches, GFCI/AFCI, lights and fans,
  breakers tripping, partial power loss, panel upgrades and change-outs, sub-panels, new circuits (AC, spa, shop,
  EV), rewires, smoke alarms (hardwired) and outdoor lighting. UniSource Energy Services owns the meter and the
  line to the house; Ask Hava routes outages and downed lines to UniSource and 911 [S24][S25]. Ask Hava learns what
  is happening, how much of the home is affected, the panel brand from a photo and the home''s age, then writes
  a card. It never says what failed, that a panel is unsafe, or that work is needed. Licensed work is ROC R-11 Electrical
  / CR-11 [S2][S3]. Panel change-outs, electrical updates and rewires need an LHC permit [S17]. Hardwired or interconnected
  smoke alarms are never handyman work (A.R.S. 32-1121(D)(1)) [S4].'
