questions:
- id: q1_problem
  text: What is going on?
  options:
  - Burning smell, sparks or hot outlet
  - No power in part of the home
  - Breaker keeps tripping
  - Install or replace something
  - Panel or bigger upgrade
  - Lights flicker
  ask_if: always
  changes_price: 'yes'
  why: Hazards come first; installs and upgrades are quoted very differently. [judgment]
- id: q2_scope
  text: How much is involved?
  options:
  - One outlet, switch or light
  - A few in one room
  - A whole room or circuit
  - Whole home
  - Not sure
  ask_if: q1_problem != 'Burning smell, sparks or hot outlet'
  changes_price: 'yes'
  why: Count of devices or circuits drives labor. [judgment]
- id: q3_panel
  text: Can you send a photo of your electrical panel with the door open and the label inside the door?
  options:
  - Sent a photo
  - Can't get to it
  - Not sure where it is
  ask_if: q1_problem in ['No power in part of the home', 'Breaker keeps tripping', 'Panel or bigger upgrade', 'Lights
    flicker'] or job_type in [new_circuit, rewire, panel_upgrade]
  changes_price: 'yes'
  why: Brand, amps and open spaces shape panel and circuit quotes. [judgment]
- id: q4_age
  text: About when was the home built?
  options:
  - Before 1975
  - 1975-1995
  - 1996-2010
  - After 2010
  - Manufactured home
  - Not sure
  ask_if: job_type in [rewire, panel_upgrade, flicker_dim, partial_power]
  changes_price: 'yes'
  why: Older wiring types and manufactured-home rules affect the work. [ARS-4047][judgment]
- id: q5_access
  text: Where is the work?
  options:
  - Inside, single story
  - Inside, high ceiling or 2-story
  - Garage
  - Outside or in the yard
  - Attic
  ask_if: q1_problem == 'Install or replace something' or job_type in [new_circuit, outdoor_lighting]
  changes_price: 'yes'
  why: Ladders, attic runs and trenching change labor. [judgment]
quote_without_visit_needs:
- Like-for-like device swaps with a count and photos [judgment]
- Ceiling fan or fixture install with ceiling height, existing box photo and whether the fan is supplied [judgment]
- Smoke alarm replacement count and photo of the existing alarm [judgment]
site_visit_usually_needed:
- Tripping, partial power, flicker, burning smell (troubleshooting) [judgment]
- Panel upgrades and service changes (UniSource coordination, permit) [S17][judgment]
- Rewires and aluminum wiring repair [CPSC-ALWIRE][judgment]
- New circuits with long runs or trenching [judgment]
photos_to_request:
- id: p1_panel
  ask: A photo of your breaker panel with the door open, plus one of the label on the inside of the door. Do not
    remove any covers.
  for_job_types:
  - partial_power
  - breaker_tripping
  - panel_upgrade
  - new_circuit
  - rewire
  - flicker_dim
- id: p2_device
  ask: A photo of the outlet, switch or light. If it is hot, smoking or sparking, do not go near it; skip the photo.
  for_job_types:
  - outlet_switch
  - lighting_fan
  - burning_sparks
  - outdoor_lighting
- id: p3_location
  ask: A photo of where you want the new outlet, light or circuit, and the path to the panel if you know it.
  for_job_types:
  - new_circuit
  - lighting_fan
  - outdoor_lighting
- id: p4_meter
  ask: A photo of the meter and panel on the outside wall, from a step back.
  for_job_types:
  - panel_upgrade
  - whole_home_out
- id: p5_alarm
  ask: A photo of one smoke alarm, front and back if it comes down easily.
  for_job_types:
  - smoke_alarm
photo_cues:
- photo_id: p1_panel
  look_for:
  - 'Brand on label: Federal Pacific Electric (FPE) with ''Stab-Lok'' breakers (often red-tipped handles); CPSC
    closed its 1983 investigation, saying test data did not establish a serious risk, but some breakers did not
    meet UL tests. Record the brand only [CPSC-FPE]'
  - Zinsco or Sylvania-Zinsco (colorful breaker handles, thin breakers) [judgment]
  - Main breaker size (100, 125, 150, 200 amps) on the main handle [judgment]
  - Open breaker spaces or tandem breakers [judgment]
  - Scorch marks, melted plastic, rust or water stains (do not open the dead front) [judgment]
  - 'Aluminum branch wiring: dull silver wire or ''AL'' marks; CPSC lists warm faceplates, flicker and burning smell
    as warning signs [CPSC-ALWIRE]'
  - Fuses instead of breakers [judgment]
  neutral_wording_example: Panel label reads Federal Pacific Electric, 100 amp main; two open spaces; no scorch
    marks visible.
- photo_id: p2_device
  look_for:
  - Discoloration, melting, cracked faceplate; two-prong outlets; GFCI test buttons [judgment]
  neutral_wording_example: Outlet faceplate shows brown discoloration around the left slot.
- photo_id: p4_meter
  look_for:
  - Overhead vs underground service; meter/main combo; panel location [judgment]
  neutral_wording_example: Meter and panel combo on the side wall; underground service.
- photo_id: p5_alarm
  look_for:
  - Wires on the back = hardwired; date on back; ionization vs photoelectric label [judgment]
  - NFPA says replace smoke alarms when they are 10 years old [S28]
  neutral_wording_example: Hardwired smoke alarm; back label dated 2012.
- photo_id: p3_location
  look_for:
  - Distance to panel; wall type; outdoor run [judgment]
  neutral_wording_example: Wants a 240V outlet on the far garage wall about 30 ft from the panel.
photo_red_flags:
- flag: Scorch marks, melted plastic or smoke at an outlet, switch or panel
  safety_step_ref: es_burning
- flag: Water inside or dripping on the panel
  safety_step_ref: es_water
- flag: Panel cover removed with bare wires exposed
  safety_step_ref: es_burning
- flag: Power line down or sagging in the yard
  safety_step_ref: es_downed
emergency_signals:
- id: es_burning
  signal: Burning smell, sparks, smoke, buzzing or a hot outlet, switch or panel
  emergency: 'yes'
  safety_step: 'NFPA says to call a qualified electrician for a burning or rubbery smell, sparks, warm or discolored
    outlets or switches, flickering lights, or breakers that trip often. Stop using the outlet, switch or appliance
    involved. If there is smoke or fire, get out and call 911. If there is smoke, flames or sparks that will not
    stop: get everyone out, stay out, and call 911 from outside.'
  source: '[S29][NFPA-ESCAPE]'
  then_route_to: electrical
- id: es_shock
  signal: Someone was shocked or there is a fire at the panel
  emergency: 'yes'
  safety_step: 'If there is smoke, flames or sparks that will not stop: get everyone out, stay out, and call 911
    from outside. UniSource says most panels have a main switch; use it to cut all power in case of fire or shock,
    and if there is no main switch, turn off all breakers. Do this only if you can reach the panel safely and are
    not standing in water. Do not tamper with the electric meter.'
  source: '[NFPA-ESCAPE][S24]'
  then_route_to: electrical
- id: es_downed
  signal: Power line down, sagging or sparking outside
  emergency: 'yes'
  safety_step: Stay far away from any downed or sagging power line and anything it touches. Assume it is live. Call
    911 and the UniSource 24/7 line, [number removed, see source]. Never try to move tree limbs or debris touching a line. If
    a line falls on a vehicle you are in, stay inside until help arrives.
  source: '[S24][S25]'
  then_route_to: none
- id: es_water
  signal: Water near or in the panel, outlets or cords
  emergency: 'yes'
  safety_step: If water is near outlets, cords or the electrical panel, do not walk into the water. Turn off power
    at the main breaker only if you can reach it from a dry place; never switch power while standing in water. Keep
    power off until an electrician checks it.
  source: '[S31]'
  then_route_to: electrical
- id: es_outage
  signal: Whole home or whole street has no power
  emergency: depends
  safety_step: Report outages to the UniSource 24/7 line, [number removed, see source]. UniSource says to turn off electronics
    that were on, leave one light on to show when power is back, and keep fridge and freezer doors closed. If an
    outage puts someone at risk in the heat, see heat steps.
  source: '[S25]'
  then_route_to: none
- id: es_smoke_alarm
  signal: Smoke alarm sounding with smoke or fire
  emergency: 'yes'
  safety_step: 'If there is smoke, flames or sparks that will not stop: get everyone out, stay out, and call 911
    from outside.'
  source: '[NFPA-ESCAPE]'
  then_route_to: none
safety_step:
- when: Burning smell, sparks, smoke, buzzing or a hot outlet, switch or panel
  step: 'NFPA says to call a qualified electrician for a burning or rubbery smell, sparks, warm or discolored outlets
    or switches, flickering lights, or breakers that trip often. Stop using the outlet, switch or appliance involved.
    If there is smoke or fire, get out and call 911. If there is smoke, flames or sparks that will not stop: get
    everyone out, stay out, and call 911 from outside.'
  source: '[S29][NFPA-ESCAPE]'
- when: Someone was shocked or there is a fire at the panel
  step: 'If there is smoke, flames or sparks that will not stop: get everyone out, stay out, and call 911 from outside.
    UniSource says most panels have a main switch; use it to cut all power in case of fire or shock, and if there
    is no main switch, turn off all breakers. Do this only if you can reach the panel safely and are not standing
    in water. Do not tamper with the electric meter.'
  source: '[NFPA-ESCAPE][S24]'
- when: Power line down, sagging or sparking outside
  step: Stay far away from any downed or sagging power line and anything it touches. Assume it is live. Call 911
    and the UniSource 24/7 line, [number removed, see source]. Never try to move tree limbs or debris touching a line. If a line
    falls on a vehicle you are in, stay inside until help arrives.
  source: '[S24][S25]'
- when: Water near or in the panel, outlets or cords
  step: If water is near outlets, cords or the electrical panel, do not walk into the water. Turn off power at the
    main breaker only if you can reach it from a dry place; never switch power while standing in water. Keep power
    off until an electrician checks it.
  source: '[S31]'
- when: Smoke alarm sounding with smoke or fire
  step: 'If there is smoke, flames or sparks that will not stop: get everyone out, stay out, and call 911 from outside.'
  source: '[NFPA-ESCAPE]'
license_classes:
- job_type:
  - outlet_switch
  classes:
  - R-11 Electrical
  - CR-11 Electrical (dual)
  citation: 'A.A.C. R4-9-103 (R-11: install and repair residential electrical systems); R4-9-104 (CR-11)'
  other_agency: UniSource owns and services the meter and service line; do not tamper with the meter [S24]
  notes: Same classes for all job types. C-11 is commercial only [S1]. General contractors (B, B-3) must subcontract
    electrical [S2]. R-39 may add a circuit for AC equipment to an existing panel but not a new panel or sub-panel
    [S2].
- job_type:
  - panel_upgrade
  classes:
  - R-11
  - CR-11
  citation: R4-9-103; R4-9-104
  other_agency: UniSource for service disconnect/reconnect and any service size change [S22][judgment]
  notes: Panel change-outs need an LHC permit [S17].
- job_type:
  - smoke_alarm
  classes:
  - R-11
  - CR-11
  - R-16 Fire Protection Systems (low-voltage signaling only; other electrical wiring must be subcontracted per
    R4-9-103)
  citation: R4-9-103; A.R.S. 32-1121(D)(1); A.A.C. R4-9-104 [S3] (CR- dual classes)
  other_agency: null
  notes: Hardwired or interconnected smoke alarms are never under the handyman exemption [S4]. Battery-only alarm
    swaps are not contracting work under ROC rules [judgment].
- job_type:
  - rewire
  classes:
  - R-11
  - CR-11
  citation: R4-9-103; R4-9-104
  other_agency: 'Manufactured homes: alterations only by a licensed or certified person (A.R.S. 41-4047(5)) [ARS-4047]'
  notes: Rewires need an LHC permit [S17].
handyman_ok:
  allowed_examples:
  - Replace a few outlets or switches like-for-like, under $1,000, no permit [S4][judgment]
  - Swap a light fixture or ceiling fan on an existing fan-rated box, under $1,000 [judgment]
  - Plug-in items do not count toward the $1,000 total if unaltered [S4]
  not_allowed_examples:
  - 'Hardwired or interconnected smoke alarms: excluded by 32-1121(D)(1) [S4]'
  - Panel change-outs, rewires and electrical updates (LHC permit) [S17]
  - New circuits [S17][judgment]
  - Any job $1,000 or more [S4]
  rule_reminder: 'A person without an ROC license may take a job only if ALL are true: total price (labor + materials
    + everything) is under $1,000; the work is casual, minor or inconsequential; no local building permit is required;
    it is not part of a larger job or split up to stay under $1,000; and any ad says ''not a licensed contractor''.
    The exemption never covers work that connects to natural gas, propane or other fuel gas, or fire-safety work
    such as hardwired/interconnected smoke alarms. Source: A.R.S. 32-1121(A)(14) and (D) [S4]. In Lake Havasu City,
    check the city permit list: a needed permit removes the exemption [S17].'
local_notes:
- UniSource Energy Services is the electric utility in Lake Havasu City; 24/7 outage and emergency line [number removed, see source];
  local electric office [number removed, see source] [S22].
- 'UniSource: keep tools and bodies at least 15 ft from overhead lines, including when servicing a roof swamp cooler;
  owners keep foliage 15 ft from service lines and can ask UniSource to turn power off at no cost [S24].'
- 'UniSource''s wiring checklist: breakers trip often, appliances don''t heat fully, TV picture shrinks when appliances
  run, or extension cords used for lack of outlets: have the home inspected by a qualified technician [S24].'
- LHC uses the 2023 NEC; panel change-outs, rewires and electrical updates need a permit [S17].
- Summer AC loads are high; flicker or trip requests spike in hot months [judgment].
- Many Havasu homes from the 1960s-70s and many manufactured homes may have older panels or aluminum branch wiring;
  record only what photos show [CPSC-ALWIRE][judgment].
- Monsoon storms can cause outages and surges; outages route to UniSource, not a card [S25][judgment].
- 'NFPA: test AFCI/GFCI devices monthly; call a qualified electrician for frequent trips, warm outlets, burning
  smells, flicker or sparks [S29].'
sample_card: 'REQ-0193 | Electrical | Lake Havasu City, east

  Breaker for kitchen counter outlets trips several times a day. Single-story, built about 1985.

  Panel photo: label reads Zinsco, 125 amp. No scorch marks seen.'
