# Ask Hava trade knowledge file: rv_services
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: rv_services
display_name: RV services
summary: 'Mobile and shop RV services for motorhomes, travel trailers and fifth wheels: roof leaks and roof coatings,
  AC units (rooftop), slide-outs and awnings, water heaters, furnaces and fridges (propane/electric), generators,
  plumbing and tanks, batteries and solar, tires and brakes, detailing and wash. Lake Havasu has many winter visitors
  and RV parks, and summer heat is hard on rooftop AC and roof sealant [judgment]. Ask Hava never says what is wrong
  with the RV.'
