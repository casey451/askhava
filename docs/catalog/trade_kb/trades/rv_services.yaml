  citation: A.A.C. R4-9-103 Residential contractor license classes (Cornell LII copy) - https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-9-103
  other_agency: null
  notes: ''
handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: 'Yes for repairs on the RV itself [judgment: vehicle, not ROC work]. Not for a new RV power pedestal or
    sewer hookup at a house, which is ROC electrical or plumbing work. A.R.S. 32-1121(A)(14): a person may do ''casual
    or minor'' work without an ROC license only if the whole job (labor, materials, everything) is under $1,000,
    no building permit is needed, it is not part of a larger job or split up to get under the limit, and their ads
    say ''not a licensed contractor''. Per 32-1121(D) the exemption never covers work that connects to natural gas,
    propane or other fuel gas, or hardwired/interconnected fire-safety devices. Lake Havasu City''s permit list
    decides whether a permit is needed (https://www.lhcaz.gov/development-permitting/building).'
local_notes:
- Many winter visitors stay in RVs in and around Lake Havasu City from fall to spring [judgment].
- Summer heat and UV wear roof sealant, tires and rooftop AC hard [judgment].
- HOA or RV park rules may limit mobile repairs on site [judgment].
