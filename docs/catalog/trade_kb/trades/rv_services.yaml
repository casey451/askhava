photo_cues:
- photo_id: all
  look_for:
  - Cracked sealant around roof vents and AC
  - Soft spots or ceiling stains
  - Tire sidewall cracking from sun [judgment]
  - Burned or melted shore power plug
photo_red_flags:
- flag: Melted shore power plug or outlet
  safety_step_ref: es_smoke_or_burning_smell_from_el
- flag: Propane tank or line damage
  safety_step_ref: es_smell_of_propane_or_lp_alarm_s
- flag: Swollen or leaking batteries
  safety_step_ref: es_battery_swelling_hissing_or_sm
- flag: Soot near furnace or water heater vents
  safety_step_ref: es_co_alarm_sounding_or_people_di
emergency_signals:
- id: es_smell_of_propane_or_lp_alarm_s
  signal: Smell of propane or LP alarm sounding
  emergency: 'yes'
  safety_step: Leave the RV now. Do not use lights, switches or phones inside, and no flames. If safe, close the
    tank valve (turn clockwise). Call 911 or the propane supplier from a safe place, and do not go back in until
    it is checked.
  source: Propane Education and Research Council, Safety Guide for Propane Users - https://propane.com/safety/safety-guide-for-propane-users/
  then_route_to: rv_services
- id: es_co_alarm_sounding_or_people_di
  signal: CO alarm sounding or people dizzy, headache, sick
  emergency: 'yes'
  safety_step: Get everyone out to fresh air and call 911. CO has no color or smell.
  source: CDC, Carbon Monoxide Poisoning basics - https://www.cdc.gov/carbon-monoxide/
  then_route_to: rv_services
- id: es_smoke_or_burning_smell_from_el
  signal: Smoke or burning smell from electrical
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: rv_services
- id: es_battery_swelling_hissing_or_sm
  signal: Battery swelling, hissing or smoking
  emergency: 'yes'
  safety_step: Get away from it and call 911. Do not try to put out a lithium battery fire.
  source: NFPA, Lithium-Ion Battery Safety - https://www.nfpa.org/education-and-research/energy-transition/lithium-ion-batteries
    ; U.S. Fire Administration (FEMA), Lithium-ion batteries community education - https://www.usfa.fema.gov/a-z/lithium-ion-batteries/community-education/
  then_route_to: rv_services
safety_step:
- when: Propane smell or LP alarm
  step: Leave the RV now. Do not use lights, switches or phones inside, and no flames. If safe, close the tank valve
    (turn clockwise). Call 911 or the propane supplier from a safe place, and do not go back in until it is checked.
  source: Propane Education and Research Council, Safety Guide for Propane Users - https://propane.com/safety/safety-guide-for-propane-users/
- when: CO alarm or people feel sick
  step: Get everyone out to fresh air and call 911. CO has no color or smell.
  source: CDC, Carbon Monoxide Poisoning basics - https://www.cdc.gov/carbon-monoxide/
- when: Battery smoking or hissing
  step: Get away from it and call 911. Do not try to put out a lithium battery fire.
  source: NFPA, Lithium-Ion Battery Safety - https://www.nfpa.org/education-and-research/energy-transition/lithium-ion-batteries
    ; U.S. Fire Administration (FEMA), Lithium-ion batteries community education - https://www.usfa.fema.gov/a-z/lithium-ion-batteries/community-education/
- when: Hot weather
  step: If the AC fails in summer, get people and pets to a cool place; heat can kill.
  source: National Weather Service, Heat Safety - https://www.weather.gov/safety/heat
