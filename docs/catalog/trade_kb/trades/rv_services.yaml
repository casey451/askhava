questions:
- id: rv_type
  text: What kind of RV?
  options:
  - Motorhome (Class A)
  - Motorhome (Class C or B)
  - Travel trailer
  - Fifth wheel / toy hauler
  - Truck camper / other
  ask_if: always
  changes_price: 'yes'
- id: problem_area
  text: What needs work?
  options:
  - Roof or leak
  - AC
  - Slide-out or awning
  - Propane appliance
  - Generator
  - Plumbing or tanks
  - Electrical / batteries / solar
  - Tires, brakes or hitch
  - Wash / detail
  - Inspection
  ask_if: always
  changes_price: 'yes'
- id: rv_length
  text: How long is the RV?
  options:
  - Under 25 ft
  - 25-35 ft
  - Over 35 ft
  - Not sure
  ask_if: problem_area in [Roof or leak, Wash / detail, Inspection]
  changes_price: 'yes'
- id: mobile_or_shop
  text: Where can the work happen?
  options:
  - Mobile, at my home or lot
  - At an RV park
  - I can bring it to a shop
  - It can't move right now
  ask_if: always
  changes_price: 'yes'
- id: propane_smell
  text: Do you smell gas or did the propane alarm go off?
  options:
  - 'Yes'
  - 'No'
  ask_if: problem_area == Propane appliance
  changes_price: 'no'
- id: brand_model
  text: Do you know the year and brand?
  options:
  - Yes - I'll type it
  - I'll send a photo of the sticker
  - Not sure
  ask_if: always
  changes_price: 'no'
