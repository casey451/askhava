# Ask Hava trade knowledge file: security_alarm
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: security_alarm
display_name: Security & Alarm Systems
summary: Burglar alarm installs and repairs, monitoring setup, cameras and video doorbells, smart-home security,
  and fire/smoke alarm systems. Alarm businesses and agents must be certified by the AZ Board of Technical Registration
  (A.R.S. 32-122.05/.06; agents need a DPS fingerprint clearance card). ROC R-67 covers low-voltage alarm installs.
  The A.R.S. 32-101 'alarm business' definition leaves out fire alarm systems, which fall under ROC R-16 Fire Protection;
  hardwired or interconnected smoke alarms are never handyman work (32-1121(D)).
