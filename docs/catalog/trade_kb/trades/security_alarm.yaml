safety_step:
- when: Smoke alarm sounding
  step: Get out, stay out, call 911.
  source: '[T-nfpa_sounds]'
- when: CO alarm (4 beeps, pause, repeat)
  step: Go outside or to an open window or door, call 911, stay there until help arrives.
  source: '[T-nfpa_sounds]'
- when: Chirp every 30-60 seconds
  step: That usually means a low battery; an alarm 10 years old or older should be replaced.
  source: '[T-nfpa_sounds]'
license_classes:
- job_type:
  - burglar_alarm
  - smart_home
  - false_alarms
  - cameras
  classes:
  - R-67
  - CR-67
  citation: '[S7]; [S8]; [T-ars_32_121]; A.A.C. R4-9-103 [S2] R-67; R4-9-104 [S3] CR-67'
  other_agency: AZ Board of Technical Registration
  notes: 'Alarm business and agents: BTR certification (agents need a DPS fingerprint clearance card and must apply
    within 5 working days of hire). Install: ROC R-67 / CR-67 Low Voltage Communication Systems. Under 32-121 an
    alarm business may install while its BTR application is pending, or if it is an ROC licensee.'
- job_type:
  - fire_alarm
  classes:
  - R-16
  citation: A.A.C. R4-9-103 [S2] R-16; [S5]; A.R.S. 32-1121(D)(1) [S4]
  other_agency: none
  notes: 'Fire alarm and sprinkler systems: ROC R-16 Fire Protection. The 32-101 alarm business definition excludes
    fire alarm systems. Hardwired/interconnected smoke alarms are never handyman work.'
- job_type:
  - cameras
  classes:
  - R-67
  citation: foundation §5 [judgment]; A.A.C. R4-9-103 [S2] (R- residential classes)
  other_agency: none
  notes: 'Plug-in or battery cameras may be self-installed; wired cameras tied to an alarm system: R-67 + BTR [judgment
    on cameras-only].'
handyman_ok:
  allowed_examples:
  - Battery smoke/CO alarm swaps
  - Plug-in camera or battery doorbell mounting
  not_allowed_examples:
  - Hardwired or interconnected smoke alarms (32-1121(D))
  - Alarm system install for pay without BTR certification
  - Fire alarm systems
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'Lake Havasu City Code Ch. 8.12 covers security alarms (false alarms, possible user rules); details not confirmed
  [unverified]. Source: [T-lhc_alarm].'
- 'Smoke alarms should be replaced every 10 years. Source: [S28].'
- 'Vacation rental owners often want remote cameras and noise sensors [judgment]. City rental rules: [T-lhc_vr].'
