questions:
- id: q1_what
  text: What do you need?
  options:
  - New alarm system
  - Cameras or video doorbell
  - Fix or update an alarm
  - Smoke/fire alarms
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Burglar alarms, cameras and fire alarms are different scopes and licenses.
- id: q2_wired
  text: Wired or wireless?
  options:
  - Wired (wires in walls)
  - Wireless/battery
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Wired systems take more labor and need licensed low-voltage work.
- id: q3_size
  text: How many doors, windows or cameras?
  options:
  - 1-4
  - 5-10
  - 11+
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Number of sensors or cameras drives equipment and labor.
- id: q4_monitoring
  text: Do you want 24/7 monitoring?
  options:
  - 'Yes'
  - No, self-monitor on phone
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Monitoring is an ongoing contract on top of the install.
- id: q5_existing
  text: Is there an old system in the home now?
  options:
  - Yes, working
  - Yes, not working
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Reusing old wiring or panels can change the job. [judgment]
