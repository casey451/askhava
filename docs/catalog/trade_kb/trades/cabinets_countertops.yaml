# Ask Hava trade knowledge file: cabinets_countertops
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: cabinets_countertops
display_name: Cabinets & Countertops
summary: Cabinet install, repair and refacing; countertop install and repair in granite, quartz (engineered stone),
  laminate, solid surface and tile. ROC R-60 Finish Carpentry lists cabinets and countertops; R-48 covers tile tops.
  Disconnecting and reconnecting sinks, faucets and disposals is plumbing work, and any gas cooktop reconnection
  is never handyman work. Cutting engineered stone makes silica dust (OSHA/NIOSH hazard alert), so shops fabricate
  off site and do minimal cutting in the home [judgment].
