  note: 'Routing: none (leave, call 911 and UES)'
- id: es_cabinets_countertops_3
  signal: Cosmetic chip or loose hinge
  emergency: 'no'
  safety_step: No special safety step; normal job card.
  source: none
  then_route_to: cabinets_countertops
safety_step:
- when: Gas smell
  step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call 911
    and UniSource at [number removed, see source].
  source: '[S23][S22]'
- when: Engineered stone cutting
  step: Silica dust from cutting engineered stone can cause serious lung disease; wet methods and dust controls
    are required for workers.
  source: '[T-osha_silica]'
