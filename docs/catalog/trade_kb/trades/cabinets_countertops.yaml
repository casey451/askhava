questions:
- id: q1_scope
  text: What do you need?
  options:
  - Fix a door/drawer
  - New countertops only
  - New cabinets only
  - Cabinets and counters
  - Refinish or reface
  - Bathroom vanity
  ask_if: always
  changes_price: 'yes'
  why: Repair, counters only, or full cabinets are very different jobs.
- id: q2_size
  text: How big is the area?
  options:
  - Small (bath or bar)
  - Average kitchen
  - Large kitchen or island
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Linear feet of cabinets and counters drive the quote.
- id: q3_material
  text: What countertop material?
  options:
  - Granite or natural stone
  - Quartz
  - Laminate
  - Butcher block
  - Not sure
  ask_if: scope includes countertops
  changes_price: 'yes'
  why: Stone, quartz and laminate differ in cost and fabrication.
- id: q4_sink_cooktop
  text: Does the sink or a cooktop sit in the counter?
  options:
  - Sink only
  - Sink and electric cooktop
  - Sink and gas cooktop
  - Neither
  - Not sure
  ask_if: scope includes countertops
  changes_price: 'yes'
  why: Cutouts and plumbing or gas reconnections add work and licensing needs.
- id: q5_removal
  text: Remove and haul away old ones?
  options:
  - 'Yes'
  - No, already removed
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Tear-out and haul-away add labor and dump fees.
- id: q6_layout_change
  text: Is the layout changing?
  options:
  - No, same spots
  - Moving the sink or appliances
  - Adding an island
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Moving a sink or appliance needs a permit and other trades.
