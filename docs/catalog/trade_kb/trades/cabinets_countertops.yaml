handyman_ok:
  allowed_examples:
  - Hinges, drawer slides, hardware, a door or two (LHC lists cabinets among minor non-structural repairs)
  not_allowed_examples:
  - Gas cooktop reconnection
  - Full kitchens or stone tops over $1,000
  - Relocating a sink
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'LHC: minor non-structural repairs including cabinets need no permit; relocated or added fixtures do. Source:
  [S17].'
- Hard water in Havasu leaves mineral stains on stone near faucets [judgment].
- Stone shops are often in Havasu, Kingman or Bullhead City; templating to install often takes 1-3 weeks [judgment].
