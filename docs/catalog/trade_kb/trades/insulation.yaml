# Written by Claude (expert layer, Oct 29 2026), not part of the Grok delivery (D-431). AI research, not legal advice.
# Ask Hava trade knowledge file: insulation. Schema: foundation/schema.yaml (v2). Items marked [judgment] are not
# from a cited source; [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, ranks or supervises work.
trade: insulation
display_name: "Insulation"
summary: >-
  Attic insulation (blown-in top-ups over what is there, or full removal and replacement after rodents or water),
  radiant barriers and attic vents, blown-in wall insulation through small holes, garage or shop ceilings, and
  insulation wrap on ducts. In Arizona this is ROC R-40 Insulation work, and the R-40 scope names radiant barriers
  [S2]. Businesses usually quote a range from the area, the depth that is there now and how easy the attic is to
  reach [judgment]. Lake Havasu City is in climate zone 3B (hot, dry), where the US Department of Energy table lists
  R-49 to R-60 for an attic with no insulation [T-mohave_cz][T-doe_insulation]. Sealing or replacing ducts goes to
  hvac; wet insulation from a roof leak also needs a roofing card [judgment].
