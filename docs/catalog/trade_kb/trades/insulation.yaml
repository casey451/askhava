questions:
  - id: q1_where
    text: "Where do you want insulation work?"
    options: ["Attic", "Walls", "Garage or shop", "Ducts", "Radiant barrier or attic vents", "Not sure"]
    ask_if: "always"
    changes_price: "yes"
    why: "The area sets the method, the material and the time. Maps to the question bank 'where' question. [judgment]"
  - id: q2_size
    text: "About how many square feet?"
    options: ["Under 1,000", "1,000 to 2,000", "Over 2,000", "Not sure"]
    ask_if: "always"
    changes_price: "yes"
    why: "Insulation is quoted by area. Bands match the question bank 'size' question. [judgment]"
  - id: q3_existing
    text: "Add to what is there, or remove it and put in new?"
    options: ["Add to what is there", "Remove and replace", "Nothing there now", "Not sure"]
    ask_if: "q1_where in ['Attic', 'Garage or shop', 'Not sure']"
    changes_price: "yes"
    why: "Removal adds a vacuum-out and hauling step before new insulation goes in. Maps to the question bank 'existing' question. [judgment]"
  - id: q4_condition
    text: "What does the old insulation look like?"
    options: ["Droppings or nests", "Water stains or wet spots", "Flat or thin", "Looks fine, just want more", "Not sure"]
    ask_if: "q3_existing in ['Remove and replace', 'Not sure'] or job_type == attic_remove_replace"
    changes_price: "yes"
    why: "Droppings, nests or wet spots often mean a full removal and cleanup in the quote. [judgment]"
  - id: q5_access
    text: "How do you get into the attic?"
    options: ["Hatch in a closet or hallway", "Hatch in the garage", "Pull-down ladder", "No opening I know of", "Not sure"]
    ask_if: "q1_where in ['Attic', 'Radiant barrier or attic vents', 'Ducts', 'Not sure']"
    changes_price: "yes"
    why: "A small or hard-to-reach opening, or none at all, adds time and may mean a new opening. [judgment]"
  - id: q6_wall_outside
    text: "What is on the outside of the walls?"
    options: ["Stucco", "Block", "Siding", "Not sure"]
    ask_if: "q1_where == 'Walls' or job_type == wall_blown_in"
    changes_price: "yes"
    why: "Blown-in wall work drills and patches small holes, and block walls are filled differently from framed walls. [judgment]"
  - id: q7_home_type
    text: "What kind of home is it?"
    options: ["Site-built house", "Manufactured or mobile home", "Not sure"]
    ask_if: "always"
    changes_price: "yes"
    why: "Many manufactured homes have a low or no walk-in attic, which changes the method. [judgment]"
quote_without_visit_needs:
  - "Which area (attic, walls, garage or shop, ducts) and about how many square feet [judgment]"
  - "Add to what is there or remove and replace, and how deep the old insulation is now [judgment]"
  - "Any droppings, nests or wet spots in the old insulation [judgment]"
  - "How to reach the attic (hatch spot, ladder, no opening) [judgment]"
  - "Wall outside finish for wall jobs (stucco, block, siding) [judgment]"
  - "A photo from the attic opening and a close photo of the old insulation with a ruler or tape if one is handy [judgment]"
site_visit_usually_needed:
  - "attic_remove_replace: droppings, nests or water stains, where the business may want to see how much area is affected [judgment]"
  - "wall_blown_in: the business may want to check the wall type and hole spots [judgment]"
  - "No attic opening, or a very low attic [judgment]"
  - "Loose, pebble-like fill that is gray-brown or silver-gold (see photo_red_flags) [judgment]"
photos_to_request:
  - id: p1_attic_wide
    ask: "A wide photo of the attic taken from the opening, if you can take it from the ladder or hatch."
    for_job_types: [attic_top_up, attic_remove_replace, radiant_barrier_ventilation, duct_insulation]
  - id: p2_existing_depth
    ask: "A close photo of the old insulation, with a ruler or tape measure standing in it if you have one."
    for_job_types: [attic_top_up, attic_remove_replace, garage_shop_ceiling]
  - id: p3_access
    ask: "A photo of the attic hatch or pull-down ladder."
    for_job_types: [attic_top_up, attic_remove_replace, radiant_barrier_ventilation, duct_insulation]
  - id: p4_house_outside
    ask: "A photo of the outside of the house showing the walls and roof."
    for_job_types: [wall_blown_in, radiant_barrier_ventilation]
  - id: p5_garage_ceiling
    ask: "A wide photo of the garage or shop ceiling and walls."
    for_job_types: [garage_shop_ceiling]
  - id: p6_ducts
    ask: "A photo of the ducts you want wrapped, if you can see them from the opening."
    for_job_types: [duct_insulation]
photo_cues:
  - photo_id: p1_attic_wide
    look_for: ["Insulation type (loose fill, batts, none)", "Whether ceiling joists show above the insulation", "AC unit or ducts in the attic", "Can lights or junction boxes in the insulation", "Roof vents or attic fan", "Foil sheets on the rafters"]
    neutral_wording_example: "Loose fill about level with the joists, flex ducts on top, two roof vents visible."
  - photo_id: p2_existing_depth
    look_for: ["Depth on the tape", "Color and type of material", "Droppings, nests, tunnels or stains", "Flattened or missing patches"]
    neutral_wording_example: "Tape shows about 4 inches of yellow loose fill. Dark specks near the eave side."
  - photo_id: p3_access
    look_for: ["Hatch spot (closet, hallway, garage)", "Opening size", "Pull-down ladder or none"]
    neutral_wording_example: "Small hatch in the hallway ceiling, no ladder."
  - photo_id: p4_house_outside
    look_for: ["Wall finish (stucco, block, siding)", "Number of stories", "Roof type and vents"]
    neutral_wording_example: "Single-story stucco home, tile roof, gable vents on both ends."
  - photo_id: p5_garage_ceiling
    look_for: ["Open rafters or finished drywall ceiling", "Metal building or framed", "Garage door opener and lights", "Room above the garage"]
    neutral_wording_example: "Open metal roof panels, no ceiling, two-car shop."
  - photo_id: p6_ducts
    look_for: ["Duct type (flex, metal)", "Torn or missing wrap", "Drips or stains on or under the ducts"]
    neutral_wording_example: "Metal trunk duct with no wrap, flex runs with torn outer jacket."
photo_red_flags:
  - flag: "Loose, pebble-like fill that is gray-brown or silver-gold (looks like vermiculite) [T-epa_vermiculite]"
    safety_step_ref: null
  - flag: "Droppings, nests or dead animals in the insulation (pest work goes to pest_control)"
    safety_step_ref: null
  - flag: "Wet, stained or sagging insulation or ceiling below (roof leak goes to roofing)"
    safety_step_ref: null
  - flag: "Burn marks, melted wires or open wire splices in the attic (goes to electrical)"
    safety_step_ref: null
  - flag: "Disconnected or crushed ducts (goes to hvac)"
    safety_step_ref: null
emergency_signals:
  - id: es_insulation_smoke_fire
    signal: "Smoke, fire or sparks in the attic or walls"
    emergency: "yes"
    safety_step: "Not used by the app. Ask Hava sends only the fixed INT-004 911 text for smoke or fire and for a sparking outlet or panel. [judgment]"
    source: "INT-004 (D-436)"
    then_route_to: none
    note: "Routing: none until the 911 text is sent and the homeowner says they are safe. Burn marks with no smoke go to electrical. [judgment]"
  - id: es_insulation_routine
    signal: "Hot rooms, high bills, thin, old, wet or rodent-soiled insulation"
    emergency: "no"
    safety_step: ""
    source: "[judgment]"
    then_route_to: insulation
    note: "Not an emergency. Normal intake. [judgment]"
safety_step: []
intake_notes_judgment:
  - "Mixed messages are common: rodents plus insulation is a pest_control card and an insulation card; a roof leak plus wet insulation is a roofing card and an insulation card. [judgment]"
  - "Vermiculite look in a photo: the card states only what the photo shows. EPA says to assume vermiculite has asbestos and not disturb it, and to hire a professional asbestos contractor before work that could disturb it [T-epa_vermiculite]. That is business-facing context, not a message to the homeowner. Who may remove it is an [open question]."
  - "Duct wrap is insulation (R-40) [S2], but sealing, fixing or replacing ducts is hvac or sheet metal work (R-39, R-45) [S2]. If the homeowner wants ducts sealed or replaced, make an hvac ductwork_airflow card. [judgment]"
license_classes:
  - job_type: [attic_top_up, attic_remove_replace, wall_blown_in, garage_shop_ceiling, duct_insulation]
    work: "Install and repair insulation"
    classes: ["R-40 Insulation"]
    citation: "A.A.C. R4-9-103, R-40: 'install and repair: 1. Insulation materials, including radiant barriers 2. Preformed architectural acoustical materials 3. Insulation protecting materials' [S2]"
    other_agency: "City business and transaction privilege tax licensing may apply [judgment; not checked on lhcaz.gov]"
    notes: "Catalog row: license kind roc, classes [R-40], handyman_allowed false (categories.yaml). Ask Hava never tells a homeowner a business is licensed; the ROC license lookup is how to check. Patching drill holes in stucco or drywall after wall work may fall under R-36 Plastering or R-10 Drywall [S2] [judgment]."
  - job_type: [radiant_barrier_ventilation]
    work: "Radiant barrier; attic vents or fans"
    classes: ["R-40 Insulation (radiant barrier)", "R-42 Roofing for new roof vents [judgment]", "R-11 Electrical for a new wired attic fan [judgment]", "R-39 for ventilating systems [judgment]"]
    citation: "A.A.C. R4-9-103 [S2]: R-40 names radiant barriers; R-39 scope includes ventilating; R-42 covers roofing and 'roof insulation or coatings on or above the roof deck'"
    other_agency: "none found"
    notes: "Radiant barrier is clearly R-40 [S2]. Which class covers cutting a new roof vent or wiring a powered attic fan is [judgment]. Insulation on or above the roof deck is R-42 [S2]."
  - job_type: [duct_insulation]
    work: "Duct sealing, repair or replacement (route to hvac)"
    classes: ["R-39 Air Conditioning and Refrigeration", "R-45 Sheet Metal (duct work)"]
    citation: "A.A.C. R4-9-103 [S2]: R-45 lists 'Duct work'"
    other_agency: "UniSource duct sealing rebate requires a participating Efficient Home Program contractor [T-ues_efficient_home]"
    notes: "Wrap-only jobs stay here; anything that opens, seals or replaces ducts is an hvac card. [judgment]"
handyman_ok:
  allowed_examples:
    - "Laying a few batts over a garage hatch, under $1,000 total, no permit, not part of a larger job [judgment]"
  not_allowed_examples:
    - "Whole-attic blown-in jobs or removals over $1,000 (R-40) [S2][S4]"
    - "Any insulation job tied to a larger remodel or split into small contracts [S4]"
  rule_reminder: "Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit; and any ad says 'not a licensed contractor'. Never covers work connected to natural gas, propane or other fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]"
  note: "The catalog sets handyman_allowed false for insulation, so handyman businesses do not get these cards. [judgment]"
local_notes:
  - "Climate zone: Mohave County is climate zone 3B (hot, dry). Bullhead City's energy code amendments state 'Arizona, Mohave County, Declared climate zone is 3-Dry(B)' [T-bhc_energy], and OpenEI lists Mohave County as ASHRAE 169 zone 3B [T-mohave_cz]. Earlier notes that said 2B were not confirmed."
  - "Attic R-values: the DOE Energy Saver table lists, for zone 3, R-49 to R-60 for an attic with no insulation and R-38 to R-49 when adding to 3 to 4 inches already there [T-doe_insulation]. Bullhead City's amended 2018 IRC energy chapter lists a ceiling R-38 for zone 3 new homes [T-bhc_energy]. Ask Hava quotes neither to homeowners as advice; a business may name the target in its quote. [judgment]"
  - "Lake Havasu City adopts the 2024 IRC with amendments; its building permit page does not list insulation in the permit or no-permit lists, and the city's energy code edition was not checked [S17] [unverified]."
  - "DOE says radiant barriers work better in hot climates than cool ones, especially with cooling ducts in the attic, and some studies show 5 to 10 percent lower cooling costs in a warm, sunny climate [T-doe_radiant]."
  - "Heat runs June to September and attics get far hotter than the house, so many businesses work early in the morning in summer, and some homeowners ask in spring before the heat. [judgment]"
  - "Monsoon storms, roughly July to September, can blow dust in through attic vents and bring roof leaks that wet insulation. [judgment]"
  - "Many homes have the AC air handler or ducts in the attic or on the roof; insulation jobs often need to work around them. [judgment]"
  - "Pack rats and roof rats are a common reason for removal requests; trapping and sealing entry points is pest_control work. [judgment]"
  - "Seasonal residents and vacant second homes: work may be done while the owner is away, so access and lockbox details are handled by the business directly, never on the card. [judgment]"
  - "Manufactured homes often have a low roof cavity with no walk-in attic; underbelly insulation under the floor is a different job. [judgment]"
  - "HOAs may need to approve new roof vents or attic fans that show from the street. [judgment]"
  - "UniSource Weatherization Assistance gives free upgrades, including attic, wall and duct insulation, to income-qualifying UniSource electric customers; in Mohave County it runs through the Western Arizona Council of Governments (WACOG) [T-ues_weatherization]. UniSource's Efficient Home Program lists a duct sealing rebate through participating contractors and no attic insulation rebate as read [T-ues_efficient_home]. Ask Hava does not say whether a homeowner qualifies. [judgment]"
sample_card: |
  REQ-0142 | Insulation | Lake Havasu City, north side
  Attic top-up, about 1,500 sq ft, site-built house. Old loose fill about 4 inches (tape photo), no droppings seen.
  Hatch in the hallway ceiling, AC ducts in the attic. 3 photos.
