handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: 'Often. Yard maintenance is exempt as gardener work (A.R.S. 32-1121(A)(16)). For irrigation repair or rock
    jobs: A.R.S. 32-1121(A)(14): a person may do ''casual or minor'' work without an ROC license only if the whole
    job (labor, materials, everything) is under $1,000, no building permit is needed, it is not part of a larger
    job or split up to get under the limit, and their ads say ''not a licensed contractor''. Per 32-1121(D) the
    exemption never covers work that connects to natural gas, propane or other fuel gas, or hardwired/interconnected
    fire-safety devices. Lake Havasu City''s permit list decides whether a permit is needed (https://www.lhcaz.gov/development-permitting/building).
    Pre-emergent weed spraying is never covered by the landscaper herbicide exemption (A.R.S. 3-3613).'
local_notes:
- Caliche (hard calcium carbonate layer) is common in desert soils and slows trenching and planting [judgment].
- Hard water (about 19 grains per gallon) can clog drip emitters and leave white crust [judgment based on Lake Havasu
  City annual drinking water quality report (total hardness about 19 grains per gallon, range 18-20) - https://www.lhcaz.gov/DocumentCenter/View/3233].
- Summer monsoon storms can wash out rock and bury drip lines [judgment].
- Watering rules or rebates from Lake Havasu City were not checked [open question].
