questions:
- id: job_kind
  text: What kind of yard job is it?
  options:
  - Fix watering system
  - New watering system
  - Rock or gravel
  - Plants or trees planted
  - Cleanup / weeds
  - Regular maintenance
  - Yard lights
  - Not sure
  ask_if: always
  changes_price: 'yes'
- id: area_size
  text: About how big is the area?
  options:
  - Small (one bed or strip)
  - Front yard
  - Back yard
  - Front and back
  - Not sure
  ask_if: always
  changes_price: 'yes'
- id: system_type
  text: What type of watering system?
  options:
  - Drip
  - Sprinklers
  - Both
  - Bubblers
  - Not sure
  ask_if: job_kind in [Fix watering system, New watering system]
  changes_price: 'yes'
- id: symptom
  text: What is happening?
  options:
  - Leak or puddle
  - Zone won't turn on
  - Zone won't shut off
  - Plants dying
  - Timer is dead
  - Water bill went up
  ask_if: job_kind == Fix watering system
  changes_price: 'yes'
- id: rock_scope
  text: What do you need for the rock?
  options:
  - New rock over bare dirt
  - Top off existing rock
  - Remove old rock and replace
  - Not sure
  ask_if: job_kind == Rock or gravel
  changes_price: 'yes'
- id: weed_control
  text: Do you also want weed control spraying, like pre-emergent?
  options:
  - 'Yes'
  - 'No'
  - Not sure
  ask_if: job_kind in [Cleanup / weeds, Rock or gravel, Regular maintenance]
  changes_price: 'yes'
