- id: es_water_flowing_toward_or_into_t
  signal: Water flowing toward or into the house
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: landscaping_irrigation
- id: es_someone_hit_a_buried_electric_
  signal: Someone hit a buried electric or gas line while digging
  emergency: 'yes'
  safety_step: Leave the area right away and call 911 and the utility from a safe place.
  source: Arizona 811 (call 811 or 1-800-STAKE-IT at least two working days before digging) - https://www.arizona811.com/
    ; UniSource Energy Services, Vegetation Management (15 ft clearance, free temporary disconnect, [number removed, see source])
    - https://www.uesaz.com/vegetation-management/
  then_route_to: landscaping_irrigation
- id: es_smell_of_gas_while_digging
  signal: Smell of gas while digging
  emergency: 'yes'
  safety_step: Leave the area right away and call 911 and the utility from a safe place.
  source: Arizona 811 (call 811 or 1-800-STAKE-IT at least two working days before digging) - https://www.arizona811.com/
    ; UniSource Energy Services, Vegetation Management (15 ft clearance, free temporary disconnect, [number removed, see source])
    - https://www.uesaz.com/vegetation-management/
  then_route_to: landscaping_irrigation
safety_step:
- when: Planning to dig
  step: Call 811 (1-800-STAKE-IT) at least two working days before digging so buried lines are marked. It is the
    law.
  source: Arizona 811 (call 811 or 1-800-STAKE-IT at least two working days before digging) - https://www.arizona811.com/
- when: Hit a gas or power line
  step: Leave the area right away and call 911 and the utility from a safe place.
  source: Arizona 811 (call 811 or 1-800-STAKE-IT at least two working days before digging) - https://www.arizona811.com/
    ; UniSource Energy Services, Vegetation Management (15 ft clearance, free temporary disconnect, [number removed, see source])
    - https://www.uesaz.com/vegetation-management/
- when: Working outside in summer
  step: Heat can be deadly. Drink water, rest in shade, and know the signs of heat illness.
  source: National Weather Service, Heat Safety - https://www.weather.gov/safety/heat
- when: Weed spray chemicals
  step: Follow the product label, which is the law. Keep kids and pets off treated areas until the label says it
    is safe. [judgment on wording]
  source: Arizona Department of Agriculture, Pest Management Division - https://agriculture.az.gov/pestspest-control
