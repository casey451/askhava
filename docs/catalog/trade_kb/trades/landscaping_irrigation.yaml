photo_cues:
- photo_id: all
  look_for:
  - Wet spot or water bubbling up
  - Cracked or brown PVC above ground (sun damage) [judgment]
  - Pressure regulator and filter at drip valve
  - Brand of controller (Rain Bird, Hunter, Orbit)
  - Slope or wash near the area
photo_red_flags:
- flag: Water near the house foundation
