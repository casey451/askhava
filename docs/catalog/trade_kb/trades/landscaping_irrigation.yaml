# Ask Hava trade knowledge file: landscaping_irrigation
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: landscaping_irrigation
display_name: Landscaping & irrigation
summary: 'Desert landscaping and watering systems: drip irrigation repair and installs, sprinkler and valve repair,
  controllers/timers, backflow devices, decorative rock and decomposed granite, desert plant installs, low-voltage
  landscape lighting, and yard cleanups. Havasu soil often has caliche (a hard, cement-like layer) that makes digging
  slow [judgment]. Ask Hava gathers the job size and photos; it never designs the yard or prices the work.'
