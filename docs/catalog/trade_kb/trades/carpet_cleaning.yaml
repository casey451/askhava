  safety_step_ref: null
- flag: Sewage residue
  safety_step_ref: es_carpet_cleaning_1
emergency_signals:
- id: es_carpet_cleaning_1
  signal: Carpet soaked by sewage
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: Wear rubber boots, rubber gloves and goggles during cleanup. Keep children and pets out of the area.
    Throw out items that can't be cleaned and dried. Dry wet materials within 24-48 hours to limit mold.
  source: '[S51] [T-epa_mold]'
  then_route_to: plumbing
- id: es_carpet_cleaning_2
  signal: Standing water on carpet near outlets or cords
  emergency: 'yes'
  safety_step: Do not walk in standing water if the power may be on. Have power turned off at the main by a qualified
    person or the utility.
  source: '[S31]'
  then_route_to: plumbing
- id: es_carpet_cleaning_3
  signal: Carpet wet from clean-water leak
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: Dry wet materials within 24-48 hours to limit mold.
  source: '[T-epa_mold]'
  then_route_to: plumbing
- id: es_carpet_cleaning_4
  signal: Routine cleaning
  emergency: 'no'
  safety_step: No special safety step; normal job card.
  source: none
  then_route_to: carpet_cleaning
safety_step:
- when: Wet carpet or pad
  step: Dry wet materials within 24-48 hours to limit mold.
  source: '[T-epa_mold]'
- when: Standing water and power may be on
  step: Do not walk in standing water if the power may be on. Have power turned off at the main by a qualified person
    or the utility.
  source: '[S31]'
- when: Sewage or floodwater on floors
  step: Wear rubber boots, rubber gloves and goggles during cleanup. Keep children and pets out of the area. Throw
    out items that can't be cleaned and dried.
  source: '[S51]'
license_classes:
- job_type:
  - carpet_clean
  - pet_odor
  - upholstery
  - area_rug
  - tile_grout
  classes:
  - none
  citation: foundation az_license_master §5 [judgment]
  other_agency: none
  notes: No state license is needed for this cleaning work [judgment, per foundation az_license_master §5]. It is
    not construction under ROC rules.
- job_type:
  - water_damage_route
  classes:
  - R-8
  citation: A.A.C. R4-9-103 [S2] R-8; [T-iicrc_s500] [industry]
  other_agency: none
  notes: 'Water damage drying and pad/carpet replacement: restoration company; carpet re-install falls under ROC
    R-8 Floor Covering. IICRC S500 is the industry drying standard.'
handyman_ok:
  allowed_examples:
  - Cleaning (not construction)
  not_allowed_examples:
  - Replacing carpet and pad over $1,000 (ROC R-8)
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'Fine desert dust settles into Havasu carpets, especially after monsoon dust storms (season June 15-Sept 30).
  Source: [T-az_monsoon].'
- 'Hot, dry air helps carpets dry fast, but leaks under carpet still need fast drying. Source: [T-epa_mold].'
- Vacation rental owners often book carpet cleaning between seasons [judgment].
