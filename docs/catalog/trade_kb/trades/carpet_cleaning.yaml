questions:
- id: q1_what
  text: What needs cleaning?
  options:
  - Carpet
  - Couch or chairs
  - Area rug
  - Tile and grout
  - Several of these
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Carpet, upholstery, rugs and grout use different tools.
- id: q2_rooms
  text: How many rooms or areas?
  options:
  - 1-2
  - 3-4
  - 5+
  - Whole house
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Room count is how most cleaners quote.
- id: q3_pets
  text: Pet stains or odor?
  options:
  - Yes, a few spots
  - Yes, a lot
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Urine treatment adds products and time.
- id: q4_wet_now
  text: Is any carpet wet from a leak or flood right now?
  options:
  - Yes, clean water
  - Yes, dirty or sewage water
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Wet carpet is restoration work with a 24-48 hour drying window.
- id: q5_stairs
  text: Any stairs?
  options:
  - 'Yes'
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Stairs are slow and often priced per step. [judgment]
