# Ask Hava trade knowledge file: carpet_cleaning
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: carpet_cleaning
display_name: Carpet Cleaning
summary: Carpet, rug and upholstery cleaning, spot and pet-odor treatment, and tile-and-grout cleaning. Most carpet
  makers' warranties call for periodic hot water extraction by a professional [judgment; check the warranty]. No
  state license applies. Carpet soaked by a leak, flood or sewage is water-damage restoration (dry within 24-48
  hours), not routine cleaning.
