handyman_ok:
  allowed_examples:
  - Change an air filter (homeowner task; no license question) [judgment]
  - Swap a battery-powered or like-for-like low-voltage thermostat, total under $1,000, no permit [S4][judgment]
  - Clear debris around an outdoor unit, replace sun-rotted line-set foam insulation without opening the refrigerant
    circuit, under $1,000 [judgment]
  not_allowed_examples:
  - 'Any refrigerant work: adding, recovering or charging (also federal EPA 608 certification) [S38]'
  - Any gas furnace, gas pack or gas heater repair or hookup, at any price [S4 (D)(2)]
  - Unit replacement or mini-split install (over $1,000 and/or permit) [S4][S17]
  - Adding a circuit or changing ampacity (permit) [S17]
  - Splitting a replacement into small invoices to stay under $1,000 [S4 (A)(14)(b)]
  rule_reminder: 'A person without an ROC license may take a job only if ALL are true: total price (labor + materials
    + everything) is under $1,000; the work is casual, minor or inconsequential; no local building permit is required;
    it is not part of a larger job or split up to stay under $1,000; and any ad says ''not a licensed contractor''.
    The exemption never covers work that connects to natural gas, propane or other fuel gas, or fire-safety work
    such as hardwired/interconnected smoke alarms. Source: A.R.S. 32-1121(A)(14) and (D) [S4]. In Lake Havasu City,
    check the city permit list: a needed permit removes the exemption [S17].'
local_notes:
- 'Photos: ask people not to climb on a roof just to take a picture; a ground photo or none is fine [judgment].'
- Summer highs regularly top 110-115 F; no-cooling requests peak June-September and businesses get busy, so expect
  slower scheduling on hot weekends [judgment].
- Many homes have rooftop package units (cooling plus gas or electric heat in one box); replacement often needs
  a crane and a curb adapter if the new unit footprint differs [judgment].
- Dust storms during monsoon (roughly July-September) can pack condenser coils and clog filters; power flickers
  can trip units [judgment].
- Older homes may still run R-22 units; R-22 is no longer made or imported, so repair quotes can vary widely [EPA-R22][judgment].
- Like-for-like AC replacement needs no LHC permit; changes in weight, capacity, location or ampacity do [S17].
- 'Snowbird and vacation homes: owners may report from out of town; ask if someone local can let a tech in, but
  never collect lockbox or gate codes [judgment].'
- 'Manufactured homes: alterations need a licensed or certified person under A.R.S. 41-4047(5); ask the home type
  so businesses know [ARS-4047].'
- Heat calls are most common in late afternoon when the house has been heating up all day; mornings are more efficient
  for roof work in summer [judgment].
- 'Utility: UniSource Energy Services supplies electricity and natural gas in Lake Havasu City [S22].'
sample_card: 'REQ-0142 | Heating & cooling | Lake Havasu City, north side

  Rooftop package unit, runs but blows warm since last night. Label photo: R-410A, about 2012 build.

  Flat roof, one story. Older adult at home. Wants soonest visit.'
