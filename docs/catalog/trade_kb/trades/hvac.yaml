questions:
- id: q1_system_type
  text: What kind of system cools your home?
  options:
  - Big unit on the roof
  - Unit on the ground outside
  - Wall unit inside (mini-split)
  - Swamp cooler (water cooler)
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: System type sets parts, access (roof vs ground), crane needs and which business type fits. Swamp cooler answer
    reroutes to evaporative_coolers. [judgment]
- id: q2_scope
  text: Do you want it fixed, or a quote to replace it?
  options:
  - Fix what I have
  - Quote to replace
  - Both, I want options
  - Just a tune-up
  - Not sure
  ask_if: job_type not in [ac_maintenance, thermostat_issue]
  changes_price: 'yes'
  why: Repair vs replace is the biggest price split. Ask Hava does not suggest either; businesses quote in their
    own words. [judgment]
- id: q3_symptom
  text: What is it doing right now?
  options:
  - Runs but air is warm
  - Will not turn on
  - Outside fan not spinning
  - Ice on pipes or unit
  - Water leaking
  - Loud noise or bad smell
  ask_if: q2_scope in ['Fix what I have', 'Both, I want options', 'Not sure']
  changes_price: 'yes'
  why: Symptom tells a business what parts and tools to bring. Ask Hava records it; it does not explain the cause.
    [judgment]
- id: q4_age
  text: About how old is the unit?
  options:
  - Under 5 years
  - 5-10 years
  - 10-15 years
  - Over 15 years
  - Not sure (I can send a label photo)
  ask_if: always
  changes_price: 'yes'
  why: Age and refrigerant (often R-22 on older units) shape repair vs replace quotes. The data plate photo is better
    than a guess. [EPA-R22][judgment]
- id: q5_home_size
  text: About how big is the home or space it cools?
  options:
  - Under 1,200 sq ft
  - 1,200-2,000 sq ft
  - 2,000-3,000 sq ft
  - Over 3,000 sq ft
  - One room / garage / casita
  - Not sure
  ask_if: q2_scope in ['Quote to replace', 'Both, I want options'] or job_type == mini_split_install
  changes_price: 'yes'
  why: Size hints at tonnage; a business still confirms with its own load calculation. [judgment]
- id: q6_access
  text: Where can a tech reach the unit?
  options:
  - Flat roof, one story
  - Sloped roof or two story
  - Ground, easy side yard
  - Ground, behind a locked gate or wall
  - Attic or closet inside
  - Not sure
  ask_if: q1_system_type != 'Swamp cooler (water cooler)'
  changes_price: 'yes'
  why: Roof pitch, height and gate access change labor, crane and safety gear. Do not collect gate codes. [judgment]
quote_without_visit_needs:
- Clear photo of the outdoor or rooftop unit data plate (brand, model, serial, refrigerant, electrical ratings)
  [judgment]
- Photo of the indoor unit / air handler or furnace label for split systems [judgment]
- Home square footage, number of stories, roof type (flat vs pitched) [judgment]
- Replace-like-for-like vs change size or location (location/size/weight/ampacity change triggers an LHC permit)
  [S17]
- 'For mini-split installs: room size, where the indoor head and outdoor unit would go, distance between them, panel
  photo with open breaker spaces [judgment]'
- 'For maintenance: number of systems and type; many businesses quote tune-ups at a flat rate without a visit [judgment]'
site_visit_usually_needed:
- No cooling or no heat with unknown cause (businesses usually quote a service call, not a repair) [judgment]
- Rooftop package unit replacement (crane, curb adapter, roof condition) [judgment]
- Any job that changes tonnage, location or electrical capacity (permit, load calculation) [S17][judgment]
- Ductwork redesign, hot rooms, airflow complaints [judgment]
- Refrigerant leaks (leak search needed; EPA asks owners to have leaks repaired rather than repeatedly topped off)
  [EPA-R22]
photos_to_request:
- id: p1_data_plate
  ask: A close, straight-on photo of the metal or sticker label on the outside or rooftop unit. Please make sure
    the numbers are readable.
  for_job_types:
  - ac_not_cooling
  - ac_not_turning_on
  - ac_replacement
  - package_unit_replacement
  - heat_pump_issue
  - ac_maintenance
  - mini_split_repair
- id: p2_whole_unit
  ask: A photo of the whole outdoor or rooftop unit from a few steps back.
  for_job_types:
  - ac_not_cooling
  - ac_noise_smell
  - ac_replacement
  - package_unit_replacement
  - heat_pump_issue
- id: p3_indoor_unit
  ask: A photo of the indoor unit (closet, attic or garage), including its label if you can reach it safely.
  for_job_types:
  - ac_leaking_water
  - ac_replacement
  - heat_not_working
  - ductwork_airflow
- id: p4_thermostat
  ask: A photo of the thermostat screen, and if it is off the wall, the wires behind it.
  for_job_types:
  - thermostat_issue
  - ac_not_turning_on
- id: p5_leak_area
  ask: A photo of where the water is (drip pan, drain pipe outside, or ceiling spot).
  for_job_types:
  - ac_leaking_water
- id: p6_minisplit_spot
  ask: A photo of the wall where you want the indoor unit and of the outside spot for the outdoor unit.
  for_job_types:
  - mini_split_install
- id: p7_error_code
  ask: A photo of any blinking lights or error code on the unit or remote.
  for_job_types:
  - mini_split_repair
  - heat_pump_issue
  - ac_not_turning_on
- id: p8_panel
  ask: A photo of the electrical panel with the door open (no need to touch anything inside).
  for_job_types:
  - mini_split_install
  - ac_replacement
photo_cues:
- photo_id: p1_data_plate
  look_for:
  - Brand, model and serial number; many plates also print a manufacture date (MFG DATE) - use that first [judgment]
  - 'Refrigerant line: R-22 (HCFC-22; new production/import ended Jan 1, 2020; existing units can still be serviced
    with recovered or stockpiled supply) [EPA-R22]'
  - R-410A (HFC, GWP about 2,088) - common 2010-2024; pre-2025-made split components may still be installed under
    the 2026 EPA rule [EPA-TT]
  - R-454B or R-32 (A2L, lower GWP) - new units built from 2025 for the 700-GWP limit; not a drop-in for R-410A
    [EPA-TT][judgment]
  - 'Tonnage hint in model number: digits like 024/030/036/042/048/060 usually mean 2/2.5/3/3.5/4/5 tons (12,000
    BTU per ton) [judgment]'
  - 'Electrical ratings: MCA and MOP (max fuse/breaker) amps [judgment]'
  - 'Age decode by brand when no printed date (industry tables, verify): Carrier/Bryant/Payne serial 4 digits =
    week then year (3216... = week 32 of 2016) [INACHI-AGE]; Trane/American Standard since about 2010 serial begins
    with year then week (1834... = 2018) [judgment]; Goodman/Amana serial begins year then month (1507... = July
    2015) [judgment]; Lennox serial characters 3-4 = year (5815... = 2015) [judgment]; Rheem/Ruud letter then week+year
    (W0316... = week 03 of 2016) [judgment]; York/Coleman and most mini-split brands vary - use the printed date
    [judgment]'
  - Decoded date is the build date, not the install date; units can sit in a warehouse for months [judgment]
  neutral_wording_example: 'Data plate: Goodman, model starts GSX13036, refrigerant R-22 shown, serial suggests
    about 2009 build.'
- photo_id: p2_whole_unit
  look_for:
  - Rooftop package vs split condenser vs heat pump (reversing-valve units often say 'heat pump' on the label) [judgment]
  - Fins bent, matted or packed with dust/cottonwood [judgment]
  - Rust at base, missing panels, line-set insulation missing or sun-rotted [judgment]
  - Disconnect box present and closed [judgment]
  - Gas line to a rooftop gas pack (yellow-tagged or black pipe) [judgment]
  neutral_wording_example: Rooftop package unit on a flat roof; side panel missing; fins look dusty.
- photo_id: p3_indoor_unit
  look_for:
  - Furnace vs air handler; gas line and flue pipe present? [judgment]
  - Water in drip pan, rust, stains on platform [judgment]
  - Filter size printed on edge [judgment]
  - Flue pipe disconnected or rusted (route as safety signal) [judgment]
  neutral_wording_example: Air handler in hall closet; standing water visible in the pan; filter appears dark.
- photo_id: p4_thermostat
  look_for:
  - Brand/model; blank screen; wire count and letters (R, C, Y, G, W, O/B) [judgment]
  - No C (common) wire may matter for smart thermostats [judgment]
  neutral_wording_example: Thermostat screen blank; five wires labeled R, Y, G, W, C.
- photo_id: p5_leak_area
  look_for:
  - Ceiling stain size, sagging drywall [judgment]
  - Secondary drain or float switch present [judgment]
  - Drain line outlet outside, algae [judgment]
  neutral_wording_example: Brown ceiling stain about two feet wide below the attic air handler.
- photo_id: p6_minisplit_spot
  look_for:
  - Wall type (block, stucco, frame), distance to outdoor spot, line-set path [judgment]
  - Mounting surface for the outdoor unit [judgment]
  neutral_wording_example: Garage back wall, block; outdoor spot on gravel about 10 feet away.
- photo_id: p7_error_code
  look_for:
  - Code shown and brand (codes differ by brand) [judgment]
  neutral_wording_example: Indoor head shows blinking green light, 5 blinks.
- photo_id: p8_panel
  look_for:
  - Open breaker spaces; panel brand (Federal Pacific Stab-Lok or Zinsco flag for electrical trade) [judgment]
  - Main breaker size [judgment]
  neutral_wording_example: Panel label reads 125A; two open spaces at bottom.
photo_red_flags:
- flag: Scorch marks, melted wires or smoke at the disconnect, unit or panel
  safety_step_ref: es_burning_smoke
- flag: Flue pipe on a gas furnace or gas pack disconnected, rusted through or sooty
  safety_step_ref: es_co
- flag: Sagging, wet ceiling under an attic unit near lights or outlets
  safety_step_ref: es_water_electric
- flag: Gas pipe broken or bent at a rooftop gas pack or furnace
  safety_step_ref: es_gas
emergency_signals:
- id: es_heat_symptoms
  signal: No cooling and someone is confused, faint, has hot red skin or very high body temperature
  emergency: 'yes'
  safety_step: 'Signs of heat stroke (confusion, fainting, hot red skin, very high body temperature): call 911 now.
    Move the person to a cooler place, cool them with cool wet cloths or a cool bath, and do not give fluids to
    someone who is not fully alert.'
  source: '[S27]'
  then_route_to: hvac
- id: es_heat_vulnerable
  signal: No cooling in extreme heat with an older adult, infant, pregnant person, someone with a medical condition,
    or pets at home
  emergency: 'yes'
  safety_step: With no AC in extreme heat, CDC advises going to an air-conditioned place (a friend's home, a public
    building or a cooling center) for part of the day, drinking water, and checking on older adults often. NWS warns
    that fans alone do not prevent heat illness when it is very hot. If anyone shows signs of heat stroke, call
    911.
  source: '[CDC-HEAT][S27]'
  then_route_to: hvac
- id: es_gas
  signal: Gas or rotten-egg smell near a furnace, gas pack or gas line; hissing sound
  emergency: 'yes'
  safety_step: Leave the home or area right away. Do not use a phone, light switch or anything that can make a spark
    inside. Do not smoke or light a match. If you are outside, do not start a car. Do not try to find the leak.
    From a safe place, call 911 and the UniSource 24-hour line, [number removed, see source]. Do not go back until UniSource or
    the fire department says it is safe. Only UniSource may turn gas service back on.
  source: '[UNS-GAS][S22][S25]'
  then_route_to: gas_lines
- id: es_co
  signal: CO alarm sounding, or people feel sick, dizzy or headachy when the heat runs
  emergency: 'yes'
  safety_step: If a CO alarm is sounding, do not look for the cause. Get everyone outside to fresh air right away.
    Call 911 or the fire department from outside. Count heads. Do not go back in until responders say it is safe.
    Do not use the fuel-burning appliance again until it has been checked.
  source: '[S26]'
  then_route_to: hvac
- id: es_burning_smoke
  signal: Burning smell, smoke or sparks from the unit, vents, disconnect or panel
  emergency: 'yes'
  safety_step: 'NFPA says to call a qualified electrician for a burning or rubbery smell, sparks, warm or discolored
    outlets or switches, flickering lights, or breakers that trip often. Stop using the outlet, switch or appliance
    involved. If there is smoke or fire, get out and call 911. If there is smoke, flames or sparks that will not
    stop: get everyone out, stay out, and call 911 from outside.'
  source: '[S29][NFPA-ESCAPE]'
  then_route_to: electrical
- id: es_water_electric
  signal: Water from the AC reaching outlets, lights or the panel
  emergency: 'yes'
  safety_step: If water is near outlets, cords or the electrical panel, do not walk into the water. Turn off power
    at the main breaker only if you can reach it from a dry place; never switch power while standing in water. Keep
    power off until an electrician checks it.
  source: '[S31]'
  then_route_to: hvac
safety_step:
- when: No cooling and someone is confused, faint, has hot red skin or very high body temperature
  step: 'Signs of heat stroke (confusion, fainting, hot red skin, very high body temperature): call 911 now. Move
    the person to a cooler place, cool them with cool wet cloths or a cool bath, and do not give fluids to someone
    who is not fully alert.'
  source: '[S27]'
- when: No cooling in extreme heat with an older adult, infant, pregnant person, someone with a medical condition,
    or pets at home
  step: With no AC in extreme heat, CDC advises going to an air-conditioned place (a friend's home, a public building
    or a cooling center) for part of the day, drinking water, and checking on older adults often. NWS warns that
    fans alone do not prevent heat illness when it is very hot. If anyone shows signs of heat stroke, call 911.
  source: '[CDC-HEAT][S27]'
- when: Gas or rotten-egg smell near a furnace, gas pack or gas line; hissing sound
  step: Leave the home or area right away. Do not use a phone, light switch or anything that can make a spark inside.
    Do not smoke or light a match. If you are outside, do not start a car. Do not try to find the leak. From a safe
    place, call 911 and the UniSource 24-hour line, [number removed, see source]. Do not go back until UniSource or the fire department
    says it is safe. Only UniSource may turn gas service back on.
  source: '[UNS-GAS][S22][S25]'
- when: CO alarm sounding, or people feel sick, dizzy or headachy when the heat runs
  step: If a CO alarm is sounding, do not look for the cause. Get everyone outside to fresh air right away. Call
    911 or the fire department from outside. Count heads. Do not go back in until responders say it is safe. Do
    not use the fuel-burning appliance again until it has been checked.
  source: '[S26]'
- when: Burning smell, smoke or sparks from the unit, vents, disconnect or panel
  step: 'NFPA says to call a qualified electrician for a burning or rubbery smell, sparks, warm or discolored outlets
    or switches, flickering lights, or breakers that trip often. Stop using the outlet, switch or appliance involved.
    If there is smoke or fire, get out and call 911. If there is smoke, flames or sparks that will not stop: get
    everyone out, stay out, and call 911 from outside.'
  source: '[S29][NFPA-ESCAPE]'
- when: Water from the AC reaching outlets, lights or the panel
  step: If water is near outlets, cords or the electrical panel, do not walk into the water. Turn off power at the
    main breaker only if you can reach it from a dry place; never switch power while standing in water. Keep power
    off until an electrician checks it.
  source: '[S31]'
