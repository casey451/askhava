# Ask Hava trade knowledge file: hvac
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: hvac
display_name: Heating & cooling (AC, heat pumps, mini-splits, rooftop units)
summary: 'Central AC, heat pumps, gas or electric furnaces, rooftop package units and ductless mini-splits. In Lake
  Havasu City this is the most time-sensitive trade: summer highs often pass 115 F, and a home with no cooling can
  become dangerous for older adults, babies, people with medical needs and pets [judgment]. Ask Hava''s job is to
  learn the system type, what it is doing, its age (from the data plate photo), the refrigerant on the label and
  the roof or yard access, then write a card a business can quote from. Ask Hava never says what is wrong, what
  it costs, or whether to repair or replace. Swamp coolers have their own file (evaporative_coolers). Licensed work
  is ROC R-39 / CR-39 / CR-79 (residential) and refrigerant handling needs EPA Section 608 certification [S2][S3][S38].'
