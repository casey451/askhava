  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: heat_pump_issue
  label: Heat pump problem (no heat, stuck in defrost, frosting up)
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: mini_split_install
  label: Install a new ductless mini-split (garage, casita, add-on room)
  site_visit_usually_needed: sometimes
  handyman_ok: 'no'
- id: mini_split_repair
  label: Mini-split not cooling, blinking lights or error code
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: ac_maintenance
  label: Seasonal tune-up, coil cleaning, check-up before summer
  site_visit_usually_needed: sometimes
  handyman_ok: 'no'
- id: thermostat_issue
  label: Thermostat blank, not responding, or new smart thermostat
  site_visit_usually_needed: sometimes
  handyman_ok: limited
- id: ductwork_airflow
  label: Weak airflow, hot rooms, duct leaks, dusty vents, new ducts
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
