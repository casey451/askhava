# Written by Claude (expert layer, Oct 29 2026), not part of the Grok delivery (D-431). AI research, not legal advice.
# Ask Hava trade knowledge file: holiday_lights. Schema: foundation/schema.yaml (v2). Items marked [judgment] are not
# from a cited source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: holiday_lights
display_name: "Holiday lights (plug-in)"
summary: >
  Hanging plug-in holiday lights on rooflines, gutters, trees, bushes, palms, windows and doors, and taking them down
  after the season. Some businesses sell a full package: install, a service call if a strand goes out, take-down and
  storage until next year. Plug-in work only: a new outdoor outlet, a new circuit or any hardwired or permanent wired
  lighting is electrical work and routes to electrical (R-11). Businesses quote in tiers in their own words. Ask Hava
  collects the service, the areas to light, stories, roof type, who supplies the lights and outlet spots, then sends
  an anonymous job card.
