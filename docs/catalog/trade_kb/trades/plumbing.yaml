# Ask Hava trade knowledge file: plumbing
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: plumbing
display_name: Plumbing (leaks, drains, fixtures, pipes)
summary: 'Water supply and drain work inside the property line: leaks, burst pipes, slab leaks, clogs, sewer backups,
  toilets, faucets, shower valves, pressure, outdoor spigots, re-pipes and adding fixtures. Lake Havasu City water
  is very hard (about 19 grains per gallon) so scale on fixtures and valves is common, and many homes from the 1970s-90s
  may have older pipe types worth noting from photos [LHC-CCR][judgment]. Ask Hava sorts active water (urgent) from
  slow problems, learns where the issue shows up, how many fixtures are affected and what pipe is visible, then writes
  a card. It never says what failed or what to do. Water heaters, softeners/RO and gas piping have their own files.
  Licensed work is ROC R-37 / R-37R Plumbing / CR-37 / CR-77; drains and sewer lines also CR-80 [S2][S3].'
job_types:
- id: leak_active
  label: Water spraying or running now (burst pipe, broken supply line)
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: leak_slow
  label: Slow drip or leak under a sink, behind a toilet, at a valve
  site_visit_usually_needed: sometimes
  handyman_ok: limited
- id: slab_leak
  label: Possible leak under the floor or in a wall (warm floor spot, sound of running water, high bill)
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: clogged_drain
  label: One drain slow or clogged (sink, tub, shower, toilet)
  site_visit_usually_needed: sometimes
  handyman_ok: limited
- id: main_line_backup
  label: Several drains backing up, sewage coming up, yard cleanout overflowing
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: toilet_issue
  label: Toilet running, rocking, leaking at base, replace toilet
  site_visit_usually_needed: sometimes
  handyman_ok: limited
- id: fixture_replace
  label: Replace a faucet, sink, shower head or valve trim in the same spot
  site_visit_usually_needed: 'no'
  handyman_ok: limited
- id: fixture_add_move
  label: Add or move a fixture (new sink, bathroom remodel, laundry move)
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: repipe
  label: Re-pipe the house (polybutylene, galvanized, many leaks)
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: water_pressure
  label: Low or very high water pressure, pressure regulator, banging pipes
  site_visit_usually_needed: sometimes
  handyman_ok: 'no'
- id: outdoor_spigot_line
  label: Hose bib, yard water line, line from meter to house
  site_visit_usually_needed: sometimes
  handyman_ok: limited
- id: garbage_disposal
  label: Disposal jammed, leaking or replace
  site_visit_usually_needed: 'no'
  handyman_ok: limited
- id: high_water_bill
  label: Water bill suddenly high, meter spinning with everything off
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
