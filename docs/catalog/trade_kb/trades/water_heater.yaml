# Ask Hava trade knowledge file: water_heater
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: water_heater
display_name: Water heaters (tank and tankless, gas and electric)
summary: Repair, replacement and new install of tank and tankless water heaters, gas (natural or propane) and electric,
  plus heat-pump water heaters and expansion tanks. Lake Havasu City water is very hard (about 19 gpg); Rheem says
  scale builds in a tank unless water is soft (0-5 grains), and Rinnai's tankless water quality guide lists hardness
  up to 200 mg/L (about 11.7 gpg), below city water [RHEEM-UC][RINNAI-RE][LHC-CCR]. Ask Hava learns fuel type, tank
  vs tankless, size and age (from the label), location and the symptom, then writes a card. It never says what failed
  or whether to repair or replace. Gas water heaters are excluded from the handyman exemption (A.R.S. 32-1121(D)(2))
  [S4].
