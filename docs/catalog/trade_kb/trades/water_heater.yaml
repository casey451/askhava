questions:
- id: q1_fuel
  text: Is your water heater gas, propane or electric?
  options:
  - Natural gas
  - Propane
  - Electric
  - Heat pump (hybrid)
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Gas units need gas and venting work; electric need the right circuit. Licensing and handyman rules differ.
    [S4][judgment]
- id: q2_type
  text: Is it a tank or tankless?
  options:
  - Tank
  - Tankless (wall-mounted box)
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Different parts, labor and installers. [judgment]
- id: q3_problem
  text: What is happening?
  options:
  - No hot water
  - Not enough hot water
  - Leaking
  - Noise or smell
  - Want to replace or upgrade
  - Error code
  ask_if: always
  changes_price: 'yes'
  why: Leaks from the tank body vs a fitting are priced very differently; the business decides which. [judgment]
- id: q4_size_age
  text: Can you send a photo of the label on the side? It shows the size and the serial number (age).
  options:
  - Sent a photo
  - I know the size
  - Can't reach the label
  ask_if: always
  changes_price: 'yes'
  why: Size and age shape the quote. Ask Hava may read the build date from the serial if the brand format is known.
    [RHEEM-SERIAL][BW-SERIAL][AOS-SERIAL]
- id: q5_location
  text: Where is it?
  options:
  - Garage
  - Closet inside the home
  - Attic
  - Outside or in an exterior closet
  - Manufactured home compartment
  ask_if: q3_problem in ['Leaking', 'Want to replace or upgrade'] or job_type in [replace_tank, convert_tankless,
    heat_pump_wh]
  changes_price: 'yes'
  why: Attic and closet installs are harder; manufactured homes need specific approved units. [RINNAI-RE][judgment]
- id: q6_softener
  text: Do you have a water softener?
  options:
  - 'Yes'
  - 'No'
  - Not sure
  ask_if: q2_type == 'Tankless (wall-mounted box)' or q3_problem == 'Noise or smell'
  changes_price: 'no'
  why: Helps the business plan scale service; not a diagnosis. [judgment]
quote_without_visit_needs:
- Like-for-like tank replacement with a label photo (fuel, gallons, BTU or watts), location and a photo of the area
  around the tank including vent and connections [judgment]
- Tankless descaling flush with model photo [judgment]
- Expansion tank add with photo of the piping [judgment]
site_visit_usually_needed:
- No hot water, leaks, pilot or venting problems (diagnosis) [judgment]
- Tank-to-tankless conversion (gas line size, venting, electrical) [judgment]
- Heat pump water heater (space, condensate, electrical) [judgment]
- Manufactured home installs [ARS-4047][judgment]
photos_to_request:
- id: p1_label
  ask: A clear photo of the label (sticker) on the side of the water heater.
  for_job_types:
  - no_hot_water
  - not_enough_hot
  - tank_leak
  - replace_tank
  - tankless_service
  - convert_tankless
  - heat_pump_wh
  - pilot_gas
- id: p2_whole
  ask: A photo of the whole heater, standing back so we can see the pipes on top and the floor.
  for_job_types:
  - tank_leak
  - replace_tank
  - convert_tankless
  - expansion_tank
  - relief_valve
- id: p3_leak
  ask: A photo of where you see water, if it's safe to get close.
  for_job_types:
  - tank_leak
  - relief_valve
- id: p4_vent
  ask: 'For gas heaters: a photo of the metal pipe going up from the top.'
  for_job_types:
  - pilot_gas
  - replace_tank
  - convert_tankless
- id: p5_error
  ask: 'For tankless: a photo of the display showing the error code.'
  for_job_types:
  - tankless_service
photo_cues:
- photo_id: p1_label
  look_for:
  - 'Fuel: ''Natural Gas'', ''LP/Propane'', or volts/watts for electric [judgment]'
  - Gallons and BTU/h (gas) or element watts (electric) [judgment]
  - 'Rheem/Ruud/Richmond: serial starts with MMYY, e.g. 1209D01234 = December 2009 (older format; newer labels may
    differ, verify) [RHEEM-SERIAL]'
  - 'Bradford White: first two letters = year then month on a 20-year letter cycle; confirm year range with the
    model age [BW-SERIAL]'
  - 'A.O. Smith/State/American: after 2008 serial starts YYWW, e.g. 1719 = week 19 of 2017 [AOS-SERIAL]'
  - '''Mobile home'' or ''manufactured home'' approved wording on label [RINNAI-RE][judgment]'
  - Report only the decoded build date, never a remaining life or a 'should replace' statement [judgment]
  neutral_wording_example: 'Label: Rheem, natural gas, 40 gallons, 36,000 BTU/h; serial suggests built 2012.'
- photo_id: p2_whole
  look_for:
  - Expansion tank on cold line or none [judgment]
  - Relief valve discharge pipe present and running down to a drain or outside [RHEEM-UC]
  - Drain pan under tank [judgment]
  - Rust at fittings or tank base; white scale crust [judgment]
  - Earthquake/seismic straps [judgment]
  - Flammable items stored nearby (gas cans, paint) [RHEEM-UC]
  - 'Supply lines: flex connectors, copper, PEX [judgment]'
  neutral_wording_example: Tank in garage with drain pan, no expansion tank seen, white crust on cold-water fitting.
- photo_id: p3_leak
  look_for:
  - Water from top fittings vs from under the jacket vs the relief pipe; record only where water is seen [judgment]
  neutral_wording_example: Water visible on the floor under the tank; top fittings look dry.
- photo_id: p4_vent
  look_for:
  - Vent pipe sections connected, sloped up, not touching anything combustible; soot or scorch marks [judgment]
  neutral_wording_example: Metal vent pipe on top; dark marks near the top of the heater.
- photo_id: p5_error
  look_for:
  - Brand and error number; record only the number [judgment]
  neutral_wording_example: Tankless display shows code 11.
photo_red_flags:
- flag: Scorch marks, soot or melted parts near the burner or vent
  safety_step_ref: es_co_scorch
- flag: Relief valve or its pipe capped, plugged or missing
  safety_step_ref: es_relief
- flag: Gasoline, paint thinner or other flammables stored next to a gas heater
  safety_step_ref: es_flammables
- flag: Water near outlets, cords or panel
  safety_step_ref: es_flooded
emergency_signals:
- id: es_gas
  signal: Smell of gas near the water heater
  emergency: 'yes'
  safety_step: 'Leave the home or area right away. Do not use a phone, light switch or anything that can make a
    spark inside. Do not smoke or light a match. If you are outside, do not start a car. Do not try to find the
    leak. From a safe place, call 911 and the UniSource 24-hour line, [number removed, see source]. Do not go back until UniSource
    or the fire department says it is safe. Only UniSource may turn gas service back on. The Rheem manual also says:
    do not try to light any appliance, do not touch any electric switch, do not use any phone in the building.'
  source: '[UNS-GAS][S22][RHEEM-UC]'
  then_route_to: gas_lines
- id: es_co_scorch
  signal: CO alarm sounding, or headaches/dizziness when near a gas water heater
  emergency: 'yes'
  safety_step: If a CO alarm is sounding, do not look for the cause. Get everyone outside to fresh air right away.
    Call 911 or the fire department from outside. Count heads. Do not go back in until responders say it is safe.
    Do not use the fuel-burning appliance again until it has been checked.
  source: '[S26]'
  then_route_to: water_heater
- id: es_relief
  signal: Relief valve spraying hot water, or the heater is overheating (steam, very hot water at taps)
  emergency: 'yes'
  safety_step: 'Stay clear of hot water spraying from the relief valve or its pipe; it can scald. Do not cap, plug
    or block the relief valve or its discharge pipe (the Rheem manual says DO NOT plug the relief valve outlet).
    If you can safely reach the cold water shut-off on top of the heater, you may close it, and turn off the gas
    control or the electric breaker for the heater. Rheem''s emergency shutdown: if the heater overheats or the
    gas supply will not shut off, turn off the manual gas control valve to the appliance. For an electric heater,
    turn off its breaker. Do not use the heater until a qualified technician checks it.'
  source: '[RHEEM-UC]'
  then_route_to: water_heater
- id: es_flooded
  signal: Water heater has been under water, or water is near outlets or the panel
  emergency: 'yes'
  safety_step: Do not use the water heater if any part of it has been under water. Rheem says to call a qualified
    service technician to inspect it and replace any part of the control system and gas control that was under water.
    Keep power off and stay out of water near outlets or the panel (CDC).
  source: '[RHEEM-UC][S31]'
  then_route_to: water_heater
- id: es_flammables
  signal: Flammable liquids stored near a gas water heater
  emergency: depends
  safety_step: Rheem warns flammable vapors can travel and be ignited by the burner. Do not store or use gasoline
    or other flammable liquids near the heater.
  source: '[RHEEM-UC]'
  then_route_to: water_heater
- id: es_hydrogen
  signal: Returning to a home after weeks away (snowbirds, rentals)
  emergency: 'no'
  safety_step: If the home has not used hot water for about two weeks or more, Rheem warns hydrogen gas can build
    up in the pipes. Before using electric appliances on the hot water, open the kitchen hot water faucet for several
    minutes. Do not smoke or use an open flame near the faucet while it runs. An air-escaping sound is a sign hydrogen
    is coming out.
  source: '[RHEEM-UC]'
  then_route_to: water_heater
- id: es_leak
  signal: Tank leaking steadily
  emergency: depends
  safety_step: If safe, close the cold water shut-off on top of the heater and turn off the gas control or the heater
    breaker. Keep away from outlets if water is spreading (CDC).
  source: '[UA-WW][S31][judgment]'
  then_route_to: water_heater
safety_step:
- when: Smell of gas near the water heater
  step: 'Leave the home or area right away. Do not use a phone, light switch or anything that can make a spark inside.
    Do not smoke or light a match. If you are outside, do not start a car. Do not try to find the leak. From a safe
    place, call 911 and the UniSource 24-hour line, [number removed, see source]. Do not go back until UniSource or the fire department
    says it is safe. Only UniSource may turn gas service back on. The Rheem manual also says: do not try to light
    any appliance, do not touch any electric switch, do not use any phone in the building.'
  source: '[UNS-GAS][S22][RHEEM-UC]'
- when: CO alarm sounding, or headaches/dizziness when near a gas water heater
  step: If a CO alarm is sounding, do not look for the cause. Get everyone outside to fresh air right away. Call
    911 or the fire department from outside. Count heads. Do not go back in until responders say it is safe. Do
    not use the fuel-burning appliance again until it has been checked.
  source: '[S26]'
- when: Relief valve spraying hot water, or the heater is overheating (steam, very hot water at taps)
  step: 'Stay clear of hot water spraying from the relief valve or its pipe; it can scald. Do not cap, plug or block
    the relief valve or its discharge pipe (the Rheem manual says DO NOT plug the relief valve outlet). If you can
    safely reach the cold water shut-off on top of the heater, you may close it, and turn off the gas control or
    the electric breaker for the heater. Rheem''s emergency shutdown: if the heater overheats or the gas supply
    will not shut off, turn off the manual gas control valve to the appliance. For an electric heater, turn off
    its breaker. Do not use the heater until a qualified technician checks it.'
  source: '[RHEEM-UC]'
- when: Water heater has been under water, or water is near outlets or the panel
  step: Do not use the water heater if any part of it has been under water. Rheem says to call a qualified service
    technician to inspect it and replace any part of the control system and gas control that was under water. Keep
    power off and stay out of water near outlets or the panel (CDC).
  source: '[RHEEM-UC][S31]'
license_classes:
- job_type:
  - replace_tank
  classes:
  - R-37 Plumbing, Including Solar
  - R-37R Plumbing
  - CR-37 dual
  - CR-77 dual (C-77 + R-37)
  citation: A.A.C. R4-9-103 (R-37 covers water heaters as part of water piping and fixtures); R4-9-104
  other_agency: 'Gas appliance connection: UniSource restores gas service only if it was shut off [UNS-GAS]'
  notes: 'Same classes for all job types. C-37 scope expressly includes hot water supply systems and gas appliances
    [S1]. Electric heater circuit changes: R-11/CR-11 [S2]. R-63 Appliances excludes gas, electrical and plumbing
    lines [S2].'
- job_type:
  - heat_pump_wh
  classes:
  - R-37
  - CR-37
  - plus R-11/CR-11 for a new circuit
  citation: R4-9-103; R4-9-104
  other_agency: null
  notes: '[judgment] on split of trades; most plumbing contractors subcontract the circuit.'
- job_type:
  - convert_tankless
  classes:
  - R-37
  - CR-37
  - CR-77
  citation: R4-9-103; R4-9-104
  other_agency: 'Manufactured homes: A.R.S. 41-4047(5) licensed/certified person; Rinnai says manufactured-home
    installs must meet 24 CFR 3280 [ARS-4047][RINNAI-RE]'
  notes: Gas line upsizing is gas piping work (see gas_lines).
handyman_ok:
  allowed_examples:
  - Electric water heater element or thermostat like-for-like, under $1,000 (no permit for replacing an existing
    water heater in LHC) [S17][S4][judgment]
  - Draining/flushing an electric tank, under $1,000 [judgment]
  not_allowed_examples:
  - 'Any gas or propane water heater work: excluded by A.R.S. 32-1121(D)(2) (fuel gas appliances) [S4]'
  - Any job $1,000 or more, which includes most replacements [S4]
  - Tankless conversion, new circuits [judgment]
  rule_reminder: 'A person without an ROC license may take a job only if ALL are true: total price (labor + materials
    + everything) is under $1,000; the work is casual, minor or inconsequential; no local building permit is required;
    it is not part of a larger job or split up to stay under $1,000; and any ad says ''not a licensed contractor''.
    The exemption never covers work that connects to natural gas, propane or other fuel gas, or fire-safety work
    such as hardwired/interconnected smoke alarms. Source: A.R.S. 32-1121(A)(14) and (D) [S4]. In Lake Havasu City,
    check the city permit list: a needed permit removes the exemption [S17].'
local_notes:
- City water about 19 gpg hardness; Rheem says scale builds in tanks unless water is 0-5 grains, faster at higher
  temperatures, and can shorten heater life [LHC-CCR][RHEEM-UC].
- Rinnai's water-quality table lists total hardness up to 200 mg/L (about 11.7 gpg); city water is about 325 mg/L,
  so tankless owners often ask about softeners and descaling [RINNAI-RE][LHC-CCR].
- Rheem says do not install its gas heater where ambient temperature can exceed 125 F; outdoor closets and attics
  in summer may matter [RHEEM-UC][judgment].
- CPSC suggests setting water heaters to 120 F to help prevent scalds [CPSC-SCALD].
- 'Snowbird and seasonal homes: Rheem advises turning the heater off if idle 60+ days and the hydrogen-gas faucet
  step on return [RHEEM-UC].'
- Rotten-egg smell in HOT water only is different from a gas smell in the air; if unsure, treat it as gas [UNS-GAS][judgment].
- Relief valve dripping can be from thermal expansion in a closed system; Rheem says contact the water supplier
  or local plumbing inspector and never plug the outlet [RHEEM-UC].
- 'LHC: replacing an existing water heater is on the no-permit list; new gas lines need a permit [S17].'
- 'Gas service: natural gas by UniSource in town; some outlying homes use propane [UNS-GAS][judgment].'
sample_card: 'REQ-0171 | Water heater | Lake Havasu City, north

  Gas tank, 50 gal (label photo), garage. Water on floor under tank; top fittings look dry.

  Serial suggests built 2011. Homeowner wants replacement quotes.'
