emergency_signals:
- id: es_house_cleaning_1
  signal: Someone feels sick after mixing cleaners or breathing fumes
  emergency: 'yes'
  safety_step: Call Poison Control at [number removed, see source]. If the person is not breathing, has a seizure or is hard to
    wake, call 911. Never mix bleach with ammonia or any other cleanser. Use bleach in a room with fresh air.
  source: '[T-poison] [T-cdc_bleach]'
  then_route_to: none
  note: 'Routing: none (Poison Control / 911 first)'
- id: es_house_cleaning_2
  signal: Gas smell while cleaning
  emergency: 'yes'
  safety_step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call
    911 and UniSource at [number removed, see source].
  source: '[S23][S22]'
  then_route_to: none
  note: 'Routing: none (leave, call 911 and UES)'
- id: es_house_cleaning_3
  signal: Sewage backup on floors
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: Wear rubber boots, rubber gloves and goggles during cleanup. Keep children and pets out of the area.
    Throw out items that can't be cleaned and dried.
  source: '[S51]'
  then_route_to: plumbing
- id: es_house_cleaning_4
  signal: Guests arriving today and unit not cleaned
  emergency: depends
  note: 'Urgent, not life-safety: card goes out marked time-sensitive. [judgment]'
  safety_step: No official step on file for this signal. If anyone is hurt or in danger, call 911. [judgment]
  source: '[judgment]'
  then_route_to: house_cleaning
- id: es_house_cleaning_5
  signal: Routine cleaning request
  emergency: 'no'
  safety_step: No special safety step; normal job card.
  source: none
  then_route_to: house_cleaning
safety_step:
- when: Mixing cleaners
  step: Never mix bleach with ammonia or any other cleanser. Use bleach in a room with fresh air.
  source: '[T-cdc_bleach]'
- when: Someone swallowed or breathed a cleaning product and feels sick
  step: Call Poison Control at [number removed, see source]. If the person is not breathing, has a seizure or is hard to wake,
    call 911.
  source: '[T-poison]'
- when: Gas smell
  step: Leave the home now. Do not flip switches, use a phone or start a car nearby. From a safe place call 911
    and UniSource at [number removed, see source].
  source: '[S23][S22]'
- when: Sewage or floodwater on floors
  step: Wear rubber boots, rubber gloves and goggles during cleanup. Keep children and pets out of the area. Throw
    out items that can't be cleaned and dried.
  source: '[S51]'
license_classes:
- job_type:
  - recurring
  - deep_clean
  - move_out
  - str_turnover
  - post_construction
  classes:
  - none
  citation: foundation az_license_master §5 [judgment]
  other_agency: LHC business or tax licensing may apply [judgment; not researched]
  notes: No state license is needed for this cleaning work [judgment, per foundation az_license_master §5]. It is
    not construction under ROC rules.
- job_type:
  - specialty_route
  classes:
  - none
  citation: '[T-iicrc_s500] [industry, not law]'
  other_agency: none
  notes: Sewage and water-damage cleanup is restoration work (IICRC S500 industry standard calls sewage Category
    3). Mold remediation and biohazard are specialty services. No ROC class is tied to cleanup itself [judgment].
handyman_ok:
  allowed_examples:
  - All routine cleaning (not construction, so the exemption is not needed)
  not_allowed_examples:
  - Fixing things found during cleaning that need a license (leaks, wiring, gas)
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
  note: Cleaning is not contracting; handyman_ok is shown as yes because no ROC license is involved [judgment].
local_notes:
- 'Lake Havasu City requires a vacation rental permit for each short-term rental (under 30 days) and a 24/7 Emergency
  Point of Contact; the owner must post a city notice inside the front and backyard doors. Source: [T-lhc_vr].'
- 'LHC trash rule for rentals: trash stays in proper containers and out of public view until no more than 12 hours
  before pickup, so turnover crews often handle bins [judgment]. Source: [T-lhc_vr].'
- Havasu's hard water leaves heavy spots on shower glass and fixtures [judgment].
- Summer and holiday weekends are the busiest turnover times; many crews book rentals on standing schedules [judgment].
- 'Dried latex paint can go in regular trash; other household hazards go to the twice-yearly HHW collection days.
  Source: [T-lhc_hhw].'
