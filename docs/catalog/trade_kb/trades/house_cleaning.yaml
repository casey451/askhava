# Ask Hava trade knowledge file: house_cleaning
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: house_cleaning
display_name: House Cleaning
summary: 'Regular and one-time home cleaning: weekly/biweekly upkeep, deep cleans, move-in/move-out, post-construction
  dust, and short-term-rental (vacation rental) turnovers between guests. No state license applies to cleaning.
  Many Havasu homes are seasonal or vacation rentals, so turnover cleaning on fixed check-out/check-in windows is
  a big part of the local work [judgment]. Sewage, mold growth and hoarding-level cleanups belong to restoration
  or specialty services, not routine cleaning.'
