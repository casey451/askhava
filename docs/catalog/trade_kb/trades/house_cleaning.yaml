questions:
- id: q1_type
  text: What kind of cleaning?
  options:
  - Regular (weekly or every 2 weeks)
  - One-time deep clean
  - Move-in or move-out
  - Vacation rental turnover
  - After a remodel
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Recurring, deep and move-out cleans take very different time.
- id: q2_size
  text: How big is the home?
  options:
  - 1-2 bedrooms
  - 3 bedrooms
  - 4+ bedrooms
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Home size drives time and crew size.
- id: q3_baths
  text: How many bathrooms?
  options:
  - '1'
  - '2'
  - 3+
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Bathrooms are the slowest rooms to clean. [judgment]
- id: q4_condition
  text: How long since the last full clean?
  options:
  - Under a month
  - 1-6 months
  - Over 6 months
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Long gaps between cleans add hours.
- id: q5_extras
  text: Any extras?
  options:
  - Inside oven/fridge
  - Inside windows
  - Laundry or bed linens
  - Patio/garage
  - None
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Ovens, fridges, windows and linens add time.
- id: q6_str_window
  text: 'For rentals: how much time between check-out and check-in?'
  options:
  - Under 4 hours
  - 4-6 hours
  - Same day, flexible
  - Not sure
  ask_if: type = Vacation rental turnover
  changes_price: 'no'
  why: Tight turnover windows need a bigger crew on a set schedule. [judgment]
