# Written by Claude (expert layer, Oct 29 2026), not part of the Grok delivery (D-431). AI research, not legal advice.
# Ask Hava trade knowledge file: dog_waste_pickup. Schema: foundation/schema.yaml (v2). Items marked [judgment] are not
# from a cited source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: dog_waste_pickup
display_name: "Dog waste pickup"
summary: >
  Pickup of dog waste from home yards, dog runs and shared spaces. Most requests are ongoing weekly or twice-a-week
  service, quoted by the month. Others are a one-time cleanup of a yard that has built up, often before a sale, after
  a tenant moves out, or when owners come back for the winter [judgment]. Some HOAs, apartment sites and RV parks want
  pet stations emptied and common areas picked up [judgment]. Ask Hava collects the number of dogs, the yard size and
  ground, how long since the last cleanup and where the waste should go, then sends an anonymous job card. No state
  contractor license applies to this work [judgment].
job_types:
  - id: weekly_pickup
    label: "Ongoing pickup (weekly, twice a week or every other week)"
    site_visit_usually_needed: "no"
  - id: one_time_cleanup
    label: "One-time cleanup of a built-up yard"
    site_visit_usually_needed: "sometimes"
  - id: multi_dog_large_yard
    label: "Three or more dogs, or a large yard or lot"
    site_visit_usually_needed: "sometimes"
  - id: commercial_hoa
    label: "HOA, apartment or RV park common area and pet stations"
    site_visit_usually_needed: "yes"
  - id: turf_deodorize
    label: "Deodorizing artificial turf or dog areas (add-on to pickup)"
    site_visit_usually_needed: "no"
