questions:
  - id: q1_service_kind
    text: "What do you need?"
    options: ["Weekly pickup", "Twice a week", "Every other week", "One-time cleanup", "HOA or common area", "Not sure"]
    ask_if: "always"
    changes_price: "yes"
    why: "How often a business comes sets the monthly quote, and a one-time cleanup is quoted on its own. [judgment]"
  - id: q2_dogs
    text: "How many dogs use the yard?"
    options: ["1", "2", "3", "4 or more"]
    ask_if: "job_type != commercial_hoa"
    changes_price: "yes"
    why: "More dogs means more waste each visit; many services quote by the number of dogs. [judgment]"
  - id: q3_last_cleaned
    text: "About when was the yard last picked up?"
    options: ["In the last week", "2 to 4 weeks ago", "1 to 3 months ago", "Longer than that", "Not sure"]
    ask_if: "job_type != commercial_hoa"
    changes_price: "yes"
    why: "A yard with weeks of buildup takes longer on the first visit. [judgment]"
  - id: q4_area_size
    text: "About how big is the area the dogs use?"
    options: ["Small (side yard or dog run)", "Medium (typical back yard)", "Large (big lot, over about a quarter acre)", "Front and back yards", "Not sure"]
    ask_if: "job_type != commercial_hoa"
    changes_price: "yes"
    why: "A bigger area takes longer to walk and check. [judgment]"
  - id: q5_ground
    text: "What is the ground like where the dogs go?"
    options: ["Rock or gravel", "Grass", "Artificial turf", "Dirt", "A mix", "Not sure"]
    ask_if: "always"
    changes_price: "yes"
    why: "Rock and gravel yards can take longer to pick up than grass or turf. [judgment]"
  - id: q6_disposal
    text: "Where should the waste go?"
    options: ["Bagged in my trash can", "Hauled away by the business", "Either is fine"]
    ask_if: "always"
    changes_price: "yes"
    why: "Some services leave bags in the homeowner's trash can and some haul them away for a different price. [judgment]"
  - id: q7_common_area
    text: "How many pet stations or dog areas are there?"
    options: ["1 or 2", "3 to 5", "6 or more", "Not sure"]
    ask_if: "job_type == commercial_hoa"
    changes_price: "yes"
    why: "The number of stations and areas sets the time on site for a common-area account. [judgment]"
quote_without_visit_needs:
  - "Number of dogs [judgment]"
  - "How often (weekly, twice a week, every other week, or one time) [judgment]"
  - "Rough yard size and which yards (front, back, side) [judgment]"
  - "Ground type: rock, grass, artificial turf or dirt [judgment]"
  - "How long since the last cleanup, or a photo of the yard today [judgment]"
  - "Where the waste goes (homeowner trash can or hauled away) [judgment]"
  - "How the business gets into the yard and whether dogs are out during the visit (gate codes are given only on the call, never on the card) [judgment]"
site_visit_usually_needed:
  - "commercial_hoa: common areas and stations are usually walked before a quote [judgment]"
  - "one_time_cleanup with months of buildup over a large lot [judgment]"
photos_to_request:
  - id: p1_yard_overview
    ask: "A wide photo of the yard where the dogs go, in daylight."
    for_job_types: [all]
  - id: p2_gate_access
    ask: "A photo of the gate or way into the yard, with no codes or house numbers showing."
    for_job_types: [weekly_pickup, one_time_cleanup, multi_dog_large_yard, turf_deodorize]
  - id: p3_heaviest_spot
    ask: "A photo of the spot with the most buildup."
    for_job_types: [one_time_cleanup, multi_dog_large_yard]
  - id: p4_turf_area
    ask: "A photo of the artificial turf or dog run area."
    for_job_types: [turf_deodorize, weekly_pickup]
  - id: p5_common_area
    ask: "A photo of the common area or one of the pet stations."
    for_job_types: [commercial_hoa]
photo_cues:
  - photo_id: p1_yard_overview
    look_for: ["Rough size of the yard", "Ground type (rock, grass, turf, dirt)", "Plants, cactus or shrubs dogs go under", "Amount of waste visible"]
    neutral_wording_example: "Photo shows a medium back yard with gravel and a small turf patch; waste visible in several spots."
  - photo_id: p2_gate_access
    look_for: ["Side gate or walkway into the yard", "Lock or latch on the gate", "Steps or slope on the way in"]
    neutral_wording_example: "Photo shows a side gate with a latch and a gravel walkway."
  - photo_id: p3_heaviest_spot
    look_for: ["How much buildup is in one area", "Whether the spot is on rock, turf or dirt"]
    neutral_wording_example: "Photo shows heavy buildup along the back wall on gravel."
  - photo_id: p4_turf_area
    look_for: ["Size of the turf or dog run", "Stains or discolored spots on turf"]
    neutral_wording_example: "Photo shows an artificial turf area about the size of a small patio with darker spots near one corner."
  - photo_id: p5_common_area
    look_for: ["Pet station with bag holder and can", "Size of the grass or rock area", "Signs or fencing around the area"]
    neutral_wording_example: "Photo shows a pet station with a bag holder and trash can next to a gravel strip."
photo_red_flags:
  - flag: "Photo shows a gate code, lockbox, house number, plate or a person's face (privacy: ask for a cropped or new photo)"
    safety_step_ref: null
  - flag: "Standing sewage or a septic overflow in the yard (not dog waste pickup; may be a septic or plumbing request) [judgment]"
    safety_step_ref: null
  - flag: "Dead animal or wildlife in the yard (not dog waste pickup; a different service may fit) [judgment]"
    safety_step_ref: null
emergency_signals:
  - id: es_dog_waste_pickup_1
    signal: "Routine pickup or cleanup request"
    emergency: "no"
    safety_step: "No special safety step; normal job card."
    source: "none"
    then_route_to: dog_waste_pickup
  - id: es_dog_waste_pickup_2
    signal: "Notice from the HOA or city about a yard, or guests or buyers coming soon"
    emergency: "no"
    safety_step: "No special safety step; normal job card."
    source: "none"
    then_route_to: dog_waste_pickup
    note: "Not an emergency. The card may say the homeowner wants a visit soon. [judgment]"
safety_step: []
license_classes:
  - job_type: [weekly_pickup, one_time_cleanup, multi_dog_large_yard, commercial_hoa]
    work: "Picking up and bagging dog waste"
    classes: ["none"]
    citation: "No ROC class in A.A.C. R4-9-103 covers waste pickup; it is not construction work [judgment] [S2]"
    other_agency: "Lake Havasu City business license; some businesses also need a privilege tax license [T-lhc_bizlic]"
    notes: "Ask Hava does not check city licenses. A business can confirm its own city license with Lake Havasu City."
  - job_type: [turf_deodorize]
    work: "Deodorizing turf or dog areas with a ready-to-use product"
    classes: ["none"]
    citation: "A.R.S. 3-3611(A)(3): pest-management licensing does not apply to persons using a nonrestricted, ready-to-use disinfectant, sanitizer or deodorizer [T-ars_3611]"
    other_agency: "none"
    notes: "Spraying a yard for fleas, ticks or other pests is pest management; that request goes to pest_control [judgment] [S9]."
handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: "Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit, is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)), and ads say 'not a licensed contractor'. Source: A.R.S. 32-1121(A)(14) and (D) [S4]"
  note: "Dog waste pickup is not construction work, so the handyman exemption does not come into play [judgment]. The category does not send cards to handyman businesses (handyman_allowed: false in docs/catalog/categories.yaml)."
local_notes:
  - "Lake Havasu City Code 6.20.050 makes it a civil offense not to remove dog waste left on someone else's property, or to let waste pile up or spread so it can be seen or smelled from outside the property. Some requests may follow a neighbor, HOA or city notice. Ask Hava gives no legal advice. Source: [T-lhc_title6]"
  - "City code 6.20.010 says dog owners in city parks must clean up after their dogs; HOA and park-style common areas often have pet stations [T-lhc_title6] [judgment]."
  - "Summer heat runs June to September; many services work early in the morning then, and odor and flies may be stronger [judgment]."
  - "Monsoon season officially runs June 15 to September 30. Storms and dust can leave yards muddy or covered in dirt for a while [T-nws_monsoon] [judgment]."
  - "Many yards are rock or gravel with little grass, and more homes have artificial turf dog areas [judgment]."
  - "Seasonal residents and second homes: some owners want a cleanup before they arrive or after renters leave, and a pause while away [judgment]."
  - "HOAs, manufactured-home parks and RV parks may want common-area accounts with several pet stations [judgment]."
  - "The CDC says dog poop can carry germs that make people and animals sick, and should be picked up even in your own yard. Ask Hava does not give health advice; this is background only. Source: [T-cdc_dogs]"
  - "Pet waste washed off by storms can reach waterways; a regional stormwater study found pet waste was a source of about a quarter of the bacteria in stream samples (Kansas City area, not Lake Havasu). Background only. Source: [T-marc_petwaste]"
  - "Where bagged dog waste may go (city trash cans, haul-away) was not checked with Lake Havasu City solid waste rules; businesses handle this [open question]."
sample_card: |
  REQ-0142 | Dog waste pickup | Lake Havasu City, south side
  2 dogs, medium back yard, gravel with a small artificial turf patch. Wants weekly pickup.
  Last picked up about a month ago. Bags can go in the homeowner's trash can. 2 photos.
