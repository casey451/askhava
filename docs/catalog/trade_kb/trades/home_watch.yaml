# Written by Claude (expert layer, Oct 29 2026), not part of the Grok delivery (D-431). AI research, not legal advice.
# Ask Hava trade knowledge file: home_watch. Schema: foundation/schema.yaml (v2). Items marked [judgment] are not
# from a cited source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: home_watch
display_name: "Home watch"
summary: >
  Scheduled visits to a home while the owner is away, most often a seasonal or second home that sits empty for
  months. A visit is a walk-through that looks for plain, visible problems and reports back to the owner, often with
  photos [T-nhwa]. Most requests are ongoing weekly or every-other-week checks, quoted by the month. Others are one
  visit after a monsoon storm, getting the house ready before the owner arrives or closing it up after they leave,
  letting a contractor or delivery in, or holding a spare key [judgment]. Ask Hava collects how often, how big the
  home is, what each visit should include, when the owner is away and how the business gets in, then sends an
  anonymous job card. Home watch is not property management: rent collection, finding tenants and leasing are never
  carded (LIC-018), and in Arizona those acts for another person are real estate broker acts under A.R.S. 32-2101
  [T-ars_2101]. No state contractor license applies to the visits themselves [judgment].
job_types:
  - id: weekly_house_check
    label: "Regular checks while away (weekly, every two weeks or monthly)"
    site_visit_usually_needed: "no"
  - id: storm_check
    label: "One-time check after a storm or monsoon"
    site_visit_usually_needed: "no"
  - id: arrival_departure
    label: "Get the house ready before arrival or close it up after leaving (AC, water, fridge)"
    site_visit_usually_needed: "no"
  - id: meet_and_greet
    label: "Let in a contractor, cleaner or delivery while the owner is away"
    site_visit_usually_needed: "no"
  - id: key_holding
    label: "Hold a spare key and come let the owner in if locked out (optional add-on)"
    site_visit_usually_needed: "no"
  - id: leasing_refused
    label: "Rent collection, finding tenants or leasing (not offered, no card)"
    site_visit_usually_needed: "no"
