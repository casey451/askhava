# Ask Hava trade knowledge file: gutter_solar_cleaning
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: gutter_solar_cleaning
display_name: Gutter & Solar Panel Cleaning
summary: Gutter and downspout cleaning, solar panel washing, and bird (pigeon) critter-guard requests under panels.
  Many Havasu homes have few or no gutters, so solar washing and roof-debris cleanup are more common [judgment].
  Panel makers' manuals generally say to use soft water and soft brushes and not to use pressure washers [judgment;
  check the panel manual]. Walking on tile roofs can crack tiles [judgment]. Cleaning needs no license; gutter install
  or repair is ROC R-45 Sheet Metal; any solar wiring or damaged panel goes to the solar installer (R-11).
