questions:
- id: q1_what
  text: What do you need?
  options:
  - Clean gutters
  - Wash solar panels
  - Keep birds out from under panels
  - Clear roof debris
  - Fix or install gutters
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Gutters, panels and bird guards are different jobs and sometimes different businesses.
- id: q2_panel_count
  text: About how many solar panels?
  options:
  - Under 15
  - 15-30
  - Over 30
  - Not sure
  ask_if: what = solar or birds
  changes_price: 'yes'
  why: Panel count is how solar washing and guards are quoted.
- id: q3_stories
  text: How many stories?
  options:
  - 1 story
  - 2 stories
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Height changes ladder setup and time.
- id: q4_roof_type
  text: What is the roof made of?
  options:
  - Tile
  - Foam/flat
  - Shingle
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Tile roofs need careful foot placement or ladders/poles. [judgment]
- id: q5_damage
  text: Do you see any cracked panels or loose wires?
  options:
  - 'Yes'
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'no'
  why: Damage goes to the solar installer, not a cleaner.
