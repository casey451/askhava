questions:
- id: q1_type
  text: What kind of inspection?
  options:
  - Buying a home
  - Selling a home
  - New-build warranty
  - Termite report only
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Buyer, seller and warranty inspections differ in scope.
- id: q2_size
  text: About how big is the home?
  options:
  - Under 1,500 sq ft
  - 1,500-2,500 sq ft
  - 2,500-3,500 sq ft
  - Over 3,500 sq ft
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Square footage drives inspection time and price.
- id: q3_home_kind
  text: What type of home?
  options:
  - Site-built house
  - Manufactured/mobile home
  - Condo/townhome
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Manufactured homes have different systems to check.
- id: q4_addons
  text: Any add-ons?
  options:
  - Pool or spa
  - Sewer scope
  - Termite report
  - None
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Pool, sewer and termite reports are added services, sometimes by other licensees.
- id: q5_age
  text: About how old is the home?
  options:
  - Under 10 years
  - 10-30 years
  - 30-50 years
  - Over 50 years
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Older homes take longer to inspect. [judgment]
- id: q6_deadline
  text: Is there a contract deadline for the inspection?
  options:
  - Yes, within a week
  - Yes, longer
  - 'No'
  - Not sure
  ask_if: always
  changes_price: 'no'
  why: Buyer inspection periods are short, so timing matters.
