  step: Go outside or to an open window or door, call 911, stay there until help arrives.
  source: '[T-nfpa_sounds]'
license_classes:
- job_type:
  - buyer_inspection
  - pre_listing
  - manufactured_home
  - addons
  - warranty_check
  classes:
  - none
  citation: '[S6]; [S5]; [T-aac_r4_30_247]; [T-btr_hi]'
  other_agency: AZ Board of Technical Registration
  notes: 'No ROC class. Must be a BTR certified home inspector (A.R.S. 32-122.02): exam, course, fingerprint clearance
    card, and E&O insurance or bond. ''Home inspection'' covers residential buildings of 4 units or fewer (A.R.S.
    32-101).'
- job_type:
  - wdiir
  classes:
  - none
  citation: '[T-ars_3_3633]; [T-azda_wdiir]'
  other_agency: AZ Dept. of Agriculture, Pest Management Division
  notes: 'Wood-destroying insect inspection reports: AZ Dept. of Agriculture Pest Management licensee, not the home
    inspector certificate alone.'
handyman_ok:
  allowed_examples: []
  not_allowed_examples:
  - Home inspections for others (BTR certificate required)
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
  note: Not a construction trade; the handyman exemption does not apply to inspections.
local_notes:
- 'BTR standards of practice: the inspection is visual and not technically exhaustive; it is not a code-compliance
  check and does not estimate repair costs. Source: [T-aac_r4_30_301_01].'
- Many Havasu sales include pools; pool and spa checks are often add-ons [judgment].
- 'Manufactured homes are common in parts of Havasu; installation issues go to an ADOH-licensed installer. Source:
  [S12].'
- Buyers often have a short inspection window under their purchase contract [judgment].
sample_card: 'REQ-0374 | Home inspection | Lake Havasu City, south side

  Buyer inspection, site-built home about 2,000 sq ft, built in the 1990s, pool add-on and termite report.

  Contract deadline within a week.

  '
