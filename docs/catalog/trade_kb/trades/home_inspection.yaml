# Ask Hava trade knowledge file: home_inspection
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: home_inspection
display_name: Home Inspection
summary: 'Buyer, seller (pre-listing) and pre-warranty home inspections, plus add-ons such as termite (WDIIR) reports,
  pool/spa, sewer scope and manufactured-home checks. Arizona home inspectors must be certified by the AZ Board
  of Technical Registration (BTR) under A.R.S. 32-122.02 and follow BTR standards of practice (A.A.C. R4-30-301.01):
  a visual, non-invasive look, not a code inspection. Termite (wood-destroying insect) reports must be done by an
  AZ Dept. of Agriculture pest management licensee (A.R.S. 3-3633). Ask Hava never says what an inspection will
  find.'
