questions:
- id: q1_job
  text: What do you need?
  options:
  - System isn't working right
  - Damage or roof leak near panels
  - Remove and reinstall for roof work
  - New system or more panels
  - Add a battery
  - Bird guards or cleaning
  ask_if: always
  changes_price: 'yes'
  why: Service calls, roof R&R and new systems are quoted very differently. [judgment]
- id: q2_owned
  text: Do you own the system or lease it?
  options:
  - Own it (paid off or loan)
  - Lease or power purchase agreement
  - Not sure
  - No system yet
  ask_if: q1_job != 'New system or more panels'
  changes_price: 'yes'
  why: Leased systems are often serviced by the leasing company under the agreement; owners hire who they choose.
    [ARS-1763][judgment]
- id: q3_size
  text: How many panels, or what size (kW) is the system?
  options:
  - Under 15 panels
  - 15-30 panels
  - More than 30
  - Not sure
  ask_if: q1_job in ['Remove and reinstall for roof work', 'Bird guards or cleaning', 'Add a battery'] or job_type
    in [remove_reinstall, critter_guard, add_battery]
  changes_price: 'yes'
  why: Panel count drives labor for R&R and guards. [judgment]
- id: q4_roof
  text: What is the roof like?
  options:
  - Flat roof
  - Tile roof
  - Shingle roof
  - Metal roof
  - Ground mount or patio
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Roof type changes mounting, access and leak work; Arizona law requires a roof evaluation before rooftop installs.
    [ARS-1762][judgment]
- id: q5_brand
  text: Can you send a photo of the inverter or its label (on a wall, often by the meter or panel)?
  options:
  - Sent a photo
  - Can't find it
  - Not sure
  ask_if: q1_job in ['System isn\'t working right', 'Add a battery']
  changes_price: 'yes'
  why: Brand and type (string inverter, microinverters, optimizers) shape the service call. [judgment]
- id: q6_bill
  text: 'For a new system: can you share your yearly electric use (kWh) from a UniSource bill, without account numbers?'
  options:
  - Yes, I'll send it
  - Not now
  ask_if: q1_job == 'New system or more panels'
  changes_price: 'yes'
  why: Usage sizes a quote. Remove account numbers and names before sending. [judgment]
quote_without_visit_needs:
- Bird guards with panel count and roof photos [judgment]
- Remove/reinstall ballpark with panel count, roof type and inverter photo [judgment]
- Panel cleaning with panel count and stories [judgment]
site_visit_usually_needed:
- New systems and batteries (roof, panel, interconnection) [ARS-1762][S17][judgment]
- Production problems and damage [judgment]
- Roof leaks near panels (may also need a roofer) [judgment]
photos_to_request:
- id: p1_array
  ask: A photo of the panels on the roof taken from the ground. Please do not go on the roof.
  for_job_types:
  - remove_reinstall
  - critter_guard
  - damage_leak
  - expand_system
  - panel_cleaning
  - new_system
- id: p2_inverter
  ask: A photo of the inverter or its screen and label, and any lights or error codes.
  for_job_types:
  - system_not_producing
  - add_battery
  - expand_system
- id: p3_app
  ask: A screenshot of your solar app's production graph, with any account details cropped out.
  for_job_types:
  - system_not_producing
- id: p4_panel
  ask: A photo of your main electrical panel and meter with the door open.
  for_job_types:
  - new_system
  - add_battery
  - expand_system
- id: p5_damage
  ask: A photo of the damage or leak from a safe spot. Do not touch broken panels or wires.
  for_job_types:
  - damage_leak
photo_cues:
- photo_id: p2_inverter
  look_for:
  - 'Brand: SolarEdge, Enphase (microinverters, IQ combiner box), SMA, Fronius, Tesla, Generac etc. [judgment]'
  - Status light color and any code; record only what is shown [judgment]
  - Rapid shutdown switch or label near the meter [TESLA-PV][judgment]
  neutral_wording_example: SolarEdge inverter on garage wall; status light red; screen shows an error number.
- photo_id: p1_array
  look_for:
  - Panel count; roof type; panels on several roof faces; gaps where birds can nest; debris [judgment]
  neutral_wording_example: About 22 panels on a tile roof, two roof faces; nesting material visible under one edge.
- photo_id: p3_app
  look_for:
  - Zero output vs lower output; date of change (record only) [judgment]
  neutral_wording_example: App graph shows zero production for the last 3 days.
- photo_id: p4_panel
  look_for:
  - Main breaker size; open spaces; existing solar breaker; meter type [judgment]
  neutral_wording_example: 200 amp panel with a 40 amp solar breaker at the bottom.
- photo_id: p5_damage
  look_for:
  - Cracked glass, scorch marks, hanging conduit or wires [judgment]
  neutral_wording_example: One panel shows cracked glass; conduit loose along roof edge.
photo_red_flags:
- flag: Scorch marks, smoke or melted parts on panels, wiring, inverter or battery
  safety_step_ref: es_fire
- flag: Cracked panels or wires hanging loose
  safety_step_ref: es_damage
- flag: Battery or inverter in standing water
  safety_step_ref: es_battery
emergency_signals:
- id: es_fire
  signal: Fire, smoke, sparks or burning smell at panels, roof wiring or inverter
  emergency: 'yes'
  safety_step: 'If there is fire or smoke at the panels, roof wiring, inverter or battery: get everyone out and
    call 911 from outside. Tell the fire crew the home has solar (and a battery, if so). Tesla''s manual says array
    wiring should be treated as dangerous after a fire, even with rapid shutdown, and to stay away from all parts
    of the system until it has been made safe.'
  source: '[NFPA-ESCAPE][TESLA-PV]'
  then_route_to: solar
- id: es_battery
  signal: Home battery smoking, smelling odd, making unusual noise, or in water
  emergency: 'yes'
  safety_step: 'Tesla''s Powerwall manual says to call the fire department first and make sure everyone can leave
    the area. Only if it is safe: turn off the battery and its AC breaker (and the solar inverter breaker). If any
    part of the battery or wiring is in water, stay out of the water. If there is an unusual smell, ventilate the
    room. Other brands: follow the owner''s manual.'
  source: '[TESLA-PW3]'
  then_route_to: solar
- id: es_damage
  signal: Broken panels, loose or hanging wires after a storm
  emergency: depends
  safety_step: 'Do not touch broken panels, loose wires or damaged roof wiring; solar panels make power whenever
    there is daylight. Keep people and pets away. If wires are down from the house to the street, treat them as
    live: stay away and call 911 and UniSource, [number removed, see source].'
  source: '[TESLA-PV][S24][S25]'
  then_route_to: solar
safety_step:
- when: Fire, smoke, sparks or burning smell at panels, roof wiring or inverter
  step: 'If there is fire or smoke at the panels, roof wiring, inverter or battery: get everyone out and call 911
    from outside. Tell the fire crew the home has solar (and a battery, if so). Tesla''s manual says array wiring
    should be treated as dangerous after a fire, even with rapid shutdown, and to stay away from all parts of the
    system until it has been made safe.'
  source: '[NFPA-ESCAPE][TESLA-PV]'
- when: Home battery smoking, smelling odd, making unusual noise, or in water
  step: 'Tesla''s Powerwall manual says to call the fire department first and make sure everyone can leave the area.
    Only if it is safe: turn off the battery and its AC breaker (and the solar inverter breaker). If any part of
    the battery or wiring is in water, stay out of the water. If there is an unusual smell, ventilate the room.
    Other brands: follow the owner''s manual.'
  source: '[TESLA-PW3]'
license_classes:
- job_type:
  - new_system
  classes:
  - R-11 Electrical (with solar qualification) [unverified]
  - CR-11 Electrical (dual, with solar qualification) [unverified]
  citation: A.R.S. 32-1170.01 (solar contractor qualification required to install, alter or repair a solar device)
    [ARS-1170]; A.R.S. 44-1762(E) (installer must hold the appropriate license and pass the solar exam) [ARS-1762];
    R-11 scope 'install and repair residential electrical systems' R4-9-103 [S2]; A.A.C. R4-9-104 [S3] (CR- dual
    classes)
  other_agency: UniSource interconnection and permission to operate [ARS-1763][judgment on process]
  notes: 'Which ROC class is used for PV comes from secondary sources (IREC: PV under R-11/C-11/CR-11) [S39]; roc.az.gov
    could not be opened to confirm. Same classes for system_not_producing, damage_leak, remove_reinstall, add_battery,
    expand_system. Roof patching after R&R may also need R-42 Roofing [S2].'
- job_type:
  - solar_water_pool
  classes:
  - R-37 Plumbing, Including Solar
  - CR-77 Plumbing including Solar (C-77 + R-37)
  - R-37R Solar Plumbing Liquid Systems Only [unverified]
  - CR-78 Solar Plumbing Liquid Systems Only (C-78 + R-37R) [unverified]
  - B-6 General Swimming Pool Contractor, Including Solar (pool solar)
  citation: R4-9-103 (R-37 Plumbing, Including Solar; B-6 Including Solar) [S2]; R4-9-104 (CR-77, CR-78) [S3]; solar
    qualification per A.R.S. 32-1170.01
  other_agency: null
  notes: Solar water heating is a 'solar device' under A.R.S. 32-1170 [ARS-1170].
- job_type:
  - critter_guard
  classes:
  - R-11 / CR-11 with solar qualification if attached to the array [judgment]
  citation: A.R.S. 32-1170.01 (alter or repair a solar device) [ARS-1170]; A.A.C. R4-9-103 [S2] (R- residential
    classes); A.A.C. R4-9-104 [S3] (CR- dual classes)
  other_agency: null
  notes: '[judgment]: clip-on guards may be treated as alteration; under $1,000 jobs may fall under the handyman
    exemption if no permit.'
- job_type:
  - panel_cleaning
  classes:
  - None for washing [judgment]
  citation: n/a
  other_agency: null
  notes: Route to gutter_solar_cleaning.
handyman_ok:
  allowed_examples:
  - Panel washing from the ground or with proper fall protection [judgment]
  - Bird guard install under $1,000 with no permit [S4][judgment]
  not_allowed_examples:
  - Any new PV system (LHC permit) [S17]
  - Installing, altering or repairing a solar device as a contractor without solar qualification [ARS-1170]
  - Battery or inverter installs [judgment]
  - Any job $1,000 or more [S4]
  rule_reminder: 'A person without an ROC license may take a job only if ALL are true: total price (labor + materials
    + everything) is under $1,000; the work is casual, minor or inconsequential; no local building permit is required;
    it is not part of a larger job or split up to stay under $1,000; and any ad says ''not a licensed contractor''.
    The exemption never covers work that connects to natural gas, propane or other fuel gas, or fire-safety work
    such as hardwired/interconnected smoke alarms. Source: A.R.S. 32-1121(A)(14) and (D) [S4]. In Lake Havasu City,
    check the city permit list: a needed permit removes the exemption [S17].'
local_notes:
- 'Arizona law: rooftop solar contractors must evaluate the roof before the first install and suggest the customer
  get a roofing inspection; they are responsible for roof damage caused by the install [ARS-1762].'
- Arizona law sets a minimum warranty for residential solar (at least 2 years for collectors, storage and installation,
  or a written output warranty; 1 year for other parts) [ARS-1762].
- Arizona solar sale or lease agreements must be signed and dated, list major components and warranties, and give
  at least 3 business days to cancel before install; lease payments may not start before utility permission to operate
  [ARS-1763]. Ask Hava only states these as facts if asked and never gives legal advice [judgment].
- UniSource Energy Services is the electric utility in Lake Havasu City [S22].
- Pigeons nesting under panels and dust buildup are common requests in Havasu [judgment].
- Many homes have flat roofs with older swamp cooler or AC equipment; solar quotes may involve working around it
  [judgment].
- 'Summer roof heat: crews often start very early; this is a business choice, not something Ask Hava promises [judgment].'
- 'LHC: PV systems need a permit [S17].'
sample_card: 'REQ-0207 | Solar | Lake Havasu City, west

