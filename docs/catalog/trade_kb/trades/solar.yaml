# Ask Hava trade knowledge file: solar
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: solar
display_name: Solar (PV panels, inverters, batteries, solar water heating)
summary: Rooftop and ground-mount solar electric (PV) systems, inverters, monitoring, home batteries, panel removal
  and reinstall for roof work, critter guards, and solar water or pool heating. Arizona law makes it unlawful for
  a contractor to install, alter or repair a solar device without qualifying as a solar contractor, which means
  passing a solar exam tied to the license class [ARS-1170][ARS-1762]. Ask Hava learns whether it is a problem,
  an add-on, a removal or a new system, owned vs leased, system size and brand from photos, then writes a card.
  It never estimates savings, payback or production, and never says a system is underperforming. PV installs need
  an LHC permit [S17]. Panel washing routes to gutter_solar_cleaning.
