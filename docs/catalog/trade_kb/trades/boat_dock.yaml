photo_cues:
- photo_id: all
  look_for:
  - Chalky faded gelcoat (oxidation)
  - Mussel shells or crust on hull, lower unit or lift (possible quagga) [judgment]
  - Rusted or bent lift cables and cradles
  - Broken or sinking dock floats
  - Non-marine extension cords to the boat
photo_red_flags:
- flag: Extension cords or damaged shore power cords in or near water
  safety_step_ref: null
- flag: Fuel in bilge or fuel smell
  safety_step_ref: es_gas_smell_in_bilge
- flag: Dock tilted or sinking
  safety_step_ref: null
- flag: Cracked lift cables holding a boat
  safety_step_ref: null
emergency_signals:
- id: es_anyone_feels_a_tingle_or_shock
  signal: Anyone feels a tingle or shock in the water near a dock or boat
  emergency: 'yes'
  safety_step: Never swim near docks or marinas with power. If you feel a tingle, move away from the power source
    and get out without using a metal ladder. Do not jump in to help; turn off shore power and call 911. Docks and
    boats should get yearly checks by a qualified marine electrician.
  source: NFPA, Electric Shock Drowning - https://www.nfpa.org/education-and-research/electrical/electric-shock-drowning
    ; CPSC, Don't Swim with Shocks (electrical safety in and around pools, hot tubs and spas) - https://www.cpsc.gov/Safety-Education/Safety-Guides/Sports-Fitness-and-Recreation/Pools-and-Spas
  then_route_to: boat_dock
- id: es_gas_smell_in_bilge
  signal: Gas smell in bilge
  emergency: 'yes'
  safety_step: Do not start the engine. Open hatches, sniff the bilge, and run the bilge blower at least 4 minutes
    before starting. If you still smell fuel, do not start it.
  source: U.S. Coast Guard Boating Safety Circular 83 (bilge blower before starting) - https://uscgboating.org/library/boating-safety-circulars/BSC83.pdf
    ; 33 CFR 183.610 Powered ventilation system (blower warning label) - https://www.law.cornell.edu/cfr/text/33/183.610
  then_route_to: boat_dock
- id: es_boat_sinking_at_dock
  signal: Boat sinking at dock
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: boat_dock
- id: es_someone_dizzy_or_sick_on_the_b
  signal: Someone dizzy or sick on the boat (carbon monoxide)
  emergency: 'yes'
  safety_step: Move the person to fresh air and call 911. CO has no smell.
  source: CDC, Carbon Monoxide Poisoning basics - https://www.cdc.gov/carbon-monoxide/
  then_route_to: boat_dock
- id: es_fire_on_the_boat_or_dock
  signal: Fire on the boat or dock
  emergency: 'yes'
  safety_step: Use the matching step in foundation/part1_all_reasons.md section 3 (call 911 if anyone is hurt or
    in danger).
  source: foundation/part1_all_reasons.md [no trade-specific official step in this file]
  then_route_to: boat_dock
safety_step:
- when: Tingle or shock near a dock (electric shock drowning)
  step: Never swim near docks or marinas with power. If you feel a tingle, move away from the power source and get
    out without using a metal ladder. Do not jump in to help; turn off shore power and call 911. Docks and boats
    should get yearly checks by a qualified marine electrician.
  source: NFPA, Electric Shock Drowning - https://www.nfpa.org/education-and-research/electrical/electric-shock-drowning
    ; CPSC, Don't Swim with Shocks (electrical safety in and around pools, hot tubs and spas) - https://www.cpsc.gov/Safety-Education/Safety-Guides/Sports-Fitness-and-Recreation/Pools-and-Spas
- when: Gas smell or after fueling
  step: Do not start the engine. Open hatches, sniff the bilge, and run the bilge blower at least 4 minutes before
    starting. If you still smell fuel, do not start it.
  source: U.S. Coast Guard Boating Safety Circular 83 (bilge blower before starting) - https://uscgboating.org/library/boating-safety-circulars/BSC83.pdf
    ; 33 CFR 183.610 Powered ventilation system (blower warning label) - https://www.law.cornell.edu/cfr/text/33/183.610
- when: Carbon monoxide signs on a boat
  step: Move the person to fresh air and call 911. CO has no smell.
  source: CDC, Carbon Monoxide Poisoning basics - https://www.cdc.gov/carbon-monoxide/
- when: Moving a boat off Lake Havasu
  step: 'Clean, drain and dry: pull the plug and drain bilge, live wells, ballast and lower unit. Boats in the lake
    6 or more days in a row must be decontaminated before moving.'
  source: Arizona Game and Fish Department, Aquatic Invasive Species (quagga mussels; clean, drain, dry; decontamination)
    - https://www.azgfd.com/fishing-2/aquatic-invasive-species/
