# Ask Hava trade knowledge file: boat_dock
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: boat_dock
display_name: Boat & dock services
summary: 'Boats and docks on and around Lake Havasu: boat engine and outboard/sterndrive repair, winterizing and
  tune-ups, trailer work, detailing and oxidation removal, upholstery, decontamination questions, boat lift repair,
  and dock repair or building. Dock work over the lake is regulated by several agencies (U.S. Army Corps of Engineers,
  BLM and/or Bureau of Reclamation for shoreline land, and Lake Havasu City for docks in its code), and most docks
  and lifts are at marinas with their own rules [judgment]. Ask Hava never says which permit a job needs; it gathers
  facts and sends a card.'
