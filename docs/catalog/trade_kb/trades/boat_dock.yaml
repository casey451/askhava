handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: 'Boat repair and detailing: no ROC license is needed [judgment]. Docks: no. Dock work over the lake needs
    federal (Army Corps) and city approvals, and dock electrical is licensed electrical work.'
local_notes:
- 'Who regulates dock work on Lake Havasu: U.S. Army Corps of Engineers (Section 10 for any structure in or over
  the water); Bureau of Land Management Lake Havasu Field Office and/or Bureau of Reclamation for shoreline land;
  Lake Havasu City Development Services for docks under city code 12.08.100; marina or concession rules on top of
  that. Ask Hava does not tell homeowners which permit they need. Sources: U.S. Army Corps of Engineers, Los Angeles
  District Regulatory Program (Section 10 Rivers and Harbors Act, 33 U.S.C. 403) - https://www.spl.usace.army.mil/Missions/Regulatory/
  ; BLM Lake Havasu Field Office [number removed, see source]) and 2009 Federal Register supplementary rules for the Lake Havasu
  shoreline - https://www.blm.gov/office/lake-havasu-field-office ; Lake Havasu City Code 12.08.100 Commercial Dock
  Standards (American Legal code library) - https://codelibrary.amlegal.com/codes/lakehavasucity/latest/overview'
- 'Lake Havasu has quagga mussels; AZGFD rules on clean, drain, dry and decontamination apply when boats leave.
  Drying times: about 18 days Nov-Apr or 7 days May-Oct. Source: Arizona Game and Fish Department, Aquatic Invasive
  Species (quagga mussels; clean, drain, dry; decontamination) - https://www.azgfd.com/fishing-2/aquatic-invasive-species/'
- 'Bridgewater Channel has its own dock rules in city code [judgment: from code summary].'
- Many boats are serviced on trailers at home or at storage lots; mobile service is common [judgment].
- Summer sun and hard water spots cause gelcoat oxidation and water spots [judgment].
