  site_visit_usually_needed: sometimes
  handyman_ok: limited
- id: popcorn_removal
  label: Popcorn/acoustic ceiling removal (asbestos check)
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: new_drywall
  label: New walls, garage finish, remodel hang-and-tape
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
- id: ceiling_repair
  label: Sagging or cracked ceiling
  site_visit_usually_needed: 'yes'
  handyman_ok: 'no'
