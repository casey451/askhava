# Ask Hava trade knowledge file: drywall
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: drywall
display_name: Drywall
summary: Drywall patching, water-damage replacement, texture matching (knockdown and orange peel are common in Havasu
  [judgment]), new walls and ceilings, and popcorn removal. ROC R-10 covers gypsum board, tape, texture and non-load-bearing
  steel partitions. LHC needs no permit for minor hole patching but does list drywall work and wall removal/installation
  as permit work. Older textures and joint compound may contain asbestos; EPA says not to sand or scrape suspect
  material.
