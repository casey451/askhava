questions:
- id: q1_size
  text: How big is the damaged area?
  options:
  - Smaller than a hand
  - Up to 2 x 2 ft
  - Bigger than 2 x 2 ft
  - Whole wall or ceiling
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Patch size decides between a quick patch and a sheet replacement.
- id: q2_cause_fixed
  text: Was there water? Is the leak fixed?
  options:
  - No water involved
  - Water, leak is fixed
  - Water, still leaking
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Wet drywall must dry and the leak must be fixed before patching.
- id: q3_texture
  text: What does the wall/ceiling surface look like?
  options:
  - Smooth
  - Light bumpy (orange peel)
  - Flat splotches (knockdown)
  - Popcorn
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Matching knockdown or orange peel adds time.
- id: q4_paint_after
  text: Paint after the patch?
  options:
  - Yes, match the paint
  - No, I'll paint
  - Paint the whole wall
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Paint after patching may be a separate trade or added cost.
- id: q5_home_age
  text: About when was the home built?
  options:
  - 1978 or later
  - 1977 or before
  - Not sure
  ask_if: popcorn or sanding older texture
  changes_price: 'yes'
  why: Older textures and joint compound may contain asbestos.
