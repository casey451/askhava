photo_red_flags:
- flag: Sagging ceiling with water
  safety_step_ref: es_drywall_1
- flag: Mold growth
  safety_step_ref: null
- flag: Wet drywall with leak not fixed (route plumbing/roofing first)
  safety_step_ref: null
- flag: Cracks that keep coming back or doors sticking near them (possible movement) [judgment]
  safety_step_ref: null
- flag: Popcorn ceiling damage in older home
  safety_step_ref: null
emergency_signals:
- id: es_drywall_1
  signal: Ceiling sagging or bulging with water
  emergency: 'yes'
  intake_note:
  - Keep people and pets out from under it [judgment]; shut off the water source if it is a pipe leak.
  safety_step: Stay out of the wet area; turn off the breaker only if you can do it without standing in water.
  source: '[S29]'
  then_route_to: drywall
  note: 'Routing: drywall (after plumbing/roofing)'
- id: es_drywall_2
  signal: Water near outlets or lights
  emergency: 'yes'
  safety_step: Stay out of the wet area; turn off the breaker only if you can do it without standing in water.
  source: '[S29]'
  then_route_to: electrical
- id: es_drywall_3
  signal: Hole patch, cosmetic crack
  emergency: 'no'
  safety_step: No special safety step; normal job card.
  source: none
  then_route_to: drywall
safety_step:
- when: Water near electrical
  step: Stay out of the wet area; turn off the breaker only if you can do it without standing in water.
  source: '[S29]'
- when: Wet drywall
  step: Dry wet materials within 24-48 hours to limit mold; porous items with mold may need replacing.
  source: '[T-epa_mold]'
- when: Popcorn/acoustic ceiling, old vinyl tile or old drywall texture to be disturbed
  step: Leave it alone if intact. Do not sand, scrape, drill or cut it. Have it tested or handled by an accredited
    asbestos professional before remodeling.
  source: '[T-epa_asb]'
intake_notes_judgment:
- 'Sagging wet ceiling: Keep people and pets out from under it [judgment]; shut off the water source if it is a
  pipe leak.'
license_classes:
- job_type:
  - small_patch
  - water_damage
  - texture_match
  - new_drywall
  - ceiling_repair
  classes:
  - R-10
  - CR-10
  - B
  - B-3
  - R-61
  citation: A.A.C. R4-9-103 [S2] R-10; R4-9-104 [S3] CR-10
  other_agency: none
  notes: ROC R-10 Drywall, CR-10 dual, or B/B-3/R-61.
- job_type:
  - popcorn_removal
  classes:
  - R-10
  citation: EPA/CPSC asbestos guidance; A.A.C. R4-9-103 [S2] (R- residential classes)
  other_agency: none
  notes: 'Test first. Asbestos-containing material: accredited asbestos professional. Retexture after: R-10.'
- job_type:
  - new_drywall
  classes:
  - none
  citation: LHC Building Permits page [S17]; A.R.S. 32-1121(A)(14)(a) [S4]
  other_agency: none
  notes: LHC lists drywall and wall install/removal as permit work, so the handyman exemption does not apply.
handyman_ok:
  allowed_examples:
  - 'Small hole and crack patching (LHC: no permit for minor patching)'
  not_allowed_examples:
  - New walls, large replacements or anything LHC permits
  - Popcorn removal that may contain asbestos
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'LHC: minor drywall hole patching needs no permit; drywall and wall removal/installation are on the permit list.
  Source: [S17].'
- Popcorn ceilings were common through the 1980s; asbestos use in them was banned in 1978 but older stock was used
  later [judgment; EPA lists textured ceilings as a possible source].
- Fix the water source before drywall repair. [judgment]
sample_card: 'REQ-0219 | Drywall | Lake Havasu City, Havasu Foothills area

  Ceiling patch about 3 x 3 ft after plumbing leak, leak fixed by plumber. Knockdown texture, paint match wanted.

  Not wet now. 3 photos.

  '
