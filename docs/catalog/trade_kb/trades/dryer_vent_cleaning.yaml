# Written by Claude (expert layer, Oct 29 2026), not part of the Grok delivery (D-431). AI research, not legal advice.
# Ask Hava trade knowledge file: dryer_vent_cleaning. Schema: foundation/schema.yaml (v2). Items marked [judgment] are
# not from a cited source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: dryer_vent_cleaning
display_name: Dryer-vent cleaning
summary: >
  Cleaning the duct that carries air and lint from a clothes dryer to the outside of the home, from the dryer
  connection to the vent cover on a wall, the roof or under a manufactured home. Jobs include a standard cleaning,
  long or roof-exit runs, clearing a bird nest or other blockage at the vent, and a vent check when the dryer is slow
  to dry. Cleaning only: repairing the dryer itself goes to appliance repair, and moving, rerouting or replacing the
  vent is refused here and goes to handyman as "dryer vent reroute" (LIC-028). Ask Hava collects where the vent comes
  out, stories, run length, what the homeowner sees at the vent and gas or electric, then sends an anonymous job card.
  Businesses quote a firm price in their own words.
job_types:
- id: standard_vent_cleaning
  label: Standard dryer vent cleaning (wall exit, short run)
  site_visit_usually_needed: 'no'
  handyman_ok: 'no'
- id: long_or_roof_vent
  label: Long run or roof-exit vent cleaning
  site_visit_usually_needed: sometimes
  handyman_ok: 'no'
- id: blockage_bird_nest
  label: Bird nest or blockage removal at the vent
  site_visit_usually_needed: sometimes
  handyman_ok: 'no'
- id: dryer_not_drying
  label: Dryer slow to dry, vent check and cleaning only (no appliance repair)
  site_visit_usually_needed: sometimes
  handyman_ok: 'no'
- id: reroute_or_replace
  label: Move, reroute or replace the vent (refused here, route to handyman "dryer vent reroute")
  site_visit_usually_needed: sometimes
  handyman_ok: limited
