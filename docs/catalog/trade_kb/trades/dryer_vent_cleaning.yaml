license_classes:
- job_type:
  - standard_vent_cleaning
  - long_or_roof_vent
  - blockage_bird_nest
  - dryer_not_drying
  work: Cleaning an existing dryer vent and clearing the vent cover
  classes:
  - none
  citation: foundation az_license_master section 5 (cleaning trades, no ROC class) [judgment]; LIC-028
  other_agency: City business and transaction privilege tax licensing may apply [judgment; not verified].
  notes: No ROC license applies to cleaning an existing vent; it is not construction [judgment]. Catalog rule LIC-028
    says dryer-vent cleaning needs no license. Repairing the dryer itself is appliance repair (R-63 covers installing
    and repairing appliances but not gas, electrical or plumbing lines [S2]).
- job_type:
  - reroute_or_replace
  work: Moving, rerouting or replacing a dryer vent (refused here)
  classes:
  - R-62 Minor Home Improvements [judgment]
  - B-3 General Remodeling and Repair [judgment]
  - R-45 Sheet Metal (includes ductwork) [judgment]
  - R-42 Roofing for a new roof opening [judgment]
  citation: A.A.C. R4-9-103 [S2] for class scopes; fit to vent work is [judgment]; routing per LIC-028
  other_agency: none
  notes: Not quoted in this category. Routes to the handyman category as "dryer vent reroute" when the whole job is
    under $1,000 and needs no permit (A.R.S. 32-1121(A)(14) [S4]). Bigger jobs, new roof or wall openings, or any job
    that needs a permit go to a licensed contractor. Whether Lake Havasu City requires a permit for a dryer vent
    reroute is [unverified]; check the city permit list [S17]. Any gas connection work is never handyman work
    (32-1121(D)) [S4].
handyman_ok:
  allowed_examples:
  - Vent cleaning is not construction, so the handyman rule does not come into play [judgment]
  - A small vent reroute or duct swap under $1,000 total with no permit (handyman category, "dryer vent reroute")
    [judgment; LIC-028]
  not_allowed_examples:
  - Disconnecting or reconnecting a gas dryer's gas line (32-1121(D)) [S4]
  - A new roof opening or any vent job that needs a city permit [judgment]
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000; the work is casual or minor; no local building permit is
    needed; it is not part of a larger job and not split into small contracts to dodge the limit; and any ad says
    ''not a licensed contractor''. Never covers work connected to natural gas, propane or other fuel gas, or
    hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
  note: The catalog does not send cleaning cards to handyman businesses (categories.yaml handyman_allowed false).
    Reroute and replace requests are refused here and routed to the handyman category (LIC-028).
local_notes:
- 'Background for staff, not homeowner text: an NFPA fact sheet estimated 17,700 U.S. home structure fires involving
  clothes dryers or washing machines in 2006 (15 civilian deaths, 360 injuries); dryers made up 92% of these in
  2003-2006, and the most common factor listed was "failure to clean" (29%). Data is old. Source: [T-nfpa_dryer].'
- 'Background for staff, not homeowner text: a CPSC staff report estimated 15,500 fires associated with clothes dryers
  in 1996 and named lint buildup in the airflow system as the largest known contributing factor; in 79 fires it
  looked into, the duct or vent system was the most frequent location. Data is old. Source: [T-cpsc_dryer].'
- Many Havasu homes have the laundry in the garage or on an inside wall, so vent runs to the roof are common
  [judgment].
- Summer heat runs June to September; garages and roofs get very hot, so roof-exit jobs may be booked for mornings
  [judgment].
- 'Monsoon season runs June 15 to September 30; wind and dust can push dust and debris into vent covers. Season dates:
  [T-nws_monsoon]; vent note [judgment].'
- Fine desert dust plus lint can pile up at the outside cover and keep the flap from closing [judgment].
- Tile roofs are common in Havasu; roof-exit vents on tile may need a business that walks tile roofs [judgment].
- 'City water is hard (about 19 grains per gallon, range 18 to 20). That matters for washers, not dryer vents; washer
  problems go to appliance_repair. Hardness: [LHC-CCR]; routing note [judgment].'
- Seasonal residents and vacant second homes may sit empty for months, and birds may nest in vent covers while no one
  is home [judgment].
- Vacation rentals run the dryer often between guests, so owners may ask for a cleaning between seasons [judgment].
- Manufactured homes may vent through the floor or out the skirting, so the business may need to reach under the
  home [judgment].
- Some HOAs have rules on visible exterior changes; that matters for a new or moved vent, not for cleaning [judgment].
- Dryers in RVs and boats go to rv_services or boat_dock, not this category [judgment].
sample_card: |
  REQ-0214 | Dryer-vent cleaning | Lake Havasu City, north side
  Electric dryer in the garage, vent exits the roof, 1 story, run about 10 to 25 feet.
  Lint around the roof vent cap; dryer taking longer than usual. 3 photos.
