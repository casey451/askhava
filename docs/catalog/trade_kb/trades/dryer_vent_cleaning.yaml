questions:
- id: q1_vent_exit
  text: Where does the vent come out?
  options:
  - Side wall
  - Roof
  - Under the home or through the floor
  - Not sure where
  ask_if: job_type != reroute_or_replace
  changes_price: 'yes'
  why: A roof exit means roof access and more time than a wall exit; a floor exit means work under the home.
    [judgment]
- id: q2_stories
  text: How many stories?
  options:
  - '1'
  - 2 or more
  ask_if: job_type != reroute_or_replace
  changes_price: 'yes'
  why: Two-story homes often mean a taller ladder or a longer run. [judgment]
- id: q3_run_length
  text: About how far is the dryer from where the vent comes out?
  options:
  - Under 10 feet
  - 10 to 25 feet
  - Over 25 feet
  - Not sure
  ask_if: job_type != reroute_or_replace
  changes_price: 'yes'
  why: Longer runs with more bends take more time and tools to clean. [judgment]
- id: q4_seen_at_vent
  text: What do you see at the outside vent?
  options:
  - Birds or a nest
  - Lint around the cover
  - Flap stuck or cover broken
  - Nothing unusual
  - Not sure
  ask_if: job_type != reroute_or_replace
  changes_price: 'yes'
  why: Clearing a nest or a stuck cover can add time; a broken cover may need a part. [judgment]
- id: q5_fuel
  text: Is the dryer gas or electric?
  options:
  - Electric
  - Gas
  - Not sure
  ask_if: job_type != reroute_or_replace
  changes_price: 'yes'
  why: Some businesses handle a gas dryer differently when they pull it out to reach the duct; any gas connection
    work is never handyman work [S4]. Price effect is [judgment].
- id: q6_symptom
  text: Is the dryer taking longer than usual?
  options:
  - 'Yes'
  - 'No'
  - Not sure
  ask_if: job_type not in [dryer_not_drying, reroute_or_replace]
  changes_price: 'no'
  why: Helps the business know what the homeowner is noticing; it does not by itself set the price. [judgment]
quote_without_visit_needs:
- Where the vent comes out (wall, roof, under the home) [judgment]
- Number of stories [judgment]
- Rough distance from the dryer to the vent exit [judgment]
- What the homeowner sees at the outside vent (nest, lint, stuck flap) [judgment]
- Gas or electric dryer [judgment]
- A photo of the outside vent cover, and of the roof vent cap if it exits the roof [judgment]
site_visit_usually_needed:
- Roof exit on a tile roof or a steep roof [judgment]
- Vent run that cannot be traced, or the homeowner does not know where it comes out [judgment]
- Vent under a manufactured home or behind skirting [judgment]
- Reroute or replace jobs (routed to handyman, not quoted here) [judgment]
photos_to_request:
- id: p1_outside_vent
  ask: A photo of the vent cover on the outside of the house, close enough to see the flap.
  for_job_types:
  - standard_vent_cleaning
  - long_or_roof_vent
  - blockage_bird_nest
  - dryer_not_drying
- id: p2_behind_dryer
  ask: A photo behind the dryer showing the duct where it connects to the dryer and the wall.
  for_job_types:
  - standard_vent_cleaning
  - long_or_roof_vent
  - dryer_not_drying
  - reroute_or_replace
- id: p3_roof_vent
  ask: A photo of the vent on the roof, taken from the ground or a window. Please don't go on the roof.
  for_job_types:
  - long_or_roof_vent
  - blockage_bird_nest
- id: p4_laundry_wide
  ask: A wide photo of the laundry area showing the dryer and the wall behind it.
  for_job_types:
  - long_or_roof_vent
  - dryer_not_drying
  - reroute_or_replace
photo_cues:
- photo_id: p1_outside_vent
  look_for:
  - Vent cover type (flap, louvers, cage)
  - Lint, nest material or birds at the cover
  - Height off the ground
  - Plants, fences or AC units in front of the vent
  neutral_wording_example: Photo shows a wall vent about 2 feet off the ground with lint around the flap.
- photo_id: p2_behind_dryer
  look_for:
  - Duct type (rigid metal, flexible metal, foil or plastic)
  - Kinks or crushed sections
  - Gas connector or electric cord in view
  - Space between the dryer and the wall
  neutral_wording_example: Photo shows a flexible foil duct bent behind the dryer, about 4 inches from the wall.
- photo_id: p3_roof_vent
  look_for:
  - Roof type (tile, shingle, flat or foam)
  - Vent cap style
  - Nest material or debris at the cap
  neutral_wording_example: Photo shows a vent cap on a tile roof with what looks like nest material at the opening.
- photo_id: p4_laundry_wide
  look_for:
  - Laundry location (garage, closet, inside room)
  - Where the duct enters the wall, floor or ceiling
  - Stacked or side-by-side units
  neutral_wording_example: Photo shows a side-by-side washer and dryer in the garage with the duct going into the
    ceiling.
photo_red_flags:
- flag: Smoke or flames at the dryer or the vent
  safety_step_ref: es_dryer_vent_cleaning_1
- flag: Scorch marks or melted plug at the dryer outlet
  safety_step_ref: es_dryer_vent_cleaning_3
- flag: Plastic or foil duct, crushed or pulled loose (note it on the card; replacing it routes to handyman)
  safety_step_ref: null
- flag: Gas connector in the photo (any gas connection work is never handyman work [S4])
  safety_step_ref: null
- flag: Live birds or eggs in the nest (note it on the card for the business)
  safety_step_ref: null
- flag: House number, mail with a name or a gate code visible (crop before the card goes out)
  safety_step_ref: null
