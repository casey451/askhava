questions:
- id: service_type
  text: What do you need?
  options:
  - Weekly service
  - Every other week
  - One-time clean
  - Green or cloudy pool cleanup
  - Tile scale / acid wash / drain
  - Not sure
  ask_if: always
  changes_price: 'yes'
- id: water_condition
  text: How does the water look today?
  options:
  - Clear
  - A little cloudy
  - Green but can see the floor
  - Green, can't see the floor
  - Black or swampy
  ask_if: service_type in [One-time clean, Green or cloudy pool cleanup, Weekly service, Every other week]
  changes_price: 'yes'
- id: pool_size
  text: About how big is the pool?
  options:
  - Small (under 12,000 gal)
  - Medium (12,000-20,000 gal)
  - Large (over 20,000 gal)
  - Pool plus attached spa
  - Not sure
  ask_if: always
  changes_price: 'yes'
- id: filter_type
  text: What filter do you have?
  options:
  - Cartridge
  - DE
  - Sand
  - Not sure - photo
  ask_if: service_type != Tile scale / acid wash / drain
  changes_price: 'yes'
- id: sanitizer
  text: How is it chlorinated?
  options:
  - Salt system
  - Chlorine tabs / liquid
  - Other (mineral, ozone, UV)
  - Not sure
  ask_if: always
  changes_price: 'no'
- id: chemicals_included
  text: Should chemicals be part of the quote?
  options:
  - Yes, include chemicals
  - No, I buy my own
  - Either is fine
  ask_if: service_type in [Weekly service, Every other week]
  changes_price: 'yes'
quote_without_visit_needs:
- Pool size or rough length and width
