photo_cues:
- photo_id: all
  look_for:
  - Water color and whether the main drain is visible
  - 'Thick white or gray scale on tile line [judgment: Havasu hard water]'
  - Palms, palo verde or mesquite dropping debris
  - Dark spots on plaster that may be black algae [judgment]
  - Cartridge vs DE vs sand filter
photo_red_flags:
- flag: Can't see bottom (drowning hazard; keep kids and pets out) [judgment]
  safety_step_ref: null
- flag: Broken or missing drain cover
  safety_step_ref: es_missing_drain_cover
- flag: Open or broken pool gate
  safety_step_ref: null
- flag: Chemical buckets stored together or leaking
  safety_step_ref: es_fumes_or_smoke_from_stored_poo
- flag: Exposed wiring at equipment
  safety_step_ref: null
emergency_signals:
- id: es_child_or_pet_missing_near_a_po
  signal: Child or pet missing near a pool with murky water
  emergency: 'yes'
  safety_step: Call 911 now and check the pool first.
  source: CPSC Pool Safely, VGBA and layers of protection - https://www.poolsafely.gov/wp-content/uploads/2016/04/vgba.pdf
  then_route_to: pool_cleaning
- id: es_fumes_or_smoke_from_stored_poo
  signal: Fumes or smoke from stored pool chemicals
  emergency: 'yes'
  safety_step: Move everyone away to fresh air. Do not mix chemicals or add water to them. Call 911 for a fire or
    someone who is sick, or Poison Help [number removed, see source].
  source: CDC, Pool Chemical Safety - https://www.cdc.gov/healthy-swimming/toolkit/pool-chemical-safety.html ; EPA
    Chemical Safety Alert, Safe storage and handling of swimming pool chemicals - https://www.epa.gov/sites/default/files/2013-11/documents/spalert.pdf
  then_route_to: pool_cleaning
- id: es_shock_or_tingle_in_the_water
  signal: Shock or tingle in the water
  emergency: 'yes'
  safety_step: Get out without using a metal ladder; turn off power if someone else is in trouble; call 911; do
    not jump in.
  source: CPSC, Don't Swim with Shocks (electrical safety in and around pools, hot tubs and spas) - https://www.cpsc.gov/Safety-Education/Safety-Guides/Sports-Fitness-and-Recreation/Pools-and-Spas
  then_route_to: pool_cleaning
- id: es_missing_drain_cover
  signal: Missing drain cover
  emergency: 'yes'
  safety_step: Keep everyone out of the pool until it is replaced.
  source: CPSC, Pool and Spa Drain Covers FAQ (VGBA) - https://www.cpsc.gov/FAQ/Pool-and-Spa-Drain-Covers
  then_route_to: pool_cleaning
safety_step:
- when: Chemical fumes, spill or smoke
  step: Move everyone away to fresh air. Do not mix chemicals or add water to them. Call 911 for a fire or someone
    who is sick, or Poison Help [number removed, see source].
  source: CDC, Pool Chemical Safety - https://www.cdc.gov/healthy-swimming/toolkit/pool-chemical-safety.html ; EPA
    Chemical Safety Alert, Safe storage and handling of swimming pool chemicals - https://www.epa.gov/sites/default/files/2013-11/documents/spalert.pdf
- when: Murky water and a child or pet is missing
  step: Call 911 now and check the pool first.
  source: CPSC Pool Safely, VGBA and layers of protection - https://www.poolsafely.gov/wp-content/uploads/2016/04/vgba.pdf
- when: Shock or tingle in water
  step: Get out without using a metal ladder; turn off power if someone else is in trouble; call 911; do not jump
    in.
  source: CPSC, Don't Swim with Shocks (electrical safety in and around pools, hot tubs and spas) - https://www.cpsc.gov/Safety-Education/Safety-Guides/Sports-Fitness-and-Recreation/Pools-and-Spas
- when: Missing or broken drain cover
  step: Keep everyone out of the pool until it is replaced.
  source: CPSC, Pool and Spa Drain Covers FAQ (VGBA) - https://www.cpsc.gov/FAQ/Pool-and-Spa-Drain-Covers
license_classes:
- job_type:
  - weekly_service
  - one_time_clean
  - green_pool
  - vacation_service
  work: Cleaning, brushing, vacuuming, adding chemicals, testing water
  classes:
  - No ROC license class covers cleaning only [judgment]. Using an over-the-counter antimicrobial (like chlorine)
    to treat a pool does not need a pest management license.
  citation: A.R.S. 3-3611 Pest license and registration exemptions (owner-occupant; OTC antimicrobial to treat a
    swimming pool) - https://www.azleg.gov/ars/3/03611.htm
  other_agency: null
  notes: ''
- job_type:
  - filter_clean
  work: Minor equipment repair during service (motor swap, valve, salt cell replacement)
  classes:
  - R-6 / CR-6 Swimming Pool Service and Repair, or the handyman exemption if it fits
  citation: A.A.C. R4-9-103 Residential contractor license classes (Cornell LII copy) - https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-9-103
    ; A.R.S. 32-1121 Persons not required to be licensed (handyman exemption (A)(14), pest (A)(8), gardener (A)(16),
    fuel-gas carve-out (D)) - https://www.azleg.gov/ars/32/01121.htm; A.A.C. R4-9-104 [S3] (CR- dual classes)
  other_agency: null
  notes: ''
- job_type:
  - drain_acid_wash
  - tile_descale
  work: Full replaster or pebble
  classes:
  - R-36 Plastering, B-5/B-6 (not R-6)
  citation: A.A.C. R4-9-103 Residential contractor license classes (Cornell LII copy) - https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-9-103
  other_agency: null
  notes: ''
handyman_ok:
  allowed_examples: []
  not_allowed_examples: []
  rule_reminder: 'Handyman exemption only if the whole job (labor + materials) is under $1,000, needs no permit,
    is not part of a larger or split job, does not connect to gas or propane and is not fire-safety work (32-1121(D)),
    and ads say ''not a licensed contractor''. Source: A.R.S. 32-1121(A)(14), (C), (D) [S4]; foundation/az_license_master.md
    section 4.'
  note: 'Yes for cleaning and chemicals (no ROC license class for that [judgment]). For repairs done during service,
    A.R.S. 32-1121(A)(14): a person may do ''casual or minor'' work without an ROC license only if the whole job
    (labor, materials, everything) is under $1,000, no building permit is needed, it is not part of a larger job
    or split up to get under the limit, and their ads say ''not a licensed contractor''. Per 32-1121(D) the exemption
    never covers work that connects to natural gas, propane or other fuel gas, or hardwired/interconnected fire-safety
    devices. Lake Havasu City''s permit list decides whether a permit is needed (https://www.lhcaz.gov/development-permitting/building).'
local_notes:
- 'Hard water: about 19 grains per gallon, so scale builds on tile and salt cells. Source: Lake Havasu City annual
  drinking water quality report (total hardness about 19 grains per gallon, range 18-20) - https://www.lhcaz.gov/DocumentCenter/View/3233'
- Wind and summer monsoon dust storms can dump dirt and debris into pools [judgment].
- Many homes are second homes or winter-visitor homes, so 'service while away' requests are common [judgment].
- 'Draining pools: city rules on where pool water may go were not checked; businesses handle this [judgment / open
  question].'
sample_card: 'REQ-0207 | Weekly pool service

  Lake Havasu City, south side

  Medium pool, cartridge filter, salt system. Wants weekly service with chemicals.

  Water clear today. Photos attached.'
