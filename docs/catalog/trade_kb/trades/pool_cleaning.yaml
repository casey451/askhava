- id: filter_clean
  label: Filter cartridge clean or DE / sand filter service
- id: tile_descale
  label: Calcium scale removal on tile line (bead blasting or hand)
  site_visit_usually_needed: 'yes'
- id: drain_acid_wash
  label: Drain and refill or acid wash
  site_visit_usually_needed: 'yes'
- id: vacation_service
  label: Service while away / seasonal home check
