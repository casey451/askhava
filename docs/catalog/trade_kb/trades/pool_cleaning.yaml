# Ask Hava trade knowledge file: pool_cleaning
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: pool_cleaning
display_name: Pool cleaning
summary: 'Routine pool and spa service: weekly or every-other-week cleaning (skim, brush, vacuum, empty baskets),
  water testing and chemical balance, filter cleaning, green-pool cleanups, and acid washes or tile-line descaling.
  Havasu''s hard water (about 19 grains per gallon) and hot summers drive calcium buildup and fast algae growth.
  Ask Hava collects pool size, filter type, sanitizer and condition, then sends an anonymous job card.'
