questions:
- id: q1_job
  text: What do you need?
  options:
  - New system
  - Fix my system
  - Filter change or service
  - Replace an old system
  - Remove a system
  - Water test
  ask_if: always
  changes_price: 'yes'
  why: New installs vs service calls are priced very differently. [judgment]
- id: q2_type
  text: What kind of system is it?
  options:
  - Water softener (uses salt)
  - RO under the sink
  - Whole-house filter
  - Salt-free conditioner
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Sets parts and who works on it. [judgment]
- id: q3_loop
  text: Where would it go, or where is it now?
  options:
  - Garage, with pipes already there for a softener
  - Garage, no pipes for one
  - Outside the home
  - Under a sink
  - Not sure
  ask_if: q1_job in ['New system', 'Replace an old system'] or job_type == loop_install
  changes_price: 'yes'
  why: A ready loop and drain make install simpler; new piping is plumbing work. [judgment]
- id: q4_brand_age
  text: Can you send a photo of the control head (top part) or label?
  options:
  - Sent a photo
  - No label
  - Not sure
  ask_if: q1_job in ['Fix my system', 'Filter change or service', 'Replace an old system']
  changes_price: 'yes'
  why: Brand and model tell a business which parts fit. [judgment]
- id: q5_home
  text: Who is the water provider?
  options:
  - Lake Havasu City
  - EPCOR
  - Private well
  - Not sure
  ask_if: q1_job in ['New system', 'Water test']
  changes_price: 'yes'
  why: Hardness differs a lot between city water (about 19 gpg) and EPCOR (about 6-8 gpg); wells vary. [LHC-CCR][EPCOR-LH]
quote_without_visit_needs:
- Softener replacement with photo of the old unit, the loop pipes and the drain [judgment]
- Under-sink RO install with photo under the kitchen sink and the counter or sink top (for a faucet hole) [judgment]
- RO filter changes with brand/model photo [judgment]
site_visit_usually_needed:
- New softener where no loop exists (plumbing changes) [judgment]
- Leaks or repeated problems [judgment]
- Well water treatment (needs testing) [judgment]
photos_to_request:
- id: p1_unit
  ask: A photo of the softener or filter system, including the top control and the salt tank.
  for_job_types:
  - softener_repair
  - softener_replace
  - whole_house_filter
  - remove_bypass
- id: p2_loop
  ask: A photo of the pipes where the softener goes (often in the garage near the water heater), and any drain nearby.
  for_job_types:
  - softener_new
  - softener_replace
  - loop_install
  - whole_house_filter
- id: p3_under_sink
  ask: A photo under your kitchen sink with the doors open, and one of the sink top.
  for_job_types:
  - ro_new
  - ro_service
- id: p4_label
  ask: A photo of any label with the brand, model or serial.
  for_job_types:
  - softener_repair
  - ro_service
  - softener_replace
photo_cues:
- photo_id: p1_unit
  look_for:
  - Control head brand (e.g. Fleck, Clack, Autotrol, brand-name units) [judgment]
  - Salt level, crust or 'bridge' visible in brine tank [judgment]
  - Water standing high in brine tank [judgment]
  - Bypass valve position, if marked [judgment]
  - Drain line routed to a drain, standpipe or outside [judgment]
  neutral_wording_example: Single-tank softener with a Fleck-style control; brine tank looks about half full of
    water.
- photo_id: p2_loop
  look_for:
  - Existing softener loop stubs in garage wall (two capped pipes) [judgment]
  - Drain or standpipe nearby; outlet for the control [judgment]
  neutral_wording_example: Two capped pipes in the garage wall next to the water heater; outlet about 3 ft away.
- photo_id: p3_under_sink
  look_for:
  - Space for RO tank; cold supply valve; drain pipe; disposal; extra faucet hole or soap dispenser [judgment]
  neutral_wording_example: Room under the sink on the left; soap dispenser hole on sink top.
- photo_id: p4_label
  look_for:
  - Brand/model; grain capacity (e.g. 32,000 or 48,000) [judgment]
  neutral_wording_example: Label shows a 48,000 grain softener.
photo_red_flags:
- flag: Water pooling near the softener's plug-in transformer or a garage outlet
  safety_step_ref: es_water_electric
emergency_signals:
- id: es_leak
  signal: Softener or RO line leaking fast or spraying
  emergency: depends
  safety_step: If water is spraying and you can reach the main shut-off safely, turn it off (UA Cooperative Extension
    says to know where your main valve is for emergencies). Many softeners also have a bypass valve; the owner's
    manual shows how to use it.
  source: '[UA-WW][judgment]'
  then_route_to: water_treatment
- id: es_water_electric
  signal: Water near outlets or cords
  emergency: 'yes'
  safety_step: If water is near outlets, cords or the electrical panel, do not walk into the water. Turn off power
    at the main breaker only if you can reach it from a dry place; never switch power while standing in water. Keep
    power off until an electrician checks it.
  source: '[S31]'
  then_route_to: water_treatment
safety_step:
- when: Water near outlets or cords
  step: If water is near outlets, cords or the electrical panel, do not walk into the water. Turn off power at the
    main breaker only if you can reach it from a dry place; never switch power while standing in water. Keep power
    off until an electrician checks it.
  source: '[S31]'
license_classes:
- job_type:
  - softener_new
  classes:
  - R-54 Water Conditioning Equipment
  - CR-54 Water Conditioning Equipment (dual)
  - R-37 Plumbing, Including Solar
  - CR-37
  citation: 'A.A.C. R4-9-103 (R-54: trenching, piping, fittings, valves and controls under 25 volts to install and
    repair water conditioning equipment, misting systems, exchange tanks and indirect waste pipe for brine, backwash
    and rinse water); R4-9-104 (CR-54); C-37 scope includes water conditioning equipment [S1]'
  other_agency: null
  notes: Same classes for all job types. R-54 is limited to the work 'required' for the water conditioning equipment,
    so new loop or drain piping beyond that may be plumbing (R-37) work [S2][judgment].
- job_type:
  - loop_install
  classes:
  - R-37
  - R-37R Plumbing
  - CR-37
  - CR-54 (if required for the equipment)
  citation: R4-9-103; R4-9-104
  other_agency: null
  notes: '[judgment] on the boundary between R-54 and R-37.'
handyman_ok:
  allowed_examples:
  - RO filter cartridge change, under $1,000 [judgment]
  - Like-for-like softener swap on an existing loop, under $1,000 total including the unit (LHC lists softeners
    and RO as no-permit) [S17][S4][judgment]
  - Adding salt, cleaning a brine tank [judgment]
  not_allowed_examples:
  - Any job $1,000 or more (most new softener installs with equipment) [S4]
  - New loop or drain piping that needs a permit [S17][judgment]
  - Part of a larger plumbing job [S4]
  rule_reminder: 'A person without an ROC license may take a job only if ALL are true: total price (labor + materials
    + everything) is under $1,000; the work is casual, minor or inconsequential; no local building permit is required;
    it is not part of a larger job or split up to stay under $1,000; and any ad says ''not a licensed contractor''.
    The exemption never covers work that connects to natural gas, propane or other fuel gas, or fire-safety work
    such as hardwired/interconnected smoke alarms. Source: A.R.S. 32-1121(A)(14) and (D) [S4]. In Lake Havasu City,
    check the city permit list: a needed permit removes the exemption [S17].'
local_notes:
- 'City water: hardness average about 19 gpg (range 18-20, about 325 mg/L) and TDS about 753 ppm, above the EPA
  500 ppm secondary (taste/aesthetic) guideline [LHC-CCR].'
- EPCOR's Lake Havasu system reports about 6-8 gpg; EPCOR's scale calls over 10.5 gpg very hard [EPCOR-LH].
- 'UA Water Wise: softeners use water to regenerate (about 15-120 gallons per 1,000 gallons treated); options include
  bypassing outdoor taps and the kitchen faucet, or using potassium chloride [UA-WW].'
- 'UA Water Wise: RO units can send about 2-20 gallons to the drain per gallon of drinking water [UA-WW].'
- Many Havasu homes have a softener loop in the garage near the water heater [judgment].
- Water heater and tankless owners often ask about softeners because of scale; Ask Hava never says a softener will
  fix or prevent anything [RHEEM-UC][RINNAI-RE][judgment].
- Never make health claims about tap water; point to the city's water quality report if asked [LHC-CCR][judgment].
sample_card: 'REQ-0185 | Water treatment | Lake Havasu City, south

  Replace softener on existing garage loop; old unit photo shows 48,000 grain label.

  City water. Homeowner also asks about an under-sink RO.'
