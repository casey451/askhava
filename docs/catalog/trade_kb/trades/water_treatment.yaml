# Ask Hava trade knowledge file: water_treatment
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: water_treatment
display_name: Water softeners, RO and filters
summary: Install, repair, service and removal of water softeners, reverse osmosis (RO) drinking water systems, whole-house
  filters and conditioners (salt-free systems). Lake Havasu City water averages about 19 grains per gallon hardness
  and about 753 ppm total dissolved solids, so softeners and RO are common; some outlying areas are on EPCOR or
  wells [LHC-CCR][EPCOR-LH]. Ask Hava learns the job (new, repair, service, remove), system type, where the loop
  or plumbing is, and the brand from a photo. It never says what water treatment a home should have or makes health
  claims about water. Licensed work is ROC R-54 Water Conditioning Equipment or CR-54 (also R-37/CR-37 plumbing)
  [S2][S3]. LHC lists softeners and RO as no-permit items [S17].
