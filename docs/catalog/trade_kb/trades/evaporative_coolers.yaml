# Ask Hava trade knowledge file: evaporative_coolers
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: evaporative_coolers
display_name: Swamp coolers (evaporative coolers)
summary: 'Evaporative or ''swamp'' coolers on roofs, side walls, windows and patios: spring start-up, pad changes,
  pumps, motors, belts, float valves, leaks, fall shut-down and replacement. They work well in dry heat but lose
  cooling when monsoon humidity rises, and Lake Havasu City''s very hard water (about 19 grains per gallon) builds
  scale fast on pads and pans [LHC-CCR][judgment]. Ask Hava learns where the cooler sits, what it is doing, its
  size and age, and whether the owner wants service, a seasonal visit or a new unit, then writes the card. It never
  says what is broken or what to buy. Licensed work is ROC R-39 (includes evaporative cooling) or the dual CR-39/CR-58/CR-79;
  small seasonal tasks may fit the handyman exemption [S2][S3][S4].'
