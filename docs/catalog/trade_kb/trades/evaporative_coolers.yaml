    main breaker only if you can reach it from a dry place; never switch power while standing in water. Keep power
    off until an electrician checks it.
  source: '[S31]'
license_classes:
- job_type:
  - cooler_not_cooling
  classes:
  - R-39 Air Conditioning and Refrigeration, Including Solar (scope includes evaporative cooling)
  - R-39R Evaporative Cooling and Ventilators (legacy; no new licenses)
  - R-39R Warm Air Heating, Evaporative Cooling and Ventilating (legacy)
  - CR-39
  - CR-58 dual (C-58 Comfort Heating, Ventilating, Evaporative Cooling + R-39R Warm Air Heating, Evaporative Cooling
    and Ventilating)
  - CR-79
  citation: A.A.C. R4-9-103 (R-39, R-39R); R4-9-104 (CR-39, CR-58, CR-79); R4-9-102 (C-58 commercial only)
  other_agency: null
  notes: Same classes for all cooler job types when over the handyman limit or permitted. No refrigerant, so EPA
    608 does not apply [judgment].
- job_type:
  - cooler_remove_convert
  classes:
  - R-39 / CR-39 for the cooler and duct
  - R-42 Roofing for the roof patch
  - R-45 Sheet Metal for duct changes
  citation: R4-9-103; A.A.C. R4-9-104 [S3] (CR- dual classes)
  other_agency: null
  notes: Converting to refrigerated AC reroutes to hvac. Replacing roof sheathing needs an LHC permit; replacing
    roof covering does not [S17].
- job_type:
  - cooler_new_install
  classes:
  - R-39
  - CR-39
  - CR-58
  citation: R4-9-103; R4-9-104
  other_agency: null
  notes: New circuit allowed under R-39; new cut in roof may need roofing and permit [S2][S17][judgment].
handyman_ok:
  allowed_examples:
  - Spring start-up or fall shut-down, total under $1,000, no permit [S4][judgment]
  - Pad replacement, belt replacement, float valve adjustment, pan cleaning, under $1,000 [S4][judgment]
  - Plug-in pump swap like-for-like, under $1,000 [judgment]
  not_allowed_examples:
  - New cooler install or a move that needs a roof cut, new duct or new circuit (permit and/or over $1,000) [S17][S4]
  - Hard-wired motor or new wiring when it needs a permit [S17]
  - Full replacement over $1,000 [S4]
  rule_reminder: 'A person without an ROC license may take a job only if ALL are true: total price (labor + materials
    + everything) is under $1,000; the work is casual, minor or inconsequential; no local building permit is required;
    it is not part of a larger job or split up to stay under $1,000; and any ad says ''not a licensed contractor''.
    The exemption never covers work that connects to natural gas, propane or other fuel gas, or fire-safety work
    such as hardwired/interconnected smoke alarms. Source: A.R.S. 32-1121(A)(14) and (D) [S4]. In Lake Havasu City,
    check the city permit list: a needed permit removes the exemption [S17].'
local_notes:
- City water averages about 19 grains per gallon hardness (range 18-20) and TDS about 753 ppm, so pads and pans
  scale quickly; bleed-off settings matter [LHC-CCR][UA-WW].
- Some homes outside city limits are on EPCOR water, reported at 6-8 gpg; ask the area, not the address [EPCOR-LH].
- 'UA Water Wise: a cooler can use 50-200 gallons a day; waiting until about 85 F to turn it on cuts water use;
  cooler drain-off water is high in minerals and can harm plants [UA-WW].'
- Coolers lose cooling power when monsoon humidity rises (about July-September); many homes have both a cooler and
  refrigerated AC [judgment].
- 'Seasonal rush: start-ups in spring (March-May) and shut-downs in fall (October-November); snowbird owners often
  want both handled while away [judgment].'
- UA Water Wise fall steps include draining and cleaning the pan, disconnecting and draining the water line, and
  covering the cooler; a business can quote this [UA-WW].
- Roof coolers on older homes may sit on aging roof jacks; leaks into ceilings are a common complaint [judgment].
sample_card: 'REQ-0157 | Swamp cooler | Lake Havasu City, south side

  Roof down-draft cooler, spring start-up plus new pads. About 4,500 CFM (label photo).

  One-story home, cover still on. Flexible on timing.'
