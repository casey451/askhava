questions:
- id: q1_location
  text: Where is your cooler?
  options:
  - On the roof
  - On the ground by a wall
  - In a window
  - Portable / on a patio
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Roof units need ladder or roof access and take longer; portable units may fit appliance repair instead. [judgment]
- id: q2_scope
  text: What do you need?
  options:
  - Fix a problem
  - Spring start-up
  - Fall shut-down
  - New pads only
  - Replace or remove the cooler
  ask_if: always
  changes_price: 'yes'
  why: Seasonal service vs repair vs replacement is the largest price split. [judgment]
- id: q3_symptom
  text: What is it doing?
  options:
  - Runs but air is not cool
  - Nothing runs
  - Fan runs, pads stay dry
  - Leaking or overflowing
  - Bad smell
  - Noise or shaking
  ask_if: q2_scope == 'Fix a problem'
  changes_price: 'yes'
  why: Tells a business whether to bring a pump, motor, belt, float or pan parts. Ask Hava does not say which part.
    [judgment]
- id: q4_size_age
  text: How big and how old is the cooler?
  options:
  - Small (one room)
  - Medium (part of house)
  - Large (whole house)
  - Not sure (I can send a label photo)
  ask_if: q2_scope in ['Fix a problem', 'Replace or remove the cooler']
  changes_price: 'yes'
  why: CFM rating and age help quote parts or a same-size unit. [judgment]
- id: q5_remove_plan
  text: If replacing, what do you want?
  options:
  - Same type, same spot
  - Different spot or new duct
  - Remove it and patch the roof
  - Switch to refrigerated AC
  - Not sure yet
  ask_if: q2_scope == 'Replace or remove the cooler'
  changes_price: 'yes'
  why: Moving, new duct or a roof patch adds trades (roofing) and may need a permit; switching to AC reroutes to
    hvac. [S17][judgment]
- id: q6_water_line
  text: Is the water line to the cooler hooked up right now?
  options:
  - Yes, hooked up
  - No, turned off for winter
  - There is no water line
  - Not sure
  ask_if: q2_scope in ['Spring start-up', 'Fix a problem']
  changes_price: 'no'
  why: Helps the business plan the visit; does not change price much. [judgment]
quote_without_visit_needs:
- Spring start-up, fall shut-down and pad changes are often flat-rate by cooler size and location [judgment]
- Label photo (brand, model, CFM, pad size) and a photo of the whole cooler [judgment]
- Roof type and height (one story flat, pitched, two story) [judgment]
- 'Pad type: aspen fiber vs rigid media (rigid media is thicker, sold by size) [judgment]'
site_visit_usually_needed:
- Leaks into the house or ceiling (source may be pan, duct or roof jack) [judgment]
- New installs, moves, or removal with roof patch [judgment]
- Not cooling with unknown cause [judgment]
photos_to_request:
- id: p1_whole_cooler
  ask: A photo of the whole cooler. A photo from the ground is fine; please do not climb the roof just for a picture.
  for_job_types:
  - cooler_not_cooling
  - cooler_not_running
  - cooler_leak
  - cooler_replacement
  - cooler_remove_convert
  - cooler_startup
- id: p2_label
  ask: If you can reach it safely, a photo of the cooler's label (brand, model, size).
  for_job_types:
  - cooler_replacement
  - cooler_not_running
  - cooler_pads
- id: p3_inside_pan
  ask: 'Only if a side panel is already off: a photo of the pads and pan inside. Please do not open the cooler or
    climb up just for this.'
  for_job_types:
  - cooler_smell
  - cooler_leak
  - cooler_pads
- id: p4_ceiling_vent
  ask: A photo of the ceiling vent or wet spot inside.
  for_job_types:
  - cooler_leak
  - cooler_smell
- id: p5_thermostat_switch
  ask: A photo of the wall switch or thermostat that runs the cooler.
  for_job_types:
  - cooler_not_running
photo_cues:
- photo_id: p1_whole_cooler
  look_for:
  - Down-draft (roof, air goes down into duct) vs side-draft (ground/wall) [judgment]
  - Rust holes, white mineral crust, water stains on roof or wall [judgment]
  - Cover still on (not started up) [judgment]
  - Roof jack / duct sealed or cracked [judgment]
  - 'Water line: copper or plastic tubing, valve, any leak [judgment]'
  neutral_wording_example: Roof down-draft cooler, white crust along the bottom, rust on one corner panel.
- photo_id: p2_label
  look_for:
  - Brand (e.g. Champion/Essick, Phoenix Manufacturing, Breezair, Mastercool, Portacool) and model; CFM rating;
    motor HP; pad size [judgment]
  neutral_wording_example: Label reads 4,500 CFM, 1/2 HP motor; brand Champion.
- photo_id: p3_inside_pan
  look_for:
  - Scale thickness on pads and pan; standing water color; algae; float arm position; bleed-off tube present [UA-WW][judgment]
  neutral_wording_example: Pads look hard and white with mineral buildup; green water in pan.
- photo_id: p4_ceiling_vent
  look_for:
  - Stain size, drip, sagging drywall, closeness to lights [judgment]
  neutral_wording_example: Brown ring around the ceiling vent, about a foot wide.
- photo_id: p5_thermostat_switch
  look_for:
  - Two-speed switch, pump switch, thermostat type [judgment]
  neutral_wording_example: Wall switch with HI, LO and PUMP settings.
photo_red_flags:
- flag: Melted or burnt wiring, scorch marks on the motor or switch
  safety_step_ref: es_burning
- flag: Sagging wet ceiling near a light or outlet
  safety_step_ref: es_water_electric
emergency_signals:
- id: es_heat_vulnerable
  signal: Cooler out in extreme heat with an older adult, infant, or someone with a medical need at home
  emergency: 'yes'
  safety_step: With no AC in extreme heat, CDC advises going to an air-conditioned place (a friend's home, a public
    building or a cooling center) for part of the day, drinking water, and checking on older adults often. NWS warns
    that fans alone do not prevent heat illness when it is very hot. If anyone shows signs of heat stroke, call
    911.
  source: '[CDC-HEAT][S27]'
  then_route_to: evaporative_coolers
- id: es_heat_symptoms
  signal: Someone is confused, fainting or very hot to the touch
  emergency: 'yes'
  safety_step: 'Signs of heat stroke (confusion, fainting, hot red skin, very high body temperature): call 911 now.
    Move the person to a cooler place, cool them with cool wet cloths or a cool bath, and do not give fluids to
    someone who is not fully alert.'
  source: '[S27]'
  then_route_to: evaporative_coolers
- id: es_burning
  signal: Burning smell or smoke from the cooler motor, switch or vent
  emergency: 'yes'
  safety_step: 'NFPA says to call a qualified electrician for a burning or rubbery smell, sparks, warm or discolored
    outlets or switches, flickering lights, or breakers that trip often. Stop using the outlet, switch or appliance
    involved. If there is smoke or fire, get out and call 911. If there is smoke, flames or sparks that will not
    stop: get everyone out, stay out, and call 911 from outside.'
  source: '[S29][NFPA-ESCAPE]'
  then_route_to: evaporative_coolers
- id: es_water_electric
  signal: Cooler water leaking onto lights, outlets or wiring
  emergency: 'yes'
  safety_step: If water is near outlets, cords or the electrical panel, do not walk into the water. Turn off power
    at the main breaker only if you can reach it from a dry place; never switch power while standing in water. Keep
    power off until an electrician checks it.
  source: '[S31]'
  then_route_to: evaporative_coolers
safety_step:
- when: Cooler out in extreme heat with an older adult, infant, or someone with a medical need at home
  step: With no AC in extreme heat, CDC advises going to an air-conditioned place (a friend's home, a public building
    or a cooling center) for part of the day, drinking water, and checking on older adults often. NWS warns that
    fans alone do not prevent heat illness when it is very hot. If anyone shows signs of heat stroke, call 911.
  source: '[CDC-HEAT][S27]'
- when: Someone is confused, fainting or very hot to the touch
  step: 'Signs of heat stroke (confusion, fainting, hot red skin, very high body temperature): call 911 now. Move
    the person to a cooler place, cool them with cool wet cloths or a cool bath, and do not give fluids to someone
    who is not fully alert.'
  source: '[S27]'
- when: Burning smell or smoke from the cooler motor, switch or vent
  step: 'NFPA says to call a qualified electrician for a burning or rubbery smell, sparks, warm or discolored outlets
    or switches, flickering lights, or breakers that trip often. Stop using the outlet, switch or appliance involved.
    If there is smoke or fire, get out and call 911. If there is smoke, flames or sparks that will not stop: get
