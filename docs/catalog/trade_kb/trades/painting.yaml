# Ask Hava trade knowledge file: painting
# Schema: foundation/schema.yaml (v2). Items marked [judgment] are not from a cited source;
# [unverified] = could not confirm in an official source. Ask Hava never diagnoses, prices, recommends or supervises work.
trade: painting
display_name: Painting
summary: Interior and exterior painting, stucco and block wall painting, cabinet painting, staining, epoxy garage
  floors and wall covering. ROC R-34 Painting and Wall Covering covers paint, wallpaper, texture and liquid floor/wall
  coatings. LHC needs no permit for paint. In homes built before 1978, sanding or scraping may disturb lead paint,
  and EPA RRP rules apply to paid work. Desert sun breaks down exterior paint and caulk fast, especially on south
  and west walls [judgment].
