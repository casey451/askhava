emergency_signals:
- id: es_painting_1
  signal: Paint project itself is rarely an emergency
  emergency: 'no'
  safety_step: No special safety step; normal job card.
  source: none
  then_route_to: painting
- id: es_painting_2
  signal: Someone feels sick from fumes or a child ate paint chips
  emergency: 'yes'
  safety_step: Call Poison Control at [number removed, see source], or 911 if they are not breathing or are unconscious.
  source: '[T-poison]'
  then_route_to: none
  note: 'Routing: none (Poison Control / 911 first)'
safety_step:
- when: Home built before 1978 and paint will be sanded, scraped or cut
  step: Assume lead paint may be present. Keep kids and pregnant people away from the work area. Paid work disturbing
    more than 6 sq ft per room inside or 20 sq ft outside (or any window replacement) must be done by an EPA RRP-certified
    firm using lead-safe practices.
  source: '[T-epa_rrp]'
- when: Popcorn/acoustic ceiling, old vinyl tile or old drywall texture to be disturbed
  step: Leave it alone if intact. Do not sand, scrape, drill or cut it. Have it tested or handled by an accredited
    asbestos professional before remodeling.
  source: '[T-epa_asb]'
- when: Child swallowed paint chips or someone breathed fumes and feels sick
  step: Call Poison Control at [number removed, see source], or 911 if they are not breathing or are unconscious.
  source: '[T-poison]'
- when: Leftover paint disposal
  step: Do not take paint to the LHC landfill; use the city's household hazardous waste events.
  source: '[T-lhc_hhw]'
