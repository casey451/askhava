  other_agency: none
  notes: 'Pre-1978 homes: separate federal requirement, EPA RRP firm certification, on top of any ROC license.'
handyman_ok:
  allowed_examples:
  - 'Touch-ups, one small room, a door or a short stretch of fence under $1,000 total (LHC: paint needs no permit)'
  not_allowed_examples:
  - Whole-house or exterior repaints over $1,000
  - Pre-1978 paint disturbance without EPA RRP certification (federal rule applies regardless of state exemption)
  rule_reminder: 'Unlicensed work is legal in Arizona only if ALL of these are true: the whole job price, counting
    labor, materials and everything else, is under $1,000 (an unmodified plug-in appliance, or one with internal
    batteries of 12 volts or less, using no gas, is left out of the total); the work is casual or minor; no local
    building permit is needed; it is not part of a larger job and not split into small contracts to dodge the limit;
    and any ad says ''not a licensed contractor''. Never covers work connected to natural gas, propane or other
    fuel gas, or hardwired/interconnected smoke alarms or fire sprinklers. A.R.S. 32-1121(A)(14) and (D). [S4]'
local_notes:
- 'LHC: painting needs no building permit. Source: [S17].'
- Elastomeric paint is common on Havasu stucco; heat limits apply on most paint labels (check label surface temperature
  limits) [judgment].
- Monsoon dust and wind affect exterior paint days [judgment].
- Vacation rental refreshes between seasons are common [judgment].
- 'Leftover paint goes to LHC household hazardous waste events, not the landfill. Source: [T-lhc_hhw].'
