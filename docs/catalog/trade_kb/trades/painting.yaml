questions:
- id: q1_where
  text: What needs paint?
  options:
  - Inside rooms
  - Outside of house
  - Block walls
  - Cabinets
  - Garage floor
  - Several of these
  ask_if: always
  changes_price: 'yes'
  why: Interior, exterior and cabinets are priced very differently.
- id: q2_size
  text: How much?
  options:
  - 1 room or small area
  - 2-4 rooms
  - Whole inside
  - Whole outside
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Wall area is the main driver of paint and labor.
- id: q3_prep
  text: What shape are the surfaces in?
  options:
  - Good, just a color change
  - Some peeling or cracks
  - A lot of peeling or bare spots
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Stucco cracks, peeling and patching add prep time.
- id: q4_ceilings
  text: Ceilings too?
  options:
  - 'No'
  - Yes, flat ceilings
  - Yes, textured or popcorn
  - Vaulted or very tall
  - Not sure
  ask_if: where includes Inside rooms
  changes_price: 'yes'
  why: Ceilings and trim add time and paint.
- id: q5_home_age
  text: About when was the home built?
  options:
  - 1978 or later
  - Before 1978
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Pre-1978 homes need EPA lead-safe work practices when paint is disturbed.
- id: q6_paint_supplied
  text: Do you have the paint picked out?
  options:
  - Yes, I'll buy it
  - Yes, painter buys it
  - Need help choosing colors
  - Not sure
  ask_if: always
  changes_price: 'yes'
  why: Who buys paint changes the quote total.
