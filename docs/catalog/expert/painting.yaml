trade_brief:
  price_drivers:
    - driver: "How much surface: rooms or wall length, ceiling height, one or two stories"
      why: "Area and reach set paint, labor days and whether ladders, planks or a lift come out; vaulted rooms and two-story walls cost more per foot. [judgment]"
      source: null
    - driver: "Prep: peeling, chalking, stucco cracks, patching, stains that need a blocking primer"
      why: "Prep is where painting quotes split; a color change on sound walls is the low end, scraping and patching the high end. The bank's repairs question and the close-up photo carry it. [judgment]"
      source: null
    - driver: "Home built before 1978 and the work will sand, scrape or cut more than a small area"
      why: "Paid work in pre-1978 housing that disturbs more than 6 sq ft per room inside or 20 sq ft outside falls under the EPA RRP rule: certified firm, containment, cleaning checks and paperwork, all priced in."
      source: epa_rrp
    - driver: "What is in the job: walls only, or ceilings, trim, doors, cabinets"
      why: "Each adds a separate pass with different paint and sheen; cabinets are priced per door and drawer and take days. [judgment]"
      source: null
    - driver: "Size of the color change (dark to light, or a deep color over a light one)"
      why: "A big change means a primer coat or a third coat. The wide photo and her look pictures show it. [judgment]"
      source: null
    - driver: "Who supplies the paint, and what grade"
      why: "The bank's paint question. Painters mark up materials and quote by product line; homeowner-supplied paint shrinks the total but some painters will not warranty it. [judgment]"
      source: null
    - driver: "Empty home or lived-in with furniture to move and cover"
      why: "Moving and masking furniture adds hours; a vacant second home or rental between guests is faster. [judgment]"
      source: null
    - driver: "Exterior: HOA color approval, tight side yards, summer heat windows"
      why: "An approval wait sets the start date, a narrow side yard slows setup, and summer exterior work is limited to cooler hours. [judgment]"
      source: null
  hidden_conditions:
    - condition: "A ceiling or wall stain that is still getting wet (roof or plumbing leak not fixed)"
      how_a_pro_spots_it: "Ring that grows after rain or after a shower upstairs; sagging or bubbling at the stain in the ceiling photo"
      question_or_photo: fu_stain_wet
      source: null
    - condition: "Textured or popcorn ceiling in an older home that may hold asbestos once scraped"
      how_a_pro_spots_it: "Sprayed bumpy texture in the ceiling photo plus a build year in the 1970s or earlier; textured paint and patching compounds were banned in 1977; no lab test on file"
      question_or_photo: fu_texture_tested
      source: cpsc_asb
    - condition: "Pre-1978 paint that will be disturbed past the RRP minor-repair limits"
      how_a_pro_spots_it: "Build year, peeling on trim, sills and fascia in the close-up photo"
      question_or_photo: fu_home_age
      source: epa_rrp
    - condition: "Old thick or rubbery coating on stucco peeling in sheets, or chalky paint that will not hold new paint"
      how_a_pro_spots_it: "Large flakes with gray stucco underneath, or powder on a finger in her words; west and south walls worst"
      question_or_photo: p2
      source: null
    - condition: "Stucco cracks wider than hairline, or stucco that sounds hollow, which is a stucco repair before paint"
      how_a_pro_spots_it: "Diagonal cracks off window corners in the close-up, the bank's repairs answer is yes"
      question_or_photo: repairs
      source: null
    - condition: "Cabinet doors with a plastic or laminate skin, which many painters will not paint or will price as special prep"
      how_a_pro_spots_it: "Very even wood grain with a gloss in the wide photo; lifting edges near the dishwasher or range in a close-up"
      question_or_photo: fu_cabinet_material
      source: null
    - condition: "White crust and peeling at the base of a block wall where sprinklers hit it"
      how_a_pro_spots_it: "Powdery band along the bottom rows of block in the photo; sprinkler heads or drip lines along the wall; city water near 19 grains per gallon leaves mineral marks"
      question_or_photo: fu_wall_water
      source: lhc_ccr
    - condition: "Wallpaper that was painted over, or several layers, which slows removal and leaves wall repair"
      how_a_pro_spots_it: "Paper seams showing through paint, torn corners with a second pattern under it in the close-up"
      question_or_photo: p2
      source: null
  misdiagnosis_checks:
    - sounds_like: "interior painting (paint over a ceiling stain)"
      might_be: "roof leak_repair, a different category"
      one_question: fu_stain_wet
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "interior painting (stain under a bathroom)"
      might_be: "plumbing leak_slow, a different category"
      one_question: fu_stain_wet
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "touch_up (patch and paint before move-out)"
      might_be: "handyman small_drywall_patch, a different category, when it is mostly patching and under the handyman limit"
      one_question: fu_patch_or_paint
      if_other_route_to: {category: handyman, job_type: "drywall patch"}
      source: ars_32_1121
    - sounds_like: "exterior painting (paint the garage or patio)"
      might_be: "garage_floor_epoxy, a different category"
      one_question: fu_exterior_parts
      if_other_route_to: {category: epoxy_floors, job_type: "garage floor epoxy"}
      source: null
    - sounds_like: "exterior painting (paint the roof)"
      might_be: "roofing foam_coating, R-42 roof work"
      one_question: fu_exterior_parts
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: aac_r4_9_103
  photo_reading:
    - photo_id: p1
      reads: ["Current wall color and how big the color change is", "Ceiling height against a door (8 foot, 10 foot, vaulted)", "Trim, doors and baseboards in the shot", "Furniture in the room", "Number of stories and side-yard room for exteriors", "Cabinet count and finish for kitchens"]
      neutral_wording: "Living room with beige walls and white trim; ceiling rises to about twice the door height with a fan; furniture in place."
    - photo_id: p2
      reads: ["Peeling in flakes or sheets, bare stucco or wood underneath", "Crack width and direction off window corners", "Powdery band at the base of a block wall", "Lifting edges on cabinet doors", "Paper seams or layers under paint"]
      neutral_wording: "Close-up of the west wall: paint coming off in palm-size flakes with gray stucco showing; a thin crack runs up from the window corner."
    - photo_id: p3
      reads: ["Smooth, light texture, or sprayed popcorn texture", "Stain rings, sagging or bubbling", "Fans, vents and lights to mask around"]
      neutral_wording: "Ceiling has a bumpy sprayed texture; a tan ring about 2 feet across sits near the air vent."
  local_factors:
    - fact: "Summer average highs run about 105 F in June, 109 F in July and 108 F in August"
      effect: "Exterior work in summer runs early mornings on shaded walls; the label and the maker warn against direct sun and very high heat, so exterior jobs stretch over more days or move to fall"
      source: usclimate_lhc
    - fact: "Paint makers warn that over 100 F a paint film can dry before it adheres, and advise against painting in direct summer sun"
      effect: "Pros schedule west and south walls around the sun; a quote's start date may depend on the season"
      source: sw_exterior_faq
    - fact: "The monsoon runs June 15 to September 30, with dust storms most common early in the season"
      effect: "Wind and dust cost exterior paint days and can mean a re-wash before coating"
      source: nws_monsoon
    - fact: "Lake Havasu City needs no building permit for paint; lath for stucco systems does need one"
      effect: "Repaints carry no permit time; stucco re-lath under a paint job would be a separate permitted job"
      source: lhc_permits
    - fact: "City water hardness is about 19 grains per gallon"
      effect: "Sprinkler overspray leaves white mineral marks on block walls and stucco bases that painters wash and treat before coating [judgment]"
      source: lhc_ccr
    - fact: "Many stucco homes carry thick elastomeric or rubbery coatings from past repaints, and desert sun fades and chalks south and west walls first"
      effect: "Pros ask what the house was last coated with and look hardest at the sun sides [judgment]"
      source: null
    - fact: "Much of the city was built from the late 1960s through the 1970s, so many homes predate 1978"
      effect: "Home age decides whether RRP lead-safe work applies when paint is disturbed; local share of pre-1978 homes not confirmed [judgment]"
      source: null
      unverified: true
    - fact: "Some subdivisions have HOAs with approved exterior color lists and an approval step"
      effect: "An exterior card should say whether approval is needed and done, since it sets the start date [judgment]"
      source: null
    - fact: "Seasonal residents and vacation rentals leave homes empty for months"
      effect: "Empty homes paint faster; owners often want work done before winter visitors arrive or between guest stays [judgment]"
      source: null
  seasonality:
    busy: "October to May for exteriors (cooler days), spring and fall for rental refreshes and pre-sale paint [judgment]"
    slow: "July and August for exteriors; interiors keep going through summer [judgment]"
    source: null

job_types:
  - id: interior_rooms
    label: "Interior walls and ceilings, one room to the whole inside"
    bank_job_type: "interior painting"
    recurring: false
    homeowner_phrasings: ["paint the house", "repaint 3 bedrooms", "living room a new color", "quiero pintar 2 cuartos y la sala"]
    must_know:
      - fact: "Which rooms and how much (rooms named, open areas, closets)"
        bank_question: size
        follow_up: null
        photo: p1
        why_it_moves_price: "Wall area sets paint and labor days more than anything else. [judgment]"
        skip_if: "Her words name the rooms"
      - fact: "Whether ceilings are in, and if they are textured or tall"
        bank_question: null
        follow_up: fu_ceilings
        photo: p3
        why_it_moves_price: "Ceilings add a pass with different paint; popcorn and vaulted ceilings change the method and the gear. [judgment]"
        skip_if: "She said walls only, or the ceiling photo shows it and she said they are in"
      - fact: "Wall condition: sound, nail holes and scuffs, peeling, stains"
        bank_question: repairs
        follow_up: null
        photo: p2
        why_it_moves_price: "Patching and stain-blocking primer are the difference between the low and high end of a range. [judgment]"
        skip_if: "Close-up sent and her words cover condition"
      - fact: "Home built before 1978 or not"
        bank_question: null
        follow_up: fu_home_age
        photo: null
        why_it_moves_price: "Peeling or sanding in a pre-1978 home brings in RRP lead-safe work."
        skip_if: "She gave the year, or walls are sound and the job is a color change only"
      - fact: "Empty, or furniture to move"
        bank_question: null
        follow_up: fu_furniture
        photo: p1
        why_it_moves_price: "Moving and covering furniture adds hours, and some clients cannot move it themselves. [judgment]"
        skip_if: "Wide photo shows an empty room, or she said it is empty"
    allowed_follow_ups:
      - id: fu_ceilings
        ask_when: "Inside rooms and she has not said whether ceilings are part of the job"
        text_en: "Are the ceilings part of the job?"
        text_es: "¿Los techos también se pintan?"
        options_en: ["Walls only", "Walls and smooth ceilings", "Walls and bumpy or popcorn ceilings", "Walls and tall or vaulted ceilings"]
        options_es: ["Solo paredes", "Paredes y techos lisos", "Paredes y techos con textura o tipo popcorn", "Paredes y techos altos o inclinados"]
        card_field: true
        why: "Ceilings are a separate pass, and texture and height change the method and gear. [judgment]"
      - id: fu_home_age
        ask_when: "Paint is peeling, will be scraped or sanded, or she calls the house old, and she has not given a year"
        text_en: "About when was the home built?"
        text_es: "¿Más o menos en qué año se construyó la casa?"
        options_en: ["1978 or later", "Before 1978"]
        options_es: ["1978 o después", "Antes de 1978"]
        card_field: true
        why: "Paid work that disturbs paint in pre-1978 housing past the minor-repair limits falls under the EPA RRP rule; the question names no hazard."
      - id: fu_stain_wet
        ask_when: "She wants a stain, ring, bubbling or peeling spot on a ceiling or wall painted over"
        text_en: "Does the spot change after it rains, or after a shower or tub upstairs is used?"
        text_es: "¿La mancha cambia cuando llueve, o cuando se usa una regadera o tina de arriba?"
        options_en: ["No, it stays the same", "It changes after rain", "It changes after a shower or tub is used", "It feels damp now"]
        options_es: ["No, sigue igual", "Cambia cuando llueve", "Cambia cuando se usa la regadera o la tina", "Se siente húmeda ahora"]
        card_field: true
        why: "A spot that changes is a roof or plumbing job first and painting after; she decides, the card carries her answer. [judgment]"
      - id: fu_furniture
        ask_when: "Inside rooms, no wide photo of an empty room, and she has not said who moves furniture"
        text_en: "Will the rooms be empty, or will furniture need moving?"
        text_es: "¿Los cuartos van a estar vacíos, o hay que mover muebles?"
        options_en: ["Empty", "Furniture stays, I can move it", "Furniture stays, the painter moves it"]
        options_es: ["Vacíos", "Los muebles se quedan, yo los muevo", "Los muebles se quedan, el pintor los mueve"]
        card_field: true
        why: "Furniture adds hours, and the painter needs to know who moves it. [judgment]"
    photos_priority: [p1, p2, p3]
    urgency:
      fire_dept_triggers: ["Outlet in a room to be painted sparked or smells burning (said in passing)"]
      urgent_capable_triggers: []
      regular: "All interior repaints, including ones with a fixed move-in or guest date"
    scope_line_en: "Repaint walls in 3 bedrooms and the hallway; ceilings not included; nail holes and scuffs to patch."
    scope_line_es: "Pintar las paredes de 3 recámaras y el pasillo; techos no incluidos; hay hoyos de clavos y raspones que resanar."
    quote_format: range
    business_fills: ["price range", "what is included (patching, primer, coats, ceilings, trim, paint line)", "how many days", "earliest start day"]
    card_template: |
      REQ-<id> | Painting | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: rooms, walls or ceilings, condition>
      Size: <size answer, rooms named>. Ceilings: <not included / smooth / bumpy or popcorn / tall or vaulted>. Repairs first: <yes / no>. Built: <year / before 1978 / 1978 or later / not said>.
      Paint: <business supplies / homeowner has it>. Furniture: <empty / homeowner moves / painter moves / not said>. Look: <her words>; look pictures <n> (inspiration, not her home); concept image <attached, labeled AI-generated, not exact, may not be feasible / none>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That old paint probably has lead in it.", "You'll need a primer for that much color change.", "Interior repaints run about three dollars a foot.", "A handyman can do one room cheaper.", "That green will look great."]

  - id: exterior_stucco
    label: "Exterior stucco, siding, trim and fascia"
    bank_job_type: "exterior painting"
    recurring: false
    homeowner_phrasings: ["outside of the house is faded", "stucco is chalky", "fascia peeling", "repaint the outside", "pintar por fuera"]
    must_know:
      - fact: "Which parts: stucco walls, trim and fascia, or both"
        bank_question: where
        follow_up: fu_exterior_parts
        photo: p1
        why_it_moves_price: "Trim-only is a small ladder job; whole-body stucco is spray and back-roll over days. [judgment]"
        skip_if: "Her words or the photo make the parts clear"
      - fact: "One story or two, and hillside walls"
        bank_question: null
        follow_up: fu_stories
        photo: p1
        why_it_moves_price: "Two stories and tall downhill walls mean planks or a lift and more hours. [judgment]"
        skip_if: "Wide photo shows the full house"
      - fact: "Surface condition: peeling, chalking, cracks"
        bank_question: repairs
        follow_up: null
        photo: p2
        why_it_moves_price: "Crack repair, scraping and primer set the prep days. [judgment]"
        skip_if: "Close-up sent and her words cover it"
      - fact: "HOA color approval needed, and whether it is done"
        bank_question: null
        follow_up: fu_hoa_colors
        photo: null
        why_it_moves_price: "An approval wait sets the start date and limits the color list. [judgment]"
        skip_if: "She said there is no HOA"
      - fact: "Home built before 1978 or not"
        bank_question: null
        follow_up: fu_home_age
        photo: null
        why_it_moves_price: "Scraping more than 20 sq ft outside on a pre-1978 home brings in RRP lead-safe work."
        skip_if: "Year given, or the home is clearly newer from her words"
    allowed_follow_ups:
      - id: fu_exterior_parts
        ask_when: "Outside work and she has not said which parts, or she names a garage floor, patio or roof"
        text_en: "Which parts need paint?"
        text_es: "¿Qué partes hay que pintar?"
        options_en: ["Stucco or siding walls", "Trim, fascia and eaves", "Walls and trim", "Garage floor or patio slab", "Roof coating"]
        options_es: ["Paredes de estuco o revestimiento", "Molduras, fascia y aleros", "Paredes y molduras", "Piso de la cochera o losa del patio", "Recubrimiento del techo"]
        card_field: true
        why: "Walls and trim are painting; a floor coating goes to epoxy floors and a roof coating to roofing. [judgment]"
      - id: fu_stories
        ask_when: "Outside work and no wide photo of the whole house"
        text_en: "How tall is the house?"
        text_es: "¿Qué tan alta es la casa?"
        options_en: ["One story", "Two stories", "Two stories with a tall downhill side"]
        options_es: ["Un piso", "Dos pisos", "Dos pisos con un lado alto hacia abajo de la loma"]
        card_field: true
        why: "Height sets ladders, planks or a lift. [judgment]"
      - id: fu_hoa_colors
        ask_when: "Outside work, a color change, and she has not mentioned an HOA"
