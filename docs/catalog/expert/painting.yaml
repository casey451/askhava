  what_they_dislike_about_lead_services: ["Paying for a lead four other painters also bought", "Homeowners who want a price for a whole house over the phone", "Driving out for a walk-through to someone only collecting bids", "Fake numbers and people outside their area", "Monthly fees whether or not jobs come", "Being ranked by the site"]
  what_makes_a_lead_worth_paying_for: ["Rooms or wall length, ceilings and stories stated up front", "Wide photos plus a close-up of the worst spot", "Home age stated, so they know whether lead-safe work applies", "Who supplies paint and whether colors are picked", "HOA approval status on exteriors", "Pay only when picked, nothing monthly"]
  their_words: ["cut in", "back-roll", "spray and back-roll", "two coats", "primer", "stain blocker", "elastomeric", "chalking", "efflorescence", "caulk", "fascia", "eaves", "masking", "sheen", "orange peel", "knockdown", "walk-through", "color consult", "lead-safe", "RRP", "per door"]
  signup_objections:
    - objection: "I can't price a paint job from a text. I need a walk-through."
      answer: "Quote a range and say what would move it. Cards carry the rooms or wall length, ceilings, stories, surface condition and photos. If she picks you, a walk-through can firm up the number."
    - objection: "Why pay $199 on an exterior I haven't even seen?"
      answer: "You pay only when the homeowner picks your quote and you confirm. The fee is set by job size: $25, $75 or $199. Nothing to join and nothing per month."
    - objection: "Homeowners just pick the cheapest painter."
      answer: "She sees every quote in the order it came in, with each business's name, license numbers and review links, and your own words on what is included. Ask Hava never sorts, rates or scores a business."
    - objection: "I'm not RRP certified and don't take pre-1978 jobs that disturb paint."
      answer: "Cards state the home's age when the homeowner gives it, so you can pass on a job you don't take. You only pay if you quote and get picked."
    - objection: "I only do cabinets, or only interiors."
      answer: "You pick the job types you want at sign-up and change them any time. You get cards only for those."
    - objection: "Do I need a license to get these?"
      answer: "Cards go only to businesses whose Arizona ROC license covers the job. For painting that is a painting and wall covering license or a general license that includes it."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town, photos and answers to a painter's questions. Names and addresses go only to the business she picks."
    - objection: "What if she cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
  quote_tips_for_card: ["Say what the range includes: prep, primer, coats, ceilings, trim and the paint line", "Say what would move the price to the top of your range", "Give your earliest start day and how many days the job takes", "If you need another photo, say which wall or close-up"]
