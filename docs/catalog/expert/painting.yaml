# Ask Hava expert layer: painting (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set painting and trade_kb/trades/painting.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - kb job type garage_floor_epoxy is left out: the enabled category epoxy_floors (job type "garage floor
#   epoxy", kb_trade flooring) owns it. A misdiagnosis check below routes it there. R-34 also covers
#   "liquid floor and wall coatings" (A.A.C. R4-9-103), so docs/catalog/license_map.yaml decides whether
#   R-34 painters also see epoxy cards.
# - The other 8 kb job types are kept. block_wall and deck_stain sit under "exterior painting"
#   (deck_stain also covers a front door, which can be stained from inside); touch_up, wallpaper and
#   popcorn_ceiling sit under "interior painting". No new_job_type was needed.
# - popcorn_ceiling: removing texture is also R-10 scope ("wall board tape and texture"). CPSC says textured
#   paint and patching compounds may hold asbestos (use banned in 1977), and EPA says a trained, accredited
#   professional should sample before remodeling. Ask Hava gives no advice; the card carries the home's age
#   and whether the texture was tested. Casey may want removal of untested texture in older homes to go to a
#   narrower set of businesses.
# - kb emergency signal es_painting_2 (a child ate paint chips, someone sick from fumes) is marked
#   emergency in the kb but is not on the D-436 fire-truck list, so no text goes out; the card carries her
#   words. Confirm that is the intended behavior.
# - "Paint my roof" (foam or elastomeric roof coating) is R-42 work. roof_repair has no coating job type,
#   so the check below routes it to "leak repair" as the closest fit. A "roof coating" job type would be
#   cleaner.
# - The question set has no home-age or ceilings question, and the AI may ask only one follow-up. The kb
#   has q5_home_age and q4_ceilings. Adding "About when was the home built?" to the bank would let the one
#   follow-up go to ceilings, HOA or cabinet material instead. The bank's size options (rooms) also do not
#   fit block walls or cabinets, and "where" has no block wall option.
# - EPA RRP firm certification is federal and separate from the ROC license. Whether a business states
#   its RRP status at sign-up or on its quote is a license_map / sign-up decision, not made here.
