# Ask Hava expert layer: estate_cleanout (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set estate_cleanout and trade_kb/trades/junk_removal.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The junk_removal kb file serves three categories: estate_cleanout (this file), donation_pickup and the
#   disabled junk_removal category. Mapped here: cleanout ("whole-house cleanout"), plus demo_small and
#   hazmat_route, kept under "whole-house cleanout" for the case where a tear-down (hot tub, shed, playset)
#   or a garage of chemicals, paint and propane is part of clearing a property. A tear-down or chemical haul
#   on its own is junk haul-away (disabled, LIC-005): the misdiagnosis checks route it to junk_removal, and
#   the homeowner gets the no-coverage reply (scenario s15).
# - Left out: furniture_items (donation_pickup "furniture donation pickup"); appliances, yard_debris and
#   construction_debris (junk haul-away, disabled). Appliances inside a cleanout ride on fu_hard_items and
#   photo p2, so the card still names fridges, freezers and AC units.
# - new_job_type: cleanout_sort carries "sorting for donation". Each kb id may appear once, so cleanout
#   carries "whole-house cleanout". Scenarios s06, s08 and s14 name job_type cleanout with bank_job_type
#   "sorting for donation"; routing should read cleanout_sort for those.
# - Bank gaps: no question for appliances and hazards (the top hidden cost), none for outbuildings or a
#   storage unit, and none for gate, HOA or park rules. The size answers have no "garage or shed only"
#   option (tenant scenario s07). fu_hard_items, fu_other_spaces and fu_access_rules cover these; a bank
#   hazards question would be stronger because only one follow-up may be asked.
# - Estate sales and liquidation (selling the contents) are not offered by any category. The card states
#   the clearing and sorting she wants, not the sales words she used.
# - Open: Lake Havasu City Code ch. 8.04 (trash franchise) was not read. The changes file (7.1 item 13)
#   treats estate cleanouts as not refuse collection; that reading is unverified against the code text.
schema: 1
category: estate_cleanout
question_set: estate_cleanout
kb_trade: junk_removal
as_of: "2026-10-29"
written_by: "Claude expert layer, Oct 29 2026. AI research, not legal advice."
