  what_they_dislike_about_lead_services: ["The same request sold to several haulers at once", "No photos and 'just a truck load' for a full house", "Paying for people who only want a free estimate to show the family", "Monthly fees in slow summer months", "Showing up to find a locked shed, no key and nobody who can say yes", "Being ranked or reviewed by the site"]
  what_makes_a_lead_worth_paying_for: ["Rooms, outbuildings and how full they are, before the first call", "Appliances, chemicals, propane and hot tubs named up front", "Who is asking and who can say yes", "A real deadline and the reason for it", "Pay only when picked, nothing monthly, no share of the job"]
  their_words: ["cleanout", "load", "trailer load", "dump run", "donation run", "keep, donate, toss", "set-aside", "broom clean", "walk-through", "dump fee", "minimum", "PPE", "estate", "heirs", "realtor deadline"]
  signup_objections:
    - objection: "Whole houses need a walk-through. I can't quote from a text."
      answer: "Quote a range and say what it assumes. If you want a walk-through first, say so and give your earliest day. Cards list rooms, outbuildings, how full it is, special items and photos when she sends them."
    - objection: "Why pay a fee on a job I could find myself?"
      answer: "You pay only when the homeowner picks your quote. Nothing to join and nothing monthly. The fee is set by job size: $25, $75 or $199."
    - objection: "Families fight over what stays. I don't want to be in the middle."
      answer: "Each card says who is asking: the owner, family or the estate, or a renter. You decide whether to quote. Ask Hava does not decide who owns what."
    - objection: "Will I get single couches and dump runs?"
      answer: "Junk haul-away is not open on Ask Hava right now. Estate cleanout cards are large clearings and sorting for donation. Single pieces going to charity are donation pickup, a separate job type you can choose or skip."
    - objection: "I don't do hot tubs, gas appliances or chemicals."
      answer: "You don't have to. Cards name hot tubs, gas appliances, chemicals and propane up front. Quote the rest and say what you leave out. Gas and wired disconnects go only to licensed trades."
    - objection: "The owner lives out of state. Who signs off?"
      answer: "The card says when the requester can't be there and how a crew can get in. Her name and contact go to the business she picks, so you settle sign-off and payment with her."
    - objection: "What if she cancels after I pay?"
      answer: "If you haven't spoken with her yet, the fee is refunded."
    - objection: "Will you rank me against other crews?"
      answer: "No. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "How do I know the request is real?"
      answer: "Each request comes from a texted phone number we check, with a town, a size, a deadline and answers to the questions a crew asks. Her name and address go only to the business she picks."
    - objection: "I only want whole houses, not sorting jobs."
      answer: "Pick the job types you want at sign-up and change them any time. Whole-house cleanout and sorting for donation are separate."
  quote_tips_for_card: ["Say what the range assumes: loads, crew size, days, and dump and donation runs", "Say how you handle fridges, freezers and AC units, and what you won't take, like paint, propane or chemicals", "Say whether a walk-through comes first and your earliest day for it", "Say what done means: empty, or broom clean", "Say whether you send photos when the work is done, for owners who can't be there"]
