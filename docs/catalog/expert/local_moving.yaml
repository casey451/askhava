  - id: heavy_item
    label: "One heavy item: piano, gun safe, pool table, hot tub on a dolly"
    bank_job_type: "in-town move"
    recurring: false
    homeowner_phrasings: ["move a piano", "move my gun safe to the bedroom", "pool table to the new house", "move the hot tub", "mover una caja fuerte"]
    must_know:
      - fact: "Which item, and its size if she knows"
        bank_question: null
        follow_up: fu_heavy_items
        photo: p2
        why_it_moves_price: "An upright piano, a grand, a 1,000-pound safe and a slate table are four different crews and gear lists. [judgment]"
        skip_if: "Her words and photo name the item"
      - fact: "Whether it is bolted down, wired in or hooked to gas or water"
        bank_question: null
        follow_up: fu_connected
        photo: p2
        why_it_moves_price: "Unbolting adds time, and a wired hot tub or gas appliance needs a licensed disconnect first, which a mover does not do."
        skip_if: "Photo shows it free-standing"
      - fact: "Stairs, slope or tight turns on the path at both ends"
        bank_question: stairs
        follow_up: fu_other_end
        photo: p3
        why_it_moves_price: "A safe or piano on stairs needs more hands or a stair climber. [judgment]"
        skip_if: "Both ends described"
    allowed_follow_ups:
      - fu_heavy_items
      - id: fu_connected
        ask_when: "A safe, hot tub, appliance or anything that might be bolted, wired or hooked up is going"
        text_en: "Is it bolted to the floor, wired in, or hooked to gas or water?"
        text_es: "¿Está atornillado al piso, conectado a la electricidad, o conectado al gas o al agua?"
        options_en: ["Free-standing", "Bolted to the floor", "Wired in", "Hooked to gas or water"]
        options_es: ["Suelto", "Atornillado al piso", "Conectado a la electricidad", "Conectado al gas o al agua"]
        card_field: true
        why: "Gas work is never handyman or mover work in Arizona; the card states the fact and the business decides."
      - fu_other_end
    photos_priority: [p2, p3]
    urgency:
      fire_dept_triggers: ["Gas smell after a gas appliance was unhooked"]
      urgent_capable_triggers: []
      regular: "Any single-item move"
    scope_line_en: "Move an upright piano from a single-story house to a home across town with 4 front steps; piano is free-standing."
    scope_line_es: "Mover un piano vertical de una casa de un piso a una casa al otro lado de la ciudad con 4 escalones al frente; el piano está suelto."
    quote_format: range
    business_fills: ["low and high price", "crew size and gear the range assumes", "earliest date"]
    card_template: |
      REQ-<id> | Local moving | <town>, <general area> to <town>, <general area> | <kind of place at each end>
      <one scope line: the item, from and to>
      Item: <piano / gun safe / pool table / hot tub / other>, <size if given>. Connected: <free-standing / bolted / wired / gas or water>.
      Path: from <ground / steps / stairs / slope>; to <ground / steps / stairs / slope / same home>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["A gun safe that size weighs about 800 pounds.", "Just unbolt it first.", "Unhook the hot tub before they come.", "Piano moves start around two hundred.", "Any two strong guys can do it."]

