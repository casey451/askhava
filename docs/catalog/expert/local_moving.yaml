      urgent_capable_triggers: ["Truck or container is due back or picked up today", "Booked help cancelled and the truck is here now"]
      regular: "Load date set a few days or more out"
    scope_line_en: "Loading help only, 26-foot rental truck at the street about 200 feet from the door; 3-bedroom house; Saturday at sunrise."
    scope_line_es: "Solo ayuda para cargar, camión rentado de 26 pies en la calle a unos 200 pies de la puerta; casa de 3 recámaras; sábado al amanecer."
