business_side:
  how_they_get_customers: ["Google Maps listing and reviews", "Repeat customers and word of mouth", "Realtors, property managers and senior-living staff passing their name along [judgment]", "Google search ads and Local Services Ads", "Marketplaces such as Thumbtack, Yelp and labor-only moving-help sites", "Local Facebook groups and truck signage [judgment]"]
  customer_acquisition_benchmarks:
    - channel: "Google Local Services Ads (movers)"
      figure: "Median about $48 per lead, range $28 to $95, about 30 percent book (marketing vendor citing a third-party dataset)"
      source: webtonic_moving_lsa
      unverified: false
    - channel: "Google search ads (movers)"
      figure: "About $66 to $200 per lead for a 2 to 4 truck company, $63 to $83 for 11 or more trucks (moving-software vendor estimate)"
      source: smartmoving_google_ads
      unverified: false
    - channel: "Lead aggregators and shared-lead sites (movers)"
      figure: "About $10 to over $100 per lead; shared leads at the low end are sold to several movers at once (marketing agency)"
      source: netpeak_moving_cpl
      unverified: false
    - channel: "Yelp (movers)"
      figure: "About $20 to $60 per lead (marketing agency)"
      source: netpeak_moving_cpl
      unverified: false
    - channel: "Labor-only moving-help marketplaces"
      figure: "Listed at a 29 percent platform fee, or 15 percent on direct bookings (marketing agency; terms not explained there)"
      source: netpeak_moving_platforms
      unverified: true
    - channel: "Lake Havasu City movers specifically"
      figure: "No local figures found; a small market with few movers may run below national figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["The same lead sold to five movers at once", "Out-of-state and long-distance requests they can't take", "People who want a phone price and have no date", "Wrong numbers and fake requests", "Percentage fees on the whole job", "Being ranked or reviewed by the site"]
  what_makes_a_lead_worth_paying_for: ["A real date and town at both ends", "Bedrooms plus garage, heavy items and access at both ends on the card", "Room photos before the first call", "Pay only when picked, nothing monthly, no share of the job", "Both ends confirmed in Arizona"]
  their_words: ["binding estimate", "not-to-exceed", "hourly with a minimum", "two-man crew", "travel time", "long carry", "shuttle", "pads and wrap", "piano board", "stair climber", "box count", "26-footer", "labor only", "container"]
  signup_objections:
    - objection: "I already get moving leads from other sites."
      answer: "Those are usually sold to several movers at once. Here every mover that takes the job type sees the card, but you pay only when the homeowner picks your quote. Nothing to join, nothing monthly."
    - objection: "I can't quote a move without a walk-through."
      answer: "Quote a range and say what it assumes: crew size, hours, truck. Cards list bedrooms, garage, heavy items, stairs at both ends and photos when she sends them. If you need a video walk-through, say so in your quote."
    - objection: "Moves cancel and reschedule all the time. Do I lose the fee?"
      answer: "If the homeowner cancels before you have spoken with her, the fee is refunded."
    - objection: "What does it cost me?"
      answer: "One set introduction fee when you confirm a pick: $25, $75 or $199 by job size. It is not a share of the job, and there is no monthly fee."
    - objection: "Will you send me long-distance moves?"
      answer: "No. Ask Hava does not take moves that start or end outside Arizona. Every moving card has both ends in Arizona."
    - objection: "I only do labor, I don't have a truck."
      answer: "Pick loading help only at sign-up. You get cards for that job type and nothing else, and you can change it any time."
    - objection: "Will you rank me against other movers?"
      answer: "No. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "How do I know the homeowner is real?"
      answer: "Each request comes from a texted phone number we check, with a town, a date and answers to the questions a mover asks. Her name and address go only to the business she picks."
  quote_tips_for_card: ["Say what the range assumes: crew size, truck size, hours and any minimum", "Say whether drive time is in the range", "Say whether you take the piano, safe or pool table on the card, or that you don't", "Give your earliest date and start time", "Arizona's in-state mover law expects a signed contract with the total estimated price before work starts; your quote here is the range, and your own contract still comes from you"]
