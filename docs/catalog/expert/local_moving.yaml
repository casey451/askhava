        text_es: "¿La ayuda es para cargar aquí, descargar aquí, o en los dos lugares?"
        options_en: ["Loading here", "Unloading here", "Both ends"]
        options_es: ["Cargar aquí", "Descargar aquí", "En los dos lugares"]
