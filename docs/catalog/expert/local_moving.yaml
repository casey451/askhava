# Ask Hava expert layer: local_moving (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set local_moving and trade_kb/trades/moving.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - kb job type disconnect_route (gas, water or electric disconnect or reconnect) is left out: it is licensed
#   work (R-37 gas piping, R-11 electrical) and has no job type or refused name in local_moving. Requests that
#   mention it get the fu_connected follow-up, the card says the item is connected, and the misdiagnosis check
#   routes gas work to plumbing_repair "gas line work".
# - in_state_move is a new job type (new_job_type: true). The kb's local_move covers any move inside Arizona,
#   but each kb id may appear once, so local_move carries "in-town move" and in_state_move carries "in-state move".
#   Scenarios s03 and s08 name job_type local_move with bank_job_type "in-state move"; routing should read
#   in_state_move for those.
# - interstate_move maps to the refused name "move leaving Arizona" (LIC-017, D-082: a move that starts OR ends
#   outside Arizona is refused). Its card_template is the internal decline record; no card goes to a business.
# - Bank gaps: the distance option "Under 50 miles" does not say "in Arizona", and Needles, Havasu Lake and
#   Earp (California) are all under 50 miles; suggest "Under 50 miles in Arizona". The bank has no heavy-items
#   or packing question although the kb has q4_heavy and a packing option in q3_service; fu_heavy_items and
#   fu_packing cover them here, but a heavy-items bank question would be stronger (it is the top hidden driver).
# - kb emergency signals es_moving_1 (heat illness) and es_moving_3 (mover holding goods) are not on the
#   fire-truck list, so they get no text from Ask Hava (D-436). A "mover won't unload" message is not a job for
#   a business; it gets a plain reply with no advice and no card.
schema: 1
