trade_brief:
  price_drivers:
    - driver: "How much is moving: bedrooms plus the garage, shed, patio and anything never unpacked"
      why: "In-state moves are usually billed by the hour, so volume sets crew size, truck size and hours; bedroom count alone undercounts a full garage."
      source: azag_movers
    - driver: "Service: full move with a truck, labor only into a truck or container she has, or packing too"
      why: "Labor only drops the truck and drive time; packing can add a day of crew time. [judgment]"
      source: null
    - driver: "Heavy or specialty items: piano, gun safe, pool table, hot tub, large aquarium"
      why: "They set crew size and gear (piano board, stair climber, extra hands) and some crews do not take them at all. [judgment]"
      source: null
    - driver: "Access at both ends: stairs, elevator, long carry from where a truck can park, gravel, steep driveway"
      why: "Every flight and every extra 50 feet of carry adds crew time on hourly billing; the bank's stairs question covers only one end. [judgment]"
      source: null
    - driver: "Distance and drive time: inside Lake Havasu City, or Parker, Kingman, Bullhead City and beyond"
      why: "Hourly crews bill drive time, and a run to Kingman or Bullhead City can double the clock for the same load. [judgment]"
      source: null
    - driver: "Date and start time: weekend, end of month, summer afternoon, or a same-day rescue"
      why: "End of month and weekends book first; summer crews start at dawn and fit fewer jobs in a day. [judgment]"
      source: null
    - driver: "How packed it is on move day"
      why: "Loose items and open shelves slow a crew more than any other single thing a homeowner controls. [judgment]"
      source: null
  hidden_conditions:
    - condition: "A piano, gun safe, pool table or hot tub that the homeowner did not mention"
      how_a_pro_spots_it: "A quilt-covered upright with pedals, a tall steel box in the garage, a felt-top table in a room photo"
      question_or_photo: fu_heavy_items
      source: null
    - condition: "Stairs, an elevator or a long carry at the other end, which the homeowner forgets to describe"
      how_a_pro_spots_it: "Destination is an apartment, condo, senior building or storage unit; the bank answer only covers the home she is in"
      question_or_photo: fu_other_end
      source: null
    - condition: "Far more stuff than the bedroom count: full garage, shed, patio furniture, boxes never unpacked"
      how_a_pro_spots_it: "Floor-to-ceiling boxes or a crowded garage in the room photos; long-time owner downsizing"
      question_or_photo: p1
      source: null
    - condition: "Nothing is boxed yet on move day"
      how_a_pro_spots_it: "Room photos show full shelves, open closets, no boxes; homeowner says 'just a couple hours'"
      question_or_photo: fu_packing
      source: null
    - condition: "An item that is bolted down, wired in, or hooked to gas or water (safe anchored to the slab, hot tub on a circuit, gas dryer or range)"
      how_a_pro_spots_it: "Bolt heads at a safe's base, a conduit to a hot tub, a flex gas line behind a dryer in a photo"
      question_or_photo: fu_connected
      source: ars_32_1121
    - condition: "The truck cannot park near the door: steep or gravel driveway, narrow gate, cul-de-sac, HOA rule on large trucks"
      how_a_pro_spots_it: "Access photo shows a slope, gate or gravel path; gated community named; container on a sloped drive"
      question_or_photo: p3
      source: null
    - condition: "The pickup or drop-off is outside Arizona, so the job is refused after the crew has planned it"
      how_a_pro_spots_it: "Town named is Needles, Havasu Lake, Laughlin or Las Vegas; the bank answer 'Under 50 miles' does not say which state"
      question_or_photo: fu_both_in_az
      source: ah_lic_017
    - condition: "The work is a cleanout, not a move: most of it is going to donation or the dump"
      how_a_pro_spots_it: "Estate, sale closing or tenant leftovers in her words; no new address named"
      question_or_photo: fu_anything_new_home
      source: ars_44_1611
  misdiagnosis_checks:
    - sounds_like: "in-town move (empty a house, haul everything out)"
      might_be: "estate cleanout, a different category"
      one_question: fu_anything_new_home
      if_other_route_to: {category: estate_cleanout, job_type: "whole-house cleanout"}
      source: ars_44_1611
    - sounds_like: "in-town move (take furniture to a thrift store or charity)"
      might_be: "donation pickup, a different category"
      one_question: fu_anything_new_home
      if_other_route_to: {category: donation_pickup, job_type: "furniture donation pickup"}
      source: null
    - sounds_like: "move leaving Arizona (homeowner calls Bullhead City or Kingman long distance or interstate)"
      might_be: "in_state_move"
      one_question: fu_both_in_az
      if_other_route_to: {category: local_moving, job_type: "in-state move"}
      source: fmcsa_rr
    - sounds_like: "in-town move or in-state move (short drive to Needles, Havasu Lake, Laughlin or Las Vegas)"
      might_be: "interstate_move, refused in this category"
      one_question: fu_both_in_az
      if_other_route_to: {category: local_moving, job_type: "move leaving Arizona"}
      source: ah_lic_017
    - sounds_like: "loading help (needs a couple of guys)"
      might_be: "local_move (no truck or container booked, wants the whole move)"
      one_question: fu_truck_type
      if_other_route_to: {category: local_moving, job_type: "in-town move"}
      source: null
    - sounds_like: "in-town move (move the gas dryer or range too)"
      might_be: "disconnect_route, licensed gas work outside this category"
      one_question: fu_connected
      if_other_route_to: {category: plumbing_repair, job_type: "gas line work"}
      source: ars_32_1121
  photo_reading:
    - photo_id: p1
      reads: ["Count of large furniture per room", "Boxes packed and taped or shelves still full", "Garage and patio volume", "Beds, sectionals or cribs that come apart", "Wall-mounted TVs", "Glass tops and china cabinets"]
      neutral_wording: "Living room with a sectional sofa, a glass-top table and about 10 taped boxes; shelves still full."
    - photo_id: p2
      reads: ["Upright or grand piano", "Gun safe size and whether bolts show at the base", "Pool table with a slate top", "Hot tub and whether a conduit or cord runs to it", "Upright freezer or second fridge"]
      neutral_wording: "Tall gun safe in the garage corner, bolts visible at the base."
    - photo_id: p3
      reads: ["Number of steps or flights", "Exterior metal stairs", "Gravel path or slope from the street", "Gate width", "Where a truck could park", "Elevator in a building"]
      neutral_wording: "Exterior metal staircase to a second-floor door; parking lot about 50 feet away."
  local_factors:
    - fact: "Lake Havasu City logged 120 days at or above 100 F and 23 days at or above 110 F in 2014, with the first 100 F day in early May"
      effect: "Crews start at dawn from May to September and fit fewer jobs in a day, so start time on the card matters to them"
      source: lhc_weather_2014
    - fact: "Arizona has no state license or registration for in-state movers; DPS points consumers to the Corporation Commission entity search"
      effect: "No license check gates this category; every mover that opts in gets the card"
      source: azag_movers
    - fact: "In-state moves are usually billed by the hour"
      effect: "A range quote rests on crew size, hours and drive time, so the card's volume and access facts move the range more than anything else"
      source: azdps_hhg
    - fact: "Federal moving rules apply to moves from one state to another; Ask Hava refuses any move that starts or ends outside Arizona"
      effect: "Needles, Havasu Lake and Earp in California and Laughlin and Las Vegas in Nevada are refused even though they are close; Parker, Kingman, Bullhead City and Fort Mohave are accepted"
      source: ah_lic_017
    - fact: "Seasonal residents arrive in fall and leave in spring, and many second homes sit empty in summer"
      effect: "Fall and spring bring partial moves and storage runs; the owner is often out of town, so key handoff and timing matter [judgment]"
      source: null
    - fact: "Many homes sit on slopes, with steep or gravel driveways, gated HOA streets and manufactured-home parks with narrow lanes"
      effect: "Truck parking distance is a common surprise, so the access photo at both ends is worth asking for [judgment]"
      source: null
    - fact: "Boats, trailers, golf carts and RVs are common at Havasu homes"
      effect: "Household movers usually do not tow them; the card notes them so a crew can say what it takes [judgment]"
      source: null
  seasonality:
    busy: "Late spring (seasonal residents leaving, school out), end of every month, and fall arrivals; summer moves start at dawn [judgment]"
    slow: "Mid-December to January, apart from end-of-month moves [judgment]"
    source: null

job_types:
  - id: local_move
    label: "Full move inside Lake Havasu City (house, apartment or condo to a new home)"
    bank_job_type: "in-town move"
    recurring: false
    homeowner_phrasings: ["movers?", "moving across town", "need a moving company", "move my stuff to my new house", "mudanza dentro de Havasu"]
    must_know:
      - fact: "How much is moving, including the garage, shed and patio"
        bank_question: bedrooms
        follow_up: null
        photo: p1
        why_it_moves_price: "Volume sets crew size, truck size and hours on hourly billing; a full garage can add a room's worth. [judgment]"
        skip_if: "Room photos cover the house and garage"
      - fact: "Any piano, gun safe, pool table or hot tub"
        bank_question: null
        follow_up: fu_heavy_items
        photo: p2
        why_it_moves_price: "Specialty items change the crew and gear, and some movers do not take them. [judgment]"
        skip_if: "Homeowner already listed heavy items or said none"
      - fact: "Access at both ends: stairs, elevator, long carry"
        bank_question: stairs
        follow_up: fu_other_end
        photo: p3
        why_it_moves_price: "Each flight and each long carry adds crew time; the bank answer covers one end only. [judgment]"
        skip_if: "Homeowner described both ends"
      - fact: "Whether everything will be boxed by move day"
        bank_question: service
        follow_up: fu_packing
        photo: p1
        why_it_moves_price: "Packing help or loose items can add hours or a second day. [judgment]"
        skip_if: "Homeowner said it is all boxed, or asked for packing"
    allowed_follow_ups:
      - id: fu_heavy_items
        ask_when: "Homeowner has not said whether any very heavy items are going"
        text_en: "Is anything very heavy going, like a piano, gun safe, pool table or hot tub?"
        text_es: "¿Va algo muy pesado, como un piano, una caja fuerte, una mesa de billar o un jacuzzi?"
        options_en: ["Piano", "Gun safe", "Pool table", "Hot tub or spa", "More than one of these", "None of these"]
        options_es: ["Piano", "Caja fuerte", "Mesa de billar", "Jacuzzi o spa", "Más de uno", "Ninguno"]
        card_field: true
        why: "The item a homeowner forgets most often and the one that changes the crew most. [judgment]"
      - id: fu_other_end
        ask_when: "The stairs answer or her words describe only one end, or the new place is an apartment, condo, senior building or storage unit"
        text_en: "What is it like at the new place: ground level, stairs, an elevator, or a long walk from where a truck can park?"
        text_es: "¿Cómo es el lugar nuevo: a nivel del suelo, con escaleras, con elevador, o hay que caminar lejos desde donde se estaciona el camión?"
        options_en: ["Ground level, truck parks close", "Stairs", "Elevator", "Long walk, gravel or a tight gate"]
        options_es: ["A nivel del suelo, el camión se estaciona cerca", "Escaleras", "Elevador", "Caminata larga, grava o un portón angosto"]
        card_field: true
        why: "Access at the drop-off is the second end of the clock and the one homeowners leave out. [judgment]"
      - id: fu_packing
        ask_when: "Full move and she has not said whether things are boxed"
        text_en: "Will everything be in boxes by move day, or do you want help packing too?"
        text_es: "¿Va a tener todo en cajas para el día de la mudanza, o quiere ayuda para empacar también?"
        options_en: ["All boxed by move day", "Some boxed", "Want packing help"]
        options_es: ["Todo en cajas para ese día", "Una parte en cajas", "Quiero ayuda para empacar"]
        card_field: true
        why: "Packing is priced separately and loose items slow a crew. [judgment]"
      - id: fu_anything_new_home
        ask_when: "Her words point at emptying a house, an estate, a sale, a donation run or tenant leftovers, and no new address is named"
        text_en: "Is everything going to a new home, or is some of it being given away or hauled off?"
        text_es: "¿Todo va a una casa nueva, o una parte se va a regalar o a tirar?"
        options_en: ["All to a new home", "Some to a new home, some given away or hauled off", "None of it goes to a new home"]
        options_es: ["Todo a una casa nueva", "Una parte a casa nueva, otra se regala o se tira", "Nada va a una casa nueva"]
        card_field: true
        why: "Moving law covers goods taken to a place the consumer chooses, not disposal; a no answer is a cleanout or donation job."
    photos_priority: [p1, p2, p3]
    urgency:
      fire_dept_triggers: ["Gas smell after a gas dryer, range or grill was unhooked"]
      urgent_capable_triggers: ["Must be out today or tomorrow (keys or lease due)", "Booked movers cancelled and the move is today"]
      regular: "Move date a week or more out"
    scope_line_en: "Full move with a truck, 2-bedroom single-story house on the north side to a rental near the center of town; gun safe in the garage."
    scope_line_es: "Mudanza completa con camión, casa de 2 recámaras de un piso en el lado norte a una casa rentada cerca del centro; caja fuerte en la cochera."
    quote_format: range
    business_fills: ["low and high price", "what the range assumes (crew size, hours, truck, any minimum)", "earliest date and start time"]
    card_template: |
      REQ-<id> | Local moving | <town>, <general area> to <town>, <general area> | <kind of place at each end>
      <one scope line: size, service, from and to>
      Service: <full with truck / packing too>. Size: <bedrooms>, plus <garage, shed, patio if said>. Boxed: <all / some / wants packing>.
      Access: from <ground / stairs / elevator / long carry>; to <ground / stairs / elevator / long carry / not said>. Heavy items: <list / none / not said>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That's about a four-hour job.", "Two guys should be plenty.", "Movers here run about a hundred an hour.", "Unbolt the safe before they come.", "You'll want to pack the kitchen yourself to save money."]

  - id: in_state_move
    new_job_type: true
    label: "Full move from Lake Havasu City to another Arizona town (Parker, Kingman, Bullhead City, Fort Mohave, Phoenix area)"
    bank_job_type: "in-state move"
    recurring: false
    homeowner_phrasings: ["moving to Kingman", "moving to Bullhead next month", "mudanza a Parker", "moving to Phoenix", "long distance to Bullhead"]
    must_know:
      - fact: "That both ends are in Arizona, and which town the move goes to"
        bank_question: distance
        follow_up: fu_both_in_az
        photo: null
        why_it_moves_price: "Drive time to the named town sets the clock, and an out-of-state end makes it a refused job. [judgment]"
        skip_if: "Homeowner named an Arizona town for both ends"
      - fact: "How much is moving"
        bank_question: bedrooms
        follow_up: null
        photo: p1
        why_it_moves_price: "Volume decides whether one truckload makes the trip or two. [judgment]"
        skip_if: "Room photos cover the house and garage"
      - fact: "Any piano, gun safe, pool table or hot tub"
        bank_question: null
        follow_up: fu_heavy_items
        photo: p2
        why_it_moves_price: "Specialty items change the crew and gear for a long day on the road. [judgment]"
        skip_if: "Homeowner listed heavy items or said none"
      - fact: "Access at both ends and whether it is packed"
        bank_question: stairs
        follow_up: fu_other_end
        photo: p3
        why_it_moves_price: "Stairs or a long carry at either end add hours on top of drive time. [judgment]"
        skip_if: "Homeowner described both ends"
    allowed_follow_ups:
      - id: fu_both_in_az
        ask_when: "The town at either end is not named, or a named town or the 'Under 50 miles' answer could be across the state line"
        text_en: "Are both the pickup and the drop-off in Arizona?"
        text_es: "¿Tanto el lugar donde se recoge como el lugar de entrega están en Arizona?"
        options_en: ["Both in Arizona", "One is in another state"]
        options_es: ["Los dos en Arizona", "Uno está en otro estado"]
        card_field: true
        why: "Ask Hava refuses any move that starts or ends outside Arizona, and close towns like Needles and Laughlin are across the line."
      - fu_heavy_items
      - fu_other_end
      - fu_packing
    photos_priority: [p1, p2, p3]
    urgency:
      fire_dept_triggers: ["Gas smell after a gas dryer, range or grill was unhooked"]
      urgent_capable_triggers: ["Must be out today or tomorrow (keys or lease due)"]
      regular: "Move date a week or more out"
    scope_line_en: "Full move with a truck from a 3-bedroom two-story house in Lake Havasu City to a single-story house in Parker, Arizona; pool table."
    scope_line_es: "Mudanza completa con camión de una casa de 3 recámaras y dos pisos en Lake Havasu City a una casa de un piso en Parker, Arizona; mesa de billar."
    quote_format: range
    business_fills: ["low and high price", "what the range assumes (crew size, hours, drive time, truck, any minimum)", "earliest date and start time"]
    card_template: |
      REQ-<id> | Local moving | <town>, <general area> to <Arizona town> | <kind of place at each end>
      <one scope line: size, service, from and to>
      Both ends in Arizona: yes. Service: <full with truck / packing too>. Size: <bedrooms>, plus <garage, shed, patio if said>. Boxed: <all / some / wants packing>.
      Access: from <ground / stairs / elevator / long carry>; to <ground / stairs / elevator / long carry / not said>. Heavy items: <list / none / not said>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Bullhead counts as long distance.", "That's an interstate move.", "A Kingman run is about a full day.", "It'll cost about the same as a local move.", "Rent a truck and hire help, it's cheaper."]

  - id: labor_only
    label: "Labor only: load or unload a rental truck, trailer or moving container"
    bank_job_type: "loading help"
    recurring: false
