trade_brief:
  price_drivers:
    - driver: "Number of dogs"
      why: "More dogs means more waste every visit, and scooping services price by dogs, yard size and frequency; the bank's dogs question carries it."
      source: msoc_scooping
    - driver: "Visit frequency: weekly, twice a week, every other week, or once"
      why: "The monthly price is visits times minutes per visit; every other week leaves twice the waste per visit, so it is not half the price. [judgment]"
      source: null
    - driver: "Buildup on the first visit (time since the yard was last picked up)"
      why: "Weeks or months of buildup turn the first visit into an hours-long cleanup that businesses charge apart from the monthly rate, usually as a setup charge; the bank does not ask it, fu_last_cleaned does. [judgment]"
      source: null
    - driver: "Area the dogs use: dog run, side yard, back yard, front and back, or a whole lot"
      why: "Walk time grows with area, and a quarter-acre lot with a desert edge takes a grid walk, not a quick pass; yard_size plus the overview photo carry it."
      source: msoc_scooping
    - driver: "Ground: rock or gravel, grass, artificial turf or dirt"
      why: "Waste sinks between rocks and hides under shrubs and cactus, so gravel yards take longer than turf or grass; most Havasu yards are rock. [judgment]"
      source: null
    - driver: "Where the waste goes: bagged in the homeowner's cart or hauled away"
      why: "Haul-away adds a dump stop and its cost; a full cart on pickup day forces haul-away anyway. [judgment]"
      source: null
    - driver: "Access and dogs on pickup day: locked gate, dogs loose in the yard, through-the-house only"
      why: "A locked gate or a loose dog that will not be put away is a wasted trip; businesses price that risk or decline. [judgment]"
      source: null
    - driver: "Add-ons: turf or dog-run deodorizing, pet-station bag refills"
      why: "Product and extra minutes each visit; deodorizing with a ready-to-use product needs no pest license, but spraying for fleas or ticks is pest work."
      source: ars_3_3611
  hidden_conditions:
    - condition: "Far more buildup than the homeowner said (vacant second home, tenant move-out, owner away all summer)"
      how_a_pro_spots_it: "Overview photo shows waste in many spots; heaviest-spot photo shows piles along a wall; homeowner mentions being away or a tenant leaving"
      question_or_photo: fu_last_cleaned
      source: null
    - condition: "Waste hidden in gravel, under oleander, cactus, bougainvillea or junipers along the block wall"
      how_a_pro_spots_it: "Overview photo shows dense shrubs and cactus beds dogs can get under"
      question_or_photo: p1_yard_overview
      source: null
    - condition: "Dogs that will be loose in the yard on pickup day, or a dog that does not take strangers"
      how_a_pro_spots_it: "Homeowner says the dogs live outside or no one is home on weekdays"
      question_or_photo: fu_dogs_out
      source: null
    - condition: "No side gate, a locked gate, or a yard reached only through the house or garage"
      how_a_pro_spots_it: "Gate photo shows no side access or a padlock; walls on both sides of the house"
      question_or_photo: p2_gate_access
      source: null
    - condition: "Trash cart too full on pickup day, so waste must be hauled away"
      how_a_pro_spots_it: "Homeowner picks bagged in the cart but has several dogs and a big first cleanup"
      question_or_photo: fu_disposal
      source: lhc_trash
    - condition: "Turf smell that a spray on top will not reach (urine soaked into the infill and backing)"
      how_a_pro_spots_it: "Turf photo shows dark patches in one corner; homeowner says the smell stays after hosing"
      question_or_photo: p4_turf_area
      source: null
    - condition: "Waste that is not from her dogs (cats, wildlife, a neighbor's dog over the wall)"
      how_a_pro_spots_it: "Large desert-edge lot; homeowner mentions coyotes, cats or droppings where her dogs cannot reach"
      question_or_photo: fu_whose_waste
      source: null
  misdiagnosis_checks:
    - sounds_like: "turf_deodorize (dog urine smell)"
      might_be: "indoor pet urine in carpet or floors, which no enabled category covers (closest is house cleaning)"
      one_question: fu_odor_where
      if_other_route_to: {category: house_cleaning, job_type: "deep cleaning"}
      source: null
    - sounds_like: "one_time_cleanup (yard left a long time)"
      might_be: "flea or tick spraying in the yard, pest_control"
      one_question: fu_bugs_too
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: ars_3_3611
    - sounds_like: "one_time_cleanup (tenant moved out)"
      might_be: "yard debris, weeds or trash to haul as well, landscape_maintenance"
      one_question: fu_other_items
      if_other_route_to: {category: landscape_maintenance, job_type: "yard cleanup"}
      source: null
    - sounds_like: "turf_deodorize (bad smell in the yard)"
      might_be: "sewage coming up at a yard cleanout or over a septic area, plumbing_repair main_line_backup or septic_pumping"
      one_question: fu_ground_wet
      if_other_route_to: {category: plumbing_repair, job_type: "drain clearing"}
      source: null
    - sounds_like: "multi_dog_large_yard (droppings all over a big lot)"
      might_be: "wildlife or rodent droppings, pest_control"
      one_question: fu_whose_waste
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
  photo_reading:
    - photo_id: p1_yard_overview
      reads: ["Rough size of the area the dogs use", "Ground: rock, grass, turf, dirt or a mix", "Shrubs, cactus and beds dogs go under", "How much waste shows and how spread out"]
      neutral_wording: "Medium back yard, gravel with a small turf patch along the patio; waste visible in several spots."
    - photo_id: p2_gate_access
      reads: ["Side gate or walkway, or no side access", "Latch or padlock", "Steps or slope on the way in", "Code pads or house numbers that must be cropped"]
      neutral_wording: "Side gate with a latch and a gravel walkway into the back yard."
    - photo_id: p3_heaviest_spot
      reads: ["Depth of buildup in one area", "Ground under it", "Old dried waste versus fresh"]
      neutral_wording: "Heavy buildup along the back block wall on gravel."
    - photo_id: p4_turf_area
      reads: ["Size of the turf or dog run", "Dark or stained patches", "Turf edges and drainage"]
      neutral_wording: "Artificial turf dog run about the size of a small patio, darker patches in one corner."
    - photo_id: p5_common_area
      reads: ["Pet station with bag holder and can", "Size and ground of the area", "Fencing, signs, how many stations show"]
      neutral_wording: "Pet station with a bag holder and can beside a gravel strip along the park road."
  local_factors:
    - fact: "Lake Havasu City Code 6.20.050 makes it a civil offense to let dog waste pile up, spread through a property, or be seen or smelled from outside it (fine up to $1,000 per violation)"
      effect: "Some requests follow a neighbor, HOA or city notice and come with a date; the card states the date as a fact and Ask Hava gives no legal view"
      source: lhc_title6
    - fact: "City Code 6.20.010 requires dog owners to clean up after their dogs in city parks"
      effect: "HOA, park-style and RV-park common areas keep pet stations, which is the common-area account a business quotes"
      source: lhc_title6
    - fact: "Monsoon season officially runs June 15 to September 30"
      effect: "Storms wash waste into gravel and against walls and leave mud, so post-storm visits run long [judgment]"
      source: nws_monsoon
    - fact: "Summer heat from June to September"
      effect: "Many scoopers work early mornings; odor and flies build fast, which raises twice-a-week requests [judgment]"
      source: null
    - fact: "Most yards are rock or gravel, with more artificial turf dog runs each year"
      effect: "Rock slows pickup; turf brings deodorizing add-ons [judgment]"
      source: null
    - fact: "Seasonal residents and vacant second homes"
      effect: "Requests for a cleanup before owners arrive in fall or after renters leave, and for pausing service while owners are away [judgment]"
      source: null
    - fact: "City trash carts take residential household waste only; pet waste is not addressed on the city page"
      effect: "Businesses decide whether bags go in the homeowner's cart or are hauled away, and say so in the quote"
      source: lhc_trash
    - fact: "Businesses working inside city limits need a Lake Havasu City business license"
      effect: "No state contractor license applies, so the city license is the only one a business may be asked about"
      source: lhc_bizlic
  seasonality:
    busy: "October to April, when part-year residents are in town, plus fall arrival cleanups and spring move-out cleanups [judgment]"
    slow: "June to August for new sign-ups, when many part-year homes sit empty; existing weekly accounts keep going [judgment]"
    source: null

job_types:
  - id: weekly_pickup
    label: "Ongoing pickup (weekly, twice a week or every other week)"
    bank_job_type: "weekly yard pickup"
    recurring: true
    homeowner_phrasings: ["need someone to pick up dog poop every week", "pooper scooper service", "weekly poop scoop", "recoger popó de perro cada semana"]
    must_know:
      - fact: "Number of dogs"
        bank_question: dogs
        follow_up: null
        photo: null
        why_it_moves_price: "Waste per visit scales with dogs, and many services quote per dog. [judgment]"
        skip_if: "Homeowner gave the number"
      - fact: "How often"
        bank_question: how_often
        follow_up: null
        photo: null
        why_it_moves_price: "Visits per month set the monthly price. [judgment]"
        skip_if: "Homeowner named the schedule"
      - fact: "Area size and ground"
        bank_question: yard_size
        follow_up: fu_ground
        photo: p1_yard_overview
        why_it_moves_price: "A big gravel yard takes several times as long as a small turf run. [judgment]"
        skip_if: "Overview photo shows the yard and ground"
      - fact: "When the yard was last picked up"
        bank_question: null
        follow_up: fu_last_cleaned
        photo: p3_heaviest_spot
        why_it_moves_price: "Sets whether the first visit carries a cleanup charge on top of the monthly price. [judgment]"
        skip_if: "Homeowner says a service just stopped or she picks up herself every week"
      - fact: "Whether dogs will be out during the visit"
        bank_question: null
        follow_up: fu_dogs_out
        photo: p2_gate_access
        why_it_moves_price: "Loose dogs slow the visit or cost a wasted trip. [judgment]"
        skip_if: "Homeowner already said the dogs stay inside"
    allowed_follow_ups:
      - id: fu_last_cleaned
        ask_when: "Homeowner has not said when the yard was last picked up"
        text_en: "About when was the yard last picked up?"
        text_es: "¿Más o menos cuándo se recogió el patio por última vez?"
        options_en: ["In the last week", "2 to 4 weeks ago", "1 to 3 months ago", "Longer than that"]
        options_es: ["En la última semana", "Hace 2 a 4 semanas", "Hace 1 a 3 meses", "Hace más tiempo"]
        card_field: true
        why: "Buildup decides whether the first visit is a normal visit or a priced cleanup; the bank set lacks it. [judgment]"
      - id: fu_ground
        ask_when: "No overview photo and the homeowner has not said what the ground is"
        text_en: "What is the ground like where the dogs go?"
        text_es: "¿Cómo es el suelo donde van los perros?"
        options_en: ["Rock or gravel", "Grass", "Artificial turf", "Dirt", "A mix"]
        options_es: ["Piedra o grava", "Pasto", "Pasto artificial", "Tierra", "Una mezcla"]
        card_field: true
        why: "Gravel and shrub beds take longer than turf or grass. [judgment]"
      - id: fu_disposal
        ask_when: "Homeowner has not said where the waste should go"
        text_en: "Where should the waste go?"
        text_es: "¿Dónde se debe dejar el desecho?"
        options_en: ["Bagged in my trash cart", "Hauled away by the business", "Either is fine"]
        options_es: ["En bolsa en mi bote de basura", "Que se lo lleve el negocio", "Cualquiera"]
        card_field: true
        why: "Haul-away is priced differently from bagging in the homeowner's cart. [judgment]"
      - id: fu_dogs_out
        ask_when: "Homeowner has not said whether the dogs are in the yard on pickup day"
        text_en: "On pickup day, will the dogs be inside or out in the yard?"
        text_es: "El día que recogen, ¿los perros van a estar adentro o afuera en el patio?"
        options_en: ["Inside or away", "Out in the yard", "It varies"]
        options_es: ["Adentro o fuera de casa", "Afuera en el patio", "Depende del día"]
        card_field: true
        why: "Most scoopers will not work a yard with loose dogs they do not know; it sets the visit plan. [judgment]"
    photos_priority: [p1_yard_overview, p2_gate_access, p4_turf_area]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: []
      regular: "All ongoing pickup requests"
    scope_line_en: "Weekly dog waste pickup, 2 dogs, medium back yard, gravel with a small turf patch; last picked up about a month ago."
    scope_line_es: "Recoger popó de perro cada semana, 2 perros, patio trasero mediano, grava con un poco de pasto artificial; se recogió hace un mes."
    quote_format: monthly
    business_fills: ["price per month", "visits per month and the day", "any first-visit cleanup, listed as a one-time setup charge", "bagged in the cart or hauled away", "earliest start date"]
    card_template: |
      REQ-<id> | Dog waste pickup | <town>, <general area> | <house / manufactured home / condo>
      <one scope line: how often, dogs, area, ground, last pickup>
      Dogs: <n>. How often: <weekly / twice a week / every other week>. Area: <small / medium / large>, <ground>.
      Last picked up: <answer or not said>. Waste goes: <bagged in cart / hauled away / either>. Dogs on pickup day: <inside / out / varies / not said>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Weekly is the better deal.", "Most scoopers charge about twenty a week.", "Keep the dogs inside on pickup day.", "That much waste can make your kids sick.", "You'll want a big cleanup first."]

  - id: one_time_cleanup
    label: "One-time cleanup of a built-up yard"
    bank_job_type: "weekly yard pickup"
    recurring: false
    homeowner_phrasings: ["yard is covered in dog poop", "haven't picked up in months", "tenant left dog mess everywhere", "clean up the yard before we sell", "el patio está lleno de popó"]
    must_know:
      - fact: "How long since the last pickup"
        bank_question: null
        follow_up: fu_last_cleaned
        photo: p3_heaviest_spot
        why_it_moves_price: "Months of buildup is hours of work and more bags to haul; it is the biggest number in the quote. [judgment]"
        skip_if: "Homeowner said how long, or the heaviest-spot photo shows it"
      - fact: "Area size and ground"
        bank_question: yard_size
        follow_up: null
        photo: p1_yard_overview
        why_it_moves_price: "A whole gravel lot with shrub beds is a long first visit. [judgment]"
        skip_if: "Overview photo sent"
      - fact: "Whether pickup should continue after the cleanup"
        bank_question: how_often
        follow_up: fu_after_cleanup
        photo: null
        why_it_moves_price: "The quote format is monthly, so the business needs to know whether to quote a setup charge with ongoing service or the cleanup alone. [judgment]"
        skip_if: "Homeowner already said one time only or named an ongoing schedule"
      - fact: "Anything else to haul (trash, yard debris, furniture)"
        bank_question: null
        follow_up: fu_other_items
        photo: p1_yard_overview
        why_it_moves_price: "Other debris is a different job and changes who should quote. [judgment]"
        skip_if: "Photo shows a clear yard apart from the waste"
    allowed_follow_ups:
      - fu_last_cleaned
      - id: fu_after_cleanup
        ask_when: "Homeowner wants a cleanup and has not said whether pickup should continue after it"
        text_en: "After the first cleanup, should the business keep coming?"
        text_es: "Después de la primera limpieza, ¿quiere que el negocio siga viniendo?"
        options_en: ["One time only", "Weekly after that", "Twice a week after that", "Every other week after that"]
        options_es: ["Solo una vez", "Cada semana después", "Dos veces por semana después", "Cada dos semanas después"]
        card_field: true
        why: "Decides whether the quote is a setup charge plus a monthly price or the cleanup alone; see NOTES FOR REVIEW. [judgment]"
      - id: fu_other_items
        ask_when: "Tenant move-out, home sale or a long-vacant home"
        text_en: "Besides dog waste, is there trash, yard debris or old items to haul away too?"
        text_es: "Además del popó, ¿hay basura, ramas u objetos viejos que también hay que llevarse?"
        options_en: ["Just the dog waste", "Some yard debris too", "Trash or old items too"]
        options_es: ["Solo el popó", "También ramas y hojas", "También basura u objetos viejos"]
        card_field: true
        why: "Debris and junk go to a yard cleanup or cleanout business, not a scooper. [judgment]"
      - id: fu_bugs_too
        ask_when: "Homeowner mentions fleas, ticks, flies or bugs in the yard"
        text_en: "Is this pickup only, or do you also want the yard sprayed for fleas or bugs?"
        text_es: "¿Es solo recoger, o también quiere que fumiguen el patio contra pulgas o insectos?"
        options_en: ["Pickup only", "Spraying too"]
        options_es: ["Solo recoger", "También fumigar"]
        card_field: true
        why: "Spraying for fleas or ticks is pest management, a licensed category; a ready-to-use deodorizer is not."
    photos_priority: [p3_heaviest_spot, p1_yard_overview, p2_gate_access]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Homeowner has an HOA or city notice with a date", "Buyers, guests or a move-out inspection on a set date"]
      regular: "Cleanup with no date"
    scope_line_en: "One-time cleanup of a back yard not picked up in about 3 months, 2 dogs, gravel; tenant moved out."
    scope_line_es: "Limpieza de una sola vez de un patio trasero sin recoger desde hace unos 3 meses, 2 perros, grava; el inquilino se mudó."
    quote_format: monthly
    business_fills: ["cleanup price, listed as a one-time setup charge", "price per month if pickup continues", "bagged in the cart or hauled away", "earliest date"]
    card_template: |
      REQ-<id> | Dog waste pickup | <town>, <general area> | <house / manufactured home / rental>
      <one scope line: one-time cleanup, how long since last pickup, area, dogs>
      Last picked up: <answer>. Area: <small / medium / large>, <ground>. Dogs: <n, or none now>.
      After cleanup: <one time only / weekly / twice a week / every other week / not said>. Other items to haul: <none / yard debris / trash or old items>.
      Date to have it done by: <date from a notice, sale or move-out, or none>. Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That will take a whole day.", "Cleanups like that run about two hundred.", "The HOA can't fine you for that.", "Wear gloves and a mask.", "That yard is a health hazard."]

  - id: multi_dog_large_yard
    label: "Three or more dogs, or a large yard or lot"
    bank_job_type: "weekly yard pickup"
    recurring: true
    homeowner_phrasings: ["4 dogs on half an acre", "big lot with dogs", "lots of dogs", "tengo muchos perros"]
    must_know:
      - fact: "Number of dogs"
        bank_question: dogs
        follow_up: null
        photo: null
        why_it_moves_price: "Past three dogs, waste per visit climbs fast and twice-a-week service is common. [judgment]"
        skip_if: "Homeowner gave the number"
      - fact: "Which areas the dogs use (back only, front and back, the whole lot)"
