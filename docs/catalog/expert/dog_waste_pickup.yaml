# Ask Hava expert layer: dog_waste_pickup (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set dog_waste_pickup and trade_kb/trades/dog_waste_pickup.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Mapping. The category has one job type, "weekly yard pickup", so all five kb job types map to it:
#   weekly_pickup, one_time_cleanup, multi_dog_large_yard, commercial_hoa, turf_deodorize. No kb job type
#   was left out and no new_job_type was needed.
# - One-time cleanup has no one_time_job_types entry in categories.yaml, so one_time_cleanup is quoted
#   monthly like the rest. A business can put the cleanup in the one-time setup charge (FEE-044), but a
#   homeowner who wants ONE visit and no ongoing service leaves the monthly price with nothing to hold,
#   and the fee basis (4 months of the recurring price) then has no number. The bank's how_often question
#   already offers "Once". Suggest adding a "one-time yard cleanup" job type to the category, listed in
#   one_time_job_types (quoted firm). Until then fu_after_cleanup puts the homeowner's answer on the card.
# - The bank's how_often options are Once, Weekly, Twice a week. Every other week is a common scooping
#   schedule [judgment] and is missing; the kb q1_service_kind has it. Suggest adding it.
# - The bank set has no question for ground type, time since last pickup, or where the waste goes. All
#   three move the price; they are follow-ups here (fu_ground, fu_last_cleaned, fu_disposal). With only one
#   follow-up allowed per request, at least one of them is often lost. Suggest moving fu_last_cleaned
#   into the bank set.
# - With one category job type, a business cannot opt out of HOA common areas or turf deodorizing at
#   sign-up. The signup answer below says so plainly (skip a card, pay nothing). Casey may want
#   "common area pickup" as its own job type later.
# - Indoor pet urine in carpet has no enabled category (no carpet cleaning). The misdiagnosis check routes
#   it to house_cleaning "deep cleaning" as the closest fit. Open question for the catalog.
# - Whether bagged dog waste may go in a Lake Havasu City trash cart was not confirmed: the city trash page
#   says carts take residential household waste only and does not mention pet waste. Left to businesses.
