business_side:
  how_they_get_customers: ["Local Facebook groups and Nextdoor posts", "Door hangers in neighborhoods with many dogs", "Google Maps listing and reviews", "Word of mouth and vet or groomer referrals [judgment]", "Google and Meta ads", "Yard signs and truck magnets [judgment]"]
  customer_acquisition_benchmarks:
    - channel: "Thumbtack (pet services)"
      figure: "About $15 to $50 per lead, from a lead-form software vendor's blog with no stated method; pet waste removal not listed on its own"
      source: leadcapture_thumbtack
      unverified: false
    - channel: "Google search ads (pet waste removal)"
      figure: "Several dollars per click for local service terms; no per-lead or per-customer figure published by the marketing vendor"
      source: graphed_ads
      unverified: false
    - channel: "Print advertising (one operator's test)"
      figure: "Over $5,000 for one print ad that brought zero calls; the same owner grows by Facebook groups, door hangers and free trial cleanups and reports an average customer at a little over $110 a month (self-reported)"
      source: msoc_scooping
      unverified: false
    - channel: "Lake Havasu City scoopers specifically"
      figure: "No local figures found; a small market with few scooping businesses and many part-year residents [judgment]"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a request that several other scoopers also got", "A per-request price that eats a month of a small account", "One-time cleanups that never become weekly customers", "Homeowners who understate the buildup or the number of dogs", "Monthly platform fees whether or not accounts come"]
  what_makes_a_lead_worth_paying_for: ["Dogs, yard size, ground and how often stated up front", "Time since last pickup and a photo of the worst spot", "Gate and dogs-on-pickup-day stated", "A weekly account for one small fee, with repeat picks free", "Pay only when picked, nothing monthly"]
  their_words: ["scoop", "scooping", "initial cleanup", "per dog", "weekly service", "twice weekly", "bi-weekly", "yard check", "deodorizer", "enzyme", "haul-away", "pet waste station", "bag refills", "gate code", "dogs-in policy"]
  signup_objections:
    - objection: "My accounts are small. Why pay a fee for one?"
      answer: "You pay once, only when the homeowner picks your quote. For ongoing pickup the fee is set from 4 months of your monthly price and never goes over $75. If 4 months comes to under $500, the fee is $25. If that customer picks you again through Ask Hava, there is no fee."
    - objection: "I can't price a yard I haven't seen."
      answer: "Each card gives the number of dogs, yard size, how often, and most give the ground, the last pickup and photos of the yard and the worst spot. Quote your monthly price and put any first cleanup in the one-time setup charge. The setup charge is not counted in the fee."
    - objection: "Customers cancel after a month."
      answer: "The fee is one time, not monthly. If the homeowner cancels before you have spoken with them, the fee is refunded. After that the fee stands, because it pays for the introduction, not the account."
    - objection: "I won't work a yard with loose dogs."
      answer: "Most cards say whether the dogs are inside or out on pickup day. Gate codes are never on a card; the homeowner gives them on the call. If a card does not fit how you work, skip it and pay nothing."
    - objection: "I don't do HOA common areas or turf deodorizing."
      answer: "Dog waste pickup is one job type today, so you get every card in it. Quote the ones you want and skip the rest. A card you skip costs nothing."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town, photos and answers to the questions a scooper asks. Names and addresses go only to the business the homeowner picks."
    - objection: "Will you rank me against other scoopers?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, review links and notes. Ask Hava never sorts, rates or scores a business."
    - objection: "Is there a monthly fee or a contract?"
      answer: "No. Nothing to join and nothing per month. You pay only on a pick."
    - objection: "Do I need a license to sign up?"
      answer: "No state contractor license covers dog waste pickup, so none is asked for. Lake Havasu City has its own business license rule for businesses working inside city limits. Spraying a yard for fleas or ticks is pest work and needs a state pest license."
  quote_tips_for_card: ["Give a price per month and say how many visits and which day", "Put any first cleanup in the one-time setup charge", "Say whether bags go in the homeowner's cart or you haul them away", "Say your rule for dogs in the yard and gates on pickup day", "Say whether you disinfect tools and shoes between yards", "Give your earliest start date"]
