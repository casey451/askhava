# Ask Hava expert layer: pool_cleaning (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set pool_cleaning and trade_kb/trades/pool_cleaning.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Mapping. The category has three job types: "weekly pool service" and "chemical balancing" (recurring,
#   quoted monthly) and "green pool cleanup" (the only one-time job type, quoted firm). The kb's one-time
#   jobs therefore all map to "green pool cleanup", because it is the only one-time bucket:
#     one_time_clean (storm, party, move-in), filter_clean and drain_acid_wash -> "green pool cleanup", firm.
#   Mapping them to "weekly pool service" would force a monthly period on a one-time job (REC-010).
#   Suggest the catalog rename "green pool cleanup" to "one-time cleanup" or add "filter clean" and
#   "drain and refill" as one-time job types; a business that opted only into green pools would
#   otherwise get filter-clean and drain cards.
# - The independent scenario file maps one_time_clean to "chemical balancing" in pool_cleaning_s05 (a
#   one-time rebalance). "chemical balancing" is recurring in categories.yaml, so a one-time rebalance has
#   no firm-quoted home. Here a one-time rebalance is one_time_clean (firm). Open question for the catalog.
# - new_job_type chem_only covers "chemical balancing": the kb has no chemical-only job type, but
#   chemical-only routes (test and dose weekly, homeowner skims) are a common recurring product. [judgment]
# - Left out: tile_descale (calcium on the tile line, bead blasting). It is specialty surface work with a
#   site visit usually needed; pool_repair also left the matching kb job type (surface_tile) out, so the
#   intake has no route for tile scale or replaster. A homeowner who asks for it inside a drain request is
#   caught by fu_drain_scope and the answer goes on the card.
# - vacation_service maps to "weekly pool service" (monthly). A request to also check the house routes a
#   second card to home_watch "weekly house check" via fu_pool_only.
# - Fire-truck items seen in this trade: smoke or fire from stored pool chemicals and a gas smell at a pool
#   heater. Both are on the D-436 list; the code sends the 911 text and the cleaning card still goes out.
#   The kb's other safety steps (missing drain cover, shock in the water) are not used (D-436).
# - Licensing: cleaning and chemicals need no ROC class in the catalog ("Attorney may confirm"). Over-the-
#   counter chlorine needs no pest license (A.R.S. 3-3611(A)(5)). Any repair found on a visit is pool_repair.
schema: 1
