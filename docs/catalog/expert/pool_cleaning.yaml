business_side:
  how_they_get_customers: ["Neighbor referrals and word of mouth on the street they already service", "Buying accounts or whole routes from retiring techs", "Google Maps listing, search ads and Local Services Ads", "Local Facebook groups and Nextdoor [judgment]", "Realtors, property managers and rental hosts [judgment]", "Door hangers near current stops [judgment]"]
  customer_acquisition_benchmarks:
    - channel: "Pool service, all digital marketing (pool marketing firm, via a software vendor's 2026 survey recap)"
      figure: "About $255 per new customer, on about $1,000 to $1,500 a month in ad spend (vendor-reported, not audited)"
      source: skimmer_2026
      unverified: false
    - channel: "Buying an established route"
      figure: "About 6 to 12 times the monthly service value per account (vendor-reported)"
      source: skimmer_2026
      unverified: false
    - channel: "Google search ads, pool and spa"
      figure: "About $45 per lead (LocaliQ 2025, via a marketing vendor); one owner reported about $150 to win a recurring account"
      source: pipeline_pool
      unverified: false
    - channel: "Google search ads and Local Services Ads, pool service keywords"
      figure: "About $35 to $55 per lead on search ads; $22 to $75 per lead on Local Services Ads (marketing-vendor figures)"
      source: webtonic_pool_ads
      unverified: false
    - channel: "Lake Havasu City pool routes specifically"
      figure: "No local figures found; a small market where routes grow by neighbor referral may run below national vendor figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a lead that several other pool companies also bought", "Green-pool shoppers who take the cleanup and never sign up weekly", "Requests with no size, no photo and no word on chemicals", "Green pools that turn out to have a dead pump", "Monthly fees whether or not accounts come", "Tenants who say yes and then the landlord says no [judgment]"]
  what_makes_a_lead_worth_paying_for: ["A weekly account that stays for years, retention on maintenance accounts runs about 80 to 90 percent a year", "Size, spa, water photo and pad photo before the first call", "Chemicals in or out and the visit schedule already asked", "Debris and turnover visits stated, so the monthly price holds", "Pay only when picked, nothing monthly", "A stop near the rest of the route"]
  their_words: ["route", "stop", "account", "full service", "chem only", "green-to-clean", "brush and vac", "skim", "baskets", "backwash", "cartridge clean", "DE", "tabs", "shock", "CYA", "stabilizer", "TDS", "salt cell", "drain and acid wash", "start-up"]
  signup_objections:
    - objection: "Why would I pay for a weekly account?"
      answer: "You pay once, only when the homeowner picks your quote. A weekly account counts as 4 months of its monthly price and the fee never goes over $75. A $150 a month account pays $75 once. Buying an account on a route costs far more."
    - objection: "What do one-time cleanups cost me?"
      answer: "A green pool cleanup, filter clean or drain is a one-time job. The fee is set by your quote: $25 under $500, $75 from $500 to $1,500, $199 over $1,500. Nothing if you are not picked."
    - objection: "I can't price a green pool from a text."
      answer: "Most cards say how far down she can see, whether the pump runs and how the pool gets its chlorine, with a water photo. Quote a set price and say what it covers, such as chemicals and visits until clear."
    - objection: "Green-pool people never sign up for weekly."
      answer: "Every cleanup card says whether she wants regular service after. You can skip the ones that say once."
    - objection: "I don't have a contractor license. Can I join?"
      answer: "Yes. Cleaning and chemical cards need no contractor license. Repair cards go to the pool repair category, which has its own license rules."
    - objection: "I only do full service, not chem-only."
      answer: "You pick the job types you want at sign-up and can change them any time. You get cards only for those."
    - objection: "Will you rank me against other pool companies?"
      answer: "No. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "What if I quote and don't get the job?"
      answer: "Then you pay nothing. The fee is charged only when a homeowner picks your quote and you confirm."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Half these owners live out of state."
      answer: "The card says the months wanted and how you get in. Gate codes never go on the card; you get the owner's contact details once they pick you."
  quote_tips_for_card: ["State the price per month, or per visit with the visit schedule", "Say whether chemicals are included or billed extra", "Say how often the filter is cleaned and whether it is in the price", "For a green pool, say what the price covers and what would change it", "Give your earliest start date"]
