trade_brief:
  price_drivers:
    - driver: "Water condition now: clear, cloudy, green with the floor showing, or green with nothing showing"
      why: "Clear water is a route stop; a pool where the steps vanish takes heavy chemical loads, several visits and filter cleans, and sometimes a drain. [judgment]"
      source: null
    - driver: "Chemicals included in the monthly price or bought by the homeowner"
      why: "Chlorine, acid and salt are the biggest running cost on a summer route, so 'chemicals included' moves the monthly number more than anything but frequency. [judgment]"
      source: null
    - driver: "Visit schedule: weekly, every two weeks, or weekly plus extra visits (rental turnovers)"
      why: "Each extra stop is drive time and labor; a rental with two turnovers a week is close to triple a plain weekly account. [judgment]"
      source: null
    - driver: "Pool size and whether a spa is attached"
      why: "Gallons set the chemical dose; a spa is a second body of water to test, brush and balance, often heavily used. [judgment]"
      source: null
    - driver: "Debris load: palms, palo verde, mesquite and wind over the water"
      why: "Trees over the pool add skimming time and basket emptying every visit, and clog filters faster. [judgment]"
      source: null
    - driver: "Stabilizer, hardness or dissolved solids built up so far that only a partial drain fixes it"
      why: "Stabilizer from chlorine tablets can only be lowered by draining, and Havasu water starts near 19 grains of hardness and 753 ppm dissolved solids, so a rebalance can become a drain-and-refill quote."
      source: oha_cya
    - driver: "Filter type and condition: cartridge, DE or sand; when it was last cleaned"
      why: "A cartridge or DE teardown is a long stop; some routes include it quarterly and others bill it per clean. [judgment]"
      source: null
    - driver: "Whether the pump and filter are running"
      why: "A green pool with a dead pump cannot be cleared with chemicals alone; the cleanup waits on a repair or is quoted with that caveat. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Pump not running or not moving water, behind a green or cloudy pool"
      how_a_pro_spots_it: "Homeowner says it hums or hasn't run; no water movement at the returns in the photo; vacant home"
      question_or_photo: fu_pump_running
      source: null
    - condition: "Stabilizer very high after years of chlorine tablets, so chlorine stops working and a partial drain is the only way down"
      how_a_pro_spots_it: "Tablets in a floater or feeder for years, no drain in a long time, green that keeps coming back after shock"
      question_or_photo: fu_sanitizer
      source: oha_cya
    - condition: "Thick calcium scale on the tile line"
      how_a_pro_spots_it: "White or gray crust in the tile photo; city water near 19 grains per gallon; no drain in years"
      question_or_photo: p4
      source: lhc_ccr
    - condition: "Salt cell scaled with calcium, so chlorine output drops and the pool turns even with salt in it"
      how_a_pro_spots_it: "Check cell or inspect light on the display; low output setting cranked to the top"
      question_or_photo: p5
      source: hayward_turbocell
    - condition: "Filter packed with dirt or torn cartridges after a dust storm or a green cleanup"
      how_a_pro_spots_it: "High pressure reading or a dirty, flattened cartridge in the pad photo; storm in the last few days"
      question_or_photo: p3
      source: null
    - condition: "Cracked or missing main drain cover hidden under green water"
      how_a_pro_spots_it: "Cannot be seen until the water clears; the deep-end floor is not visible in the water photo"
      question_or_photo: p1
      source: null
    - condition: "Gate access: locked gate, lockbox, dogs in the yard, or HOA rules on service hours"
      how_a_pro_spots_it: "Out-of-state owner, rental, gated community; the card's access answer"
      question_or_photo: fu_access
      source: null
    - condition: "Extra visits between rental guests that a plain 'weekly' request leaves out"
      how_a_pro_spots_it: "Short-term rental named in her words; spa that guests use daily"
      question_or_photo: fu_extra_visits
      source: null
  misdiagnosis_checks:
    - sounds_like: "green pool cleanup"
      might_be: "pump_motor (pool_spa_repair): pump not running, so the pool turned"
      one_question: fu_pump_running
      if_other_route_to: {category: pool_repair, job_type: "pump repair"}
      source: null
    - sounds_like: "chemical balancing (salt pool with low chlorine)"
      might_be: "salt_system (pool_spa_repair): cell or control fault"
      one_question: fu_salt_light
      if_other_route_to: {category: pool_repair, job_type: "equipment replacement"}
      source: hayward_turbocell
    - sounds_like: "chemical balancing"
      might_be: "weekly_service (she also wants skimming, brushing and baskets)"
      one_question: fu_who_cleans
      if_other_route_to: {category: pool_cleaning, job_type: "weekly pool service"}
      source: null
    - sounds_like: "weekly pool service"
      might_be: "green_pool first (the water is green today)"
      one_question: water
      if_other_route_to: {category: pool_cleaning, job_type: "green pool cleanup"}
      source: null
    - sounds_like: "weekly pool service (seasonal owner)"
      might_be: "home watch for the whole house, a different category"
      one_question: fu_pool_only
      if_other_route_to: {category: home_watch, job_type: "weekly house check"}
      source: null
    - sounds_like: "green pool cleanup (filter clean)"
      might_be: "filter (pool_spa_repair): leaking or cracked tank, sand or DE blowing back"
      one_question: fu_filter_what
      if_other_route_to: {category: pool_repair, job_type: "filter repair"}
      source: null
    - sounds_like: "green pool cleanup (drain and acid wash)"
      might_be: "surface_tile (pool_spa_repair): new plaster or pebble finish, R-36 or B-5 work with no category today"
      one_question: fu_drain_scope
      if_other_route_to: {}
      source: aac_r4_9_103
  photo_reading:
    - photo_id: p1
      reads: ["Water color", "How deep you can see: floor, steps only, nothing", "Leaves or dirt on the floor", "Dark spots on the plaster", "Water level against the tile"]
      neutral_wording: "Water is green; the top step shows and the floor does not."
    - photo_id: p2
      reads: ["Size and shape", "Attached or raised spa", "Palms, palo verde or mesquite over the water", "Rock yard or desert plants blowing in", "Cover or screen enclosure"]
      neutral_wording: "Kidney-shaped pool with a raised spa; two palms on the north side lean over the water."
    - photo_id: p3
      reads: ["Filter type: cartridge tank, or DE or sand with a valve on top", "Pump and whether it looks wet or dead", "Salt cell, heater, timer or automation panel", "Pressure gauge reading"]
      neutral_wording: "Equipment pad with a pump, a tall cartridge filter tank and a salt cell on the return line."
    - photo_id: p4
      reads: ["White or gray crust on the tile line", "How thick and how far around", "Loose or missing tile"]
      neutral_wording: "White crust along the tile line, thicker on the west side."
    - photo_id: p5
      reads: ["Salt reading", "Check cell or inspect light", "Output setting"]
      neutral_wording: "Salt system display shows a check cell light and output set to the top."
  local_factors:
    - fact: "City water hardness averages about 19 grains per gallon and dissolved solids about 753 ppm"
      effect: "Tile lines and salt cells scale fast, and pools reach drain-and-refill sooner; pros price cell cleaning and tile work into Havasu routes"
      source: lhc_ccr
    - fact: "Lake Havasu City sets where pool water may go: own yard, an adjacent wash, or the sewer cleanout on the property at no more than 12 gallons per minute after a call 72 hours ahead; the street only as a last option, 8 p.m. to 6 a.m."
      effect: "A drain job is scheduled around the city call and a slow pump rate, often overnight; the business needs to know if there is a cleanout or a wash"
      source: lhc_pool_draining
    - fact: "Average highs are about 103 F in June, 108 F in July and 106 F in August"
      effect: "Chlorine burns off fast and algae grows in days, so weekly is the usual summer minimum and every-two-weeks accounts often turn [judgment]"
      source: azsp_weather
    - fact: "Monsoon runs June to September with sporadic afternoon storms and heavy winds"
      effect: "Dust storms dump dirt and leaves into pools and load filters; one-time storm cleanups spike [judgment]"
      source: azsp_weather
    - fact: "Phoenix-area pools lose about 10.8 inches to evaporation in June"
      effect: "Constant top-off concentrates hardness and dissolved solids; water-level complaints are common and often evaporation [judgment]"
      source: scottsdale_evap
    - fact: "Arizona requires a five foot barrier with self-closing, self-latching gates around a home pool unless every resident is six or older"
      effect: "Techs work through pool gates that must close behind them; access and gate answers matter on the card"
      source: ars_36_1681
    - fact: "Many homes are second homes or winter-visitor homes, and short-term rentals are common"
      effect: "Service-while-away and turnover-visit requests are common; pools found green on return [judgment]"
      source: null
    - fact: "Over-the-counter chlorine used to treat a pool needs no pest license, and no ROC class is listed for cleaning only"
      effect: "Many solo operators run routes with no contractor license; any repair they find goes to a pool repair card [judgment]"
      source: ars_3_3611
  seasonality:
    busy: "March to May (startups, snowbirds setting up service before they leave) and June to September (algae, monsoon cleanups) [judgment]"
    slow: "November to February; some accounts drop to every two weeks or chemical-only [judgment]"
    source: null

job_types:
  - id: weekly_service
    label: "Ongoing weekly or every-other-week service"
    bank_job_type: "weekly pool service"
    recurring: true
    homeowner_phrasings: ["need a pool guy weekly", "pool guy ghosted me", "someone to do my pool every week", "servicio semanal de alberca"]
    must_know:
      - fact: "Visit schedule, including any extra visits"
        bank_question: service
        follow_up: fu_extra_visits
        photo: null
        why_it_moves_price: "Weekly, every two weeks and weekly-plus-turnovers are three different monthly prices. [judgment]"
        skip_if: "Homeowner said plain weekly for her own home"
      - fact: "Chemicals included or not"
        bank_question: chemicals
        follow_up: null
        photo: null
        why_it_moves_price: "Chemicals are the largest running cost on a summer account. [judgment]"
        skip_if: "Answered"
      - fact: "Pool size, spa, and water now"
        bank_question: size_band
        follow_up: null
        photo: p1
        why_it_moves_price: "Gallons and a spa set the dose and the time per stop; green water means a cleanup first. [judgment]"
        skip_if: "Never; all three are bank questions"
      - fact: "Debris load from trees and palms"
        bank_question: null
        follow_up: fu_debris
        photo: p2
        why_it_moves_price: "Trees over the water add minutes every visit. [judgment]"
        skip_if: "Whole-pool photo sent"
      - fact: "Filter type and equipment on the pad"
        bank_question: null
        follow_up: null
        photo: p3
        why_it_moves_price: "Filter type sets how long a filter clean takes and whether it is in the monthly price. [judgment]"
        skip_if: "Homeowner named the filter"
    allowed_follow_ups:
      - id: fu_extra_visits
        ask_when: "Rental, vacation home or heavy use mentioned, or the homeowner said weekly with no other detail"
        text_en: "Besides the regular visit, will it need extra visits, like between rental guests?"
        text_es: "Además de la visita regular, ¿necesitará visitas extra, como entre huéspedes de renta?"
        options_en: ["No, just the regular visit", "Yes, between rental guests", "Yes, for another reason"]
        options_es: ["No, solo la visita regular", "Sí, entre huéspedes", "Sí, por otra razón"]
        card_field: true
        why: "Turnover visits change the monthly quote a lot and owners leave them out. [judgment]"
      - id: fu_debris
        ask_when: "No whole-pool photo and the homeowner did not mention trees"
        text_en: "Do trees, palms or bushes drop leaves or fronds into the pool?"
        text_es: "¿Hay árboles, palmas o arbustos que tiran hojas a la alberca?"
        options_en: ["Yes, right over the pool", "Yes, close by", "No"]
        options_es: ["Sí, encima de la alberca", "Sí, cerca", "No"]
        card_field: true
        why: "Debris is the time-per-stop number a route owner wants. [judgment]"
      - id: fu_sanitizer
        ask_when: "Homeowner did not say how the pool is chlorinated, or mentions tablets, a floater or water that keeps turning"
        text_en: "How does the pool get its chlorine now?"
        text_es: "¿Cómo recibe el cloro la alberca ahora?"
        options_en: ["Salt system", "Tablets in a floater or feeder", "Liquid or powder by hand", "Something else"]
        options_es: ["Sistema de sal", "Pastillas en flotador o dosificador", "Líquido o polvo a mano", "Otra cosa"]
        card_field: true
        why: "Sets the chemical plan and flags years of tablets, which build stabilizer that only draining lowers."
      - id: fu_pump_running
        ask_when: "Water is cloudy or green, the home was empty, or the homeowner mentions the pump"
        text_en: "Is the pool pump running each day right now?"
        text_es: "¿La bomba de la alberca está funcionando cada día ahora?"
        options_en: ["Yes, it runs every day", "It hums or runs but no water moves", "It isn't running"]
        options_es: ["Sí, funciona cada día", "Zumba o prende pero no mueve agua", "No está funcionando"]
        card_field: true
        why: "A cleaning quote assumes working equipment; a pump that does not run is a repair card too. [judgment]"
    photos_priority: [p1, p3, p2]
    urgency:
      fire_dept_triggers: ["Smoke or fire from stored pool chemicals", "Gas smell or hiss at a pool heater"]
      urgent_capable_triggers: ["Rental guests arriving within two days and the water is not clear"]
      regular: "Starting regular service"
    scope_line_en: "Weekly service with chemicals for a medium pool and attached spa; salt system; water clear today."
    scope_line_es: "Servicio semanal con químicos para una alberca mediana con spa; sistema de sal; el agua está clara hoy."
    quote_format: monthly
    business_fills: ["monthly price, or a per-visit price with the visit schedule", "chemicals included or extra", "what each visit covers and how often the filter is cleaned", "earliest start date"]
    card_template: |
      REQ-<id> | Weekly pool cleaning | <town>, <general area> | <house / rental / HOA community>
      <one scope line: schedule, size, spa, water now>
      Schedule: <weekly / every two weeks / plus extra visits>. Chemicals: <included / homeowner buys>. Chlorine from: <salt / tablets / liquid / other / not said>.
      Pool: <size band>, spa <yes / no>, water <clear / cloudy / green>. Trees or palms: <over the pool / close by / none / not said>. Pump: <runs daily / not running / not said>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Weekly service usually runs about one fifty a month.", "You should switch to a salt system.", "Every two weeks is fine in winter.", "Your last pool guy probably let it go.", "Keep the pump on twelve hours a day."]

  - id: vacation_service
    label: "Service while away, or a seasonal home"
    bank_job_type: "weekly pool service"
    recurring: true
    homeowner_phrasings: ["we're snowbirds, need someone for the pool while we're gone", "watch the pool April to October", "out of state owner", "pool service while I'm away"]
    must_know:
      - fact: "Which months, and when it starts"
        bank_question: null
        follow_up: fu_season
        photo: null
        why_it_moves_price: "A summer-only account is the hot, chemical-heavy months; a year-round one averages out. [judgment]"
        skip_if: "Homeowner gave the months"
      - fact: "How the business gets in"
        bank_question: null
        follow_up: fu_access
        photo: null
        why_it_moves_price: "No one on site means the business must have gate access and owns every visit. [judgment]"
        skip_if: "Homeowner described the gate"
      - fact: "Pool size, spa, water now, chemicals"
        bank_question: size_band
        follow_up: null
        photo: p1
        why_it_moves_price: "Same as any route account; green water on arrival is a cleanup first. [judgment]"
        skip_if: "Never; bank questions"
      - fact: "Pool only, or the house too"
        bank_question: null
        follow_up: fu_pool_only
        photo: null
        why_it_moves_price: "A house check is a separate home watch card, not part of the pool price. [judgment]"
        skip_if: "Homeowner said pool only"
    allowed_follow_ups:
      - id: fu_season
        ask_when: "Seasonal owner or 'while we're away' with no months given"
        text_en: "Which months do you want service?"
        text_es: "¿En qué meses quiere el servicio?"
        options_en: ["All year", "Only the months we are away", "Only the months we are here", "Just a few weeks"]
        options_es: ["Todo el año", "Solo los meses que no estamos", "Solo los meses que estamos aquí", "Solo unas semanas"]
        card_field: true
        why: "The season window is the whole quote for a seasonal account. [judgment]"
      - id: fu_access
        ask_when: "Owner is away, out of state, or a rental, and access was not described"
        text_en: "How will the business get to the pool?"
        text_es: "¿Cómo va a llegar el negocio a la alberca?"
        options_en: ["Through a gate with no lock", "Through a gate with a lock or lockbox", "Someone at the home lets them in"]
        options_es: ["Por una puerta sin llave", "Por una puerta con candado o caja de llave", "Alguien en la casa les abre"]
        card_field: true
        why: "Route techs plan stops around gates; no codes go on the card, only the kind of access. [judgment]"
      - id: fu_pool_only
        ask_when: "Owner is away for weeks or months"
        text_en: "Is this for the pool only, or should someone also check on the house while you're away?"
        text_es: "¿Es solo para la alberca, o también quiere que alguien revise la casa mientras no está?"
        options_en: ["Pool only", "Pool and house"]
        options_es: ["Solo la alberca", "La alberca y la casa"]
        card_field: true
        why: "A house check routes a second card to home watch. [judgment]"
      - fu_debris
    photos_priority: [p1, p3, p2]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: []
