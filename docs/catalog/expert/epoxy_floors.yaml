  signup_objections:
    - objection: "I can't quote a floor without testing it for moisture."
      answer: "You don't have to. Quote a low and high price and mark it 'to be confirmed on site'. Cards say what is on the floor now, any white powder or bubbling and when it shows up, and most come with photos."
    - objection: "Homeowners just want a price per square foot."
      answer: "The card gives size, prep facts and the finish she wants, so you can quote the job, not a number per foot. She sees each quote in your own words, including what it covers."
    - objection: "Will I be compared to a hardware-store kit?"
      answer: "No. Ask Hava shows only quotes from licensed businesses, in the order they came in. We never sort, rate or score a business."
    - objection: "I'm a painter with R-34. Do I get these?"
      answer: "Yes. Epoxy floor cards go to R-8 and R-34 holders, the matching dual classes and B or B-3 general contractors. You choose whether you want them at sign-up."
    - objection: "Why pay a fee when I get calls from my truck signs?"
      answer: "You pay only when the homeowner picks your quote and you confirm. Nothing to join and nothing per month. The fee is set by job size: $25, $75 or $199."
    - objection: "What is the concept picture? I don't want to be held to it."
      answer: "Some cards carry a picture an AI made from her written notes, never from her photos. It is labeled on the image and beside it: AI-generated, not exact, may not be feasible. Your quote says what you will do."
    - objection: "What if she cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Can a handyman get these jobs cheaper?"
      answer: "No. This job type goes only to licensed businesses. Handymen don't receive epoxy floor cards."
