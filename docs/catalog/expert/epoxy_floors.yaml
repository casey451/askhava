# Ask Hava expert layer: epoxy_floors (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set epoxy_floors and trade_kb/trades/flooring.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The kb_trade (flooring.yaml) has no epoxy or concrete-coating job type. The one entry here,
#   garage_floor_epoxy, is new_job_type: true, with the same id as painting.yaml's garage_floor_epoxy so it
#   matches scenarios/epoxy_floors.yaml. Its questions and photo cues come from painting.yaml's entry
#   (q1_where "Garage floor", q3_prep surface condition, q5_home_age, p4 "Garage floor surface for coatings").
# - Left out, all seven flooring.yaml job types: tile_install, lvp_laminate, hardwood, carpet_install,
#   floor_repair, old_floor_removal, shower_tile. No enabled category routes them (epoxy_floors has the one
#   job type "garage floor epoxy"). A flooring category would need its own expert file.
# - Photos: photos_priority may use only flooring.yaml ids, and none of them is a garage-floor photo. The
#   closest are p1 (each room, wide shot: read as the whole garage floor from the big door), p3 (close-up of
#   damage: cracks, peeling, stains, white powder) and p4 (edge of current floor at a doorway: shows whether
#   a coating or sealer layer is there). painting.yaml's p4 "Garage floor surface for coatings" is the true
#   fit. p4 is also not in the bank's photo list ([p1, p2, p3]); p2 (doorway transitions and stairs) is
#   room-oriented but does show the step at the house door. Suggest pointing this set at painting.yaml's
#   photos or adding a garage-floor photo to flooring.yaml.
# - The bank set asks size, cracks and finish only. It has no question for what is on the floor now (bare,
#   clear sealer, old coating, new concrete), oil stains, contents to move, or owner versus renter. The
#   first three ride on follow-ups here; only one may be asked per request, so a bank question
#   "What's on the floor now?" (the fu_floor_now wording) would lift every card. Owner versus renter has no
#   question at all: the card carries it only when she says it (scenario s07). Casey to decide.
# - Concrete crack repair (a sunk side or lip) and pool deck or patio coatings belong with pavers_hardscape,
#   which has no matching job type name (paver patio, walkway, irrigation install). Those misdiagnosis rows
#   use if_other_route_to: null and say so; scenarios s11 and s12 expect bank_job_type null for the same
#   reason. Suggest adding "concrete repair" and "pool deck coating" job types to pavers_hardscape.
# - A gas or rotten-egg smell in the garage (gas water heater, dryer line) is on the D-436 fire-truck list,
#   so it is the one fire_dept_trigger (scenario s10). A chemical smell from a fresh coating is not.
# - A fresh coating that stays tacky or bubbles is an urgent_capable fact only (scenario s09); the category
#   has after_hours_emergency: false, so no night routing follows from it.
# - Lead: EPA RRP covers paid work that disturbs paint in pre-1978 housing above 6 sq ft inside. Whether an
#   attached garage floor coat counts is not settled here [judgment]; the bank has no home-age question for
#   this set (painting.yaml has q5_home_age). Casey may want home age on painted-floor cards.
# - Hard water (about 19 grains per gallon, cited in plumbing_repair.yaml) is left out of local_factors: it
#   does not change how an epoxy job is scoped.
