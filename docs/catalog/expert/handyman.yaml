# Ask Hava expert layer: handyman (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set handyman and trade_kb/trades/handyman.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
# Ask Hava never rules on whether a job fits the handyman exemption. The card carries the facts (item count,
# materials, wiring, gas, permit-type work, size) so code routes it and each business decides whether it may quote.
#
# NOTES FOR REVIEW
# - pressure_wash_minor (kb) is left out: the pressure_washing category (firm quotes) owns that work, and no
#   handyman category job type fits it. Intake should route "pressure wash the patio" to pressure_washing.
# - Coarse mappings (the category has 5 job types; the kb has 10): mount_hang and furniture_assembly map to
#   "shelves" (the bank's "Shelves or mounting" answer); caulk_grout, fixture_swap_plugin and minor_repairs_list
#   map to "door repair" (weatherstrip and door sweeps, smart locks and doorbells sit at a door; doors are the
#   most common list item [judgment]). Tub caulk under "door repair" is a poor fit; Casey may want a
#   "caulk and small fixes" job type. A list's bank job type should follow its largest item; the schema allows one.
# - dryer_vent_reroute is new_job_type: the category routes "dryer vent reroute" and the kb has no match.
# - route_elsewhere covers permit-type work only (bank: "wall removal or any permit-type job"). Gas work,
#   hardwired smoke alarms and fire sprinklers are refused too; they are caught by fu_touches_utility,
#   fu_alarm_power and fu_dryer_fuel and routed by misdiagnosis_checks to plumbing_repair and electrical.
# - The bank set has no wiring, gas, water or AC question. fu_touches_utility (the kb's q2) carries most of the
#   routing weight here and is a candidate to promote into the bank set.
# - HB 2120 (2025) proposed raising the handyman limit to $3,500. azleg.gov still shows $1,000 in 32-1121 when
#   checked; bill status could not be read (the status page blocks automated reads). Recheck before launch.
schema: 1
category: handyman
question_set: handyman
kb_trade: handyman
as_of: "2026-10-29"
written_by: "Claude expert layer, Oct 29 2026. AI research, not legal advice."
sources:
  - id: ars_32_1121
