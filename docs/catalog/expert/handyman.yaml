trade_brief:
  price_drivers:
    - driver: "Number of items and whether they fit one visit"
      why: "Small jobs are priced by the trip and a minimum charge; three tasks in one visit cost far less each than three visits. The bank's count question and the details line set this. [judgment]"
      source: null
    - driver: "Whole-job size against the handyman limit: under $1,000 counting labor and materials, not split up"
      why: "It decides who may quote at all. An unlicensed handyman may take only a casual or minor job under $1,000 with no permit; bigger jobs go to licensed R-62 (to $5,000, no structural), R-61 (to $50,000) or B-3 holders in this category."
      source: ars_32_1121
    - driver: "Who supplies the materials"
      why: "Materials count toward the $1,000 total, and a homeowner with parts in hand gets a labor-only quote; an unaltered plug-in appliance is left out of the total."
      source: ars_32_1121
    - driver: "What the item hangs on or fastens to: drywall with studs, concrete block, tile, stucco, a fiberglass tub wall"
      why: "Block and tile need masonry bits and anchors; a fiberglass tub wall may have no backing at all; each changes time and hardware. [judgment]"
      source: null
    - driver: "Height and reach: over 8 ft, vaulted ceilings, above a fireplace or stairs, roof"
      why: "A tall ladder, a second person or a roof trip adds time and sometimes crew. [judgment]"
      source: null
    - driver: "Finish match on patches: wall texture and leftover paint"
      why: "A smooth patch with paint on hand is a short job; matching knockdown texture and buying paint adds a second trip for dry time. [judgment]"
      source: null
    - driver: "Damage behind the small repair (wet drywall, rotted fence post, stripped hinge screws)"
      why: "The item the homeowner names is often the symptom; what is behind it can double the time or push the job past the limit. [judgment]"
      source: null
    - driver: "Pre-1978 home where paint will be cut, sanded or scraped"
      why: "Paid work disturbing more than 6 sq ft of paint per room inside, or 20 sq ft outside, in a pre-1978 home needs an EPA-certified firm and lead-safe practices."
      source: epa_rrp
  hidden_conditions:
    - condition: "Wet, soft or stained drywall around a 'small hole' (water from a shower, pipe, roof or AC drip)"
      how_a_pro_spots_it: "Brown ring, bubbled paint or a swollen baseboard in the photo; the hole backs a bathroom or sits under an attic air handler"
      question_or_photo: fu_wall_wet
      source: null
    - condition: "Drywall damage bigger than patching, so it becomes new drywall work, which Lake Havasu City lists as needing a permit"
      how_a_pro_spots_it: "Damage larger than a dinner plate, sagging ceiling board, or a whole sheet in the photo"
      question_or_photo: fu_patch_size
      source: lhc_permits
    - condition: "Wiring, pipes or a duct in the wall where a TV, shelf or grab bar will be fastened"
      how_a_pro_spots_it: "Outlets, switches, a vent register or the dryer duct in the wide photo of the wall"
      question_or_photo: p2
      source: null
    - condition: "No solid backing for a heavy or load-bearing item (fiberglass tub insert, hollow block, tile over cement board)"
      how_a_pro_spots_it: "Molded one-piece tub wall or painted block in the wide photo; the homeowner says the stud finder reads nothing"
      question_or_photo: fu_mount_surface
      source: null
    - condition: "Fence post snapped or rotted at the base, footing cracked, or the wall is a retaining wall"
      how_a_pro_spots_it: "Panel leaning with a gap at the post base in the photo; ground higher on one side of a block wall; retaining walls over 2 ft 6 in with slope or 3 ft without need a city permit"
      question_or_photo: fu_fence_what
      source: lhc_permits
    - condition: "Hinge screws spinning in the frame, or a door that started rubbing with new wall or floor cracks nearby"
      how_a_pro_spots_it: "Gap at the top of the latch side and a hinge leaf pulled from the jamb in the photo; cracks near the frame"
      question_or_photo: fu_cracks_near
      source: null
    - condition: "The list grows on site ('while you're here') until the whole job reaches $1,000, or a second visit is really the same job"
      how_a_pro_spots_it: "Five or more items, a vacation home being readied, or the homeowner mentions more work later"
      question_or_photo: count
      source: ars_32_1121
    - condition: "Dryer vent run that is long, crushed, plastic foil, or ends in the attic or under the house"
      how_a_pro_spots_it: "Silver foil or white vinyl duct behind the dryer in the photo; vent exit the homeowner can't find; the code-cited limit is 35 ft less fittings, in metal duct"
      question_or_photo: fu_vent_exit
      source: doe_dryer_vent
  misdiagnosis_checks:
    - sounds_like: "drywall patch"
      might_be: "leak_slow (plumbing), water behind a wet or soft wall"
      one_question: fu_wall_wet
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "drywall patch (ceiling stain that grows)"
      might_be: "leak_repair (roofing), a roof leak in a monsoon storm"
      one_question: fu_stain_when
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "drywall patch (ceiling drips only while the AC runs)"
      might_be: "ac_leaking_water (hvac), a different category"
      one_question: fu_stain_when
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "drywall patch (large area, whole sheet, sagging ceiling)"
      might_be: "new_drywall (drywall), permit-type work in Lake Havasu City and licensed-only here"
      one_question: fu_patch_size
      if_other_route_to: {category: handyman, job_type: "wall removal or any permit-type job"}
      source: lhc_permits
    - sounds_like: "minor_repairs_list with a light, fan or outlet on it"
      might_be: "lighting_fan or outlet_switch (electrical), wiring work outside the handyman exemption's usual reach"
      one_question: fu_touches_utility
      if_other_route_to: {category: electrical, job_type: "light fixture"}
      source: null
    - sounds_like: "shelves (TV mount with cords hidden in the wall)"
      might_be: "outlet_switch (electrical), a new outlet behind the TV"
      one_question: fu_tv_power
      if_other_route_to: {category: electrical, job_type: "outlet repair"}
      source: null
    - sounds_like: "fixture_swap_plugin (chirping smoke alarm)"
      might_be: "smoke_alarm (electrical), a hardwired alarm, never handyman work"
      one_question: fu_alarm_power
      if_other_route_to: {category: electrical, job_type: "hardwired smoke alarm"}
      source: ars_32_1121
    - sounds_like: "dryer vent reroute or 'hook up my dryer'"
      might_be: "connector_valve (gas_lines), a gas dryer connection, never handyman work"
      one_question: fu_dryer_fuel
      if_other_route_to: {category: plumbing_repair, job_type: "gas line work"}
      source: ars_32_1121
  photo_reading:
    - photo_id: p1
      reads: ["Hole size against a tape measure", "Brown ring, bubbled paint, swollen baseboard", "Hinge leaf pulled from the jamb, gap at the latch side", "Post base, footing, leaning panel", "Wall texture (smooth, orange peel, knockdown)", "Yellow gas connector or wires behind a fixture"]
      neutral_wording: "Hole about 4 inches across at doorknob height; textured wall painted beige; no stain around it."
    - photo_id: p2
      reads: ["Wall material (drywall, painted block, tile, stucco, fiberglass tub wall)", "Outlets, switches, vents or ducts near the spot", "Ceiling height and what is below (fireplace, stairs, washer)", "Room size for furniture builds"]
      neutral_wording: "Hall wall is painted drywall, an outlet about 2 feet left of the spot, standard ceiling."
    - photo_id: p3
      reads: ["TV size and mount type (fixed, tilt, full motion)", "Shelf or mirror weight on the box", "Smoke alarm label (battery only or wired connector)", "Doorbell or lock model and power type", "Number of furniture boxes"]
      neutral_wording: "Box label shows a full-motion TV mount rated for 55 to 75 inch TVs."
  local_factors:
    - fact: "The handyman exemption covers a whole job under $1,000 with no permit, never gas or fire-safety work"
      effect: "Every card must make the item count, materials, wiring and gas facts plain so code can route it and each business can decide if it may quote"
      source: ars_32_1121
    - fact: "Lake Havasu City lists minor drywall hole patching, minor non-structural repairs and privacy walls up to 6 ft as no-permit work, and drywall beyond patching, wall removal, window size changes and patio covers as permit work"
      effect: "Patch size and what the homeowner really wants built decide whether the job can stay with a handyman"
      source: lhc_permits
    - fact: "Average summer highs are about 105F to 109F from June to August"
      effect: "Fence, gate and exterior work is done early in the morning; businesses may quote later start dates in July [judgment]"
      source: lhc_climate
    - fact: "Many Havasu homes have painted concrete block walls inside and out, and block yard walls"
      effect: "Mounting on block needs masonry bits and anchors; a stud finder reads nothing; pros ask what the wall is [judgment]"
      source: null
    - fact: "Altering a manufactured home or an add-on attached to it needs an Arizona Department of Housing licensed installer"
      effect: "The card names a manufactured home so businesses can tell what they may take on"
      source: ars_41_4047
    - fact: "Pool enclosure gates must self-close and self-latch with the latch at least 54 in up, with some exceptions"
      effect: "A gate on a pool fence is quoted with that hardware in mind; the card says whether the gate is part of the pool enclosure"
      source: ars_36_1681
    - fact: "Winter visitors and vacation rentals bring 'get the house ready' lists in the fall, and empty homes hide damage until the owner returns"
      effect: "Lists run long, with a fixed arrival date; the card should carry the date and whether the home is empty [judgment]"
      source: null
    - fact: "Many homes date from the 1960s and 1970s"
      effect: "Pre-1978 paint matters when a patch or repair cuts or sands paint over the EPA small-area limits [judgment]"
      source: null
  seasonality:
    busy: "October to early December (winter visitors and holiday guests) and February to April (spring listings and move-outs); fence and gate calls after summer monsoon wind [judgment]"
    slow: "Late June to August for outdoor work in the heat [judgment]"
    source: null

job_types:
  - id: minor_repairs_list
    label: "Honey-do list of small fixes"
    bank_job_type: "door repair"
    recurring: false
    homeowner_phrasings: ["need a handyman for some stuff", "honey-do list", "a few small things", "get the house ready before visitors", "necesito alguien para varias cositas"]
    must_know:
      - fact: "Each item on the list, itemized, with how many of each"
        bank_question: count
        follow_up: null
        photo: p1
        why_it_moves_price: "Businesses price a list item by item and add one trip; a lumped 'general repairs' line can't be quoted. [judgment]"
        skip_if: "Homeowner sent a numbered list"
      - fact: "Whether any item touches wiring, gas, water pipes or the AC"
        bank_question: null
        follow_up: fu_touches_utility
        photo: p1
        why_it_moves_price: "Gas is never handyman work and a wired light or a faucet is another trade's job; that item may go on its own card. [src:ars_32_1121]"
        skip_if: "Homeowner already said none of it does, and no photo shows wires or a gas line"
      - fact: "Who supplies the materials"
        bank_question: materials
        follow_up: null
        photo: p3
        why_it_moves_price: "Materials count toward the $1,000 handyman total and turn a labor quote into a parts-and-labor quote. [src:ars_32_1121]"
        skip_if: "Answered"
      - fact: "Any spot on the list that is stained, soft, bubbled or damp"
        bank_question: null
        follow_up: fu_stain_or_soft
        photo: p1
        why_it_moves_price: "A wet or soft spot is often another trade's job first and changes the visit. [judgment]"
        skip_if: "Photos show every item clean and dry"
      - fact: "Anything high up (over 8 ft, vaulted) or outside"
        bank_question: null
        follow_up: fu_height
        photo: p2
        why_it_moves_price: "Ladder work and outdoor work in the heat add time. [judgment]"
        skip_if: "Homeowner said all indoors at normal height"
    allowed_follow_ups:
      - id: fu_touches_utility
        ask_when: "Any list or request where the homeowner has not said whether wiring, gas, water or AC is involved"
        text_en: "Does any of it touch wiring, gas, water pipes or the AC?"
        text_es: "¿Algo de esto tiene que ver con cables eléctricos, gas, tubería de agua o el aire acondicionado?"
        options_en: ["None of it", "Wiring (lights, fans, outlets)", "Gas", "Water pipes or fixtures", "AC or vents"]
        options_es: ["Nada de eso", "Cables (lámparas, ventiladores, contactos)", "Gas", "Tubería o llaves de agua", "Aire acondicionado o ductos"]
        card_field: true
        why: "Gas and hardwired smoke alarms are never handyman work; wiring and plumbing items go to licensed trades. This one question does most of the routing for a list. [src:ars_32_1121]"
      - id: fu_stain_or_soft
        ask_when: "A list of three or more items, or any wall, ceiling or floor repair, with no photo of the spot"
        text_en: "Is any spot on your list stained, soft, bubbled or damp?"
        text_es: "¿Alguna parte de su lista está manchada, blanda, con burbujas o húmeda?"
        options_en: ["No", "Yes, a wall", "Yes, a ceiling", "Yes, a floor or baseboard"]
        options_es: ["No", "Sí, una pared", "Sí, el techo", "Sí, el piso o el zoclo"]
        card_field: true
        why: "Surfaces a hidden water problem that a homeowner lists as 'patch while he's here'. [judgment]"
      - id: fu_home_age
        ask_when: "Work will cut, sand or scrape paint, drywall or ceiling texture, or the home may be manufactured"
        text_en: "About when was the home built?"
        text_es: "¿Más o menos cuándo se construyó la casa?"
        options_en: ["1978 or later", "Before 1978", "Manufactured or mobile home"]
        options_es: ["1978 o después", "Antes de 1978", "Casa manufacturada o móvil"]
        card_field: true
        why: "Pre-1978 paint brings EPA lead-safe rules for larger paint disturbance; manufactured homes have their own installer license for alterations. [src:epa_rrp] [src:ars_41_4047]"
      - fu_height
    photos_priority: [p1, p2, p3]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["An outside door won't close or lock", "A fixed date guests or renters arrive"]
      regular: "Any list with no door or lock problem"
    scope_line_en: "Three small tasks: hang 2 shelves on drywall, fix a sticking bedroom door, recaulk the tub; homeowner has the parts."
    scope_line_es: "Tres trabajos chicos: colgar 2 repisas en tablaroca, arreglar una puerta de recámara que se atora, volver a sellar la tina; el dueño tiene las piezas."
    quote_format: range
    business_fills: ["low and high price for the whole list, labor and materials", "what the price includes", "earliest day"]
    card_template: |
      REQ-<id> | Handyman | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: item count, then each item in a few words>
      Items: <numbered list, one line each>. Materials: <on hand / business supplies / some>.
      Touches wiring, gas, water or AC: <none / which item and what, in her words>. Stained or soft spots: <none / where>.
      Height or outside: <normal / tall ladder / outside>. Home built: <1978 or later / before 1978 / manufactured / not said>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That's all handyman work.", "One guy can do all of that in a morning.", "That list should come in under a thousand.", "The ceiling fan needs an electrician."]

  - id: mount_hang
    label: "Mount or hang (TV, shelves, mirrors, art, curtain rods, grab bars)"
    bank_job_type: "shelves"
    recurring: false
    homeowner_phrasings: ["mount my TV", "hang some shelves", "put up a heavy mirror", "grab bars in the tub", "curtain rods", "colgar la tele"]
    must_know:
      - fact: "What it hangs on: drywall, block, tile, stucco or a fiberglass tub wall"
        bank_question: null
        follow_up: fu_mount_surface
        photo: p2
        why_it_moves_price: "Each surface takes different bits, anchors and time; a fiberglass tub wall may have no backing. [judgment]"
        skip_if: "Wide photo shows the wall plainly"
      - fact: "How heavy or load-bearing the biggest item is (large TV, loaded book shelves, grab bars)"
        bank_question: null
        follow_up: fu_mount_load
        photo: p3
        why_it_moves_price: "Heavy and load-bearing items need studs, blocking or masonry anchors and more time. [judgment]"
        skip_if: "Box label photo shows size and weight"
      - fact: "For a TV, whether cords go inside the wall"
        bank_question: null
        follow_up: fu_tv_power
        photo: p2
        why_it_moves_price: "Cords in a cover are handyman work; a new outlet behind the TV is electrical work. [judgment]"
        skip_if: "Not a TV"
      - fact: "Height and what is below (above a fireplace, over stairs, vaulted ceiling)"
        bank_question: null
        follow_up: fu_height
        photo: p2
        why_it_moves_price: "Above a fireplace or over stairs means a tall ladder, a second person and harder stud access. [judgment]"
        skip_if: "Photo shows a normal wall at normal height"
      - fact: "How many items and whether the hardware is on hand"
        bank_question: materials
        follow_up: null
        photo: p3
        why_it_moves_price: "Supplied mounts and anchors add parts cost; count sets the hours. [judgment]"
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_mount_surface
        ask_when: "Anything is being mounted or hung and no wide photo of the wall was sent"
        text_en: "What will it hang on?"
        text_es: "¿En qué se va a colgar?"
        options_en: ["Drywall", "Painted block or brick", "Tile", "Stucco outside", "Fiberglass tub or shower wall"]
        options_es: ["Tablaroca", "Block o ladrillo pintado", "Azulejo", "Estuco por fuera", "Pared de tina o regadera de fibra de vidrio"]
        card_field: true
        why: "The surface sets the hardware and the time more than the item does. [judgment]"
      - id: fu_mount_load
        ask_when: "Homeowner names shelves, a TV or bars but not size or load"
        text_en: "Which is the biggest thing going up?"
        text_es: "¿Qué es lo más grande que se va a colgar?"
        options_en: ["TV over 55 inches", "Shelves for books or heavy things", "Grab bars", "Light things like art, mirrors or curtain rods"]
        options_es: ["Tele de más de 55 pulgadas", "Repisas para libros o cosas pesadas", "Barras de apoyo", "Cosas ligeras como cuadros, espejos o barras de cortina"]
        card_field: true
        why: "Load decides the anchor method and whether a stud or blocking is needed. [judgment]"
