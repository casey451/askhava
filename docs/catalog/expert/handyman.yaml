      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a lead that three other handymen also bought", "Leads that never answer the phone", "Monthly fees whether or not work comes", "Platforms taking a cut of the job price", "Driving out to look at a 'small job' that turns into a remodel they can't legally take", "Homeowners who want an exact price for 'some stuff' with no list"]
  what_makes_a_lead_worth_paying_for: ["An itemized list with a photo of each item", "Whether parts are on hand", "Wall type and height stated, so they bring the right anchors and ladder", "Wiring, gas and permit-type items flagged before they quote", "Paid only when picked, with no cut of the job", "A real date, like guests arriving December 1"]
  their_words: ["punch list", "honey-do", "trip charge", "minimum", "half day", "mud and tape", "knockdown", "orange peel", "toggle bolt", "Tapcon", "stud", "shim", "strike plate", "door sweep", "threshold", "picket", "post and rail", "gate latch", "transition duct", "not a licensed contractor"]
  signup_objections:
    - objection: "I don't have a contractor's license. Can I still join?"
      answer: "Yes, for handyman jobs. You need a Lake Havasu City business license we can match on the city's list. Every quote you send shows the line 'Not a licensed contractor. Only for jobs under $1,000 total with no permit.'"
    - objection: "What happens if the job turns out bigger than $1,000?"
      answer: "A handyman quote has to be the full job price under $1,000, labor and materials together. The quote form won't take one at $1,000 or more. Licensed businesses in this category can still quote the bigger job."
    - objection: "Why pay $25 when I get plenty of work by word of mouth?"
      answer: "Keep your word of mouth. This is extra work you choose. You pay only when a homeowner picks your quote: $25 when the job is under $500, $75 from $500 up. There is nothing to join and nothing monthly, and no share of the job."
    - objection: "I don't want to drive out for a five-minute job."
      answer: "You see the item count, the photos and whether parts are on hand before you quote. Quote what makes the trip worth it, or skip the card. You choose your job types at sign-up and can change them any time."
    - objection: "Can I quote by the hour?"
      answer: "Yes. Give your rate and how many hours you expect. It shows as a price range, and for a handyman quote the top of that range must stay under $1,000."
    - objection: "What is the box I have to tick on every quote?"
      answer: "You confirm the price is for the whole job, under $1,000, with no permit and no gas, smoke-alarm or sprinkler work. It sits on the same screen as your price."
    - objection: "The same homeowner wants me back next week. Is that a problem?"
      answer: "Repeat work is welcome. A second quote at the same address within 30 days is blocked only when it shares a job type with the first or the two together reach $1,000, so one job can't be split into two."
    - objection: "Will you rank me against other handymen?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "Do I need insurance?"
      answer: "No. If you have it, you can show it on your quotes, and some homeowners look for it."
    - objection: "I hold an R-62 or B-3 license. Do I get these cards?"
      answer: "Yes. Your license covers the handyman job types up to its own project limit, and your quotes aren't held to the $1,000 handyman limit."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
  quote_tips_for_card: ["Say whether the range includes materials", "If you work without a license, keep the top of the range under $1,000 for the whole list", "Say if you will do every item on the list in one visit", "If a wired light, faucet or gas item is on the list, quote only the items you can take and say which", "Give your earliest day, and say if heat pushes outdoor work to mornings", "If you need a photo of the wall or the post base, say so"]
