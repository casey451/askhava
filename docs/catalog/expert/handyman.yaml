    title: "[S2] A.A.C. R4-9-103 Residential contractor classifications: R-62 Minor Home Improvements (projects $5,000 or less, no structural work), R-61 Carpentry, Remodeling and Repairs ($50,000 or less), B-3 General Remodeling and Repair; all must subcontract electrical, plumbing, AC and boilers; R-14 Fencing; R-10 Drywall; R-7 Carpentry"
    url: "https://www.law.cornell.edu/regulations/arizona/Ariz-Admin-Code-SS-R4-9-103"
