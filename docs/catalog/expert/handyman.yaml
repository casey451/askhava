    kind: regulator
  - id: ars_41_4047
    title: "[T-ars_41_4047] A.R.S. 41-4047 Unlawful acts: installing manufactured homes or accessory structures, or altering manufactured homes, without a Department of Housing license"
    url: "https://www.azleg.gov/ars/41/04047.htm"
