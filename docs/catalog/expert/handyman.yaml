        options_en: ["Boards or pickets", "Gate or latch", "A post or a whole section is down", "Block wall cracked or leaning", "Retaining wall (dirt higher on one side)", "Screens or house numbers"]
        options_es: ["Tablas", "Puerta o pasador", "Un poste o una sección completa se cayó", "Barda de block agrietada o inclinada", "Muro de contención (tierra más alta de un lado)", "Mallas o números de la casa"]
        card_field: true
        why: "Separates a board swap from post and footing work and from retaining-wall permit work. [src:lhc_permits]"
      - id: fu_fence_length
        ask_when: "Fence or wall damage beyond a gate or latch"
        text_en: "About how long is the damaged part?"
        text_es: "¿Más o menos qué tan larga es la parte dañada?"
        options_en: ["One board or the gate only", "Up to 8 feet", "8 to 20 feet", "More than 20 feet"]
        options_es: ["Una tabla o solo la puerta", "Hasta 8 pies", "De 8 a 20 pies", "Más de 20 pies"]
        card_field: true
        why: "Length is the first number a fence estimator writes down. [judgment]"
      - id: fu_fence_shared
        ask_when: "Fence or wall on a property line"
        text_en: "Is the fence or wall shared with a neighbor or an HOA?"
        text_es: "¿La cerca o barda es compartida con un vecino o con la asociación (HOA)?"
        options_en: ["Shared with a neighbor", "HOA wall", "Ours only"]
        options_es: ["Compartida con un vecino", "Barda de la asociación", "Solo nuestra"]
        card_field: true
        why: "Who approves and who pays can change scope before work starts. [judgment]"
      - id: fu_pool_gate
        ask_when: "Gate or fence repair at a home with a pool"
        text_en: "Is this gate or fence part of the fence around the pool?"
        text_es: "¿Esta puerta o cerca es parte de la cerca alrededor de la alberca?"
        options_en: ["Yes", "No"]
        options_es: ["Sí", "No"]
        card_field: true
        why: "Pool enclosure gates take specific self-closing and latch hardware. [src:ars_36_1681]"
    photos_priority: [p1, p2]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Fence or gate open and a pet can get out", "Pool enclosure gate won't close"]
      regular: "Loose boards, screens, house numbers"
    scope_line_en: "About 12 ft of wood fence down after wind, end post snapped at the base; side gate drags and latch bent."
    scope_line_es: "Unos 12 pies de cerca de madera caídos por el viento, el poste de la orilla quebrado en la base; la puerta del lado arrastra y el pasador está doblado."
    quote_format: range
    business_fills: ["low and high price, labor and materials", "what is included (post, concrete, haul-away)", "earliest day"]
    card_template: |
      REQ-<id> | Handyman | <town>, <general area> | <kind of place>
      <one scope line: what is damaged, how long, what it is made of>
      Damaged: <boards / gate or latch / post or section / block wall / retaining wall / screens>. Length: <one board / up to 8 ft / 8 to 20 ft / over 20 ft>.
      Shared: <neighbor / HOA / ours only>. Pool enclosure: <yes / no / no pool>. Materials: <on hand / business supplies>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["You'll need a permit for that.", "Your neighbor has to pay half.", "Just a few boards, that's easy.", "The wind did that because the posts rotted."]

  - id: dryer_vent_reroute
    new_job_type: true
    label: "Reroute or replace a dryer vent duct"
    bank_job_type: "dryer vent reroute"
    recurring: false
    homeowner_phrasings: ["move my dryer vent", "dryer vent hose is crushed", "vent comes out in the garage", "new laundry spot needs a vent", "mover ducto de secadora"]
    must_know:
      - fact: "What is wanted: move or reroute, replace a crushed or torn duct, or only clean it"
        bank_question: what
        follow_up: fu_vent_what
        photo: p1
        why_it_moves_price: "A reroute is a carpentry and duct job; cleaning only belongs to the dryer vent cleaning category; slow drying may be the dryer itself. [judgment]"
        skip_if: "Homeowner's words say which"
      - fact: "Gas or electric dryer"
        bank_question: null
        follow_up: fu_dryer_fuel
        photo: p1
        why_it_moves_price: "Moving a gas dryer to reach the vent can mean disconnecting the gas connector, which is never handyman work. [src:ars_32_1121]"
        skip_if: "Photo shows only an electric cord and outlet"
      - fact: "Where the vent leaves the house now and how long the run is"
        bank_question: null
        follow_up: fu_vent_exit
        photo: p2
        why_it_moves_price: "Roof and under-house exits mean more access work; the code-cited limit is 35 ft less bends, in metal duct. [src:doe_dryer_vent]"
        skip_if: "Wide photo shows the duct path"
      - fact: "One story or two, and roof access"
        bank_question: null
        follow_up: fu_height
        photo: null
        why_it_moves_price: "A roof termination on a two-story home needs roof work and a tall ladder. [judgment]"
        skip_if: "Side-wall exit on one story"
    allowed_follow_ups:
      - id: fu_vent_what
        ask_when: "Homeowner mentions a dryer vent without saying what work is wanted"
        text_en: "What do you need done with the dryer vent?"
        text_es: "¿Qué necesita que se haga con el ducto de la secadora?"
        options_en: ["Move or reroute it", "Replace a crushed or torn duct", "Clean it out only", "Dryer takes too long to dry"]
        options_es: ["Moverlo o cambiar la ruta", "Cambiar un ducto aplastado o roto", "Solo limpiarlo", "La secadora tarda mucho en secar"]
        card_field: true
        why: "Cleaning goes to dryer vent cleaning and slow drying alone may be an appliance repair; only rerouting and replacing stay here. [judgment]"
      - id: fu_dryer_fuel
        ask_when: "Any dryer vent or dryer hookup request where the dryer type is not known"
        text_en: "Is the dryer gas or electric?"
        text_es: "¿La secadora es de gas o eléctrica?"
        options_en: ["Electric", "Gas"]
        options_es: ["Eléctrica", "De gas"]
        card_field: true
        why: "Work that connects to gas or propane is never handyman work. [src:ars_32_1121]"
      - id: fu_vent_exit
        ask_when: "Reroute or replacement and no photo of the duct path"
        text_en: "Where does the vent leave the house now?"
        text_es: "¿Por dónde sale el ducto de la casa ahora?"
        options_en: ["Side wall", "Roof", "Under the house", "Into the garage or attic", "Can't find where it goes"]
        options_es: ["Pared de lado", "Techo", "Por debajo de la casa", "A la cochera o al ático", "No encuentro por dónde sale"]
        card_field: true
        why: "The exit and the run length set the access work and parts. [src:doe_dryer_vent]"
      - fu_height
    photos_priority: [p1, p2]
    urgency:
      fire_dept_triggers: ["Burning smell or smoke at the dryer", "Gas smell or hiss near the dryer"]
      urgent_capable_triggers: []
      regular: "Planned reroute or duct replacement"
    scope_line_en: "Reroute the dryer vent from the laundry closet to the side wall; electric dryer; current duct is crushed behind the dryer."
    scope_line_es: "Cambiar la ruta del ducto de la secadora del clóset de lavado a la pared de lado; secadora eléctrica; el ducto actual está aplastado detrás."
    quote_format: range
    business_fills: ["low and high price, labor and duct", "what is included (wall cap, cleaning the old run)", "earliest day"]
    card_template: |
      REQ-<id> | Handyman | <town>, <general area> | <kind of place>
      <one scope line: what is wanted, where the vent runs now>
      Wanted: <reroute / replace duct / clean only / slow drying>. Dryer: <electric / gas>. Exits now: <side wall / roof / under house / garage or attic / not found>.
      Stories: <one / two>. Duct in sight: <neutral, from photo>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That foil duct is a fire hazard.", "Your vent is too long.", "Any handyman can move a gas dryer.", "Vent reroutes run a couple hundred."]

  - id: route_elsewhere
    label: "Sounds like handyman but is permit-type work (wall removal, new drywall, window size change, patio cover)"
    bank_job_type: "wall removal or any permit-type job"
    recurring: false
    homeowner_phrasings: ["knock out a wall, small job", "drywall the garage", "make the window bigger", "build a patio cover", "frame a closet"]
    must_know:
      - fact: "What is being built, removed or changed, in her words"
        bank_question: details
        follow_up: fu_permit_work
        photo: p2
        why_it_moves_price: "Wall removal, new drywall, window size changes and patio covers need a Lake Havasu City permit, so the handyman exemption does not apply and only licensed businesses quote. [src:lhc_permits] [src:ars_32_1121]"
        skip_if: "Homeowner named the work plainly"
      - fact: "What is in or on the wall or area (switches, outlets, vents, pipes)"
        bank_question: null
        follow_up: fu_touches_utility
        photo: p2
        why_it_moves_price: "Electrical, plumbing and AC in the way are subcontracted by B-3, R-61 and R-62 holders and add to the job. [src:aac_r4_9_103]"
        skip_if: "Photo shows a bare wall"
      - fact: "Home age or manufactured home"
        bank_question: null
        follow_up: fu_home_age
        photo: null
        why_it_moves_price: "Pre-1978 paint over the EPA limits needs a certified firm; altering a manufactured home needs a Department of Housing installer. [src:epa_rrp] [src:ars_41_4047]"
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_permit_work
        ask_when: "The request mentions walls, framing, new drywall, windows or a cover, and the work is not clear"
        text_en: "Does the job include any of these?"
        text_es: "¿El trabajo incluye alguna de estas cosas?"
        options_en: ["Taking out or adding a wall", "New drywall sheets, not just patching", "Making a window bigger or smaller", "A patio cover or carport", "None of these"]
        options_es: ["Quitar o poner una pared", "Tablaroca nueva, no solo parches", "Hacer una ventana más grande o más chica", "Un techo de patio o cochera", "Ninguna"]
        card_field: true
        why: "Each is on Lake Havasu City's permit-required list. [src:lhc_permits]"
      - fu_touches_utility
      - fu_home_age
    photos_priority: [p2, p1]
    urgency:
      fire_dept_triggers: ["Gas smell or hiss", "Sparking or burning smell at an outlet or panel"]
      urgent_capable_triggers: []
      regular: "All permit-type requests"
    scope_line_en: "Remove an interior wall about 10 ft long between kitchen and living room; switch, outlet and a ceiling vent on or near it."
    scope_line_es: "Quitar una pared interior de unos 10 pies entre la cocina y la sala; hay un apagador, un contacto y una rejilla en el techo cerca."
    quote_format: range
    business_fills: ["low and high price, or a visit to measure", "whether the permit is included", "earliest day"]
    card_template: |
      REQ-<id> | Handyman (licensed only: permit-type work) | <town>, <general area> | <kind of place>
      <one scope line: what is built, removed or changed, size>
      Work: <wall / new drywall / window size / patio cover / other, in her words>. In or on it: <switches, outlets, vents, pipes, or none seen>.
      Home built: <1978 or later / before 1978 / manufactured / not said>. Homeowner's own claims: <for example "not load bearing", marked as hers>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That wall isn't load bearing.", "You'll need a permit and an engineer.", "A handyman can't do that.", "Taking out a wall runs a few thousand."]

business_side:
  how_they_get_customers: ["Word of mouth, neighbors and repeat customers", "Local Facebook groups and Nextdoor posts [judgment]", "Google Maps listing and reviews", "Thumbtack, Angi and TaskRabbit", "Realtors and property managers sending punch lists [judgment]"]
