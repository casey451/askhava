  what_they_dislike_about_lead_services: ["Paying for a lead that 4 other plumbers also bought", "Fake or test leads and wrong numbers", "Monthly fees whether or not jobs come", "Homeowners who only want a price over the phone", "Being ranked or reviewed by the lead site itself"]
  what_makes_a_lead_worth_paying_for: ["Photos and a clear scope before the first call", "The homeowner already picked them, so no bidding war on the phone", "Pay only on the pick, nothing monthly", "Town and timing stated", "Water on or off stated, so they know whether to roll a truck now"]
  their_words: ["service call", "trip charge", "diagnostic", "angle stop", "supply line", "P-trap", "cleanout", "cable", "jetter", "camera", "re-pipe", "rough-in", "trim-out", "PRV"]
  signup_objections:
    - objection: "Why pay $25 when the other sites send me leads for free?"
      answer: "They don't. Shared-lead sites charge per lead, and four other plumbers get the same one. Here you pay only when the homeowner picks your quote, and nobody else gets that job. There is nothing to join and nothing monthly."
    - objection: "I don't want to quote without seeing it."
      answer: "You don't have to. Quote a visit fee and say what it covers. Most cards come with photos, where the water shows and whether it is shut off, so you can decide whether to roll a truck."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town, photos and answers to the questions a plumber asks. Names and addresses are shared only with the business the homeowner picks."
    - objection: "What if I quote and don't get the job?"
      answer: "Then you pay nothing. The introduction fee is charged only when a homeowner picks your quote and you confirm."
    - objection: "Will you rank me against other plumbers?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license numbers and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "I only do service work, not re-pipes."
      answer: "You pick the job types you want at sign-up and change them any time. You get cards only for those."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
  quote_tips_for_card: ["Say what the visit fee covers and whether it comes off the repair", "Give your earliest arrival", "If you need a photo of something else, say which", "State whether you handle water heaters and gas lines, since those cards go only to licensed plumbers"]
