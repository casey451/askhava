trade_brief:
  price_drivers:
    - driver: "Is water running or sewage rising right now (same-day or after-hours call) or can it wait"
      why: "Emergency and after-hours calls carry a higher visit rate; the bank's shut_off question and the timing answer settle this. [judgment]"
      source: null
    - driver: "Where the fault is: reachable (under a sink, at a toilet) or hidden (wall, slab, yard line)"
      why: "A hidden leak needs finding first and may add concrete, drywall or digging; a reachable one is a parts-and-labor visit. [judgment]"
      source: null
    - driver: "One fixture or many"
      why: "Several drains backing up points at the main line (camera, jetter, possible excavation) rather than a single trap. [judgment]"
      source: null
    - driver: "Pipe material in sight: gray flexible plastic (polybutylene), galvanized steel, Kitec, copper, PEX"
      why: "Polybutylene and galvanized change the repair method and often turn a leak into a re-pipe conversation; the pro reads this off a photo. [judgment]"
      source: null
    - driver: "Slab, crawl space or manufactured home"
      why: "Access under the floor sets labor hours; manufactured homes have their own alteration rules. [judgment]"
      source: null
    - driver: "Whether the homeowner already has the part or fixture"
      why: "A like-for-like swap with the new part on site is a firm quote; sourcing a part is not. [judgment]"
      source: null
    - driver: "Permit-type work (add or move a fixture, re-pipe) versus replace in place"
      why: "Lake Havasu City requires a permit for added or relocated fixtures and re-pipes, not for replacing an existing fixture."
      source: lhc_permits
  hidden_conditions:
    - condition: "Shutoff valves (angle stops) crusted with scale that snap or will not close when turned"
      how_a_pro_spots_it: "White crust on the valve in the under-sink photo; home age; the homeowner could not shut the water off"
      question_or_photo: p2_under_sink
      source: lhc_ccr
    - condition: "Polybutylene or galvanized supply pipe behind the one leak"
      how_a_pro_spots_it: "Gray flexible plastic with crimp rings, or gray threaded steel, in the pipe photo"
      question_or_photo: p3_pipe_material
      source: null
    - condition: "The backup is in the city main or at the meter, not on the owner's side"
      how_a_pro_spots_it: "Neighbors have it too, or the yard cleanout runs clear while the street side does not"
      question_or_photo: fu_neighbors_too
      source: lhc_wastewater
    - condition: "Roots or a broken sewer lateral behind a repeat clog"
      how_a_pro_spots_it: "Clogs that return within weeks; cleanout cap off with standing water in the yard photo"
      question_or_photo: p5_cleanout
      source: null
    - condition: "Water damage already spreading (swollen cabinet floor, wet carpet, bubbling paint)"
      how_a_pro_spots_it: "The damage photo; the homeowner says the floor is wet away from the fixture"
      question_or_photo: p4_damage
      source: null
    - condition: "No pressure regulator, or one that has failed, behind banging pipes and repeat leaks"
      how_a_pro_spots_it: "Hammering sound, leaks at several fixtures; the city requires a regulator and under 60 PSI at the house"
      question_or_photo: null
      source: lhc_water
    - condition: "Shared lines in a condo or townhome, or an HOA rule on who may do the work"
      how_a_pro_spots_it: "The bank's floor question and the kind of place on the card"
      question_or_photo: foundation
      source: null
  misdiagnosis_checks:
    - sounds_like: "toilet repair"
      might_be: "main_line_backup"
      one_question: fu_other_drains
      if_other_route_to: {category: plumbing_repair, job_type: "drain clearing"}
      source: null
    - sounds_like: "drain clearing"
      might_be: "main_line_backup"
      one_question: fu_other_drains
      if_other_route_to: {category: plumbing_repair, job_type: "drain clearing"}
      source: null
    - sounds_like: "leak repair (wet floor by a wall)"
      might_be: "slab_leak"
      one_question: fu_warm_spot
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "faucet replacement (no hot water at one tap)"
      might_be: "water_heater fault, a different category"
      one_question: fu_hot_everywhere
      if_other_route_to: {category: plumbing_repair, job_type: "water heater replacement"}
      source: null
    - sounds_like: "leak repair (ceiling stain)"
      might_be: "roof leak, a different category"
      one_question: fu_stain_when
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "leak repair (water at the base of the water heater)"
      might_be: "water_heater tank failure, licensed-only work in this category"
      one_question: fu_where_exactly
      if_other_route_to: {category: plumbing_repair, job_type: "water heater replacement"}
      source: null
  photo_reading:
    - photo_id: p3_pipe_material
      reads: ["Gray flexible plastic with crimp rings (polybutylene)", "Orange and blue pipe with brass fittings (Kitec)", "Gray threaded steel (galvanized)", "Green crust at copper joints", "Printing on the pipe"]
      neutral_wording: "Visible supply pipe under the sink is gray flexible plastic with copper crimp rings."
    - photo_id: p2_under_sink
      reads: ["White crust on the shutoff valves", "Braided or plastic supply lines", "Swollen cabinet floor", "Disposal brand and whether it plugs in"]
      neutral_wording: "White crust on both shutoff valves; cabinet floor looks swollen."
    - photo_id: p1_leak_spot
      reads: ["Drip at a nut or fitting versus a wet pipe body", "Water at a toilet base"]
      neutral_wording: "Water dripping from the nut where the supply line meets the faucet."
    - photo_id: p4_damage
      reads: ["Size and spread of the wet area", "Buckled flooring, bubbling paint"]
      neutral_wording: "Carpet wet in about a 3 by 4 foot area along the hallway wall."
    - photo_id: p5_cleanout
      reads: ["Cap off or on", "Standing water in the pipe", "Roots at the cap"]
      neutral_wording: "Yard cleanout cap is off and water is standing in the pipe."
    - photo_id: p6_meter
      reads: ["Leak dial moving with everything off"]
      neutral_wording: "Meter leak indicator appears to be turning with all fixtures off."
    - photo_id: p7_fixture
      reads: ["Brand and finish", "Number of holes in the sink", "Wall or deck mount", "New fixture already on site"]
      neutral_wording: "Single-handle kitchen faucet, three-hole sink, homeowner has the new faucet in the box."
  local_factors:
    - fact: "City water hardness averages about 19 grains per gallon with TDS about 753 ppm"
      effect: "Scale shortens the life of cartridges, valves, aerators and toilet fill parts, so pros ask about a softener and expect crusted shutoffs"
      source: lhc_ccr
    - fact: "The owner's water line starts at the city meter, and the owner's sewer line runs all the way to the city main in the street"
      effect: "Most backups between house and street are on the owner's side; a pro asks whether neighbors have it too before rolling a truck"
      source: lhc_wastewater
    - fact: "Lake Havasu City requires a pressure regulator and under 60 PSI at the house"
      effect: "Banging pipes and repeat leaks raise the regulator question in quotes"
      source: lhc_water
    - fact: "Many homes from the 1970s to 1990s sit on slabs over rocky or caliche soil"
      effect: "Slab leaks show as warm floor spots or a high bill and cost more to reach [judgment]"
      source: null
    - fact: "Second homes sit empty for months; leaks are found on return"
      effect: "Damage may be large by the time a pro sees it; the card should say how long the water ran, if known [judgment]"
      source: null
    - fact: "Rare winter hard freezes split exposed hose bibs and yard lines"
      effect: "A winter run of outdoor spigot requests [judgment]"
      source: null
  seasonality:
    busy: "June to September (heat, turnover in vacation rentals) and the first hard freeze"
    slow: "Late January to February [judgment]"
    source: null

job_types:
  - id: leak_active
    label: "Water spraying or running now (burst pipe, broken supply line)"
    bank_job_type: "leak repair"
    recurring: false
    homeowner_phrasings: ["pipe burst", "water everywhere", "supply line blew", "gushing under the sink"]
    must_know:
      - fact: "Whether the water is off now, and where it was shut"
        bank_question: shut_off
        follow_up: null
        photo: null
        why_it_moves_price: "Running water makes it a same-day call at a higher rate; a shut valve makes it a scheduled repair. [judgment]"
        skip_if: "Homeowner already said the water is off"
      - fact: "Where the water comes from"
        bank_question: leak_where
        follow_up: null
        photo: p1_leak_spot
        why_it_moves_price: "A supply line or fitting is a quick part; a pipe inside a wall is not. [judgment]"
        skip_if: "Photo shows the leak point"
      - fact: "Pipe material in sight"
        bank_question: null
        follow_up: null
        photo: p3_pipe_material
        why_it_moves_price: "Polybutylene or galvanized changes the fix and the conversation. [judgment]"
        skip_if: "No pipe is visible"
      - fact: "How far the water has spread"
        bank_question: null
        follow_up: fu_spread
        photo: p4_damage
        why_it_moves_price: "Tells the business whether to bring a wet-vac and how long the visit runs. [judgment]"
        skip_if: "Damage photo sent"
    allowed_follow_ups:
      - id: fu_spread
        ask_when: "Water was or is running and no damage photo was sent"
        text_en: "Has the water reached the floor, a wall or a ceiling?"
        text_es: "¿El agua llegó al piso, a una pared o al techo?"
        options_en: ["Still in the cabinet or sink area", "On the floor", "In a wall or ceiling"]
        options_es: ["Sigue en el gabinete o el área del lavabo", "En el piso", "En una pared o el techo"]
        card_field: true
        why: "Spread sets visit length and tells the business what to bring. [judgment]"
      - id: fu_where_exactly
        ask_when: "Homeowner names a wet spot near a water heater, washer or wall but not what is leaking"
        text_en: "Where exactly is the water coming from: a hose or pipe, the bottom of a tank, or you can't tell?"
        text_es: "¿De dónde sale el agua exactamente: de una manguera o tubo, de la base de un tanque, o no se ve?"
        options_en: ["A hose or pipe", "The bottom of a tank", "Can't tell"]
        options_es: ["De una manguera o tubo", "De la base de un tanque", "No se ve"]
        card_field: true
        why: "Water from the bottom of a tank is water-heater work, licensed only in this category. [judgment]"
    photos_priority: [p1_leak_spot, p3_pipe_material, p4_damage]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Water cannot be shut off", "Water in a wall, ceiling or spreading on the floor"]
      regular: "Water is off at a valve and the drip has stopped"
    scope_line_en: "Supply line under the kitchen sink burst; water is off at the valve under the sink."
    scope_line_es: "Se rompió la línea de agua bajo el fregadero de la cocina; el agua está cerrada en la llave bajo el fregadero."
    quote_format: diagnostic_visit
    business_fills: ["visit fee", "what the fee covers", "earliest arrival"]
    card_template: |
      REQ-<id> | Plumbing repair | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: what, where, water on or off>
      Water now: <on / off at valve / off at main / can't shut off>. Shows at: <where>. Spread: <cabinet / floor / wall or ceiling>.
      Pipe in sight: <material, neutral, from photo> or <not visible>. Floor: <slab / crawl space / manufactured>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["It's probably the supply line.", "Turn off the main and open a tap.", "That's usually a cheap fix.", "A plumber will charge about a hundred dollars for that."]

  - id: leak_slow
    label: "Slow drip or leak under a sink, behind a toilet, at a valve"
    bank_job_type: "leak repair"
    recurring: false
    homeowner_phrasings: ["drip under the sink", "wet cabinet", "angle stop weeping", "faucet won't stop dripping"]
    must_know:
      - fact: "Where the water shows: supply side, drain side or the fixture itself"
        bank_question: leak_where
        follow_up: fu_drip_when
        photo: p2_under_sink
        why_it_moves_price: "Supply-side parts are cheap and fast; a drain-side or fixture-body leak means a new part or fixture. [judgment]"
        skip_if: "Under-sink photo shows the drip point"
      - fact: "Whether the shutoff valve closes"
        bank_question: shut_off
        follow_up: null
        photo: p2_under_sink
        why_it_moves_price: "A crusted valve that will not close becomes a second repair. [judgment]"
        skip_if: "Photo shows clean valves and the homeowner said water is off"
      - fact: "Pipe and valve condition in sight"
        bank_question: null
        follow_up: null
        photo: p3_pipe_material
        why_it_moves_price: "Scale and pipe type set the parts list. [judgment]"
        skip_if: "Under-sink photo covers it"
    allowed_follow_ups:
      - id: fu_drip_when
        ask_when: "Homeowner says water shows under a sink or at a fixture but not when"
        text_en: "Does it drip all the time, or only when the water is running or draining?"
        text_es: "¿Gotea todo el tiempo, o solo cuando el agua está corriendo o drenando?"
        options_en: ["All the time", "Only when running", "Only when draining"]
        options_es: ["Todo el tiempo", "Solo cuando corre", "Solo cuando drena"]
        card_field: true
        why: "Separates a supply-side part from a drain-side part without naming either. [judgment]"
      - id: fu_stain_when
        ask_when: "Homeowner reports a stain or drip from a ceiling"
        text_en: "Does the ceiling spot grow when it rains, or when someone uses the bathroom or shower above it?"
        text_es: "¿La mancha del techo crece cuando llueve, o cuando alguien usa el baño o la regadera de arriba?"
        options_en: ["When it rains", "When the bathroom above is used", "Both or not sure", "Nothing above it"]
        options_es: ["Cuando llueve", "Cuando se usa el baño de arriba", "Ambas o no sé", "No hay nada arriba"]
        card_field: true
        why: "Rain points at the roof, a different category; use points at plumbing. [judgment]"
      - id: fu_hot_everywhere
        ask_when: "Homeowner mentions no hot water or weak hot water at a tap"
        text_en: "Is the hot water weak at every tap in the house, or just this one?"
        text_es: "¿El agua caliente sale débil en todas las llaves de la casa, o solo en esta?"
        options_en: ["Every tap", "Just this one"]
        options_es: ["En todas", "Solo en esta"]
        card_field: true
        why: "Every tap points at the water heater, licensed-only work; one tap is a fixture job. [judgment]"
    photos_priority: [p2_under_sink, p1_leak_spot, p3_pipe_material]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Valve will not close and the drip is getting worse"]
      regular: "Drip is caught in a bucket or the valve is off"
    scope_line_en: "Slow drip under the bathroom sink at the cold shutoff valve; water is off there."
    scope_line_es: "Goteo lento bajo el lavabo del baño en la llave de paso del agua fría; el agua está cerrada ahí."
    quote_format: diagnostic_visit
    business_fills: ["visit fee", "what the fee covers", "earliest arrival"]
    card_template: |
      REQ-<id> | Plumbing repair | <town>, <general area> | <kind of place>
      <one scope line: what drips, where, water on or off>
      Drips: <all the time / when running / when draining>. Shows at: <where>. Valve: <closes / won't close / not tried>.
      Pipe and valves in sight: <neutral, from photo> or <not visible>. Floor: <slab / crawl space / manufactured>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Sounds like the cartridge.", "Just tighten the nut.", "That's a quick fix.", "You'll need a new faucet."]

  - id: slab_leak
    label: "Possible leak under the floor or in a wall (warm floor spot, sound of running water, high bill)"
    bank_job_type: "leak repair"
    recurring: false
    homeowner_phrasings: ["warm spot on the tile", "hear water running and nothing is on", "wet carpet by the wall", "bill doubled"]
    must_know:
      - fact: "What the homeowner noticed: warm spot, sound, wet floor, high bill"
        bank_question: leak_where
        follow_up: fu_warm_spot
        photo: p4_damage
        why_it_moves_price: "Sets whether the business brings leak-detection gear and how many hours to plan. [judgment]"
        skip_if: "Homeowner already listed the signs"
      - fact: "Slab, crawl space or manufactured home"
        bank_question: foundation
        follow_up: null
        photo: null
        why_it_moves_price: "Under a slab means concrete work or a re-route; a crawl space is reachable. [judgment]"
        skip_if: "Answered"
      - fact: "Whether the meter moves with everything off"
        bank_question: null
        follow_up: fu_meter_check
        photo: p6_meter
        why_it_moves_price: "A moving meter confirms water is going somewhere and justifies a detection visit. [judgment]"
        skip_if: "Meter photo sent"
    allowed_follow_ups:
      - id: fu_warm_spot
        ask_when: "Homeowner reports a wet area, a sound or a high bill with no visible leak"
        text_en: "Which of these have you noticed: a warm spot on the floor, the sound of water with everything off, a wet floor by a wall, or a higher water bill?"
        text_es: "¿Cuál de estas cosas ha notado: una parte tibia en el piso, ruido de agua con todo cerrado, piso mojado junto a una pared, o un recibo de agua más alto?"
        options_en: ["Warm spot on the floor", "Sound of water with everything off", "Wet floor by a wall", "Higher water bill", "More than one of these"]
        options_es: ["Parte tibia en el piso", "Ruido de agua con todo cerrado", "Piso mojado junto a una pared", "Recibo de agua más alto", "Más de una de estas"]
        card_field: true
        why: "These are the signs a pro asks for before quoting a leak search. [judgment]"
      - id: fu_meter_check
        ask_when: "No meter photo and the homeowner mentions a high bill or a hidden leak"
        text_en: "If you have looked at your water meter with everything off, was the small dial moving?"
        text_es: "Si ya revisó el medidor de agua con todo cerrado, ¿se movía la aguja pequeña?"
        options_en: ["Yes, it was moving", "No, it was still", "Haven't checked"]
        options_es: ["Sí, se movía", "No, estaba quieta", "No lo he revisado"]
        card_field: true
        why: "The meter test is how the city and the university extension tell a homeowner to confirm water is flowing somewhere."
    photos_priority: [p4_damage, p6_meter, p3_pipe_material]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Water on the floor spreading", "Sound of running water and the homeowner can't find a shutoff"]
      regular: "Warm spot or high bill with no standing water"
    scope_line_en: "Warm spot on the hallway tile and the sound of water with everything off; single-story slab home."
    scope_line_es: "Parte tibia en el piso del pasillo y ruido de agua con todo cerrado; casa de un piso sobre losa."
    quote_format: diagnostic_visit
    business_fills: ["visit fee", "what the visit covers (leak search)", "earliest arrival"]
    card_template: |
      REQ-<id> | Plumbing repair | <town>, <general area> | <kind of place>
      <one scope line: the signs noticed, where>
      Signs: <warm spot / sound / wet floor / high bill>. Meter with everything off: <moving / still / not checked>.
      Floor: <slab / crawl space / manufactured>. Water now: <on / off>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That's a slab leak.", "You'll need to jackhammer the floor.", "Leak detection usually runs a few hundred.", "Shut off the main until someone comes."]

  - id: clogged_drain
    label: "One drain slow or clogged (sink, tub, shower, toilet)"
    bank_job_type: "drain clearing"
    recurring: false
    homeowner_phrasings: ["sink won't drain", "tub drains slow", "toilet clogged", "snake didn't work"]
    must_know:
      - fact: "Which fixture, and whether it is only this one"
        bank_question: fixture
        follow_up: fu_other_drains
        photo: null
        why_it_moves_price: "One fixture is a cable job; more than one points at the main line, a different job. [judgment]"
        skip_if: "Homeowner said it is only one drain"
      - fact: "Whether anything has been tried (plunger, store snake, chemical)"
        bank_question: null
        follow_up: fu_tried
        photo: null
        why_it_moves_price: "Chemical drain cleaner in the line changes how the pro works and what they bring. [judgment]"
        skip_if: "Homeowner said what was tried"
      - fact: "Whether it has clogged before"
        bank_question: null
        follow_up: null
        photo: p2_under_sink
        why_it_moves_price: "Repeat clogs point at roots or a bad run, which a camera visit would check. [judgment]"
        skip_if: "Not needed when the homeowner said it is the first time"
    allowed_follow_ups:
      - id: fu_other_drains
        ask_when: "Homeowner mentions one slow or clogged drain, a gurgling toilet, or water coming up in a tub"
        text_en: "Is it just this one drain, or do other drains in the house back up or gurgle too?"
        text_es: "¿Es solo este desagüe, o otros desagües de la casa también se regresan o hacen ruido?"
        options_en: ["Just this one", "Two or three", "All of them"]
        options_es: ["Solo este", "Dos o tres", "Todos"]
        card_field: true
        why: "Separates a single clog from a main-line backup without naming either. [judgment]"
      - id: fu_tried
        ask_when: "Single drain and the homeowner did not say what they tried"
        text_en: "Have you tried anything on it already, like a plunger, a store snake or a drain cleaner?"
        text_es: "¿Ya intentó algo, como un destapador, una sonda de tienda o un líquido destapacaños?"
        options_en: ["Nothing yet", "Plunger or store snake", "Drain cleaner liquid", "More than one of these"]
        options_es: ["Nada todavía", "Destapador o sonda de tienda", "Líquido destapacaños", "Más de una de estas"]
        card_field: true
        why: "Drain cleaner in the line changes the pro's approach and gear. [judgment]"
    photos_priority: [p2_under_sink]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Only toilet in the home is out of use", "Water rising and not draining at all"]
      regular: "Slow drain, other fixtures work"
    scope_line_en: "Kitchen sink draining slowly for a week; only this drain; plunger tried."
    scope_line_es: "El fregadero de la cocina drena lento desde hace una semana; solo este desagüe; ya se usó destapador."
