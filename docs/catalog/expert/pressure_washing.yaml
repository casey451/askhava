  what_they_dislike_about_lead_services: ["Paying for a lead three other washers also bought", "Price shoppers who want a phone number for a driveway with no photo", "Leads from outside their area", "Monthly fees in the slow winter months", "Platforms that push a low starting price"]
  what_makes_a_lead_worth_paying_for: ["A wide photo and a close-up of the worst stain", "Size, surface and stains stated, so a firm price is possible from the truck", "Water on site stated for empty second homes", "A real deadline (sale, HOA notice, move-out)", "Pay only when picked"]
  their_words: ["surface cleaner", "soft wash", "SH (sodium hypochlorite)", "downstream", "X-jet", "GPM", "PSI", "hot water unit", "degreaser", "post-treat", "rust remover", "efflorescence", "water tank", "reclaim", "minimum charge", "flatwork"]
  signup_objections:
    - objection: "I get most of my work off Facebook and referrals for free. Why pay anything?"
      answer: "Keep those. Here you pay only when a homeowner picks your quote, so a request you skip or lose costs nothing. There is nothing to join and nothing monthly."
    - objection: "My jobs are small. Is the fee worth it?"
      answer: "The fee is set by job size: $25, $75 or $199. You see the job card first and decide whether to quote."
    - objection: "I can't price a house wash without seeing it."
      answer: "Most cards carry a wide photo, a close-up of the worst mark, the size and the stories. Quote a firm price and say what it covers, or say which photo you need."
    - objection: "Will you rank me against other washers?"
      answer: "No. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "I don't do roofs or docks."
      answer: "You pick the job types you take at sign-up and can change them any time. You get cards only for those."
    - objection: "Do I need a contractor license for this?"
      answer: "No contractor license class names washing. Sealing, staining and painting are licensed painting work, so those requests go to painting businesses, not here. A city business license applies inside Lake Havasu City."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a phone number we check, with a town, photos and answers to the questions a washer asks. The address goes only to the business the homeowner picks."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
  quote_tips_for_card: ["Say which areas and stain treatments the price includes", "Say plainly if a set-in stain may lighten but not lift all the way", "Say whether you bring your own water", "Give your earliest day and the time of day you start", "If you need another photo, say which"]
