trade_brief:
  price_drivers:
    - driver: "Which surfaces, and how many in one trip (driveway, patio, walls, roof, wall or dock)"
      why: "Flat concrete is fast surface-cleaner work; walls are soft-washed; roofs need ladders and care. Several areas on one trip share the setup time. [judgment]"
      source: null
    - driver: "Size: car-size band for flat work, home size and stories for walls and roofs, length for a wall"
      why: "Flat work is priced by area and houses by size and height; the size answer and the wide photo set the base price. [judgment]"
      source: null
    - driver: "Stain treatment: oil, rust or orange marks, white sprinkler marks, green or black growth"
      why: "Each stain is its own product and dwell time on top of the wash; set-in oil and mineral marks may never fully lift. [judgment]"
      source: null
    - driver: "Surface material: bare concrete versus pavers, painted or coated decks, stucco, wood"
      why: "Coated, painted and wood surfaces take low pressure and more time, and stucco makers set a pressure limit."
      source: sto_stucco
    - driver: "Height and access: second story, roof, gate width, overhead lines, a dock reached only by boat"
      why: "Ladders, poles and staying clear of overhead lines add crew time. [judgment]"
      source: ues_safety
    - driver: "Water on site: a working outdoor faucet near the area"
      why: "A vacant home with the water off means the business hauls its own water. [judgment]"
      source: null
    - driver: "Wash water control near a street gutter, storm drain, wash or the lake"
      why: "City storm drains run to the lake untreated, so near a drain the business may need to block and recover wash water, which adds gear and time."
      source: lhc_stormwater
  hidden_conditions:
    - condition: "A painted, sealed or coated surface (cool-deck style pool deck, painted garage floor, sealed pavers) that lifts or blotches under pressure"
      how_a_pro_spots_it: "Sheen, color or texture in the wide photo; flaking edges in the stain close-up; the material answer"
      question_or_photo: fu_flat_material
      source: null
    - condition: "Peeling or chalky paint, or cracked stucco, on walls that a wash will strip or push water behind"
      how_a_pro_spots_it: "Flaking or bare patches in the house-front photo; the homeowner says the paint is old"
      question_or_photo: fu_paint_peeling
      source: sto_stucco
    - condition: "White or orange sprinkler marks and white salt bloom that water alone will not remove, and that come back while sprinklers keep hitting the wall"
      how_a_pro_spots_it: "Marks in a band at sprinkler height on block or stucco; heavy white crust low on a site wall"
      question_or_photo: fu_wall_marks
      source: angelus_efflorescence
    - condition: "Old oil stains soaked deep into the concrete that will lighten but not vanish, so the homeowner expects more than a wash gives"
      how_a_pro_spots_it: "Dark, wide stain with soft edges in the close-up, where a vehicle has parked for years"
      question_or_photo: p2_worst_stain
      source: null
    - condition: "Loose pavers, washed-out joint sand or cracked and sunken slabs that a wash makes worse or more visible"
      how_a_pro_spots_it: "Gaps between pavers, weeds in joints, raised edges in the wide photo"
      question_or_photo: fu_surface_damage
      source: null
    - condition: "No usable water at the home (seasonal owner away, water shut off at the meter)"
      how_a_pro_spots_it: "Homeowner is out of town; no hose at the faucet in the photo"
      question_or_photo: fu_water_on
      source: null
    - condition: "Broken or slipped roof tiles, or more breakage from walking a tile roof"
      how_a_pro_spots_it: "Gaps, cracked pieces or shifted rows in the roof photo"
      question_or_photo: fu_roof_tiles
      source: eagle_tile
    - condition: "Overhead service line near the wall, eave or roof edge where the crew must work"
      how_a_pro_spots_it: "Line from the pole to the house in the house-front photo"
      question_or_photo: p3_house_front
      source: ues_safety
  misdiagnosis_checks:
    - sounds_like: "patio (clean my pavers)"
      might_be: "loose or sunken pavers that need resetting, a different category"
      one_question: fu_surface_damage
      if_other_route_to: {category: pavers_hardscape, job_type: "paver patio"}
      source: null
    - sounds_like: "driveway (clean and seal the garage floor)"
      might_be: "seal_paint_route, a garage floor coating"
      one_question: fu_seal_what
      if_other_route_to: {category: epoxy_floors, job_type: "garage floor epoxy"}
      source: aac_r4_9_103
    - sounds_like: "patio (wash and seal the pavers)"
      might_be: "seal_paint_route, sealer after the wash"
      one_question: fu_seal_what
      if_other_route_to: {category: painting, job_type: "exterior painting"}
      source: aac_r4_9_103
    - sounds_like: "house wash (walls look bad)"
      might_be: "failing exterior paint that a wash would strip"
      one_question: fu_paint_peeling
      if_other_route_to: {category: painting, job_type: "exterior painting"}
      source: null
    - sounds_like: "house wash (roof wash with a few bad tiles)"
      might_be: "broken roof tiles, a different category"
      one_question: fu_roof_tiles
      if_other_route_to: {category: roof_repair, job_type: "tile replacement"}
      source: null
    - sounds_like: "patio (wash the dock)"
      might_be: "a boat wash, a different category"
      one_question: fu_dock_what
      if_other_route_to: {category: boat_detailing, job_type: "hull cleaning"}
      source: null
    - sounds_like: "patio (wash the dock, boards look rough)"
      might_be: "dock repair, licensed-only work in another category"
      one_question: fu_dock_boards
      if_other_route_to: {category: boat_repair, job_type: "dock, boat lift or seawall work"}
      source: null
  photo_reading:
    - photo_id: p1_whole_area
      reads: ["Size in car spaces or wall length", "Plain concrete, pavers, coated deck or wood", "Pool, plants or open water next to the area", "Street gutter or storm drain at the low edge", "Gate width and how a trailer or hose gets in"]
      neutral_wording: "Two-car driveway, plain concrete, street gutter at the bottom edge."
    - photo_id: p2_worst_stain
      reads: ["Stain color, size and edge (dark oil, orange rust, white mineral, green or black growth)", "Stain on bare concrete versus on paint or coating", "Flaking or lifting coating at the stain"]
      neutral_wording: "Dark stain about 3 ft wide in the center of the garage floor."
    - photo_id: p3_house_front
      reads: ["Stories and eave height", "Stucco, block or siding", "Peeling or bare paint", "Overhead service line near the house", "Marks at sprinkler height"]
      neutral_wording: "Single-story stucco home, tile roof, service line at the left corner, white marks low on the front wall."
    - photo_id: p4_roof
      reads: ["Tile, shingle, foam or metal", "Pitch and height", "Broken, slipped or missing pieces", "Dark streaks or growth"]
      neutral_wording: "Concrete tile roof, low pitch, dark streaks on the north side, no gaps seen from the ground."
    - photo_id: p5_faucet
      reads: ["Faucet location and distance to the area", "Handle present", "Hose already attached"]
      neutral_wording: "Hose faucet on the garage wall, about 20 ft from the driveway."
  local_factors:
    - fact: "City water hardness is about 19 grains per gallon (range 18 to 20)"
      effect: "White and orange sprinkler marks on stucco, block and concrete are common requests and need a separate treatment step [judgment on the effect]"
      source: lhc_ccr
    - fact: "City storm drains, street gutters and washes carry water to Lake Havasu untreated, and the city treats any non-stormwater discharge to them as illicit"
      effect: "Businesses ask where wash water goes; driveways that drain to the street gutter may need blocking and recovery"
      source: lhc_stormwater
    - fact: "Average summer highs run 105 to 109 F from June to August"
      effect: "Crews start at dawn, and chemicals dry fast on hot walls, so summer house washes are booked early in the day [judgment on the effect]"
      source: climate_normals
    - fact: "Monsoon season runs June 15 to September 30"
      effect: "Dust and mud on walls, patios and pool decks bring a run of after-storm wash requests [judgment on the effect]"
      source: nws_monsoon
    - fact: "Rain averages under 4 inches a year"
      effect: "Dust and marks build up with little rain to rinse them, so many homes have never been washed [judgment on the effect]"
      source: climate_normals
    - fact: "Seasonal residents and vacant second homes often have the water off while the owner is away"
      effect: "The water answer and the faucet photo let a business quote a job the owner cannot attend [judgment]"
      source: null
    - fact: "Manufactured homes often have metal or vinyl siding and skirting"
      effect: "Siding takes a different method than stucco; the house-front photo shows it [judgment]"
      source: null
    - fact: "Cool-deck style coated pool decks are common around Havasu pools"
      effect: "Coated decks take low pressure, and a wash may show where the coating has worn [judgment]"
      source: null
    - fact: "Some HOAs send notices for dirty walls, driveways or roofs"
      effect: "An HOA notice or a sale date is a sign of a real job with a deadline [judgment]"
      source: null
    - fact: "Businesses working inside city limits need a Lake Havasu City business license"
      effect: "A sign-up question washers raise; no state contractor class covers washing"
      source: lhc_business_license
  seasonality:
    busy: "March to May (spring sales, seasonal residents leaving), after monsoon storms in July to September, and October to November before winter guests and holidays [judgment]"
    slow: "December to January, and midday in June to August [judgment]"
    source: null

job_types:
  - id: driveway_garage
    label: "Driveway, garage floor or sidewalk"
    bank_job_type: "driveway"
    recurring: false
    homeowner_phrasings: ["wash my driveway", "oil stain where the truck parks", "garage floor is gross", "rust stains on the concrete", "lavar la entrada de carros"]
    must_know:
      - fact: "Size of the area in car spaces"
        bank_question: size
        follow_up: null
        photo: p1_whole_area
        why_it_moves_price: "Flat work is priced by area; the size band and the wide photo set the base price. [judgment]"
        skip_if: "Homeowner gave the size or the wide photo shows it"
      - fact: "Which stains, and how old the oil is"
        bank_question: stains
        follow_up: fu_stain_which
        photo: p2_worst_stain
        why_it_moves_price: "Oil, rust and sprinkler marks each add a treatment step and product. [judgment]"
        skip_if: "Close-up photo shows the marks"
      - fact: "Bare concrete or painted, coated or sealed"
        bank_question: null
        follow_up: fu_flat_material
        photo: p1_whole_area
        why_it_moves_price: "A coating can lift under pressure, so the pro lowers pressure, slows down or declines. [judgment]"
        skip_if: "Photo clearly shows bare concrete"
      - fact: "Whether a working outdoor faucet is near"
        bank_question: null
        follow_up: fu_water_on
        photo: p5_faucet
        why_it_moves_price: "No water means hauling a tank. [judgment]"
        skip_if: "Faucet photo sent and the homeowner lives there"
    allowed_follow_ups:
      - id: fu_stain_which
        ask_when: "Homeowner answered yes to stains, or mentioned marks, without saying which kind"
        text_en: "Which marks are there?"
        text_es: "¿Qué tipo de manchas hay?"
        options_en: ["Oil or grease", "Rust or orange marks", "White marks from sprinklers", "Tire marks", "Green or black growth", "Several kinds"]
        options_es: ["Aceite o grasa", "Óxido o manchas anaranjadas", "Manchas blancas de los aspersores", "Marcas de llantas", "Algo verde o negro", "Varios tipos"]
        card_field: true
        why: "Each kind takes a different product and time; the bank only asks oil or rust, yes or no. [judgment]"
      - id: fu_flat_material
        ask_when: "Flat work or a dock and the photo does not show whether the surface is bare, coated or wood"
        text_en: "What is the surface made of?"
        text_es: "¿De qué es la superficie?"
        options_en: ["Plain concrete", "Pavers or stone", "Painted or coated concrete", "Wood or composite boards"]
        options_es: ["Concreto sin pintar", "Adoquín o piedra", "Concreto pintado o con recubrimiento", "Tablas de madera o compuesto"]
        card_field: true
        why: "The kb's q6_material, missing from the bank; coated and wood surfaces take low pressure and more time. [judgment]"
      - id: fu_surface_damage
        ask_when: "Driveway, patio or pavers and the homeowner did not mention cracks or loose pieces"
        text_en: "Are there any cracks, loose pavers or sunken spots in the area?"
        text_es: "¿Hay grietas, adoquines sueltos o partes hundidas en el área?"
        options_en: ["No", "Small cracks only", "Loose or sunken pavers or slabs"]
        options_es: ["No", "Solo grietas chicas", "Adoquines o losas sueltos o hundidos"]
        card_field: true
        why: "Loose or sunken pieces are repair work in another category, and washing can pull joint sand. [judgment]"
      - id: fu_water_on
        ask_when: "Homeowner is away, the home is a second home or rental, or no faucet photo was sent"
        text_en: "Is there a working outdoor faucet the business can use?"
        text_es: "¿Hay una llave de agua afuera que funcione y que el negocio pueda usar?"
        options_en: ["Yes", "No, the water is off or the home is empty"]
        options_es: ["Sí", "No, el agua está cerrada o la casa está sola"]
        card_field: true
        why: "The kb's q7_water; with no water on site the business brings its own. [judgment]"
    photos_priority: [p1_whole_area, p2_worst_stain, p5_faucet]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["A sale closing, showing or move-out date within the week"]
      regular: "Any driveway or garage floor wash"
    scope_line_en: "Wash a 2-car plain concrete driveway and garage floor; oil stain where the truck parks."
    scope_line_es: "Lavar una entrada de carros de concreto para 2 carros y el piso de la cochera; mancha de aceite donde se estaciona la camioneta."
    quote_format: firm
    business_fills: ["price for the wash", "what is included (stain treatment, areas)", "earliest day"]
    card_template: |
      REQ-<id> | Pressure washing | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: which areas, size, surface, worst mark>
      Size: <1 car / 2 to 3 cars / larger>. Surface: <plain concrete / pavers / painted or coated>. Marks: <oil / rust / sprinkler / tire / growth / dirt only>.
      Cracks or loose pieces: <none / small cracks / loose or sunken / not said>. Water on site: <faucet works / off or empty home / not said>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That oil stain will come right out.", "You should seal it after.", "Driveways run about a hundred and fifty.", "Those orange marks are from your sprinklers.", "Just use a degreaser first."]

