# Ask Hava expert layer: pressure_washing (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set pressure_washing and trade_kb/trades/pressure_washing.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - All 7 kb job types are kept. The category has only three job types, so four kb job types sit under the
#   closest one:
#     roof_wash -> "house wash" (same soft-wash gear and ladders). A roof wash is a different skill and some
#       washers refuse roofs; suggest a "roof wash" category job type so businesses can opt in or out.
#     fence_wall -> "house wash" (vertical masonry or wood, low pressure, same marks). "patio" would also work.
#     dock_ramp -> "patio" (flat work with a surface cleaner). Suggest a "dock or ramp" job type; access by
#       boat and lake-side wash water make it a different job.
#     seal_paint_route -> refused name "sealing or painting". The catalog routes it to painting (R-34). Its
#       quote_format is firm only because the checker reads the pressure_washing row; the card itself goes
#       out under painting's format. Garage floor coatings route to epoxy_floors "garage floor epoxy"
#       (R-8 or R-34); paver sealer, fence stain and wall paint route to painting "exterior painting".
# - Bank gaps. The set asks only surface, size (car bands) and stains (oil or rust, yes or no). It has no
#   surface material, stories, home size or water question, and the car-size bands mean little for a house
#   or roof. The follow-ups below cover these one at a time, but the AI may ask only one. Suggest adding
#   kb q3_home_size and q4_stories with ask_if on surface = House walls, and q6_material for flat work.
# - Bank photos are [p1_whole_area, p2_worst_stain, p5_faucet]. House and roof jobs need p3_house_front and
#   p4_roof (both in the kb); suggest adding them to the bank set for those surfaces.
# - The kb sends solar panel washing to gutter_solar_cleaning, but no enabled category takes panel washing
#   (gutters is install and repair only). Open question for the catalog. Boat washing goes to boat_detailing.
# - Open question from the kb: whether a for-hire soft wash that uses a registered algaecide or mildewcide
#   needs an AZ Department of Agriculture pest management business license (A.R.S. 3-3615, foundation S9).
#   Not resolved here; nothing in this file tells a business it needs or does not need one.
# - Roof coatings sold with a roof wash are R-42 work (A.A.C. R4-9-103). roof_repair has no coating job type,
#   so the coating wish only goes on the card. Open question.
