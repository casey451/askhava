    new_job_type: true
    label: "Wax, polish or remove oxidation from the gelcoat (shine and protect the hull and deck)"
    bank_job_type: "waxing"
    recurring: false
    homeowner_phrasings: ["wax the boat", "hull is chalky", "boat looks faded", "buff out the oxidation", "ceramic coat my boat", "make it shine again"]
    must_know:
      - fact: "How the gelcoat looks now: shiny, dull and faded, or chalky"
        bank_question: null
        follow_up: fu_gelcoat_shine
        photo: p3
