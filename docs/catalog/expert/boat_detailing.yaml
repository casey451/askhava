    must_know:
      - fact: "What the interior has: dirt, mildew, pink stain, spill stains"
        bank_question: null
        follow_up: fu_interior_issues
        photo: p2
        why_it_moves_price: "Mildew and pink stain take extra steps and dwell time, and pink stain may not fully lift."
        skip_if: "Homeowner described the stains"
      - fact: "Boat type and length (seat count, cabin or not)"
        bank_question: boat_type
        follow_up: null
        photo: null
        why_it_moves_price: "A pontoon or wake boat has far more seating than a ski boat; a cruiser adds a cabin. [judgment]"
        skip_if: "Answered"
      - fact: "Whether any seat, cover or bimini top is torn or cracked"
        bank_question: null
        follow_up: fu_vinyl_condition
        photo: null
        why_it_moves_price: "Torn vinyl can tear further under scrubbing, and repair is a different job."
        skip_if: "Homeowner said the seats are in good shape"
      - fact: "Floor type: carpet, vinyl, foam traction mat or bare fiberglass"
        bank_question: null
        follow_up: fu_floor_type
        photo: null
        why_it_moves_price: "Carpet needs extraction and drying; foam mat needs a soft brush; fiberglass is a quick wipe. [judgment]"
        skip_if: "Photo shows the floor"
    allowed_follow_ups:
      - id: fu_interior_issues
        ask_when: "Homeowner wants the interior cleaned and did not say what is on it"
        text_en: "What is on the seats and floor: everyday dirt, mildew or dark spots, pink stains, or spill stains?"
