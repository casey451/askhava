business_side:
  how_they_get_customers: ["Word of mouth at marinas, launch ramps and storage lots [judgment]", "Marina and storage-lot staff passing names along [judgment]", "Local Facebook groups and before-and-after photos on social media [judgment]", "Google Maps listing and reviews [judgment]", "Boat dealers and boat sellers before a sale [judgment]", "Home-service marketplaces such as Thumbtack"]
  customer_acquisition_benchmarks:
    - channel: "Thumbtack (most home-service trades; boat detailing not broken out)"
      figure: "About $25 to $75 per lead, sent to several pros; marketing-vendor estimate, not a published price"
      source: superdupr_thumbtack
      unverified: false
    - channel: "Angi (most home-service trades)"
      figure: "About $15 to $85 per lead plus a yearly membership of a few hundred dollars; leads go to several contractors; marketing-vendor estimate"
      source: superdupr_thumbtack
      unverified: false
    - channel: "Lake Havasu boat detailers specifically"
      figure: "No local figures found; most local work appears to come by word of mouth at marinas and ramps"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a request that several other detailers also got", "Owners who want a price for a boat no one has seen", "Requests from out of the area or for boats that never show up", "Monthly or yearly fees in the slow winter months", "Being ranked or reviewed by the site itself"]
  what_makes_a_lead_worth_paying_for: ["Length, type and where the boat sits up front", "A close-up of the gelcoat so the cutting steps are clear", "Water and power on site stated", "Pay only on the pick, nothing monthly", "A real date the boat is needed"]
  their_words: ["one-step", "two-step", "compound", "cut", "polish", "wet sand", "ceramic", "oxidation", "chalky", "scum line", "waterline", "gelcoat", "pink stain", "extractor", "spot-free rinse", "per foot", "tubes"]
  signup_objections:
    - objection: "Every boat is different. I can't price one I haven't seen."
      answer: "Quote up to three packages and say what each covers. Each card gives length, type, where the boat sits, how the gelcoat looks and whether water and power are there, with photos when the owner sends them."
    - objection: "Why pay a fee when the marina already sends me work?"
      answer: "You pay only when the owner picks your quote, and nothing if they don't. There is nothing to join and nothing monthly."
    - objection: "Which package sets the fee?"
      answer: "The package the owner picks. Under $500 is $25, $500 to $1,500 is $75, and over $1,500 is $199. The quote form shows the fee for each package before you send it."
    - objection: "Is this one of those sites that sells the same job to five detailers?"
      answer: "Every detailer who takes this job type in the area gets the card and may quote. Nobody buys the owner's contact details. Only the business the owner picks pays, and only that business gets them."
    - objection: "Will you rank me against the other detailers?"
      answer: "No. The owner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "I only do interiors, or only wax and polish."
      answer: "You pick the job types you want at sign-up and change them any time. You only get cards for those."
    - objection: "What if the boat is in a slip and the marina won't let me work there?"
      answer: "The card says where the boat sits. Marina rules are between you and the owner, so say in your quote if you need it on a trailer or out of the slip."
    - objection: "What if there are mussels on the hull?"
      answer: "The card says if the owner saw crust or shells and how long the boat has been in the water. Quote the cleaning you do. Decontamination before a boat leaves the lake is done by AZ Game and Fish or its authorized agents."
    - objection: "What if the owner cancels after I pay?"
      answer: "If you haven't spoken with the owner yet, the fee is refunded."
  quote_tips_for_card: ["Name each package by what it does, like wash and one-step wax, or compound, polish and wax", "Say whether the price is for this boat or per foot", "Say if you bring your own water and power", "Give your earliest day and how long you need the boat", "If you need a photo of the interior or the bottom, say which"]
