trade_brief:
  price_drivers:
    - driver: "Gelcoat condition: still shiny, dull and faded, or chalky"
      why: "Shine sets how many cutting steps the job takes: polish only, compound then polish, or extra-cut compound and wet sanding. It moves the price more than boat size does."
      source: fisheries_gelcoat
    - driver: "Boat length and type (bowrider, pontoon, wake boat, cruiser, PWC)"
      why: "Detailers price by the foot and by step; pontoon tubes are quoted on their own and a cruiser adds a cabin."
      source: boatzon_prices
    - driver: "Where the boat sits: trailer at home, lift, slip at a marina, or a storage lot"
      why: "A boat on a trailer is reachable all around and below the waterline; a slip or lift slows the work and limits what can be reached."
      source: boatzon_prices
    - driver: "Time since the last wax or detail, and signs of neglect (mildew, heavy chalk, bird mess)"
      why: "Neglect can double a quote compared with the same boat kept up."
      source: boatzon_prices
    - driver: "Interior state: everyday dirt, mildew, pink stain, carpet or foam mat"
      why: "Pink stain and mildew take extra steps and some will not fully lift; carpet needs extraction and drying time."
      source: taco_pink_stain
    - driver: "Water and power at the boat"
      why: "A storage lot or marina with no water or power means the detailer brings a tank and generator, or the job waits. [judgment]"
      source: null
    - driver: "Waterline scum, mineral stains or shell crust below the waterline"
      why: "Acid hull cleaners and scraping add time and care; stronger acids can dull gelcoat if left on."
      source: practical_sailor_waterline
    - driver: "A fixed deadline (holiday weekend, a sale, a rental season start)"
      why: "Rush slots in the spring and before holiday weekends fill first and carry a premium. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Oxidation deep enough that compound alone will not bring the shine back, so wet sanding is needed"
      how_a_pro_spots_it: "Close-up photo shows chalk that is heavy and even, or color that rubs off; the homeowner says it was never waxed"
      question_or_photo: fu_gelcoat_shine
      source: fisheries_gelcoat
    - condition: "Quagga mussel crust on the hull, drive, trim tabs or trailer bunks"
      how_a_pro_spots_it: "Small shells or rough white crust in the hull photo; boat kept in the water for weeks"
      question_or_photo: fu_hull_crust
      source: blm_ais
    - condition: "Pink stain that comes back up from wet foam after a cleaning"
      how_a_pro_spots_it: "Homeowner names pink spots on the seats; the boat sat under a cover in summer heat"
      question_or_photo: fu_interior_issues
      source: taco_pink_stain
    - condition: "Seats already cracked or split, or stitching gone, that tear further under scrubbing"
      how_a_pro_spots_it: "Homeowner says a seat is torn or cracked; past use of silicone protectant or bleach"
      question_or_photo: fu_vinyl_condition
      source: mastercraft_vinyl
    - condition: "Cracks, chips, faded decals or graphics that lift or burn through under a buffer"
      how_a_pro_spots_it: "Side photo shows graphics and spider cracks; the homeowner mentions chips"
      question_or_photo: fu_gelcoat_damage
      source: null
    - condition: "No water or power at the storage lot, or a marina that limits washing in the slip"
      how_a_pro_spots_it: "Location answer says storage lot or marina; homeowner does not know what is there"
      question_or_photo: fu_water_power
      source: null
    - condition: "Painted pontoon tubes or bottom paint, where an aluminum or gelcoat cleaner would do harm"
      how_a_pro_spots_it: "Side photo shows painted tubes or a colored bottom below the waterline"
      question_or_photo: p2
      source: null
  misdiagnosis_checks:
    - sounds_like: "waxing (pontoon looks dull)"
      might_be: "hull_cleaning of bare aluminum pontoon tubes, which takes acid-safe cleaning and metal polish, not gelcoat wax"
      one_question: boat_type
      if_other_route_to: {category: boat_detailing, job_type: "hull cleaning"}
      source: bennington_pontoon
    - sounds_like: "interior detail (seats look bad)"
      might_be: "torn or cracked vinyl, cover or bimini top, which is repair work"
      one_question: fu_vinyl_condition
      if_other_route_to: {category: boat_repair, job_type: "canvas and upholstery repair"}
      source: null
    - sounds_like: "hull cleaning (dirty bottom)"
      might_be: "quagga mussel attachment; decontamination before the boat leaves the lake is done only by AZGFD or its authorized agents, so the card flags it and the detailer quotes only the cleaning"
      one_question: fu_hull_crust
      if_other_route_to: {category: boat_detailing, job_type: "hull cleaning"}
      source: azgfd_ais
    - sounds_like: "waxing (faded hull)"
      might_be: "gelcoat or fiberglass damage (cracks, chips, blisters) that wax will not cover; no catalog home, so the card notes it"
      one_question: fu_gelcoat_damage
      if_other_route_to: {category: boat_detailing, job_type: "waxing"}
      source: null
    - sounds_like: "full detail before moving or selling the boat out of state"
      might_be: "a boat in the water 6 or more days in a row, which must be decontaminated before transport"
      one_question: fu_time_in_water
      if_other_route_to: {category: boat_detailing, job_type: "hull cleaning"}
      source: azgfd_ais
  photo_reading:
    - photo_id: p2
      reads: ["Boat type and rough length", "Shine or chalk along the sides", "Scum line or brown stain at the waterline", "Graphics and decals", "Painted or bare pontoon tubes", "Cover, bimini top and seats in view", "Trailer, lift or slip"]
      neutral_wording: "Side view of a bowrider on a trailer; sides look dull and there is a brown line at the waterline."
    - photo_id: p3
      reads: ["Chalky versus glossy gelcoat", "Small shells or white crust", "Spider cracks, chips or blisters", "Mineral spots"]
      neutral_wording: "Close-up of the hull side shows a chalky surface and some white spots."
    - photo_id: p1
      reads: ["Engine make and year range, a rough guide to boat age", "Not needed for most detailing quotes"]
      neutral_wording: "Engine label photo attached."
  local_factors:
    - fact: "Summer average highs run 103 F in June, 108 F in July and 106 F in August"
      effect: "Sun breaks down gelcoat and vinyl fast, so wax wears off sooner; detailers book early mornings or shade in summer [judgment for the scheduling]"
      source: azsp_weather
    - fact: "Boats launched, moored, docked or trailered in Lake Havasu may carry quagga mussels; a boat in the water 6 or more days in a row must be decontaminated by AZGFD or an authorized agent before it is moved"
      effect: "Slip and lift boats can come with shell crust; the card states time in the water and any crust so a detailer knows what the bottom looks like"
      source: azgfd_ais
    - fact: "City water hardness is about 19 grains per gallon"
      effect: "A hose rinse at home leaves spots; detailers ask about water on site and may bring filtered or spot-free rinse water [judgment for the gear]"
      source: lhc_ccr
    - fact: "Most boat lifts and docks are at marinas"
      effect: "Many jobs are in a slip or on a marina lift, where marina rules on outside workers, washing and runoff apply [judgment for the rules]"
      source: havasu_docks_s46
    - fact: "Monsoon storms June to September bring strong wind and dust"
      effect: "Covered boats in storage lots collect dust and grit, so a wash comes before any wax [judgment for the effect]"
      source: azsp_weather
    - fact: "Many owners are seasonal or keep the boat in a storage lot for months"
      effect: "Boats come out of storage with dust, bird mess and mildew under the cover, and the owner may not be in town to meet the detailer [judgment]"
      source: null
  seasonality:
    busy: "March to May (spring prep, spring break, Memorial Day) and before July 4 and Labor Day [judgment]"
    slow: "December to January [judgment]"
    source: null

job_types:
  - id: hull_cleaning
    new_job_type: true
    label: "Wash the outside of the hull, clean the waterline scum and mineral spots, the bottom on a trailer or lift, or pontoon tubes"
    bank_job_type: "hull cleaning"
    recurring: false
    homeowner_phrasings: ["clean the hull", "scum line on the boat", "bottom is green", "clean my pontoon tubes", "hard water spots on the boat", "barnacles on the bottom"]
    must_know:
      - fact: "Boat length and type, and whether it has pontoon tubes"
        bank_question: boat_type
        follow_up: null
        photo: p2
        why_it_moves_price: "Priced by the foot; bare aluminum tubes take a different cleaner and polish than gelcoat."
        skip_if: "Homeowner gave length and type"
      - fact: "Which parts of the hull: above the waterline, the bottom too, pontoon tubes, or the whole boat"
        bank_question: null
        follow_up: fu_hull_scope
        photo: p2
        why_it_moves_price: "Bottom work needs the boat out of the water or on a lift and adds acid cleaning time. [judgment]"
        skip_if: "Homeowner named the parts"
      - fact: "Shell crust or stains on the hull"
        bank_question: null
        follow_up: fu_hull_crust
        photo: p3
        why_it_moves_price: "Crust means scraping and care around the drive; a stain line means acid cleaner and rinse."
        skip_if: "Close-up photo shows the bottom"
      - fact: "Where the boat sits and how long it has been in the water"
        bank_question: location
        follow_up: fu_time_in_water
        photo: null
        why_it_moves_price: "A boat kept in the water builds more residue, and a slip limits reach below the waterline."
        skip_if: "Homeowner said it is kept on a trailer"
    allowed_follow_ups:
      - id: fu_hull_scope
        ask_when: "Homeowner wants the hull cleaned without saying which parts"
        text_en: "Which parts should be cleaned: the sides above the waterline, the bottom too, the pontoon tubes, or the whole boat?"
        text_es: "¿Qué partes hay que limpiar: los lados arriba de la línea de flotación, también el fondo, los tubos del pontón, o toda la lancha?"
        options_en: ["Sides above the waterline", "Sides and bottom", "Pontoon tubes", "The whole boat"]
        options_es: ["Lados arriba de la línea de flotación", "Lados y fondo", "Tubos del pontón", "Toda la lancha"]
        card_field: true
        why: "Each answer is a different amount of work and gear. [judgment]"
      - id: fu_hull_crust
        ask_when: "Boat is or was kept in the water, or the homeowner mentions a dirty bottom, growth or barnacles"
        text_en: "Is there any crust or small shells stuck to the hull, the drive or the trailer bunks?"
        text_es: "¿Hay costra o conchitas pegadas al casco, a la transmisión o a las bases del remolque?"
        options_en: ["Yes, crust or shells", "Only a scum line or stains", "No"]
        options_es: ["Sí, costra o conchitas", "Solo una línea de suciedad o manchas", "No"]
        card_field: true
        why: "Crust changes the work, and a detailer wants to know before arriving; the card states it as seen, never names it."
      - id: fu_time_in_water
        ask_when: "Boat is in the water or on a lift, or the homeowner mentions moving or selling it"
        text_en: "How long has the boat been in the water this time?"
        text_es: "¿Cuánto tiempo lleva la lancha en el agua esta vez?"
        options_en: ["Not kept in the water", "Under a week", "A few weeks", "A month or more"]
        options_es: ["No se queda en el agua", "Menos de una semana", "Unas semanas", "Un mes o más"]
        card_field: true
        why: "Time in the water sets how much growth is on the hull, and 6 days in a row is the AZGFD decontamination line before a boat is moved."
      - id: fu_water_power
        ask_when: "Boat is at a marina or storage lot, or the homeowner did not say what is on site"
        text_en: "Is there water and power where the boat is?"
        text_es: "¿Hay agua y luz donde está la lancha?"
        options_en: ["Water and power", "Water only", "Power only", "Neither", "Not sure"]
        options_es: ["Agua y luz", "Solo agua", "Solo luz", "Ninguna", "No sé"]
        card_field: true
        why: "A mobile detailer brings a tank and generator when the site has neither. [judgment]"
    photos_priority: [p2, p3]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: []
      regular: "All hull cleaning requests"
    scope_line_en: "Clean the hull sides and waterline scum on a 22 ft bowrider; on a trailer at home with water and power."
    scope_line_es: "Limpiar los lados del casco y la línea de suciedad de una lancha bowrider de 22 pies; en remolque en casa, con agua y luz."
    quote_format: tiers
    business_fills: ["up to 3 named packages with prices", "what each package covers", "earliest day and how long the boat is needed"]
    card_template: |
      REQ-<id> | Boat detailing | <town>, <general area> | <in the water / on a lift / on a trailer / in storage>
      <one scope line: what to clean, boat length and type, where it sits>
      Boat: <length>, <type>. Parts: <sides / sides and bottom / pontoon tubes / whole boat>. Crust or shells: <yes / scum line or stains / no / not said>.
      Time in the water: <not kept in / under a week / a few weeks / a month or more>. Water and power on site: <both / water only / power only / neither / not sure>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Those are quagga mussels.", "You have to get it decontaminated first.", "That stain needs an acid wash.", "Hull cleaning runs about ten dollars a foot.", "Just pressure wash it."]

  - id: interior_detail
    new_job_type: true
    label: "Clean the inside: vinyl seats, carpet or foam mat, cup holders, storage, cuddy or cabin"
    bank_job_type: "interior detail"
    recurring: false
