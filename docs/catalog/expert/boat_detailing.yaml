# Ask Hava expert layer: boat_detailing (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set boat_detailing and trade_kb/trades/boat_dock.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The boat_dock kb file serves boat_detailing and boat_repair. Only its detailing job type is here.
#   The kb's single "detailing" id covers wash, wax, oxidation and upholstery in one; the category routes
#   three job types, so three new_job_type entries split it: hull_cleaning ("hull cleaning"),
#   interior_detail ("interior detail") and wax_polish ("waxing"). The kb id "detailing" is kept as the
#   full detail (inside and out) package and sits under "waxing", since every full detail includes a wax
#   or polish step. The bank's service question offers "Full detail", but the category has no
#   "full detail" job type; car_detailing does. Casey may add "full detail" to boat_detailing.
# - Left out, with a home in boat_repair: engine_repair, service_tuneup, trailer, electrical_marine,
#   mobile_service (mobile is how most detailers work anyway; the bank's location question and
#   fu_water_power cover it). Left out as licensed or permit work under boat_repair's refused row:
#   boat_lift, dock_repair, dock_new, dock_electrical.
# - The kb lists no interior photo (its quote_without_visit_needs says "photos of hull and interior").
#   p1 (engine label) does little for a detailing quote. Suggest the bank use [p2, p3, p7] with a new
#   kb photo "p7: Seats and floor from the back of the boat".
# - Gelcoat or fiberglass repair (cracks, chips, blisters) has no catalog home. fu_gelcoat_damage puts
#   it on the card only. Quagga decontamination is done only by AZ Game and Fish or its authorized
#   agents, so it is not a job type; fu_hull_crust and fu_time_in_water put the facts on the card.
# - Lake Havasu City water hardness (lhc_ccr) is taken from plumbing_repair.yaml's source row; the city
#   water page itself does not print the figure, the linked annual report does.
schema: 1
category: boat_detailing
question_set: boat_detailing
kb_trade: boat_dock
as_of: "2026-10-29"
written_by: "Claude expert layer, Oct 29 2026. AI research, not legal advice."
