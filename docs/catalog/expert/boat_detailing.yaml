      - id: fu_vinyl_condition
        ask_when: "Homeowner mentions seats, the cover or the bimini top looking bad or old"
        text_en: "Are any seats, the cover or the bimini top torn, cracked or coming apart at the seams?"
        text_es: "¿Algún asiento, la lona o el toldo bimini está roto, agrietado o descosido?"
        options_en: ["Yes, a seat", "Yes, the cover or bimini top", "No"]
        options_es: ["Sí, un asiento", "Sí, la lona o el bimini", "No"]
        card_field: true
        why: "Separates cleaning from canvas and upholstery repair, which boat_repair routes. [judgment]"
      - id: fu_floor_type
        ask_when: "Interior detail and no photo of the floor"
        text_en: "What is the floor: carpet, vinyl, a foam traction mat, or bare fiberglass?"
        text_es: "¿De qué es el piso: alfombra, vinil, tapete de espuma antiderrapante, o fibra de vidrio?"
        options_en: ["Carpet", "Vinyl", "Foam traction mat", "Bare fiberglass"]
        options_es: ["Alfombra", "Vinil", "Tapete de espuma", "Fibra de vidrio"]
        card_field: true
        why: "Each floor takes different gear and drying time. [judgment]"
      - fu_water_power
    photos_priority: [p2]
    urgency:
      fire_dept_triggers: ["Propane smell or hiss in a cruiser cabin", "Smoke or fire on the boat"]
      urgent_capable_triggers: []
      regular: "All interior detail requests"
    scope_line_en: "Interior detail on a 24 ft pontoon: vinyl seats with dark spots and snap-in carpet; in a slip at a marina."
    scope_line_es: "Detallado interior de un pontón de 24 pies: asientos de vinil con manchas oscuras y alfombra de broches; en un muelle de marina."
    quote_format: tiers
    business_fills: ["up to 3 named packages with prices", "what each package covers", "earliest day and how long the boat is needed"]
    card_template: |
      REQ-<id> | Boat detailing | <town>, <general area> | <in the water / on a lift / on a trailer / in storage>
      <one scope line: interior detail, boat length and type, what is on the seats>
      Boat: <length>, <type>. Seats and floor: <dirt / mildew or dark spots / pink stains / spill stains>. Floor: <carpet / vinyl / foam mat / fiberglass>.
      Torn or cracked: <a seat / cover or bimini / none / not said>. Water and power on site: <both / water only / power only / neither / not sure>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That's mildew, bleach will take it out.", "Pink stain is permanent.", "Use a magic eraser on the seats.", "Interior details are about three hundred.", "Those seats need to be replaced."]

