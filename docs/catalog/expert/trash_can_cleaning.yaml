# Ask Hava expert layer: trash_can_cleaning (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set trash_can_cleaning and trade_kb/trades/trash_can_cleaning.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The category has one job type, "bin washing", so all five kb job types map to it. A business
#   cannot opt into home carts but out of dumpsters or bin-pad washing. Casey may want
#   "dumpster washing" and "bin pad wash" as their own job types later.
# - A one-time wash has no one_time_job_types entry in categories.yaml, so quote_format stays
#   monthly for every job type here, one_time_wash included. Under REC-010 a quote with no period
#   is bounced back, so a business asked for a single wash has no clean way to quote it. Suggested
#   fix: add "one-time bin wash" to job_types and one_time_job_types (quoted firm). Until then the
#   card says "Plan: once" and the business writes its terms in the quote notes.
# - The question set has only bins, how_often and pickup_day. Condition, curb access and dumpster
#   size live in follow-ups here, and the AI may ask only one. Adding a condition question to the
#   bank would free the follow-up for curb access, which most often decides whether a wash happens.
# - extra_bins_commercial covers HOA and business dumpsters. Ask Hava is homeowner-facing; an HOA
#   board or a business owner texting in may need a decision on whether those requests are taken.
# - photo p4_bin_area (where the bins sit) is a kb photo but not in the question set's photos list
#   (p1_bins_curb, p2_inside_bin, p3_dumpster). bin_area_wash leans on it; consider adding it to the set.
# - No new_job_type was needed: the kb ids cover the one category job type.
