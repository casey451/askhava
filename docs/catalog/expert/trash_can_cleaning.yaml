business_side:
  how_they_get_customers: ["Door hangers left on bins after pickup", "Nextdoor and local Facebook posts with before-and-after photos", "HOA pilot blocks of 10 to 20 homes washed free or at a discount", "A wrapped truck or trailer parked where people see it", "Neighbor referrals on the same street", "Upsells from driveway and patio washing"]
  customer_acquisition_benchmarks:
    - channel: "Thumbtack (all trades, cleaning included)"
      figure: "Pros report about $10 to over $100 per lead depending on trade and market; customers contact several pros"
      source: hcp_thumbtack
      unverified: false
    - channel: "HOA pilot block (bin washing)"
      figure: "One startup guide suggests washing 10 to 20 homes in one HOA free or at a steep discount to open a route; it gives no cost-per-customer figure"
      source: moneypantry_bins
      unverified: false
    - channel: "Route density (bin washing)"
      figure: "The same guide says about 300 or more customers in a few neighborhoods is where margins work, so a new customer on an existing route is worth far more than one across town"
      source: moneypantry_bins
      unverified: false
    - channel: "Lake Havasu City bin washers specifically"
      figure: "No local figures found; most local washers appear to rely on door hangers and social posts [judgment]"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a request several other washers also got", "One-time washes that never turn into a plan", "Homes far off their route days", "Monthly fees whether or not customers come", "Bins pulled in before they arrive"]
  what_makes_a_lead_worth_paying_for: ["Pickup day on the card, so they know the route", "Cart count and plan stated", "Whether the bins stay out after pickup", "A plan customer for one fee, usually the $25 tier", "Pay only when picked, nothing monthly"]
  their_words: ["cart", "toter", "can", "bin", "route", "route day", "pickup day", "behind the truck", "plan", "monthly", "quarterly", "one-time", "first clean", "sanitize", "deodorize", "hot water", "reclaim", "wastewater", "rig", "trailer", "pad", "enclosure", "yard (dumpster size)"]
  signup_objections:
    - objection: "Why pay a fee for a $30 a month customer?"
      answer: "A plan is counted at 4 months of the monthly price, so a typical home plan comes to the $25 fee, paid once. You pay only when the homeowner picks your quote. If that homeowner picks you again through Ask Hava, there is no fee."
    - objection: "I don't want one-time washes."
      answer: "Quote your plan price and say in your notes that you only take plans. The homeowner sees what you wrote and decides."
    - objection: "Most of these will be off my route days."
      answer: "Every card shows the pickup day and the general area, so you can quote only the ones that fit your routes and skip the rest. Skipping costs nothing."
    - objection: "Do I need a license to sign up?"
      answer: "No state contractor license covers bin washing, so none is asked for. Lake Havasu City has its own business license rule for businesses working inside city limits."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town, a pickup day and answers to the questions a washer asks. Names and addresses go only to the business the homeowner picks."
    - objection: "What if they cancel after the first wash?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded. After that the fee stands. It is a fixed introduction fee by job size, $25, $75 or $199, not a share of the job."
    - objection: "Is there a monthly fee or a contract?"
      answer: "No. There is nothing to join and nothing per month. You pay only on a pick."
    - objection: "Will you rank me against other washers?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, review links and notes. Ask Hava never sorts, rates or scores a business."
    - objection: "I also wash dumpsters and pads. Can I get those?"
      answer: "Yes. Bin washing is one job type here, so cards for home carts, dumpsters and bin pads all come to you once you choose it. Say in your quote what you do and don't take."
  quote_tips_for_card: ["Give a price per month and say how often you wash", "Give the price per extra cart", "List any first-wash charge for a neglected bin as a one-time setup charge", "Say whether you need the bins left at the curb, or will roll them out", "Give your first wash date for that pickup day"]
