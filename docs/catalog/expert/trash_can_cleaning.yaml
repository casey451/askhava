trade_brief:
  price_drivers:
    - driver: "Plan: once, monthly or every three months"
      why: "One-time cleans cost more per visit than plans, and spread-out plans can cost a little more per wash; the bank's how_often question settles it."
      source: homeserve_bins
    - driver: "Number of bins (trash, recycling and any extra carts)"
      why: "Most washers price the first two carts as a set and add a small charge per extra cart per wash."
      source: homeserve_bins
    - driver: "Whether the home sits on a pickup day and area the washer already runs"
      why: "Driving between far-apart stops is the main cost in this trade, so a home on an existing route day is cheaper to serve; the pickup day tells the washer the zone."
      source: moneypantry_bins
    - driver: "Condition on the first wash (normal use, strong smell, maggots, not washed in a long time)"
      why: "A first wash on a neglected bin takes longer and more water than a plan wash; some washers add a first-wash charge. [judgment]"
      source: null
    - driver: "Home carts or dumpsters, and dumpster size"
      why: "Dumpsters take far more water, time and tank space than a home cart and are priced on their own. [judgment]"
      source: null
    - driver: "Add-ons: the bin pad or enclosure, deodorizing between washes"
      why: "A pad wash needs a surface cleaner and water capture on a larger area; deodorizing alone is a short stop. [judgment]"
      source: null
    - driver: "Whether the bins stay at the curb after pickup on wash day"
      why: "Pickup runs 5 am to 6 pm, so the washer cannot promise a time; bins brought in early mean a missed stop or a rolled-out cart charge. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Bins are pulled back in before the washer arrives, or a vacation rental's bins must go out of view soon after pickup"
      how_a_pro_spots_it: "The curb answer; a vacation rental or second home; rental trash may sit in public view no more than 12 hours before pickup"
      question_or_photo: fu_curb_access
      source: lhc_vacation_rentals
    - condition: "Bags, food or liquid still stuck in the bottom after the truck empties it"
      how_a_pro_spots_it: "Dark residue or a bag in the bottom of the inside-bin photo"
      question_or_photo: p2_inside_bin
      source: null
    - condition: "Cracked cart body or broken lid that the wash may make worse"
      how_a_pro_spots_it: "Cracks or a hanging lid in the curb photo; carts belong to Republic Services, so the washer will not repair or replace one"
      question_or_photo: p1_bins_curb
      source: homeserve_bins
    - condition: "Heavy maggots or flies that need a longer first wash"
      how_a_pro_spots_it: "The condition answer; visible larvae or flies in the inside-bin photo; summer heat"
      question_or_photo: fu_condition
      source: null
    - condition: "More carts at the curb than the homeowner counted"
      how_a_pro_spots_it: "Extra trash or recycling carts are rented from the hauler for a monthly fee; the curb photo shows the count"
      question_or_photo: p1_bins_curb
      source: lhc_trash
    - condition: "A holiday week moves pickup a day later, so the wash day moves too"
      how_a_pro_spots_it: "No pickup on Thanksgiving, Christmas or New Year's Day, and collection shifts one day after them"
      question_or_photo: pickup_day
      source: lhc_trash
    - condition: "Dumpster inside a locked block enclosure with a gate, or no room to park the rig"
      how_a_pro_spots_it: "Gate, lock and enclosure walls in the dumpster photo; the access answer"
      question_or_photo: fu_dumpster_access
      source: null
    - condition: "Bin pad slopes to the street or a storm drain, so wash water must be fully caught"
      how_a_pro_spots_it: "Pad near the curb or a drain in the bin-area photo; storm drains run untreated to the lake"
      question_or_photo: p4_bin_area
      source: lhc_storm
  misdiagnosis_checks:
    - sounds_like: "bin washing (flies everywhere)"
      might_be: "a fly or pest problem around the yard or house, a different category"
      one_question: fu_only_bins
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
    - sounds_like: "bin washing (rats or roaches getting into the cans)"
      might_be: "rodents or roaches around the home, a different category"
      one_question: fu_only_bins
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
    - sounds_like: "bin washing (the whole side yard stinks)"
      might_be: "dog waste in the yard, a different category"
      one_question: fu_only_bins
      if_other_route_to: {category: dog_waste_pickup, job_type: "weekly yard pickup"}
      source: null
    - sounds_like: "bin_area_wash (wash where the cans sit)"
      might_be: "a driveway or patio wash, a different category"
      one_question: fu_pad_what
      if_other_route_to: {category: pressure_washing, job_type: "driveway"}
      source: null
    - sounds_like: "bin washing for a second home while the owner is away"
      might_be: "someone to roll the bins out and back in, which a house-check business may do"
      one_question: fu_curb_access
      if_other_route_to: {category: home_watch, job_type: "weekly house check"}
      source: null
    - sounds_like: "deodorize_only (just make it stop smelling)"
      might_be: "one_time_wash, because there is stuck-on mess or maggots inside"
      one_question: fu_smell_only
      if_other_route_to: {category: trash_can_cleaning, job_type: "bin washing"}
      source: null
    - sounds_like: "recurring_wash (start a monthly plan)"
      might_be: "a heavy first wash on bins not cleaned in a long time, priced apart from the plan"
      one_question: fu_condition
      if_other_route_to: {category: trash_can_cleaning, job_type: "bin washing"}
      source: null
  photo_reading:
    - photo_id: p1_bins_curb
      reads: ["Number of carts and lid colors (trash, recycling, extra)", "Cracked lids, missing wheels, split bodies", "Room for a truck or trailer to stop at the curb", "Gravel, slope or a mailbox crowding the carts"]
      neutral_wording: "Photo shows 3 carts at the curb, one with a cracked lid."
    - photo_id: p2_inside_bin
      reads: ["Dark residue or liquid at the bottom", "Maggots or flies", "A bag or food stuck to the sides", "Whether the bin was emptied yet"]
      neutral_wording: "Photo shows dark residue at the bottom of the cart and some flies."
    - photo_id: p3_dumpster
      reads: ["Size label on the dumpster", "Gate, lock or block enclosure walls", "Drain nearby", "Room to park beside it"]
      neutral_wording: "Photo shows one dumpster inside a block enclosure with a metal gate."
    - photo_id: p4_bin_area
      reads: ["Surface (concrete, pavers, gravel)", "Stains on the pad or walls", "Size of the stained area", "Distance from the street and any drain"]
      neutral_wording: "Photo shows a concrete pad beside the garage with dark stains."
  local_factors:
    - fact: "Republic Services collects trash in Lake Havasu City, and the carts stay with the home as Republic's property"
      effect: "Washers clean carts but do not repair or swap them; cracked or missing carts go to the hauler"
      source: lhc_trash
    - fact: "Carts go out the night before, within 3 feet of the street with 4 feet of clearance, and collection runs 5 am to 6 pm"
      effect: "Washers run behind the trucks on pickup day and cannot give an exact time, so the curb answer matters"
      source: lhc_trash
    - fact: "Republic splits the city into five zones, one per weekday, from the south side Monday to the north side Friday (routes may have changed since the report)"
      effect: "The pickup day tells a washer the area, and route density sets price"
      source: lhc_routes
    - fact: "Residents can rent an extra trash or recycling cart for a monthly fee"
      effect: "Three or more carts per home are common enough that washers ask for the count [judgment]"
      source: lhc_trash
    - fact: "Vacation rental trash may sit in public view no more than 12 hours before collection (City Code ch. 5.20)"
      effect: "Rental bins may go back in soon after pickup, before a washer arrives; the card says who handles the bins"
      source: lhc_vacation_rentals
    - fact: "Storm drains, gutters and washes flow untreated to the lake, and any discharge that is not entirely stormwater is an illicit discharge (City Code ch. 8.28)"
      effect: "Washers carry water capture on the rig; a pad wash near a drain takes more care"
      source: lhc_storm
    - fact: "Monsoon season runs June 15 to September 30"
      effect: "Wind tips bins and blows dust and debris into them; heat speeds odor and flies [judgment]"
      source: nws_monsoon
    - fact: "City water is hard, about 19 grains per gallon"
      effect: "Can leave white spots on dark carts if a washer does not rinse or dry them [judgment]"
      source: lhc_ccr
    - fact: "Businesses working inside city limits need a Lake Havasu City business license"
      effect: "No state contractor license covers bin washing; washers may mention a city license, which Ask Hava does not check"
      source: lhc_business_license
    - fact: "No residential contractor license class covers washing bins, dumpsters or pads; it is not construction work"
      effect: "Cards go to businesses with no ROC check; building or rebuilding a block enclosure is a different, licensed job [judgment]"
      source: s2_aac_r4_9_103
    - fact: "Many part-year residents and vacant second homes have no one to set bins out on wash day"
      effect: "Washers ask who rolls the bins out, and some offer to do it [judgment]"
      source: null
  seasonality:
    busy: "May to September, when heat brings smell, flies and maggots [judgment]"
    slow: "December to February, when part-year residents fill homes but cold weather keeps bins mild [judgment]"
    source: null

job_types:
  - id: recurring_wash
    label: "Recurring bin washing (monthly or every three months)"
    bank_job_type: "bin washing"
    recurring: true
    homeowner_phrasings: ["monthly bin wash", "clean my cans every month", "quarterly trash can cleaning", "bin service plan", "lavar los botes cada mes"]
    must_know:
      - fact: "How many bins"
        bank_question: bins
        follow_up: null
        photo: p1_bins_curb
        why_it_moves_price: "Plans are priced per cart, with extra carts added on. [judgment]"
        skip_if: "Homeowner gave the count or the curb photo shows it"
      - fact: "Monthly or every three months"
        bank_question: how_often
        follow_up: null
        photo: null
        why_it_moves_price: "Sets the per-wash rate and how the business writes the monthly price. [judgment]"
        skip_if: "Homeowner named the plan"
      - fact: "Trash pickup day"
        bank_question: pickup_day
        follow_up: null
        photo: null
        why_it_moves_price: "Tells the washer the route day and area; a home on an existing route is cheaper to serve. [judgment]"
        skip_if: "Homeowner gave the day"
      - fact: "Whether the bins stay at the curb after pickup"
        bank_question: null
        follow_up: fu_curb_access
        photo: null
        why_it_moves_price: "Bins brought in early mean a missed stop or a charge to roll them out. [judgment]"
        skip_if: "Homeowner said the bins stay out all day"
      - fact: "Condition now"
        bank_question: null
        follow_up: fu_condition
        photo: p2_inside_bin
        why_it_moves_price: "A neglected bin needs a longer first wash, often priced apart from the plan. [judgment]"
        skip_if: "Homeowner described the smell or bugs, or the inside photo shows it"
    allowed_follow_ups:
      - id: fu_condition
        ask_when: "Homeowner did not say how dirty the bins are and sent no inside photo"
        text_en: "How are the bins right now?"
        text_es: "¿Cómo están los botes ahorita?"
        options_en: ["Normal use", "Strong smell", "Maggots or flies", "Not washed in a long time"]
        options_es: ["Uso normal", "Huelen muy fuerte", "Gusanos o moscas", "No se lavan desde hace mucho"]
        card_field: true
        why: "The first wash on a neglected bin takes longer than a plan wash, and washers price it that way. [judgment]"
      - id: fu_curb_access
        ask_when: "Homeowner did not say whether the bins stay out on pickup day, or mentions a rental, second home or HOA"
        text_en: "On pickup day, can the bins stay at the curb until evening?"
        text_es: "El día que recogen la basura, ¿se pueden quedar los botes en la banqueta hasta la tarde?"
        options_en: ["Yes, they stay out", "No, someone brings them in early", "No one is there that day"]
        options_es: ["Sí, se quedan afuera", "No, alguien los mete temprano", "No hay nadie ese día"]
        card_field: true
        why: "Washers follow the trucks and cannot give a time, so this decides whether the wash happens. [judgment]"
      - id: fu_only_bins
        ask_when: "Homeowner mentions flies, bugs, rodents or a bad smell"
        text_en: "Are the smell, flies or bugs only at the bins, or around the yard or house too?"
        text_es: "¿El olor, las moscas o los bichos están solo en los botes, o también en el patio o la casa?"
        options_en: ["Only at the bins", "Around the yard too", "In the house too", "Rats or mice near the bins"]
        options_es: ["Solo en los botes", "También en el patio", "También en la casa", "Ratas o ratones cerca de los botes"]
        card_field: true
        why: "Bugs past the bins or rodents are a pest job, and a yard smell may be dog waste; both are other categories. [judgment]"
    photos_priority: [p1_bins_curb, p2_inside_bin, p4_bin_area]
    urgency:
      fire_dept_triggers: ["Smoke or flames from a bin"]
      urgent_capable_triggers: []
      regular: "Every plan request"
    scope_line_en: "Monthly wash for 2 carts, trash and recycling; pickup day is Tuesday; bins stay at the curb."
    scope_line_es: "Lavado cada mes para 2 botes, basura y reciclaje; recogen el martes; los botes se quedan en la banqueta."
    quote_format: monthly
    business_fills: ["price per month", "how often you wash (monthly or every three months)", "price per extra cart", "any first-wash charge", "first wash date"]
    card_template: |
      REQ-<id> | Trash-can cleaning | <town>, <general area> | <house / condo / manufactured home / vacation rental>
      <one scope line: how many carts, which plan, pickup day>
      Carts: <1 / 2 / 3 or more>. Plan: <monthly / every three months>. Pickup day: <day>. Condition: <normal / strong smell / maggots or flies / not washed in a long time / not said>.
      At the curb after pickup: <stay out / brought in early / no one there / not said>. Photos: <n> (<neutral description>).
      Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Most washers charge about thirty a month.", "Monthly is the way to go in summer.", "Rinse them with bleach until someone comes.", "That smell means they haven't been washed in months.", "Republic will replace that cracked cart."]

