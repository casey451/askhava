trade_brief:
  price_drivers:
    - driver: "Can the truck crew get to the lids: risers at ground level, buried at a known spot, or location unknown"
      why: "Risers mean hook up and pump; buried lids add digging, and an unknown tank adds probing or a locate. Systems built under current rules have access within 6 inches of grade, older ones often do not."
      source: aac_r18_9_a314
    - driver: "Tank size in gallons, or the bedroom count when nobody knows it"
      why: "Pumpers price by the tank or by the gallon; the design minimum is 1,000 gallons for 1 to 3 bedrooms, 1,250 for 4 and 1,500 for 5."
      source: aac_r18_9_a314
    - driver: "Sewage inside the home or in the yard right now (same-day or after-hours call) versus a scheduled pump-out"
      why: "Emergency and after-hours runs carry a higher rate and bump the route; the timing answer and where the sewage shows settle it. [judgment]"
      source: null
    - driver: "Hose run from where the truck can park: distance, gates, walls, slope, a pool or soft ground in the way"
      why: "Long hose runs and tight access add labor and sometimes a second person; the path photo shows it. [judgment]"
      source: null
    - driver: "Years since the last pump-out"
      why: "A tank left 5 years or more holds packed solids that take longer to break up and pump; EPA puts the usual interval at 3 to 5 years."
      source: epa_care
    - driver: "More than one tank or chamber: two-compartment tank with two lids, a pump chamber, an aerobic unit"
      why: "Each opening or chamber pumped adds time and gallons; aerobic and pump systems have parts and alarms to check. [judgment]"
      source: null
    - driver: "Drive distance: in town, Desert Hills, or remote county roads, and distance to the disposal site"
      why: "Pumpers figure drive time both ways and the dump run into the price. [judgment]"
      source: null
    - driver: "A home-sale transfer inspection instead of a plain pump-out"
      why: "The inspector fills out and signs the ADEQ Report of Inspection and usually pumps the tank, all within 6 months before the sale closes."
      source: aac_r18_9_a316
  hidden_conditions:
    - condition: "Tank or lids under a patio, slab, pavers or a shed added after the system went in"
      how_a_pro_spots_it: "Yard photo shows a newer patio or pavers on the side where the plumbing leaves the house; homeowner says the lid location is unknown"
      question_or_photo: fu_covered
      source: null
    - condition: "Lid cracked, sunken or missing, or a broken inlet or outlet baffle"
      how_a_pro_spots_it: "Lid photo shows cracks, a sunken concrete lid or a makeshift cover; an old one-lid tank"
      question_or_photo: p1
      source: null
    - condition: "Leach field saturated, so a pump-out gives only short relief"
      how_a_pro_spots_it: "Bright green grass or a damp patch over the field in dry weather; slow drains soon after a recent pump-out"
      question_or_photo: p2
      source: epa_malfunctions
    - condition: "Clog in the line between the house and the tank, not a full tank"
      how_a_pro_spots_it: "Tank pumped within a year and drains are slow again; standing water at a cleanout near the house wall"
      question_or_photo: last_pumped
      source: null
    - condition: "Aerobic unit or pump chamber with an alarm, floats or a pump"
      how_a_pro_spots_it: "Control panel or alarm light in the photo; more than two lids; a small box on a post near the tank"
      question_or_photo: p5
      source: epa_care
    - condition: "Extra load the homeowner does not mention: more people living there, heavy garbage disposal use, a new water softener draining to the system"
      how_a_pro_spots_it: "The household count, a disposal in heavy use, or a recent change in the home; EPA says disposals add solids and mean more frequent pumping"
      question_or_photo: fu_recent_change
      source: epa_care
    - condition: "Vacant home with the water off before a sale inspection"
      how_a_pro_spots_it: "Homeowner is out of town, house is listed, nobody living there"
      question_or_photo: fu_onsite
      source: null
    - condition: "No paperwork and no one knows where the tank is"
      how_a_pro_spots_it: "New owner, widow or tenant; Mohave County has site plans on file for most county systems, which can save digging"
      question_or_photo: fu_records
      source: mohave_septic
  misdiagnosis_checks:
    - sounds_like: "tank pumping (slow drains and gurgling)"
      might_be: "main_line_backup on city sewer, a plumbing job"
      one_question: fu_sewer_or_septic
      if_other_route_to: {category: plumbing_repair, job_type: "drain clearing"}
      source: lhc_wastewater
    - sounds_like: "tank pumping (one slow drain)"
      might_be: "clogged_drain at one fixture, a plumbing job"
      one_question: fu_which_drains
      if_other_route_to: {category: plumbing_repair, job_type: "drain clearing"}
      source: null
    - sounds_like: "tank pumping (tank pumped recently and drains slow again)"
      might_be: "repair: a blocked house-to-tank line or a saturated leach field"
      one_question: last_pumped
      if_other_route_to: {category: septic_pumping, job_type: "tank inspection"}
      source: epa_malfunctions
    - sounds_like: "repair (wet spot in the yard)"
      might_be: "outdoor_spigot_line or irrigation leak, a plumbing job"
      one_question: fu_wet_smell
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "tank pumping (tank at the home)"
      might_be: "RV or boat holding tank pump-out at the driveway"
      one_question: fu_what_tank
      if_other_route_to: {category: septic_pumping, job_type: "tank pumping"}
      source: null
    - sounds_like: "tank inspection (selling the house)"
      might_be: "whole-house inspection for the sale, a home inspector job"
      one_question: fu_inspection_for
      if_other_route_to: {category: home_inspection, job_type: "pre-listing inspection"}
      source: null
  photo_reading:
    - photo_id: p1
      reads: ["Risers at grade or bare concrete lids", "Plastic or concrete lid, one or two openings", "Cracked, sunken or makeshift lid", "Dirt or gravel over the lid"]
      neutral_wording: "Two green plastic lids at ground level in a gravel yard."
    - photo_id: p2
      reads: ["Bright green or spongy grass strip in a dry yard", "Patio, pavers or shed near the house drain side", "Slope toward a wash", "Trees or palms near the field"]
      neutral_wording: "Strip of bright green grass in an otherwise dry back yard."
    - photo_id: p3
      reads: ["Where a truck can park", "Gate width and walls", "Rough hose distance", "Pool, steps or slope in the path"]
      neutral_wording: "Open gravel driveway; side gate about 4 feet wide; tank area about 30 feet in."
    - photo_id: p4
      reads: ["Size of the wet area", "Dark water or clear water", "Location near the tank, the field or a cleanout"]
      neutral_wording: "Dark wet patch of ground about 4 by 6 feet near the back wall."
    - photo_id: p5
      reads: ["Aerobic or pump control panel", "Alarm light on or off", "Brand label"]
      neutral_wording: "Gray control box on a post near the tank with a red light on."
  local_factors:
    - fact: "Lake Havasu City's sewer expansion, finished in 2011, put about 85% of the city on city sewer"
      effect: "Many texts about slow drains come from homes on city sewer; a pro asks septic or sewer before anything else"
      source: wef_lhc
    - fact: "Remaining septic homes sit mostly at the edges of the city and in county areas such as Desert Hills"
      effect: "Drive time and dirt roads shape the price; cards should give the general area [judgment]"
      source: null
      unverified: true
    - fact: "Mohave County Development Services keeps site plans for most septic systems in the county"
      effect: "A homeowner with no paperwork may still have a county drawing that shows the tank, which saves probing and digging"
      source: mohave_septic
    - fact: "Every pump truck needs its own ADEQ license, renewed yearly, plus a Mohave County permit after a county inspection"
      effect: "Only licensed haulers get these cards; the business lists its vehicle license at sign-up"
      source: aac_r18_13_1103
    - fact: "Repairing or replacing a leach field needs a new county permit, and a failed system is replaced with a new one"
      effect: "Repair and new-system cards are permit work for a licensed contractor, never handyman work"
      source: mohave_septic
    - fact: "A sale needs a transfer inspection within 6 months before closing, and the buyer files a Notice of Transfer within 15 days"
      effect: "Sale requests come with a hard closing date; the card should state it"
      source: aac_r18_9_a316
    - fact: "Cesspools are not allowed in Arizona, but older owners still call the tank a cesspool"
      effect: "Treat cesspool as the homeowner's word for the tank; the card never comments on it"
      source: aac_r18_9_a309
    - fact: "Caliche and rocky ground make probing and digging up buried lids slow"
      effect: "Buried-lid jobs run longer than in soft soil [judgment]"
      source: null
    - fact: "Seasonal residents and vacant second homes"
      effect: "Pump-outs cluster before winter visitors arrive and before holiday guests; vacant homes may have the water off [judgment]"
      source: null
  seasonality:
    busy: "October to April (winter residents back, holiday guests, spring home sales) and after heavy monsoon rain [judgment]"
    slow: "June to August heat [judgment]"
    source: null

job_types:
  - id: routine_pump
    label: "Routine septic tank pumping"
    bank_job_type: "tank pumping"
    recurring: false
    homeowner_phrasings: ["need the septic pumped", "tank needs cleaned out", "honey wagon", "cesspool is full", "pump my tank before company comes"]
    must_know:
      - fact: "Tank size, or the bedroom count when the size is unknown"
        bank_question: null
        follow_up: fu_bedrooms
        photo: null
        why_it_moves_price: "Pumpers price by the tank or by the gallon, and the design minimum follows the bedroom count."
        skip_if: "Homeowner gave bedrooms or gallons"
      - fact: "Whether the lids are at ground level, buried at a known spot, or unknown"
        bank_question: lid
        follow_up: null
        photo: p1
        why_it_moves_price: "Digging or locating is a separate charge on most pump-outs. [judgment]"
        skip_if: "Lid photo shows risers at grade"
      - fact: "When it was last pumped"
        bank_question: last_pumped
        follow_up: null
        photo: null
        why_it_moves_price: "Long-neglected tanks hold packed solids and take longer. [judgment]"
        skip_if: "Homeowner said when"
      - fact: "How far the truck parks from the tank and what is in the way"
        bank_question: null
        follow_up: fu_truck_distance
        photo: p3
        why_it_moves_price: "Long hose runs and gates add labor. [judgment]"
        skip_if: "Path photo sent"
      - fact: "That it is a ground septic tank and not an RV or boat holding tank"
        bank_question: null
        follow_up: fu_what_tank
        photo: null
        why_it_moves_price: "An RV pump-out at the driveway is a different, smaller job. [judgment]"
        skip_if: "Homeowner named the septic tank at the house"
    allowed_follow_ups:
      - id: fu_bedrooms
        ask_when: "Pumping or inspection request with no bedroom count or tank size given"
        text_en: "How many bedrooms does the home have, or do you know the tank size?"
        text_es: "¿Cuántas recámaras tiene la casa, o sabe el tamaño del tanque?"
        options_en: ["1 or 2 bedrooms", "3 bedrooms", "4 bedrooms", "5 or more bedrooms", "I know the tank size"]
        options_es: ["1 o 2 recámaras", "3 recámaras", "4 recámaras", "5 recámaras o más", "Sé el tamaño del tanque"]
        card_field: true
        why: "Bedroom count sets the design minimum tank size, the first number a pumper prices from."
      - id: fu_truck_distance
        ask_when: "Lids are known and no path photo was sent"
        text_en: "About how far is the tank from where a truck can park?"
        text_es: "¿Más o menos a qué distancia está el tanque de donde se puede estacionar un camión?"
        options_en: ["Under 50 feet", "50 to 100 feet", "More than 100 feet"]
        options_es: ["Menos de 50 pies", "50 a 100 pies", "Más de 100 pies"]
        card_field: true
        why: "Hose length and access set crew time; pumpers ask it on every call. [judgment]"
      - id: fu_what_tank
        ask_when: "Homeowner mentions an RV, trailer, camper or boat, or the wording does not say the tank is in the ground"
        text_en: "Is this a septic tank in the ground at the home, or a holding tank on an RV or boat?"
        text_es: "¿Es un tanque séptico enterrado en la casa, o el tanque de un RV o una lancha?"
        options_en: ["Septic tank in the ground", "RV or boat holding tank"]
        options_es: ["Tanque séptico enterrado", "Tanque de RV o lancha"]
        card_field: true
        why: "Separates a ground tank pump-out from a mobile RV pump-out so businesses quote the right job. [judgment]"
    photos_priority: [p1, p3, p2]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Lid open or cracked through", "Sewage showing in the yard"]
      regular: "Scheduled pump-out, drains working"
    scope_line_en: "Routine pump-out, 3-bedroom home, last pumped over 5 years ago; lids buried, homeowner knows the spot."
    scope_line_es: "Bombeo de rutina, casa de 3 recámaras, último bombeo hace más de 5 años; tapas enterradas, el dueño sabe dónde."
    quote_format: firm
    business_fills: ["price to pump", "gallons included and the rate past that", "whether finding and digging the lids is included", "earliest day"]
    card_template: |
      REQ-<id> | Septic pumping | <town>, <general area> | <house / manufactured home>
      <one scope line: routine pump-out, size, last pumped>
      Tank: <ground septic / RV or boat holding tank>. Size: <gallons or bedrooms>. Last pumped: <under 3 years / 3 to 5 / over 5 or unknown>.
      Lids: <at ground level / buried, spot known / location unknown>. Truck to tank: <distance, gates or walls, from photo or answer>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Your tank is overdue.", "A 1,000-gallon pump-out runs about three hundred.", "You should pump every three years.", "Stop using the disposal.", "Cesspools aren't legal anymore."]

  - id: backup_emergency
    label: "Sewage backup, slow drains or sewage in the yard on a septic home (urgent pump-out)"
    bank_job_type: "tank pumping"
    recurring: false
    homeowner_phrasings: ["toilets backing up and we're on septic", "sewage coming up in the shower", "sewage in the yard", "tank is full again", "se regresa el agua"]
    must_know:
      - fact: "Whether the home is on a septic tank or city sewer"
        bank_question: null
        follow_up: fu_sewer_or_septic
        photo: null
        why_it_moves_price: "On city sewer this is a plumber's main-line job, not a pump-out; most of the city is sewered."
        skip_if: "Homeowner said septic"
      - fact: "Where sewage or dirty water shows: inside, in the yard, or only slow drains"
        bank_question: null
        follow_up: fu_sewage_where
        photo: p4
        why_it_moves_price: "Sewage inside makes it a same-day or after-hours run. [judgment]"
        skip_if: "Homeowner said where"
      - fact: "When it was last pumped"
        bank_question: last_pumped
        follow_up: null
        photo: null
        why_it_moves_price: "A backup soon after a pump-out points the visit at the line or the field, not the tank. [judgment]"
        skip_if: "Answered"
      - fact: "Whether the lids can be reached"
        bank_question: lid
        follow_up: null
        photo: p1
        why_it_moves_price: "An emergency with buried or unknown lids means digging before pumping. [judgment]"
        skip_if: "Lid photo sent"
      - fact: "One drain or the whole house"
        bank_question: null
        follow_up: fu_which_drains
        photo: null
        why_it_moves_price: "One slow drain is a plumber's clog, not a tank job. [judgment]"
        skip_if: "Homeowner said several or all drains"
    allowed_follow_ups:
      - id: fu_sewer_or_septic
        ask_when: "Slow drains, gurgling or a backup and the homeowner has not said septic"
        text_en: "Is the home on a septic tank, or on city sewer?"
        text_es: "¿La casa tiene tanque séptico, o está conectada al drenaje de la ciudad?"
        options_en: ["Septic tank", "City sewer"]
        options_es: ["Tanque séptico", "Drenaje de la ciudad"]
        card_field: true
        why: "About 85% of Lake Havasu City is on sewer; a sewer backup goes to plumbers."
      - id: fu_sewage_where
        ask_when: "Backup or smell reported and the homeowner has not said where sewage shows"
        text_en: "Is sewage or dirty water showing inside the home, in the yard, or are the drains only slow?"
        text_es: "¿Sale agua sucia o aguas negras dentro de la casa, en el patio, o solo drenan lento?"
        options_en: ["Inside the home", "In the yard", "Both", "Only slow drains"]
        options_es: ["Dentro de la casa", "En el patio", "En los dos", "Solo drenan lento"]
        card_field: true
        why: "Sets whether a business rolls a truck now and what it brings. [judgment]"
      - id: fu_which_drains
        ask_when: "Homeowner mentions a slow drain without saying how many"
        text_en: "Is it one drain, or several drains in the house?"
        text_es: "¿Es un solo desagüe, o varios desagües de la casa?"
        options_en: ["Just one drain", "Several drains", "Every drain"]
        options_es: ["Solo uno", "Varios", "Todos"]
