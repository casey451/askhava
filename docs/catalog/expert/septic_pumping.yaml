    - objection: "I can't price a pump-out without the tank size and how deep the lids are."
      answer: "The card says the bedrooms or tank size when known, whether the lids are at ground level, buried or unknown, and when it was last pumped, with photos when she has them. Quote your price and say what digging or extra gallons add."
    - objection: "Most of Havasu is on city sewer. How many septic jobs will there be?"
      answer: "We don't promise a count. Cards come only from homes on septic in the areas Ask Hava covers, and you pay nothing unless a homeowner picks your quote."
    - objection: "Why pay a fee when the other sites send me calls?"
      answer: "Those sites charge per call and send the same call to 3 or 4 companies. Here you pay only when the homeowner picks your quote, and her details go only to you. The fee is set by job size: $25, $75 or $199."
    - objection: "Will you wake me up with emergency calls?"
      answer: "Only if you choose to take urgent jobs. The card says whether sewage is inside the home, so you decide whether to roll a truck."
    - objection: "I only pump. I don't do repairs or installs."
      answer: "You pick the job types you want at sign-up and change them any time. Repair and new-system cards say plainly that licensed septic work is asked for."
    - objection: "Will you rank me against other pumpers?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "How do I know it's a real homeowner?"
      answer: "Each request comes from a texted phone number we check, with a town, photos and answers to the questions a pumper asks. Names and addresses go only to the business the homeowner picks."
