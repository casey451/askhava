# Ask Hava expert layer: septic_pumping (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set septic_pumping and trade_kb/trades/septic.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The category has two job types (tank pumping, tank inspection) and no refused list. The kb's repair and
#   new_system are R-41 work (A.A.C. R4-9-103) plus a Mohave County permit. They are kept, mapped to
#   "tank inspection", because a site look at the system is the first paid step and the scenario file
#   expects new_system. But license_map.yaml sends every septic_pumping card to holders of the ADEQ
#   septage-hauler vehicle license, and a pumping company may hold no R-41. Casey may want a "septic repair
#   or new system" job type licensed to R-41 / CR-41 / C-41 / A-12 / R-37, or a refused row
#   "licensed only (R-41)". Until then, the card says plainly what work is asked for.
# - kb sewer_hookup (abandon the tank and connect to city sewer) is mapped to "tank pumping", scoped to the
#   pump-out before abandonment. The sewer connection itself is R-37 or A-12 work and plumbing_repair has
#   no job type for it, so the card says the connection is a separate job.
# - RESPA: a transfer-of-ownership inspection is required by law before a home sale (A.A.C. R18-9-A316),
#   and Regulation X (12 CFR 1024.2) lists "inspections required by applicable law ... prior to transfer
#   of title" as a settlement service. home_inspection makes sale inspections fee-free (FEE-045, D-403);
#   septic_pumping has no fee_free_job_types. Casey should decide whether a sale "tank inspection" gets the
#   same treatment. The sign-up answers below do not promise either way.
# - The kb's safety steps (someone in a tank, open or broken lid, sewage indoors) are not used (D-436).
#   None is on the fire-truck list, so they get no 911 text here; an open lid and sewage indoors are plain
#   urgent facts only.
# - The kb says the ADEQ vehicle license applies at 750 gallons or more; the R18-13-1103 text read on
#   2026-10-29 says a license for each vehicle and states no size threshold. Not relied on below.
# - Scenario septic_pumping_s01 (RV black tank, house on sewer) expects routine_pump; fu_what_tank lets the
#   card say it is an RV tank so businesses do not quote a ground tank.
