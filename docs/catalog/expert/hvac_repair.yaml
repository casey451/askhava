trade_brief:
  price_drivers:
    - driver: "Cooling or heat out right now in peak heat (same-day or after-hours call) versus a scheduled visit"
      why: "Average highs run 105 to 109 F from June to August, so no-cooling calls stack up and same-day or evening visits carry a higher rate; the timing answer and her words settle it. [judgment on rates]"
      source: climate_normals
    - driver: "System type and where it sits: rooftop package unit, ground condenser with an attic or closet air handler, mini-split, or swamp cooler"
      why: "Roof work means a ladder and time in the sun; attic air handlers in summer are slow, hot work; package and split systems use different parts. [judgment]"
      source: null
    - driver: "Refrigerant on the data plate (R-22 versus R-410A versus newer refrigerants)"
      why: "No new R-22 has been made or imported since 2020, so R-22 repairs depend on recovered supply and quotes swing; EPA asks owners to have leaks found and fixed rather than topped off."
      source: epa_r22
    - driver: "Age of the system, read from the plate date rather than a guess"
      why: "Past about 15 years, parts are harder to find and many businesses quote a repair alongside a replacement option. [judgment]"
      source: null
    - driver: "Symptom class: unit dead or fan not spinning, runs but warm, water leak, noise, or airflow"
      why: "Each class sends a different tech with different truck stock: start parts, leak-search gear, drain tools or duct work. [judgment]"
      source: null
    - driver: "Heat source: gas furnace or roof gas pack versus heat strips or a heat pump"
      why: "Gas heat adds combustion and venting checks, and work connecting to fuel gas is never handyman work in Arizona at any price."
      source: ars_32_1121
    - driver: "Access: two-story or sloped roof, locked side gate, attic hatch in a closet"
      why: "Access sets labor time and whether a second person or extra ladder comes. [judgment]"
      source: null
    - driver: "Manufactured home"
      why: "Ducts run under the floor, closet units are tight, and alterations may be done only by a licensed or certified person."
      source: ars_41_4047
  hidden_conditions:
    - condition: "A refrigerant leak behind a 'just needs a recharge' request"
      how_a_pro_spots_it: "Homeowner says it was topped off last summer or this year; ice on the lines; runs nonstop and never catches up"
      question_or_photo: fu_recharged_before
      source: epa_r22
    - condition: "An R-22 system, where refrigerant comes only from recovered or stockpiled supply"
      how_a_pro_spots_it: "Refrigerant line on the data plate reads R-22; plate date before about 2010"
      question_or_photo: p1_data_plate
      source: epa_r22
    - condition: "A drain backup at an attic or closet unit with water already in the ceiling, wall or subfloor"
      how_a_pro_spots_it: "Ceiling stain photo; water in the pan; a blank thermostat or dead system next to a wet pan"
      question_or_photo: p5_leak_area
      source: null
    - condition: "Condenser coil packed with dust or debris after storm season, or sun-rotted line insulation"
      how_a_pro_spots_it: "Matted or dusty fins and bare copper lines in the whole-unit photo"
      question_or_photo: p2_whole_unit
      source: null
    - condition: "A tripping breaker that traces to the panel or wiring, or a circuit change that needs a new panel or sub-panel, which R-39 does not cover"
      how_a_pro_spots_it: "Other breakers trip too; panel photo shows the panel label and no open spaces"
      question_or_photo: fu_breaker
      source: aac_r4_9_103
    - condition: "Rusted, sooty or disconnected flue pipe on a gas furnace or gas pack"
      how_a_pro_spots_it: "Indoor unit photo shows the flue at the top of the furnace"
      question_or_photo: p3_indoor_unit
      source: null
    - condition: "Crushed, torn or disconnected ducts in a hot attic or in the belly of a manufactured home"
      how_a_pro_spots_it: "One or two rooms warm while the rest cool; ducts under the floor; animal signs"
      question_or_photo: fu_duct_what
      source: null
    - condition: "Scale-crusted pads and pan, or a pan rusted through, behind a swamp cooler that is 'not cooling' or 'leaking'"
      how_a_pro_spots_it: "White crust and rust spots in the whole-cooler photo; city water near 19 grains per gallon hardness"
      question_or_photo: p2_whole_unit
      source: lhc_ccr
  misdiagnosis_checks:
    - sounds_like: "AC not cooling"
      might_be: "cooler_not_cooling"
      one_question: system_type
      if_other_route_to: {category: hvac_repair, job_type: "evaporative (swamp) cooler repair"}
      source: null
    - sounds_like: "thermostat (screen blank, nothing runs)"
      might_be: "ac_leaking_water"
      one_question: fu_water_at_unit
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "ac_not_turning_on (breaker trips)"
      might_be: "electrical fault outside the HVAC system, a different category"
      one_question: fu_breaker
      if_other_route_to: {category: electrical, job_type: "breaker trips"}
      source: null
    - sounds_like: "ac_leaking_water (ceiling stain under a rooftop unit)"
      might_be: "roof leak, a different category"
      one_question: fu_leak_when
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "ac_leaking_water (water on the closet floor)"
      might_be: "plumbing leak or water heater in the same closet"
      one_question: fu_leak_when
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "duct repair (weak air)"
      might_be: "ac_not_cooling (weak air at every vent)"
      one_question: fu_duct_what
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "evaporative (swamp) cooler repair (ceiling stain by the cooler vent)"
      might_be: "roof leak at the cooler roof jack, a different category"
      one_question: fu_leak_when
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: null
  photo_reading:
    - photo_id: p1_data_plate
      reads: ["Brand, model and serial", "Printed manufacture date", "Refrigerant line (R-22, R-410A or newer)", "Tonnage digits in the model number", "MCA and max breaker amps", "On a cooler label: CFM and motor size"]
      neutral_wording: "Data plate readable; refrigerant shown as R-22; plate date 2009."
    - photo_id: p2_whole_unit
      reads: ["Package unit, split condenser, heat pump or swamp cooler", "Matted or dusty fins", "Rust at the base, missing panels", "Bare or sun-rotted line insulation", "Disconnect box present", "Gas line to a rooftop gas pack", "On a cooler: white crust, rust, cover still on"]
      neutral_wording: "Rooftop package unit on a flat roof; one side panel missing; fins look dusty."
    - photo_id: p3_indoor_unit
      reads: ["Furnace or air handler", "Gas line and flue present", "Water in the pan, rust or stains on the platform", "Filter size and condition"]
      neutral_wording: "Air handler in a hall closet; standing water in the pan; filter looks dark."
    - photo_id: p4_thermostat
      reads: ["Screen blank or showing a message", "Brand and model", "Wire count and letters (R, C, Y, G, W, O/B)", "Cooler wall switch settings"]
      neutral_wording: "Thermostat screen blank; five wires behind it labeled R, Y, G, W and C."
    - photo_id: p5_leak_area
      reads: ["Ceiling stain size, sagging drywall", "Secondary drain or float switch present", "Outside drain line outlet"]
      neutral_wording: "Brown ceiling stain about two feet wide below the attic access."
    - photo_id: p7_error_code
      reads: ["Code or blink count", "Brand of the unit or remote"]
      neutral_wording: "Indoor mini-split unit shows a green light blinking five times."
    - photo_id: p8_panel
      reads: ["Panel label and main breaker size", "Open breaker spaces"]
      neutral_wording: "Panel label reads 125 amps; two open spaces at the bottom."
  local_factors:
    - fact: "Average highs are about 105 F in June, 109 F in July and 108 F in August"
      effect: "No-cooling requests peak in summer and businesses run same-day and evening calls; scheduling slows on the hottest weekends [judgment]"
      source: climate_normals
    - fact: "The Arizona monsoon officially runs June 15 to September 30"
      effect: "Dust storms load coils and filters and power flickers stop units, so a run of 'won't turn on after the storm' requests follows each storm [judgment]"
      source: nws_monsoon
    - fact: "Evaporative coolers suit low humidity only and add humidity to the home"
      effect: "Cooler 'not cooling' requests rise on humid monsoon days; many homes have both a cooler and refrigerated AC, so the card says which one is out [judgment]"
      source: doe_evap
    - fact: "City water hardness averages about 19 grains per gallon"
      effect: "Cooler pads and pans scale fast, so pros ask about pad type and expect crusted pans"
      source: lhc_ccr
    - fact: "A cooler may use 50 to 200 gallons a day; pads with heavy mineral deposits should be replaced, and winter shut-down means draining, disconnecting the water line and covering"
      effect: "Start-up, pad and shut-down visits are their own seasonal jobs, often flat-rate by size and location [judgment]"
      source: ua_extension
    - fact: "Repairing or replacing an existing AC without increasing weight, capacity, location or ampacity needs no city permit"
      effect: "Repair cards do not carry permit time; a change in size or location moves the job toward replacement work"
      source: lhc_permits
    - fact: "Manufactured-home installers licensed I-10C may install HVAC and coolers and repair coolers, but may not do refrigerant work"
      effect: "The card says 'manufactured home' so licensed businesses can see the home type"
      source: aac_r4_34_204
    - fact: "Seasonal residents leave the AC set high in summer or off, and second homes sit empty for months"
      effect: "Failures are found on return or by a neighbor; the card says if someone local can open the gate, and never carries a lockbox or gate code [judgment]"
      source: null
  seasonality:
    busy: "May to September for cooling (peak June to August), March to May for swamp cooler start-ups, and the first cold nights in November and December for heat [judgment on demand]"
    slow: "January to early March and mid-October to early November, between seasons [judgment]"
    source: climate_normals

job_types:
  - id: ac_not_cooling
    label: "AC running but blowing warm or not keeping up"
    bank_job_type: "AC not cooling"
    recurring: false
    homeowner_phrasings: ["ac blowing warm", "house is 90 inside", "ac runs all day", "needs freon", "air not cold"]
    must_know:
      - fact: "System type and where a tech works on it (roof, ground, attic or closet)"
        bank_question: system_type
        follow_up: fu_unit_access
        photo: p2_whole_unit
        why_it_moves_price: "Roof and attic work take longer than a ground unit, and package and split systems carry different parts. [judgment]"
        skip_if: "Whole-unit photo sent and the homeowner named the system"
      - fact: "Whether the fan on the outside unit spins"
        bank_question: null
        follow_up: fu_outdoor_fan
        photo: null
        why_it_moves_price: "A stopped or humming fan sends a tech with start parts; a spinning fan with warm air means a longer refrigerant or airflow visit. [judgment]"
        skip_if: "Homeowner said what the outside unit does, or the unit is on a roof she can't see"
      - fact: "Refrigerant and age from the data plate"
        bank_question: age
        follow_up: null
        photo: p1_data_plate
        why_it_moves_price: "R-22 systems run on recovered supply only, so quotes swing; age frames repair against replacement [src:epa_r22]."
        skip_if: "Plate photo sent"
      - fact: "Whether refrigerant has been added before"
        bank_question: null
        follow_up: fu_recharged_before
        photo: null
        why_it_moves_price: "Past top-offs mean the business plans for a leak search, which EPA asks for instead of topping off [src:epa_r22]."
        skip_if: "Homeowner already mentioned a recharge"
      - fact: "Whether air comes out of the vents, and how strong"
        bank_question: null
        follow_up: fu_air_from_vents
        photo: null
        why_it_moves_price: "Weak or no air points the visit at the indoor side (blower, frozen coil, filter) rather than the outside unit. [judgment]"
        skip_if: "Homeowner described the airflow"
    allowed_follow_ups:
      - id: fu_outdoor_fan
        ask_when: "Central AC, heat pump or package unit runs but blows warm, and the homeowner did not say what the outside unit does"
        text_en: "When the AC is on, is the big fan on top of the outside unit spinning?"
        text_es: "Cuando el aire está prendido, ¿gira el ventilador grande de arriba de la unidad de afuera?"
        options_en: ["Yes, spinning", "No, not spinning", "Humming but not spinning", "Can't see it (on the roof)"]
        options_es: ["Sí, gira", "No, no gira", "Zumba pero no gira", "No lo puedo ver (está en el techo)"]
        card_field: true
        why: "The fan answer tells the business which parts and which tech to send. [judgment]"
      - id: fu_air_from_vents
        ask_when: "Homeowner says the house is warm and did not describe the air at the vents"
        text_en: "Inside, is air coming out of the vents?"
        text_es: "Adentro, ¿sale aire por las rejillas?"
        options_en: ["Yes, strong", "Yes, but weak", "No air at all"]
        options_es: ["Sí, fuerte", "Sí, pero poco", "Nada de aire"]
        card_field: true
        why: "Separates an indoor airflow visit from an outdoor unit visit without naming a part. [judgment]"
      - id: fu_recharged_before
        ask_when: "Homeowner says it needs freon or a recharge, or the system runs nonstop"
        text_en: "Has anyone added refrigerant (freon) to this system before?"
        text_es: "¿Alguien le ha puesto refrigerante (gas o freón) a este sistema antes?"
        options_en: ["Yes, this year", "Yes, in past years", "No", "Don't know"]
        options_es: ["Sí, este año", "Sí, en años pasados", "No", "No sé"]
        card_field: true
        why: "Repeat top-offs tell the business to plan a leak search; EPA asks that leaks be found and fixed rather than topped off [src:epa_r22]."
      - id: fu_unit_access
        ask_when: "No photo or words show where the unit sits"
        text_en: "Where would a tech work on the unit?"
        text_es: "¿Dónde tendría que trabajar el técnico en la unidad?"
        options_en: ["Flat roof, one story", "Sloped roof or two stories", "Ground, open side yard", "Ground, behind a locked gate", "Attic or closet inside"]
        options_es: ["Techo plano, un piso", "Techo inclinado o dos pisos", "En el suelo, patio lateral abierto", "En el suelo, detrás de una puerta con llave", "Ático o clóset adentro"]
        card_field: true
        why: "Access sets labor time and gear; never collect a gate code. [judgment]"
    photos_priority: [p1_data_plate, p2_whole_unit, p3_indoor_unit]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["No cooling and the homeowner reports the inside temperature over 90 F", "Homeowner says an older adult, a baby or someone with a medical need is at home"]
      regular: "Cooling, but not keeping up on the hottest afternoons"
    scope_line_en: "Rooftop package unit runs but blows warm since last night; outside fan not spinning; flat roof, one story."
    scope_line_es: "La unidad paquete del techo funciona pero echa aire caliente desde anoche; el ventilador de afuera no gira; techo plano, un piso."
    quote_format: diagnostic_visit
    business_fills: ["visit fee", "what the fee covers", "earliest arrival"]
    card_template: |
      REQ-<id> | Heating and cooling repair | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: system, what it does, since when>
      System: <central split / package unit / heat pump>. Access: <flat roof / sloped or two story / ground / locked gate / attic or closet>. Age: <answer or plate date>.
      Outside fan: <spinning / not spinning / humming / can't see>. Air at vents: <strong / weak / none>. Refrigerant added before: <answer>.
      Label: <refrigerant and date as read from the photo> or <no label photo>. Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["It probably just needs freon.", "Sounds like the capacitor.", "Your unit is low on refrigerant.", "A recharge runs a few hundred dollars.", "At that age you should replace it.", "Hose off the coils and try again."]

  - id: ac_not_turning_on
    label: "AC will not turn on at all (route a heat-only complaint as heat_not_working)"
    bank_job_type: "AC not cooling"
    recurring: false
    homeowner_phrasings: ["ac wont turn on", "ac dead", "nothing happens when i turn on ac", "unit humming wont start", "breaker for ac keeps tripping"]
    must_know:
      - fact: "What the thermostat screen shows"
        bank_question: null
        follow_up: fu_thermostat_screen
        photo: p4_thermostat
        why_it_moves_price: "A blank screen points the visit at power to the indoor unit; a normal screen with nothing running points outside. [judgment]"
        skip_if: "Thermostat photo sent"
      - fact: "Whether the AC breaker has tripped, once or every start, and whether other breakers trip"
        bank_question: null
        follow_up: fu_breaker
        photo: p8_panel
        why_it_moves_price: "A breaker that trips each start means an electrical check at the unit; other circuits tripping is an electrician's job. [judgment]"
        skip_if: "Homeowner already said"
      - fact: "Any error code or blinking light"
        bank_question: error_code
        follow_up: null
        photo: p7_error_code
        why_it_moves_price: "A code narrows the parts the tech brings. [judgment]"
        skip_if: "Answered"
      - fact: "Whether water sits in the pan at the indoor unit"
        bank_question: null
        follow_up: fu_water_at_unit
        photo: p3_indoor_unit
        why_it_moves_price: "Many systems shut off when the drain backs up, which makes it a drain visit. [judgment]"
        skip_if: "Unit is a rooftop package or the homeowner can't see it"
    allowed_follow_ups:
      - id: fu_thermostat_screen
        ask_when: "System dead or thermostat mentioned, and no thermostat photo"
        text_en: "What does the thermostat screen show right now?"
        text_es: "¿Qué muestra ahora la pantalla del termostato?"
        options_en: ["Normal, but nothing runs", "Blank", "A message or error"]
        options_es: ["Normal, pero nada funciona", "Nada, está en blanco", "Un mensaje o error"]
        card_field: true
        why: "Splits a power or control visit from an outdoor unit visit. [judgment]"
      - id: fu_breaker
        ask_when: "Nothing runs at all, or the homeowner mentions a breaker"
        text_en: "Has the breaker for the AC tripped?"
        text_es: "¿Se botó el breaker del aire?"
        options_en: ["No, it is on", "It tripped once", "It trips each time the AC starts", "Other breakers trip too", "Haven't looked"]
