  what_they_dislike_about_lead_services: ["Paying for a call that three or four other companies also bought", "'Needs a recharge' price shoppers who never book", "Monthly fees whether or not jobs come", "Homeowners who want a phone price for a system nobody has seen", "Calls from outside their service area", "Being ranked or reviewed by the lead site itself"]
  what_makes_a_lead_worth_paying_for: ["Data plate photo with refrigerant and date before the first call", "System type and roof or ground access stated", "Whether anyone vulnerable is home and how hot it is inside, so they can sort the day", "Pay only on the pick, nothing monthly", "The homeowner already picked them, so no phone bidding war"]
  their_words: ["service call", "diagnostic fee", "trip charge", "condenser", "air handler", "package unit", "gas pack", "capacitor", "contactor", "line set", "condensate line", "float switch", "tonnage", "R-22", "410A", "heat strips", "C-wire", "static pressure", "pads", "float valve", "bleed-off", "start-up", "maintenance agreement"]
  signup_objections:
    - objection: "Why pay an introduction fee when Google sends me calls?"
      answer: "You pay only when the homeowner picks your quote. Nothing to join, nothing per month. The fee is set by job size: $25, $75 or $199."
    - objection: "In July I'm booked out for days. Why would I want more calls?"
      answer: "You pick your job types and can change them any time. Skip any card you can't fit; skipping costs nothing. If you quote, give your real earliest day."
    - objection: "I can't price AC without putting gauges on it."
      answer: "You don't have to. Quote your service-call fee and say what it covers. Cards carry the system type, what it is doing, roof or ground access, and the data plate photo when the homeowner can send one."
    - objection: "Shared-lead sites sell the same call to four companies."
      answer: "Every business that takes this job type sees the card, and the homeowner sees each quote in the order it came in. You pay only if she picks yours, so you never pay just to compete."
    - objection: "How do I know these are real homeowners and not price shoppers?"
      answer: "Each request comes from a texted phone number we check, with a town, answers to the questions an HVAC tech asks, and photos when she has them. Names and addresses go only to the business she picks."
    - objection: "Will you rank me against other HVAC companies?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license numbers and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "Do I get furnace and swamp cooler jobs I don't do?"
      answer: "Only if you choose those job types, and only when your license class covers the job. You get cards for the job types you picked and nothing else."
