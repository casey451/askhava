# Ask Hava expert layer: hvac_repair (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set hvac_repair and trade_kb/trades/hvac.yaml (evaporative_coolers.yaml consulted for the
# swamp cooler job types). Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Left out (belong to hvac_replacement): ac_replacement, package_unit_replacement.
# - Left out: mini_split_install. A new install is not repair, and hvac_replacement's job types (full system
#   replacement, condenser replacement) do not name it either. Suggest adding "mini-split install" to
#   hvac_replacement, or deciding it routes as "full system replacement".
# - Left out from evaporative_coolers.yaml: cooler_replacement, cooler_new_install, cooler_remove_convert.
#   Neither HVAC category has a job type for replacing, adding or removing a swamp cooler.
# - new_job_type: cooler_not_cooling, cooler_not_running, cooler_leak, cooler_startup. The hvac kb file has no
#   swamp cooler job type, so these reuse the evaporative_coolers.yaml ids (matching the scenario file) and all
#   route as "evaporative (swamp) cooler repair". Folded in: cooler_smell into cooler_not_cooling, cooler_overflow
#   into cooler_leak, cooler_winterize and cooler_pads into cooler_startup.
# - ac_not_turning_on, ac_leaking_water, ac_noise_smell, mini_split_repair and ac_maintenance map to
#   "AC not cooling" because the category has no closer job type. Effect: R-39R Air Conditioning and
#   Refrigeration holders see them (license_map.yaml), which fits the work.
# - heat_pump_issue maps to "furnace repair" (it is a heating complaint). License_map marks R-39R Air
#   Conditioning and Refrigeration as unclear for furnace repair, so those holders will not see heat pump
#   cards even though a heat pump is a refrigeration system. Consider mapping it to "AC not cooling" instead.
# - ac_maintenance is quoted as diagnostic_visit because the category requires it; many shops quote tune-ups
#   flat. A job_type_formats entry would be needed to change that.
# - Not verified this pass: the 2024 IMC secondary condensate protection wording (307.2.3) and a Lake Havasu
#   cost-per-customer figure for HVAC. Neither is stated as fact below.
