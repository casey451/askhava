  how_they_get_customers: ["Google Maps listing and reviews", "Repeat customers and maintenance agreements", "Google Local Services Ads and search ads", "Home-service lead marketplaces", "Builder, property manager and home warranty work [judgment]", "Truck signage and local Facebook groups [judgment]"]
