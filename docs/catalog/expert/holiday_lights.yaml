business_side:
  how_they_get_customers: ["Repeat customers who rebook every fall [judgment]", "Yard signs on lit homes and neighbors asking [judgment]", "Local Facebook groups and Nextdoor posts [judgment]", "Google search ads and a Google Maps listing", "Thumbtack's holiday lighting category", "Add-on season for pressure-washing, window-cleaning and landscape businesses [judgment]"]
  customer_acquisition_benchmarks:
    - channel: "Google search ads for a Christmas light install service"
      figure: "About $69 per lead, 44 leads in 30 days (one freelance marketer's self-reported case, not audited)"
      source: contra_xmas_ads
      unverified: false
    - channel: "Thumbtack (all categories; home improvement)"
      figure: "About $10 to $100 or more per lead by service; home improvement about $10 to $50 (marketing vendor, 2022; holiday lighting not listed)"
      source: leadcapture_thumbtack
      unverified: false
    - channel: "Lake Havasu City holiday-light businesses specifically"
      figure: "No local figures found; a short season and repeat customers may mean few paid channels at all"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["The same request sold to several installers", "Price shoppers who want a per-foot number by phone", "Requests in mid-December when the calendar is full", "Paying for requests outside their area", "Monthly fees for a six-week season"]
  what_makes_a_lead_worth_paying_for: ["A street photo of the whole roofline", "Stories, roof type and areas on the card", "Who supplies the lights stated up front", "A real date, before the parade or after", "Pay only when picked, nothing monthly"]
  their_words: ["linear feet", "C9", "C7", "mini lights", "roofline", "peaks", "ridge clips", "tile tabs", "gutter clips", "custom-cut", "zip cord", "timer", "GFCI", "palm wrap", "canopy", "net lights", "take-down", "storage", "rental program", "service call", "lift"]
  signup_objections:
    - objection: "Why pay $25 when my repeat customers book me anyway?"
      answer: "Keep them. Cards here are new homeowners asking for quotes. You pay only when one picks your quote, and the fee is set by job size: $25, $75 or $199. There is nothing to join and nothing monthly."
    - objection: "I can't price a roofline without measuring it."
      answer: "Most cards come with a street photo, stories, roof type and the sides she wants lit. Quote up to 3 packages and say what each one assumes, like front roofline only on one story."
    - objection: "My calendar is full by Thanksgiving."
      answer: "Each card says when she wants the lights up, so you quote only the ones you can fit. You pick the job types you take and can change them any time."
    - objection: "I only do installs with my own rental lights."
      answer: "Every card says whether the homeowner has lights or wants the business to supply them. Quote the ones that fit how you work."
    - objection: "Will you rank me against other installers?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "What if a homeowner wants an outlet added?"
      answer: "This category is plug-in work only. A new outlet, circuit or wired-in light goes on a separate card to electrical businesses, not to you."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "I do take-downs but not installs."
      answer: "You choose the job types you want at sign-up. Take-down is its own job type, so you can take only those cards."
  quote_tips_for_card: ["Name each package and say what it covers: runs, trees, lights supplied or rented", "Say whether take-down and storage are included and when the take-down happens", "Say whether a strand going out during the season is covered", "Give your earliest install day", "If you need a photo of another side of the house, say which"]
