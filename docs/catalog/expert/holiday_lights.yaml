trade_brief:
  price_drivers:
    - driver: "Feet of lights: which sides of the roofline, how many peaks, plus each added area (trees, bushes, windows)"
      why: "Installers price by the linear foot, so front-only versus all the way around is the biggest swing on the card."
      source: thumbtack_prices
    - driver: "Stories and roof height or pitch"
      why: "A second story runs about twice the first, and hard-to-reach roofs add about 20 percent for gear and time (national marketplace figures)."
      source: thumbtack_prices
    - driver: "Who supplies the lights: the homeowner's own, bought from the business, or rented each year"
      why: "Lights from the installer add a per-foot charge; homeowner lights save that but take time to test and untangle, and may not fit the runs."
      source: thumbtack_prices
    - driver: "Tall palms and trees: how many, how tall, trunk only or trunk and fronds"
      why: "Tree prices vary widely by size; a palm over about 20 feet means a taller ladder or a lift and a second worker. [judgment]"
      source: thumbtack_prices
    - driver: "Take-down and storage bundled in, or install only"
      why: "Removal runs about half the install price when sold separately; many businesses bundle install, take-down and storage into tiers."
      source: thumbtack_prices
    - driver: "Roof edge type: tile, shingle, flat or foam, metal; gutters or bare stucco fascia"
      why: "Sets the clip type and count, since lights hang on clips or hooks rather than nails; tile edges take more care and time. CPSC: hooks or insulated staples, not nails or tacks."
      source: cpsc_holiday
    - driver: "Outdoor outlets: how many, where, GFCI or not, and whether a timer is wanted"
      why: "Far or missing outlets mean long cord runs and more timers; CPSC says outdoor lights go on GFCI-protected circuits, and a new outlet is electrical work."
      source: cpsc_holiday
    - driver: "Install date: before Thanksgiving or the boat parade versus later in December"
      why: "Install slots fill by early December; a firm date sets whether the business can take it at all. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Homeowner's own lights have dead sections, cracked sockets or mixed bulb types and colors"
      how_a_pro_spots_it: "Homeowner supplies the lights and mentions old sets or a bin from the garage; CPSC says every set, new or old, gets checked for cracked sockets and frayed wires"
      question_or_photo: lights
      source: cpsc_holiday
    - condition: "Cracked, slipped or loose tiles at the roof edge, or a loose gutter, which breaks or pulls further during the install"
      how_a_pro_spots_it: "Out-of-line edge tiles or a sagging gutter in the close-up; homeowner says wind blew lights off last year"
      question_or_photo: fu_roof_edge_damage
      source: null
    - condition: "Overhead service line close to the roof edge where lights would hang"
      how_a_pro_spots_it: "A line running from the pole to the house near the front eave in the street photo; UES asks for 15 feet of clearance from overhead lines"
      question_or_photo: p1_front_house
      source: ues_safety
    - condition: "No usable outdoor outlet, or an outlet that keeps shutting off, so the plan needs cords from the garage or an electrician first"
      how_a_pro_spots_it: "Outlet photo shows no cover, scorching or none near the runs; homeowner says the lights kept going out last year"
      question_or_photo: p4_outlets
      source: cpsc_holiday
    - condition: "Old clips, nails, staples or glued clips left from a past install, which slow a take-down or a fresh install"
      how_a_pro_spots_it: "Close-up of the lights now up; homeowner or a past owner hung them"
      question_or_photo: fu_who_hung
      source: null
    - condition: "HOA rule on colors, start date or a take-down deadline"
      how_a_pro_spots_it: "Homeowner mentions an HOA or a rule like white only"
      question_or_photo: fu_hoa_rule
      source: null
    - condition: "Sprinklers aimed at bushes and walls that spray cord joins and plugs"
      how_a_pro_spots_it: "Sprinkler heads or drip lines visible by the bushes in the yard photo"
      question_or_photo: p3_trees_yard
      source: null
    - condition: "Palms with dead fronds or seed pods that need trimming before a wrap"
      how_a_pro_spots_it: "Brown hanging fronds or a skirt of old fronds in the yard photo"
      question_or_photo: p3_trees_yard
      source: null
  misdiagnosis_checks:
    - sounds_like: "plug-in light hanging (homeowner wants an outlet added for the lights)"
      might_be: "hardwired_route, refused in this category"
      one_question: fu_power_plan
      if_other_route_to: {category: electrical, job_type: "new circuit"}
      source: aac_r4_9_103
    - sounds_like: "plug-in light hanging (permanent roofline lights that stay up all year)"
      might_be: "hardwired_route: permanent wired lighting, refused in this category"
      one_question: fu_power_plan
      if_other_route_to: {category: electrical, job_type: "light fixture"}
      source: null
    - sounds_like: "plug-in light hanging (wind blew the lights off the roof)"
      might_be: "cracked or slipped roof tiles, a different category"
      one_question: fu_roof_edge_damage
      if_other_route_to: {category: roof_repair, job_type: "tile replacement"}
      source: null
    - sounds_like: "plug-in light hanging (lights on the gutters)"
      might_be: "a loose or bent gutter, a different category"
      one_question: fu_roof_edge_damage
      if_other_route_to: {category: gutters, job_type: "gutter repair"}
      source: null
    - sounds_like: "plug-in light hanging (lights up but won't turn on)"
      might_be: "a dead outdoor outlet or one that keeps shutting off, electrical work"
      one_question: fu_outlet_works
      if_other_route_to: {category: electrical, job_type: "outlet repair"}
      source: null
  photo_reading:
    - photo_id: p1_front_house
      reads: ["Stories and roof pitch", "Roof type (tile, shingle, flat, metal)", "Gutters or bare stucco fascia", "Number of peaks and sides seen from the street", "Overhead service line near the eave", "Trees and palms in front"]
      neutral_wording: "Photo shows a 1-story home with a tile roof, no gutters, 3 peaks on the front and one palm by the drive."
    - photo_id: p2_roofline_closeup
      reads: ["Tile shape at the edge (flat or curved)", "Stucco or wood fascia", "Gutter lip for clips", "Edge tiles out of line or cracked", "Old clips or nails left from past years"]
      neutral_wording: "Photo shows curved tiles along a stucco fascia; one edge tile sits out of line with the rest."
    - photo_id: p3_trees_yard
      reads: ["Count and height of palms and trees", "Dead fronds or seed pods", "Bush count and size", "Sprinkler heads near bushes", "Distance to the house"]
      neutral_wording: "Photo shows 2 tall palms and 4 low bushes in a rock yard, with sprinkler heads by the bushes."
    - photo_id: p4_outlets
      reads: ["Outlet location and height", "Weather cover present", "GFCI buttons on the face", "Scorch marks or a cracked cover"]
      neutral_wording: "Photo shows one outdoor outlet by the garage door with a flip cover and test buttons."
    - photo_id: p5_lights_up_now
      reads: ["How much is up (roofline, trees, windows)", "Clips, nails or ties used", "Height of the highest run", "Wrapped palms and how high the wrap goes"]
      neutral_wording: "Photo shows white lights on the front roofline on clips and one palm wrapped about halfway up."
  local_factors:
    - fact: "Concrete and clay-style tile roofs are common in Lake Havasu City"
      effect: "Tile clips and ridge clips replace nails; the card states roof type so the business brings the right clips and plans time for care on tile [judgment]"
      source: null
    - fact: "Many homes have stucco walls and fascia with no gutters"
      effect: "No gutter lip for clips changes the attachment plan and the clip count [judgment]"
      source: null
    - fact: "The Boat Parade of Lights runs on the Bridgewater Channel each December (the 43rd was December 14, 2024; the 2026 parade is Saturday, December 12)"
      effect: "Many homeowners want lights up before the parade weekend, so early-December install slots fill first; parade-date requests need a firm earliest-day answer"
      source: golakehavasu_parade
    - fact: "Wind off the lake and desert is common; CPSC says to fasten outdoor lights to firm supports against wind damage"
      effect: "More clips and tie-downs per run, and some calls in December to re-hang lights blown loose [judgment on local wind]"
      source: cpsc_holiday
    - fact: "CPSC says outdoor lights belong on GFCI-protected circuits"
      effect: "A missing or tripping GFCI outlet is electrical work and goes on a separate electrical card"
      source: cpsc_holiday
    - fact: "UES asks for at least 15 feet between overhead power lines and any tools, materials or people"
      effect: "Service drops near the front eave limit where lights can hang; the street photo shows it"
      source: ues_safety
    - fact: "City water hardness is about 19 grains per gallon"
      effect: "Sprinkler spray leaves white spots on bulbs and wets cord joins near bushes; installers route cords away from heads [judgment on effect]"
      source: lhc_ccr
    - fact: "Monsoon season runs June 15 to September 30, with gusts usually over 40 mph"
      effect: "Lights and clips left up all year wear out and blow loose; a spring take-down or a new install may replace sun-worn sets [judgment on effect]"
      source: nws_monsoon
    - fact: "Seasonal residents and vacant second homes"
      effect: "Owners want lights up on timers before they arrive, or taken down after they leave in January, so full packages with storage and timers are common [judgment]"
      source: null
    - fact: "HOAs in some neighborhoods set decor colors, start dates and take-down deadlines; manufactured homes may have metal roofs and short eaves"
      effect: "The card carries any HOA rule as her fact; metal roofs take magnetic or edge clips [judgment]"
      source: null
  seasonality:
    busy: "Early November to mid-December for installs (peak the two weeks before the boat parade); early to mid-January for take-downs [judgment]"
    slow: "February to October, apart from late take-downs and summer re-hangs after wind [judgment]"
    source: null

job_types:
  - id: roofline_gutters
    label: "Roofline, eaves and gutter lights (plug-in)"
    bank_job_type: "plug-in light hanging"
    recurring: false
    homeowner_phrasings: ["lights on the roofline", "c9s on the eaves", "icicle lights", "lights on the gutters", "outline the house in white lights"]
    must_know:
      - fact: "Which sides of the roofline: front only, front and sides, or all the way around"
        bank_question: null
        follow_up: fu_roof_sides
        photo: p1_front_house
        why_it_moves_price: "Feet of lights is the core of the quote; front only versus the whole house can triple it. [judgment]"
        skip_if: "Her words or the street photo make the runs clear"
      - fact: "Stories and roof height"
        bank_question: stories
        follow_up: null
        photo: p1_front_house
        why_it_moves_price: "A second story runs about twice the first per the national marketplace guide; steep roofs add time and gear."
        skip_if: "Answered"
      - fact: "Roof type and whether there are gutters"
        bank_question: null
        follow_up: fu_roof_type
        photo: p2_roofline_closeup
        why_it_moves_price: "Tile, shingle, foam and metal take different clips and different care. [judgment]"
        skip_if: "Close-up or street photo shows the roof"
      - fact: "Who supplies the lights"
        bank_question: lights
        follow_up: null
        photo: null
        why_it_moves_price: "Business-supplied lights add a per-foot charge; her own lights need testing first."
        skip_if: "Answered"
      - fact: "Where the outdoor outlets are"
        bank_question: null
        follow_up: null
        photo: p4_outlets
        why_it_moves_price: "Outlet spots set cord runs and timers; no outlet may mean a separate electrical card. [judgment]"
        skip_if: "Outlet photo sent or she named the spot"
    allowed_follow_ups:
      - id: fu_roof_sides
        ask_when: "Roofline lights wanted and her words and photos don't show which sides"
        text_en: "Which parts of the roofline should get lights?"
        text_es: "¿Qué partes de la orilla del techo llevan luces?"
        options_en: ["Front only", "Front and sides", "All the way around"]
        options_es: ["Solo el frente", "El frente y los lados", "Toda la casa"]
        card_field: true
        why: "Sets the feet of lights, the number one price driver. [judgment]"
      - id: fu_roof_type
        ask_when: "Roofline lights are part of the job and no photo shows the roof"
        text_en: "What kind of roof does the house have?"
        text_es: "¿Qué tipo de techo tiene la casa?"
        options_en: ["Tile", "Shingle", "Flat or foam", "Metal"]
        options_es: ["Teja", "Tejas de asfalto (shingle)", "Plano o de espuma", "Metal"]
        card_field: true
        why: "Roof type sets the clips and the care on the roof edge. [judgment]"
      - id: fu_power_plan
        ask_when: "She mentions an outlet, wiring, a switch, or lights that stay up all year"
        text_en: "Will the lights plug into an outlet that's there now, or do you want a new outlet or wiring added?"
        text_es: "¿Las luces se van a conectar a un enchufe que ya existe, o quiere que se ponga un enchufe o cableado nuevo?"
        options_en: ["Plug into an outlet there now", "Add a new outlet or wiring", "Lights that stay up all year, wired in"]
        options_es: ["Conectar a un enchufe que ya existe", "Poner un enchufe o cableado nuevo", "Luces fijas todo el año, con cableado"]
        card_field: true
        why: "A new outlet, circuit or wired-in lights is R-11 electrical work and leaves this category. [src:aac_r4_9_103]"
      - id: fu_roof_edge_damage
        ask_when: "She mentions wind, lights blown down, broken tiles, or a gutter that sags or pulls loose"
        text_en: "Does anything on the roof edge look loose or broken, like tiles or a gutter?"
        text_es: "¿Se ve algo flojo o roto en la orilla del techo, como tejas o una canaleta?"
        options_en: ["Tiles cracked or out of place", "Gutter loose or bent", "No, it all looks fine"]
        options_es: ["Tejas rotas o fuera de lugar", "Canaleta floja o doblada", "No, todo se ve bien"]
        card_field: true
        why: "Tile and gutter repair are separate cards to roofing and gutter businesses; the light business wants to know before climbing. [judgment]"
    photos_priority: [p1_front_house, p2_roofline_closeup, p4_outlets]
    urgency:
      fire_dept_triggers: ["Sparks, smoke or a burning smell at an outlet, cord or plug"]
      urgent_capable_triggers: []
      regular: "All roofline installs"
    scope_line_en: "Hang white lights on the front roofline, 1 story, tile roof with no gutters; homeowner has her own lights."
    scope_line_es: "Colgar luces blancas en la orilla del techo del frente, 1 piso, techo de teja sin canaletas; la dueña tiene sus propias luces."
    quote_format: tiers
    business_fills: ["up to 3 named packages with prices", "what each package covers (runs, lights supplied or rented, take-down, storage)", "earliest install day and take-down window"]
    card_template: |
      REQ-<id> | Holiday lights (plug-in) | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: which runs, stories, roof, who supplies lights>
      Runs: <front only / front and sides / all the way around>. Stories: <1 / 2 or more>. Roof: <tile / shingle / flat or foam / metal>, gutters <yes / no>.
      Lights: <homeowner has them / business supplies>. Outlets: <neutral, from photo or her words>. Roof edge: <looks fine / loose or broken, in her words>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Tile roofs are tricky, expect to pay more.", "Roofline lights usually run a couple dollars a foot.", "You'll need an outlet on the eave.", "Just use extension cords from the garage.", "Those tiles were probably cracked already."]

  - id: trees_bushes
    label: "Trees, palms, bushes and yard lights (plug-in)"
    bank_job_type: "plug-in light hanging"
    recurring: false
    homeowner_phrasings: ["wrap the palm trees", "lights on my palms", "net lights on the bushes", "wrap the tree in the front yard", "light up the yard"]
    must_know:
      - fact: "How many palms or trees, and how tall the tallest is"
        bank_question: null
        follow_up: fu_tree_height
        photo: p3_trees_yard
        why_it_moves_price: "Tall palms need a long ladder or a lift and more lights per trunk. [judgment]"
        skip_if: "Yard photo shows the trees with something for scale"
      - fact: "Trunk only, or trunk and fronds or canopy"
        bank_question: null
        follow_up: fu_wrap_style
        photo: null
        why_it_moves_price: "A canopy or frond wrap takes several times the lights and time of a trunk wrap. [judgment]"
        skip_if: "Her words say which"
      - fact: "Distance from the trees to the nearest outdoor outlet"
        bank_question: null
        follow_up: fu_outlet_distance
        photo: p4_outlets
        why_it_moves_price: "Yard runs need long outdoor cords, stakes and timers. [judgment]"
        skip_if: "Outlet photo shows it next to the trees"
      - fact: "Who supplies the lights"
        bank_question: lights
        follow_up: null
        photo: null
        why_it_moves_price: "Business-supplied lights add to the quote by the foot."
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_tree_height
        ask_when: "Palms or trees are part of the job and no photo shows their height"
        text_en: "About how tall is the tallest palm or tree you want lit?"
        text_es: "¿Más o menos qué tan alta es la palma o el árbol más alto que quiere iluminar?"
        options_en: ["Under 10 feet", "10 to 20 feet", "Over 20 feet"]
        options_es: ["Menos de 10 pies", "De 10 a 20 pies", "Más de 20 pies"]
        card_field: true
        why: "Height decides ladder or lift and the lights per tree. [judgment]"
      - id: fu_wrap_style
        ask_when: "Palms or trees wanted and she didn't say how far up the lights go"
        text_en: "Should the lights go on the trunk only, or the trunk and the top too?"
        text_es: "¿Las luces van solo en el tronco, o en el tronco y también arriba?"
        options_en: ["Trunk only", "Trunk and the top", "Bushes only, no trees"]
        options_es: ["Solo el tronco", "El tronco y arriba", "Solo arbustos, sin árboles"]
        card_field: true
        why: "Frond and canopy wraps are the high tier on most tree quotes. [judgment]"
      - id: fu_outlet_distance
        ask_when: "No outlet photo and she didn't say where the outlets are"
        text_en: "How close is the nearest outdoor outlet to where the lights will go?"
        text_es: "¿Qué tan cerca está el enchufe de afuera más cercano de donde van las luces?"
        options_en: ["Close by", "Across the yard", "No outdoor outlet"]
        options_es: ["Cerca", "Al otro lado del patio", "No hay enchufe afuera"]
        card_field: true
        why: "Sets cord runs and timers; no outlet may mean a separate electrical card. [judgment]"
      - fu_power_plan
    photos_priority: [p3_trees_yard, p4_outlets, p1_front_house]
    urgency:
      fire_dept_triggers: ["Power line down in the yard or across a tree"]
      urgent_capable_triggers: []
      regular: "All tree and yard light installs"
    scope_line_en: "Wrap 2 front palms, trunk only, about 15 feet tall; outlet by the garage; business supplies the lights."
    scope_line_es: "Envolver 2 palmas del frente, solo el tronco, de unos 15 pies; enchufe junto a la cochera; el negocio pone las luces."
    quote_format: tiers
    business_fills: ["up to 3 named packages with prices", "what each package covers (trees, wrap height, lights supplied or rented, take-down)", "earliest install day"]
    card_template: |
      REQ-<id> | Holiday lights (plug-in) | <town>, <general area> | <kind of place>
      <one scope line: how many trees or palms, height, wrap style>
      Trees: <count>, tallest <under 10 / 10 to 20 / over 20 feet>. Wrap: <trunk only / trunk and top / bushes only>. Bushes: <count, from photo or her words>.
      Lights: <homeowner has them / business supplies>. Nearest outlet: <close by / across the yard / none>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Those palms need trimming first.", "Tall palms need a lift, that adds up.", "Wrapping a palm is cheap.", "Solar lights would be easier out there.", "Run a cord across the yard."]

