# Ask Hava expert layer: holiday_lights (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set holiday_lights and trade_kb/trades/holiday_lights.yaml (a Claude-written trade file, not Grok).
# Fake data only. Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - kb job type hardwired_route maps to the refused name "new outlet, circuit or hardwiring" (R-11 only, LIC-029).
#   Its card_template is the internal routing record: no card goes to a holiday-light business; an electrical
#   card is built instead ("new circuit" for a new outlet or circuit, "light fixture" for permanent wired lights).
# - full_package (install, service calls, take-down, storage) maps to "plug-in light hanging", since the job starts
#   with an install; take-down and storage ride in the business's tiers.
# - The bank set asks only service, stories and who supplies the lights. The kb file's areas (q2), roof type (q5)
#   and outlet (q6) questions are not in the bank, and the AI gets one follow-up, so a roofline card often lacks
#   either the sides to light or the roof type. Suggest adding "Where do you want lights?" to the bank set, and a
#   rent-each-year option to the "lights" question. Not changed here.
# - The bank photos list is p1, p2, p4; this file also uses kb photos p3_trees_yard (trees job) and
#   p5_lights_up_now (take-down). Suggest adding both to the bank photos list.
# - Lights on a boat for the Boat Parade of Lights: the kb routes it to boat_dock, which is not a category, and no
#   enabled boat category has a decor job type, so there is no misdiagnosis row for it.
# - The bank set has no timing question; "Needed: <timing answer>" uses the app's standard timing answer.
# - Thumbtack price-per-foot figures are kept in business-facing reasoning only, never in homeowner copy.
