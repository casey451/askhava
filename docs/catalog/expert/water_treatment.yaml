# Ask Hava expert layer: water_treatment (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set water_treatment and trade_kb/trades/water_treatment.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
# Ask Hava never says what treatment a home should have and makes no health claim about tap water. If asked,
# the card notes the question and the city's water quality report is the only place it points.
#
# NOTES FOR REVIEW
# - All 9 kb job types are kept. The category has 3 job types, none of them repair or service, so coarse
#   mappings: softener_new, softener_repair, softener_replace, whole_house_filter, remove_bypass, water_test
#   and loop_install all map to "softener install"; ro_new and ro_service map to "RO system". A "softener or RO
#   service" job type would route repair cards more cleanly (the scenario file already expects a null bank
#   job type on softener repairs for this reason).
# - water_test under "softener install" is a poor fit. R-54 covers installing and repairing equipment, not lab
#   testing; a water-test card reaches the same R-54 businesses, who usually offer an in-home hardness test.
#   A homeowner who wants a certified lab report may need a different route [judgment].
# - misting_system is new_job_type: the category routes "misting system" and the kb has no misting id. It
#   covers both new installs and repairs (the bank's new_or_repair question splits them). The kb has no
#   patio or pump photo, so photos_priority is empty; adding p5_patio (patio cover, wall, nearest outlet and
#   hose bib) and p6_mist_pump to the kb file would help.
# - Misting is in two license scopes: R-54 lists "misting systems" and R-21 item 11 lists "residential outdoor
#   misting systems ... not more than 1000 PSI" (A.A.C. R4-9-103). This category routes R-54 only, so R-21
#   landscape and hardscape businesses never see misting cards. Decide whether misting cards also reach R-21.
# - loop_install: R-54 allows piping only "as required" for the equipment; new loop or drain piping beyond that
#   may be R-37 plumbing work (kb note, [judgment]). R-37 plumbers do not get these cards because the
#   category routes R-54 only.
# - No Arizona or Lake Havasu City rule on softener brine discharge (outside, to a septic tank) was found;
#   those lines say [judgment].
# - The bank set has no household-size, ownership or water-provider question; fu_household_size,
#   fu_own_or_rent and fu_water_provider carry that weight and are candidates for the bank.
# - kb test t09 (drip irrigation clogged with white crust) belongs to landscaping. No misdiagnosis check is
#   written for it because no follow-up separates it cleanly; the bank system question has no drip answer.
# - No water-treatment lead-cost data was found. Benchmarks below use plumbing figures as a proxy and one 2003
#   dealer trade article; all Lake Havasu figures are unverified.
schema: 1
