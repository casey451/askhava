      figure: "About $40 per appointment at a 33% close rate, so roughly $120 per sale; average dealer spent 4.7% of sales on advertising. Old figures."
      source: wwd_dealer_leads
      unverified: false
    - channel: "Lake Havasu City water treatment businesses specifically"
      figure: "No local figures found; a small market with very hard water may cost less per customer than national figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a lead 3 to 8 other companies also bought", "Homeowners who only want a price over the phone", "Salt-delivery or one-filter requests sold as install jobs [judgment]", "Monthly fees whether or not jobs come", "Being ranked or reviewed by the site itself"]
  what_makes_a_lead_worth_paying_for: ["Loop, drain and outlet known before the first call", "Ownership known (owned, rental, landlord)", "Photos of the unit, label or under the sink", "Water provider stated", "Pay only when picked, nothing monthly"]
  their_words: ["loop", "bypass", "brine tank", "resin tank", "control head", "valve", "grain capacity", "regen", "salt bridge", "injector", "standpipe", "air gap faucet", "drain saddle", "membrane", "pre-filters", "TDS", "mist line", "nozzles", "high-pressure pump"]
  signup_objections:
    - objection: "I sell after an in-home water test. I don't quote off a text."
      answer: "Quote a range and say what puts a job at the high end. The card already tells you the loop, drain, outlet, water provider and household size, so the range can be close. Your quote can say the final price comes after your test."
    - objection: "Why pay $75 or $199 when I can run my own free water test ads?"
      answer: "You pay only when the homeowner picks your quote and you confirm. The fee is set by job size: $25, $75 or $199. Nothing to join, nothing monthly."
    - objection: "Are these shared with every dealer in town?"
      answer: "Every business that does this work and chose this job type gets the card. Only the business the homeowner picks pays, and only that business gets her contact details."
    - objection: "Will you rank me or push the cheapest quote?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license number and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "I only do service and filter changes, not new installs."
      answer: "You pick the job types you want at sign-up and change them any time. Repair and filter cards say so on the first line."
    - objection: "Half the softener calls I get are rental units another company owns."
      answer: "The card says who owns the unit when the homeowner knows: owned, rented from a water company, or the landlord's."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "I do misting too, but I hold R-21, not R-54."
      answer: "Misting cards go to R-54 license holders today. We are reviewing whether R-21 holders should get them too, since R-21 also covers residential outdoor misting."
  quote_tips_for_card: ["Say whether the range includes the equipment or labor only", "Say whether removal and haul-away of the old unit are included", "State the grain size or RO model you would quote, so the homeowner can compare", "For misting, say whether a pump, filter and line material are included", "Give your earliest day"]
