trade_brief:
  price_drivers:
    - driver: "Whether a softener loop, a drain and an outlet are already at the spot"
      why: "A ready loop with a standpipe and outlet is a drop-in swap; no loop means new piping and a drain run, which can be a different license and a much bigger job. [judgment]"
      source: null
    - driver: "New install, replace an old unit, or repair and service"
      why: "An install or replacement prices equipment plus labor; a repair is a service call plus parts. The bank's new_or_repair question settles it. [judgment]"
      source: null
    - driver: "Which system and how big: softener grain capacity for the household, RO with or without a fridge line, misting line length and pump"
      why: "Equipment size is most of an install price; household size and water hardness set the softener size. [judgment]"
      source: null
    - driver: "Water source: city water (about 19 grains), EPCOR (6 to 8 grains) or a private well"
      why: "Hardness sets softener size and salt use; a well usually needs a test before anyone quotes."
      source: lhc_ccr
    - driver: "For RO: sink top material and whether there is a spare hole for the drinking faucet"
      why: "Drilling granite or quartz adds time and risk; a soap dispenser hole or spare sprayer hole avoids it. [judgment]"
      source: null
    - driver: "For misting: hose hookup (low pressure) or a pump system (about 1000 PSI)"
      why: "A high-pressure pump system needs a pump, power and metal or high-pressure line; a low-pressure kit runs off a garden hose."
      source: ams_pumps
    - driver: "Who owns the old unit (owned, rented from a water company, landlord's) and whether it is hauled away"
      why: "A rented unit may have to go back to its company; removal and haul-away add time; a landlord must approve. [judgment]"
      source: null
    - driver: "Brand and model on the label, for repairs and filter changes"
      why: "Parts and filter cartridges are brand-specific; a label photo lets the business bring the right parts on the first trip. [judgment]"
      source: null
  hidden_conditions:
    - condition: "No softener loop, or no drain or outlet near the loop"
      how_a_pro_spots_it: "Loop photo shows a bare wall, or the homeowner says no pipes; a newer production home with the water heater in a closet"
      question_or_photo: loop
      source: null
    - condition: "The unit is rented from a water company or owned by a landlord"
      how_a_pro_spots_it: "Company sticker on the tank in the photo; the homeowner rents the house or pays a monthly bill for the softener"
      question_or_photo: fu_own_or_rent
      source: null
    - condition: "Bypass valve left in bypass after other plumbing or water heater work"
      how_a_pro_spots_it: "Hard water came back right after other work; handle position in the unit photo"
      question_or_photo: fu_recent_change
      source: null
    - condition: "Shutoff, bypass and RO feed valves crusted with scale that will not turn or that snap"
      how_a_pro_spots_it: "White or green crust on valves and fittings in the photo; older unit on city water at about 19 grains"
      question_or_photo: p3_under_sink
      source: lhc_ccr
    - condition: "Softener drain line running outside into a planter or yard, or into a septic tank"
      how_a_pro_spots_it: "Drain hose leaving through the garage wall in the unit photo; outlying lot on septic"
      question_or_photo: p1_unit
      source: null
    - condition: "Stone counter with no spare hole for an RO drinking faucet"
      how_a_pro_spots_it: "Sink-top photo shows one faucet hole and no soap dispenser; granite or quartz edge"
      question_or_photo: fu_spare_hole
      source: null
    - condition: "Equipment outside in the sun, with a cracked or faded tank or a cooked control head"
      how_a_pro_spots_it: "Unit photo shows it on a side yard slab or against an outside wall; common on older and manufactured homes [judgment]"
      question_or_photo: p1_unit
      source: null
    - condition: "No outlet on or near the patio for a misting pump"
      how_a_pro_spots_it: "The homeowner says the nearest outlet is inside or across the house; a pump system needs power the misting business may not run"
      question_or_photo: fu_mist_power
      source: null
  misdiagnosis_checks:
    - sounds_like: "softener install (softener leaking, needs replacing)"
      might_be: "slab_leak or leak_slow in plumbing, with the softener only where the wet spot shows"
      one_question: fu_softener_doing
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "softener install (white spots on glass and fixtures)"
      might_be: "hard_water glass cleaning, a different category"
      one_question: fu_treat_or_clean
      if_other_route_to: {category: window_cleaning, job_type: "hard-water removal"}
      source: null
    - sounds_like: "softener_replace (homeowner says the softener died)"
      might_be: "softener_repair (bypass left on, salt, a reset after a power outage)"
      one_question: fu_recent_change
      if_other_route_to: {category: water_treatment, job_type: "softener install"}
      source: null
    - sounds_like: "ro_service (drinking water tastes bad)"
      might_be: "whole_house_filter, when the taste is at every tap and not only the RO faucet"
      one_question: fu_taste_where
      if_other_route_to: {category: water_treatment, job_type: "softener install"}
      source: null
    - sounds_like: "misting system (new install with a pump)"
      might_be: "new outdoor outlet or circuit, a separate electrical card"
      one_question: fu_mist_power
      if_other_route_to: {category: electrical, job_type: "new circuit"}
      source: null
  photo_reading:
    - photo_id: p1_unit
      reads: ["Control head make and style (Fleck, Clack, Autotrol style or a dealer brand)", "Display lit or blank, error shown", "Salt level, crust, or water standing high in the brine tank", "Bypass handle position", "Drain line to a standpipe, laundry box or outside wall", "Rust, cracks or sun fading on the tanks", "Company sticker on the tank", "Wet floor and where it is"]
      neutral_wording: "Two-tank softener in the garage with a lit display; brine tank lid off, salt about half full; drain hose runs to a white standpipe."
    - photo_id: p2_loop
      reads: ["Two capped pipes in the wall (loop stubs) or none", "Distance to the water heater", "Standpipe, laundry box or floor drain nearby", "Outlet within cord reach", "Pipe material (copper, PEX, CPVC)"]
      neutral_wording: "Two capped copper pipes in the garage wall beside the water heater; outlet about 3 feet away; no drain in view."
    - photo_id: p3_under_sink
      reads: ["Room for an RO tank on one side", "Cold supply valve and its condition", "Drain pipe and a disposal", "Existing RO canisters and their color", "Damp cabinet floor or a towel", "Spare hole or soap dispenser on the sink top", "Counter material at the edge"]
      neutral_wording: "Disposal on the left, open space on the right; white crust on the cold valve; stone counter with one faucet hole and a soap dispenser."
    - photo_id: p4_label
      reads: ["Brand, model and serial", "Grain capacity (for example 32,000 or 48,000)", "Install or manufacture date", "RO filter stage labels"]
      neutral_wording: "Label shows a 48,000 grain softener; date on the label is worn."
  local_factors:
    - fact: "City water averages about 19 grains per gallon hardness (range 18 to 20) and 753 ppm TDS"
      effect: "Softeners and RO are common; scale crusts valves and fittings, and pros size softeners for this hardness"
      source: lhc_ccr
    - fact: "EPCOR's Lake Havasu system reports 6 to 8 grains per gallon and serves mostly unincorporated areas north of the city"
      effect: "The same softener question needs the water provider before a business can size it"
      source: epcor_lh
    - fact: "City water is pumped by wells tied to the Colorado River aquifer and is treated for arsenic, manganese and iron"
      effect: "Homeowners ask about arsenic and taste; Ask Hava makes no health claim and points to the city report [judgment]"
      source: lhc_water
    - fact: "City water has about 150 ppm sodium before any softener"
      effect: "Homeowners ask about salt in softened water; the card notes the question and Ask Hava gives no health answer [judgment]"
      source: lhc_ccr
    - fact: "Lake Havasu City lists water softeners and RO systems as no-permit work; added plumbing fixtures and re-pipes need a permit"
      effect: "A like-for-like swap on a loop needs no permit; new loop piping may be permit-type plumbing work [judgment on where a loop falls]"
      source: lhc_permits
    - fact: "The city requires a pressure regulator and under 60 PSI entering the home"
      effect: "Matters to RO and softener specs and to misting pumps fed from house pressure [judgment]"
      source: lhc_water
    - fact: "Softeners use about 15 to 120 gallons to regenerate per 1,000 gallons softened; the extension suggests leaving the kitchen faucet and outside faucets off the softener"
      effect: "Pros ask whether the loop feeds outside hose bibs and the kitchen cold tap; it changes the plumbing and the unit size"
      source: ua_water_wise
    - fact: "A misting system uses about 2 gallons a minute per 1,000 sq ft of patio, and hard water clogs high-pressure nozzles"
      effect: "Misting businesses ask about patio size and often quote a filter or scale inhibitor on the feed"
      source: aermist_hard_water
  seasonality:
    busy: "Misting: March to June, before and into the heat. Softeners and RO: steady, with a bump from home sales and seasonal residents returning in October and November [judgment]"
    slow: "Misting: November to February. Softeners: midsummer, when seasonal homes sit empty [judgment]"
    source: null

job_types:
  - id: softener_new
    label: "Install a new water softener where none is now"
    bank_job_type: "softener install"
    recurring: false
    homeowner_phrasings: ["want a water softener", "hard water", "white spots on everything", "new house needs a softener", "suavizador de agua"]
    must_know:
      - fact: "Whether a softener loop is already in the wall"
        bank_question: loop
        follow_up: null
        photo: p2_loop
        why_it_moves_price: "A loop makes it a drop-in install; no loop means new piping and possibly a plumber. [judgment]"
        skip_if: "Loop photo sent"
      - fact: "Whether a drain and an outlet are near the spot"
        bank_question: null
        follow_up: fu_drain_outlet
        photo: p2_loop
        why_it_moves_price: "No drain means running a drain line; no outlet means a long cord or an electrician. [judgment]"
        skip_if: "Loop photo shows both"
      - fact: "How many people live in the home"
        bank_question: null
        follow_up: fu_household_size
        photo: null
        why_it_moves_price: "Household size and hardness set the grain capacity, which sets the unit price. [judgment]"
        skip_if: "Homeowner gave the household size"
      - fact: "Water provider: city, EPCOR or well"
        bank_question: null
        follow_up: fu_water_provider
        photo: null
        why_it_moves_price: "City water is about 19 grains and EPCOR 6 to 8; a well usually needs a test first. [src:lhc_ccr] [src:epcor_lh]"
        skip_if: "Homeowner named the town and it is inside city water service [judgment]"
    allowed_follow_ups:
      - id: fu_treat_or_clean
        ask_when: "Homeowner mentions spots or crust on glass, faucets or the shower and does not say she wants equipment"
        text_en: "Are you looking for equipment to treat the water, or cleaning of the spots that are there now?"
        text_es: "¿Busca un equipo para tratar el agua, o limpiar las manchas que ya están?"
        options_en: ["Equipment to treat the water", "Cleaning the spots now", "Both"]
        options_es: ["Un equipo para tratar el agua", "Limpiar las manchas ahora", "Las dos cosas"]
        card_field: true
        why: "Cleaning spots off glass is window cleaning work, a different category; equipment stays here. [judgment]"
      - id: fu_drain_outlet
        ask_when: "No loop photo, and the homeowner did not say what is near the spot"
        text_en: "Near where the softener would go, is there a drain and an outlet?"
        text_es: "¿Cerca de donde iría el suavizador, hay un desagüe y un enchufe?"
        options_en: ["Both", "Drain only", "Outlet only", "Neither"]
        options_es: ["Los dos", "Solo desagüe", "Solo enchufe", "Ninguno"]
        card_field: true
        why: "A softener needs a drain for the rinse water and power for the control; missing either adds work. [judgment]"
      - id: fu_household_size
        ask_when: "New or replacement softener and the homeowner did not say how many people live there"
        text_en: "How many people live in the home?"
        text_es: "¿Cuántas personas viven en la casa?"
        options_en: ["1 or 2", "3 or 4", "5 or more"]
        options_es: ["1 o 2", "3 o 4", "5 o más"]
        card_field: true
        why: "The first number a softener estimator writes down after hardness. [judgment]"
      - id: fu_water_provider
        ask_when: "The town or area leaves the water provider unclear, or she mentions a well"
        text_en: "Who provides your water?"
        text_es: "¿Quién le da el servicio de agua?"
        options_en: ["Lake Havasu City", "EPCOR", "Private well", "Other"]
        options_es: ["Lake Havasu City", "EPCOR", "Pozo privado", "Otro"]
        card_field: true
        why: "Hardness differs a lot between the city and EPCOR; a well changes the job. [src:lhc_ccr] [src:epcor_lh]"
    photos_priority: [p2_loop]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: []
      regular: "All new installs"
    scope_line_en: "New water softener for the garage; two capped pipes in the wall by the water heater; city water, 4 people."
    scope_line_es: "Suavizador de agua nuevo para la cochera; dos tubos tapados en la pared junto al calentador; agua de la ciudad, 4 personas."
    quote_format: range
    business_fills: ["low and high end of the range", "what puts it at the high end (unit size, piping, drain run)", "earliest day"]
    card_template: |
      REQ-<id> | Water treatment | <town>, <general area> | <kind of place>
      <one scope line: new softener, where it would go>
      Loop: <pipes there / no pipes / not sure>. Drain and outlet at the spot: <both / drain only / outlet only / neither>.
      Water: <city / EPCOR / well / not said>. People in the home: <count band>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["You definitely need a softener with water this hard.", "A softener will protect your water heater.", "Get a 48,000 grain unit.", "Softeners run a couple thousand installed.", "Salt-free systems don't really work."]

  - id: softener_repair
    label: "Softener not working: not using salt, water high in the salt tank, beeping or error, leaking, hard water back"
    bank_job_type: "softener install"
    recurring: false
    homeowner_phrasings: ["softener not using salt", "softener beeping", "brine tank full of water", "spots are back", "water thing in the garage isn't working", "el suavizador no sirve"]
    must_know:
      - fact: "What the softener is doing"
        bank_question: new_or_repair
        follow_up: fu_softener_doing
        photo: p1_unit
        why_it_moves_price: "A reset or salt visit is short; a leaking tank or failed control means parts or a new unit. [judgment]"
        skip_if: "Homeowner's words say which"
      - fact: "What the salt tank looks like inside"
        bank_question: null
        follow_up: fu_salt_tank
        photo: p1_unit
        why_it_moves_price: "Tells the business whether to plan a service visit or bring parts, without naming a cause. [judgment]"
        skip_if: "Unit photo shows inside the salt tank and she said how the salt feels"
      - fact: "Brand, model and age"
        bank_question: null
        follow_up: null
        photo: p4_label
        why_it_moves_price: "Control heads take brand-specific parts; an old unit may get a replace quote too. [judgment]"
        skip_if: "Label photo sent or homeowner gave the brand"
      - fact: "Whether anything changed when it started (plumbing work, power outage)"
        bank_question: null
        follow_up: fu_recent_change
        photo: null
        why_it_moves_price: "Work nearby or an outage often turns a feared replacement into a short visit. [judgment]"
        skip_if: "Homeowner said nothing changed"
      - fact: "Who owns the unit"
        bank_question: null
        follow_up: fu_own_or_rent
        photo: p1_unit
        why_it_moves_price: "A rented unit may be serviced only by its company; a landlord must approve and pay. [judgment]"
        skip_if: "Homeowner owns the house and bought the unit"
    allowed_follow_ups:
      - id: fu_softener_doing
        ask_when: "Homeowner says the softener has a problem without saying what it does, or mentions water on the floor"
        text_en: "What have you noticed with the softener?"
        text_es: "¿Qué ha notado con el suavizador?"
        options_en: ["Hard water or spots are back", "Beeping or an error on the screen", "Leaking from the unit or a hose", "Floor wet around it, unit looks dry", "Runs or drains all the time"]
        options_es: ["Volvió el agua dura o las manchas", "Pita o sale un error en la pantalla", "Gotea del equipo o de una manguera", "El piso está mojado alrededor y el equipo se ve seco", "Corre o drena todo el tiempo"]
        card_field: true
        why: "Separates softener work from a plumbing leak that only shows by the softener, without naming either. [judgment]"
      - id: fu_salt_tank
        ask_when: "Softener repair and no photo of the inside of the salt tank"
        text_en: "When you lift the salt tank lid, what do you see?"
        text_es: "Cuando levanta la tapa del tanque de sal, ¿qué ve?"
        options_en: ["Loose salt, about normal", "Salt looks full but feels hard", "Little or no salt", "Water standing high"]
        options_es: ["Sal suelta, como siempre", "Se ve llena pero se siente dura", "Poca o nada de sal", "Agua muy alta"]
        card_field: true
        why: "These are the first things a softener tech asks on the phone. [judgment]"
      - id: fu_recent_change
        ask_when: "Hard water came back, or the homeowner says the unit died, and she did not say when it started"
