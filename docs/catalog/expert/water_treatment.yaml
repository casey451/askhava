business_side:
  how_they_get_customers: ["Free in-home water tests and demos [judgment]", "Google Maps listing and reviews", "Repeat service and salt or filter delivery routes [judgment]", "Referrals from plumbers, realtors and home inspectors [judgment]", "Home shows, mailers and local Facebook groups [judgment]", "Home-service lead marketplaces"]
