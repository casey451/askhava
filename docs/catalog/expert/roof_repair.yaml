# Ask Hava expert layer: roof_repair (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set roof_repair and trade_kb/trades/roofing.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The category has three job types (leak repair, tile replacement, re-roof); the kb has eleven. Mapping:
#   active_leak, leak_repair, foam_coating, shingle_repair, storm_damage, roof_inspection, flashing_skylight
#   -> "leak repair"; tile_repair -> "tile replacement"; reroof, tile_underlayment, manufactured_home_roof -> "re-roof".
#   A whole-roof foam recoat is closer in size to a re-roof than to a leak repair; consider a "foam recoat" job type.
#   A roof check has no close home; it is kept under "leak repair" because roofers do them and quote a range,
#   but a "roof check" job type would route it more cleanly.
# - Businesses opt in by job type, not by roof type, so a tile-only or foam-only roofer gets every roof type's
#   cards. The card states the roof type on its first lines. A roof-type filter at sign-up would help.
# - Manufactured-home roof-overs add a structure. A.A.C. R4-34-204 gives attached accessory structures to
#   Department of Housing installers (I-10C, I-10D); the rule does not name roof-overs, so whether a roof-over
#   is R-42 work is [judgment]. roof_repair has no refused row, so roof-over cards go to R-42 roofers today.
#   Worth a license_map or refused-row decision.
# - The bank set has no "Is water coming in right now?" and no roof age (kb q5, q6). Both are carried here as
#   follow-ups (fu_wet_now, fu_roof_age), but only one follow-up is allowed per request. Adding roof age to
#   the bank would free the follow-up for the job-specific question.
# - The bank photo list is p1 to p3; kb p4 (attic) is read in photo_reading but not in any photos_priority.
# - hvac_repair has no water-leak job type, so an AC drip routes to "AC not cooling".
# - IRC R908 re-cover limits (layers, tile) could not be read (ICC paywall); the layering point is [judgment].
