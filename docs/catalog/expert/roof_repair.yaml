  - id: manufactured_home_roof
    label: "Manufactured or mobile home roof: recoat, seam repair or roof-over"
    bank_job_type: "re-roof"
    recurring: false
    homeowner_phrasings: ["mobile home roof needs coating", "trailer roof leaks at the seams", "want a roof-over on my manufactured home", "rumble roof is loud and leaks"]
    must_know:
      - fact: "What she wants: recoat or seal, a leak or seam repair, or a roof-over"
        bank_question: null
        follow_up: fu_mh_what
        photo: p2
        why_it_moves_price: "A recoat is a day or two of roofing; a roof-over adds framing and may need a Department of Housing installer. [judgment on roof-overs]"
        skip_if: "Homeowner said which"
      - fact: "What the roof is now"
        bank_question: null
        follow_up: fu_mh_roof_now
        photo: p2
        why_it_moves_price: "Bare metal, coated metal, shingles and an older roof-over each take different prep. [judgment]"
        skip_if: "Outside photo shows it"
      - fact: "Year the home was built"
        bank_question: null
        follow_up: fu_mh_year
        photo: null
        why_it_moves_price: "Older mobile homes have lighter roof framing, which limits what can go on top. [judgment]"
        skip_if: "Homeowner gave the year"
      - fact: "Home size"
        bank_question: home_size
        follow_up: null
        photo: null
        why_it_moves_price: "Single-wide or double-wide sets the area. [judgment]"
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_mh_what
        ask_when: "Manufactured home roof request without saying what work is wanted"
        text_en: "What would you like done: recoat or seal the roof, fix a leak or seam, or add a new roof over the old one?"
        text_es: "¿Qué quiere que se haga: recubrir o sellar el techo, arreglar una gotera o costura, o poner un techo nuevo encima del viejo?"
        options_en: ["Recoat or seal", "Fix a leak or seam", "Add a roof-over"]
        options_es: ["Recubrir o sellar", "Arreglar una gotera o costura", "Poner un techo encima"]
        card_field: true
        why: "A roof-over adds a structure, which may fall under Department of Housing installer classes (A.A.C. R4-34-204 covers attached accessory structures). [judgment on roof-overs]"
      - id: fu_mh_roof_now
        ask_when: "Manufactured home roof and no outside photo shows the roof surface"
        text_en: "What is the roof now: bare metal, coated metal, shingles, or a roof-over added before?"
        text_es: "¿Cómo es el techo ahora: metal sin cubrir, metal con capa, tejamanil, o ya tiene un techo encima?"
        options_en: ["Bare metal", "Coated (white or gray)", "Shingles", "Already has a roof-over"]
        options_es: ["Metal sin cubrir", "Con capa (blanca o gris)", "Tejamanil", "Ya tiene un techo encima"]
        card_field: true
        why: "The surface sets the prep and the coating or covering that will bond. [judgment]"
      - id: fu_mh_year
        ask_when: "Roof-over or full recoat on a manufactured home and the year built is not known"
        text_en: "About what year was the home built: before 1976, or 1976 or later?"
        text_es: "¿Más o menos de qué año es la casa: antes de 1976, o de 1976 en adelante?"
        options_en: ["Before 1976", "1976 or later"]
        options_es: ["Antes de 1976", "De 1976 en adelante"]
        card_field: true
        why: "Homes built before the June 1976 federal manufactured home code have their own state rules and lighter framing. [judgment]"
    photos_priority: [p2, p3, p1]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Water dripping inside now"]
      regular: "Recoat, seam repair or roof-over planning"
    scope_line_en: "Recoat the metal roof on a single-wide manufactured home; seams leak in heavy rain; built 1985."
    scope_line_es: "Recubrir el techo de metal de una casa prefabricada sencilla; las costuras gotean con lluvia fuerte; construida en 1985."
    quote_format: range
    business_fills: ["low and high price", "what the range covers (prep, coating type, seams, roof-over framing)", "earliest day", "Range to be confirmed on site, if needed"]
    card_template: |
      REQ-<id> | Roof repair | <town>, <general area> | manufactured home
      <one scope line: work wanted, roof now, leak or not>
      Wanted: <recoat or seal / leak or seam / roof-over>. Roof now: <bare metal / coated / shingles / has a roof-over>. Built: <before 1976 / 1976 or later / not said>.
      Size: <home size band>. Water inside: <shows in, or none>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Roll on some elastomeric and you're set.", "A roof-over is the way to go.", "Older trailers can't take a new roof.", "Coatings run about a dollar a foot."]

  - id: roof_inspection
