  - id: flashing_skylight
    label: "Leak at a skylight, vent, AC or cooler curb, chimney or roof-to-wall joint"
    bank_job_type: "leak repair"
    recurring: false
    homeowner_phrasings: ["skylight leaks when it rains", "leak around the vent pipe", "water coming in around the AC on the roof", "leak where the patio roof meets the house"]
    must_know:
      - fact: "Where the water seems to come in"
        bank_question: leak_where
        follow_up: fu_flashing_where
        photo: p2
        why_it_moves_price: "Each roof feature is flashed differently, and a unit curb may need the unit lifted. [judgment]"
        skip_if: "Homeowner named the spot"
      - fact: "Whether it follows rain or the AC or cooler running"
        bank_question: null
        follow_up: fu_when_wet
        photo: null
        why_it_moves_price: "A drip only when the unit runs is HVAC work, not flashing. [judgment]"
        skip_if: "Homeowner said only in rain"
      - fact: "Roof type"
        bank_question: roof_type
        follow_up: null
        photo: p3
        why_it_moves_price: "Tile around a skylight means lifting and resetting tile; foam is cut and refoamed. [judgment]"
        skip_if: "Named or shown"
      - fact: "Roof age"
        bank_question: null
        follow_up: fu_roof_age
        photo: null
        why_it_moves_price: "Old underlayment around the feature often fails with the flashing. [judgment]"
        skip_if: "Homeowner gave the age"
