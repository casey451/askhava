trade_brief:
  price_drivers:
    - driver: "Scope: one spot, several spots, an underlayment lift-and-relay, or a full re-roof"
      why: "A patch is hours; a lift-and-relay or re-roof is days of crew time priced by the square. The bank's problem question and the follow-ups settle which. [judgment]"
      source: null
    - driver: "Roof type: concrete or clay tile, flat foam or coating, asphalt shingle, metal"
      why: "Each is a different crew, material and method; a foam roofer and a tile roofer quote different work for the same stain. [judgment]"
      source: null
    - driver: "Roof area and pitch: home size and stories"
      why: "Area sets material and labor in every whole-roof quote; two-story and steep roofs add setup and time. [judgment]"
      source: null
    - driver: "Roof age, which on a tile roof stands in for underlayment condition"
      why: "The tile sheds most water and the underlayment is the secondary barrier; tile should not go back over compromised underlayment, so an old roof turns a tile repair into an underlayment job."
      source: tri_post_storm
    - driver: "What is mounted on the roof: solar panels, a package AC unit, a swamp cooler, skylights"
      why: "R-42 may lift HVAC units but duct changes go to a subcontractor; solar must come off and go back on, usually by another trade. Both add days. [judgment on solar]"
      source: aac_r4_9_103
    - driver: "Rotted deck or sheathing found once tile or shingles come off"
      why: "R-42 may replace only up to 10 percent of the roof substrate found after the contract; more goes to a subcontractor, and sheathing replacement needs a city permit."
      source: aac_r4_9_103
    - driver: "Whether matching tile can be found for an older profile"
      why: "Replacement tiles must interlock with the old ones, some profiles are no longer made, and salvage or harvested tile adds labor."
      source: tri_tile_replacement
    - driver: "Water coming in now (same-day tarp or dry-in visit) versus a scheduled repair, and monsoon backlog"
      why: "Active leaks during monsoon get a premium and crews are booked out after big storms. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Underlayment under the tile is dried out and cracked, so the leak repair becomes a lift-and-relay"
      how_a_pro_spots_it: "Roof age over about 20 years, black underlayment visible between slipped tiles in a close-up, stains in several rooms"
      question_or_photo: fu_roof_age
      source: tri_post_storm
    - condition: "Rotted roof deck beyond the 10 percent an R-42 roofer may replace, which brings a subcontractor and a city permit"
      how_a_pro_spots_it: "Sagging roof line in the outside photo, a leak that ran for months in a vacant home, daylight or dark wood in an attic photo"
      question_or_photo: p2
      source: aac_r4_9_103
    - condition: "The tile profile is out of production, so spares, salvage tile or harvesting from another slope is needed"
      how_a_pro_spots_it: "Older home, an unusual tile shape or color in the close-up, no spare tiles on site"
      question_or_photo: fu_spare_tiles
      source: tri_tile_replacement
    - condition: "Solar panels or a rooftop AC or cooler sit over the work area"
      how_a_pro_spots_it: "Panels or units in the outside photo; the homeowner's answer on what is mounted"
      question_or_photo: fu_roof_equipment
      source: null
    - condition: "Wet foam under the coating on a flat roof, which turns a recoat into a partial tear-off"
      how_a_pro_spots_it: "Bare or worn coating, blisters or soft spots in the close-up; last coat over 10 years ago"
      question_or_photo: fu_last_coat
      source: ibhs_spf
    - condition: "Interior damage past the roofer's scope (wet drywall, matted insulation, stained ceiling texture)"
      how_a_pro_spots_it: "Inside photo shows a large or sagging stain; the card says how long it has leaked"
      question_or_photo: p1
      source: null
    - condition: "Two or more layers of shingles already on the roof, so any replacement is a full tear-off"
      how_a_pro_spots_it: "Thick, wavy roof edge in the outside photo; homeowner's answer on layers"
      question_or_photo: fu_layers
      source: null
    - condition: "Water travels along the underlayment or framing, so the stain is far from where it gets in"
      how_a_pro_spots_it: "Stain in several rooms, or on an inside wall away from any roof feature"
      question_or_photo: leak_where
      source: null
  misdiagnosis_checks:
    - sounds_like: "leak repair (ceiling stain under a bathroom or a room above)"
      might_be: "plumbing leak (plumbing kb leak_slow)"
      one_question: fu_when_wet
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "leak repair (ceiling drip in summer with no rain, near a vent or the attic unit)"
      might_be: "ac_leaking_water (hvac kb), a different category"
      one_question: fu_when_wet
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "flashing_skylight (water around the swamp cooler on the roof)"
      might_be: "cooler_leak or cooler_overflow (evaporative_coolers kb), a different category"
      one_question: fu_when_wet
      if_other_route_to: {category: hvac_repair, job_type: "evaporative (swamp) cooler repair"}
      source: null
    - sounds_like: "tile replacement (a few broken tiles and a leak inside)"
      might_be: "tile_underlayment (worn underlayment under the tile)"
      one_question: fu_roof_age
      if_other_route_to: {category: roof_repair, job_type: "re-roof"}
      source: tri_post_storm
    - sounds_like: "re-roof (wants a new roof after one leak)"
      might_be: "leak_repair"
      one_question: fu_why_new
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "roof_inspection (roof check before a sale)"
      might_be: "pre_listing (home_inspection kb), a full home inspection"
      one_question: fu_check_scope
      if_other_route_to: {category: home_inspection, job_type: "pre-listing inspection"}
      source: null
  photo_reading:
    - photo_id: p1
      reads: ["Size and spread of the stain", "Sagging or bulging drywall", "Stain near a vent, light, skylight or outside wall", "Rings that show repeat wetting"]
      neutral_wording: "Brown ring stain about 2 feet across on the hallway ceiling near a vent; drywall looks flat."
    - photo_id: p2
      reads: ["Roof type and tile shape (flat, S-shaped, barrel)", "Stories and pitch", "Solar panels, AC unit, cooler or skylights on the roof", "Sagging ridge or roof line", "Flat sections and patio covers"]
      neutral_wording: "S-shaped concrete tile on a one-story pitched roof; swamp cooler on the back slope; solar panels on the south side."
    - photo_id: p3
      reads: ["Cracked or slipped tiles and about how many", "Black underlayment showing between tiles", "Blisters, cracks or bare foam on a flat roof", "Lifted or missing shingles", "Rust or open seams on metal"]
      neutral_wording: "Four cracked tiles near the front edge, with dark underlayment showing in one gap."
    - photo_id: p4
      reads: ["Wet or stained roof deck", "Daylight through the deck", "Wet or matted insulation"]
      neutral_wording: "Dark stained wood on the underside of the roof above the hallway; insulation below looks matted."
  local_factors:
    - fact: "Monsoon season officially runs June 15 to September 30, with downbursts and outflow winds of 50 mph or more"
      effect: "Wind-lifted tile, blown shingles and debris calls arrive in bursts after storms, and active-leak cards cluster on storm nights"
      source: nws_monsoon
    - fact: "Lake Havasu City needs no permit to replace roof covering but does to replace roof sheathing"
      effect: "A covering-only re-roof has no permit line in the quote; deck rot found on tear-off can add one"
      source: lhc_permits
    - fact: "The city's IRC amendment exempts in-kind reroofing when sheathing replaced is 25 percent of roof area or less"
      effect: "Roofers price a permit only when deck replacement runs past that share or the roof type changes"
      source: lhc_irc_amend
    - fact: "Roofing needs ROC R-42, the dual CR-42 or a B general license; R-42 may replace up to 10 percent of substrate found after contract"
      effect: "Roofing rarely fits the handyman exemption (most jobs run over $1,000), and big deck repairs bring in a subcontractor"
      source: aac_r4_9_103
    - fact: "The handyman exemption covers only work under $1,000 with no permit"
      effect: "This category takes no handyman cards; even a few slipped tiles go to licensed roofers"
      source: ars_32_1121
    - fact: "Department of Housing installer classes I-10C and I-10D install accessory structures attached to manufactured homes"
      effect: "A manufactured-home roof-over may need an installer license as well as roofing skill [judgment on roof-overs]"
      source: aac_r4_34_204
    - fact: "Spray foam roofs are checked in spring and fall, and their coatings are re-applied every 10 to 20 years"
      effect: "The last coat date is the first thing a foam roofer asks; a worn coating exposes foam to sun damage"
      source: ibhs_spf
    - fact: "Most homes have concrete or clay tile on pitched roofs, with foam or coated flat sections over back rooms and patios; rooftop coolers, package AC units and solar are common"
      effect: "The card should say what is on the roof, since every unit is a flashing point and solar adds a trade [judgment]"
      source: null
    - fact: "Many second homes sit empty for months, and seasonal residents find leaks when they return in the fall"
      effect: "Damage may be large by the time a roofer sees it; October brings a wave of past-leak requests [judgment]"
      source: null
    - fact: "Summer roof surfaces get very hot; crews start at dawn and re-roof output drops in July and August"
      effect: "Re-roof start dates stretch in summer and quotes may give later earliest days [judgment]"
      source: null
    - fact: "Many HOAs in the area approve tile color and profile before a re-roof"
      effect: "Changing roof type or color can add an HOA step before work starts [judgment]"
      source: null
  seasonality:
    busy: "Leak and storm calls July to September (monsoon, officially June 15 to September 30); re-roof and underlayment work October to April, when roofs are cooler and seasonal residents are in town [judgment on re-roof timing]"
    slow: "May to June for repair calls (dry and hot) [judgment]"
    source: nws_monsoon

job_types:
  - id: active_leak
    label: "Water coming through the ceiling now (during or right after rain)"
    bank_job_type: "leak repair"
    recurring: false
    homeowner_phrasings: ["roof leaking right now", "water coming through the ceiling", "bucket is filling up", "dripping out of the ceiling light"]
    must_know:
      - fact: "Roof type"
        bank_question: roof_type
        follow_up: null
        photo: p2
        why_it_moves_price: "Tile, foam, shingle and metal take different crews and materials, even for a same-day dry-in. [judgment]"
        skip_if: "Homeowner named the roof type or the outside photo shows it"
      - fact: "Where the water shows, and in how many rooms"
        bank_question: leak_where
        follow_up: null
        photo: p1
        why_it_moves_price: "One room near a vent or wall is a spot repair; several rooms points at a wider roof or underlayment job. [judgment]"
        skip_if: "Homeowner said where and the inside photo shows it"
      - fact: "Whether the ceiling is flat, sagging, or dripping at a light or fan"
        bank_question: null
        follow_up: fu_ceiling_state
        photo: p1
        why_it_moves_price: "A sagging ceiling or water at a fixture makes it a same-day call and can bring drywall and electrical trades into the job. [judgment]"
        skip_if: "Inside photo shows the ceiling clearly"
      - fact: "Roof age"
        bank_question: null
        follow_up: fu_roof_age
        photo: null
        why_it_moves_price: "An older tile roof leaking now often ends in an underlayment quote after the emergency visit. [judgment]"
        skip_if: "Homeowner gave the age"
      - fact: "Stories"
        bank_question: stories
        follow_up: null
        photo: p2
        why_it_moves_price: "A two-story or steep roof is a harder call-out in rain. [judgment]"
        skip_if: "Answered or the outside photo shows it"
    allowed_follow_ups:
      - id: fu_ceiling_state
        ask_when: "Water is coming in now and no inside photo shows the ceiling"
        text_en: "Is the ceiling where the water shows flat, sagging, or dripping from a light or fan?"
        text_es: "¿La parte del techo de adentro donde sale el agua está plana, colgando, o gotea de una lámpara o ventilador?"
        options_en: ["Flat, just wet or stained", "Sagging or bulging", "Dripping from a light or fan"]
        options_es: ["Plana, solo mojada o manchada", "Colgando o inflada", "Gotea de una lámpara o ventilador"]
        card_field: true
        why: "These are the facts a roofer asks before deciding how fast to come and whether another trade is needed. [judgment]"
      - id: fu_when_wet
        ask_when: "Homeowner reports a stain or drip and has not said whether it follows rain"
        text_en: "When does the wet spot show up: when it rains, when the AC or cooler runs, or when water is used in a room above?"
        text_es: "¿Cuándo aparece la parte mojada: cuando llueve, cuando prende el aire o el cooler, o cuando se usa agua en un cuarto de arriba?"
        options_en: ["When it rains", "When the AC or cooler runs", "When a bathroom or sink above is used", "Any time, no pattern"]
        options_es: ["Cuando llueve", "Cuando prende el aire o el cooler", "Cuando se usa un baño o lavabo de arriba", "En cualquier momento, sin patrón"]
        card_field: true
        why: "Rain points at the roof, AC or cooler use at HVAC, and a room above at plumbing; each is a different category. [judgment]"
      - id: fu_roof_age
        ask_when: "Leak, tile, underlayment, shingle, flashing or roof check request and the homeowner has not said how old the roof is"
        text_en: "About how old is the roof?"
        text_es: "¿Más o menos qué edad tiene el techo?"
        options_en: ["Under 10 years", "10 to 20 years", "Over 20 years"]
        options_es: ["Menos de 10 años", "10 a 20 años", "Más de 20 años"]
        card_field: true
        why: "Underlayment under tile wears out well before the tile does, so age is the first number a tile roofer writes down (TRI Alliance: tile should not be relaid over compromised underlayment)."
    photos_priority: [p1, p2, p3]
    urgency:
      fire_dept_triggers: ["Sparking or burning smell at a light or outlet near the leak"]
      urgent_capable_triggers: ["Water dripping inside now", "Ceiling sagging or bulging with water", "Water dripping from a light or ceiling fan"]
      regular: "Dripping has stopped and the stain is drying"
    scope_line_en: "Water dripping into the living room ceiling during rain right now; concrete tile roof, one story."
    scope_line_es: "Está goteando agua del techo de la sala ahorita con la lluvia; techo de teja de concreto, un piso."
    quote_format: range
    business_fills: ["low and high price", "what the range covers (dry-in visit, repair, or both)", "earliest arrival", "Range to be confirmed on site, if needed"]
    card_template: |
      REQ-<id> | Roof repair | <town>, <general area> | <house / townhome / manufactured home>
      <one scope line: where water shows, coming in now, roof type>
      Roof: <tile / flat or foam / shingle / metal>, <1 / 2 or more> stories, about <home size band>, age <answer or not said>.
      Shows in: <one room / several rooms / garage or patio>. Ceiling: <flat and wet / sagging / dripping at a light or fan>. Wet when: <rain / AC or cooler / room above / no pattern>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["It's probably a cracked tile.", "Put a tarp over it until someone comes.", "Poke a hole in the ceiling to let the water out.", "Roof leaks usually run a few hundred to fix.", "That sounds like the underlayment."]

  - id: leak_repair
    label: "Past leak or ceiling stain, dry now, needs finding and fixing"
    bank_job_type: "leak repair"
    recurring: false
    homeowner_phrasings: ["brown stain on the ceiling", "leaks every time it rains", "water spot after the monsoon", "ceiling stain, not sure if it's the roof"]
    must_know:
      - fact: "Whether water is coming in now, only in rain, or the stain is old and dry"
        bank_question: null
        follow_up: fu_wet_now
        photo: p1
        why_it_moves_price: "Dripping now is a same-day call; a dry stain is a scheduled visit. [judgment]"
        skip_if: "Homeowner said it is dry or dripping"
      - fact: "Whether the spot follows rain, AC or cooler use, or water use above"
        bank_question: null
        follow_up: fu_when_wet
        photo: null
        why_it_moves_price: "If it is not rain, the job is HVAC or plumbing and a roofer's visit is wasted. [judgment]"
        skip_if: "Homeowner said it shows only after rain"
      - fact: "Roof type"
        bank_question: roof_type
        follow_up: null
        photo: p2
        why_it_moves_price: "Sets the crew and the repair method. [judgment]"
        skip_if: "Named or shown"
      - fact: "Where the stain is, and in how many rooms"
        bank_question: leak_where
        follow_up: null
        photo: p1
        why_it_moves_price: "Several rooms points at a wider job; one spot near a roof feature is a spot repair. [judgment]"
        skip_if: "Answered"
      - fact: "Roof age"
        bank_question: null
        follow_up: fu_roof_age
        photo: null
        why_it_moves_price: "An older tile roof with stains is often quoted as underlayment work. [judgment]"
        skip_if: "Homeowner gave the age"
    allowed_follow_ups:
      - id: fu_wet_now
        ask_when: "Homeowner mentions a stain or leak and has not said whether water is coming in now"
        text_en: "Is water coming in right now, only when it rains, or is it an old dry stain?"
        text_es: "¿Está entrando agua ahorita, solo cuando llueve, o es una mancha vieja y seca?"
        options_en: ["Dripping now", "Only when it rains", "Old stain, dry now"]
        options_es: ["Gotea ahorita", "Solo cuando llueve", "Mancha vieja, seca"]
        card_field: true
        why: "Moves the request between the active and past leak job types and tells the business how fast to come. [judgment]"
      - fu_when_wet
      - fu_roof_age
    photos_priority: [p1, p2, p3]
    urgency:
      fire_dept_triggers: []
