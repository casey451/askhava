business_side:
  how_they_get_customers: ["Google Maps listing and reviews", "Repeat customers and word of mouth", "Realtors, home inspectors and property managers who send roof checks and repairs [judgment]", "Google Local Services Ads and search ads", "Home-service marketplaces (Angi, HomeAdvisor, Thumbtack)", "Yard signs and neighbor calls after monsoon storms [judgment]"]
