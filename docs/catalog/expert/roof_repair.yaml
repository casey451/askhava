      figure: "No local figures found; a small market has fewer bidders, and storm weeks bring more calls than crews"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a roof lead four other roofers also bought", "Tire-kickers who want a re-roof price over the phone", "Out-of-town storm crews buying the same calls after a monsoon", "Monthly fees whether or not jobs come", "Leads with no roof type, size or photos", "Being ranked or reviewed by the lead site itself"]
  what_makes_a_lead_worth_paying_for: ["Roof type, size, stories and age on the card", "Photos of each side from the ground", "Whether solar or rooftop units are in the way", "Whether water is coming in now", "Pay only when picked, nothing monthly", "Insurance claim or not stated up front"]
  their_words: ["square", "tear-off", "lift and relay", "underlayment", "felt", "30-lb", "synthetic", "battens", "bird stop", "flashing", "valley", "drip edge", "cricket", "dry-in", "SPF", "elastomeric", "silicone", "mils", "re-cover", "R and R solar", "curb", "pitch", "decking", "roof cert"]
  signup_objections:
    - objection: "I can't price a roof from a text."
      answer: "You don't give a firm price. Roof quotes here are a low and a high number, and you can tick Range to be confirmed on site. Most cards come with roof type, size, stories and photos from the ground."
    - objection: "Re-roofs are big jobs. What does your fee look like on those?"
      answer: "The fee is set by job size: $25, $75 or $199, based on the middle of your range. It is never a share of the job, and you pay it only when the homeowner picks your quote and you confirm."
    - objection: "Shared-lead sites sold me the same call as four other roofers."
      answer: "Several roofers can quote the same card, but quoting costs nothing. You pay only when the homeowner picks you, and then the job is yours. There is no monthly fee and nothing to join."
    - objection: "During monsoon I'm booked out for weeks."
      answer: "Give your earliest start date on the quote and the homeowner decides. You can pause cards when you're full and turn them back on later."
    - objection: "I don't want leak emails at 2 a.m."
      answer: "Night emergency cards go only to businesses that tick after-hours emergencies. Leave it off and you see night requests at 8 a.m."
    - objection: "I only do tile, not foam or shingles."
      answer: "You pick job types at sign-up: leak repair, tile replacement and re-roof. Each card shows the roof type in its first lines, so you can pass on the ones you don't do. Passing costs nothing."
    - objection: "Do you handle the insurance claim?"
      answer: "No. Ask Hava is not a contractor and does not perform, bid on or supervise work. The card says whether the homeowner is filing a claim, so you can decide whether to quote."
    - objection: "Will you rank me against other roofers?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license numbers and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town, photos and answers to the questions a roofer asks. Names and addresses go only to the business the homeowner picks."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
  quote_tips_for_card: ["Say what the range covers: tear-off, underlayment type, haul-away, and any permit if sheathing is replaced", "If deck condition could move the price, say so and tick Range to be confirmed on site", "Say whether removing and resetting solar or lifting a rooftop unit is in the range", "Give your earliest day, and say if you can dry in an active leak sooner", "If you need a photo of another side or the attic, say which"]
