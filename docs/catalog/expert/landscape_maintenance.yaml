  what_they_dislike_about_lead_services: ["Paying for a lead five other crews also bought", "Price shoppers who want one visit at the lowest price and never sign up", "Monthly fees whether or not jobs come", "Jobs far outside their area", "Leads with no size, no photo and no frequency"]
  what_makes_a_lead_worth_paying_for: ["A whole-yard photo and the yard size before the first call", "Frequency stated, so they know it is an account and not a one-off", "Haul-away stated", "Pay only when picked, nothing monthly", "A fee that stays small on a monthly account"]
  their_words: ["account", "route", "maintenance visit", "cleanup", "haul-off", "dump run", "blow off", "rake out", "hand pull", "pre-emergent", "skin the palm", "seed pods", "overseed", "edging", "green waste"]
  signup_objections:
    - objection: "Most of my work comes from word of mouth. Why pay anything?"
      answer: "You pay only when a homeowner picks your quote and you confirm. There is nothing to join and nothing monthly. If no one picks you, it costs nothing."
    - objection: "How is the fee figured on a monthly account?"
      answer: "A monthly account counts as 4 months of your monthly price, and the fee never goes over $75. A $120-a-month account counts as $480, so the fee is $25. A one-time cleanup is set by its price: $25, $75 or $199 by job size."
    - objection: "Will I be bidding against every crew in town?"
      answer: "The card goes to each local business that opted into that job type. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "Do I need a contractor license for this?"
      answer: "Not for lawn, garden, shrub and tree maintenance. Arizona law exempts gardener work. Watering-system repair and new rock jobs are contractor work and are not sent in this category."
    - objection: "I spray weeds for my customers. Why don't I get those cards?"
      answer: "Arizona's landscaper exemption does not cover pre-emergent or advertised weed control. Those requests go only to businesses that report a state pest-management license."
    - objection: "What if the homeowner cancels after the first month?"
      answer: "If they cancel before you have spoken with them, the fee is refunded. Once you have started service the fee stays, and there is no partial refund if the account ends early."
    - objection: "I can't price a yard without walking it."
      answer: "Most cards carry a whole-yard photo, the size, how often and whether trimmings go. If you need to see something else, say so in your quote."
    - objection: "I don't do palms or one-time cleanups."
      answer: "You choose the job types you take at sign-up and can change them any time. You only get cards for those."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a phone number we check, with a town, photos and answers to the questions a yard crew asks. The address goes only to the business the homeowner picks."
  quote_tips_for_card: ["Say how many visits a month and what each visit covers", "If the first visit is a catch-up cleanup, quote it as a separate one-time line", "Say whether haul-away and dump fees are in the price", "Give your earliest start date"]
