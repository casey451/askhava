trade_brief:
  price_drivers:
    - driver: "How much of the lot is actually worked: rock beds, lawn, planters, side yards, and whether front, back or both"
      why: "Crew-minutes per visit set a monthly price; a small front rock bed and a half-acre lot with a lawn are different accounts. The yard_size answer and the whole-yard photo carry it. [judgment]"
      source: null
    - driver: "Visit frequency: weekly, every two weeks, monthly, or once"
      why: "More visits cost more per month but less per visit, because the yard never gets ahead of the crew; a once-a-month rock yard grows a weed crop between visits. [judgment]"
      source: null
    - driver: "Haul-away: whether trimmings, fronds and weeds leave on the truck"
      why: "Green waste must be bundled to 4 ft or fit the cart, bulk pickup refuses landscaping, and the city landfill charges by weight, so a haul-away adds a dump run and its fee."
      source: lhc_trash
    - driver: "Weed load and how the homeowner wants weeds handled (pulled or cut versus sprayed)"
      why: "Hand-pulling a yard after winter or monsoon rain is slow work; pre-emergent spraying or advertised weed control is outside the landscaper exemption and goes to pest_control."
      source: ars_3_3613
    - driver: "Trimming height and kind: shrubs from the ground versus tall trees or palms"
      why: "Palms and tall trees need a climber or a lift and more cleanup; ground-level shrub trimming does not. [judgment]"
      source: null
    - driver: "Slope, washes and access (hillside lot, steps, locked gate, backyard reached only through a garage)"
      why: "Havasu's hillside lots and washes slow a crew and make raking and hauling harder; a locked gate can cost a wasted trip. [judgment]"
      source: null
    - driver: "Overseeded winter lawn versus dormant bermudagrass"
      why: "Ryegrass sown in October stays green and needs mowing about October through May, while dormant bermudagrass needs little winter mowing, so a lawn account's winter months price differently."
      source: ua_overseed
    - driver: "First visit is a catch-up cleanup (yard left for months, vacant second home)"
      why: "Businesses often quote a one-time cleanup first, then the monthly price; an overgrown start is the most common surprise on a maintenance account. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Yard far more overgrown than the request says, so the first visit is really a cleanup"
      how_a_pro_spots_it: "Whole-yard photo shows weeds through the rock, bushes over walkways, fronds on the ground; homeowner mentions a house empty for the summer"
      question_or_photo: p1
      source: null
    - condition: "Drip leaks, dead zones or a broken line found while raking or mowing"
      how_a_pro_spots_it: "Wet spot or bare dead patch in the photo; the homeowner mentions plants dying or a higher water bill"
      question_or_photo: fu_water_issue
      source: null
    - condition: "Weeds coming up through thin or washed-out rock with torn weed fabric showing"
      how_a_pro_spots_it: "Close-up rock photo shows bare dirt or black fabric between stones; raking alone will not make it look right"
      question_or_photo: p6
      source: null
    - condition: "Homeowner wants new rock brought in, not the existing rock kept up"
      how_a_pro_spots_it: "Words like 'redo the rock' or 'more rock'; thin cover in the photo"
      question_or_photo: fu_rock_new
      source: aac_r4_9_103
    - condition: "Palm fronds or branches over a pool, roof or block wall that need roping down"
      how_a_pro_spots_it: "Whole-yard photo shows a palm leaning over the pool or roof; height answer is over 15 feet"
      question_or_photo: fu_tree_height
      source: null
    - condition: "Branches or fronds near the overhead service line to the house"
      how_a_pro_spots_it: "Wire visible through the canopy in the photo; UniSource puts clearing of service lines on the customer and asks for 15 feet from overhead equipment"
      question_or_photo: fu_near_wires
      source: ues_veg
    - condition: "Steep hillside, wash or terraced lot"
      how_a_pro_spots_it: "Photo taken from the top of a slope; retaining walls or a wash at the back of the lot"
      question_or_photo: fu_slope
      source: null
    - condition: "Locked gate, gate code or dogs in the yard on service day"
      how_a_pro_spots_it: "Homeowner mentions a side gate lock, a seasonal absence or a dog"
      question_or_photo: fu_access
      source: null
  misdiagnosis_checks:
    - sounds_like: "yard cleanup (weeds everywhere)"
      might_be: "weed_control (pest_control trade file): pre-emergent or weed spraying, a pest-license job"
      one_question: fu_weeds_how
      if_other_route_to: {category: pest_control, job_type: "pre-emergent weed control"}
      source: ars_3_3613
    - sounds_like: "gravel raking (regular upkeep, weeds)"
      might_be: "weed_control (pest_control trade file): a monthly spray program, not hand weeding"
      one_question: fu_weeds_how
      if_other_route_to: {category: pest_control, job_type: "pre-emergent weed control"}
      source: ars_3_3613
    - sounds_like: "gravel raking (plants dying, brown patches)"
      might_be: "drip_repair or sprinkler_valve: a watering-system problem, R-21 work"
      one_question: fu_water_issue
      if_other_route_to: {category: pavers_hardscape, job_type: "irrigation install"}
      source: aac_r4_9_103
    - sounds_like: "mowing (lawn going brown in spots)"
      might_be: "sprinkler_valve: a zone or head not watering, R-21 work"
      one_question: fu_water_issue
      if_other_route_to: {category: pavers_hardscape, job_type: "irrigation install"}
      source: aac_r4_9_103
    - sounds_like: "yard cleanup (pile of fronds and branches)"
      might_be: "yard_debris (junk_removal trade file): the cutting is done and only the haul is needed"
      one_question: fu_pile_only
      if_other_route_to: {category: junk_removal, job_type: "junk haul-away"}
      source: null
    - sounds_like: "gravel raking (rock looks bad)"
      might_be: "rock_gravel: new rock delivery and spread, hardscape work with no route in the catalog yet; the answer goes on the card"
      one_question: fu_rock_new
      if_other_route_to: null
      source: aac_r4_9_103
  photo_reading:
    - photo_id: p1
      reads: ["Ground cover: rock, lawn, bare dirt, artificial turf", "How much is worked: beds, planters, side yards", "Weed density and height", "Palms and trees, their height, and what is under them (pool, roof, wall)", "Slope, wash, steps, gate"]
      neutral_wording: "Front yard is mostly rock with weeds coming through along the driveway; two palms by the street."
    - photo_id: p6
      reads: ["Rock size and color", "Cover depth: bare dirt or fabric showing", "Weeds between stones"]
      neutral_wording: "Close-up shows half-inch tan rock with bare dirt showing between stones."
    - photo_id: p2
      reads: ["Controller brand and whether the screen is on", "Zone count"]
      neutral_wording: "Watering timer on the garage wall, screen is on, six zones."
    - photo_id: p3
      reads: ["Valve box or manifold condition", "Water standing in the box"]
      neutral_wording: "Green valve box by the side gate with the lid off; water standing inside."
    - photo_id: p4
      reads: ["Wet spot size and location", "Water near the house or walls"]
      neutral_wording: "Wet patch in the rock about two feet across near the back wall."
  local_factors:
    - fact: "Gardener work, meaning lawn, garden, shrub and tree maintenance, needs no Arizona contractor license"
      effect: "Many small owner-operators and crews do this work; the category takes businesses on the city business-license list only"
      source: ars_32_1121
    - fact: "The landscaper herbicide exemption never covers preemergents or sterilants, advertised or primary weed management, or crews of two or more applicators"
      effect: "Spraying requests leave this category for pest_control; the card here says pulled or cut"
      source: ars_3_3613
    - fact: "Yard waste goes in the cart or in bundles no longer than 4 feet and no larger than 18 inches across; bulk pickup refuses landscaping; the city landfill charges by weight, cash only"
      effect: "Haul-away is a real cost line; pros ask about it on every request"
      source: lhc_trash
    - fact: "60 to 70 percent of the community's water use goes to landscape irrigation and pools"
      effect: "Most yards are rock and desert plants on drip, so 'gravel raking' and weed pulling are the core visit, not mowing [judgment]"
      source: lhc_conservation
    - fact: "City water hardness is about 19 grains per gallon"
      effect: "White crust on drip emitters and fittings shows up during maintenance visits, and crews notice dry plants first [judgment]"
      source: lhc_ccr
    - fact: "Monsoon season runs June 15 to September 30"
      effect: "Wind and storms leave fronds, branches and washed-out rock, so one-time cleanups spike after storms [judgment]"
      source: nws_monsoon
    - fact: "Ryegrass overseeded in October stays green about October through May; bermudagrass goes dormant in winter"
      effect: "Lawn accounts ask whether the lawn is overseeded to price the winter months"
      source: ua_overseed
    - fact: "Customers are responsible for clearing vegetation from their own electric service lines; UniSource asks for 15 feet from overhead equipment and offers a free temporary disconnect"
      effect: "Trimming near the service drop changes how a crew plans the job, so the card notes overhead wires"
      source: ues_veg
    - fact: "Seasonal residents and vacant second homes leave yards unattended for months"
      effect: "Start-of-season requests are often a cleanup plus a monthly account, and gate access must be arranged [judgment]"
      source: null
    - fact: "Hillside lots, washes and hard caliche soil are common"
      effect: "Slope and access slow crews and hauling [judgment]"
      source: null
  seasonality:
    busy: "October to November (snowbirds return, overseeding, fall cleanups) and March to May (spring growth, weeds after winter rain), plus storm cleanups during the June 15 to September 30 monsoon [judgment on the months outside the monsoon dates]"
    slow: "Late December to January for new accounts; July and August mornings only because of heat [judgment]"
    source: nws_monsoon

job_types:
  - id: maintenance
    label: "Regular rock or desert yard upkeep: rake gravel, pull weeds, blow off hard surfaces, pick up debris"
    bank_job_type: "gravel raking"
    recurring: true
    homeowner_phrasings: ["need a yard guy", "rake my rocks", "keep the weeds down every month", "jardinero cada mes", "someone to take care of the yard while we're gone"]
    must_know:
      - fact: "How often the visits should be"
        bank_question: how_often
        follow_up: null
        photo: null
        why_it_moves_price: "Frequency sets the monthly price and how far the yard gets ahead between visits. [judgment]"
        skip_if: "Homeowner already said weekly, every two weeks or monthly"
      - fact: "How big the worked area is and what covers it"
        bank_question: yard_size
        follow_up: null
        photo: p1
        why_it_moves_price: "Crew time per visit is the monthly price. [judgment]"
        skip_if: "Whole-yard photo sent and the homeowner named front, back or both"
      - fact: "Whether weeds are pulled or cut, or the homeowner wants them sprayed"
        bank_question: null
        follow_up: fu_weeds_how
        photo: p1
        why_it_moves_price: "Spraying is a pest-license job and leaves this category; heavy hand weeding adds time."
        skip_if: "Homeowner said pull or did not mention weeds"
      - fact: "Whether the existing rock is kept up or new rock is wanted"
        bank_question: null
        follow_up: fu_rock_new
        photo: p6
        why_it_moves_price: "New rock is a delivery and spread job priced by the ton, not a monthly visit. [judgment]"
        skip_if: "Homeowner only asked for upkeep"
      - fact: "Whether trimmings and weeds are hauled away"
        bank_question: haul_away
        follow_up: null
        photo: null
        why_it_moves_price: "A haul-away adds a dump run and the landfill fee."
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_rock_new
        ask_when: "Homeowner mentions rock, gravel or 'redoing' the yard, or the close-up shows thin rock"
        text_en: "Do you want the rock you have raked and kept up, or new rock brought in?"
        text_es: "¿Quiere que rastrillen y mantengan la piedra que ya tiene, o que traigan piedra nueva?"
        options_en: ["Keep up the rock I have", "New rock brought in", "Both"]
        options_es: ["Mantener la piedra que tengo", "Traer piedra nueva", "Las dos"]
        card_field: true
        why: "Upkeep is a monthly visit; new rock is a delivery job the card must flag. [judgment]"
      - id: fu_weeds_how
        ask_when: "Homeowner mentions weeds and did not say how they should be handled"
        text_en: "Do you want the weeds pulled or cut, or sprayed with weed killer?"
        text_es: "¿Quiere que arranquen o corten la hierba mala, o que la rocíen con herbicida?"
        options_en: ["Pulled or cut", "Sprayed", "Both"]
        options_es: ["Arrancada o cortada", "Rociada", "Las dos"]
        card_field: true
        why: "Spraying, and pre-emergent above all, sits outside the landscaper exemption and routes to pest_control."
      - id: fu_slope
        ask_when: "Photo or words suggest a hillside, wash or terraced lot, or no photo was sent for a large yard"
        text_en: "Is the yard mostly flat, on a slope, or on a steep hillside or wash?"
        text_es: "¿El patio es casi plano, tiene pendiente, o está en una ladera empinada o un arroyo?"
        options_en: ["Mostly flat", "Some slope", "Steep hillside or wash"]
        options_es: ["Casi plano", "Algo de pendiente", "Ladera empinada o arroyo"]
        card_field: true
        why: "Slope slows raking, weeding and hauling more than size does on Havasu hillside lots. [judgment]"
      - id: fu_water_issue
        ask_when: "Homeowner mentions dying plants, brown spots, a wet area or a high water bill"
        text_en: "Is anything wrong with the watering system right now, like a leak, a wet spot or a zone that won't come on?"
        text_es: "¿Hay algún problema con el sistema de riego ahora, como una fuga, una parte mojada o una zona que no prende?"
        options_en: ["No, just the yard work", "Yes, a leak or wet spot", "Yes, a zone or timer won't work"]
        options_es: ["No, solo el trabajo del patio", "Sí, una fuga o parte mojada", "Sí, una zona o el timer no funciona"]
        card_field: true
        why: "Watering-system repair is R-21 work outside this category; the answer splits the request."
    photos_priority: [p1, p6]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["HOA or city notice with a deadline"]
      regular: "Ongoing upkeep"
    scope_line_en: "Monthly rock-yard upkeep, front and back: rake gravel, pull weeds, blow off the driveway."
    scope_line_es: "Mantenimiento mensual de patio de piedra, frente y atrás: rastrillar grava, arrancar hierba mala, soplar la entrada."
    quote_format: monthly
    business_fills: ["monthly price", "visits per month and what each visit covers", "earliest start date"]
    card_template: |
      REQ-<id> | Yard maintenance | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: upkeep, which areas, how often>
      How often: <weekly / every two weeks / monthly>. Yard: <small / medium / large or big lot>. Ground: <rock / lawn / mix, from photo>.
      Weeds: <pulled or cut / not mentioned>. Rock: <keep up / new rock wanted / both>. Slope: <flat / some / steep or wash>. Haul away: <yes / no>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Your rock is too thin, you need new rock.", "We'll spray pre-emergent so the weeds don't come back.", "Most yards like this run about a hundred a month.", "Those plants are dying because the drip is clogged."]

  - id: lawn_mowing
    new_job_type: true
    label: "Lawn mowing, edging and blowing (grass lawn, overseeded winter rye, or artificial turf upkeep)"
    bank_job_type: "mowing"
    recurring: true
    homeowner_phrasings: ["mow my lawn", "grass needs cutting every week", "cortar el pasto", "lawn service", "keep the grass edged"]
    must_know:
      - fact: "How often the mowing should be"
        bank_question: how_often
        follow_up: null
        photo: null
        why_it_moves_price: "Weekly in the growing season versus every two weeks sets the monthly price. [judgment]"
        skip_if: "Answered"
      - fact: "Lawn size"
        bank_question: yard_size
        follow_up: null
        photo: p1
        why_it_moves_price: "Mower time and edging length scale with the lawn. [judgment]"
        skip_if: "Photo shows the whole lawn"
      - fact: "Real grass or artificial turf"
        bank_question: null
        follow_up: fu_grass_kind
        photo: p1
        why_it_moves_price: "Turf gets blown and brushed, not mowed; different tools and time. [judgment]"
        skip_if: "Homeowner said grass or turf"
      - fact: "Whether the lawn is overseeded with winter grass"
        bank_question: null
        follow_up: fu_overseed
        photo: null
        why_it_moves_price: "Overseeded rye needs mowing about October through May; dormant bermudagrass does not."
        skip_if: "Request is in the summer and only for summer, or the lawn is turf"
      - fact: "Clippings bagged and hauled, or left"
        bank_question: haul_away
        follow_up: null
        photo: null
        why_it_moves_price: "Bagging and hauling adds time and dump runs."
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_grass_kind
        ask_when: "Homeowner asks for lawn care and did not say real grass or turf"
        text_en: "Is the lawn real grass or artificial turf?"
        text_es: "¿El pasto es natural o artificial?"
        options_en: ["Real grass", "Artificial turf", "Some of each"]
        options_es: ["Natural", "Artificial", "De los dos"]
        card_field: true
        why: "Turf upkeep and mowing are different visits. [judgment]"
      - id: fu_overseed
        ask_when: "Real grass and the request covers fall, winter or spring"
        text_en: "Is the lawn seeded with winter grass so it stays green in winter?"
        text_es: "¿El pasto tiene semilla de invierno para que se mantenga verde en el invierno?"
        options_en: ["Yes", "No"]
        options_es: ["Sí", "No"]
        card_field: true
        why: "Overseeded lawns are mowed through the winter; dormant bermudagrass mostly is not."
      - id: fu_access
        ask_when: "Backyard lawn, a gate is mentioned, or the homeowner is away part of the year"
        text_en: "How will the crew get into the yard on service day?"
        text_es: "¿Cómo va a entrar el equipo al patio el día del servicio?"
        options_en: ["Gate is open or unlocked", "Gate has a lock or code", "Someone lets them in", "Front yard only"]
        options_es: ["La puerta está abierta o sin llave", "La puerta tiene candado o código", "Alguien les abre", "Solo el frente"]
        card_field: true
        why: "A locked gate costs a wasted trip and changes scheduling. [judgment]"
      - fu_water_issue
    photos_priority: [p1]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["HOA or city notice with a deadline"]
      regular: "Ongoing mowing"
    scope_line_en: "Weekly mowing and edging of a small back lawn; lawn is overseeded with winter grass."
    scope_line_es: "Cortar y orillar cada semana un pasto chico atrás; el pasto tiene semilla de invierno."
    quote_format: monthly
    business_fills: ["monthly price", "visits per month and what each visit covers", "earliest start date"]
    card_template: |
      REQ-<id> | Yard maintenance | <town>, <general area> | <kind of place>
      <one scope line: mowing, which lawn, how often>
      How often: <weekly / every two weeks / monthly>. Lawn: <small / medium / large>. Kind: <real grass / turf / both>. Winter grass: <yes / no / not said>.
      Access: <open gate / lock or code / someone home / front only>. Clippings hauled: <yes / no>.
