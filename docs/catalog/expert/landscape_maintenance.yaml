# Ask Hava expert layer: landscape_maintenance (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set landscape_maintenance and trade_kb/trades/landscaping_irrigation.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Mapping. The kb file serves two categories: this one (no license, gardener work) and pavers_hardscape
#   (R-21). Kept here: maintenance (as "gravel raking", the usual Havasu rock-yard visit) and cleanup
#   (as "yard cleanup", one-time, quoted firm). Added with new_job_type: lawn_mowing ("mowing") and
#   shrub_tree_trim ("trimming"), because the kb has no mowing or trimming job type.
# - Left out, with no sensible home in this category:
#     drip_repair, sprinkler_valve, controller, new_system: irrigation work, R-21 in the kb's
#       license_classes and A.A.C. R4-9-103. pavers_hardscape takes only "irrigation install"; irrigation
#       REPAIR has no catalog home today. The misdiagnosis check below routes a watering problem to
#       pavers_hardscape "irrigation install" as the closest fit. Open question for the catalog.
#     rock_gravel: new rock delivery and spread is hardscape (R-21) in the kb. A homeowner who wants new
#       rock while asking for raking is caught by fu_rock_new and the answer goes on the card; there is no
#       route for it (pavers_hardscape has no rock job type). Open question.
#     plant_install: the kb lists it under the gardener exemption, but this category has no planting
#       job type. Open question whether "trimming" or a new job type should take small plantings.
#     lighting (R-21 / R-67) and turf (install; R-21): construction work, not maintenance.
# - Bank photos are [p1, p2, p3]; p2 (controller) and p3 (valve box) are irrigation photos and do not
#   help a maintenance quote. Suggest the bank use [p1, p6] for this set.
# - "trimming" is a recurring job type quoted monthly, but the bank's how_often question offers "Once".
#   A one-time trim then has no clean quote format. Suggest adding "trimming" to one_time_job_types or a
#   job_type_formats entry, or splitting one-time trimming out.
# - Palms and tall trees: there is no tree_trimming category, so "trimming" here takes palms too; the
#   height follow-up puts lift or climbing work on the card.
schema: 1
