# Ask Hava expert layer: security_cameras (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set security_cameras and trade_kb/trades/security_alarm.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - security_alarm.yaml also serves alarm_systems. Left out here (they belong to alarm_systems, electrical or
#   handyman): burglar_alarm, smart_home, false_alarms (alarm_systems); fire_alarm (R-16, and hardwired smoke
#   alarms are electrical's "hardwired smoke alarm"); battery_smoke (no camera category job type fits it).
# - new_job_type: doorbell_camera. The kb puts video doorbells inside "cameras"; the category routes
#   "doorbell camera" on its own, so it gets its own entry. The scenario file labels its doorbell scenarios
#   job_type "cameras" (s01, s05, s08, s13); "doorbell_camera" is the closer id if the scenarios are revised.
# - "Fix existing cameras" (bank question service, option 4) has no category job type. It rides on
#   "camera install", and fu_existing_since puts the timing fact on the card. A "camera repair" job type would
#   route it more cleanly.
# - The set's photo list includes kb p3 (smoke alarms on the ceiling), which never helps a camera quote, and p1
#   (alarm panel or keypad), which helps only when an alarm exists. A photo of the router or the old camera's
#   power adapter or recorder would serve this category better; that needs a kb and bank change.
# - Handyman cards: A.R.S. 32-1121(A)(14) leaves an unaltered plug-in or 12-volt-battery appliance's price out of
#   the $1,000 total, but labor and other materials still count. Whether routing keeps wired multi-camera jobs off
#   handyman cards (the set has no size_band question) is a routing decision this file does not settle.
# - Not verified: whether a camera-only business (no alarm) needs a BTR alarm business certificate. The A.R.S.
#   32-101 alarm definitions do not name cameras except as ancillary equipment of a low-voltage electric fence.
#   Nothing below states it either way.
# - Not verified: whether Lake Havasu City ever requires a permit for low-voltage camera work. The city permit
#   page does not list low-voltage, alarm or camera work and says its list is not complete.
# - A power run to a dock, gate or eave outlet is electrical work. Electrical has no "add an outlet" job type, so
#   misdiagnosis_checks routes it to "new circuit".
