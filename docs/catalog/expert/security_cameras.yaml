    - channel: "Lake Havasu City camera installers specifically"
      figure: "No local figures found; few local installers means less bidding, so costs may run below national vendor figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["The same request sold to several installers", "Self-install shoppers who only want a price", "Requests far outside their area", "Monthly fees whether or not jobs come", "No photos, so every job needs a free site visit"]
  what_makes_a_lead_worth_paying_for: ["Camera count, spots and power type stated", "Photos of the spots", "Whether the homeowner has the equipment", "Stories and height stated", "Pay only when picked, nothing monthly", "Real town and real timing"]
  their_words: ["NVR", "DVR", "PoE", "Cat6", "home run", "drop", "fish the wall", "eave mount", "junction box", "transformer", "chime kit", "VA", "field of view", "IR night vision", "cloud plan", "takeover"]
  signup_objections:
    - objection: "Why pay $25 when other sites send me requests already?"
      answer: "Most of those sites charge per request and sell it to several installers. Here you pay only when the homeowner picks your quote. There is nothing to join and nothing monthly. The fee is set by job size: $25, $75 or $199."
    - objection: "I can't quote cameras without walking the house."
      answer: "Quote a range and say what puts it at the high end. Most cards come with the camera count, the spots, the power type, the stories and a photo. If you need one more photo, say which in your quote."
    - objection: "Half of these people bought cheap cameras online and want them hung for nothing."
      answer: "The card says whether the homeowner already has the cameras, so you can quote labor only or pass. You quote only the cards you want."
    - objection: "Why do handymen get camera cards?"
      answer: "Arizona law lets an unlicensed person take small jobs under $1,000 total with no permit. Each card shows the power type, count and height, and the homeowner sees each business's license numbers with its quote."
    - objection: "Will you rank me against other installers?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license numbers and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "I only do wired systems, not doorbells."
      answer: "You pick the job types you want at sign-up and change them any time. You get cards only for those."
    - objection: "What if I quote and don't get the job?"
      answer: "Then you pay nothing. The introduction fee is charged only when a homeowner picks your quote and you confirm."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Can I offer a monitoring or cloud plan in my quote?"
      answer: "Quote in your own words. Say what the range covers and what any plan adds each month, so the homeowner can compare."
  quote_tips_for_card: ["Say whether the range includes cameras, recorder and any storage plan", "Say what moves it to the high end, such as second-story spots, attic runs or a new outlet", "Give the earliest day you can come", "If you need a photo of the router spot or the doorbell transformer, say so"]
