trade_brief:
  price_drivers:
    - driver: "Where the vent comes out: a low side wall, a second-story wall, the roof, or under a manufactured home"
      why: "A ground-level wall cover is the base job; second-floor and roof vents cost more because of the ladders and access gear, and under-home exits mean crawling behind skirting."
      source: angi_dryer_cost
    - driver: "Run length and bends between the dryer and the outside cover"
      why: "Code caps the duct at 35 ft less an allowance for each bend, so long runs with elbows take more rod sections and time to clear; the run-length follow-up supplies it."
      source: irc_m1502
    - driver: "Roof type and stories on a roof exit (tile, shingle, foam, metal)"
      why: "Concrete and clay tile can crack underfoot and a two-story tile roof is the hardest version to staff; some cleaners clean a roof vent from inside only. [judgment]"
      source: null
    - driver: "How much is in the duct: normal lint, years of buildup, a nest, or a stuck cover"
      why: "Debris is one of the main things that moves the price; nest removal and packed lint add time."
      source: angi_dryer_cost
    - driver: "Getting to the dryer: garage, laundry room, stacked unit in a closet, upstairs, gas or electric"
      why: "Pulling a stacked pair or a gas dryer out of a tight closet takes longer, and some cleaners will not move a gas dryer at all. [judgment]"
      source: null
    - driver: "Duct condition behind the dryer: foil or plastic hose, crushed, or pulled loose"
      why: "Manufacturers call for heavy metal duct, not foil or plastic; a cleaner may quote the cleaning only and leave replacement, which routes to handyman here."
      source: whirlpool_install
    - driver: "Number of dryers on one request (vacation rentals, duplexes)"
      why: "Each dryer is its own run and its own exit; most cleaners price per vent with a small break for more than one at the same address. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Foil or plastic accordion hose behind the dryer, crushed against the wall"
      how_a_pro_spots_it: "Silver foil or white vinyl ribbing and a flattened bend in the behind-the-dryer photo"
      question_or_photo: p2_behind_dryer
      source: cpsc_5022
    - condition: "A screen or cage over the outside cover packed with lint"
      how_a_pro_spots_it: "Mesh or a wire cage on the cover in the outside photo; code bars screens at the duct end"
      question_or_photo: p1_outside_vent
      source: irc_m1502
    - condition: "A long run that climbs through the attic to the roof, with lint packed at the cap"
      how_a_pro_spots_it: "Roof exit, laundry in the middle of the house, run over 25 feet, lint strands at the cap in the roof photo"
      question_or_photo: fu_run_length
      source: doe_dryer_vent
    - condition: "Duct that ends under a manufactured home instead of outside the skirting"
      how_a_pro_spots_it: "Vent goes through the floor and the homeowner cannot find an exit on the skirting; federal rules bar ending the duct under the home"
      question_or_photo: fu_under_home_end
      source: hud_3280_708
    - condition: "An active nest with eggs or chicks"
      how_a_pro_spots_it: "Birds going in and out or chirping; a permit is needed to destroy an active nest of a protected species, while starlings and house sparrows are not protected"
      question_or_photo: fu_what_living
      source: usfws_nests
    - condition: "Duct split or disconnected inside the attic, wall or garage ceiling"
      how_a_pro_spots_it: "Lint on the garage ceiling or around the dryer, very little air at the outside cover, a duct that goes up into the ceiling in the wide photo"
      question_or_photo: p4_laundry_wide
      source: null
    - condition: "Cover too low or blocked by an AC unit, plants or a fence"
      how_a_pro_spots_it: "Cover close to the gravel or behind a condenser in the outside photo; manufacturers want the hood at least 12 in above the ground and any object"
      question_or_photo: p1_outside_vent
      source: whirlpool_install
    - condition: "Gas connector behind the dryer that the cleaner will not disconnect"
      how_a_pro_spots_it: "Yellow or steel flexible gas line in the behind-the-dryer photo; gas connection work is outside any handyman exemption and outside R-63"
      question_or_photo: p2_behind_dryer
      source: ars_32_1121
  misdiagnosis_checks:
    - sounds_like: "dryer_not_drying (dryer takes forever)"
      might_be: "a fault in the dryer itself (no heat, drum not turning, grinding), a different category"
      one_question: fu_dryer_heat
      if_other_route_to: {category: appliance_repair, job_type: "dryer"}
      source: null
    - sounds_like: "standard_vent_cleaning (hose behind the dryer is crushed or torn)"
      might_be: "reroute_or_replace, refused here"
      one_question: fu_clean_or_replace
      if_other_route_to: {category: handyman, job_type: "dryer vent reroute"}
      source: null
    - sounds_like: "dryer vent cleaning (clean the ducts in the house)"
      might_be: "heating and cooling duct work, a different category"
      one_question: fu_which_ducts
      if_other_route_to: {category: hvac_repair, job_type: "duct repair"}
      source: null
    - sounds_like: "blockage_bird_nest (something living in the vent)"
      might_be: "bees or wasps nesting in the vent, a pest job"
      one_question: fu_what_living
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
    - sounds_like: "long_or_roof_vent (manufactured home, vent goes through the floor)"
      might_be: "a duct that ends under the home, which is a reroute rather than a cleaning"
      one_question: fu_under_home_end
      if_other_route_to: {category: handyman, job_type: "dryer vent reroute"}
      source: hud_3280_708
    - sounds_like: "dryer vent cleaning (move the vent while redoing the laundry room)"
      might_be: "reroute_or_replace, refused here"
      one_question: fu_clean_or_replace
      if_other_route_to: {category: handyman, job_type: "dryer vent reroute"}
      source: null
  photo_reading:
    - photo_id: p1_outside_vent
      reads: ["Cover type: single flap, louvers, cage or screen", "Lint, nest material or birds at the cover", "Height off the ground", "Plants, a fence or an AC unit in front of it", "Cover cracked, flap missing or stuck open"]
      neutral_wording: "Photo shows a louvered wall cover about 2 feet off the gravel with gray lint around the flaps."
    - photo_id: p2_behind_dryer
      reads: ["Duct type: rigid metal, ribbed metal, foil or white plastic", "Kinks or a flattened bend", "Gas connector or power cord in view", "Gap between the dryer and the wall", "Stacked or side-by-side unit"]
      neutral_wording: "Photo shows a silver foil hose bent flat behind the dryer and a yellow gas line beside it."
    - photo_id: p3_roof_vent
      reads: ["Roof surface: concrete or clay tile, shingle, foam, metal", "Cap style and whether it has a flap or a screen", "Lint or nest material at the cap", "Steep or low slope; one or two stories"]
      neutral_wording: "Photo from the yard shows a small metal cap on a tile roof with lint strands at the opening."
    - photo_id: p4_laundry_wide
      reads: ["Laundry in the garage, a closet or an inside room", "Duct going into the wall, floor or ceiling", "Lint on the floor, wall or ceiling near the dryer", "Room to pull the dryer out"]
      neutral_wording: "Photo shows a side-by-side washer and dryer in the garage with the duct going up into the ceiling."
  local_factors:
    - fact: "Monsoon season runs June 15 to September 30"
      effect: "Wind and dust blow debris into wall covers and can keep a flap from closing, which lets birds in [judgment]"
      source: nws_monsoon
    - fact: "Many Havasu homes put the laundry in the garage or on an inside wall"
      effect: "Long runs that climb through the attic to the roof are common, so run length and roof type come up on many cards [judgment]"
      source: null
    - fact: "Concrete and clay tile roofs are common"
      effect: "Roof-exit cards on tile go to businesses that walk tile, and some cleaners clean those runs from the dryer end only [judgment]"
      source: null
    - fact: "Manufactured home dryer ducts must exhaust to the outside and must not end under the home"
      effect: "Under-home vents in parks are common; the card says where the duct ends, if known, because a duct ending under the home is reroute work"
      source: hud_3280_708
    - fact: "Seasonal residents and vacant second homes sit empty for months"
      effect: "Birds nest in wall covers while no one runs the dryer; nest requests cluster in spring when owners return [judgment]"
      source: null
    - fact: "Vacation rentals run dryers between every guest stay"
      effect: "Owners ask for several dryers at once before the spring and summer seasons [judgment]"
      source: null
    - fact: "Summer roof surfaces get very hot from June to September"
      effect: "Roof-exit jobs get booked for early mornings, which narrows the open slots [judgment]"
      source: null
    - fact: "The city permit lists name neither dryer vents nor exhaust ducts, and the list says it is not complete"
      effect: "Cleaning an existing vent is not construction and is not treated as permit work [judgment]; whether a reroute needs a permit is unverified, so reroute cards go to handyman with that question open"
      source: lhc_permits
    - fact: "Businesses working inside Lake Havasu City limits need a city business license; no ROC class covers cleaning a dryer vent"
      effect: "Cards go to businesses with no ROC check (LIC-028); Ask Hava does not check the city license"
      source: lhc_business_license
  seasonality:
    busy: "October to November, before winter visitors settle in and around fire-prevention reminders, and February to April, before the rental season [judgment]"
    slow: "July to August, when roof work is hard and many second homes are empty [judgment]"
    source: null

job_types:
  - id: standard_vent_cleaning
    label: "Standard dryer vent cleaning (wall exit, short run)"
    bank_job_type: "dryer vent cleaning"
    recurring: false
    homeowner_phrasings: ["clean my dryer vent", "annual dryer vent cleaning", "lint all over the outside vent", "dryer vent on the side of the house", "limpiar el ducto de la secadora"]
    must_know:
      - fact: "Where the vent comes out, and how high off the ground"
        bank_question: where_vent
        follow_up: null
        photo: p1_outside_vent
        why_it_moves_price: "A low wall cover is the base price; a high or second-story wall needs a tall ladder."
        skip_if: "Homeowner said where, or the outside photo shows it"
      - fact: "Number of stories"
        bank_question: stories
        follow_up: null
        photo: null
        why_it_moves_price: "Sets ladder height and often run length. [judgment]"
        skip_if: "Homeowner gave the stories"
      - fact: "Run length from the dryer to the outside cover"
        bank_question: null
        follow_up: fu_run_length
        photo: p4_laundry_wide
        why_it_moves_price: "Longer runs with bends take more rod sections and more time; code caps the run at 35 ft less bends. [src:irc_m1502]"
        skip_if: "Dryer sits against the outside wall where the cover is"
      - fact: "Where the dryer sits and how easy it is to pull out"
        bank_question: null
        follow_up: fu_dryer_spot
        photo: p2_behind_dryer
        why_it_moves_price: "A stacked unit in a closet or an upstairs laundry adds time at the dryer end. [judgment]"
        skip_if: "Wide laundry photo shows it"
      - fact: "What shows at the outside cover: lint, a stuck flap, a screen"
        bank_question: null
        follow_up: null
        photo: p1_outside_vent
        why_it_moves_price: "A screen packed with lint or a cracked cover may add a part; code bars screens at the duct end. [src:irc_m1502]"
        skip_if: "No outside photo; the business asks on the call"
    allowed_follow_ups:
      - id: fu_run_length
        ask_when: "No run length given and the dryer is not on the same wall as the outside cover"
        text_en: "About how far is the dryer from where the vent comes out?"
        text_es: "¿Más o menos a qué distancia está la secadora de donde sale el ducto?"
        options_en: ["Under 10 feet", "10 to 25 feet", "Over 25 feet"]
        options_es: ["Menos de 10 pies", "10 a 25 pies", "Más de 25 pies"]
        card_field: true
        why: "Run length sets the rods, time and price more than anything after the exit; it is the kb's q3, missing from the bank. [judgment]"
      - id: fu_dryer_spot
        ask_when: "Short wall run already known and the homeowner did not say where the dryer sits"
        text_en: "Where does the dryer sit?"
        text_es: "¿Dónde está la secadora?"
        options_en: ["Garage", "Laundry room or closet, next to the washer", "Stacked on the washer in a closet", "Upstairs"]
        options_es: ["En la cochera", "En el cuarto de lavado o un clóset, lado a lado", "Encima de la lavadora en un clóset", "En el piso de arriba"]
        card_field: true
        why: "A stacked closet unit or an upstairs laundry changes how long the dryer end takes. [judgment]"
      - id: fu_clean_or_replace
        ask_when: "Homeowner mentions a crushed, torn, loose or old hose, a new laundry spot, or moving the vent"
        text_en: "Do you want the vent cleaned as it is, or part of it replaced or moved?"
        text_es: "¿Quiere que limpien el ducto como está, o que cambien o muevan una parte?"
        options_en: ["Cleaned as it is", "Replace a crushed or torn hose", "Move the vent to a new spot", "Cleaned and a hose replaced"]
        options_es: ["Limpiarlo como está", "Cambiar una manguera aplastada o rota", "Mover el ducto a otro lugar", "Limpiarlo y cambiar una manguera"]
        card_field: true
        why: "Cleaning stays here; replacing or moving routes to handyman as dryer vent reroute (LIC-028). [judgment]"
      - id: fu_which_ducts
        ask_when: "Homeowner says ducts, air ducts or vents in the house, or asks for more than the dryer"
        text_en: "Is this only the dryer vent that goes outside, or the heating and cooling ducts in the house too?"
        text_es: "¿Es solo el ducto de la secadora hacia afuera, o también los ductos de aire de la casa?"
        options_en: ["Just the dryer vent", "The house air ducts too", "Only the house air ducts"]
        options_es: ["Solo el ducto de la secadora", "También los ductos de aire de la casa", "Solo los ductos de aire de la casa"]
        card_field: true
        why: "House air ducts are HVAC work and go out as a second card. [judgment]"
    photos_priority: [p1_outside_vent, p2_behind_dryer, p4_laundry_wide]
    urgency:
      fire_dept_triggers: ["Smoke or flames at the dryer or the vent", "Gas smell or hiss near a gas dryer", "CO alarm sounding", "Sparking or burning outlet behind the dryer"]
      urgent_capable_triggers: []
      regular: "Every cleaning request"
    scope_line_en: "Clean the dryer vent; side wall exit about 2 feet off the ground, 1 story, run under 10 feet; electric dryer in the garage."
    scope_line_es: "Limpiar el ducto de la secadora; sale por la pared de lado a unos 2 pies del suelo, 1 piso, menos de 10 pies; secadora eléctrica en la cochera."
    quote_format: firm
    business_fills: ["price for the cleaning", "what is included (pull-out at the dryer, outside cover, haul-away of lint)", "earliest day"]
    card_template: |
      REQ-<id> | Dryer-vent cleaning | <town>, <general area> | <house / condo / townhome / manufactured home / vacation rental>
      <one scope line: clean the vent, exit, stories, run length>
      Exit: <side wall, height if seen / not sure>. Stories: <1 / 2 or more>. Run: <under 10 / 10 to 25 / over 25 feet / not said>.
      Dryer: <garage / laundry room / stacked in a closet / upstairs>, <gas / electric / not said>. Slower than usual: <yes / no>.
      Photos: <n> (<neutral description: cover type, lint, duct behind the dryer>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Lint buildup is a fire hazard.", "Don't run the dryer until it's cleaned.", "A cleaning runs about a hundred and fifty.", "That foil hose is against code.", "You should get this done every year."]

  - id: long_or_roof_vent
    label: "Long run, roof exit or under-home vent cleaning"
    bank_job_type: "dryer vent cleaning"
    recurring: false
    homeowner_phrasings: ["dryer vent goes out the roof", "2 story dryer vent", "laundry room in the middle of the house", "vent goes under the mobile home", "el ducto sale por el techo"]
    must_know:
      - fact: "Exit: roof, high wall, or under the home"
        bank_question: where_vent
        follow_up: null
        photo: p3_roof_vent
        why_it_moves_price: "Roof and second-floor vents cost more for access gear; under-home exits mean work behind the skirting. [src:angi_dryer_cost]"
        skip_if: "Homeowner said where"
      - fact: "Roof type and stories"
        bank_question: stories
        follow_up: fu_roof_type
        photo: p3_roof_vent
        why_it_moves_price: "Tile on a two-story is the hardest version to staff; some businesses clean those from the dryer end only. [judgment]"
        skip_if: "Roof photo shows the surface, or the exit is not on the roof"
      - fact: "Run length"
        bank_question: null
        follow_up: fu_run_length
        photo: p4_laundry_wide
