business_side:
  how_they_get_customers: ["Google Local Services Ads and search ads", "Google Maps listing and reviews", "Yearly reminder texts or cards to past customers", "Realtors, home inspectors and property managers who flag dirty vents", "Add-on to chimney sweeping or air duct cleaning", "Nextdoor and local Facebook groups [judgment]"]
  customer_acquisition_benchmarks:
    - channel: "Google non-brand search ads (dryer vent cleaning)"
      figure: "About $45 to $80 per lead, from a marketing-vendor article"
      source: valley_dryer_cpl
      unverified: false
    - channel: "Google Local Services Ads (home services average)"
      figure: "About $53 per lead; the vendor says dryer vent cleaning often lands at or below that; blended with search about $50 to $75"
      source: valley_dryer_cpl
      unverified: false
    - channel: "Thumbtack (all trades)"
      figure: "Pros report about $10 to over $100 per lead depending on trade and market; customers contact several pros"
      source: hcp_thumbtack
      unverified: false
    - channel: "Typical ticket the lead has to pay for"
      figure: "National average about $140 per cleaning (range about $75 to $325); vendor puts standard tickets at $100 to $200"
      source: angi_dryer_cost
      unverified: false
    - channel: "Lake Havasu City dryer-vent cleaners specifically"
      figure: "No local figures found; a small market with few cleaners may see lower ad costs than national vendor figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a lead that three other cleaners also bought", "Price shoppers who only want a number over the phone", "Jobs that turn out to be a broken dryer, not the vent", "Monthly fees whether or not jobs come", "Roof jobs sent with no word on stories or roof type"]
  what_makes_a_lead_worth_paying_for: ["Exit, stories and run length on the card", "Photos of the outside cover and behind the dryer", "Gas or electric stated", "Pay only when picked, nothing monthly", "A fee that fits a cleaning ticket, usually the $25 tier"]
  their_words: ["dryer vent", "exhaust duct", "transition duct", "foil", "semi-rigid", "rigid", "termination", "hood", "vent cap", "louvers", "bird guard", "run", "elbows", "rods", "brush", "airflow reading", "pull-out", "stack", "roof exit", "C-DET"]
  signup_objections:
    - objection: "My ticket is about $120. Why would I pay a fee on that?"
      answer: "The fee is set by quote size: $25 under $500, so a dryer vent cleaning is almost always the $25 tier. You pay it only when the homeowner picks your quote and you confirm. Nothing to join, nothing monthly."
    - objection: "I can't give a firm price without seeing the run."
      answer: "Cards carry the exit, stories, run length when she knows it, and photos of the outside cover and behind the dryer when she can take them. Quote a firm price for what the card shows and say in your notes what would change it."
    - objection: "I don't do roof vents."
      answer: "Dryer vent cleaning is one job type here, so wall and roof cards both come. Every card says where the vent exits. Skip the ones you don't take; skipping costs nothing."
    - objection: "Will you send me jobs to move or replace vents?"
      answer: "No. Moving and replacing vents go to the handyman category as dryer vent reroute. If you do that work too, you can choose that job type there."
    - objection: "Half these calls turn out to be a broken dryer."
      answer: "The intake asks how the clothes come out. No heat, a drum that won't turn or grinding goes to appliance repair, not to you."
    - objection: "Do I need a license to sign up?"
      answer: "No state contractor license covers cleaning a dryer vent, so none is asked for. Lake Havasu City has its own business license for businesses working inside city limits."
    - objection: "What about gas dryers?"
      answer: "The card says gas or electric when the homeowner knows. Say in your quote whether you move gas dryers. Gas connection work goes only to licensed businesses."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town and answers to the questions a cleaner asks. Names and addresses go only to the business the homeowner picks."
    - objection: "Will you rank me against other cleaners?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, review links and notes. Ask Hava never sorts, rates or scores a business."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
  quote_tips_for_card: ["Give one firm price for the job on the card", "Say what is included: pull-out, outside cover, roof end if any", "Say whether you clean roof runs from the roof or from the dryer end", "Price a new cover or bird guard as its own line", "Say whether you move gas dryers", "Give your earliest day"]
