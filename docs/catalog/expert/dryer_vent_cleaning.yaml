# Ask Hava expert layer: dryer_vent_cleaning (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set dryer_vent_cleaning and trade_kb/trades/dryer_vent_cleaning.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The category has one job type, "dryer vent cleaning", so the four cleaning kb job types all map to it.
#   kb reroute_or_replace maps to the refused name "rerouting or replacing a vent". That card is never sent
#   to dryer-vent businesses: it routes to handyman as "dryer vent reroute" (LIC-028). Its quote_format
#   says firm only because the checker ties every row to this category's format; the handyman category
#   quotes in range, and its own expert file (handyman.yaml, dryer_vent_reroute) sets that card.
# - The bank question where_vent offers Side wall, Roof, Not sure where. The kb's q1 also has "Under the
#   home or through the floor", which manufactured homes need (scenario s06). Suggest adding that option.
# - The bank has no run-length or gas-or-electric question (kb q3 and q5), and the AI may ask only one
#   follow-up. Run length is the strongest price driver after the exit, so it is the follow-up most job
#   types lean on. Adding run_length to the bank would free the follow-up for the dryer spot or fuel.
# - Photo p4_laundry_wide is a kb photo but not in the question set's photos list. Several job types use
#   it; consider adding it to the set.
# - fire_dept_triggers hold only D-436 list items (smoke or fire, gas smell or hiss, CO alarm, sparking or
#   burning outlet). A burning smell from the dryer with no smoke is not clearly on the list; it is left
#   off and needs a decision.
# - Whether Lake Havasu City needs a permit for a dryer vent reroute is unverified: the city permit page
#   names neither dryer vents nor exhaust ducts and says its list is not complete.
# - The IRC M1502 text was read from the 2021 Seattle and Ohio adoptions of the model code. Lake Havasu
#   City adopted 2024 IRC amendments; the 2024 M1502 text and any city amendment to it were not read.
# - No new_job_type was needed: the kb ids cover the one category job type and the refused job.
