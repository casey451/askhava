      figure: "Pros report about $10 to over $100 per lead depending on trade and market; requests are not exclusive"
      source: hcp_thumbtack
      unverified: false
    - channel: "Marketing budget rule of thumb (cleaning)"
      figure: "Spend 15 to 30 percent of a customer's lifetime value to win and keep that customer"
      source: zenmaid_marketing
      unverified: false
    - channel: "Referred versus paid clients (cleaning)"
      figure: "About $45 to $90 per referred client versus $220 to $340 on paid channels; the page marks these figures as illustrative"
      source: pulse_cleaning_gtm
      unverified: true
    - channel: "Lake Havasu City cleaners specifically"
      figure: "No local figures found; a small market with many part-year residents may run below national vendor figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a request that 3 or 4 other cleaners also bought", "One-time bargain hunters who never become regulars", "Homeowners who understate the condition, then balk at the real price", "Monthly fees whether or not jobs come", "Requests that never answer the phone"]
  what_makes_a_lead_worth_paying_for: ["Beds, baths, how often and last full clean stated up front", "Kitchen and bathroom photos that show the real condition", "Pay only when picked, nothing monthly", "A regular customer for the price of one fee, capped at $75", "Move-out date, empty or not, and utilities stated"]
  their_words: ["recurring", "biweekly", "initial clean", "deep clean", "move-out", "top to bottom", "detail clean", "baseboards", "inside oven", "inside fridge", "blinds", "ceiling fans", "hard water", "soap scum", "two-person team", "per visit", "flat rate", "walk-through", "checklist"]
  signup_objections:
    - objection: "Why pay a fee for a cleaning client?"
      answer: "You pay once, only when the homeowner picks your quote. A regular cleaning customer costs $25 or $75, never more. A one-time deep or move-out clean is $25, $75 or $199 by job size. If that customer picks you again through Ask Hava, there is no fee."
    - objection: "I don't quote without a walk-through."
      answer: "Each card gives beds, baths, how often, when it was last cleaned top to bottom, pets and extras, and most come with kitchen and bathroom photos. Quote from that, and use your notes to say what would change the price, like a home in heavier shape than the photos."
    - objection: "Can I charge more for the first visit?"
      answer: "Yes. Quote your regular price per visit and list the first deeper visit as a one-time setup charge. The setup charge is not counted in the fee."
    - objection: "Homeowners just want the cheapest cleaner."
      answer: "The homeowner sees every quote in the order it came in, with each business's name, review links and notes. Ask Hava never sorts, rates or scores a business."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town, photos and answers to the questions a cleaner asks. Names and addresses go only to the business the homeowner picks."
    - objection: "What if I quote and don't get the job?"
      answer: "Then you pay nothing. The fee is charged only when a homeowner picks your quote and you confirm."
    - objection: "What if they cancel after the first clean?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded. After that the fee stands. It is a fixed introduction fee, not a share of the job."
    - objection: "Is there a monthly fee or a contract?"
      answer: "No. Nothing to join and nothing per month. You pay only on a pick."
    - objection: "I only do regular cleaning, not move-outs."
      answer: "You choose your job types at sign-up and can change them any time. You get cards only for those."
    - objection: "Do I need a license to sign up?"
      answer: "No state contractor license covers house cleaning, so none is asked for. Lake Havasu City has its own business license rule for businesses working inside city limits."
  quote_tips_for_card: ["Give a price per visit and say how often", "List any first-visit charge as a one-time setup charge", "Say what your deep or move-out clean includes, such as inside the oven, fridge and cabinets", "Say whether you bring supplies and equipment", "Give your earliest start date"]
