        options_en: ["A rental I am leaving", "A home I am selling", "My rental, between tenants", "A home I am moving into"]
        options_es: ["Una renta que estoy dejando", "Una casa que estoy vendiendo", "Mi renta, entre inquilinos", "Una casa a la que me voy a mudar"]
        card_field: true
