# Ask Hava expert layer: house_cleaning (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set house_cleaning and trade_kb/trades/house_cleaning.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - kb job type str_turnover (vacation rental turnover) is left out: it belongs to category
#   turnover_cleaning, which shares this kb file. The misdiagnosis check below routes it there.
# - kb job type post_construction (after-remodel dust) is kept under bank job type
#   "deep cleaning", the only one-time category job type that fits. Casey may want a separate
#   "after-remodel clean" job type later so businesses can opt in or out of it.
# - kb job type specialty_route (heavy-condition home, mold spots, droppings, sewage residue)
#   is kept under "deep cleaning" so the card goes out with the real condition stated, not as a
#   plain deep clean. No enabled category does restoration or mold remediation. Sewage still
#   backing up goes to plumbing_repair first, droppings with live animals to pest_control, a
#   home full of stored items to estate_cleanout (misdiagnosis checks below). Open question: a
#   firm quote cannot carry a visit fee, so a cleaner who must walk a heavy home first can only
#   say so in the quote notes.
# - No new_job_type was needed: the kb ids cover all three category job types.
