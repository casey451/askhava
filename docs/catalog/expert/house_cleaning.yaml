business_side:
  how_they_get_customers: ["Word of mouth and repeat customers", "Google Maps listing and reviews", "Google Local Services Ads", "Local Facebook groups and Nextdoor [judgment]", "Thumbtack and Angi", "Realtors and property managers for move-outs [judgment]"]
  customer_acquisition_benchmarks:
    - channel: "Google Local Services Ads (cleaning)"
      figure: "About $60 to $70 per lead, from one marketing vendor's own client accounts"
