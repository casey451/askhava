    expected:
      category: hvac_replacement
      job_type: ac_replacement
      bank_job_type: "full system replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["wants a quote to replace the AC", "outdoor unit on the ground, about 15 years old", "one story, about 1,600 sq ft", "gas furnace in hall closet, similar age", "homeowner says one section of attic duct looks crushed", "Spanish speaker"]
      must_not_be_on_card: ["any price", "any promised quote time", "any cause", "duct advice"]
