category: hvac_replacement
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
# Mapping note: the categories.yaml job types for this category are "full system replacement" and
# "condenser replacement". Package-unit and mini-split installs have no exact bank name, so
# bank_job_type uses "full system replacement" as the nearest fit for them.
scenarios:
  - id: hvac_replacement_s01
    kind: vague
    persona: "homeowner, 40s, texts one short line at a time between jobs, no HVAC words beyond 'ac'"
    opening_message: "need a new ac. old one is shot"
    photo: "none at first; if asked for the label, a sideways, partly sun-faded plate on a ground unit with the model line readable"
    hidden_facts:
      - "central AC with an outdoor unit on the ground at the side of the house"
      - "indoor air handler is in the attic, reached through a hallway ceiling hatch"
      - "one story, about 1,900 sq ft"
      - "unit is about 14 years old"
      - "it still runs but the house will not get below the high 80s on hot days"
      - "there is also a gas furnace in the same attic that works fine"
    homeowner_behavior: "answers one thing per reply; never volunteers; gives a fact when a question clearly calls for it; says 'idk' to anything about the label until asked for a photo"
    traps:
      - "hidden: air handler sits in the attic behind a small hatch, which changes labor and whether a business needs a visit; only said if asked where the indoor part is"
      - "hidden: a separate gas furnace shares the attic and plenum; only said if asked about heating or the indoor unit"
      - "'shot' is not a cause; the card must not record it as one, only that the unit runs and the house stays warm"
    expected:
      category: hvac_replacement
      job_type: ac_replacement
      bank_job_type: "full system replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["wants a quote to replace the AC", "outdoor unit on the ground", "indoor unit in the attic, ceiling hatch", "one story, about 1,900 sq ft", "about 14 years old", "separate gas furnace in the same attic"]
      must_not_be_on_card: ["any cause", "any price", "repair versus replace advice", "tonnage guess"]
      max_questions: 6
      notes: "Vague opener with no system type, size or age. The attic air handler and the gas furnace beside it are the quote-changing facts and only come out if the AI asks where the indoor part is and how the house heats."

  - id: hvac_replacement_s02
    kind: wrong_self_diagnosis
    persona: "homeowner, 50s, confident, read forums, mixes up 'compressor' and 'condenser'"
    opening_message: "my compressor is dead for sure. outside box just hums and the fan wont spin. need a whole new ac, whats the soonest someone can quote it"
    photo: "outdoor unit on a pad, top fan grille intact, no visible damage, nothing leaking"
    hidden_facts:
      - "outside unit hums and the fan on top does not turn"
      - "the fan blades spin freely if poked with a long stick, and then the unit hums louder but runs"
      - "inside the vents blow warm air, the indoor fan is running"
      - "unit is about 7 years old, ground-mounted, central AC"
      - "it stopped working right after a power flicker during a storm"
      - "he has not had anyone out; the compressor idea is from a video"
      - "if asked fix or replace, he says replace, but if it is a cheap fix then fix it, he wants options"
    homeowner_behavior: "pushes the replacement framing hard; answers the symptom question in detail when asked what it is doing; admits nobody has looked at it only if asked whether anyone has seen it"
    traps:
      - "wrong self-diagnosis: the symptoms (hum, fan not spinning, spins when pushed) point to a repairable electrical-part failure, not a dead compressor; the AI must not say that, but the request belongs in hvac_repair as an 'AC not cooling' call with scope 'both, I want options'"
      - "hidden: the unit is only 7 years old and the trouble began after a power flicker; a replacement card would cost him a lot more than a service call"
      - "the card must carry his words 'thinks the compressor is dead' as his belief, not as a fact"
    expected:
      category: hvac_repair
      job_type: ac_not_cooling
      bank_job_type: "AC not cooling"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["outside unit hums, fan on top not spinning", "indoor fan runs, air from vents is warm", "about 7 years old", "started after a power flicker", "homeowner wants options: fix or replace", "nobody has looked at it yet"]
      must_not_be_on_card: ["capacitor", "compressor is dead stated as fact", "any cause", "any price", "repair versus replace advice"]
      max_questions: 5
      notes: "Request reads as replacement but the symptoms describe a repairable failure. The AI never diagnoses, so the routing has to come from the symptom answers plus the homeowner choosing 'both, I want options'. Failure modes: routing to hvac_replacement because he said 'whole new ac', or telling him it is probably a cheap part."

  - id: hvac_replacement_s03
    kind: wrong_terminology
    persona: "owner of a single-wide in a Havasu mobile home park, 60s, practical, not a texter, calls things by old names"
    opening_message: "the swamp cooler on the roof of my trailer is done. need a new one put up, heat and cool both"
    photo: "rectangular metal box on a low roof with a data plate sticker visible; plate lines read a refrigerant name and a gas input rating; a short gas pipe stub enters the side"
    hidden_facts:
      - "manufactured home, single-wide, in a park, one story"
      - "the roof unit is a package unit that cools and heats with gas, not a water-fed swamp cooler"
      - "the plate shows R-410A and a gas heating input"
      - "about 11 years old"
      - "about 1,100 sq ft"
      - "ducts run through the ceiling, not under the floor"
      - "the park has narrow lanes and a tow-away rule for blocked lanes"
      - "unit works partly: blows air but not cold"
    homeowner_behavior: "calls it a swamp cooler or the trailer cooler throughout; says 'mobile home' when asked about the type of home; has to be asked for the park or lane access"
    traps:
      - "wrong terminology: the name 'swamp cooler' would send it to evaporative cooler work; the plate photo shows a refrigerant and a gas rating, so it is a rooftop package unit replacement"
      - "hidden: manufactured home, so businesses need the home type up front (alterations need a licensed person)"
      - "hidden: crane or truck access in a park with narrow lanes; only said if asked how a truck could reach the home"
      - "hidden: gas connection on the unit; only visible in the photo or if asked how it heats"
    expected:
      category: hvac_replacement
      job_type: package_unit_replacement
      bank_job_type: "full system replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["rooftop package unit", "manufactured home, single-wide, in a park", "about 11 years old", "about 1,100 sq ft", "gas heat on the unit", "narrow park lanes for truck or crane access"]
      must_not_be_on_card: ["swamp cooler", "any cause", "any price"]
      max_questions: 6
      notes: "The homeowner's word and the photo disagree. A strong AI asks for the data plate photo, sees refrigerant and gas on it, and writes it as a package unit on a manufactured home. A weak one routes to swamp cooler work or writes 'swamp cooler' on the card."

  - id: hvac_replacement_s04
    kind: misleading_photo
    persona: "homeowner, 30s, texts fast with typos, sends photos before being asked"
    opening_message: "need new condenser, ac stopped cooling. heres a pic of it"
    photo: "two outdoor units on one pad; the left one is rusted, its fan guard is missing and its plate shows R-22; the right one is newer with an intact grille, plate not in frame"
    hidden_facts:
      - "the left unit is an old abandoned condenser left in place when the system was changed years ago, disconnected from power and lines"
      - "the right unit is the one that runs the house, about 9 years old, 3 tons"
      - "a service company told him the compressor in the right unit locked up"
      - "he thinks the compressor warranty ended; he never registered the unit"
      - "the indoor coil and air handler are the same age as the right unit"
      - "the pad is against a block wall with about 2 ft of clearance"
    homeowner_behavior: "assumes the photo speaks for itself; will not mention the second unit is dead until asked which of the two the house runs on"
    traps:
      - "misleading photo: the first thing in the frame is the dead R-22 unit; the card must not record R-22 or rust for the unit being replaced"
      - "hidden: a service company's finding is hearsay; the card may say what he was told, attributed to him, but must not state it as a cause"
      - "hidden: warranty status and registration matter to a quote; only said if asked about age and warranty paperwork"
      - "hidden: tight clearance against a block wall changes how a business sets the new unit"
    expected:
      category: hvac_replacement
      job_type: ac_replacement
      bank_job_type: "condenser replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["two outdoor units on the pad, only the right one is in use", "right unit about 9 years old", "homeowner says a service company told him the compressor locked up", "indoor unit same age", "about 2 ft clearance to a block wall", "wants outdoor unit replaced"]
      must_not_be_on_card: ["R-22 for the running unit", "compressor failed stated as fact", "any price", "any cause"]
      max_questions: 6
      notes: "The photo shows the wrong unit first. The AI has to notice two units and ask which one runs the house, then ask for a close label photo of that one. Whether a matched indoor coil needs replacing is a business decision; the card only records the indoor unit age."

  - id: hvac_replacement_s05
    kind: no_photo
    persona: "homeowner, 55, woodworker, texts in full sentences, no tech vocabulary"
    opening_message: "Hi, I want to get air conditioning in my garage workshop. It is unbearable out there. Not sure what my options are."
    photo: "none; says he is not near the garage right now and will not send one"
    hidden_facts:
      - "attached two-car garage, about 500 sq ft, one big uninsulated roll-up door"
      - "the garage is a workshop, so there is sawdust and a dust collector running"
      - "no existing ductwork in the garage"
      - "main electrical panel is on the garage wall"
      - "the panel is full, no open breaker spaces"
      - "stucco exterior; the outdoor unit would go on the side yard, about 20 ft from where the indoor part would hang"
      - "wants to run it only when he is working in there"
    homeowner_behavior: "friendly, answers thoroughly when asked a direct question, but never mentions the panel until asked what is near where the unit would go"
    traps:
      - "no photo: the AI should still write a usable card and ask once more for a photo of the wall and outside spot, then accept the refusal"
      - "hidden: full panel on the garage wall; a business needs to know about open breaker spaces and a possible panel change before quoting"
      - "hidden: uninsulated roll-up door and big open-air load change unit size; only said if asked about insulation"
      - "'options' is a request for advice; the card must not list or recommend equipment types"
    expected:
      category: hvac_replacement
      job_type: mini_split_install
      bank_job_type: "full system replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["new mini-split for an attached garage workshop", "about 500 sq ft, uninsulated roll-up door", "no existing ductwork", "main panel is on the garage wall and is full", "outdoor unit spot about 20 ft away on a stucco wall", "no photos sent"]
      must_not_be_on_card: ["recommended unit size or brand", "any price", "advice on options"]
      max_questions: 6
      notes: "No photo and a request for options. The AI should name no equipment. The full panel is the big hidden fact (panel work goes to an electrician); the card should carry it so businesses can price or flag it."

