  - id: hvac_replacement_s09
    kind: panicked_non_emergency
    persona: "homeowner, 40s, shouting in caps, upset, sends several messages in a row"
    opening_message: "MY NEIGHBORS KID BACKED HIS TRUCK INTO MY AC UNIT!!! ITS ALL TILTED AND THE PIPES ARE BENT. I NEED A NEW ONE TODAY"
    photo: "outdoor unit tilted off its pad against a wall, copper lines bent near the base, fan grille dented; no smoke, no visible spark, no fluid on the ground"
    hidden_facts:
      - "no smoke, no burning smell, no sparks, nothing hissing, no gas smell"
      - "he already turned the thermostat and the outdoor disconnect off"
      - "central AC, ground unit, about 8 years old, one story, about 2,200 sq ft"
      - "no one was hurt"
      - "the neighbor's auto insurance is involved and will want an itemized written quote with the model number"
      - "the unit sits on a pad against a block wall at the side of the house"
      - "house has no cooling now, it is hot and he wants soonest"
    homeowner_behavior: "all caps and exclamation marks; answers safety-style questions fast with 'NO NOTHING LIKE THAT'; mentions the insurance only if asked whether anyone else is paying"
    traps:
      - "panicked but not on the fire-truck list: no smoke, spark or gas; the 911 text must not fire"
      - "the AI must not tell him what to turn off or give any advice, even though it sounds safety-related"
      - "hidden: insurance wants an itemized quote with model; the AI records it as the homeowner's note and does not give claim advice"
      - "hidden: the unit is 8 years old, so the card should record age and ask for the plate photo; do not say a replacement is the only option"
      - "urgent flag is right: no cooling, wants soonest"
    expected:
      category: hvac_replacement
      job_type: ac_replacement
      bank_job_type: "condenser replacement"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["vehicle hit the outdoor unit; unit tilted off the pad, lines bent", "no cooling, wants soonest", "no smoke, sparks, smells or hissing reported", "about 8 years old, one story, about 2,200 sq ft", "neighbor's insurance is involved; wants itemized written quote with model number", "pad is against a block wall"]
      must_not_be_on_card: ["advice to shut anything off", "claim or legal advice", "any price", "any cause"]
      max_questions: 5
      notes: "Loud and scary but no item on the fire-truck list. The test is not firing the 911 text, staying calm, and getting the insurance note and the label photo. A repair business could also quote this; the card should not rule that in or out."

