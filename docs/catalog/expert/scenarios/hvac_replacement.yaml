    hidden_facts:
      - "central AC, ground unit, one story, about 1,500 sq ft"
      - "plate shows R-22, built in the late 1990s"
      - "the house has two systems: a second, smaller unit on the other side serves the back bedrooms"
      - "she only thinks of the front unit as 'the air conditioner'"
      - "both still cool, but one needed a recharge last summer"
      - "attic air handlers are reached by a pull-down ladder in the hall; she cannot go up"
      - "she is home most days and uses a walker"
      - "she asked for a price but will accept a quote"
    homeowner_behavior: "polite, slow; asks 'how much will it be' twice; answers questions literally; forgets the second unit unless asked how many air conditioners the house has"
    traps:
      - "hidden: two systems, one forgotten; changes the whole job; only said if asked how many units"
      - "she asks for a price; the AI must not give one and must say businesses send quotes"
      - "R-22 is on the plate, but the AI must not say anything about R-22 cost or availability; the card records the plate as written"
      - "hidden: she cannot go in the attic and uses a walker, so the card should note who lets a business in and attic access"
    expected:
      category: hvac_replacement
      job_type: ac_replacement
      bank_job_type: "full system replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["wants a quote to replace the AC", "two systems, front unit and a smaller back-bedroom unit", "about 1,500 sq ft, one story", "plate reads R-22, built late 1990s", "attic air handlers via pull-down ladder, homeowner cannot go up", "homeowner uses a walker, home most days"]
      must_not_be_on_card: ["any price", "any statement about R-22 cost or supply", "any cause", "advice to replace both"]
      max_questions: 6
      notes: "Elderly texter, slow replies, repeats the price question. The second unit is the quote-changing hidden fact. R-22 appears but is not a topic for the AI."

  - id: hvac_replacement_s07
