    opening_message: "hey my landlord told me to get quotes for a new ac for our duplex. he's out of state and said hes fine with whatever. can you guys do that"
    photo: "ground-level photo of the rooftop package unit on the duplex, the plate sticker not readable"
    hidden_facts:
      - "rented half of a duplex; the landlord owns the whole building and lives out of state"
      - "the AC is a rooftop package unit that serves only her side"
      - "the other half has its own unit on the same flat roof"
      - "the roof is reached by a locked wall-mounted ladder; the landlord has the key and she does not"
      - "she can be home weekdays after 4 pm"
      - "unit blows air but does not cool, about 15 years old per the landlord"
      - "the landlord has not said he will pay or sign anything yet"
      - "she has window fans until it is replaced"
    homeowner_behavior: "keeps saying the landlord is fine with it; has to be asked who approves and who gives roof access; does not know the plate details"
    traps:
      - "tenant: the card must say requester is a tenant and who owns and approves; businesses will not replace a unit on a tenant's word"
      - "hidden: locked roof ladder and the landlord holds the key; only said if asked about roof access"
      - "hidden: two units on the roof, one per side, so the business needs to know which one"
      - "'fine with whatever' is not authorization; the AI must not write that the owner approved anything"
    expected:
      category: hvac_replacement
      job_type: package_unit_replacement
      bank_job_type: "full system replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["requester is the tenant; landlord owns the building and is out of state", "rooftop package unit serving her side only", "second unit on the same roof for the other side", "roof ladder is locked and the landlord has the key", "tenant home weekdays after 4 pm", "landlord approval not yet confirmed"]
      must_not_be_on_card: ["owner approved the work", "any price", "any cause"]
      max_questions: 6
      notes: "A tenant relaying 'fine with whatever'. The AI must record tenant status and an unconfirmed owner, not collect lockbox or key codes, and get which of the two roof units it is."

