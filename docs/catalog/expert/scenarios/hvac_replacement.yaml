      - "spanish: card and replies must be in Spanish for the homeowner, card fields in plain English for businesses where the system requires it; no machine-sounding Spanish"
      - "hidden: gas furnace in a hall closet of similar age; whether it is part of the quote matters; only said if asked about heating"
      - "hidden: crushed duct section; the AI must not offer duct advice, only record it as the homeowner's observation if volunteered"
