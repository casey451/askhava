      urgent: false
      must_be_on_card: ["new mini-split, one head, for a detached casita about 400 sq ft", "casita about 60 ft behind the house", "no power at the casita yet", "main panel full, no open breaker spaces", "insulated walls and spray-foam vaulted ceiling", "wants it done before the casita is rented in a couple of months"]
      must_not_be_on_card: ["subpanel size or type", "electrician recommendation", "any price", "recommended mini-split size"]
      max_questions: 6
      notes: "Second card would go to electrical (new circuit or panel work to the casita). The HVAC card goes first; it must carry the full panel and no-power facts so the mini-split business does not quote as if power exists. Offer the second card, do not merge them."

