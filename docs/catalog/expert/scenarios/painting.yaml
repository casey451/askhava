category: painting
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: painting_s01
    kind: vague
    persona: "Man in his 50s, texts one short line at a time, no punctuation, busy at work"
    opening_message: "need the house painted"
    photo: "none"
    hidden_facts:
      - "inside only, whole house: 3 bedrooms, living room, hallway, 2 baths"
      - "house was built in 1974"
      - "ceilings have a rough sprayed texture (the old popcorn kind) and he wants them painted too, not scraped"
      - "walls are in decent shape, a few nail holes and one dent from a door handle in the hall"
      - "he has not picked colors, wants everything one neutral color"
      - "he would rather the painter supply the paint"
    homeowner_behavior: "answers one thing per reply; never volunteers; gives a fact when a question clearly calls for it; says 'idk' to anything about color or technical words; gets short after 5 questions"
    traps:
      - "hidden: built 1974 (pre-1978), only says it if asked about the age of the home"
      - "hidden: textured ceilings in a 1974 house; he does not know it matters and will say 'just bumpy' if asked about ceilings"
      - "hidden: inside vs outside is never stated; 'the house' could mean either"
    expected:
      category: painting
      job_type: interior_rooms
      bank_job_type: "interior painting"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["inside rooms, whole house, 3 bedrooms living room hallway 2 baths", "ceilings textured and to be painted", "home built 1974", "painter supplies paint", "color change with minor nail holes and one dent"]
      must_not_be_on_card: ["asbestos", "lead", "price or range", "any advice about testing or scraping"]
      max_questions: 6
      notes: "Two words of detail. A good flow has to find out inside vs outside, size, ceilings, and home age without a long interrogation. The 1974 year and the textured ceilings are the facts a top estimator would want and he will not offer them."

  - id: painting_s02
    kind: wrong_terminology
    persona: "Woman in her 40s, texts in long run-on messages, a little rushed, uses 'adobe' for any tan house"
    opening_message: "hi i need my adobe house resealed and repainted on the outside, the color is totally faded on the sun side and its chalky when i touch it. here's a pic of the west wall"
    photo: "wide shot of a tan two-story house, west wall, color uneven and faded near the upper windows; fine dark lines are visible only near one window corner"
    hidden_facts:
      - "the house is stucco, not adobe; cement-colored stucco over block, built about 1996"
      - "two stories, about 2,400 sq ft, whole outside including garage door trim and fascia"
      - "stucco has hairline cracks at several window corners and one long diagonal crack across the west wall of the second story, about 6 feet"
      - "last painted about 11 years ago, she thinks with a thick rubbery coating"
      - "she is in an HOA that has an approved color palette and requires an architectural committee approval before any exterior color is used"
      - "she has not submitted a color yet and the committee meets once a month"
      - "she would like the painter to supply paint"
      - "side yard on the east is narrow with a block wall close to the house"
    homeowner_behavior: "writes run-on messages; answers what is asked but wanders; mentions the HOA only if asked about restrictions, approvals or colors; says 'there might be some little cracks' only when asked about cracks; will send a close-up if asked"
    traps:
      - "wrong word: calls it adobe and 'resealed'; the card should say stucco exterior repaint without making a claim about what it needs"
      - "hidden: stucco cracks, only found if asked about cracks or condition, or if a close-up is requested"
      - "hidden: HOA color approval needed before work; changes scheduling and what colors are allowed"
      - "hidden: two stories and tight east side change access and lift needs"
      - "hidden: old thick coating, which changes prep"
    expected:
      category: painting
      job_type: exterior_stucco
      bank_job_type: "exterior painting"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["whole outside stucco repaint, two stories", "hairline cracks at window corners and one long crack on the west wall second story", "HOA requires color approval; not yet submitted", "faded and chalky on the sun side", "built about 1996", "painter supplies paint"]
      must_not_be_on_card: ["adobe", "any cause for the fading", "elastomeric or any product recommendation", "price or range", "advice about the cracks"]
      max_questions: 6
      notes: "The word adobe and 'resealed' should not leak onto the card as fact. The photo only hints at one crack; the long diagonal crack and the HOA rule appear only if the AI asks about surface condition and restrictions. A strong flow asks for a close-up of the cracks and asks whether an HOA or other rule limits colors."

  - id: painting_s03
    kind: wrong_self_diagnosis
    persona: "Man in his 60s, handy, confident, texts in full sentences with a few typos"
    opening_message: "Want my kitchen cabinets painted white. They're solid oak so they should take paint fine, just need a good painter who knows how to do cabinets. Dont want anything sprayed in the house tho"
    photo: "kitchen wide shot, dark brown cabinets with a uniform wood-grain pattern and a glossy finish; no close-up of any door edge"
    hidden_facts:
      - "the door and drawer fronts are laminate (a plastic-type wrapped skin over a pressed core), not solid oak; the frames and boxes are real wood"
      - "two door fronts beside the dishwasher have edges where the skin is lifting and curling"
      - "26 door fronts and 9 drawer fronts, kitchen only, plus a small island"
      - "he is keeping the existing hinges and pulls"
      - "he wants it done in the house without spraying inside, and the garage is available to use as a work area"
      - "cabinets are about 18 years old"
      - "he will supply the paint, he already bought a white"
    homeowner_behavior: "states his belief as fact; will answer 'solid oak' to any wood question; says the real truth about the edges only when asked specifically about the condition of the door edges or surfaces; reluctant to take more photos but will if asked"
    traps:
      - "wrong self-diagnosis: calls them solid oak; the doors are laminate and peeling at two edges"
      - "hidden: laminate doors change prep, bonding and often whether painting is viable; a top painter asks what the doors are made of and for an edge close-up"
      - "hidden: no spraying indoors, garage as work space"
      - "hidden: homeowner already bought the paint, which a painter may not want to use"
    expected:
      category: painting
      job_type: cabinets_paint
      bank_job_type: "cabinet painting"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["kitchen cabinets, 26 doors, 9 drawer fronts, small island", "homeowner says solid oak; doors may be laminate, two edges lifting (as reported)", "wants white, currently dark brown", "no spraying inside; garage available", "keeping existing hinges and pulls", "homeowner has bought the paint"]
      must_not_be_on_card: ["solid oak stated as fact", "will paint fine", "primer or product advice", "price or range", "diagnosis of why the edges are lifting"]
      max_questions: 6
      notes: "His own diagnosis is wrong. The card must carry both what he believes and what he later reports, as his words, without the AI deciding. A close-up of a door edge and an open question about the door material and condition are the high-value asks. He buys his own paint, which matters for the quote."

  - id: painting_s04
    kind: misleading_photo
    persona: "Woman in her 30s, texts fast with emojis and lowercase, very visual"
    opening_message: "i want my living room to look like this!! 😍 how much to paint it this color. (sending a pinterest screenshot)"
    photo: "a Pinterest screenshot of a living room with deep green walls, white trim and a tall window; it is not the homeowner's own room and has a watermark and heart icons"
    hidden_facts:
      - "the screenshot is inspiration only; it is not her room"
      - "her living room is open to the dining room and hallway, about 24 by 18 feet in total open space"
      - "ceiling is vaulted, about 17 feet at the peak, with a fan hanging from it"
      - "current walls are a light beige with a slightly rough orange-peel texture, last painted when she bought the house 6 years ago"
      - "she wants the deep green only on the living room walls and the rest left beige, but has not decided where the color stops in the open space"
      - "trim is white and she wants it left alone"
      - "house built in 2008"
      - "she has no paint picked out and wants help choosing the exact green"
      - "she has not taken a photo of her own room yet but can"
    homeowner_behavior: "excited; answers with emojis; assumes the screenshot answers everything; sends her own room photo only when asked for one; gets vague on measurements ('big')"
    traps:
      - "misleading photo: the picture is a Pinterest screenshot, not her room; the card must label it inspiration and still ask for photos of her actual room"
      - "hidden: vaulted ceiling of about 17 feet means scaffold or tall ladder work"
      - "hidden: open floor plan with an undecided color break line"
      - "hidden: going from light beige to a deep green is a big color change, a painter will want to know"
      - "hidden: she wants help choosing the exact color, so exact match to the screenshot is not a given"
      - "design: inspiration picture should travel on the card with the homeowner's own words about the look"
    expected:
      category: painting
      job_type: interior_rooms
      bank_job_type: "interior painting"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["inside living room repaint, open to dining and hallway", "inspiration image attached, not her room", "wants deep green on living room walls, white trim left alone", "vaulted ceiling about 17 feet", "current walls light beige", "needs help choosing the color", "photos of her actual room"]
      must_not_be_on_card: ["a named paint color or brand", "a promise to match the screenshot", "price or range", "the screenshot described as her room"]
      max_questions: 6
      notes: "The screenshot is a design reference and must stay labelled as inspiration, not as the job site. The AI should ask for photos of the real room and ceiling. The vaulted ceiling and the undecided color break line only come out if asked about ceiling height and where the color stops."

  - id: painting_s05
    kind: wrong_self_diagnosis
    persona: "Man in his 60s, practical, texts clearly, a little dismissive about the problem"
    opening_message: "got a brown stain on the living room ceiling from an old roof leak. just need it painted over, stain blocker and a coat of ceiling paint. whats the cheapest way"
    photo: "ceiling photo with a tan-brown irregular ring about 3 feet across and a slight sag at the lower edge; the ceiling is white and textured"
    hidden_facts:
      - "the stain appeared after the monsoon storms this past summer and the ring has grown after each rain"
      - "the roof over that room is a concrete tile roof, about 22 years old"
      - "nobody has had a roofer look at it"
      - "he thinks it is an old leak that is done; the ceiling felt damp to the touch after the last rain in October"
      - "no water-using fixtures or bathroom are above that room, it is a single-story house with an attic"
      - "the stain is near an AC duct vent in the ceiling"
      - "one small spot of dark specks has started near the edge of the ring"
    homeowner_behavior: "insists it is old and finished; answers factually when asked specific questions such as when it appeared, whether it changes after rain, what the roof is; does not volunteer the dampness unless asked if it is wet or has grown"
    traps:
      - "wrong self-diagnosis: calls it an old finished leak; facts say it grows after rain and was damp recently"
      - "right answer is a different category: roof_repair first; painting comes after the leak is fixed"
      - "hidden: damp ceiling, growing ring, dark specks, tile roof age; changes the roofer's visit and the painter's wait"
      - "AI must not say it is a roof leak, must not say 'do not paint yet' as advice; it routes and writes the facts"
    expected:
      category: roof_repair
      job_type: leak_repair
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["brown stain on living room ceiling, about 3 feet, growing after rain", "stain first appeared this summer's storms", "ceiling felt damp after last rain in October", "concrete tile roof about 22 years old", "no roofer has looked at it", "homeowner also wants the ceiling painted afterward"]
      must_not_be_on_card: ["the cause as fact", "mold", "paint over it", "price or range"]
      max_questions: 5
      notes: "He asks only for paint, but the facts point at a roof first. The right outcome is a roof_repair card that also notes painting is wanted after. The AI must reach this by asking when it appeared and whether it changes with rain, and must not diagnose or advise. If the facts had shown an upstairs bathroom instead, the answer would be plumbing_repair."

  - id: painting_s06
    kind: two_trades
    persona: "Woman in her 40s, texts in short bursts, a bit stressed, two-story house"
    opening_message: "the ceiling in my downstairs hallway has a big yellow ring and the paint is bubbling. i just want it repainted before my in-laws come in 2 weeks. its right under the upstairs bathroom"
    photo: "hallway ceiling with a yellow-brown ring about 2 feet across, bubbled and flaking paint at the center, white wall below"
    hidden_facts:
      - "the upstairs bathroom has a shower and tub; the ring is directly under the tub side"
      - "the ceiling spot gets a bit wetter after someone takes a shower, she noticed this last week"
      - "the bathroom floor tile grout beside the tub has been cracked for a while"
      - "no plumber or roofer has looked at it"
      - "house is about 2,000 sq ft and was built in 2001"
      - "she wants only the hallway ceiling and the upper wall repainted, about 12 feet of hallway"
      - "in-laws arrive on the first Saturday of next month"
    homeowner_behavior: "stressed about the visit; only talks about paint; says it gets wetter after showers only if asked whether it changes with water use or when it gets wetter"
    traps:
      - "two trades: ceiling water damage tied to the upstairs bathroom is a plumbing_repair first, painting second"
      - "hidden: wetter after showers, cracked grout beside the tub; changes who should come first"
      - "AI must not diagnose it as a shower leak; it records her observation as her words"
      - "timing: she has a hard date, which matters to both trades but is not an emergency"
    expected:
      category: plumbing_repair
      job_type: leak_slow
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["downstairs hallway ceiling stain and bubbling paint, right under the upstairs bathroom tub side", "spot gets wetter after showers per homeowner", "cracked grout beside the tub", "no plumber or roofer has looked", "ceiling repaint wanted afterward before a visit in 2 weeks"]
      must_not_be_on_card: ["the shower pan or grout as the cause", "stop using the shower", "price or range", "mold"]
      max_questions: 5
      notes: "She asks for paint but the facts point to plumbing_repair first, then painting. The second trade (painting) is wanted afterward and the card should say so. The AI must not give advice like stop using the shower; it is not on the fire list. Urgency is a date, not a risk."

  - id: painting_s07
    kind: tenant
    persona: "Man in his late 20s renting a condo, texts casually, practical, short on time"
    opening_message: "im moving out of my rental on the 8th and landlord said walls need to be touched up and the accent wall repainted white or i lose deposit. need someone quick"
    photo: "bedroom wall painted deep purple with several scuffs and nail holes, a white wall next to it with a few dark marks"
    hidden_facts:
      - "he rents a 2 bedroom condo in Lake Havasu City, about 950 sq ft"
      - "one bedroom accent wall is painted dark purple (he painted it himself, not approved)"
      - "about 15 nail holes and several scuffs and crayon marks around the condo, mostly the hallway and second bedroom"
      - "the property manager sent the move-out list but he has not got a written ok for a painter to be in the unit"
      - "he is paying, not the landlord; the landlord told him to use a painter"
      - "move-out date is the 8th, 9 days away"
      - "building was built in 1985"
      - "the landlord has the paint color, flat white, in a spare can in the unit closet"
    homeowner_behavior: "casual; does not think about permission; says he has a can of landlord paint only when asked who supplies paint; gives the move-out date upfront; gives the access issue only if asked about access or approval"
    traps:
      - "tenant: not the owner; needs the owner or property manager to allow the work and access; card should say renter and who approves"
      - "hidden: dark purple accent wall needs more than a touch-up, he thinks it is a touch-up"
      - "hidden: hard deadline of 9 days"
      - "hidden: paint supplied by landlord in the unit"
    expected:
      category: painting
      job_type: touch_up
      bank_job_type: "interior painting"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["renter, move-out on the 8th", "one accent wall dark purple to be repainted white", "about 15 nail holes, scuffs and crayon marks in hallway and second bedroom", "2 bedroom condo about 950 sq ft", "landlord's paint is in the unit", "needs the owner or property manager to allow access"]
      must_not_be_on_card: ["will get his deposit back", "legal advice about the lease", "price or range"]
      max_questions: 5
      notes: "Looks like a simple touch-up but the dark accent wall is more than that and the deadline is tight. A renter is the requester, so the card must show who approves access. The AI should not give lease or deposit advice."

  - id: painting_s08
    kind: elderly
    persona: "Woman in her late 70s, widow, types slowly with typos and capital letters in odd places, polite, formal, and signs her texts"
    opening_message: "Hello. I am hoping someone can come and paint my bathroom and hall. The paint in the bathroom is coming off in sheets above the shower. Thank you, Margaret"
    photo: "bathroom wall above the shower with paint curling off in large flakes, bare gray patches underneath; photo is a bit dark"
    hidden_facts:
      - "house built in 1969"
      - "the bathroom has no window and the exhaust fan stopped working years ago"
      - "the hallway is about 25 feet long and looks dingy, with scuffs at hand height and a yellow tint near the ceiling from years of a smoker in the house"
      - "she lives alone and cannot move furniture or climb a ladder"
      - "her grandson can come to help move things on a weekend"
      - "she wants it done in light colors, white or cream"
      - "ceilings are painted and flat, she does not want them done"
      - "she would like the painter to bring the paint"
      - "she does not use text for photos easily but a neighbor helped send the one picture"
    homeowner_behavior: "polite and formal; short replies; apologizes for mistakes; will answer one question at a time; needs plain words; does not volunteer the fan or the smoke staining unless asked about the room or the hallway"
    traps:
      - "hidden: built 1969 with peeling paint; a painter will want to know about the home age"
      - "hidden: no working exhaust fan in a windowless bathroom (do not state a cause)"
      - "hidden: yellow nicotine-type staining in hallway, changes prep and primer"
      - "hidden: she cannot move furniture; changes the scope and who helps"
      - "elderly: patience with confused words; no jargon in questions"
    expected:
      category: painting
      job_type: interior_rooms
      bank_job_type: "interior painting"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["bathroom and hallway walls, paint peeling in sheets above the shower", "house built in 1969", "bathroom has no window and the exhaust fan does not work", "hallway about 25 feet with yellow staining and scuffs", "client cannot move furniture, grandson can help on weekends", "light colors, painter supplies paint", "ceilings not included"]
      must_not_be_on_card: ["lead", "moisture or humidity as the cause", "mold", "price or range", "advice"]
      max_questions: 6
      notes: "The AI must keep questions short and plain and stay patient. The facts that matter are the 1969 build year, the dead fan, the yellow staining and that she cannot move furniture; she gives none of them unprompted. The AI must not name lead or moisture as a cause."

