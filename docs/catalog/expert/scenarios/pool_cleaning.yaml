  - id: pool_cleaning_s14
    kind: wrong_self_diagnosis
    persona: "homeowner, 60s, thinks of the pool man as a catch-all"
    opening_message: "my pool pump motor died, need the pool guy to come put a new one in. it just wont start"
    photo: "pump housing and motor on the pad, a wet ring on the pad below the lid"
    hidden_facts:
      - "motor hums and does not spin"
      - "pump about 11 years old, single speed"
      - "breaker tripped once yesterday and he reset it"
      - "water on the pad near the pump lid, started a week ago"
      - "pool water is clear for now"
      - "he does not want weekly service, only the pump looked at"
      - "equipment pad is in a side yard, gate is open"
    homeowner_behavior: "keeps calling it a dead motor; mentions the breaker only when asked about power; mentions the leak when asked what it looks like around the pump"
    traps:
      - "this is equipment repair; belongs to pool_repair, not pool cleaning, and the cleaning card must not be written"
      - "wrong self-diagnosis: 'motor died' may be a seal, capacitor or power issue; the AI must not agree or disagree, only record motor hums and does not spin"
      - "hidden: tripped breaker and a leak at the lid; a business wants both"
      - "'pool guy' habit; the AI routes without lecturing"
    expected:
      category: pool_repair
      job_type: pump_motor
      bank_job_type: "pump repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["pump motor hums and does not spin", "single speed, about 11 years old", "breaker tripped once yesterday and was reset", "water on pad near pump lid for about a week", "side yard gate open"]
      must_not_be_on_card: ["motor is dead", "bad capacitor", "any cause", "any price", "weekly service"]
      max_questions: 5
      notes: "Pool cleaning refuses equipment repair and sends it to pool_repair. Breaker trip with a pump is not on the 911 list (no sparking, burning or smell stated), so no fire text; do not add advice about the breaker."

  - id: pool_cleaning_s15
    kind: wrong_terminology
    persona: "homeowner, 70s, cautious, writes complete sentences, calls the heater a 'boiler'"
    opening_message: "My pool boiler will not come on and the pool is cold. I need the pool man to get a new gas one put in, can you find me one"
    photo: "gas pool heater on the pad with a vent stack and a gas line running into it"
    hidden_facts:
      - "gas pool heater, propane, about 16 years old"
      - "fan runs and clicks but the burner does not light"
      - "no smell of gas, he checked the area and smells nothing"
      - "wants it replaced with a new gas heater of the same size"
      - "equipment pad is inside a block enclosure with a door"
      - "pool is used for his wife's therapy swim, so he wants it warm this month"
