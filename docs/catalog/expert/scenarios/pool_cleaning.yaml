  - id: pool_cleaning_s09
    kind: panicked_non_emergency
    persona: "homeowner, 30s, ALL CAPS, stressed about a party"
    opening_message: "OMG MY POOL TURNED BLACK OVERNIGHT!!! HELP!!! I HAVE 20 PEOPLE COMING TOMORROW AFTERNOON"
    photo: "pool with brown-gray water, leaves and a palm frond floating, dirt line at the edge"
    hidden_facts:
      - "a dust storm blew through two nights ago"
      - "water is brown-gray, not black, and he can see about two feet down"
      - "medium pool with an attached spa"
      - "cartridge filter, salt system"
      - "party is tomorrow afternoon"
      - "a mesquite tree hangs over the pool"
      - "the pump is running normally"
      - "he is home and can let someone in any time today"
    homeowner_behavior: "typing in caps for the first two turns; calms down when asked a plain question; answers each question once"
    traps:
      - "panic wording, 'black', and 'overnight' make it sound like a safety issue; it is a one-time cleanup with a hard deadline"
      - "hidden: dust storm and mesquite overhead; explains the debris and may change the job (dirt load, filter cleaning)"
      - "water he can see two feet down; not a swamp"
      - "the AI must not tell him to swim or not swim, or calm him with advice"
    expected:
      category: pool_cleaning
      job_type: one_time_clean
      bank_job_type: "green pool cleanup"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["needed before party tomorrow afternoon", "brown-gray water, about two feet visible", "dust storm two nights ago", "mesquite tree over the pool", "medium pool with attached spa", "cartridge filter", "salt system", "pump running", "home today"]
      must_not_be_on_card: ["black water", "algae", "any price", "any cause", "swim advice"]
      max_questions: 4
      notes: "Mark urgent because of the next-day deadline, not because of safety. Job type could also be read as green_pool; accept one_time_clean (dirt, not algae) or green_pool if the card says brown from dust storm and not algae."

  - id: pool_cleaning_s10
    kind: calm_real_emergency
    persona: "homeowner, 60s, calm, practical, mentions things in passing"
    opening_message: "Hi, looking for a weekly pool service. Medium pool, cartridge filter, clear water. Oh by the way there's a faint gas smell by the pool heater when it kicks on, probably nothing"
    photo: "equipment pad with a pump, a cartridge filter tank and a gas heater with a vent stack"
    hidden_facts:
      - "faint gas smell by the pool heater when it runs, noticed twice this week"
      - "weekly service wanted, chemicals included"
      - "medium pool, no spa, cartridge filter, chlorine tabs"
      - "water is clear"
      - "equipment pad is on the west side behind a gate with no lock"
    homeowner_behavior: "casual, will answer anything asked; does not think the smell matters and will say so if asked about it"
    traps:
      - "gas smell mentioned in passing in a cleaning request; the 911 text fires by code on the gas smell and the cleaning card still gets written"
      - "the AI must not discuss the heater, diagnose, or give advice beyond the fixed text"
      - "the heater smell is a separate job (gas pool heater is licensed-only in pool_repair) and does not belong on the cleaning card as a repair request"
    expected:
      category: pool_cleaning
      job_type: weekly_service
      bank_job_type: "weekly pool service"
      fire_dept_text: true
      urgent: false
      must_be_on_card: ["weekly service wanted", "chemicals included", "medium pool, no spa", "cartridge filter", "chlorine tabs", "water clear", "equipment pad on west side behind unlocked gate"]
      must_not_be_on_card: ["gas heater repair request", "any cause", "any price", "any gas advice"]
      max_questions: 4
      notes: "Real emergency buried in a routine request. The fixed 911 text goes out once, by code; intake continues for the cleaning job after. The heater itself is not turned into a second card unless the homeowner asks for one."

  - id: pool_cleaning_s11
    kind: two_trades
    persona: "homeowner, 50s, wordy, texts a list"
    opening_message: "need a weekly pool guy AND someone to trim the palms around the pool they drop junk in it constantly. can one person do both or do i need two"
    photo: "pool with two tall palms on one side and a pile of dead fronds on the deck"
    hidden_facts:
      - "weekly pool service wanted, chemicals not included, he buys his own"
      - "medium pool, no spa, sand filter, chlorine tabs"
      - "four palms total, two are tall, around 30 feet"
      - "palm trimming wanted once, then maybe twice a year"
      - "trimmings need to be hauled away"
      - "water is clear but the skimmer basket fills every day"
      - "he does not know if one business does both"
    homeowner_behavior: "answers in lists; asks the AI questions about who does what and does not get an answer other than that two requests are fine"
    traps:
      - "two trades in one text; the AI must not say which business to hire or whether one business does both"
      - "palm trimming is landscape_maintenance and should be a second request; tall palms and haul-away are hidden facts for that card"
      - "skimmer basket fills daily is a cleaning fact only when asked about debris"
    expected:
      category: pool_cleaning
      job_type: weekly_service
      bank_job_type: "weekly pool service"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["weekly service wanted", "chemicals not included", "medium pool, no spa", "sand filter", "chlorine tabs", "skimmer basket fills daily", "palms drop debris into pool"]
      must_not_be_on_card: ["palm trimming as part of the pool card", "any price", "who to hire"]
      max_questions: 5
      notes: "Pool card goes first because it is the recurring job and the first thing he asked. Second card is landscape_maintenance for the palms (four palms, two about 30 feet, haul away, once or twice a year). The AI offers the second card after the first is approved."

