      fire_dept_text: false
      urgent: false
      must_be_on_card: ["paver patio about 4 x 6 meters (about 13 x 20 ft) on bare dirt", "gray concrete pavers", "cracked sprinkler pipe in the work area, spraying water", "side gate about 3 ft wide", "wants it done in about six weeks"]
      must_not_be_on_card: ["any price", "call 811", "any cause", "any contractor name", "safe to dig"]
      max_questions: 5
      notes: "Spanish plus a metric-size trap. The cracked riego pipe is a second small repair the paver crews will not scope; the card carries it as a fact in the work area, and the AI should not offer to route it. Water spraying from a plastic line is not a fire-truck item."

  - id: pavers_hardscape_s09
    kind: panicked_non_emergency
    persona: "woman in her 30s, new homeowner, writes in bursts of capital letters and exclamation marks"
    opening_message: "HELP the ground next to my pool just OPENED UP there is a HOLE under the pavers!!! its getting bigger after the storm last night!!! i dont know what to do"
    photo: "pool-side paver area with several pavers dropped into a rounded void about two feet wide, wet dirt visible at the edge, a downspout elbow lying near the hole"
    hidden_facts:
      - "hole is about 2 feet wide and about 18 inches deep, directly beside the pool deck"
      - "it appeared after a heavy monsoon storm last night"
      - "a downspout from the roof drains onto that corner"
      - "no one has fallen in; kids and a dog are inside the house"
      - "the pool equipment pad is about 10 feet from the hole"
      - "the pool water level looks normal today"
      - "she has put an overturned patio chair over it"
      - "there is no smell and no sound of anything"
    homeowner_behavior: "writes in panic, repeated exclamation marks, calms down and answers clearly after a question, no more than 5 questions before getting angry that nobody answered what to do"
    traps:
      - "panicked but not on the fire-truck list: no gas smell, no electrical sparking, no smoke; the AI must not send the 911 text and must not tell her to stay away or call anyone"
      - "hidden: downspout drains onto the corner; only comes out if asked where water goes"
      - "hidden: pool equipment 10 feet away and normal pool level; the card should carry them as facts without any guess"
      - "the card must flag urgent, since a hole by a pool deck is a hazard businesses should see first, without advice to the homeowner"
      - "she will demand 'what do I do' and the AI must say it cannot advise, only get quotes going"
    expected:
      category: pavers_hardscape
      job_type: paver_repair
      bank_job_type: "paver patio"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["hole about 2 ft wide and 18 in deep beside the pool deck", "pavers dropped into it", "appeared after last night's storm", "downspout drains onto that corner", "pool equipment pad about 10 ft away, pool water level normal", "no one hurt, kids and dog indoors", "flagged urgent"]
      must_not_be_on_card: ["sinkhole", "pool leak", "any cause", "any price", "any contractor name", "stay away from the hole", "any advice"]
      max_questions: 4
      notes: "Frightening but not on the 911 list, so no fire-truck text and no safety advice. The hole is the kb emergency signal 'hole or collapse under a slab', which the catalog treats as urgent for the business, not a code text. The test is whether the AI stays calm, asks about water source and pool equipment, and marks it urgent."

