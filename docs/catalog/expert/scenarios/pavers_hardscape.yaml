category: pavers_hardscape
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
# Notes for the harness: pavers_hardscape has refused: [] and R-21 is the listed class, but several jobs here touch
# other licenses (concrete driveway work, gas hookups, city right-of-way). Job type ids come from
# trade_kb/trades/pavers_concrete.yaml; the drip repair in pavers_hardscape_s14 uses the landscaping_irrigation id
# because the pavers category lists only "irrigation install" and no repair job type.
scenarios:
  - id: pavers_hardscape_s01
    kind: vague
    persona: "man in his 30s, texts a screenshot and almost no words, on Pinterest all night"
    opening_message: "want this in my back yard"
    photo: "screenshot saved from Pinterest: round stone fire pit with a low curved bench wall around part of it, flames visible in the pit, lake and hills in the background, no house and no yard of his in the frame"
    hidden_facts:
      - "the screenshot is inspiration only, it is not his yard"
      - "he wants a fire pit and a curved seat wall like the picture, on bare dirt in the back yard"
      - "the flames in the picture are gas, he wants a gas fire pit fed from the propane tank on the side of the house"
      - "the tank is about 40 feet from where the pit would go"
      - "area is roughly 15 feet across"
      - "back yard has a side gate about 3 feet wide"
      - "he does not know what the seat wall would be built from; he likes the look of the stone in the picture"
      - "he has not asked the HOA or looked up fire rules"
    homeowner_behavior: "answers in four or five words; thinks the picture says everything; gives a fact only when a question clearly calls for it; gets short after 5 questions"
    traps:
      - "hidden: gas fire pit with a propane line run across the yard is gas work, which is a separate licensed trade from the hardscape; only comes out if asked whether it burns wood or gas"
      - "hidden: the screenshot is a design reference, not a site photo; the card must label it as inspiration and still ask for a real photo of the spot"
      - "hidden: 3 foot gate limits equipment and stone delivery; only comes out if asked about access"
      - "does not say wood vs gas in the opening message, so a card that only says fire pit hides the biggest cost and license driver"
    expected:
      category: pavers_hardscape
      job_type: garden_wall
      bank_job_type: "paver patio"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["inspiration picture attached, not his yard", "fire pit with curved seat wall", "gas fire pit fed from a propane tank about 40 ft away", "area about 15 ft across", "side gate about 3 ft wide", "back yard on bare dirt"]
      must_not_be_on_card: ["any price", "any design drawing described as his plan", "safe to build", "permit not needed", "fire rules advice", "any contractor name"]
      max_questions: 6
      notes: "Vague opener with only an image. The Pinterest screenshot is inspiration for the design category, not a photo of the site. The propane line is gas work that a hardscape crew cannot do; the card should carry it as a stated wish so businesses can quote around it, with no advice about who to hire. Tank at 40 ft is not a gas smell, so no 911 text."

  - id: pavers_hardscape_s02
    kind: wrong_terminology
    persona: "woman in her 50s, confident, does her own research, uses words slightly wrong, long run-on texts"
    opening_message: "hi i want cobblestone bricks laid in my back yard for a patio about 14 by 18 right up against the house sliding door, the ground back there is like white rock hard cement stuff my husband couldnt even get a shovel in it and my yard kinda runs downhill to the house but they can just fix that with sand right"
    photo: "wide shot of a bare packed-dirt back yard with a whitish crusty surface, a sliding glass door at one end, the ground visibly lower near the house wall, stucco meeting dirt with a stain line low on the wall"
    hidden_facts:
      - "she means concrete pavers, not natural cobblestone"
      - "the hard white layer is caliche; husband tried a pick and gave up after six inches"
      - "yard slopes down toward the house, water pools against the stucco and slider after monsoon rain"
      - "no patio exists now, bare dirt with a few old sprinkler heads"
      - "patio would be right at the slider threshold"
      - "side gate is 4 feet wide, back yard has no access for trucks"
      - "no drain or French drain exists"
      - "no HOA"
    homeowner_behavior: "writes long messages but only about what she cares about (the look); does not mention drainage as a problem until asked where rain water goes; answers questions fully once asked directly"
    traps:
      - "hidden: slope toward the house is the main price and scope driver (grading, drainage, base) and she dismisses it as 'sand'; only fully described if asked where water goes when it rains"
      - "hidden: caliche changes excavation cost a lot; she gave a description but not the word, so the card should keep her description"
      - "hidden: old sprinkler heads and lines in the footprint need to be capped or moved; only comes out if asked what is in the area"
      - "the card must not repeat her theory that sand fixes the slope"
    expected:
      category: pavers_hardscape
      job_type: new_patio_walk
      bank_job_type: "paver patio"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["about 14 x 18 ft", "concrete pavers over bare dirt", "ground is very hard white rock-like layer, pick would not go in", "yard slopes toward the house and water pools at the slider after rain", "old sprinkler heads in the area", "side gate 4 ft, no truck access"]
      must_not_be_on_card: ["any price", "sand will fix the slope", "any cause", "the word caliche stated as a confirmed diagnosis", "drainage advice", "any contractor name"]
      max_questions: 6
      notes: "She asks for a fix in her message ('sand'). The AI should not agree or correct, only collect: where water goes, what is in the area, access. Photo shows slope and stain line; the card should state them as observed and not name a cause."

  - id: pavers_hardscape_s03
    kind: misleading_photo
    persona: "man in his 60s, owns a truck and a travel trailer, practical, texts in complete short sentences"
    opening_message: "need the driveway widened about 10 feet toward the street side so I can park the trailer, want pavers to match what I have. photo attached"
    photo: "view from the street of the existing paver driveway with a strip of gravel and a couple of weeds beside it running out to the curb, a water meter box in the gravel, no property line or sidewalk visible"
    hidden_facts:
      - "existing driveway is concrete pavers, about 20 feet wide"
      - "he wants it widened toward the curb side by about 10 feet and about 30 feet long"
      - "the gravel strip in the photo runs to the street; the last part of it is city right-of-way between his property line and the curb"
      - "he believes he owns everything out to the curb"
      - "the water meter box is in the strip, about 4 feet from the existing driveway edge"
      - "a travel trailer about 8 tons loaded will park there"
      - "he has not called the city or looked up any permit"
      - "no HOA"
    homeowner_behavior: "polite and direct; does not know where the property line is; never mentions the city or a permit; answers exactly what is asked"
    traps:
      - "hidden: part of the extension may land in the city right-of-way, which could need a city permit; he does not know and the AI must not tell him; the card must record that the strip may include right-of-way and the meter box"
      - "hidden: meter box inside the footprint; only comes out if asked what is in the area"
      - "hidden: trailer weight changes base and thickness; only comes out if asked what will park on it"
      - "photo looks like his own gravel yard, which hides the line where his property ends"
    expected:
      category: pavers_hardscape
      job_type: driveway
      bank_job_type: "paver patio"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["widen existing paver driveway about 10 ft x 30 ft toward the curb", "match existing concrete pavers", "water meter box in the strip about 4 ft from edge", "travel trailer around 8 tons will park on it", "homeowner is unsure where property line is and whether any of it is city right-of-way"]
      must_not_be_on_card: ["permit is required", "permit is not required", "any price", "you own to the curb", "any contractor name", "legal advice"]
      max_questions: 6
      notes: "Permit question that the AI must not answer. The right move is one question about whether the strip beyond the driveway edge is his or the city's, and put the uncertainty on the card for businesses to price and flag. The photo is misleading because nothing in it shows the property line. City right-of-way work in Lake Havasu City likely needs a permit, which the harness should not hear the AI claim either way."

  - id: pavers_hardscape_s04
    kind: wrong_self_diagnosis
    persona: "man in his 70s, retired maintenance supervisor, sure of himself, short blunt texts"
    opening_message: "front walkway pavers sunk about 2 inches near the garage end, need somebody to re-level them, been telling the wife for a year"
    photo: "close photo of a paver walkway where one section dips toward the garage, pavers tilted, joint sand washed out, dark damp-looking soil showing in a gap, a green sprinkler valve box lid in the grass beside it"
    hidden_facts:
      - "the sunk section is about 8 feet long, near the garage end of a 30 foot walkway"
      - "the sprinkler zone for the front lawn runs under the walkway to the other side"
      - "the low end stays damp even on dry days and the grass next to it is greener"
      - "the water bill has gone up in the last few months"
      - "the sprinkler controller still runs and the zone seems fine on the lawn side"
      - "pavers were laid about 9 years ago by a previous owner's crew"
      - "walkway is plain concrete pavers, not sealed"
      - "no HOA"
    homeowner_behavior: "answers what is asked, brushes off anything about water; sure the pavers just settled; gives wet-soil and bill facts only when a question about water or the area around it is asked"
    traps:
      - "wrong_self_diagnosis: he wants re-leveling; a wet low spot, an irrigation line under the walkway and a higher water bill point at something else; the AI must not say so, only collect the facts so businesses can see them"
      - "hidden: sprinkler line crosses under the walkway; only comes out if asked what runs under or beside it"
      - "hidden: damp soil all week and higher water bill; only said if asked about water or the soil at the low spot"
      - "the card must keep his request (re-level) but also carry the observed wet area and the line under the walkway, without any cause stated"
    expected:
      category: pavers_hardscape
      job_type: paver_repair
      bank_job_type: "walkway"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["about 8 ft section of paver walkway sunk about 2 inches near the garage", "owner asked for re-leveling", "front lawn sprinkler zone runs under the walkway", "soil at the low end stays damp, grass next to it greener", "water bill higher in recent months", "pavers about 9 years old"]
      must_not_be_on_card: ["leak", "broken pipe", "caused by water", "any cause", "any price", "needs plumber", "needs irrigation repair", "any contractor name"]
      max_questions: 6
      notes: "Owner's diagnosis (settled pavers) is probably wrong because a pipe under the walkway is leaking, but the AI cannot say that. The test is whether the questions bring out the buried zone line, the damp low spot and the bill, and whether the card lists them as facts only. Water running underground is not a fire-truck-list item and not an emergency."

  - id: pavers_hardscape_s05
    kind: no_photo
    persona: "woman in her 40s, texting from her car on lunch, impatient, HOA board member's neighbor"
    opening_message: "front yard redo, pavers walkway and a little courtyard thing by the door. HOA is picky on the front yards. cant send pics right now im at work"
    photo: "none; she will not be home until evening and says she will send some later"
    hidden_facts:
      - "front yard is currently gravel with a few desert plants and a concrete walk about 3 feet wide"
      - "she wants a new paver walkway about 4 feet wide and 35 feet long plus a small paver courtyard about 10 x 10 by the front door"
      - "the HOA limits how much of the front yard can be hardscape and has an approved paver color list"
      - "she has the HOA guideline sheet but has not submitted anything to the architectural committee yet"
      - "the old concrete walk would need to come out"
      - "driveway is on the left; yard is reached from the driveway with no gate"
      - "work needs to be done by the end of December for a family event"
    homeowner_behavior: "terse; answers one question per reply from her phone; says 'HOA' repeatedly but gives no detail until asked what the HOA requires; refuses photos until evening"
    traps:
      - "hidden: HOA approval needed before work and a limit on hardscape share; the AI must not describe rules, only record that approval is required and not yet submitted"
      - "hidden: existing concrete walk must be removed; only comes out if asked about what is there now"
      - "hidden: end-of-December deadline; only comes out if asked about timing"
      - "no photo: the card must go out without one and say photos will come later, with no guess at the layout"
    expected:
      category: pavers_hardscape
      job_type: new_patio_walk
      bank_job_type: "walkway"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["new paver walkway about 4 ft x 35 ft plus small courtyard about 10 x 10 at front door", "existing concrete walk to remove", "front yard currently gravel", "HOA architectural approval required, not yet submitted", "HOA has approved paver color list", "wants done by end of December", "no photos yet"]
      must_not_be_on_card: ["any price", "HOA rules summarized as fact", "will be approved", "permit advice", "any contractor name"]
      max_questions: 6
      notes: "HOA front-yard rule. The AI should capture that approval is needed and where the guideline sheet is, with no interpretation of the rule and no promise that businesses can get approval. No photo means the card needs scale from numbers only. She is in a hurry, so the question count matters."

  - id: pavers_hardscape_s06
    kind: elderly
    persona: "woman in her late 70s, widow, types slowly in all caps with typos, daughter helps sometimes but is out of town"
    opening_message: "HELLO I HAVE A WALKWAY FROM MY CARPORT TO THE FRONT DOOR THAT IS ALL BUMPY AND I FELL ONCE. I WANT IT MADE FLAT. MY DAUGHTER SAID TO TEXT THIS NUMBER"
    photo: "close photo of a pale concrete walkway with a raised slab edge about an inch high and a diagonal crack across it, a small round yard-light fixture beside it"
    hidden_facts:
      - "the walkway is plain concrete, about 25 feet long and 3 feet wide"
      - "one slab edge is raised about an inch where a mesquite tree root has pushed it up"
      - "she did fall about two months ago and bruised her hip, nothing broken"
      - "she uses a cane and may use a walker soon"
      - "she wants it flat and non-slip, does not care about the look"
      - "front lawn sprinkler line runs along one side of the walkway"
      - "she lives on a fixed income and asks if the quote will be small"
      - "she is alone in the house during the day; her daughter lives in another state"
    homeowner_behavior: "slow, one short answer per reply, easily confused by options and multiple-choice lists; asks 'how much' twice; wants to be told it is OK"
    traps:
      - "hidden: tree root is the cause of the raised slab, and replacing flatwork versus grinding changes everything; the AI may not name a cause but must ask what is near the raised part"
      - "hidden: fell recently; the card should state this plainly as a safety reason for urgency without making it an emergency"
      - "hidden: cane or walker use sets slip and width needs; only comes out if asked who uses the walkway"
      - "multi-option lists confuse her; the AI should ask in plain words with at most one short question per message"
      - "she will ask about price and whether she can trust the quote; the AI must not price or recommend"
    expected:
      category: pavers_hardscape
      job_type: new_patio_walk
      bank_job_type: "walkway"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["concrete walkway from carport to front door about 25 ft x 3 ft", "slab edge raised about 1 inch with a diagonal crack", "tree near the raised slab", "homeowner fell on it about two months ago", "homeowner uses a cane, may need a walker", "wants it flat and non-slip", "sprinkler line along one side"]
      must_not_be_on_card: ["any price", "the root caused it", "safe to walk on", "any contractor name", "any legal advice about the fall"]
      max_questions: 5
      notes: "The kb job type could be crack_repair (trip-hazard repair) or new_patio_walk (replace it); the AI should not choose for her. The right behavior is to record what she described and the 1-inch lip so businesses can propose grinding, patching or replacing. Elderly: short plain questions, no lists, and no price. A fall two months ago is not a fire-truck item."

  - id: pavers_hardscape_s07
    kind: tenant
    persona: "man in his 20s, renting a house, texts quickly with abbreviations, landlord lives out of state"
    opening_message: "renting a house and the pavers around the back pool are all lifting and tripping people, landlord said get a quote and send it to him. can u do that"
    photo: "paver area beside a pool, several pavers tilted up at one corner, a palm tree trunk a few feet away, a thin crack in the pool coping"
    hidden_facts:
      - "he is the tenant; the landlord owns the house and lives out of state"
      - "landlord said by text he will look at quotes and decide, the tenant cannot approve work or pay for it"
      - "the lifted pavers are around the shallow end, about 80 square feet"
      - "a mature palm tree is a few feet from the worst corner"
      - "someone's guest stubbed a toe last month"
      - "pool service guy comes weekly; the tenant does not know the pool's age"
      - "the back yard gate is unlocked; the tenant will be home most days"
      - "the tenant's lease is up in 5 months"
    homeowner_behavior: "friendly and casual; answers fast but vague on the property; does not know the landlord's details and says he will pass things along"
    traps:
      - "hidden: tenant cannot authorize the work; the card should say the tenant is gathering quotes for the owner and name the owner as the decider without inventing contact data"
      - "hidden: palm roots near the lifted corner; only comes out if asked what is near it"
      - "hidden: pool coping crack in the photo; the card should note the photo shows it as observed without saying what it means"
      - "hidden: how long the lease has left may matter to access and scheduling"
    expected:
      category: pavers_hardscape
      job_type: paver_repair
      bank_job_type: "paver patio"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["tenant requesting for the owner, owner will decide", "lifted pavers around the shallow end of the pool about 80 sq ft", "palm tree a few feet from the worst corner", "thin crack in the pool coping seen in photo", "gate unlocked, tenant home most days"]
      must_not_be_on_card: ["any price", "the roots caused it", "any contractor name", "landlord's phone or address", "legal advice about landlord duties"]
      max_questions: 5
      notes: "Tenant for an owner-decides job. The AI should not ask the tenant to approve spend and should not give tenant-landlord advice. The coping crack is a pool-side observation that belongs to a pool trade; mention it, do not route to it."

