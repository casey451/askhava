      - "hidden: broken sprinkler line currently spraying water in the work area; only fully described if asked what is in the area or whether water is on"
      - "hidden: he has not marked utilities and dug already; the AI must not give 811 advice"
      - "the AI must reply in Spanish and write the card so English-speaking businesses can read it"
      - "he asks for price in the first message; the AI must not give one"
    expected:
      category: pavers_hardscape
      job_type: new_patio_walk
