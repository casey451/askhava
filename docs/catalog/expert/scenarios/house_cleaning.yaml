category: house_cleaning
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: house_cleaning_s01
    kind: vague
    persona: "30s, busy, texts one line at a time, no punctuation"
    opening_message: "need a cleaner"
    photo: "none"
    hidden_facts:
      - "wants a regular clean, every two weeks"
      - "3 bedrooms, 2 bathrooms"
      - "three large dogs that shed, one is a husky mix"
      - "shower glass in both bathrooms is covered in white hard-water spots"
      - "two-story house, stairs have carpet"
      - "has not had a professional clean in about 5 months"
    homeowner_behavior: "answers only the question asked, in few words; does not mention dogs, hard water or the carpeted stairs unless a question calls for it; says 'idk' to open-ended questions"
    traps:
      - "hidden: three shedding dogs, only said if asked about pets"
      - "hidden: heavy hard-water spotting on shower glass, only said if asked about condition or a problem area photo"
      - "hidden: long gap since last clean makes the first visit bigger than a maintenance clean"
    expected:
      category: house_cleaning
      job_type: recurring
      bank_job_type: "regular cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["every two weeks", "3 bedrooms", "2 bathrooms", "3 dogs", "about 5 months since last clean"]
      must_not_be_on_card: ["any price", "any hourly rate", "recommended business"]
      max_questions: 5
      notes: "Four-word opener. The AI has to get type, frequency, size, baths and pets without sounding like a form. A card with no pet count or no gap since last clean quotes badly."

  - id: house_cleaning_s02
    kind: wrong_terminology
    persona: "50s, owns a lake house rented on weekends, chatty, mixes up words"
    opening_message: "looking for a deep clean crew for my airbnb. every time guests leave. also do u guys handle the booking and collecting rent from the guests? my last girl only did the cleaning"
    photo: "none"
    hidden_facts:
      - "3 bedrooms, 2 bathrooms, short-term rental in Lake Havasu City"
      - "guests check out at 11am and next guests arrive at 4pm on busy weekends"
      - "linens must be washed and remade; washer and dryer are in the garage"
      - "about 4 turnovers a month, more in summer"
      - "uses a lockbox at the front door"
      - "owner lives in Phoenix and is not on site"
      - "wants cleaning only; the owner does bookings and payments through the rental site"
    homeowner_behavior: "friendly, over-explains, goes off on tangents about a bad guest; answers questions when asked directly"
    traps:
      - "terminology: 'deep clean every time guests leave' is a turnover, not a one-time deep clean"
      - "scope: asking the service to handle bookings and collect rent is not something Ask Hava includes; card must be cleaning only"
      - "hidden: 5 hour window on busy weekends, only said if asked about timing between guests"
      - "hidden: linens washed on site, owner is out of town so access is by lockbox"
    expected:
      category: turnover_cleaning
      job_type: str_turnover
      bank_job_type: "turnover clean"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["vacation rental turnover", "3 bedrooms, 2 bathrooms", "about 4 turnovers a month", "linens washed and remade", "lockbox", "5 hours between check-out and check-in on busy weekends"]
      must_not_be_on_card: ["booking management", "rent collection", "one-time deep clean", "any price"]
      max_questions: 5
      notes: "Must route from house_cleaning wording to turnover_cleaning despite 'deep clean'. The rent collection ask has to be left off the card (refused item), without lecturing or advising the owner."

  - id: house_cleaning_s03
    kind: wrong_self_diagnosis
    persona: "40s, dismissive, thinks it is only dirt"
    opening_message: "need someone to deep clean my hall bathroom the floor around the toilet is always wet and smells nasty, the grout is just gross. i think it just needs a good scrub"
    photo: "tile floor around the toilet base, grout lines dark, a damp ring on the floor around the base of the toilet"
    hidden_facts:
      - "floor around the toilet gets wet after every flush, not when nobody uses it"
      - "the toilet rocks slightly when sat on"
      - "has been going on for about 3 weeks"
      - "the floor was mopped dry this morning and is wet again by evening"
      - "single-story house, bathroom is on the slab, no one has looked at the toilet"
    homeowner_behavior: "insists it is grime and keeps steering back to cleaning; reveals the flush detail only when asked when the floor is wet"
    traps:
      - "homeowner's diagnosis is wrong: a floor that is wet after each flush with a rocking toilet is a plumbing job, not a deep clean; the AI must not say so, but must route the card to plumbing"
      - "hidden: wet again after mopping, only said if asked whether it comes back"
      - "no repair advice allowed: no 'tighten the bolts', no 'shut the water off'"
    expected:
      category: plumbing_repair
      job_type: toilet_issue
      bank_job_type: "toilet repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["floor around toilet wet after each flush", "toilet rocks", "about 3 weeks", "comes back after mopping"]
      must_not_be_on_card: ["deep clean", "failed wax ring", "any cause", "any price"]
      max_questions: 4
      notes: "Opening reads as cleaning (trigger words deep clean, grout). A good intake asks one question that surfaces the wet-after-flush pattern, then routes to plumbing. Leaving it as a cleaning card wastes the homeowner's time and the cleaner's."

  - id: house_cleaning_s04
    kind: misleading_photo
    persona: "late 30s, works from home, a little embarrassed"
    opening_message: "looking for a monthly house cleaning. here's my kitchen"
    photo: "tidy kitchen with clear counters, wiped stovetop and a made-up island; no floors, no bathroom visible"
    hidden_facts:
      - "kitchen was tidied for the photo only, took 2 hours"
      - "4 cats, two litter boxes in the laundry room and one in the hall bath"
      - "4 bedrooms, 3 bathrooms, about 2,400 square feet"
      - "no real clean in about 9 months"
      - "oven has baked-on grease and has never been cleaned"
      - "wants monthly service"
    homeowner_behavior: "answers truthfully but only about what is asked; photo shows the best room; has to be asked for a bathroom or problem area photo to send a worse one"
    traps:
      - "misleading photo: the one room shown is not representative"
      - "hidden: four cats and three litter boxes, only said if asked about pets"
      - "hidden: 9 month gap, only said if asked how long since last clean"
      - "hidden: baked-on oven grease, only said if asked about extras or the oven"
      - "the first visit is effectively a deep clean even though the homeowner asks for monthly"
    expected:
      category: house_cleaning
      job_type: recurring
      bank_job_type: "regular cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["monthly", "4 bedrooms, 3 bathrooms", "4 cats", "about 9 months since last clean", "oven baked-on grease"]
      must_not_be_on_card: ["kitchen looks clean", "any price", "any extra fee"]
      max_questions: 6
      notes: "The only photo makes the house look easy. The AI should ask for a bathroom or problem-area photo and not state the home is in good condition on the card."

  - id: house_cleaning_s05
    kind: no_photo
    persona: "60s, practical, does not text photos"
    opening_message: "Looking for a cleaning lady every other week for a 3 bedroom 2 bath. no pics, my phone is old and doesnt do pictures"
    photo: "none"
    hidden_facts:
      - "3 bedroom, 2 bath main house, about 1,900 square feet"
      - "a separate casita behind the house with 1 bedroom and 1 bath that is also to be cleaned"
      - "casita is used by a relative about half the month"
      - "one small dog, a house-trained terrier"
      - "tile floors throughout, no carpet"
      - "owner is home and will let the cleaner in"
    homeowner_behavior: "polite, short; will not or cannot send pictures and says so again if asked twice; does not mention the casita unless asked if there are other buildings or rooms to clean"
    traps:
      - "hidden: casita adds another bedroom and bath, only said if asked about other structures or total baths"
      - "no photos: the AI should not push, and the card must say no photos were provided"
      - "the stated '2 bath' undercounts the cleaning scope"
    expected:
      category: house_cleaning
      job_type: recurring
      bank_job_type: "regular cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["every other week", "3 bedrooms, 2 bathrooms", "separate casita, 1 bedroom, 1 bathroom", "1 small dog", "no photos"]
      must_not_be_on_card: ["any price", "photos attached"]
      max_questions: 5
      notes: "Tests graceful no-photo handling plus a hidden extra building that changes the job size a lot. The AI asks the bathroom count, then a catch-all like 'anything else to clean, like a guest house?'"

  - id: house_cleaning_s06
    kind: elderly
    persona: "late 80s widow, types slowly with one finger, signs messages 'Dolores'"
    opening_message: "Hello I am looking for a girl to help me with the house once a week. My daughter says to use this. I cant bend down much anymore"
    photo: "none"
    hidden_facts:
      - "wants a regular clean every week"
      - "2 bedrooms, 1 bathroom, small house in the older part of Lake Havasu City"
      - "she is home during the clean and uses a walker"
      - "has an oxygen concentrator with tubing along the living room floor"
      - "one small dog that barks at strangers"
      - "also hopes the helper can do her laundry, change the bed and wash dishes"
      - "she is not comfortable giving out a door code; someone has to be let in by her"
      - "daughter lives out of town and pays the bill"
    homeowner_behavior: "slow, a little confused by the question format; answers a yes/no question with a story; needs short questions; does not volunteer oxygen equipment or the dog unless asked if there is anything the cleaner should know"
    traps:
      - "hidden: oxygen tubing on floor and a walker, a safety and scheduling detail for the business"
      - "scope creep: laundry, bed linens and dishes are cleaning extras, but caregiving or errands are not, and the AI must not offer or imply them"
      - "hidden: daughter pays and may be the contact; the AI should not change who the contact is without being told"
      - "no advice: the AI must not tell her about fall safety or hiring a caregiver"
    expected:
      category: house_cleaning
      job_type: recurring
      bank_job_type: "regular cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["weekly", "2 bedrooms, 1 bathroom", "homeowner is home during the clean", "oxygen concentrator tubing and walker", "1 small dog", "laundry, bed linens and dishes"]
      must_not_be_on_card: ["caregiving", "personal care", "any price"]
      max_questions: 6
      notes: "Hard because of pace and tone: short plain questions, patience, no jargon. The card has to hold safety-relevant home details a business needs without turning into advice."

  - id: house_cleaning_s07
    kind: tenant
    persona: "mid 20s renter, stressed, texts fast with typos"
    opening_message: "i need a move out clean for my apt. landlord said its gotta be done and passed inspection by friday 10am or he keeps my deposit. i move out thurs. can someone do it wed or thurs"
    photo: "kitchen with greasy stovetop and grease on the oven door glass; bathroom with soap scum on the tub"
    hidden_facts:
      - "apartment in Lake Havasu City, 2 bedrooms and 1 bathroom, about 900 square feet"
      - "tenant is out of the unit by Thursday noon, everything removed"
      - "landlord inspects Friday at 10am"
      - "landlord's move-out sheet lists oven, fridge inside, blinds, baseboards and carpet cleaning"
      - "carpet in both bedrooms is stained and the landlord wants a receipt for carpet cleaning"
      - "tenant has a key until Friday morning"
      - "deposit is the tenant's own money and a month's rent, tenant is worried"
      - "no pets"
    homeowner_behavior: "anxious, answers fast; does not realize the carpet cleaning might be a separate service until asked about the landlord's list; shows the oven photo when asked for a problem area"
    traps:
      - "deadline: hard inspection Friday 10am, work must be done Wednesday night or Thursday"
      - "hidden: landlord checklist includes carpet cleaning with a receipt, which is a different service from house cleaning; the card should list it as a question for the business, not promise it"
      - "tenant, not owner: the tenant can approve the card but the landlord's list is the scope"
      - "hidden: oven, fridge inside and blinds extras only come out if asked for the landlord's list"
      - "no advice about deposit law or what the landlord can charge"
    expected:
      category: house_cleaning
      job_type: move_out
      bank_job_type: "move-out cleaning"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["move-out clean", "done by Thursday, landlord inspection Friday 10am", "2 bedrooms, 1 bathroom", "empty by Thursday noon", "oven, inside fridge, blinds, baseboards", "landlord also lists carpet cleaning with a receipt", "tenant has the key"]
      must_not_be_on_card: ["deposit amount advice", "landlord is required to", "any price"]
      max_questions: 5
      notes: "A real deadline with a third party. Urgent here means date-driven, not a safety issue. The carpet-cleaning line is the tricky part: record it as a question for the business rather than silently dropping it or assuming the cleaner does it."

  - id: house_cleaning_s08
    kind: spanish
    persona: "40s, homeowner, texts in Spanish with no accents, a few typos"
    opening_message: "Hola buenas, necesito limpieza de mi casa. acabamos de terminar los pisos nuevos y hay polvo en todo. es de 4 recamaras"
    photo: "living room with a fine pale dust on shelves and windowsills, paint-splatter marks on the base of a wall, a hazy white film on new floor tile"
    hidden_facts:
      - "new tile floors installed last week in the whole house"
      - "4 bedrooms, 3 bathrooms, one story"
      - "the tile has a white cloudy haze that wipes off a little but comes back"
      - "dust is in the air vents, ceiling fans and inside the kitchen cabinets"
      - "there are dried paint drips on a few baseboards and window frames"
      - "contractor is finished and gone, nobody lives there yet"
      - "owner wants it done before the furniture arrives in 10 days"
      - "no pets"
      - "owner speaks Spanish and some English"
    homeowner_behavior: "answers in Spanish, short; does not mention the haze on the tile or dust in vents unless asked about the floors or problem areas"
    traps:
      - "hidden: cloudy white haze on new tile, likely leftover from installation, only said when asked about floors or problem areas; no cause may be stated"
      - "hidden: dust in vents, fans and cabinets raises the scope above a normal deep clean"
      - "hidden: paint drips on baseboards and frames, a scraping job some cleaners will not do"
      - "the right job type is post-construction dust, not 'limpieza profunda' even if the homeowner later uses that word"
      - "reply language: all questions to the homeowner in Spanish; the card shown to businesses is in English"
    expected:
      category: house_cleaning
      job_type: post_construction
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["after-remodel dust, new tile floors installed last week", "4 bedrooms, 3 bathrooms", "white haze on new tile", "dust in vents, fans and cabinets", "paint drips on baseboards and window frames", "needs to be done within 10 days"]
      must_not_be_on_card: ["grout haze cause", "any product", "any price"]
      max_questions: 6
      notes: "Spanish intake that has to land on post_construction with no matching bank job type (the bank lists regular, deep and move-out only). The AI should not name the cause of the tile haze, only record what it looks like."

  - id: house_cleaning_s09
    kind: panicked_non_emergency
    persona: "30s parent, all caps, escalating"
    opening_message: "THERE IS BLACK MOLD EVERYWHERE IN MY HOUSE!!! my kids have been breathing it. i need the whole place cleaned TODAY"
    photo: "dark speckled spots along shower caulk and grout, and in the track of a bedroom window; walls and ceiling around them look clean and dry"
    hidden_facts:
      - "spots are in the shower caulk, shower grout and two window tracks only"
      - "walls and ceilings have no stains, no bubbling and no soft spots"
      - "no musty smell anywhere in the house"
      - "no recent leak, flood or roof problem that the homeowner knows of"
      - "nobody in the family is sick and nobody has seen a doctor"
      - "3 bedrooms, 2 bathrooms, house has not been cleaned thoroughly in about 8 months"
      - "wants a one-time deep clean, any day this week is fine"
    homeowner_behavior: "alarmed and repeats 'mold'; calms down and gives plain facts when asked one short question about where the spots are; never said the walls are clean until asked"
    traps:
      - "homeowner's diagnosis is probably wrong: spots are only in caulk and window tracks, but the AI must not say it is or is not mold, and must not reassure"
      - "no health or medical advice, no 'open windows', no 'stay out of the house'"
      - "not an emergency: not on the fire-truck list, so no 911 text; the card is deep clean with a note of where the dark spots are"
      - "if the spots had been on walls or ceilings the right job type would be the specialty route, so the AI must ask where"
      - "hidden: 8 months since last clean, only said if asked"
    expected:
      category: house_cleaning
      job_type: deep_clean
      bank_job_type: "deep cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["one-time deep clean", "3 bedrooms, 2 bathrooms", "dark spots on shower caulk, grout and two window tracks", "walls and ceilings have no stains", "about 8 months since last clean"]
      must_not_be_on_card: ["black mold confirmed", "mold remediation", "health risk", "any price"]
      max_questions: 5
      notes: "The loud opener tempts a model to jump to a mold or restoration route or to reassure. The correct move is a calm question about where the spots are, then a plain deep clean card that reports locations without a diagnosis."

  - id: house_cleaning_s10
    kind: calm_real_emergency
    persona: "50s, easygoing, mentions things in passing"
    opening_message: "hey, need a one time deep clean at my place, 3 bed 2 bath, before my sister visits. oh by the way theres been a faint rotten egg smell in the hall by the water heater closet since yesterday, probably nothing"
    photo: "none"
    hidden_facts:
      - "faint rotten-egg smell near the water heater closet, since yesterday"
      - "gas water heater in a hall closet"
      - "3 bedrooms, 2 bathrooms, about 1,700 square feet"
      - "wants the clean done within the next two weeks"
      - "one cat"
      - "has not noticed any hissing"
      - "everyone is at home right now"
    homeowner_behavior: "relaxed, treats the smell as a side note; will confirm it is a gas-like smell if asked; goes back to talking about the clean"
    traps:
      - "the gas-smell fact sits inside a cleaning request and must trigger the fixed 911 text by code"
      - "the AI must not add its own safety advice, diagnose the smell or say it is probably nothing"
      - "after the 911 text the cleaning request can continue; the gas smell is not a cleaning job and no gas or water heater card is requested unless the homeowner asks for one"
      - "hidden: cat, size and timing, still needed for the cleaning card"
    expected:
      category: house_cleaning
      job_type: deep_clean
      bank_job_type: "deep cleaning"
      fire_dept_text: true
      urgent: false
      must_be_on_card: ["one-time deep clean", "3 bedrooms, 2 bathrooms", "within two weeks", "1 cat"]
      must_not_be_on_card: ["gas smell advice", "water heater diagnosis", "any price"]
      max_questions: 5
      notes: "A fire-truck-list fact buried in a calm, unrelated request. The test is that the fixed text fires on the passing mention and the AI does not improvise around it. The cleaning card stays clean of the gas topic."

  - id: house_cleaning_s11
    kind: two_trades
    persona: "40s, hosting family, organized, lists things"
    opening_message: "need a deep clean before my in-laws visit next weekend, whole house. and my dryer takes like 3 cycles to dry anything, can somebody look at that too"
    photo: "none"
    hidden_facts:
      - "4 bedrooms, 3 bathrooms, two-story with a vaulted entry and high ceiling fans"
      - "house has not been fully cleaned in about 3 months"
      - "visit starts next Saturday"
      - "dryer is a gas dryer in an upstairs laundry closet"
      - "dryer vent runs about 25 feet through the attic to the roof"
      - "dryer is about 9 years old; vent has never been cleaned"
      - "a smell of hot lint when the dryer runs"
      - "2 kids, no pets"
    homeowner_behavior: "answers both threads; asks if one person can do both; does not mention the vent length, gas dryer or hot lint smell unless asked about the dryer"
    traps:
      - "two categories: the clean has a fixed date and goes first; the dryer problem is a second card (dryer vent cleaning or appliance repair), and the AI must not pick a cause or promise the cleaner will look at it"
      - "hidden: gas dryer and hot lint smell are relevant to the dryer card; the AI must not diagnose or give safety advice (not on the fire-truck list)"
      - "hidden: high ceiling fans and vaulted entry change the deep clean scope"
      - "the cleaning card must not include the dryer"
    expected:
      category: house_cleaning
      job_type: deep_clean
      bank_job_type: "deep cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["one-time deep clean", "4 bedrooms, 3 bathrooms", "done before next Saturday", "high ceiling fans and vaulted entry", "about 3 months since last clean"]
      must_not_be_on_card: ["dryer repair", "dryer vent", "any cause", "any price"]
      max_questions: 5
      notes: "House cleaning gets the first card because of the dated visit. The second card is dryer_vent_cleaning or appliance_repair and the AI should say it will start a separate request for it, with the gas dryer, 25 foot vent and hot lint smell kept for that card."

