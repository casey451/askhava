  - id: house_cleaning_s14
    kind: wrong_terminology
    persona: "50s, calling about a family member's house, evasive and embarrassed"
    opening_message: "need a deep clean for my brothers house. hes been in the hospital for a while and it got kind of backed up. 3 bed 2 bath, one time"
    photo: "none"
    hidden_facts:
      - "brother has lived alone in the house for years"
      - "most rooms are stacked from floor almost to ceiling with boxes, bags and papers"
      - "only narrow paths to the bathroom and the bed"
      - "the kitchen sink and counters are covered with dishes and old food containers"
      - "there are rodent droppings in several rooms"
      - "a strong smell of garbage when the door is opened"
      - "dozens of full trash bags are in the garage"
      - "the sister has a key and the brother will not be present"
      - "wants it done within a month, not an emergency"
    homeowner_behavior: "avoids details; says 'it's just messy' until asked how much of the floor is visible and whether items need to be removed; will describe it when the question is concrete and non-judgmental"
    traps:
      - "wrong terminology: 'deep clean' for a hoarding-level home is a specialty cleanup, not a routine cleaning"
      - "hidden: floor-to-ceiling stacks, rodent droppings and bags of trash, only said if asked about the amount of belongings and floor visibility"
      - "the card must say a site visit is needed and that items have to be removed or sorted first, with no judgment about the brother"
      - "no advice: no PPE, no 'do not go in without a mask', no mental health suggestions"
      - "also a pest angle (droppings), not for a second card unless the homeowner asks"
    expected:
      category: house_cleaning
      job_type: specialty_route
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["heavy-condition cleanup, belongings stacked floor to nearly ceiling", "only narrow paths", "rodent droppings in several rooms", "dozens of trash bags in the garage", "3 bedrooms, 2 bathrooms", "site visit needed", "within a month"]
      must_not_be_on_card: ["standard deep clean", "mental health", "any price", "any PPE advice"]
      max_questions: 6
      notes: "The hidden trap. The homeowner's words fit deep_clean, so a lazy intake sends a normal deep clean card and a cleaner finds a hoarding home with a flat quote. The AI has to ask a concrete question on floor visibility and amounts. Estate cleanout or restoration businesses could also fit; the key check is that the card is not a plain deep clean."

  - id: house_cleaning_s15
    kind: wrong_self_diagnosis
    persona: "late 50s, handy, certain he knows what it is"
    opening_message: "need the garage and attic cleaned out and sanitized, got a bunch of mouse crap up there, figure a cleaning crew can just vacuum it up. 3 bedroom house"
    photo: "attic insulation with scattered dark pellets, shredded paper nesting material in one corner"
    hidden_facts:
      - "droppings in the attic over most of the area and in two corners of the garage"
