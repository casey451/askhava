  - id: dog_waste_pickup_s14
    kind: wrong_self_diagnosis
    persona: "60s, matter of fact, convinced about the cause"
    opening_message: "theres rats in my yard. its from all the dog poop, 3 dogs and I dont keep up with it. need somebody out here asap"
    photo: "close photo of a pile of small dark droppings and a chewed hole in a plastic irrigation line next to a cholla cactus"
    hidden_facts:
      - "he has seen a rat or two running along the block wall at dusk"
      - "a stick-and-spine nest at the base of the cholla cactus"
      - "chewed irrigation line near the nest"
      - "dog food is kept in an open bin in the garage with the door cracked open"
      - "his truck's wiring was chewed two weeks ago"
      - "three dogs, yard not picked up for about two months"
      - "wants the rats dealt with first; pickup is secondary"
    homeowner_behavior: "keeps blaming the dog waste; answers questions about the rats directly and about the dogs only when asked"
    traps:
      - "wrong self-diagnosis: he says the poop caused the rats; the AI must not agree, disagree or explain cause"
      - "request belongs to pest_control (rodents), a licensed pest-management job, not to dog waste pickup"
      - "hidden: chewed truck wiring and a nest at the cholla, which a pest business needs to know"
      - "hidden: open dog food bin in the garage, only said if asked where food is kept; no advice given"
    expected:
      category: pest_control
      job_type: rodents
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["rats seen in the yard at dusk", "nest at base of cholla cactus", "chewed irrigation line", "truck wiring chewed 2 weeks ago", "open dog food bin in garage", "3 dogs in the yard"]
      must_not_be_on_card: ["dog waste causes rats", "any price", "any poison advice", "pickup as the main job"]
      max_questions: 5
      notes: "Routes away from dog waste. Rats are pest_control rodents and licensed pest-management work. The AI should not say the poop is or is not the cause; a follow-up dog waste card can be offered separately. The categories row does not list a rodent job type, so bank_job_type is null. 'Asap' is a wish, not a fire-truck-list fact, so urgent stays false."

  - id: dog_waste_pickup_s15
    kind: wrong_terminology
    persona: "60s, volunteer HOA board member, writes like an email"
    opening_message: "Our community association needs a pet waste valet for the common area. We have a dog park and some bag stations. Twice a week would be good."
    photo: "photo of a pet station with a bag holder and a small trash can at the edge of a gravel strip next to a block wall"
    hidden_facts:
      - "an HOA of about 80 homes in Lake Havasu City"
      - "there are 6 pet stations along the walking path and one fenced dog area of about a quarter acre"
      - "twice a week pickup and emptying and restocking the bag holders"
      - "the association supplies the bags"
      - "the board needs to approve any provider, and a vendor would walk the grounds with a board member first"
      - "the dog area is closed to residents during the work, but the walking path is open"
      - "the HOA currently pays a landscape crew who stopped doing this"
    homeowner_behavior: "formal; answers questions precisely; does not know the number of stations until asked, then counts them"
    traps:
      - "wrong term: 'valet' for a pickup and station service; the card must say common area pet stations and pickup, not 'valet'"
