    persona: "late 30s, organized, texts in neat short paragraphs"
    opening_message: "We had a roof leak over our dining room that left a big stain and the drywall is sagging a bit. Need the roof fixed first, and then someone to patch the ceiling and repaint it. Can you handle both?"
    photo: "dining room ceiling with a stain about three feet wide and a slightly bowed section of drywall"
    hidden_facts:
      - "tile roof, one story, about 2,400 sq ft"
      - "leak showed up after the September storms, dry now"
      - "the ceiling is textured (popcorn style) and about 18 feet across the room"
      - "ceiling has a bowed section about two feet wide"
      - "roof has solar panels on the section above the dining room"
      - "she wants the roof fixed before any ceiling work"
    homeowner_behavior: "answers directly; says the ceiling and paint come second; confirms the sagging when asked about the ceiling"
    traps:
      - "two trades: roof leak fix first, then drywall and paint; first card is roof_repair"
      - "hidden: solar panels above the leak, only said if asked what is on the roof there; changes the roof quote a lot"
      - "hidden: bowed drywall, a roofer would want to know whether the ceiling is holding water; only said if asked about the ceiling"
    expected:
      category: roof_repair
      job_type: leak_repair
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["stain over dining room after September storms, dry now", "tile roof, one story, about 2,400 sq ft", "solar panels on the section above", "ceiling bowed about two feet", "ceiling work comes after the roof"]
      must_not_be_on_card: ["panels must come off", "ceiling must be replaced", "any price"]
      max_questions: 5
      notes: "Roof card goes first. The ceiling patch and paint (drywall or painting) is a second request the assistant should note without bundling into this card. Solar above the leak area is the big hidden driver."

