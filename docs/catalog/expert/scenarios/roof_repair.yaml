category: roof_repair
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: roof_repair_s01
    kind: vague
    persona: "retired man, 70s, texts in short fragments, says 'the top of the house'"
    opening_message: "somethings wrong with the top of the house. can someone look"
    photo: "none"
    hidden_facts:
      - "concrete tile roof, one story, about 2,000 sq ft"
      - "three tiles slid down over the back patio after the last wind"
      - "no water has come inside that he has seen"
      - "solar panels are on the south side of the roof"
      - "house is about 22 years old and the roof has never been redone"
    homeowner_behavior: "answers one thing per reply; never volunteers; gives a fact only when a question clearly calls for it; gets impatient after 5 questions"
    traps:
      - "hidden: rooftop solar on the south side, only said if asked what is on the roof; panels may have to come off for the work"
      - "hidden: roof is original at 22 years, only said if asked about age; changes whether a patch or underlayment work is quoted"
    expected:
      category: roof_repair
      job_type: tile_repair
      bank_job_type: "tile replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["concrete tile", "one story", "three slipped tiles over back patio", "solar panels on south side", "roof about 22 years old", "no water inside"]
      must_not_be_on_card: ["underlayment is bad", "needs new roof", "any price", "any cause"]
      max_questions: 6
      notes: "Opening has no roof type, no symptom and no location. Solar panels and roof age are things only a pointed question surfaces. The assistant must not guess the roof needs replacing."

  - id: roof_repair_s02
    kind: wrong_terminology
    persona: "40s, just bought the house, texts fast with typos, not sure of roof words"
    opening_message: "hey my shingles are cracked and some of them slid off the roof, the clay looking ones. need someone to put them back and seal the roof"
    photo: "ground shot of a tan concrete tile roof with two tiles sitting crooked near the ridge"
    hidden_facts:
      - "the roof is concrete tile, not shingle and not clay"
      - "two tiles cracked and about four are slipped out of line near the ridge"
      - "two stories, steep pitch on the front"
      - "he saw black paper showing where the tiles slipped"
      - "house was built in the 1990s and he does not know if the roof was ever redone"
      - "sealing means he wants the roof waterproofed so it does not leak; nothing leaks inside now"
    homeowner_behavior: "answers right away and with detail when asked a direct question; keeps saying 'shingles' unless the assistant uses another word"
    traps:
      - "wrong term: 'shingles' and 'clay' for concrete tile, card must say tile roof, not shingle"
      - "wrong term: 'seal the roof' is not a coating job, card should note he wants the roof sealed against leaks and not choose a job type for him"
      - "hidden: two stories and steep front pitch, only said if asked about stories or steepness"
    expected:
      category: roof_repair
      job_type: tile_repair
      bank_job_type: "tile replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["tile roof", "two stories", "steep front", "two cracked and about four slipped tiles near the ridge", "black paper showing", "built in the 1990s, roof age unknown", "wants it sealed against leaks"]
      must_not_be_on_card: ["shingle", "clay", "recoat", "underlayment failed", "any price"]
      max_questions: 6
      notes: "Roof type words are wrong in two ways. Seal the roof tempts a foam_coating job type. The photo and one direct question settle the material."

  - id: roof_repair_s03
    kind: wrong_self_diagnosis
    persona: "50s, certain of himself, texts full sentences with some typos"
    opening_message: "I have a roof leak in the upstairs hall ceiling. brown ring about the size of a dinner plate. need a roofer out here asap before the next rain"
    photo: "hall ceiling with a brown ring stain, no drip"
    hidden_facts:
      - "it has not rained in about five weeks"
      - "the stain is directly under the upstairs bathroom"
      - "the stain got bigger last week after the family showered several mornings in a row"
      - "ceiling is soft and slightly sagging at the center of the ring"
      - "the house has a flat concrete tile roof with no leak history"
      - "the bathroom floor near the tub is a little damp when he checks it"
    homeowner_behavior: "defends the roof idea; answers direct questions about when it grows and what is above it; does not connect the shower to it until asked"
    traps:
      - "wrong self-diagnosis: roof leak, but it grows after showers and sits under the upstairs bathroom with no rain for weeks, so the request belongs to plumbing_repair"
      - "hidden: damp bathroom floor and a soft ceiling, only said when asked what is above the stain or when it grows"
    expected:
      category: plumbing_repair
      job_type: leak_slow
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["stain in upstairs hall ceiling under bathroom", "grows after showers", "no rain in about five weeks", "ceiling soft and slightly sagging", "damp bathroom floor near tub"]
      must_not_be_on_card: ["roof leak", "plumbing leak", "supply line", "any price", "any cause"]
      max_questions: 5
      notes: "He says roof and asks for a roofer. One question about when the stain changes reroutes the card to plumbing_repair without the assistant naming a cause. Sagging ceiling is a safety fact that must be kept on the card."

  - id: roof_repair_s04
    kind: wrong_self_diagnosis
    persona: "late 50s, retired contractor's widow, firm, texts in complete sentences"
    opening_message: "My roof is shot and needs to be replaced. Every time it rains the water comes in the living room by the skylight. I want quotes for a whole new roof."
    photo: "ceiling around a skylight well with a faint brown ring on the drywall"
    hidden_facts:
      - "the leak only shows around the skylight, nowhere else in the house"
      - "tile roof about 12 years old with no other stains"
      - "the skylight was installed about 15 years ago, the roof was redone around it"
      - "water appears after hard rain, not light rain"
      - "one story, roughly 2,200 sq ft"
      - "she has not been on the roof or had anyone look at the skylight"
    homeowner_behavior: "pushes for a full re-roof; answers where the stain is and how old the roof is when asked; does not volunteer that only the skylight is affected"
    traps:
      - "wrong self-diagnosis: whole roof replacement, but all the facts point at one skylight, a flashing job type"
      - "hidden: roof is 12 years old with no other stains, only said when asked about age or other rooms"
    expected:
      category: roof_repair
      job_type: flashing_skylight
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["leak only around the skylight", "after hard rain", "tile roof about 12 years old", "one story about 2,200 sq ft", "no other stains"]
      must_not_be_on_card: ["whole roof", "flashing failed", "re-roof needed", "any price"]
      max_questions: 5
      notes: "She asks for a re-roof. The card should record what is true (one skylight, one location) and let businesses decide scope. Both wanting a new roof and the single-location facts may go on the card, as her words versus the facts."

  - id: roof_repair_s05
    kind: misleading_photo
    persona: "30s, works from home, texts in lowercase, helpful but guessing"
    opening_message: "got a leak in the back bedroom when it rains. sent a pic of the roof, tiles look messed up on the front"
    photo: "front of a tile roof with three slipped tiles near the eave; no photo of the back of the house or the back bedroom ceiling"
    hidden_facts:
      - "the leak is in the back bedroom, which is a room addition built later"
      - "the addition has a flat roof with white foam and a coating, not tile"
      - "water sits in a low spot on the flat part for a day or two after rain"
      - "the coating has blisters and one spot where yellow foam shows"
      - "the three slipped tiles in the photo are on the front of the house over the garage"
      - "no water has ever come in under the front tiles"
      - "addition is about 12 years old"
    homeowner_behavior: "assumes the front tiles are the problem; answers direct questions about which room and what the back roof looks like; says 'oh the back is flat, I forgot' when asked"
    traps:
      - "misleading photo: slipped front tiles are real but not where the water enters; the leak is under the flat foam roof of the back addition"
      - "hidden: blistered coating, bare yellow foam and ponding on the flat section, only said if asked about the roof over the bedroom"
    expected:
      category: roof_repair
      job_type: leak_repair
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["leak in back bedroom when it rains", "back bedroom is an addition with flat foam roof", "ponding after rain", "blisters and yellow foam showing", "three slipped tiles over the garage in front, no leak there", "addition about 12 years old"]
      must_not_be_on_card: ["tiles are the cause", "foam failed", "needs recoat", "any price"]
      max_questions: 6
      notes: "The photo shows a different roof section than the leak. Without a question about the roof above the bedroom the card sends the roofer to the wrong roof. Photo ask for the back flat section is expected."

  - id: roof_repair_s06
    kind: no_photo
    persona: "30s, lives in a single-wide in a mobile home park outside the city, texts short, no ladder"
    opening_message: "my trailer roof leaks over the kitchen. i want a peaked roof put over the whole thing like my neighbor got. how much"
    photo: "none"
    hidden_facts:
      - "single-wide manufactured home on a rented space in a park, he owns the home"
      - "the home was built in 1974"
      - "flat-ish metal roof with old silver coating that is peeling"
      - "leak is a drip over the kitchen sink when it rains"
      - "there is a rooftop swamp cooler near the kitchen end"
      - "park manager said any structure change needs the park's OK"
      - "he cannot get on the roof and has no photos from the ground"
    homeowner_behavior: "answers briefly; says 'no pics, I don't have a ladder' when asked; will take a ground photo only if the assistant asks for it simply"
    traps:
      - "licensed-only: a roof-over that adds a peaked roof structure alters the home and needs an Arizona Dept of Housing licensed installer plus a permit, not a plain roofing license"
      - "hidden: home built in 1974 (before the 1976 federal standard), only said if asked about age of the home"
      - "hidden: swamp cooler on the roof near the leak, only said if asked what is on the roof"
    expected:
      category: roof_repair
      job_type: manufactured_home_roof
      bank_job_type: "re-roof"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["manufactured home", "built 1974", "owns the home, rented space in a park", "wants a peaked roof-over", "metal roof with peeling coating", "drip over kitchen sink when it rains", "rooftop swamp cooler near the kitchen end", "no photos available"]
      must_not_be_on_card: ["roof-over is allowed", "needs a permit", "any price", "any cause"]
      max_questions: 6
      notes: "Roof-over belongs to a licensed-only job type; the card must state what he asked for so only licensed businesses can quote, without the assistant explaining licensing. No photo; a ground photo ask must be easy for a man without a ladder."

