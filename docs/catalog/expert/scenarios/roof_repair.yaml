    photo: "none"
    hidden_facts:
      - "tile roof, one story, house about 30 years old"
      - "stain is about the size of a hand in the corner of the bedroom, dry now"
      - "the stain appeared after a heavy rain in September"
      - "the door-to-door man gave a written number and wants a deposit on Friday"
      - "she has hearing trouble and cannot take phone calls"
      - "her son lives out of state and will help with photos on the weekend"
    homeowner_behavior: "answers slowly one thing at a time; mentions the door-knocker again if asked about the roof; needs plain wording and no more than one question per message"
    traps:
      - "hidden: door-to-door man wants a deposit Friday, only said if asked whether anyone else has looked at it; the card should not carry his price or her deposit worry as advice"
      - "hidden: no phone calls, text only because of hearing, a card note matters for businesses"
    expected:
      category: roof_repair
      job_type: leak_repair
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["stain in bedroom corner, dry now", "appeared after heavy rain in September", "tile roof, one story, home about 30 years old", "text only, cannot take calls", "another company already gave her a written figure"]
      must_not_be_on_card: ["scam", "do not pay a deposit", "needs a whole new roof", "the other company's number", "any price"]
      max_questions: 5
