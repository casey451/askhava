    hidden_facts:
      - "she is a tenant; the owner lives in another state"
      - "the owner told her by text to get quotes and he will approve and pay"
      - "she can be home after 5 pm on weekdays and anytime on weekends"
      - "the closet is under a flat-looking section at the back of the house"
      - "leaks when it rains hard; water dripped on clothes on the shelf last night"
      - "house is one story with tile"
    homeowner_behavior: "answers quickly; says she does not know about the roof type or age and does not know who owns the insurance; agrees to ask the owner if the assistant needs approval details"
    traps:
      - "tenant: she is not the owner, the owner approves and pays, card must say so and give access times"
      - "hidden: closet is under a flat-looking section, only said if asked what is on the roof above that room"
    expected:
      category: roof_repair
      job_type: leak_repair
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["tenant, owner approves and pays", "bedroom closet ceiling leaks when it rains hard", "one story, tile roof", "flat-looking section above closet", "home after 5 pm weekdays and weekends", "roof age unknown"]
      must_not_be_on_card: ["landlord must fix", "tenant rights", "any price", "any cause"]
      max_questions: 5
      notes: "She cannot approve a job, so the card must make the owner role clear. The assistant should not give landlord or tenant advice. Possible foam section is a hidden-condition lead."

