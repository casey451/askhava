  - id: home_watch_s14
    kind: no_businesses
    persona: "man in his 40s in Phoenix, efficient, hates back and forth"
    opening_message: "need someone to meet the ac guy at my house in havasu tuesday, im in phoenix. would also like someone to hold a spare key so I dont have to keep doing this"
    photo: "none"
    hidden_facts:
      - "an HVAC company is already booked for Tuesday between 8 and noon"
      - "the owner lives in Phoenix and cannot be there"
      - "the home is in a gated HOA, and vendors need to be added to a pass list by the owner"
      - "house is about 1,800 sq ft, one story"
      - "currently a lockbox is used for access"
      - "the key holder would also let him in if he is locked out"
      - "he wants the person to stay while the HVAC tech works and send a message when done"
    homeowner_behavior: "terse; answers exactly the question; says the AC repair is already handled"
    traps:
      - "two asks in one: meeting a contractor (meet_and_greet) and holding a key (key_holding), both on one card"
      - "hidden: gated HOA needs the owner to add vendors to a pass list, only if asked about access"
      - "the AC repair itself is not part of this card"
      - "no businesses yet: card should state this trade has no businesses yet"
    expected:
      category: home_watch
