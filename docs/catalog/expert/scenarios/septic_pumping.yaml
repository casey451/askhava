scenarios:
  - id: septic_pumping_s01
    kind: vague
    persona: "man in his 50s, terse, texts in fragments, thinks one word is enough"
    opening_message: "need my rv tank dumped"
    photo: "none at first; if asked, one photo of a travel trailer parked on a gravel driveway beside a house, a gray sewer outlet cap visible low on the trailer side"
    hidden_facts:
      - "30 foot travel trailer parked in his own driveway in Lake Havasu City"
      - "he wants a truck to come pump the black water tank at the driveway, he does not want to haul it to a dump station"
      - "black tank is about 40 gallons and is nearly full, gray tank is also full"
      - "the house itself is on city sewer and has no septic tank (only says so if asked about a tank at the house)"
      - "he has a sewer cleanout cap in the side yard that he thinks the trailer could drain into (only says so if asked where it would drain)"
      - "driveway is gated but the gate is not locked"
      - "he wants it done this week, trailer leaves for Quartzsite in 8 days"
    homeowner_behavior: "one fragment per reply; assumes the business knows what an RV dump is; gets curt if asked about the house or a tank at the house"
    traps:
      - "hidden: this is a mobile RV tank pump-out, not a pumping of a septic tank at the home; the card has to say so or businesses will quote the wrong job"
      - "hidden: house is on city sewer, so lid, tank size and last-pumped questions do not apply"
      - "hidden: both tanks full, a timeline of 8 days"
    expected:
      category: septic_pumping
      job_type: routine_pump
      bank_job_type: "tank pumping"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["RV or travel trailer holding tank pump-out", "30 foot trailer, about 40 gallon black tank, gray tank also full", "at his driveway in Lake Havasu City", "wants it within the week, trailer leaves in 8 days", "gate not locked"]
      must_not_be_on_card: ["a septic tank at the house", "a tank lid or last-pumped answer invented to fill the card", "any price", "where to dump it", "a named business"]
      max_questions: 5
      notes: "Three words. The category has no RV job type, so the card has to carry the real job in plain words. Tank-lid, last-pumped and bedroom questions are wrong for this man and a script that asks them anyway fills the card with invented septic facts. Closest category is septic_pumping because the work is a licensed septage truck; coverage is a judgment call for the harness owner."

