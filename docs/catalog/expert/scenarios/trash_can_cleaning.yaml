      - "wants it washed one time only"
      - "carts can stay at the curb after pickup"
      - "dark residue still at the bottom of the gray cart after the truck emptied it"
    homeowner_behavior: "answers one thing per reply; does not mention the bird unless asked what is in the cart or how it got that way; gives counts and days when asked directly"
    traps:
      - "hidden: a dead animal was in the cart; a washer wants to know before arriving, but the AI must not call it a hazard or give advice"
      - "hidden: only one of two carts is bad; quote for one vs both changes"
    expected:
      category: trash_can_cleaning
      job_type: one_time_wash
      bank_job_type: "bin washing"
      fire_dept_text: false
      urgent: false
