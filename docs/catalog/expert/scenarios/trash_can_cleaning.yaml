    persona: "man in his 50s, texts one short line at a time, no punctuation"
    opening_message: "smells like something died in my trash can"
    photo: "none"
    hidden_facts:
      - "one gray trash cart and one blue recycling cart; only the gray one smells"
      - "a dead bird was in the gray cart when it was emptied last Friday"
