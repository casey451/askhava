      category: holiday_lights
      job_type: roofline_gutters
      bank_job_type: "plug-in light hanging"
      fire_dept_text: true
      urgent: true
      must_be_on_card: ["front roofline hang", "1 story, tile roof", "homeowner's own lights, about 250 ft", "garage outlet is the only outdoor outlet, scorched mark and burnt plastic smell per homeowner", "before the boat parade"]
