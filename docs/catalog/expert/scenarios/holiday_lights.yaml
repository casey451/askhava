    hidden_facts:
      - "one story house, tile roof"
      - "the outlet smells like burnt plastic only when the lights are plugged in"
      - "the brown mark has been there since last season"
      - "he has his own lights, about 250 feet"
      - "wants hang only, before the boat parade"
