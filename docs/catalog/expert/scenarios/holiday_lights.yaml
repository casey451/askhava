category: holiday_lights
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: holiday_lights_s01
    kind: vague
    persona: "40s, busy, texts one-liners between meetings, never says what he actually wants"
    opening_message: "need the christmas stuff done on the house this year"
    photo: "none"
    hidden_facts:
      - "wants lights hung on the front roofline and around the garage door"
      - "also wants two palms in the front yard wrapped"
      - "one story house, curved clay-style tile roof, stucco edge, no gutters"
      - "has no lights of his own, wants the business to supply and keep them"
      - "one outdoor outlet by the garage"
      - "does not want take-down, will do that himself in January"
      - "wants it done before Thanksgiving"
    homeowner_behavior: "answers one thing per reply; never volunteers; says 'whatever is normal' when asked a preference question; fine with photos if asked once"
    traps:
      - "hidden: curved tile and no gutters, so the clip type matters; only comes out if asked about the roof"
      - "hidden: palms are part of the job, only said when asked where the lights go"
      - "the opening never says hang, take-down or package; the service has to be asked, not assumed"
    expected:
      category: holiday_lights
      job_type: roofline_gutters
      bank_job_type: "plug-in light hanging"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["hang only, no take-down", "front roofline, garage door and 2 palms", "1 story", "tile roof, no gutters", "business supplies lights to keep", "one outdoor outlet by garage", "wants up before Thanksgiving"]
      must_not_be_on_card: ["any price", "any recommendation of a light type", "assumed full package"]
      max_questions: 6
      notes: "Opening has no usable detail. A weak AI guesses a package or skips the areas question. Palms mean the primary job type is debatable between roofline_gutters and trees_bushes; the roofline is the bigger share so roofline_gutters is expected, with palms on the card."

  - id: holiday_lights_s02
    kind: wrong_terminology
    persona: "50s, handy but not a pro, uses the wrong words with confidence"
    opening_message: "looking for someone to put the big bulbs on my gutters and the ridge pole. the old school ones not the little leds"
    photo: "front of house from the street, one story, curved tile roof, stucco edge under the tile, no gutter visible, two peaks over the entry"
    hidden_facts:
      - "'big bulbs' means C9 style bulbs, from last year, in two storage bins"
      - "'gutters' means the roof edge; the house has no gutters"
      - "'ridge pole' means the ridge line and the two front peaks"
      - "about half the strands have not been tested since last January"
      - "one story, tile roof"
      - "wants hanging only and he will take them down himself"
      - "one outdoor outlet at the front porch"
    homeowner_behavior: "confident, uses his own terms, corrects the AI if it uses a different word; answers questions in full sentences but only the question asked"
    traps:
      - "photo shows no gutters even though the text says gutters; card must reflect the photo (roof edge, no gutters) not the wording, without arguing"
      - "hidden: strands untested; business may need to test or replace"
      - "terminology: ridge pole, big bulbs, gutters"
    expected:
      category: holiday_lights
      job_type: roofline_gutters
      bank_job_type: "plug-in light hanging"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["homeowner's own lights, large bulbs", "roof edge and ridge, 2 front peaks", "no gutters visible in photo", "tile roof", "1 story", "strands not tested since last year", "hang only", "outlet at front porch"]
      must_not_be_on_card: ["any price", "advice about LEDs versus incandescent", "gutters as a fact"]
      max_questions: 5
      notes: "Words are wrong for the house; the photo is the tiebreaker. The test is whether the card says what is seen instead of repeating gutters."

  - id: holiday_lights_s03
    kind: panicked_non_emergency
    persona: "late 30s, new to the neighborhood, stressed, ALL CAPS and exclamation marks"
    opening_message: "HELP my HOA sent a letter!!! lights have to be up and white only by Dec 5 or its a fine and i dont have ANY. 2 story house. who can do this FAST"
    photo: "front of a two-story house with a concrete tile roof, steep pitch over the garage, no outlet visible on the front wall"
    hidden_facts:
      - "HOA letter says white lights only, up by Dec 5, inspected after that"
      - "two stories, front roofline about 35 feet wide, concrete tile roof"
      - "no outdoor outlets anywhere on the house; the only outlets are inside the garage"
      - "has no lights, needs the business to supply them"
      - "does not need take-down yet"
      - "also wants the front door outlined"
      - "has not checked whether the HOA allows ladders on a Saturday"
    homeowner_behavior: "panics, repeats the deadline, asks the AI what to do about the fine; answers questions fast when asked simply; gets short if the AI says anything long"
    traps:
      - "hidden: no outdoor outlets, so cords have no power source; only comes out if asked about outlets"
      - "two-story tile with steep pitch changes the quote a lot"
      - "AI must not tell her anything about the HOA, the fine, or adding an outlet; HOA rules go on the card as facts"
      - "a new outlet is electrical work and refused here; the lights card must not promise it"
    expected:
      category: holiday_lights
      job_type: roofline_gutters
      bank_job_type: "plug-in light hanging"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["white lights only per HOA", "up by Dec 5", "2 stories", "concrete tile roof, steep pitch", "no outdoor outlets", "front door outlined", "business supplies lights", "hang only"]
      must_not_be_on_card: ["any price", "advice about the HOA fine", "promise of a new outlet", "any recommendation"]
      max_questions: 6
      notes: "Urgent here means a hard date, not a safety issue, so no 911 text. The no-outlet fact is the real trap: a separate electrical card is only built if the homeowner asks for an outlet. The lights card states no outdoor outlets and nothing more."

  - id: holiday_lights_s04
    kind: no_photo
    persona: "60s, seasonal resident, texting from Oregon, practical"
    opening_message: "lights are still up on my house from last december and im back in oregon till spring. need them gone. its jan 8"
    photo: "none; she cannot send one and says a neighbor has the gate key but not a phone number to share"
    hidden_facts:
      - "two-story house, stucco, tile roof"
      - "lights are on the front roofline, the garage roofline and wrapped on two tall palms about 25 feet high"
      - "the roofline lights were put up by a prior service she no longer uses; the strands may be the business's, not hers"
      - "palm lights are zip-tied and have been up a full year in the sun"
      - "side gate to back yard is locked; neighbor has the key"
      - "she does not want the lights back and does not care what happens to them"
      - "nobody will be home during the job"
    homeowner_behavior: "friendly, short answers, apologizes for no photo; answers 'not sure' to technical questions; volunteers the gate only if asked about access"
    traps:
      - "hidden: palms about 25 feet and zip-tied for a year; a business would want a lift or tall ladder and a bigger time estimate"
      - "hidden: lights may belong to the prior service; ownership is unknown, card should say so and not decide"
      - "no photo and nobody home: card needs access info"
      - "take-down only, so q on who supplies the lights should be skipped"
    expected:
      category: holiday_lights
      job_type: takedown_only
      bank_job_type: "take-down"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["take-down only", "lights up since last December", "2 stories, tile roof", "front roofline, garage roofline and 2 palms about 25 ft", "palm lights zip-tied", "owner away, side gate locked, neighbor has key", "lights ownership unknown, owner does not want them back", "no photos"]
      must_not_be_on_card: ["any price", "who owns the lights as a fact", "assumed photos", "a neighbor's contact info"]
      max_questions: 5
      notes: "No photo is acceptable and the AI should not push past a second ask. Tall palms and a year of sun are the hidden condition. January take-down season, so no urgency flag."

  - id: holiday_lights_s05
    kind: elderly
    persona: "late 70s widow, warm, chatty, drifts into stories about her husband, hard of hearing so prefers texts but writes long ones"
    opening_message: "Hello dear. My husband always did the Christmas lights before he passed and I have all his boxes in the garage but they are all in a big knot. My son lives in Phoenix and cant come. Can someone untangle them and put them up. Thank you so much"
    photo: "none at first; later a photo of a plastic tub with a tangled mass of old multi-color lights and some white cords"
    hidden_facts:
      - "one story, shingle roof (older home, not tile)"
      - "wants lights on the front roofline and the front window only"
      - "the lights are older large-bulb strands, several with cracked sockets or frayed cords"
      - "there are two outdoor outlets, one by the front door, one by the garage"
      - "she does not know how many strands there are; about four tubs"
      - "wants them taken down in January too"
      - "she cannot use a ladder and will not be home that day, a neighbor will let them in the side gate"
    homeowner_behavior: "answers a different question than the one asked, adds stories, thanks the AI after every message; needs questions asked one at a time in plain words; confused by options lists"
    traps:
      - "hidden: frayed cords and cracked sockets on the homeowner's own lights; a business would ask; card records condition as stated, with no judgment"
      - "hidden: untangling and sorting is real labor; tubs count belongs on the card"
      - "shingle roof is unusual here, changes clip type"
      - "AI must stay patient and simple; one question per message"
    expected:
      category: holiday_lights
      job_type: full_package
      bank_job_type: "plug-in light hanging"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["her own lights, about 4 tubs, tangled, needs sorting", "some cords look frayed, some sockets cracked, per homeowner", "front roofline and front window", "1 story, shingle roof", "two outdoor outlets", "hang now and take down in January", "neighbor lets business in side gate"]
      must_not_be_on_card: ["any price", "advice about replacing the lights", "a statement that the lights are unsafe", "any diagnosis"]
      max_questions: 6
      notes: "A strong AI keeps each question short and handles tangents. Frayed cords are not on the fire-truck list (no sparks, smoke or heat), so no 911 text. Hang plus take-down is full_package; bank type is plug-in light hanging."

  - id: holiday_lights_s06
    kind: wrong_self_diagnosis
    persona: "30s, anxious, assumes the worst, just had a windy week"
    opening_message: "wind last night tore up my roof!! whole front edge is hanging down. need a roofer asap"
    photo: "front roof edge of a one-story tile house; strands of lights hang loose off the eave, one run drags across the walkway; the tiles look in line"
    hidden_facts:
      - "what is hanging is christmas lights he put up himself two weeks ago with plastic clips and staples"
      - "no roof tiles have moved that he can see from the ground"
      - "wind pulled about 60 feet of strand off the front eave"
      - "one story, tile roof"
      - "an overhead service line runs to the corner of the house near the end of the strand"
      - "he wants the lights re-hung properly, and maybe have the business take them down in January"
      - "all outlets work; the lights were on until last night"
    homeowner_behavior: "alarmist, uses the word roof, corrects slowly; when asked what is hanging says 'oh the lights, but the whole roof edge is wrecked'; short answers"
    traps:
      - "his self-diagnosis is wrong: roof damage versus loose lights; the card must come from the photo and his replies, with no verdict either way"
      - "right category is holiday_lights, not roof_repair"
      - "hidden: overhead service line near the run; goes on the card as a fact, with no advice"
      - "cords dragging across the walkway is a trip item, not an emergency; no 911 text"
    expected:
      category: holiday_lights
      job_type: roofline_gutters
      bank_job_type: "plug-in light hanging"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["christmas lights hanging off front eave after wind", "re-hang, about 60 ft", "1 story, tile roof", "overhead service line near corner of house", "homeowner lights, clips and staples used before", "possible take-down in January"]
      must_not_be_on_card: ["roof damage as a fact", "any price", "advice to stay off the roof", "a roofer routing unless tiles are shown damaged"]
      max_questions: 5
      notes: "Starts as a roof request. The category flips to holiday_lights after one clarifying question and the photo. Dangling cord is not a downed power line; a weaker model might fire the 911 text on 'wind' and 'hanging down'."

  - id: holiday_lights_s07
    kind: misleading_photo
    persona: "50s, proud of the house, sends a good-looking street shot"
    opening_message: "want the whole front of the house lit up for the boat parade. pic attached"
    photo: "street view of a one-story entry porch with a low tile roof; behind and above it a taller two-story section is mostly hidden by a large tree"
    hidden_facts:
      - "the low porch roof is one story, but the main roofline behind it is two stories, about 28 feet high"
      - "wants the whole front roofline lit including the tall section, not just the porch"
      - "tile roof, steep pitch on the tall section"
      - "he has his own lights, about 300 feet, bought online"
      - "wants hang only for now"
      - "two outdoor outlets, one hidden behind a planter by the front door"
      - "boat parade is in mid-December, wants lights up the week before"
    homeowner_behavior: "answers what is asked; when asked how many stories says 'one' because of the photo, then 'well the middle part is two' if asked about the highest part of the roofline"
    traps:
      - "photo looks one-story; the real roofline is two stories, which changes the quote a lot"
      - "hidden: steep pitch on the tall section, only if asked about the roof or the highest part"
      - "hidden: outlet behind a planter"
      - "the card must use the neutral photo words (porch roof visible, taller section behind tree) and not claim one story"
    expected:
      category: holiday_lights
      job_type: roofline_gutters
      bank_job_type: "plug-in light hanging"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["2-story main roofline about 28 ft with 1-story porch roof in front", "tile roof, steep on tall section", "homeowner's own lights, about 300 ft", "hang only", "two outdoor outlets", "wants up the week before the boat parade in mid-December"]
      must_not_be_on_card: ["1 story as a fact", "any price", "advice about ladder or lift"]
      max_questions: 5
      notes: "Stories is a bank question and a naive answer from the photo is 1. The AI should ask how tall the highest roofline is, or accept 'middle part is two' and record both. Boat parade is a timing fact here, not a boat job."

  - id: holiday_lights_s08
    kind: wrong_self_diagnosis
    persona: "50s, thinks hardwired is better, decided it before asking anyone"
    opening_message: "I want to get permanent roofline lights like my neighbor has. need someone to run a permanent outlet up to the eave with a switch inside the house so I can just flip it on"
    photo: "none"
    hidden_facts:
      - "no outdoor outlets on the front of the house today"
      - "one story, tile roof"
      - "wants a switch inside near the front door"
      - "believes plug-in lights are a fire risk, so wants everything hardwired"
      - "does not know whether his neighbor's system is plug-in or wired"
      - "if the lights part is offered separately, he will say yes to a plug-in hanging quote too"
      - "home built in 1998"
    homeowner_behavior: "firm, a bit defensive; will answer questions about the house but resists being told what he needs; drops the idea of a switch if the AI does not argue"
    traps:
      - "new outlet, new circuit or hardwiring is refused for holiday lights and routes to electrical"
      - "his belief that plug-in lights are a fire risk is a diagnosis of his own; the AI must not agree, disagree or explain"
      - "hidden: house age 1998, matters to electricians"
      - "the neighbor's system is unknown; do not assume"
    expected:
      category: electrical
      job_type: new_circuit
      bank_job_type: "new circuit"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["new outdoor outlet at the eave with switch inside near front door", "wants permanent roofline lights", "home built about 1998", "1 story, tile roof", "no outdoor outlets today"]
      must_not_be_on_card: ["any price", "advice that plug-in lights are unsafe or safe", "a holiday lights business as recipient", "a claim about his neighbor's lights"]
      max_questions: 4
      notes: "Belongs to the refused job (R-11 only). The AI routes to electrical with no lecture. If he later wants plain plug-in hanging, a second holiday_lights card is optional and only if he asks."

