      urgent: false
      must_be_on_card: ["windows, door and porch pillars", "renter, landlord approved per tenant", "no nails or holes into stucco, roof or fascia", "homeowner's own white LED lights", "1 story, tile roof", "take down by Jan 5", "hang now and take down"]
