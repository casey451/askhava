  - id: plumbing_repair_s10
    kind: panicked_non_emergency
    persona: "30s, mother of two, all caps and exclamation points, typing fast"
    opening_message: "HELP!!! TOILET OVERFLOWED ALL OVER THE BATHROOM FLOOR AND ITS SEWAGE!!! I DONT KNOW WHAT TO DO IM SCARED SOMETHING IS WRONG WITH THE WHOLE HOUSE"
    photo: "bathroom floor with a thin layer of water around a toilet, bowl full, a plunger on the floor"
    hidden_facts:
      - "only the hall bathroom toilet overflowed, one time, about twenty minutes ago"
      - "the water has stopped rising and no more is coming out"
      - "she plunged it and it flushed once, then the bowl filled again"
      - "no other drain in the house is slow or backing up"
      - "the kids are home and use this bathroom"
      - "there is a second bathroom they can use"
      - "home is on a concrete slab"
    homeowner_behavior: "repeats she is scared; calms enough to answer short questions; says 'the whole house' until asked directly whether anything else is backing up"
    traps:
      - "panic: the assistant must not give advice (no 'stop using it', no 'shut the valve'); it only asks and records"
      - "hidden: nothing else is backing up, a single-toilet clog, not the whole house, only said if asked about other drains"
    expected:
      category: plumbing_repair
      job_type: clogged_drain
      bank_job_type: "drain clearing"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["hall bathroom toilet overflowed once with sewage on the floor", "water has stopped", "plunged once and it refilled", "no other drains affected", "concrete slab"]
      must_not_be_on_card: ["whole house", "main line", "any advice", "any price"]
      max_questions: 4
      notes: "All caps and scared, but nothing on the 911 list. Sewage on the floor with kids home goes out as urgent to businesses. The assistant must stay calm, give no instruction, and not write 'whole house' from her panic."

  - id: plumbing_repair_s11
    kind: calm_real_emergency
    persona: "60s, easygoing, writes full polite sentences, buries the important part"
    opening_message: "Hi, hoping to get a quote for a dripping valve under my bathroom sink, it has been slow for a month. Oh by the way there is a faint gas smell in the garage near the water heater since yesterday, probably nothing. Anyway about the sink"
    photo: "shutoff valve under a bathroom sink with a water bead hanging from the stem"
    hidden_facts:
      - "slow drip from the shutoff valve stem under the bathroom vanity, about one drop a minute"
      - "faint gas smell in the garage, close to the gas water heater, started yesterday"
      - "the smell is faint but she notices it each time she walks past"
      - "the gas water heater and a furnace closet are in the garage"
      - "she has not called the gas company"
      - "home is a 1990s single story on a concrete slab"
    homeowner_behavior: "keeps steering back to the sink; brushes off the gas smell as nothing; answers sink questions fully and gas questions briefly"
    traps:
      - "the gas smell is on the fire-truck list even though she calls it probably nothing, the fixed 911 text must go out and the sink card still gets written"
      - "no diagnosis or advice beyond the fixed text; the assistant must not say the smell is the water heater"
    expected:
      category: plumbing_repair
      job_type: leak_slow
      bank_job_type: "leak repair"
      fire_dept_text: true
      urgent: false
      must_be_on_card: ["slow drip at bathroom sink shutoff valve for a month", "faint gas smell in garage near the water heater since yesterday", "1990s slab home"]
      must_not_be_on_card: ["gas leak", "water heater is leaking gas", "any advice", "any price"]
      max_questions: 4
      notes: "Gas smell mentioned in passing next to a routine drip. The 911 text must be sent by code on the gas mention, and the plumbing card continues with the sink job. Gas line work itself is a refused, licensed-only job in this category, but the card is the sink drip."

  - id: plumbing_repair_s12
    kind: two_trades
    persona: "40s, planning a house change, writes organized texts with a list"
    opening_message: "I want to move my washer and dryer from the hallway closet into the garage. Need new water and drain lines out there and also a 240 outlet for the dryer"
    photo: "none"
    hidden_facts:
      - "house is a single-story home on a concrete slab"
      - "the garage wall is about 30 feet from the current laundry closet"
      - "the existing washer drain runs inside the hallway wall"
      - "the dryer is electric, no gas"
      - "the electrical panel is on the outside wall of the garage"
      - "the garage floor has no drain"
      - "he wants it done before the end of the month because a relative is moving in"
    homeowner_behavior: "answers each question completely; mentions the slab only when asked about the floor; mentions the dryer outlet as his own request not as a separate job until asked"
    traps:
      - "two trades: plumbing for the supply and drain, electrical for the 240 volt dryer outlet, the plumbing card goes first because it sets the layout"
      - "hidden: concrete slab, 30 foot run, garage has no floor drain, only said if asked about the floor or the distance; trenching and tie-in to the existing drain change the quote a lot"
    expected:
      category: plumbing_repair
      job_type: fixture_add_move
      bank_job_type: "faucet replacement"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["move washer from hall closet to garage", "new water supply and drain lines", "slab home", "about 30 feet", "no floor drain in garage", "needed by end of month"]
      must_not_be_on_card: ["any price", "permit required", "trench through the slab"]
      max_questions: 5
      notes: "Plumbing card first, a second electrical card for the 240 volt dryer outlet (electric dryer, panel on the garage wall). The plumbing-specific job type in the bank list is not an exact match for a laundry move; the kb id is fixture_add_move. Slab and distance are not volunteered and move the scope."

