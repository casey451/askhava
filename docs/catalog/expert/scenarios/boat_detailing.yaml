    hidden_facts:
      - "22 ft pontoon with two aluminum tubes (toons), bimini top, vinyl bench seating"
      - "the wake boat was done last year and is NOT part of this request"
      - "tubes are bare aluminum, brown tannin-looking streaks and a white film from the waterline up"
      - "there is no gelcoat on the tubes; the deck rails are anodized aluminum"
      - "vinyl seats have dark spots in the seams and cracks"
      - "pontoon is on a trailer at a storage lot, no hookups there, lot manager must be told"
      - "she wants the tubes and rails to look shiny; seats just cleaned, not re-covered"
    homeowner_behavior: "friendly, answers what is asked, but keeps saying 'the boat' and may mean either; will clarify the wake boat is not included when asked which boat"
    traps:
      - "two boats in one message; the card is for the pontoon only"
      - "wax and gelcoat language from the wake boat does not apply to aluminum tubes; the card should describe what she sees (aluminum tubes, brown streaks, white film) and say 'wax and polish' as her words"
      - "hidden: storage lot has no water or power; mobile detailer would need to bring both"
      - "hidden: seat dark spots are in the seams, only said when asked about the interior or seats"
    expected:
      category: boat_detailing
      job_type: detailing
      bank_job_type: "full detail"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["pontoon, 22 ft", "aluminum tubes with brown streaks and white film", "seats have dark spots in seams, clean only", "on trailer at storage lot, no water or power there", "wake boat not included"]
      must_not_be_on_card: ["wake boat details", "gelcoat", "any price", "re-cover seats"]
      max_questions: 6
      notes: "Pontoon versus wake boat. First clarifying question must settle which boat the quote is for. Pontoon surfaces are aluminum so the wake-boat history should not leak onto the card as gelcoat. Storage lot with no hookups is a quote-changing hidden fact."

  - id: boat_detailing_s04
    kind: wrong_self_diagnosis
    persona: "man, 30s, bought a used boat last month, practical, a little defensive about his boat"
    opening_message: "my boat is just dirty it wont come clean no matter what i do. washed it 3 times. need someone to deep clean the hull"
    photo: "white fiberglass runabout in the sun, hull dull and chalky looking, faded red stripe that looks pink, a wiped streak where a hand was dragged across it showing a shinier patch"
    hidden_facts:
      - "19 ft bowrider, early 2000s, white hull with a red stripe"
      - "after washing his hand and the rag come away white and chalky"
      - "red stripe has faded to pink and looks flat"
      - "boat was stored outside under no cover for years by the previous owner, he bought it from a private seller"
      - "boat is on a trailer in his driveway"
      - "he has never waxed it and does not own a polisher"
      - "he wants it to look shiny again, he is not trying to repaint"
    homeowner_behavior: "answers directly; insists it is dirt; will say what is on the rag only if asked what happens when he wipes or washes it"
    traps:
      - "owner's diagnosis is wrong: he thinks dirt, the observable facts are chalky residue on his hand, flat faded color and a shinier wiped patch"
      - "the AI must not say oxidized, sun damage or restoration needed; it records what he sees and what the photo shows, and lets the business quote it"
      - "'deep clean the hull' lands on hull cleaning but the right quote is polish or compound and wax; both must be reachable from the card"
    expected:
      category: boat_detailing
      job_type: detailing
      bank_job_type: "waxing"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["19 ft bowrider on trailer at home", "washed 3 times and still looks dull", "white chalky residue comes off on hand and rag", "red stripe faded to pink", "photo shows dull chalky hull", "never waxed, stored uncovered by previous owner", "owner called it dirty and asked for deep clean"]
      must_not_be_on_card: ["oxidation (as a diagnosis)", "sun damage", "any price", "repaint"]
      max_questions: 5
      notes: "Oxidized gelcoat the owner calls dirty. Key is that the card carries the chalky hand residue and faded stripe so the estimator can price compounding versus wash. The AI must not correct the owner."

  - id: boat_detailing_s05
    kind: misleading_photo
    persona: "woman, 50s, boat kept in a marina slip, posts with a photo she is proud of"
    opening_message: "Can someone clean the bottom of my boat? Here's a pic, it's at the marina in a slip"
    photo: "sunny side-on shot of a clean white cruiser tied in a slip, hull above the waterline looks shiny, waterline barely visible, no growth shown"
    hidden_facts:
      - "26 ft cabin cruiser, in the water in a marina slip year-round"
      - "boat has not been hauled out in about two years"
      - "green slime and hard crust on the waterline and the lower unit when she looked over the side last weekend"
      - "she can see the growth when she leans over the swim platform, not from the dock side where the photo was taken"
      - "marina requires outside vendors to show insurance and check in at the office"
      - "she wants only the hull bottom, not the top sides"
      - "boat has been in the lake more than a week, she has not moved it"
    homeowner_behavior: "cheerful, assumes the photo shows her point; will describe the growth if asked what she sees below the water; gives marina rules only if asked about access"
    traps:
      - "misleading photo: the photo shows the clean topsides, not the problem; the AI must ask for a close-up of the waterline or lower hull rather than quote from the pretty picture"
      - "hidden: crusty hard growth on lower unit and waterline; cleaning vendors would want to know slime versus hard crust"
      - "hidden: marina vendor rules (insurance, check-in) change who can quote; must go on the card as stated, no advice"
      - "boat in the water: a strong estimator asks whether diver, haul-out or slip-side cleaning; the AI must not say which"
    expected:
      category: boat_detailing
      job_type: detailing
      bank_job_type: "hull cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["26 ft cruiser in the water at a marina slip", "bottom of hull only", "green slime and hard crust at waterline and lower unit", "not hauled in about two years", "marina requires outside vendors to show insurance and check in at office", "photo shows topsides only, close-up of waterline requested"]
      must_not_be_on_card: ["quagga", "any price", "any cause", "diver required", "haul out required"]
      max_questions: 6
      notes: "Photo is misleading because it shows the shiny part. The photo ask must target the waterline. Do not tell her the growth is mussels or that decontamination is needed; the card states what she sees and where the boat is."

