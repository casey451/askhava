category: boat_detailing
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: boat_detailing_s01
    kind: vague
    persona: "man, 50s, texts one short line at a time, treats the boat like a car"
    opening_message: "boat looks rough need it done"
    photo: "none"
    hidden_facts:
      - "20 ft bowrider, about 12 years old"
      - "sits on a trailer in his side yard"
      - "he wants the outside washed and waxed, inside is fine"
      - "he has a hose and outside spigot at the house"
      - "boat has not been waxed since he bought it two years ago"
    homeowner_behavior: "answers one thing per reply; never volunteers; says 'done' when he means detailed; short answers; gets curt after 5 questions"
    traps:
      - "'done' could mean a mechanical service or a detail; first question must find out whether this is cleaning or repair"
      - "hidden: no wax in two years, only said when asked what the boat has had done or what he wants for the outside"
    expected:
      category: boat_detailing
      job_type: detailing
      bank_job_type: "waxing"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["wash and wax outside only", "20 ft bowrider", "on trailer at home", "water available at the house", "not waxed in about two years"]
      must_not_be_on_card: ["any price", "any cause", "engine service", "interior detail"]
      max_questions: 5
      notes: "Vague one-liner. If the AI jumps to boat length before knowing it is a cleaning job it risks the wrong category. Boat length and type come from the bank questions; service type decides job type."

  - id: boat_detailing_s02
    kind: wrong_terminology
    persona: "man, 40s, wake boat owner, confident, uses made-up terms"
    opening_message: "need the scum line on my wakeboat acid washed and buffed out, its like a white crusty ring all the way down both sides from the lake spray, vinegar did nothing"
    photo: "side of a dark blue wake boat with a thick white crusty band along the lower hull and rub rail, finger marks wiped through it in one spot"
    hidden_facts:
      - "24 ft inboard wake boat, dark blue gelcoat, about 5 years old"
      - "boat lives on a trailer in an RV-style carport and gets rinsed but not dried after each lake day"
      - "the white band is hard and crusty, he has scrubbed it with a brush and it barely moves"
      - "after scrubbing, the dull streaks stayed on the dark gelcoat"
      - "he has already used vinegar twice and a household bathroom cleaner once"
      - "ballast tanks are fine, this is only about the outside"
      - "he wants it ready for a lake weekend in two weeks, not a rush"
    homeowner_behavior: "answers fully but pushes his own method; says 'acid wash' and 'buff' as if he knows the job; will mention the bathroom cleaner only when asked what he already tried"
    traps:
      - "hidden: heavy hard-water buildup on dark gelcoat that has been scrubbed and treated with household cleaners; a strong detailer would want to know what was already used and whether the finish looks dull or scratched"
      - "'acid wash' is his word, not a job type; the card should say heavy white mineral-looking buildup, scrubbing and cleaners already tried, and let the business decide the method"
      - "the AI must not agree it is hard water, say acid is safe or unsafe, or suggest a product"
    expected:
      category: boat_detailing
      job_type: detailing
      bank_job_type: "waxing"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["24 ft wake boat, dark blue", "thick white crusty band along both sides of lower hull", "brush scrubbing, vinegar and a household bathroom cleaner already tried", "dull streaks on the dark finish after scrubbing", "on trailer at home", "owner asked for acid wash and buff, method up to the business"]
      must_not_be_on_card: ["hard water (as a diagnosis)", "any price", "any product recommendation", "safe to use acid"]
      max_questions: 5
      notes: "Wrong terminology plus a hidden condition: what the owner already put on the finish changes the quote a lot. Must capture the earlier cleaners without judging them. Job type is hull cleaning or wax/polish in the bank; accept 'hull cleaning' or 'waxing' as bank_job_type if the card describes buildup removal and finish."

