category: local_moving
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: local_moving_s01
    kind: vague
    persona: "30s, busy, texts one word at a time, expects the bot to figure it out"
    opening_message: "movers?"
    photo: "none"
    hidden_facts:
      - "moving within Lake Havasu City, north side to a rental near the center of town"
      - "full service with a truck, no packing needed"
      - "two bedrooms of furniture, single story at both ends"
      - "a gun safe in the garage, about 600 pounds, bolted to the slab"
      - "move date is the first weekend of next month"
    homeowner_behavior: "answers one thing per reply; never volunteers the safe; says it only when asked about heavy items or when a question about the garage calls for it"
    traps:
      - "hidden: gun safe bolted down, needs a special crew and someone to unbolt it; only said if asked about heavy items"
      - "hidden: bolted safe may mean an anchor in the slab, homeowner does not think of it as part of the move"
    expected:
      category: local_moving
      job_type: local_move
      bank_job_type: "in-town move"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["within Lake Havasu City", "full service with truck", "2 bedrooms", "single story both ends", "gun safe about 600 lb, bolted down", "first weekend of next month"]
      must_not_be_on_card: ["any price", "any hours estimate", "any mover recommendation", "any advice on the safe"]
      max_questions: 5
      notes: "One-word opener. The safe is the quote driver and the homeowner will not mention it unless the heavy-items question is asked. A card without it is wrong."

  - id: local_moving_s02
    kind: wrong_terminology
    persona: "late 40s, grieving, texts politely in full sentences but uses the wrong words"
    opening_message: "Hi, my dad passed last month and I need a hauling company to take everything out of his house. Some of it is going to the thrift store, the rest I don't know. Is that something you can find someone for?"
    photo: "none"
    hidden_facts:
      - "father's 3 bedroom house in Lake Havasu City, lived in for 30 years"
      - "nothing is being moved to a new home, the house is being emptied to sell"
      - "garage and a backyard shed are full"
      - "she lives out of town and is here for one week"
      - "a few family keepsakes need to be set aside and kept"
    homeowner_behavior: "cooperative but slow, answers in full sentences, uses 'moving' and 'hauling' loosely; when asked whether anything is going to a new place says no"
    traps:
      - "wrong category: nothing is going to a new address, so this is a cleanout, not a move"
      - "hidden: shed and garage contents only mentioned if asked about areas of the property"
      - "hidden: keepsakes to be set aside, mentioned only if asked"
    expected:
      category: estate_cleanout
      job_type: cleanout
      bank_job_type: "whole-house cleanout"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["whole-house cleanout", "3 bedroom house", "garage and shed also full", "some items to donation", "keepsakes set aside", "out-of-town owner here about one week"]
      must_not_be_on_card: ["moving company", "any price", "condolence advice", "any recommendation of a donation place"]
      max_questions: 5
      notes: "She says hauling company and movers. The right question is whether anything goes to a new address; once answered no, this is estate cleanout, not local moving. Should not be forced into the moving question set."

  - id: local_moving_s03
    kind: wrong_self_diagnosis
    persona: "50s, confident, thinks he knows how it works"
    opening_message: "need a long distance mover for a move to Bullhead City, its basically Nevada so I figure its interstate. 4 bedroom house"
    photo: "none"
    hidden_facts:
      - "Bullhead City is in Arizona, so this is an in-state move of roughly an hour by road"
      - "four bedroom house on one level"
      - "a hot tub on the back patio, wired into the house, he wants it moved too"
      - "wants packing help on the kitchen only"
      - "date is flexible within the next three weeks"
    homeowner_behavior: "pushy and sure of himself; corrects the bot if it questions 'interstate'; the hot tub only comes up if asked about heavy items or the backyard"
    traps:
      - "wrong self-diagnosis: believes Bullhead is out of state; the card must not repeat 'interstate' or 'long distance' as fact, and must not refuse"
      - "hidden: hot tub still wired, needs disconnect by a licensed person and a crew with a dolly; only said if asked about heavy items"
      - "hidden: kitchen-only packing"
    expected:
      category: local_moving
      job_type: local_move
      bank_job_type: "in-state move"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["moving to Bullhead City, Arizona", "4 bedrooms", "single level", "hot tub, still wired", "packing for the kitchen only", "flexible date, next three weeks"]
      must_not_be_on_card: ["interstate", "long distance", "any price", "any explanation of moving rules"]
      max_questions: 5
      notes: "The homeowner's own label (long distance, interstate) is wrong and would wrongly get the job refused or sent to the wrong kind of business. The hot tub is a heavy item plus a disconnect that the card should flag for the businesses, not solve."

  - id: local_moving_s04
    kind: misleading_photo
    persona: "late 20s, moving his grandmother's things to his daughter's place, casual texter"
    opening_message: "need help moving a dresser and a couch and some boxes to my daughters place across town. just a couple hours i think"
    photo: "living room corner, a tall rectangular piece draped in a quilt with pedals showing at the base and a couch beside it, six boxes stacked on the floor"
    hidden_facts:
      - "the quilt-covered piece is an upright piano, not a dresser"
      - "the move is within Lake Havasu City"
      - "daughter's house has 4 front steps and no ramp"
      - "about 15 boxes in total, six in the photo and the rest in a closet"
      - "the couch is a sleeper sofa"
    homeowner_behavior: "calls the piano 'the dresser' at first; admits it is a piano if the heavy-items question is asked or someone asks about the quilt-covered piece; short replies"
    traps:
      - "misleading photo: the piece under the quilt has pedals at the base, which a mover would read as a piano"
      - "hidden: steps at the destination, only said if asked about stairs"
      - "hidden: more boxes out of frame in a closet"
    expected:
      category: local_moving
      job_type: heavy_item
      bank_job_type: "in-town move"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["upright piano, covered with a quilt in the photo", "sleeper sofa", "about 15 boxes", "4 steps at the destination", "within Lake Havasu City", "photo attached"]
      must_not_be_on_card: ["dresser", "any price", "any weight guess", "any advice on piano moving"]
      max_questions: 5
      notes: "Photo shows a piano that the homeowner calls a dresser. The card has to say piano, based on the photo and the heavy-items answer, not parrot 'dresser'. Steps at the destination add to the crew."

