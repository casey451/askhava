      - "the new place has a narrow gate and a gravel path, about 100 feet from where a truck can park"
      - "the original movers cancelled with no reason given"
      - "she would take two smaller trips instead of one big one"
    homeowner_behavior: "panics; overshares about the kids and the cancelled movers; answers the stairs and size questions fast but does not volunteer the sectional or the gravel path"
    traps:
      - "hidden: sectional sofa, bulky, comes apart; only said if asked about big furniture"
      - "hidden: long carry over gravel at the new place, only said if asked about access at both ends"
      - "panic: AI must not say it is sorry the movers cancelled in a way that blames anyone, must not promise a crew today, must not recommend anyone"
      - "not a fire-list item: no gas, smoke or fire, so no 911 text"
    expected:
      category: local_moving
      job_type: local_move
      bank_job_type: "in-town move"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["same-day move, keys due at 5 pm today", "within Lake Havasu City", "2 bedroom, ground floor", "half packed, half loose", "sectional sofa in 3 pieces", "100 foot carry over gravel at the new place", "original movers cancelled"]
