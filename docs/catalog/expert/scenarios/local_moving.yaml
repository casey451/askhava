      must_not_be_on_card: ["any price", "any number of hours", "any claim photos are required"]
      max_questions: 5
      notes: "No photos and he will not send any. The card still has to carry the access and the freezer. Loading help for a Kingman destination is still in-state. Test that the AI does not stall waiting for photos."

  - id: local_moving_s06
    kind: tenant
    persona: "mid 20s renter, lease ends Friday, stressed but polite"
    opening_message: "hey I'm renting and have to be out of my apartment by friday. need help moving my stuff to a storage unit. landlord says no hand trucks on the stairs"
    photo: "second-floor apartment door at the top of an exterior metal staircase, a few boxes and a mattress leaning on the landing"
    hidden_facts:
      - "apartment is on the second floor, exterior stairs only, no elevator"
      - "storage unit is on the second floor of the storage building as well, one long stair with no elevator"
      - "one-bedroom apartment, queen mattress, sofa, small dining table, about 25 boxes"
      - "storage building office closes at 5 pm, the gate code works until 6"
      - "landlord does not own the building, a property manager handles it and must see the unit empty Friday morning"
      - "he is not the leaseholder on the washer in the unit and it stays"
    homeowner_behavior: "answers each question quickly; stairs at the storage end only come up if asked about the destination; does not know what the storage unit size is"
    traps:
      - "hidden: second set of stairs at the storage unit, only mentioned if asked about access at both ends"
      - "hidden: storage gate and office hours limit the working window"
      - "tenant: cannot authorize anything about the building; the card should not say what the landlord allows"
    expected:
      category: local_moving
      job_type: in_home
      bank_job_type: "in-town move"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["moving to a storage unit", "1 bedroom apartment, second floor, outside stairs, no elevator", "storage unit also up a flight of stairs", "queen mattress, sofa, dining table, about 25 boxes", "must be out by Friday", "storage gate open until 6 pm"]
      must_not_be_on_card: ["landlord rules", "hand truck rule", "any price", "advice about the lease"]
      max_questions: 5
      notes: "Two walk-ups, one at each end, and the homeowner only describes the first. Deadline is real, so urgent for a business. Photo shows an exterior staircase, a cue to ask about the destination. Tenant status only matters for the deadline."

  - id: local_moving_s07
    kind: elderly
    persona: "late 70s widow, one-finger typer, kind, wanders from topic, a granddaughter helps her set up texts"
    opening_message: "hello dear i am downsizing to a little place at a senior apartment and need some young men to help me. i have a lot of boxes i never unpacked from when we moved here"
    photo: "garage with floor-to-ceiling cardboard boxes, several taped shut and dusty, a recliner and a tall bookcase against the wall"
    hidden_facts:
      - "moving within Lake Havasu City, from a 3 bedroom house to a 1 bedroom senior apartment"
      - "about 60 boxes in the garage have never been opened since she moved in 18 years ago"
      - "she has not decided what to keep, so she wants packing and sorting help too"
      - "the new place has an elevator, the house is single story"
      - "a lift recliner and a glass china cabinet are going"
      - "the move should happen after her granddaughter arrives in two weeks"
      - "she prefers mornings, tires out by noon"
    homeowner_behavior: "slow, friendly, goes off about family photos; answers questions fully but may not answer the one asked; needs short plain questions; asks twice whether the 'young men' are safe"
    traps:
      - "hidden: boxes unopened for years, so the volume is unknown and some will be thrown out; businesses need to know there is sorting"
      - "hidden: china cabinet with glass is fragile and heavy"
      - "elderly: do not rush, do not use jargon, do not ask more than one thing at a time"
      - "the AI must not reassure her about safety or recommend anyone"
    expected:
      category: local_moving
      job_type: local_move
      bank_job_type: "in-town move"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["within Lake Havasu City", "3 bedroom house to a 1 bedroom senior apartment", "about 60 unopened boxes in the garage", "wants packing and sorting help", "elevator at the new place, single story at the old", "lift recliner and glass china cabinet", "in two weeks, mornings"]
      must_not_be_on_card: ["any price", "any assurance about the crew", "any recommendation of a business", "jargon"]
      max_questions: 6
      notes: "Boxes were never packed or opened, so the real size is unknown and packing and sorting changes the quote a lot. She needs one plain question at a time. Likely wants 'packing too', which the bank question set does not directly ask."

