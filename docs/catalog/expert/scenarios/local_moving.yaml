  - id: local_moving_s14
    kind: wrong_self_diagnosis
    persona: "late 30s, relocating for work, decisive, texts in short clear lines"
    opening_message: "taking a job in Las Vegas, need a mover to take my 3 bedroom house from Lake Havasu City there by the end of the month. its only a 2.5 hr drive so should be simple like a local move right?"
    photo: "none"
    hidden_facts:
      - "moving from Lake Havasu City to Las Vegas, Nevada"
      - "3 bedroom, two story home"
      - "has a gun safe and a pool table, neither mentioned yet"
      - "employer is paying part of it, so he wants something in writing"
      - "end of the month is a hard start date for the job"
    homeowner_behavior: "assumes short drive means local; asks twice for 'just a rough number'; accepts the refusal politely but asks if there is anyone else"
    traps:
      - "refused job type: a move leaving Arizona is not handled here, no matter how close"
      - "wrong self-diagnosis: he thinks a 2.5 hour drive makes it local"
      - "AI must not point him to a particular mover or give any price, and must not say interstate rules to him beyond a plain statement that this kind of move isn't covered"
      - "the heavy items are never asked about, because the refusal comes first"
    expected:
      category: local_moving
      job_type: interstate_move
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: []
      must_not_be_on_card: ["a card sent to local movers", "any price", "any named mover or broker", "interstate moving rules or advice"]
      max_questions: 1
      notes: "job_type is the kb id for the refused kind of job (not a job type this category quotes); expected outcome is a plain decline. Move leaving Arizona is refused (interstate broker rules, LIC-017). One question at most, to confirm Nevada; then a plain decline with no routing and no referral. Distance does not make it local. The same trade file has an interstate move type, but this category does not take it."
