  - id: car_detailing_s06
    kind: elderly
    persona: "woman, 78, seasonal resident from the Midwest, courteous, types slowly, prefers full sentences"
    opening_message: "Hello. My husband and I come down for the winter and will be arriving in about three weeks. Our car is in the garage at our winter house and we would like it cleaned inside and out before we arrive. Our neighbor has the key."
    photo: "none"
    hidden_facts:
      - "older large sedan, leather seats, garaged since last April"
      - "dust on the outside from the garage, dead bugs on the grille, some bird droppings on the roof from before it went in"
      - "light mold-like spots on the dashboard edges and seat seams from the summer heat"
      - "the winter house is in a HOA community on the north side of town"
      - "the HOA rule says no washing vehicles in driveways or on the street, only inside the garage, and no commercial vehicles parked in the driveway for more than a couple of hours"
      - "the garage has a utility sink but no hose, she is not sure about the water"
      - "she does not live there now, a neighbor will let the person in, so no one is home the day of the work"
      - "she is on a fixed income and worries about cost but never asks for a price"
      - "she does not know how to send photos, her grandson set up her phone and she can only text words"
    homeowner_behavior: "polite, long sentences, answers every question fully but only the question asked; confused by options lists, prefers plain questions; mentions the HOA only when asked where the work will be done or whether there is anything about the property"
    traps:
      - "hidden: HOA rule on washing in the driveway, only said if asked where the vehicle will be worked on or about any property rules; the card must state it as a fact, not advice"
      - "hidden: spots on the dashboard and seams, only said if asked about the condition or anything on the seats"
      - "hidden: no one home, neighbor has the key; access matters"
      - "elderly: cannot send photos; do not require them"
    expected:
      category: car_detailing
      job_type: full_detail
      bank_job_type: "full detail"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["large sedan", "inside and outside", "garaged at a second home", "needed in about three weeks", "HOA rule: no vehicle washing in driveway or street, garage only", "garage has a sink, no hose confirmed", "neighbor lets business in, owner not present", "spots on dashboard edges and seat seams", "leather seats"]
      must_not_be_on_card: ["any price", "any cause", "mold", "advice to check with the HOA", "owner name"]
      max_questions: 6
      notes: "A seasonal resident's driveway or garage with an HOA washing rule. The AI must not tell her what to do about the HOA; it just puts the rule on the card so businesses can say whether they can work inside the garage. No photos, no tech skills, so one plain question at a time."

