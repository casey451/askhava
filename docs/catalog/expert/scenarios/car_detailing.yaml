scenarios:
  - id: car_detailing_s01
    kind: vague
    persona: "mom, 30s, texts fast between school runs, says 'gross' instead of describing"
    opening_message: "my car is gross can someone come clean it"
    photo: "none"
    hidden_facts:
      - "family minivan, seven seats, about 6 years old"
      - "she wants inside and outside both"
      - "a kid's cup of milk spilled under the second row seat about three weeks ago and it smells sour now"
      - "cloth seats with crushed cereal and crayon on the floor"
      - "parked in the driveway at home in full sun, no garage"
      - "outside spigot on the front of the house"
      - "outside is just dusty, no mud"
    homeowner_behavior: "answers one thing per reply; says 'gross' and 'everything' when asked what she wants; only mentions the milk if asked about smells or stains; gets short after 5 questions"
    traps:
      - "'gross' could mean inside only; first question must find out inside, outside or both without assuming"
      - "hidden: sour milk smell under the seat, only said if asked about stains, spills or smells"
      - "hidden: cloth seats (not leather), changes the interior method and time"
    expected:
      category: car_detailing
      job_type: full_detail
      bank_job_type: "full detail"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["minivan", "inside and outside", "spilled milk smell under second row", "cloth seats", "driveway at home, full sun", "outside spigot"]
      must_not_be_on_card: ["any price", "any cause", "which cleaner to use", "business names"]
      max_questions: 5
      notes: "Vague opener. The milk spill is the hidden condition that moves this from routine to odor work. Job type should follow what she says she wants (both), not jump to odor_pet_hair before the spill is known."

  - id: car_detailing_s02
    kind: wrong_terminology
    persona: "man, 60s, retired, full-time RVer for years, uses RV slang and some wrong words"
    opening_message: "need my coach buffed and the rubber roof and slides done, shes a 40 ft diesel pusher sitting at the storage lot off the highway, lot has no hookups at all"
    photo: "side of a large white motorhome with a faded swoosh graphic, dark vertical streaks under the windows and slide-out seams, parked on gravel between other RVs"
    hidden_facts:
      - "40 foot Class A diesel pusher, about 12 years old"
      - "three slide-outs, all closed while in storage"
      - "painted fiberglass with a decal swoosh, it is not a gelcoat hull"
      - "the roof is a rubber membrane, last cleaned about two years ago"
      - "the storage lot has no water spigot and no power at the space"
      - "the lot office told him washing on site is only allowed if the water does not run off onto the gravel aisle"
      - "he can meet the detailer at the lot any weekday morning"
      - "there are two older bike racks and a ladder on the back"
      - "he has never had the front cap waxed and bugs are baked on"
    homeowner_behavior: "friendly, chatty on RV talk but vague on specifics; calls the roof and the slide toppers the same thing; gives the lot rule only if asked about water or the lot; prefers calls over texts"
    traps:
      - "'buffed' with 'coach' could mean wax or paint polish; the card should record what he wants without choosing for him"
      - "hidden: no water and no power on site, a top estimator would ask because the business must bring water and power"
      - "hidden: lot rule on runoff, only said if asked about the lot or water"
      - "hidden: three slides and roof access, affects time on a 40 ft rig"
    expected:
      category: car_detailing
      job_type: rv_large_vehicle
      bank_job_type: "RV detailing"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["40 ft Class A motorhome", "storage lot", "no water and no power at the space", "lot limits runoff when washing", "roof and slide-outs included", "three slide-outs", "photo of faded paint with streaks"]
      must_not_be_on_card: ["any price", "any cause", "oxidation diagnosis", "recommended wax or product"]
      max_questions: 5
      notes: "Length and place are given in the first text, so a good intake skips the length and where questions and goes to water, shade and what service means (wash, wax, roof). Rubber roof, slides, buff are wrong or loose words; the card keeps his words without translating them into a diagnosis."

  - id: car_detailing_s03
    kind: wrong_self_diagnosis
    persona: "man, 40s, drives a 14 year old pickup, practical, thinks it only needs a wash"
    opening_message: "my truck just needs a wash, paint looks dull and white like chalk on the hood and roof, been sitting in the sun for years. how much for a wash"
    photo: "hood and roof of a red pickup in daylight, pink chalky haze over the whole top surface, one patch near the edge of the roof where the surface looks flaky and lighter"
    hidden_facts:
      - "red single-cab pickup, about 14 years old"
      - "never garaged, always parked outside in the sun"
      - "chalky look on hood, roof and top of the bed rails"
      - "a flaky, peeling patch about the size of a hand on the roof edge"
      - "he has not waxed it since he bought it about six years ago"
      - "he does not want a repaint, just wants it to look better"
      - "he can bring the truck to a business or have them come to his driveway, no preference"
      - "driveway has an outside spigot but no shade"
    homeowner_behavior: "asks about price twice; calls the whole thing 'a wash'; mentions the peeling patch only if asked about the worst spot or any damage"
    traps:
      - "owner's diagnosis is wrong: he thinks it is dirt that a wash fixes, the photo points to sun-faded paint; the AI must not say what it is, only write what the photo shows"
      - "hidden: peeling patch on the roof, a top estimator would ask because it limits what polishing can do"
      - "hidden: no wax in six years and always parked in the sun"
      - "he asks for a price; the AI must not give one"
    expected:
      category: car_detailing
      job_type: ceramic_paint_correction
      bank_job_type: "exterior detail"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["owner asks for a wash", "dull chalky paint on hood, roof and bed rails", "peeling or flaky patch on roof edge", "never garaged", "not waxed in about six years", "driveway with spigot, no shade"]
      must_not_be_on_card: ["oxidation", "clear coat failure", "any price", "any cause", "recommended paint correction"]
      max_questions: 5
      notes: "He calls it a wash; a plain wash job type would send businesses the wrong card. The card records his words plus neutral photo wording and lets the businesses say what is needed. Job type sits with paint work because that is where paint-condition quotes live, but the card must not name a cause. Must not answer the price question."

