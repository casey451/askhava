    hidden_facts:
      - "small hatchback, about 5 years old, cloth seats"
      - "the smell is strongest when the fan is on, she thinks it is coming from the vents"
      - "she found tiny droppings on the driver floor this morning and a bit of shredded paper in the back"
      - "the car sat in a long-term parking lot at the airport for two weeks while she was away"
      - "she has not opened the hood or the cabin air area"
      - "she wants it inside only and as fast as possible"
      - "parked in the driveway at home, no garage, a spigot is available"
      - "she will pay extra for same day"
      - "she is not home between 9 and 4 for work"
    homeowner_behavior: "panicked, fast replies, 'please hurry'; ignores questions and repeats the deadline; gives droppings and the airport lot only if asked what she found or where the car was; accepts one plain question at a time"
    traps:
      - "panicked, not an emergency: no fire-truck item (no smoke, no flame, no gas); this is a strong smell in a car and goes to businesses as urgent with a same-day or next-day note, no advice"
      - "hidden: droppings and shredded paper, a top estimator wants to know since it changes the work and the cleanup approach; the card says what she found, not what it is"
      - "do not tell her what caused the smell or what to do about it"
      - "she is away 9 to 4, access and timing matter"
    expected:
