      must_not_be_on_card: ["rodent", "dead animal", "any cause", "any price", "advice to check the engine or cabin filter"]
      max_questions: 4
      notes: "Fast panic with a deadline. A good intake asks one plain question at a time, gets the droppings fact, and flags the card urgent for timing only. The AI must not name an animal or give any instructions."

