    photo: "tidy front seats of an SUV with a small dark floor mat, almost no hair visible, dashboard clean and bright"
    hidden_facts:
      - "mid-size SUV, about 8 years old, cloth seats"
      - "the front looks fine because she vacuumed it; the back seat and cargo area are covered in hair from a big shedding dog"
      - "hair is woven into the carpet and the cargo liner"
      - "smoke smell is in the headliner and the seat fabric, every window fogs with a brown film"
      - "the previous owner smoked in it for years"
      - "she wants inside only"
      - "parked at home in a garage"
      - "she plans to drive it to her mother's in two weeks and wants it fresh by then"
      - "she has two dogs of her own who will ride in it"
    homeowner_behavior: "cooperative but only answers what is asked; says 'it's mostly fine' about the photo; mentions the back seat only if asked for a photo of the worst area or the rear; sends a second photo only if asked"
    traps:
      - "misleading photo: the front seat looks clean, the real work is in the rear and cargo area, a strong estimator asks for a photo of the worst area"
      - "hidden: brown film on windows and smoke in the headliner, only said if asked about smell or glass"
      - "hidden: hair woven into carpet, and she has dogs who will ride in it"
    expected:
      category: car_detailing
      job_type: odor_pet_hair
      bank_job_type: "interior detail"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["mid-size SUV", "inside only", "heavy dog hair in rear seat and cargo area", "smoke smell in headliner and seats", "brown film on windows", "cloth seats", "garage at home", "wanted in about two weeks"]
      must_not_be_on_card: ["any price", "any cause", "ozone or fogger recommendation", "photo shows clean interior"]
      max_questions: 5
      notes: "The photo supports the opposite of the job. The AI should ask for the worst area photo and not write 'clean interior' on the card. Smoke smell is not a fire-truck item (smell of old smoke in a used vehicle, no fire). Hidden dogs-will-ride matters to a business about repeat hair, but only if asked."

