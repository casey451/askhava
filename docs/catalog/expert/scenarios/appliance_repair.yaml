category: appliance_repair
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: appliance_repair_s01
    kind: vague
    persona: "mid-30s, works shifts, texts in fragments between tasks, never names the machine"
    opening_message: "hey my laundry thing is being weird can someone come look"
    photo: "none at first; if asked, a stacked washer and dryer in a hallway closet with the door open, small display lit on the lower unit"
    hidden_facts:
      - "it is a front-load washer, the bottom half of a stacked washer/dryer tower"
      - "water stays in the drum and the cycle never finishes"
      - "display shows a code that looks like 'OE'"
      - "brand is LG, about 6 years old"
      - "the tower is in a narrow hallway closet with about 2 feet of room in front"
      - "not under warranty"
      - "dryer on top still works fine"
    homeowner_behavior: "answers one thing per reply; says 'the laundry thing' until asked which machine; gives the code only when asked about error codes or the display"
    traps:
      - "hidden: it is a stacked tower in a tight closet, which changes access and tech count; only said if asked about location or how it is installed"
      - "'laundry thing' could be washer or dryer; the card must name the washer"
    expected:
      category: appliance_repair
      job_type: washer
      bank_job_type: "washer repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["washer (front-load, bottom of a stacked tower)", "water stays in drum, cycle does not finish", "error code OE shown", "LG, about 6 years", "narrow hallway closet"]
      must_not_be_on_card: ["clogged pump", "drain pump", "any cause", "any price"]
      max_questions: 5
      notes: "Opening names no appliance and no symptom. The stacked-in-a-closet fact is what a good estimator asks about and a homeowner never offers."

  - id: appliance_repair_s02
    kind: wrong_terminology
    persona: "late 50s, grew up saying 'icebox', confident about words that are slightly off"
    opening_message: "my icebox quit makeing cold and theres a puddle of ice crust in the freezer part the compresser must be shot"
    photo: "freezer interior with a thick layer of frost on the back wall and ice built up around the bottom shelf"
    hidden_facts:
      - "top-freezer refrigerator, about 12 years old"
      - "freezer is still somewhat cold, the fridge section is warm"
      - "frost buildup on the back panel of the freezer"
      - "no error code, it has no display"
      - "the compressor-area hum still runs and a fan can be heard sometimes"
      - "it sits in the kitchen, not the garage"
      - "no warranty"
      - "about half a fridge of food is inside"
    homeowner_behavior: "uses wrong words (icebox, compresser, freon) and states a cause as fact; answers plainly when asked a direct question; irritated if asked to 'not guess'"
    traps:
      - "wrong self-diagnosis: says compressor is shot; the card must not record compressor or refrigerant as a cause"
      - "hidden: half a fridge of food is inside, so a business would want it flagged time-sensitive; only said if asked about food or how long it has been warm"
    expected:
      category: appliance_repair
      job_type: fridge
      bank_job_type: "refrigerator repair"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["top-freezer refrigerator", "about 12 years", "fridge section warm, freezer partly cold", "frost buildup on freezer back wall", "food inside", "photo of frost"]
      must_not_be_on_card: ["compressor", "freon", "refrigerant", "any cause", "any price"]
      max_questions: 5
      notes: "Terminology and the homeowner's confident wrong cause both have to be translated into observable symptoms only. Food at risk makes it time-sensitive per the kb signal, but it is not a 911 item."

  - id: appliance_repair_s03
    kind: wrong_self_diagnosis
    persona: "40s DIYer who watched a video, wants a part swapped and nothing else"
    opening_message: "washer wont spin. its the motor, i checked. need someone to swap the motor"
    photo: "top-load washer with the lid up, tub full of standing water and clothes"
    hidden_facts:
      - "top-load washer, about 9 years old"
      - "the tub fills and agitates but will not spin or drain"
      - "no error code"
      - "it stopped mid-cycle with a full tub of water"
      - "there is a hum when it tries to spin"
      - "the washer sits on the second floor over a finished ceiling"
      - "not under warranty"
    homeowner_behavior: "insists on the motor; will answer questions about brand and age but pushes back on anything that sounds like second-guessing"
    traps:
      - "wrong self-diagnosis: motor; card must record symptoms (fills, will not spin or drain, hum) not a motor swap request"
      - "hidden: second-floor washer over a finished ceiling raises water-damage stakes when draining; only said if asked where it is located"
      - "standing water means a business may bring a pump or buckets; the card should state water is still in the tub"
    expected:
      category: appliance_repair
      job_type: washer
      bank_job_type: "washer repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["top-load washer, about 9 years", "full tub of standing water, will not spin or drain", "hums when it tries to spin", "second floor", "photo of tub"]
      must_not_be_on_card: ["motor", "replace the motor", "any cause", "any price"]
      max_questions: 5
      notes: "Homeowner has already ordered the repair. The card should ask a business to look and fix, not swap a named part. Second floor is the quiet trap."

  - id: appliance_repair_s04
    kind: misleading_photo
    persona: "early 60s, tidy, sure the dishwasher is the culprit because the puddle is right there"
    opening_message: "dishwasher is leaking again water on the kitchen floor in front of it, attached a pic"
    photo: "water puddled on the tile in front of a closed dishwasher with a dark wet edge under the sink cabinet door beside it"
    hidden_facts:
      - "the puddle shows up only when the kitchen sink is running or the disposal is used"
      - "the dishwasher has run a full cycle with no puddle"
      - "the floor inside the sink cabinet is wet and there is a damp smell"
      - "dishwasher is about 4 years old"
      - "garbage disposal is about 15 years old"
      - "the drain hose of the dishwasher connects to the disposal"
    homeowner_behavior: "answers every direct question; assumes the dishwasher is leaking and will not mention the sink cabinet unless asked where else is wet or when the water appears"
    traps:
      - "misleading photo: the puddle sits in front of the dishwasher but the pattern points at the sink cabinet beside it"
      - "wrong self-diagnosis: dishwasher is the source; the right category may be plumbing_repair"
      - "hidden: water appears only when the sink or disposal runs; asked 'when does it leak' the homeowner says so"
    expected:
      category: plumbing_repair
      job_type: leak_slow
      bank_job_type: "leak repair"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["water on floor in front of dishwasher", "appears only when sink or disposal runs", "wet floor inside sink cabinet", "dishwasher about 4 years, disposal about 15 years", "photo of puddle"]
      must_not_be_on_card: ["dishwasher is leaking", "bad disposal seal", "any cause", "any price"]
      max_questions: 5
      notes: "The photo points at the dishwasher; the timing fact moves it to plumbing. The card is routed to plumbing and records both appliances plus the timing so the plumber is not misled. A weaker run keeps it in appliance_repair as dishwasher."

