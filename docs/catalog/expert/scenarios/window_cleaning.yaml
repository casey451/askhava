      - "landlord emailed that the HOA only allows ladders if the unit owner arranges it with the HOA office"
      - "the front and back have a shared common-area lawn with sprinklers the HOA runs"
      - "the sliders have hazy white spots on the outside"
      - "move-out is Nov 20, he wants it done before the walkthrough on Nov 18"
    homeowner_behavior: "casual; does not know window count, guesses; mentions HOA and landlord only when asked if anyone else needs to OK the work or about access"
    traps:
      - "tenant: renter is the requester, owner permission and HOA ladder rule are conditions the card carries as stated, with no advice"
      - "hidden: deadline of Nov 18, which makes the request time-sensitive without being an emergency"
      - "hidden: upstairs windows with a ladder rule from the HOA"
      - "hidden: white spots on outside of sliders"
    expected:
      category: window_cleaning
      job_type: regular_wash
      bank_job_type: "inside and outside windows"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["renter, townhouse", "2 stories, about 16 windows", "inside and outside", "needs done before Nov 18 walkthrough", "HOA rule on ladders per the renter", "white spots on outside of sliders"]
      must_not_be_on_card: ["any price", "advice about lease or landlord", "legal advice about who pays", "HOA rules stated as fact"]
      max_questions: 6
      notes: "Tenant paying for window cleaning before move-out. The AI should record the deadline and the access rule as the renter's words and ask nothing about the lease. Deadline is a date, not an emergency."

