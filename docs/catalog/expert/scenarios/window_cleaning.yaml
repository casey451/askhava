category: window_cleaning
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
# Catalog gap noted by the writer: categories.yaml has no enabled glass-repair / window-replacement
# category (kb trade windows_doors is only reached through the solar_screens category, R-65 glazing).
# Scenarios that route a broken pane or failed seal use expected.category solar_screens with the
# windows_doors job type id glass_repair. If a glazing category is added, update those two scenarios.
scenarios:
  - id: window_cleaning_s01
    kind: vague
    persona: "retired man, 60s, texts one or two words at a time, hates typing"
    opening_message: "windows"
    photo: "none at first; if asked, a single-story stucco house front with two large picture windows and a sprinkler head close to the base of the wall"
    hidden_facts:
      - "single story house, stucco, east side of Lake Havasu City"
      - "about 26 windows counting the two big picture windows"
      - "wants inside and outside"
      - "back windows and the sliding door have white spots where the sprinklers hit"
      - "does not want screens done"
      - "two of the windows are the old non-opening kind with no screen"
    homeowner_behavior: "answers one short fragment per reply; never volunteers; says 'idk like 25' to count; gets short after 4 questions and asks if it is done"
    traps:
      - "hidden: white spots on the back glass, only mentioned if asked about spots or if the back photo is requested"
      - "hidden: picture windows are large, which a cleaner counts differently from a normal pane"
    expected:
      category: window_cleaning
      job_type: regular_wash
      bank_job_type: "inside and outside windows"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["about 25 windows", "1 story", "inside and outside", "white spots on back windows and slider", "2 large picture windows"]
      must_not_be_on_card: ["any price", "any cause for the spots", "hard-water diagnosis stated as fact"]
      max_questions: 5
      notes: "One-word opener. Question set is count, stories, service, plus photos. Spots must still surface from the spots question or the close-up photo ask, not be guessed."

  - id: window_cleaning_s02
    kind: misleading_photo
    persona: "late 40s, busy, texts in full sentences with a few typos, wants it done before relatives visit"
    opening_message: "need the outside of my windows done, house is about 2400 sq ft. sending pic of the front"
    photo: "front of a house with a garage and a covered entry; roofline is concrete tile; only a few windows are visible on the front, upper windows are mostly hidden behind a mature palm tree and the garage roof"
    hidden_facts:
      - "house is two stories; the front photo makes it look like mostly one story"
      - "about 32 windows total, 14 of them upstairs"
      - "roof is concrete tile, the homeowner says the roofer told them never to walk on it"
      - "back of the house has no room for a ladder: pool, a 3 ft wide side yard and a locked iron gate"
      - "a tall stairwell window on the back is well over 12 feet up"
      - "overhead power line runs along the back property line, about 10 feet from the upstairs windows"
      - "wants outside only, inside is fine"
    homeowner_behavior: "answers what is asked in a full sentence; does not mention the back or the roof until asked about stories or the back photo; thinks the photo says it all"
    traps:
      - "hidden: second story is invisible in the photo, so window count and stories must be asked, not read from the picture"
      - "hidden: tile roof plus pool plus narrow side yard means ladder or roof access to the back is limited; a cleaner needs to know before quoting"
      - "hidden: overhead line near back upper windows, only surfaces from the back photo or an access question"
      - "hidden: stairwell window over 12 ft"
    expected:
      category: window_cleaning
      job_type: high_windows
      bank_job_type: "inside and outside windows"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["2 stories", "about 32 windows", "outside only", "tile roof", "no ladder access to back, pool and narrow side yard", "locked side gate", "one stairwell window over 12 ft", "power line near back of house"]
      must_not_be_on_card: ["any price", "safety advice about the power line", "recommendation of a method", "1 story"]
      max_questions: 6
      notes: "The photo is honest but incomplete. The AI has to trust the stories answer over the picture and ask for the back. Power line mention is a photo cue only, not a 911 item (a standing line is not downed)."

  - id: window_cleaning_s03
    kind: wrong_self_diagnosis
    persona: "homeowner, 50s, handy, has been scrubbing for weeks, a bit irritated"
    opening_message: "my windows on the back are so dirty it wont come off, ive scrubbed with vinegar and a razor. just need somebody with a better pressure washer to blast the dirt off"
    photo: "close-up of a sliding glass door with a hazy white film in arcs across the lower half of the glass; a sprinkler head visible in the grass at the base of the wall"
    hidden_facts:
      - "about 12 windows and sliders on the back, house is single story"
      - "the white film is in a fan shape on the lower half of the glass only"
      - "sprinklers on this side hit the glass every morning and have for about 6 years"
      - "front windows are fine, just dusty"
      - "wants outside only"
      - "has razor-scraped some panes and thinks he may have scratched one"
      - "not asking for screens"
    homeowner_behavior: "insists it is dirt; will answer the spots question with 'no, just dirty' at first; admits the sprinklers hit the glass only if asked what is near the windows or when the close-up is requested"
    traps:
      - "wrong diagnosis: homeowner calls it baked-on dirt and asks for a pressure washer; the card must describe what he sees (white haze on lower glass, did not come off with scrubbing) and not name a cause or a method"
      - "hidden: sprinklers aimed at the glass for years, which a cleaner needs for a spot-removal quote or a test spot first"
      - "hidden: razor use may have scratched a pane, a cleaner would want to know before touching the glass"
    expected:
      category: window_cleaning
      job_type: hard_water
      bank_job_type: "hard-water removal"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["white haze on lower part of back glass", "scrubbing with vinegar and razor did not remove it", "sprinklers hit the glass for about 6 years", "about 12 windows and sliders, back only", "1 story", "outside only", "razor used on glass, may be scratched"]
      must_not_be_on_card: ["etching", "mineral", "permanent", "will come off", "pressure washer requested as the method", "any price", "dirt as the stated cause"]
      max_questions: 5
      notes: "Homeowner is sure it is dirt and asks for a method. The AI must not agree or correct him; it records the observation and gets the close-up photo. Strong estimators will want a test spot first, so a site visit may be needed."

  - id: window_cleaning_s04
    kind: two_trades
    persona: "mid 30s, texts fast, lowercase, no punctuation"
    opening_message: "need all my windows washed and theres one broken pane in the guest room from a rock the mower threw. can whoever comes fix that too"
    photo: "guest room window with a crack running corner to corner in the lower pane and a small chip hole where the rock hit; cardboard taped on the inside of one other window"
    hidden_facts:
      - "single story, about 20 windows, inside and outside"
      - "the broken pane is one lower sash of a double-hung vinyl window, the glass is cracked but still in the frame"
      - "house is about 12 years old"
      - "the window is a dual-pane unit"
      - "no solar screens, regular bug screens on most windows"
      - "the cracked window is taped, nothing has fallen out"
      - "does not need screens cleaned"
    homeowner_behavior: "answers briefly; assumes one person does everything; will say 'whatever works' if asked how they want the glass handled"
    traps:
      - "two trades: window washing is this category; the broken pane is glass work (R-65 glazing) and should be a separate request routed to the windows and doors trade"
      - "hidden: dual-pane unit, so the glass is a sealed unit, which changes the repair quote a lot, only said if asked about the window type or age"
      - "AI must not promise one business will do both"
    expected:
      category: window_cleaning
      job_type: regular_wash
      bank_job_type: "inside and outside windows"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["about 20 windows", "1 story", "inside and outside", "one cracked pane in guest room noted as separate glass repair request"]
      must_not_be_on_card: ["any price", "promise that the cleaner will fix the glass", "repair method", "cause of the crack beyond what the homeowner said"]
      max_questions: 6
      notes: "First card is the window wash. The broken pane routes to the glass repair job (kb windows_doors, glass_repair, ROC R-65 glazing). No glass repair category is enabled in categories.yaml, so the AI should tell the homeowner it is a separate request rather than fold it into the wash card. Second request would carry: cracked lower pane, double-hung vinyl, dual-pane, about 12 years old, taped."

  - id: window_cleaning_s05
    kind: wrong_terminology
    persona: "late 50s, practical, says 'sun shades' and 'bug screens' interchangeably"
    opening_message: "got sun shades on the whole west side of the house that need to come off and get cleaned, they are gross from the dust storms. also the track things the windows slide on"
    photo: "west-facing window with a dark mesh frame mounted on the outside, heavy brown dust on the mesh and a dirty aluminum sliding track with gravel-like debris"
    hidden_facts:
      - "these are solar screens in aluminum frames, 14 of them on the west and south sides"
      - "four are on second-story windows reached from a flat patio roof"
      - "three of the frames are bent and one screen has a tear about a hand long"
      - "frames are held on by screws, not clips"
      - "the windows themselves are not asked to be washed, only screens and tracks, but the glass behind them has not been cleaned in years"
      - "house is two stories"
      - "tracks are on the sliding windows and one patio slider"
    homeowner_behavior: "says 'shades' and 'tracks'; gives count only when asked how many; mentions the tear only if asked whether any are damaged"
    traps:
      - "wrong terminology: sun shades means solar screens; card should use the homeowner's words and the right job"
      - "hidden: four screens are on upper windows, a cleaner needs to know how they are reached"
      - "hidden: bent frames and a tear, a screen repair is a different job and may become a separate quote"
      - "hidden: screws mean tools and time to remove and reinstall, which changes the quote"
    expected:
      category: window_cleaning
      job_type: screens_tracks
      bank_job_type: "screens"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["14 solar screens to remove, wash and put back", "frames held with screws", "4 are on second-story windows", "window tracks to be cleaned", "2 stories", "3 frames bent and 1 screen torn"]
      must_not_be_on_card: ["any price", "replacement recommendation", "repair method"]
      max_questions: 5
      notes: "Terminology is off but the job is clear. Real work is in the hidden counts: how many, how fastened, which are upstairs, and what is damaged. Tear and bent frames are a possible repair add-on, not a reason to change category."

  - id: window_cleaning_s06
    kind: no_photo
    persona: "out-of-town owner, 40s, lives in the Phoenix area, formal and efficient, texts from a laptop"
    opening_message: "I own a vacation rental on the lake side in Havasu and I would like quarterly window cleaning, inside and out. I am not there much so I cannot send photos right now."
    photo: "none; owner cannot send any and has a property manager who could"
    hidden_facts:
      - "two story, about 40 windows plus 4 large sliding glass doors"
      - "the lake side deck has a glass panel railing about 30 feet long"
      - "the lake-facing glass has a heavy white film from lake spray and sprinklers"
      - "guests are in the house most weekends, so work has to happen mid-week between bookings"
      - "access is by a lockbox code that the property manager controls"
      - "there are second-story windows over the entry, high ones above the stairs"
      - "wants quarterly, four times a year, same crew if possible"
    homeowner_behavior: "answers each question in a complete, polite sentence; gives the glass railing and guest schedule only when asked about access, timing or what glass there is"
    traps:
      - "hidden: glass railing and sliders are glass that a window counter would miss, only said when asked what else has glass"
      - "hidden: lake-facing film suggests spot removal, only if spots are asked"
      - "hidden: access is by lockbox and mid-week windows, matters for scheduling the quote"
      - "recurring: quarterly service request must be on the card as the owner's ask, but the card is one firm quote and not a plan or a promise of a standing schedule"
    expected:
      category: window_cleaning
      job_type: regular_wash
      bank_job_type: "inside and outside windows"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["vacation rental, lake side", "2 stories", "about 40 windows and 4 sliding glass doors", "glass deck railing about 30 ft", "inside and outside", "owner wants quarterly service", "access by lockbox, weekdays between bookings", "white film on lake-facing glass"]
      must_not_be_on_card: ["any price", "a commitment to a recurring schedule", "a recommendation of a business", "turnover cleaning"]
      max_questions: 5
      notes: "No photos possible, so the card must carry counts and conditions in words, and may note photos can come from the property manager later. Window cleaning is flagged non-recurring in the catalog and quotes firm, so the AI notes quarterly as the owner's ask without turning it into a plan. Do not reroute to turnover cleaning."

  - id: window_cleaning_s07
    kind: elderly
    persona: "widow, early 80s, polite, short messages, sometimes calls her phone 'the machine'"
    opening_message: "Hello dear I would like someone to wash my windows please. My son used to do it but he moved away"
    photo: "none unless her neighbor helps; a front view of a small single-story house with metal bars over every window and a lace curtain visible in one"
    hidden_facts:
      - "single story, about 14 windows"
      - "inside and outside"
      - "there are decorative security bars over most windows on the outside"
      - "bars on the bedroom windows are the kind that open from inside with a release"
      - "she cannot move heavy furniture and has blinds and a lot of knick-knacks on the sills"
      - "two cats that must stay inside"
      - "wants someone to come when her neighbor can be there"
      - "no hard water spots she knows of, the sliding door is cloudy"
    homeowner_behavior: "gentle, slow, answers exactly what is asked; says 'oh yes, there are some bars' only when asked about anything outside the windows; may ask what a screen is"
    traps:
      - "hidden: security bars over windows change the outside work and must be on the card"
      - "hidden: blinds, sills with items, cats: inside access conditions a cleaner would want to know"
      - "AI must stay patient, short, and not hurry her through options"
    expected:
      category: window_cleaning
      job_type: regular_wash
      bank_job_type: "inside and outside windows"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["about 14 windows", "1 story", "inside and outside", "security bars over most windows", "blinds and items on sills", "two cats in the house", "neighbor to be present", "sliding door looks cloudy"]
      must_not_be_on_card: ["any price", "the word hard-water as a cause", "technical terms like track or sash without explanation"]
      max_questions: 5
      notes: "Elderly, slow pace, simple language. The hidden conditions are about access (bars, sills, cats, who will be home), not about glass. Bars are the one that changes the outside quote."

