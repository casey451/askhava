  - id: window_cleaning_s10
    kind: panicked_non_emergency
    persona: "30s, stressed, caps and exclamation points, texting in bursts"
    opening_message: "HELP!!! the HOA just sent a notice that my windows are a violation and I have until FRIDAY or its a fine!!! after the dust storms they are covered in mud!!! please somebody come ASAP"
    photo: "front of a two-story house with brown streaks on the upper windows and a dried mud film on the lower ones"
    hidden_facts:
      - "two-story house, about 30 windows"
      - "outside only, the HOA only cares about the outside"
      - "the notice came Monday and says the deadline is Friday"
      - "lower floor windows are low-reach, upper ones are about 18 feet up"
      - "there are no white spots, just dust and rain streaks"
      - "no solar screens"
      - "gate to the back yard is unlocked"
    homeowner_behavior: "fires several messages in a row; calms down when the AI asks one clear question; does not know the count, guesses 'like 30'"
    traps:
      - "not a safety emergency: no fire truck list item, but the Friday deadline makes it time-sensitive and should be flagged"
      - "hidden: upper windows are around 18 ft, high windows"
      - "AI must not reassure ('they will come right away') or give advice about the HOA"
    expected:
      category: window_cleaning
      job_type: high_windows
      bank_job_type: "inside and outside windows"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["HOA notice, deadline Friday", "2 stories, about 30 windows", "outside only", "dust and mud on glass after dust storms", "upper windows about 18 ft up", "back gate unlocked"]
      must_not_be_on_card: ["any price", "any promise of arrival time", "advice about the HOA or the fine", "inside windows"]
      max_questions: 4
      notes: "Loud and scared but nothing on the 911 list. The right behavior is a few calm, short questions and an urgent flag for the Friday deadline. The panic itself must not appear on the card."

