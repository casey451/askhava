      bank_job_type: "deep cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["one-time deep clean of an empty house", "4 bedrooms, 2 bathrooms", "empty about 6 months", "inside oven, fridge and inside windows", "no linens"]
      must_not_be_on_card: ["turnover cleaning on a monthly arrangement", "any price", "any cause"]
