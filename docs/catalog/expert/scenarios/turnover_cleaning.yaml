      - "this is a single clean, not an ongoing arrangement; he has not decided about regular service"
      - "4 bedrooms, 2 bathrooms"
      - "house has been empty for 6 months"
      - "inside oven and fridge need cleaning, windows inside too"
      - "no furniture or linens yet; furniture arrives next month"
      - "he is in the house now and will let people in"
    homeowner_behavior: "keeps using the word 'turnover' because he saw it in forums; answers questions; agrees when asked 'is this a one-time clean?'"
    traps:
      - "wrong diagnosis: he asked for a turnover clean, but it is a one-time deep clean of an empty home; belongs to house cleaning"
      - "hidden: oven, fridge and windows are extras that change time; only come up if asked about extras"
      - "hidden: empty for 6 months and no linens, so no linen change"
    expected:
