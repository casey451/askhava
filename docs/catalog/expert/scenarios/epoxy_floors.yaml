category: epoxy_floors
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
# Note for the checker owner: categories.yaml lists the job type "garage floor epoxy", but the flooring trade file
# (kb_trade) has no epoxy job type id. The only epoxy id in the trade files is garage_floor_epoxy in painting.yaml,
# used here as expected.job_type for the epoxy_floors scenarios.
scenarios:
  - id: epoxy_floors_s01
    kind: vague
    persona: "man in his 40s, new to the house, texts one short line at a time while at work"
    opening_message: "garage floor looks terrible, want it fixed up"
    photo: "none"
    hidden_facts:
      - "attached 3-car garage, bare gray concrete, no coating on it now"
      - "two big dark oil stains where the truck parks, and lighter drips in the other bays"
      - "the third bay looks like it was poured later, there is a straight seam with a gap about as wide as a pencil between it and the other two"
      - "there is a floor drain in the middle bay"
      - "wants a solid color, 'something that looks clean', no flakes"
      - "wants it done before a family party in about a month"
      - "he is not sure how old the house is, bought it last spring"
    homeowner_behavior: "answers one thing per reply; never volunteers; gives a fact when a question clearly calls for it; says 'not sure' to anything technical; gets short after 5 questions"
    traps:
      - "hidden: oil saturation in the concrete, only says it if asked about stains or what is on the floor"
      - "hidden: a seam between separate pours and a floor drain, only mentioned if asked about cracks, joints or anything in the floor"
      - "hidden: 'fixed up' could mean repair, coating, or clean; the card must not guess which"
    expected:
      category: epoxy_floors
      job_type: garage_floor_epoxy
      bank_job_type: "garage floor epoxy"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["3-car garage", "bare concrete, no coating now", "heavy oil stains", "seam between pours and a floor drain", "solid color wanted", "wants it done within about a month"]
      must_not_be_on_card: ["any price or range", "any advice about degreasing or grinding", "a claim about what product is needed"]
      max_questions: 5
      notes: "Six words and no finish named. The strong estimator wants size, current surface, stains, cracks and joints, drain, finish, timing. The oil saturation and the second pour are what he will not volunteer."

  - id: epoxy_floors_s02
    kind: wrong_self_diagnosis
    persona: "woman in her 60s, careful, writes full sentences, worries about mold"
    opening_message: "I think I have mold coming up through my garage floor. There is white fuzzy stuff along the back wall and the old coating is bubbling in that area. I want it sealed with epoxy so it stops. Here is a picture."
    photo: "back corner of a garage floor, white crusty powder along the base of the wall and in a band on the concrete, a few raised bubbles in a gray coating, one bubble broken open showing bare concrete underneath"
    hidden_facts:
      - "2-car garage, house built about 2004"
      - "the gray coating is an old do-it-yourself kit from the prior owner, no idea how old"
      - "the back wall of the garage is shared with a planter bed that is watered by a drip system"
      - "a downspout on the outside of that wall empties onto the dirt right beside it"
      - "the white stuff is dry and powdery, it comes off on her finger, no musty smell"
      - "the bubbling and the powder come back every summer after the monsoon storms"
      - "the rest of the floor is fine, just the back third"
    homeowner_behavior: "answers each question fully but adds worries; mentions the monsoon pattern only if asked whether it happens at certain times; mentions the planter and downspout only if asked what is on the other side of the wall"
    traps:
      - "wrong self-diagnosis: she calls it mold; the card records what she sees (white powder, bubbling) as her words and does not confirm mold or moisture as a cause"
      - "hidden: water source on the other side of the wall, only found if asked what is outside the wall or when it happens"
      - "hidden: old coating failing in the same area, which changes prep and removal"
      - "hidden: she wants it 'sealed so it stops', which sets a result the contractor may not be able to promise; the card must not repeat that as a promise"
    expected:
      category: epoxy_floors
      job_type: garage_floor_epoxy
      bank_job_type: "garage floor epoxy"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["2-car garage", "white powdery material along the back wall, homeowner thinks it is mold", "old coating bubbling in the back third", "comes back each summer after monsoon storms", "planter bed with drip line and a downspout on the other side of the wall", "photo of the back corner"]
      must_not_be_on_card: ["mold confirmed", "moisture is the cause", "efflorescence", "any advice to fix the water first", "a promise that sealing will stop it"]
      max_questions: 5
      notes: "She has diagnosed mold and asked for a fix. The card should carry her words and the facts (powder, bubbling, seasonal return, water on the far side of the wall) and let the business judge. The seasonal pattern and the downspout change the quote a lot and only come out if the AI asks when it happens and what is outside that wall."

