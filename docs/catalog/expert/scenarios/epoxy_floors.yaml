    traps:
      - "no photo and he refuses: the card goes out without photos and says so; the AI should not stall asking again after two refusals"
      - "hidden: existing clear sealer from the builder, which changes prep; only if asked about the surface or past coatings"
      - "hidden: a bolted rack on the back wall"
      - "hidden: access through a neighbor, a scheduling fact for a site visit"
    expected:
      category: epoxy_floors
      job_type: garage_floor_epoxy
      bank_job_type: "garage floor epoxy"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["2-car garage about 22 by 22", "clear sealer on the floor from the builder, house about 12 years old", "hairline cracks near the back wall", "tan or sand with a few flakes", "no photos available this week", "neighbor can open the garage"]
      must_not_be_on_card: ["price or range", "advice about whether sealer matters", "repeated photo requests"]
      max_questions: 5
