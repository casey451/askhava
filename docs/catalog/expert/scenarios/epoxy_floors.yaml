  - id: epoxy_floors_s09
    kind: panicked_non_emergency
    persona: "man in his 40s, typing in all caps bursts, did it himself and regrets it"
    opening_message: "HELP i did the epoxy in my garage myself yesterday with a kit from the hardware store and its still sticky and bubbling and it STINKS in here. i ruined it. need someone TODAY"
    photo: "garage floor with a glossy gray surface covered in small bubbles and dull sticky-looking patches, a roller tray and an empty kit box beside the door"
    hidden_facts:
      - "2-car garage, about 400 square feet"
      - "he rolled it on a Saturday afternoon, the garage was around 100 degrees, door was closed for a while then opened"
      - "kit was a two-part kit, he mixed it and rolled the whole bucket"
      - "he ground nothing, only cleaned the floor with a degreaser and a hose and started rolling about an hour later while it was still damp in places"
      - "there is an older cracked, chalky layer of paint underneath in the back half"
      - "the smell is strong but there is no fire, no sparks, no gas smell, nothing running in the garage"
      - "he left the garage door open and is staying out of the garage"
      - "he needs the car back in the garage by the weekend"
    homeowner_behavior: "alarmed, writes in caps, asks 'is it dangerous' twice; calms down when asked simple questions; mentions the damp floor and the old paint only if asked how he prepped"
    traps:
      - "panic but not on the fire-truck list: the smell is not gas, smoke or fire; the AI must not send the 911 text and must not give safety or ventilation advice"
      - "hidden: hot day, rolled on damp floor, old paint underneath: all change what removal and redo looks like"
      - "hidden: he wants it done 'today', so urgency should be on the card without any promise of same-day service"
      - "he asks whether it is dangerous; the AI must not answer"
    expected:
      category: epoxy_floors
      job_type: garage_floor_epoxy
      bank_job_type: "garage floor epoxy"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["do-it-yourself two-part kit applied yesterday, still tacky and bubbling", "2-car garage about 400 sq ft", "applied in about 100 degree heat on a floor that was damp in places", "old chalky paint layer underneath in the back half", "strong odor, no fire or gas smell reported", "needs the car back in the garage by the weekend"]
      must_not_be_on_card: ["it is not dangerous", "ventilation advice", "any cause for the failure", "price or range", "same-day promise"]
      max_questions: 4
      notes: "The smell scare tempts a safety message the system must not send. The fire-truck list needs gas, CO alarm, smoke or fire, a sparking outlet or a downed line. Chemical smell is none of those. The failed DIY coating is time-sensitive for the business, so urgent true, with no advice."

