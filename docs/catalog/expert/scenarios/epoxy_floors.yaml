      - "her own garage is a 2-car, bare concrete with a light gray dusty look, no coating"
      - "there is a one-step drop at the house door and the floor slopes toward the big door"
      - "she likes the cove edge at the wall in the picture and wants that too"
      - "she wants flakes covering the whole floor, not a sprinkle"
      - "a few small chips along the control joints near the door"
      - "she has not taken a photo of her own floor"
    homeowner_behavior: "answers excitedly; assumes the screenshot says everything; sends a photo of her own garage only if asked for one; says 'the same as the picture' to finish questions"
    traps:
      - "misleading photo: it shows a finished floor in another garage; the card must label it inspiration and not describe it as her floor, size or condition"
      - "hidden: her real floor is bare and chipped at joints, only found by asking for her own floor photo"
      - "hidden: cove base at the wall, a design detail that changes cost, easy to lose in 'same as the picture'"
      - "hidden: full broadcast versus light flake, only if asked how much flake"
    expected:
      category: epoxy_floors
      job_type: garage_floor_epoxy
      bank_job_type: "garage floor epoxy"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["inspiration photo, gray white and black flakes, glossy, with wall cove edge", "her own garage: 2-car, bare concrete", "flakes over the whole floor", "wants the cove edge at the wall", "small chips at joints near the door"]
      must_not_be_on_card: ["price or range", "the Pinterest photo described as her garage", "an opinion on the look"]
      max_questions: 5
      notes: "The only photo is not of her floor. The AI should ask for a photo of the actual floor and keep the screenshot as design inspiration. The cove edge and full flake coverage are in the picture but she will not call them out."

