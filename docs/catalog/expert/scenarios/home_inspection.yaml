      - "the homeowner asks 'who can do all of this?'; the AI must not name or recommend a business"
      - "hidden: she wants the inspection first; that ordering is only given if asked what comes first"
      - "no diagnosis of the roof tiles or paint on the inspection card"
    expected:
      category: home_inspection
      job_type: pre_listing
      bank_job_type: "pre-listing inspection"
      fire_dept_text: false
