  - id: pest_control_s14
    kind: no_businesses
    persona: "30s, homeowner, practical, answers in short sentences"
    opening_message: "bees are going in and out of my irrigation valve box in the front yard, been a few days, want them gone"
    photo: "the plastic valve box lid in a rock yard bed, lid ajar about an inch, several bees on the rim and flying in and out"
    hidden_facts:
