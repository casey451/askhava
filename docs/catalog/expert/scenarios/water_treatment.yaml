    hidden_facts:
      - "wants a new patio misting system (nozzle line along the patio cover beams)"
      - "covered patio is about 20 feet by 14 feet, beam cover about 10 feet high"
      - "there is no outlet on the patio; the nearest one is on the other side of the house"
      - "the pump needs power; the existing back-wall outlet he thinks about is on a garage circuit"
      - "hose bib on the stucco wall about 8 feet from the beam cover"
      - "party is in July, about 8 months away; he wants it in place by spring, flexible on dates"
      - "city water, Lake Havasu City; he has heard about scale on nozzles"
      - "home is a single story with stucco walls"
    homeowner_behavior: "organized; answers fully; brings up the outlet at the start; the dimensions and hose bib come out only if asked about the patio or where the water comes from"
    traps:
      - "two trades: misting system (water treatment / R-54 scope) first; a new patio outlet is electrical and should be offered as a separate card, not folded in"
      - "hidden: no outlet on the patio, nearest across the house; power run changes the quote"
      - "timing: July is months away; do not mark urgent"
      - "no kb job type id for misting; harness should check the category and bank job type only"
    expected:
      category: water_treatment
      job_type: null
      bank_job_type: "misting system"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["new patio misting system on a covered patio about 20 by 14 feet, beam cover about 10 feet high", "hose bib on stucco wall about 8 feet from the cover", "party in July, wants it in place by spring", "no patio outlet noted for the second card"]
      must_not_be_on_card: ["an electrician price or scope in the misting card", "advice about scale on nozzles", "any price", "a named business"]
      max_questions: 5
      notes: "Two trades: misting card first, then an offer for a separate electrical card (new outlet on the patio, no existing one). The AI must not merge them into one card. Timing is months out, so no urgency. job_type is null only because the trade file has no misting id; see the note at the top of the file."

