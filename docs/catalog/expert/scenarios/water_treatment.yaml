category: water_treatment
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
# Note for the harness: the water_treatment kb file has no misting job type id (bank job type "misting system" exists).
# s11 is a two_trades scenario, so its job_type is left null; a misting-only request has no kb id to assert.
scenarios:
  - id: water_treatment_s01
    kind: vague
    persona: "man in his 40s, busy, texts one-line messages, does not know the equipment names"
    opening_message: "water thing in the garage isnt working right"
    photo: "none at first; if asked, one photo of a tall tank beside a shorter tank with a lid; the shorter tank is open and the bottom is bare and dry with white residue"
    hidden_facts:
      - "it is a water softener, he calls it 'the water thing'"
      - "white crust is coming back on the faucets and shower glass"
      - "he has not added salt in about 6 months and does not think of it as something he does"
      - "unit came with the house, brand is not known, control head has a small display"
      - "it is in the garage next to the water heater"
      - "no leak, no beeping, no error on the display"
      - "city water, Lake Havasu City"
    homeowner_behavior: "answers one thing per reply; never volunteers anything about salt; says 'dunno' to brand; will send a photo if asked clearly"
    traps:
      - "hidden: no salt added in about 6 months, only said if asked when it was last filled or what he has done with it"
      - "hidden: nothing is actually broken as far as he knows; the card must not call it broken or say the cause"
    expected:
      category: water_treatment
      job_type: softener_repair
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["water softener in the garage, spots back on faucets and shower glass", "homeowner says no salt added in about 6 months", "brand unknown, photo of unit", "no leak, no error", "city water"]
      must_not_be_on_card: ["out of salt as a diagnosis", "advice to add salt", "any price", "the unit is broken"]
      max_questions: 5
      notes: "Opening says nothing about a softener. The system question has to find it, then the salt history question has to be asked as a plain fact question (what has been done to it, when last filled). A strong estimator wants that fact because the visit may be a simple service call. Bank job type is null on repair scenarios because categories.yaml lists only softener install, RO system and misting system."

  - id: water_treatment_s02
    kind: wrong_self_diagnosis
    persona: "woman in her 50s, confident, decides things fast, texts in complete sentences"
    opening_message: "my water softener died. the spots are all back and the water feels hard. i need a quote to replace it with a new one"
    photo: "if asked, one photo of a softener with the control head on top; a valve with a handle on the back plumbing is turned crosswise to the pipes"
    hidden_facts:
      - "the softener is about 6 years old, Fleck-style control head, display looks normal"
      - "the water heater was replaced about 2 months ago by someone she hired"
      - "she has never looked at the valve handle on the back; it was turned crosswise to the pipes after the water heater work"
      - "salt tank is about half full"
      - "spots came back right around the time the water heater was done"
      - "garage, existing loop, drain line goes to a standpipe"
      - "city water"
    homeowner_behavior: "insists on replacement; answers directly but will not look at anything unless asked to take a photo; does not link the water heater job to the spots unless asked what changed recently"
    traps:
      - "hidden: water heater replaced about 2 months ago, spots returned right after; only said if asked what changed or when it last worked"
      - "hidden: a handle on the back valves is turned crosswise; visible in the photo but she never mentions it"
      - "homeowner's own diagnosis (dead, needs replacing) may be wrong; the card should still say what she asked for and what she saw"
    expected:
      category: water_treatment
      job_type: softener_repair
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["homeowner asked for a replacement quote; spots back, water feels hard", "about 6 years old, Fleck-style control, display normal", "water heater replaced about 2 months ago, spots returned after", "photo shows a valve handle turned crosswise to the pipes", "existing loop and drain in garage"]
      must_not_be_on_card: ["bypass as the cause", "the softener is dead as a fact", "advice to turn the handle", "any price"]
      max_questions: 5
      notes: "She asks for softener_replace but the facts point to a repair or service visit. The card should carry her request in her words and the observable facts, and a repair-type job so businesses do not bid a full replacement blind. The AI must not say 'it's on bypass' or tell her to move the handle."

  - id: water_treatment_s03
    kind: misleading_photo
    persona: "man in his 60s, practical, texts short and sends photos readily"
    opening_message: "softener isnt softening, full of salt tho so its not that. see pic"
    photo: "brine tank with the lid off showing a layer of white salt pellets right up near the top, looks full and level; no water visible"
    hidden_facts:
      - "water spots and scale are back on the fixtures for about 3 weeks"
      - "salt looks full at the top but he has not poked it; under the top layer it is a hard dry crust with empty space below"
      - "he topped it off with salt every month without checking underneath"
      - "unit is about 10 years old, brand label on the control head says Autotrol"
      - "single tank, garage, drain line to a standpipe"
      - "no leak, no error"
      - "city water"
    homeowner_behavior: "sure of himself; only checks under the salt if a question clearly asks how it feels or whether the salt is loose or hard; answers fast"
    traps:
      - "misleading photo: salt looks full and level from the top, which supports his 'not the salt' belief"
      - "hidden: hard crust under the top layer with a gap below, only said if asked to check how the salt feels"
      - "hidden: he refills monthly without ever checking underneath"
    expected:
      category: water_treatment
      job_type: softener_repair
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["scale and spots back for about 3 weeks", "salt looks full at the top in the photo", "homeowner says crust under the top layer, gap below", "about 10 years old, Autotrol, single tank", "drain to standpipe, no leak, no error"]
      must_not_be_on_card: ["salt bridge as a diagnosis", "advice to break up the salt", "any price"]
      max_questions: 5
      notes: "The photo and his own diagnosis both point away from the real condition. The card must report the photo neutrally (salt looks full at the top) and still pick up the hard crust fact if a question about the salt condition is asked. Do not say 'bridge' to him; that is the cause."

  - id: water_treatment_s04
    kind: elderly
    persona: "woman in her late 70s, texts slowly with typos, calls the RO 'the little faucet filter', her daughter set it up years ago"
    opening_message: "hello my water from the little faucet at the kitchen tastes funny and there is a drip. the filters havent been changed since my husband passed i think 4 yrs"
    photo: "none; she says she can't work the camera. If her daughter helps later: under-sink cabinet with a white plastic tank and canisters, green-white crust on the small shutoff valves and fittings"
    hidden_facts:
      - "under-sink reverse osmosis system, installed by her daughter's contractor about 7 years ago"
      - "separate small drinking faucet beside the main kitchen faucet drips from the spout"
      - "the shutoff valves under the sink have green-white crust and she has never turned them"
      - "there is a garbage disposal on the same sink"
      - "slow weep of water from one of the fittings, a small damp spot on the cabinet floor; she keeps a towel there"
      - "city water, Lake Havasu City"
      - "she is home all day; her daughter can come by on weekends for photos and access"
    homeowner_behavior: "slow, polite, one fact per reply, apologizes for typing; does not know brand or the word 'RO'; will mention the towel only if asked whether anything is wet or leaking under the sink"
    traps:
      - "hidden: crusted shutoff valves she has never turned; a business would want to know before arriving"
      - "hidden: damp spot and towel under the sink, only said if asked about water under the cabinet"
      - "hidden: filters about 4 years old"
      - "elderly: do not push for photos she cannot take; offer the daughter option once and move on"
    expected:
      category: water_treatment
      job_type: ro_service
      bank_job_type: "RO system"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["under-sink RO, about 7 years old, filters about 4 years old", "separate drinking faucet drips", "shutoff valves under the sink have green-white crust, never turned", "small damp spot and towel in the cabinet", "garbage disposal on same sink", "daughter can help with photos on weekends"]
      must_not_be_on_card: ["advice to turn the valves", "taste cause or health claims about the water", "any price", "bad membrane"]
      max_questions: 6
      notes: "She says 'the little faucet filter'; the system question should settle that it is a reverse osmosis system without making her feel she got it wrong. The crusted-shutoff and damp-spot facts decide whether a business plans for valve or fitting work. No health claims about the funny taste."

  - id: water_treatment_s05
    kind: tenant
    persona: "man in his late 20s renting a house, polite, wants it handled without a fight with the landlord"
    opening_message: "softener in my rental keeps beeping and the water leaves spots. landlord said just get someone out to look at it"
    photo: "if asked, one photo of a softener control head with a flashing display and a sticker on the tank that says it belongs to the owner"
    hidden_facts:
      - "tenant, month-to-month rental house in Lake Havasu City"
      - "the landlord owns the softener and owns the house"
      - "landlord told him by text to get a quote first; the landlord has to approve any work and pays the bill"
      - "he has not met the landlord in person; the landlord's contact info would be shared only if the homeowner approves"
      - "beeping has gone on about 2 weeks, display flashes"
      - "salt tank looks empty to him but he does not know if that is his job to fill"
      - "garage is locked; he is home evenings and weekends"
      - "no leak"
    homeowner_behavior: "answers politely; unsure what is his responsibility; mentions the landlord only if asked who owns the unit or who approves work"
    traps:
      - "hidden: the landlord owns the softener and must approve work and pay; a business needs to know who authorizes before arriving"
      - "hidden: salt tank looks empty to him, only said if asked about the unit's condition"
      - "tenant: the card should name the tenant as the contact and say landlord approval is needed, without making the AI decide who is responsible"
    expected:
      category: water_treatment
      job_type: softener_repair
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["rental house, tenant is contact", "landlord owns the softener and must approve work", "beeping about 2 weeks, display flashing", "salt tank looks empty to tenant", "evenings and weekends access"]
      must_not_be_on_card: ["who is responsible for the repair", "advice about the lease", "any price", "the empty salt as the cause"]
      max_questions: 5
      notes: "Authorization is the trap: a business arriving without the owner's okay wastes a trip. The card states the landlord owns the unit and approves work, and does not take a side on who should pay or fill the salt."

