category: gutters
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
# Notes for the harness:
# - The gutters kb file (gutter_solar_cleaning) is mostly about cleaning. The bank only has "gutter install" and "gutter repair".
#   Cleaning-only requests map to bank "gutter repair" with a short note on the card ("cleaning only"), or bank_job_type null when
#   there is no honest fit (solar washing). Quote format for the category is firm.
# - Gutter install and repair are ROC R-45 and handyman_allowed is false, so scenarios s02, s04, s06, s10, s12, s14 are licensed-only work.
scenarios:
  - id: gutters_s01
    kind: vague
    persona: "man in his 60s, texts one short line at a time, says 'the edge thing' and 'it came down'"
    opening_message: "the edge thing on the roof came down on one side"
    photo: "none"
    hidden_facts:
      - "a section of gutter about 20 feet long is hanging by one end on the west side of the house"
      - "the hanging end is still attached near the front corner, the other end is on the ground"
      - "one story, tile roof"
      - "the board the gutter hung from is soft and crumbly at the bottom edge where he pushed on it"
      - "it came down in last week's wind and rain, no storm in progress now"
      - "a neighbor offered to put it back up for cash"
      - "gutter is aluminum, white, about 15 years old"
    homeowner_behavior: "answers one thing per reply; never volunteers; says 'the edge thing' until asked what it is made of; gives a fact when a question clearly calls for it; gets short after 5 questions"
    traps:
      - "hidden: the board behind the gutter is soft or rotted, only said if asked about the condition of the wall or board it hangs from; a gutter business needs to know before quoting a rehang"
      - "hidden: tile roof, which changes how the crew gets to the edge; only said if asked"
      - "the neighbor offer is not a card fact and the AI must not comment on hiring him"
      - "'edge thing' could be gutter, fascia or drip edge; the AI should ask, not assume"
    expected:
      category: gutters
      job_type: gutter_repair_route
      bank_job_type: "gutter repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["about 20 feet of gutter hanging on the west side", "one story", "tile roof", "board behind the gutter feels soft", "aluminum, about 15 years old"]
      must_not_be_on_card: ["rotted fascia diagnosis", "wind caused it", "neighbor will do it for cash", "any price"]
      max_questions: 5
      notes: "Vague opener with no trade word. The rotted-board fact is the quote-changer a strong estimator asks about. Licensed-only R-45 work, not a handyman job."

