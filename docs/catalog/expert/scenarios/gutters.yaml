      - "the AI must not say the pitch was misleading, must not advise on canceling or the deposit, and must not give a view on gutter guards being worth it"
      - "the card records the want (gutter guards on about 60 feet of existing gutter), the facts (clean, never overflowed) and one story tile roof"
      - "hidden: palm tree overhang is a real condition guard installers care about"
