      must_be_on_card: ["wants gutter guards on existing gutters", "gutters on the front and one side, about 60 feet", "one story, concrete tile roof", "gutters have never overflowed", "a few leaves in one corner", "one palm tree about 30 feet from the house"]
      must_not_be_on_card: ["salesman is a scam", "cancel the contract", "guards are not needed", "deposit", "the other company's price", "gutters will ruin the roof", "any price"]
      max_questions: 5
