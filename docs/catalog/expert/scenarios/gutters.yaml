    persona: "woman in her 40s, flat foam roof house, writes in a hurry with typos, calls things by the wrong names"
    opening_message: "hi the scuper drain pipe thing on my flat roof is plugged up w/ dirt and theres a puddle on the roof that wont go away"
    photo: "roof edge where a rectangular opening in the parapet wall is half covered with packed dirt and leaf debris, with a shallow puddle on the roof surface behind it"
    hidden_facts:
      - "flat roof with a foam coating, one story"
      - "the opening in the low wall at the roof edge is what she calls the scuper; it empties into a short metal downspout on the outside wall"
      - "the puddle is about 2 inches deep and about 4 feet across, has been there since the last rain two weeks ago"
      - "no stains or drips inside the house"
      - "there are two openings like this, only the back one is plugged"
      - "roof is reached by a fixed ladder bolted to the back wall"
    homeowner_behavior: "answers in run-on sentences, uses wrong words (scuper, drain pipe, roof gutter) but answers what is asked; mentions the puddle repeatedly"
    traps:
      - "hidden: standing water about 2 inches deep on a foam roof; a roofer would want that on the card, but the AI must not say it is damaging the roof"
      - "wrong terminology: she means a roof scupper and downspout, not a gutter; the AI should write what she describes, not correct her tone"
      - "hidden: second scupper is clear, only the back one is plugged"
      - "borderline between gutter cleaning and roofing; the card goes to gutters as cleaning-only with the ponding fact so the business can decline if it is a roofing job"
    expected:
      category: gutters
      job_type: gutter_clean
      bank_job_type: "gutter repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["flat foam roof, one story", "roof drain opening at the back wall plugged with dirt and debris", "standing water about 2 inches deep, about 4 feet across, two weeks", "second opening is clear", "no stains inside", "fixed ladder to the roof on the back wall"]
      must_not_be_on_card: ["roof is failing", "will leak", "ponding damage", "needs a roofer", "any price"]
      max_questions: 5
      notes: "Wrong terms, flat roof with scuppers rather than gutters. Maps to gutter cleaning with a 'cleaning only' note. Strong estimators care about the ponding water and roof access, not the vocabulary."

  - id: gutters_s03
    kind: panicked_non_emergency
    persona: "woman in her 30s, new homeowner, ALL CAPS and exclamation points, afraid for her house"
    opening_message: "THE WATER FROM MY ROOF IS POURING STRAIGHT ONTO MY FOUNDATION WHEN IT RAINS!!! my house is going to crack in half. need someone TODAY"
    photo: "downspout ending about 2 inches above the ground at a stucco corner, with dark water staining on the lower stucco and a patch of eroded gravel"
    hidden_facts:
      - "the storm was last night, more storms are forecast this week"
      - "one downspout at the front-left corner of the house, the bottom elbow and extension are missing"
      - "the gutter itself is attached and not leaking at the seams"
      - "water pooled in the gravel next to the stucco wall for about an hour and drained away by morning"
      - "no water has come into the house, no wet floors, no wet garage"
      - "she has not seen cracks in the walls or slab, she just worries"
      - "one story, about 120 feet of gutter around the house, tile roof"
      - "the lawn crew may have knocked off the elbow, she does not know"
    homeowner_behavior: "writes in capitals and keeps asking if the house is safe; answers questions when asked directly but circles back to fear; never volunteers that no water got inside"
    traps:
      - "panicked, but no 911 text: water against a foundation is not on the fire-truck list"
      - "wrong self-diagnosis: she thinks the foundation is failing and the house will crack; the AI must not agree or reassure, and the card must not say foundation damage"
      - "she wants a french drain or foundation work; the AI should capture what she sees (downspout end, pooling) and not label the job"
      - "hidden: only the bottom elbow and extension are missing, gutter itself is fine; changes the job from a gutter job to a small downspout repair"
      - "hidden: no water inside; a business sorting urgency wants to know that"
    expected:
      category: gutters
      job_type: gutter_repair_route
      bank_job_type: "gutter repair"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["downspout at the front-left corner ends about 2 inches above the ground", "bottom elbow and extension missing", "gutter itself attached", "water pooled next to the stucco wall during the storm", "no water inside the house", "more rain forecast this week", "one story, tile roof, about 120 feet of gutter"]
      must_not_be_on_card: ["foundation damage", "foundation is at risk", "french drain", "lawn crew broke it", "your house is safe", "any price"]
      max_questions: 5
      notes: "Monsoon downspout dumping against the wall. Flagged urgent for businesses (more rain coming) but no safety text and no reassurance. The AI must refuse to confirm or deny her foundation fear."

