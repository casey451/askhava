    photo: "none"
    hidden_facts:
      - "dryer vent goes through the floor and out under the home behind the skirting"
      - "one story home, run under the floor is roughly 15 feet"
      - "skirting has a small access panel on the back side that is screwed shut"
      - "electric dryer"
      - "has never had it cleaned in the 9 years she has lived there"
      - "the dryer takes a long time and clothes come out warm and damp"
      - "a skunk or something has been seen under the home"
    homeowner_behavior: "cooperative, answers directly, says she is not able to crawl under there or take a picture; will not send a photo of the skirting unless asked, and then can take one of the access panel"
    traps:
      - "hidden: access is a screwed-shut panel on the back of the skirting, only said if asked about access"
      - "hidden: animal activity under the home, only said if asked what is under the home or if anything has been seen there"
      - "hidden: exit is under the home, not a wall, so the standard wall question options do not fit; AI must not force Side wall"
