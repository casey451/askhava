category: dryer_vent_cleaning
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: dryer_vent_cleaning_s01
    kind: vague
    persona: "man in his 60s, texts in a hurry between jobs, short messages, no punctuation"
    opening_message: "need someone to do my dryer vent thing"
    photo: "none"
    hidden_facts:
      - "wants a regular cleaning, has never had it done in the 6 years he has owned the house"
      - "stacked washer and dryer in a hall closet inside the house"
      - "vent goes straight out the side wall, run under 10 feet"
      - "one story house"
      - "electric dryer"
      - "dryer is taking a bit longer than it used to"
    homeowner_behavior: "answers one thing per reply; never volunteers; says 'the usual' if asked what is wrong; gives a fact when a question clearly calls for it"
    traps:
      - "hidden: stacked unit in a closet means the dryer has to be pulled out or unstacked, only mentioned if asked where the dryer sits"
      - "hidden: has never been cleaned in 6 years, only mentioned if asked when it was last done"
    expected:
      category: dryer_vent_cleaning
      job_type: standard_vent_cleaning
      bank_job_type: "dryer vent cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["side wall exit", "1 story", "run under 10 feet", "electric dryer", "dryer taking longer than usual", "stacked washer and dryer in a hall closet"]
      must_not_be_on_card: ["any price", "any cause", "fire risk", "how often to clean"]
      max_questions: 5
      notes: "Almost no information in the opening line. The card has to come from the three bank questions plus photo asks without sounding like an interrogation. Stacked unit in a closet is something a good estimator wants and the homeowner never volunteers."

  - id: dryer_vent_cleaning_s02
    kind: wrong_terminology
    persona: "woman in her 40s, busy parent, types long run-on messages, uses her own words for house parts"
    opening_message: "hi need the dryer chimney snaked out and the lint stuff on the roof cleaned, our house is 2 stories and the laundry is upstairs by the bedrooms"
    photo: "taken from the yard: a small metal cap on a tile roof with a few strands of grey lint hanging from the opening"
    hidden_facts:
      - "vent exits through the roof, small metal cap on a concrete tile roof"
      - "two story house, laundry room is on the second floor"
      - "duct run is roughly 20 feet with at least two bends going up through the attic"
      - "gas dryer"
      - "dryer takes two cycles to dry towels"
      - "lint visible hanging out of the roof cap"
      - "roof is steep on that side of the house"
    homeowner_behavior: "answers in full sentences but only to what was asked; does not know the word duct or run; says 'the pipe'; will send the photo right away if asked"
    traps:
      - "hidden: tile roof, only says it if asked about roof type or sees the photo ask"
      - "hidden: gas dryer, only says it if asked gas or electric"
      - "hidden: upstairs laundry with a run through the attic, only the stories and run-length questions bring it out"
    expected:
      category: dryer_vent_cleaning
      job_type: long_or_roof_vent
      bank_job_type: "dryer vent cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["roof exit", "2 stories", "tile roof", "run about 20 feet", "gas dryer", "second floor laundry", "dryer slow to dry"]
      must_not_be_on_card: ["any price", "any cause", "chimney", "safe to use the dryer"]
      max_questions: 5
      notes: "Chimney and snaked are her words, not trade terms, and the card must translate them to dryer vent cleaning. Roof exit on a tile roof of a two-story is the most expensive and hardest-to-staff version of this job, and tile and gas only come out if asked."

  - id: dryer_vent_cleaning_s03
    kind: wrong_self_diagnosis
    persona: "man in his 50s, handy, confident, sure he knows what failed"
    opening_message: "my dryer is broken, runs but clothes come out damp. I think the heating element is shot, need somebody to replace it"
    photo: "none"
    hidden_facts:
      - "drum turns normally and the dryer gets very hot on the outside top panel"
      - "electric dryer about 7 years old"
      - "clothes take three cycles to dry"
      - "vent goes out a side wall of the garage, run about 15 feet"
      - "one story house"
      - "outside flap barely lifts when the dryer is running and lint is stuck around the cover"
      - "vent has never been cleaned"
    homeowner_behavior: "pushes back a little when asked about the vent ('it's the element, I've watched videos'); still answers each direct question; sends a photo of the outside cover if asked"
    traps:
      - "wrong diagnosis: he believes a heating element failed, the facts point to restricted airflow, but the card must not say that; it records symptoms and lets businesses decide"
      - "hidden: flap barely lifts and lint is packed at the cover, only said if asked what he sees at the outside vent"
      - "hidden: dryer is hot but damp clothes, which tells an estimator it is not a no-heat repair; only said if asked what the dryer does"
    expected:
      category: dryer_vent_cleaning
      job_type: dryer_not_drying
      bank_job_type: "dryer vent cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["dryer runs and gets hot, clothes still damp", "about 3 cycles to dry", "garage side wall exit", "run about 15 feet", "1 story", "electric dryer", "lint at the outside cover, flap barely lifts"]
      must_not_be_on_card: ["heating element", "clogged vent as the cause", "any price", "any cause"]
      max_questions: 5
      notes: "Tests that the AI does not accept the homeowner's heating-element story and does not replace it with its own. Symptoms and observations go on the card in neutral words, and the card routes to the vent business, not appliance repair, because the dryer runs and heats. A card that says 'replace heating element' or 'vent is clogged' both fail."

  - id: dryer_vent_cleaning_s04
    kind: wrong_self_diagnosis
    persona: "man in his 30s, typing on his phone in the laundry room, sure it is the vent"
    opening_message: "pretty sure my dryer vent is clogged, drum wont turn at all and theres a loud grinding noise. can someone clean it out"
    photo: "behind-the-dryer view: foil duct attached and not crushed, with a clean metal collar on the dryer back"
    hidden_facts:
      - "drum does not turn and the motor hums, then a grinding noise starts when he tries a cycle"
      - "gas dryer about 11 years old"
      - "vent exits through the side wall and he went out and looked, no lint and the flap moves freely"
      - "clothes were fine until last week when the drum stopped"
      - "one story house, laundry in the garage"
    homeowner_behavior: "keeps saying it is the vent until asked what he sees outside; answers honestly once asked; gets short with long questions"
    traps:
      - "wrong diagnosis: the facts are a dryer mechanical problem, not airflow, so the right category is appliance repair"
      - "hidden: gas dryer, which in appliance repair means gas work goes to licensed only; only says it if asked gas or electric"
      - "hidden: flap moves freely and no lint outside, only said if asked what he sees at the vent"
    expected:
      category: appliance_repair
      job_type: dryer
      bank_job_type: "dryer"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["drum does not turn", "grinding noise", "gas dryer", "about 11 years old"]
      must_not_be_on_card: ["clogged vent", "vent cleaning", "any price", "any cause"]
      max_questions: 5
      notes: "The right answer is a different category. Opening message uses the vent trigger words, but drum-won't-turn plus grinding is the dryer itself. The AI should catch this from the answers and reroute the card to appliance repair; the vent-cleaning card is wrong. Gas dryer matters for the appliance_repair question set."

  - id: dryer_vent_cleaning_s05
    kind: misleading_photo
    persona: "man in his late 40s, practical, writes short plain messages"
    opening_message: "dryer vent outside is full of lint, can you come clean it. photo attached"
    photo: "wall vent hood about 3 feet off the ground with sticks, dry grass and straw packed in the opening and a small bird perched on the hood"
    hidden_facts:
      - "he thinks it is lint because the dryer is slow, but he never looked closely"
      - "there are birds going in and out of the hood every morning"
      - "he saw at least one small egg-shaped thing near the opening last week"
      - "wall exit on a one story house, run about 12 feet"
      - "electric dryer"
      - "dryer takes about twice as long to dry a load"
      - "the vent is on the side of the house behind a gate that latches but is not locked"
    homeowner_behavior: "says 'lint' until asked what he sees in the photo or at the vent, then agrees it looks like a nest; mentions the egg only if asked about birds"
    traps:
      - "photo contradicts the text: it shows nest material and a bird, not lint"
      - "hidden: possible eggs in the nest, only said if asked about birds or what is at the cover"
      - "hidden: gate on the side of the house, only said if asked about access"
    expected:
      category: dryer_vent_cleaning
      job_type: blockage_bird_nest
      bank_job_type: "dryer vent cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["wall exit", "photo shows nest material at the vent hood with a bird on it", "possible eggs seen", "1 story", "run about 12 feet", "electric dryer", "side gate"]
      must_not_be_on_card: ["lint only", "any price", "how to remove birds", "any cause"]
      max_questions: 5
      notes: "The text says lint, the photo says nest. The card should describe what the photo shows in neutral words and carry the possible eggs, which a business needs to know before it shows up. The AI must not tell him what to do about the birds."

