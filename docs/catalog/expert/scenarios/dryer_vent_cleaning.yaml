      bank_job_type: "dryer vent cleaning"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["wants it done as soon as possible, today or tomorrow if possible", "side wall exit", "1 story", "run under 10 feet", "electric dryer", "dryer drying normally", "last cleaning unknown"]
