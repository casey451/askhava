      max_questions: 4
      notes: "Emotional but not on the fire-truck list: no smoke, burning smell, gas or CO. The 911 text must not fire. The card carries her timing wish as 'soonest available' without the word emergency. Hard part is a clear, calm intake with no safety advice when she begs for reassurance."

