      max_questions: 5
      notes: "Elderly, anxious about fire in a general way, answers 'not sure' to most things. Pick-one questions work better than open ones. No gas smell is stated, so fire_dept_text stays false. The AI must be patient and still end with a usable card, and must not reassure or alarm."

