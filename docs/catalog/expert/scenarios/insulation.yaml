      bank_job_type: "blown-in insulation"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["garage ceiling under a finished bonus room, about 400 sq ft", "two-car garage, drywalled ceiling", "flex duct in the ceiling space", "gas water heater in the garage", "recessed lights", "owner prefers no drywall removal", "no photo, owner declined"]
      must_not_be_on_card: ["any suggestion the heat is a duct problem", "any price", "any advice about the water heater"]
      max_questions: 5
      notes: "Garage ceiling under living space where the real quote drivers are access through finished drywall, ducts in the cavity and what sits below. Owner will not send photos, so the AI must stop asking and still write a usable card. A gas water heater being present is not a gas smell; do not send the fire text."

