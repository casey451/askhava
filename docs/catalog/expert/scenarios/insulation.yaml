category: insulation
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: insulation_s01
    kind: vague
    persona: "40s, texting from work on a lunch break, short and distracted"
    opening_message: "my house is brutal in the summer need insulation or something"
    photo: "none"
    hidden_facts:
      - "single-story site-built house, about 1,700 sq ft"
      - "attic hatch is in the hallway ceiling"
      - "when the owner went up once, the fluffy stuff was only about as high as the bottom of the joists, around 3 inches"
      - "no droppings, nests or water stains seen"
      - "AC is in the attic with flex ducts on top of the old fill"
    homeowner_behavior: "answers one thing per reply; does not know the word joists or R-value; says 'idk' to anything technical; will send a photo if asked simply"
    traps:
      - "hidden: AC unit and ducts sit in the attic, which affects how the crew works; only mentioned if asked what is in the attic"
      - "hidden: owner says 'house is hot' but the AC runs fine; a strong intake does not guess whether this is insulation or AC and records the request as asked"
    expected:
      category: insulation
      job_type: attic_top_up
      bank_job_type: "attic insulation"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["attic", "about 1,700 sq ft", "add to what is there", "hallway hatch", "AC unit and ducts in the attic"]
      must_not_be_on_card: ["any cause of the heat", "any R-value to buy", "any price", "any advice about the AC"]
      max_questions: 5
      notes: "Very vague opener. The right path is where, size, add or replace, access. Ask Hava must not decide the heat is an insulation problem; it writes down what the owner asks for."

  - id: insulation_s02
    kind: wrong_terminology
    persona: "50s, confident but gets terms mixed up, types fast with typos"
    opening_message: "need someone to do insolation in my roof space, the spray foam kind. its got a flat part thats not covered right"
    photo: "wide photo from the attic hatch: gray-white loose fill about even with the joists in most places, a bare patch near one corner where the fill is pushed aside, a flex duct crossing the area"
    hidden_facts:
      - "the owner means loose blown-in fiberglass, not spray foam; has never seen spray foam"
      - "attic is over a 2,100 sq ft one-story house"
      - "bare patch is where an electrician pulled cable last year"
      - "pull-down ladder in the garage"
      - "owner has no preference on material"
    homeowner_behavior: "insists on the word 'spray foam' until asked what they have seen; answers directly once asked about the material in the attic now"
    traps:
      - "wrong term: 'spray foam' is a different, much more expensive material and method; the card should record the owner's words plus what the photo shows, and ask whether they want spray foam specifically or whatever the business suggests"
      - "hidden: bare patch from other trade work is not a sign of damage"
    expected:
      category: insulation
      job_type: attic_top_up
      bank_job_type: "attic insulation"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["owner asked for spray foam", "photo: loose fill about level with joists, one bare patch", "about 2,100 sq ft", "pull-down ladder in the garage"]
      must_not_be_on_card: ["correcting the owner's material", "any price", "which material is better"]
      max_questions: 5
      notes: "Wrong terminology that changes the quote a lot. The card must keep 'spray foam' as the owner's request and open to the businesses' suggestion, not silently translate it to blown-in."

  - id: insulation_s03
    kind: panicked_non_emergency
    persona: "30s parent, upset, all caps in places, texts in bursts"
    opening_message: "RAT POOP ALL OVER THE ATTIC INSULATION!!! my husband went up for the christmas boxes and its covered. kids are freaking out. need it ALL out today please"
    photo: "close photo of tan loose fill with dark pellet-shaped specks scattered on top and a shallow tunnel-like dip along one edge; a torn cardboard box in the background"
    hidden_facts:
      - "a pest control company trapped and sealed entry points last week; no new activity since"
      - "the pest company told them the old insulation is contaminated and has to come out"
      - "attic is about 1,400 sq ft, hatch in a hallway closet"
      - "there is a smell of something dead in one corner, started a few days ago"
      - "AC air handler is in the attic; a flex duct near the tunnel looks chewed on the outer layer"
      - "owner wants new insulation put back after removal"
      - "no one has been up in the attic since except the husband that one time"
    homeowner_behavior: "keeps asking for same-day service; answers fast but in bursts; skips the question being asked if upset; calms down when asked simple questions"
    traps:
      - "hidden: dead-animal smell in one corner changes the cleanup scope; only said if asked whether there is any smell or dead animal"
      - "hidden: chewed outer layer on a duct near the AC is an hvac matter and a note for the business; only said if asked what else is in the attic"
      - "hidden: rodent work is already done; a strong intake does not open a pest card just because the word rats appears"
    expected:
      category: insulation
      job_type: attic_remove_replace
      bank_job_type: "attic insulation"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["remove old insulation and put new in", "about 1,400 sq ft", "dark pellet-shaped specks and a tunnel-like dip (photo)", "pest company already trapped and sealed last week", "smell in one corner", "hallway closet hatch", "AC air handler in attic"]
      must_not_be_on_card: ["any health advice", "any claim of disease or contamination level", "any price", "rodent species"]
      max_questions: 6
      notes: "Panicked but not a 911 item and no gas or fire. Owner wants it urgent, so flag urgent for a business but no safety advice. The trap is opening a pest_control card when the rodent job is already done, and missing the smell and the duct note. If the owner says trapping is NOT done, a second pest_control rodents card is right."

  - id: insulation_s04
    kind: wrong_self_diagnosis
    persona: "60s, practical, reads reviews online and has decided what the problem is"
    opening_message: "back bedroom is 10 degrees hotter than the rest of the house. attic insulation must be shot over that room. need it redone"
    photo: "wide attic photo near the back bedroom: loose fill about 12 inches deep (tape shows 12), a flex duct lying across the fill with one end pulled away from a round boot in the ceiling"
    hidden_facts:
      - "the attic was topped up about two years ago, about 12 inches now"
      - "the vent in the back bedroom ceiling barely blows; the other rooms blow strong"
      - "AC is about 12 years old and runs most of the afternoon but the thermostat does hit the set temperature in the front of the house"
      - "no droppings or water stains"
      - "the back bedroom is the farthest from the AC unit"
      - "owner has never looked at the duct end; only the photo shows it"
    homeowner_behavior: "pushes back if told it might be something else, repeats that insulation is the problem; will answer questions about the room and vent when asked directly"
    traps:
      - "wrong diagnosis: depth in the photo is deep and the vent blows weakly, so the real work is a duct or AC airflow issue, not insulation"
      - "the AI must not say the cause; it should ask about vent airflow and the age of the last insulation work, then route to hvac_repair duct repair"
      - "hidden: the photo shows a duct end pulled loose; the card should say what the photo shows without calling it the cause"
    expected:
      category: hvac_repair
      job_type: ductwork_airflow
      bank_job_type: "duct repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["back bedroom much warmer than rest of house", "vent in that room blows weak", "photo: flex duct end pulled away from a round boot", "insulation about 12 inches (tape) added about 2 years ago", "AC about 12 years old"]
      must_not_be_on_card: ["insulation is not the problem", "the duct is the cause", "any price", "owner's claim that insulation is shot as a fact"]
      max_questions: 5
      notes: "Owner diagnosis is wrong and the right answer is a different category. Card goes to hvac_repair. The owner is firm, so the AI has to ask neutral facts (is air coming from the vent, when was insulation last added) and then choose the category without argument or advice. No insulation card unless the owner still insists after the hvac card; then note it as a second card."

  - id: insulation_s05
    kind: misleading_photo
    persona: "late 60s, bought the house two years ago, does not climb into the attic"
    opening_message: "hi we're in a 1962 house and want more insulation blown on top of what's up there. here's a pic from the hatch"
    photo: "wide photo from the hatch: white fluffy loose fill level with the joists across the visible area, looks uniform and new"
    hidden_facts:
      - "home was built in 1962, site-built, about 1,500 sq ft"
      - "the previous owner added the white layer about 5 years ago, before the sale"
      - "the owner once poked a hand in near the hatch and under the white layer was gray-brown pebble-like loose material, about 3 to 4 inches deep"
      - "owner did not think it mattered until asked what is under the top layer"
      - "hatch is a small square in the hallway ceiling, no ladder"
      - "AC ducts run across the attic"
    homeowner_behavior: "cheerful, assumes the photo tells everything; answers honestly and fully when asked what is under the top layer or what the older insulation looks like"
    traps:
      - "hidden: gray-brown pebble-like fill under a newer white layer in a 1960s house; strong estimators ask about it because it may need special handling before any blown-in work. The card states only what the owner reports and sees, never names a hazard"
      - "misleading photo: it shows only the newer top layer"
      - "a question about the oldest layer, such as 'what is under the white fluffy layer' or 'how old is the original insulation', is the one that surfaces this"
    expected:
      category: insulation
      job_type: attic_top_up
      bank_job_type: "attic insulation"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["house built 1962", "white loose fill on top (photo)", "gray-brown pebble-like loose material under the white layer, about 3 to 4 inches, owner report", "small hallway hatch, no ladder", "business should see before quoting"]
      must_not_be_on_card: ["asbestos", "vermiculite named as a fact", "it is safe to disturb", "do not touch advice", "any price"]
      max_questions: 6
      notes: "Vermiculite risk surfaces only if the AI asks about what is under or older than the visible layer. Card is neutral: owner words plus what is seen. Site visit is expected. Licensed-only angle: any removal of pebble-like fill that turns out to be vermiculite is specialized work that is not ordinary R-40 blown-in; the AI must not decide that, only describe, and may ask for a close photo of the lower layer."

  - id: insulation_s06
    kind: elderly
    persona: "late 70s, widower, lives in a manufactured home in a park, short polite texts, not sure how to take photos"
    opening_message: "Hello. My floor is very cold in winter and the electric bill is high. A friend said I need a belly wrap or something under the trailer. How do I get that"
    photo: "none at first; if asked, a photo from the side skirt opening shows a dark sagging underbelly cover with a torn section hanging down about a foot"
    hidden_facts:
      - "double-wide manufactured home, about 1,500 sq ft, built in the 1990s, owned by the resident on a rented space in a park"
      - "a section of the underbelly cover near the bathroom is torn and sagging"
      - "the floor feels soft and a little damp near the tub, noticed a month ago"
      - "side skirting has a removable panel about 2 feet wide near the back"
      - "owner has not looked under the home since buying"
      - "bills are hard on a fixed income; owner is on UniSource electric"
      - "the park manager has not been told"
    homeowner_behavior: "polite and slow, one short answer at a time, asks the AI whether it is a good idea; needs steps spelled out for a photo; will mention the damp floor only if asked if the floor or ceiling has any soft or wet spots"
    traps:
      - "hidden: damp, soft floor near the tub plus torn belly cover may be a plumbing leak; only found by asking about soft or wet spots. Card notes it as an observation; a plumbing card could be a second request if the owner wants it"
      - "no walk-in attic: the closest kb job types are attic-type, but the work is underbelly insulation; the AI should record manufactured home and 'under the floor'"
      - "hidden: free weatherization help may exist for income-qualifying UniSource customers; the AI must not say whether this owner qualifies or give advice"
      - "elderly: needs one question at a time, no jargon, and a plain way to take a photo"
    expected:
      category: insulation
      job_type: wall_blown_in
      bank_job_type: "blown-in insulation"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["manufactured home", "insulation under the floor (belly)", "about 1,500 sq ft", "torn, sagging section near bathroom", "floor soft and damp near tub", "owner-occupied home on a rented space"]
      must_not_be_on_card: ["any leak cause", "any price", "whether the owner qualifies for assistance programs", "who is responsible for the repair"]
      max_questions: 5
      notes: "No kb job type is an exact fit for belly insulation; wall_blown_in (blown into an enclosed cavity) is the nearest and is chosen as the closest cavity-fill match. The harness should accept it, and the gap should be flagged to the expert-file owner. The scenario tests plain, patient wording and catching the damp floor."

