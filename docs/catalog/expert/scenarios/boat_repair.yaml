category: boat_repair
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
# Notes for the reader: the kb file (boat_dock) has no separate canvas/upholstery id; upholstery sits under `detailing`,
# so canvas and upholstery scenarios use job_type detailing with bank_job_type "canvas and upholstery repair".
# "outboard service" maps to kb `service_tuneup` (firm quote). Refused lift work uses kb `boat_lift`, bank_job_type null.
scenarios:
  - id: boat_repair_s01
    kind: vague
    persona: "man in his 50s, texts one short line at a time, never names parts, says 'she' for the boat"
    opening_message: "boat is acting up"
    photo: "none at first; if asked, one photo of a bowrider on a trailer in a driveway, engine cover closed, a faded blue tarp half off the stern"
    hidden_facts:
      - "20 ft bowrider with a single outboard motor, Mercury label, about 150 horsepower"
      - "boat is on its trailer in the home driveway"
      - "turns over but will not catch"
      - "last ran in late May, has sat about 5 months with whatever gas was in the tank"
      - "has not been serviced since he bought it used 3 years ago"
      - "wants it running for a weekend trip in two weeks"
    homeowner_behavior: "answers one thing per reply; never volunteers; gives a fact when a question clearly calls for it; gets short and impatient after 5 questions"
    traps:
      - "hidden: sat 5 months with old fuel in the tank; changes the scope of the visit and only comes out if asked when it last ran"
      - "hidden: never serviced in 3 years; an estimator wants service history"
    expected:
      category: boat_repair
      job_type: engine_repair
      bank_job_type: "engine repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["20 ft bowrider", "outboard, Mercury, about 150 hp", "on trailer in driveway", "turns over but does not start", "last ran in May, sat about 5 months", "no service in about 3 years"]
      must_not_be_on_card: ["any cause such as bad fuel", "any price", "advice about what to try", "a named business"]
      max_questions: 6
      notes: "Opening message is two words of content. The work-type and symptom questions have to carry it, and the 'when did it last run' fact is the one a top marine mechanic wants first. Homeowner will not say 'sat all summer' unprompted."

  - id: boat_repair_s02
    kind: wrong_terminology
    persona: "woman in her 40s, new to boating, uses car words for boat parts, confident tone"
    opening_message: "hi my boat motor keeps overheating, the dash beeps and the water pump belt is probably going. boat is in a slip at the marina, can someone come look"
    photo: "engine bay with the hatch open showing a large engine, a black rubber hose with a dark band, and an outdrive housing partly visible at the stern"
    hidden_facts:
      - "26 ft cruiser with a sterndrive (MerCruiser label), boat is in the water in a rental slip at a marina"
      - "overheat alarm beeps after about 10 minutes at cruising speed, idle is fine"
      - "engine is about 12 years old, hours unknown"
      - "she does not know the word impeller or outdrive; 'water pump belt' is her guess"
      - "marina requires outside vendors to check in at the office and show insurance (she was told this, only says so if asked about access or the marina)"
      - "slip is on a dock with a locked gate; she has the gate code and can meet someone there on weekends"
      - "boat has never been out of the water for service since she bought it"
    homeowner_behavior: "answers in full sentences but only to what was asked; uses her own words for parts; does not know engine hours"
    traps:
      - "hidden: marina vendor rules and gate access change who can quote and when"
      - "hidden: boat is in the water, so a haul-out or on-site work question matters for the quote"
      - "the 'belt' word is her guess and must not go on the card as a part or a cause"
    expected:
      category: boat_repair
      job_type: engine_repair
      bank_job_type: "engine repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["26 ft cruiser", "sterndrive, MerCruiser label", "in the water, rental slip at a marina", "alarm beeps after about 10 minutes at speed, fine at idle", "about 12 years old", "marina requires vendor check-in, gate code, weekends"]
      must_not_be_on_card: ["water pump belt as a cause", "impeller", "any price", "a named marina", "advice to stop using the boat"]
      max_questions: 6
      notes: "Her own part names are wrong or invented. The card must record the symptom in observable words and the slip access facts, not her guess. The slip versus driveway difference (boat in the water, marina rules, gate) is the hidden condition."

  - id: boat_repair_s03
    kind: wrong_self_diagnosis
    persona: "guy in his 30s, handy, watches repair videos, sure of himself, types fast with typos"
    opening_message: "my seadoo needs a new battery. just clicks when i hit start. can someone swap it asap, its on the trailer at my place"
    photo: "personal watercraft on a trailer, seat removed, battery visible with light corrosion on one terminal, a damp film inside the engine compartment"
    hidden_facts:
      - "three-seat jet ski, Sea-Doo, around 2016"
      - "on its trailer in a side yard at home"
      - "it flipped over in the lake last Saturday and was towed back to the ramp by another boater"
      - "he drove it home with the drain plug in and has not run it since"
      - "he tried a jump from his truck, still only clicks"
      - "he has not opened the engine or checked the oil"
      - "clicking started right after the flip, it ran fine before that"
    homeowner_behavior: "pushes his own diagnosis; mentions the flip only when asked what happened before it stopped working or whether it was ever in an accident; otherwise short answers"
    traps:
      - "hidden: capsized and likely took water into the engine; a battery swap quote would be wrong, the job is an engine inspection"
      - "his diagnosis (battery) must not go on the card as the problem"
      - "the damp film in the photo supports the flip fact but must not be read as a cause"
    expected:
      category: boat_repair
      job_type: engine_repair
      bank_job_type: "engine repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["jet ski, Sea-Doo, about 2016", "on trailer at home", "only clicks when start is pressed", "flipped over in the lake last Saturday and was towed in", "has not run since", "jump start tried, same result"]
      must_not_be_on_card: ["new battery needed", "water in the engine as a cause", "any price", "advice to avoid cranking", "a named business"]
      max_questions: 5
      notes: "Homeowner has already decided it is a battery. The AI must ask what happened before it stopped. The capsize is the fact that turns a cheap swap into a drowned-engine job. Jet ski must route to engine repair (kb says PWC is in the same trade)."

  - id: boat_repair_s04
    kind: wrong_self_diagnosis
    persona: "retired man, 60s, proud of his boat, thinks hull cosmetics are structural"
    opening_message: "gelcoat on my boat is shot, whole top half is chalky and the seats are cracking. looking for someone to fix the hull and redo the vinyl"
    photo: "side view of a white and blue fiberglass runabout on a trailer in a storage lot, upper hull dull and streaked, seat vinyl with surface cracks on the bench"
    hidden_facts:
      - "24 ft runabout, about 15 years old, kept outside in a storage lot, no cover"
      - "no cracks or soft spots in the hull that he knows of, no impact damage"
      - "the chalky look is across the whole upper hull, not in patches"
      - "wants it to look good for resale this spring"
      - "storage lot has no water hookup; the lot manager lets vendors in with a call ahead"
      - "seat vinyl is cracked on two benches, foam underneath feels fine"
    homeowner_behavior: "uses the word 'shot' and 'fix' loosely; answers directly; will correct himself if asked what the surface looks like"
    traps:
      - "his belief that the hull needs structural 'fix' is wrong; the request reads as cosmetic restoration and belongs with boat detailing, not repair"
      - "hidden: storage lot has no water, which changes mobile service"
      - "hidden: it is for resale, so cosmetic finish level matters"
    expected:
      category: boat_detailing
      job_type: detailing
      bank_job_type: "waxing"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["24 ft runabout, about 15 years old", "upper hull dull and chalky across the whole top half", "seat vinyl cracked on two benches", "on trailer in a storage lot, no water hookup", "for resale this spring"]
      must_not_be_on_card: ["gelcoat failure or oxidation as a diagnosis", "structural damage", "any price", "a named business"]
      max_questions: 5
      notes: "The right answer is a different category (boat_detailing, tiers). Homeowner says 'fix the hull', which tempts routing to repair. The AI should ask what the surface looks like and whether any damage exists, then card it as detail work. The seat vinyl portion could also be upholstery repair, but the main ask is cosmetic."

  - id: boat_repair_s05
    kind: no_photo
    persona: "woman in her 50s, organized, uses a checklist, says she cannot send photos right now because the boat is at a storage lot across town"
    opening_message: "Looking for annual outboard service on my pontoon. Yamaha 90, 4 stroke. No photos, boat is at a storage lot and I'm out of town till Friday."
    photo: "none; she cannot send any. If asked for an engine label photo she says she will send one Friday"
    hidden_facts:
      - "22 ft pontoon, single Yamaha 90 hp four-stroke outboard"
      - "boat is on its trailer at a storage lot, gate code needed"
      - "she wants impeller, lower unit oil and general service"
      - "impeller has never been changed since she bought it 4 years ago"
      - "she wants it done before Friday so it is ready for a weekend trip; she says this only when asked about timing"
      - "storage lot allows mobile mechanics but wants a 24-hour heads up"
    homeowner_behavior: "answers every question completely and politely; refuses to guess at hours or year; will not send photos until Friday"
    traps:
      - "hidden: impeller never changed in 4 years; affects scope and urgency"
      - "hidden: out of town, so access and the storage lot call-ahead rule matter"
      - "no photo: the card has to be honest that the engine label was not attached and say it will follow"
    expected:
      category: boat_repair
      job_type: service_tuneup
      bank_job_type: "outboard service"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["22 ft pontoon", "Yamaha 90 hp four-stroke outboard", "annual service including impeller and lower unit oil", "no impeller change in 4 years", "on trailer at a storage lot, gate code, 24-hour heads up", "wants it before Friday, owner out of town till then"]
      must_not_be_on_card: ["a made-up engine year or hours", "any price", "a named business or storage lot"]
      max_questions: 5
      notes: "No photo is available, and the AI must not nag for one or invent engine details. Outboard service is a firm-quote job type, so the card should carry enough that a shop can price it without a visit: engine make and size, last service, location. Tests that the AI does not turn a routine service into a diagnostic visit."

  - id: boat_repair_s06
