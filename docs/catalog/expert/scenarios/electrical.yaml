    opening_message: "want to add a 240 outlet in my garage for a welder and a couple regular outlets. no pics im at work til 6, just need a ballpark"
    photo: "none"
    hidden_facts:
      - "welder needs a 50 amp 240 volt outlet, he thinks"
      - "garage is attached, panel is on the opposite side of the house, about 60 feet of run"
      - "house is stucco with a finished garage, drywall up"
      - "panel is a 100 amp main and he thinks it is nearly full"
      - "he plans to also add an EV charger next year"
      - "home built in 1992"
      - "he can send photos after 6 but only if asked"
    homeowner_behavior: "wants speed; declines photos at first; will agree to send a panel photo later if the AI explains it only helps businesses quote; answers questions in one line"
    traps:
      - "no photo at start: AI should ask once for a panel photo and offer to continue without it"
      - "hidden: nearly full 100 amp panel with a long run could mean a panel upgrade or sub-panel; he never connects this to the quote"
      - "hidden: finished drywall and stucco change the labor; only said if asked about the wall and the path"
      - "he asks for a ballpark: the AI gives no price"
    expected:
      category: electrical
      job_type: new_circuit
      bank_job_type: "new circuit"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["new 240 volt welder outlet and two regular outlets in attached garage", "panel on opposite side of house, about 60 feet", "100 amp main, may be nearly full", "finished drywall in garage, stucco house", "possible EV charger next year", "home built 1992", "no photos yet"]
      must_not_be_on_card: ["ballpark", "any price", "needs a panel upgrade", "50 amp is correct", "any cause"]
      max_questions: 5
      notes: "Asks for a price and gives no photos. The card should go out with the facts stated and a note that photos are pending. The load (welder plus future EV) is the hidden quote driver."

  - id: electrical_s06
    kind: elderly
    persona: "woman in her 80s, texts slowly with full stops and capital letters, polite, nervous about strangers in the house"
    opening_message: "Hello. My smoke alarms in the hall and bedroom keep beeping at night. My late husband put in new batteries and it did not stop. I cannot get up on a ladder."
    photo: "ceiling smoke alarm with a small green light and a white label, hall ceiling about nine feet up"
    hidden_facts:
      - "there are six alarms, all wired to the house with a cable and all linked, per her grandson who set it up years ago"
      - "when one beeps, a chirp comes from all of them, once a minute"
      - "there is no smoke, no fire, no alarm blaring, only a short chirp"
      - "the alarms are about 12 years old"
      - "ceilings are nine feet in the hall and vaulted in the living room"
      - "she lives alone; her grandson can be there Saturday to let someone in"
      - "she does not know if there is a carbon monoxide alarm"
    homeowner_behavior: "polite, slow, answers exactly what is asked; will not volunteer the grandson; may worry about cost and say she is on a fixed income"
    traps:
      - "must not read 'beeping at night' as an alarm going off; she answers that there is no smoke and it is a chirp, so fire_dept_text false"
      - "hidden: hardwired and interconnected alarms are not handyman work; the card must not suggest a battery swap"
      - "hidden: six linked alarms, 12 years old, vaulted ceiling changes scope and ladder needs"
      - "hidden: access through the grandson Saturday"
    expected:
      category: electrical
      job_type: smoke_alarm
      bank_job_type: "hardwired smoke alarm"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["six hardwired, interconnected smoke alarms", "chirp about once a minute from all", "about 12 years old", "nine foot hall ceilings, vaulted living room", "no smoke or fire", "owner cannot use a ladder", "grandson can give access Saturday"]
      must_not_be_on_card: ["change the batteries", "replace all six", "end of life", "any price", "any cause"]
      max_questions: 5
      notes: "An elderly person who mentions a ladder. Beeping alarms look like the fire-truck list but are not smoke or fire. The AI should stay patient, ask short single questions and not suggest she fix it herself."

  - id: electrical_s07
    kind: tenant
    persona: "man in his 20s, renter in a duplex, texts casually, no idea how the house is wired"
    opening_message: "hey so the outlets in my bedroom and bathroom stopped working yesterday. i rent the place, landlord said to find an electrician and send him the bill. can u do that"
    photo: "bedroom wall outlet with a lamp plugged in and the lamp off; small hallway panel not visible"
    hidden_facts:
      - "he rents half of a duplex built in the early 1970s"
      - "bedroom and bathroom outlets are dead; the lights in those rooms work"
      - "he reset a breaker in a closet panel once and nothing changed"
      - "the bathroom outlet has two buttons in the middle"
      - "the landlord is out of state and has told him by text that he is allowed to hire someone and the landlord will pay"
      - "he is home most evenings and the neighbor in the other half has the key to the panel closet"
      - "he does not know whether the panel is shared with the other half"
    homeowner_behavior: "casual, answers what is asked, forgets details until prompted; says 'the landlord said it's fine' without being asked for proof"
    traps:
      - "tenant: the card should say renter and landlord-authorized, with the landlord as payer, without making any legal claims"
      - "hidden: bathroom device with buttons and dead outlets together could be a tripped protective device; the card records it, never states it as the cause"
      - "hidden: shared panel with the other half of the duplex and access through the neighbor; changes scheduling"
      - "hidden: breaker reset once had no effect; must be on the card"
    expected:
      category: electrical
      job_type: partial_power
      bank_job_type: "outlet repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["renter in duplex", "landlord out of state, says tenant may hire and landlord will pay", "bedroom and bathroom outlets dead, lights work", "one breaker reset with no change", "duplex built early 1970s", "panel access through neighbor", "may share panel with other half"]
      must_not_be_on_card: ["tripped GFCI", "landlord is obligated", "tenant rights", "any price", "any cause"]
      max_questions: 6
      notes: "Tenant authority and payer must be on the card. The hidden bathroom device with buttons is a classic cause that the AI must not name. No legal advice about who must pay."

