      urgent: false
      must_be_on_card: ["lights in the whole house dim for about two seconds when electric dryer starts", "slight dimming when microwave runs", "no sparks, burning smell, smoke, buzzing or heat", "home built 1981, panel believed original", "dryer outlet added by an electrician last year", "owner has stopped using dryer"]
