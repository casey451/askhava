category: electrical
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: electrical_s01
    kind: vague
    persona: "man in his 50s, texting between jobs, says 'weird' and 'the power thing'"
    opening_message: "power is acting weird in the back of the house"
    photo: "none"
    hidden_facts:
      - "lights in the two back bedrooms dim for a second and come back, about once an hour"
      - "front of the house and the kitchen are normal"
      - "started about two weeks ago, after the monsoon storm"
      - "no buzzing, no hot spots, no burning smell, nothing sparks"
      - "house built in 1979, original panel in the garage"
      - "he has not touched the panel or reset anything"
    homeowner_behavior: "answers one thing per reply; says 'weird' instead of describing; gives a fact only when a question clearly calls for it; gets short after 5 questions"
    traps:
      - "hidden: it is only the back bedrooms, not the whole house; where it happens changes whether this is one circuit or the whole service"
      - "hidden: started after a storm; only said if asked when it began"
      - "the safety question must be asked in the fixed danger form (sparking, hot, buzzing, smoking) and he answers no, so no 911 text"
    expected:
      category: electrical
      job_type: flicker_dim
      bank_job_type: "breaker trips"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["lights dim and return in the two back bedrooms", "about once an hour", "front of house and kitchen normal", "began about two weeks ago, after a storm", "home built 1979", "no sparking, heat, buzzing or smoke"]
      must_not_be_on_card: ["any cause", "loose connection", "bad breaker", "utility problem", "any price", "safe to use"]
      max_questions: 5
      notes: "Vague opener could be flicker, partial power or a utility issue. The card needs where and how often, not a guess. The AI must not tell him to call the utility or check anything."

  - id: electrical_s02
    kind: wrong_terminology
    persona: "woman in her 40s, confident but uses the wrong words, writes in run-ons"
    opening_message: "the little reset button plug in my garage keeps popping out and wont stay in, i think the fuse is blown on it, need someone to put a new fuse in"
    photo: "outlet with two small buttons (test and reset) in the middle of the faceplate, reset button sitting out"
    hidden_facts:
      - "it is a GFCI outlet, not a fuse"
      - "it trips within a minute of her plugging in the chest freezer"
      - "the freezer is full of meat, so she wants it fixed the same day"
      - "the garage is detached, about 40 feet from the house"
      - "the outlet is on an outside wall and the garage door seal is old"
      - "she does not know whether other outlets in the garage go dead when it trips"
      - "home built in 1998"
    homeowner_behavior: "uses 'fuse', 'plug' and 'breaker' interchangeably; answers fully when asked; mentions the freezer only if asked what is plugged in"
    traps:
      - "terminology: she says fuse, but the photo and description show a GFCI outlet; the card records the device from the photo in plain words, not 'fuse'"
      - "hidden: the freezer is the load and has food in it; a business would want that flagged as time-sensitive"
      - "hidden: detached garage fed from the house changes the quote (feed, sub-panel); only said if asked how the garage gets its power or whether it has its own panel"
    expected:
      category: electrical
      job_type: breaker_tripping
      bank_job_type: "breaker trips"
      fire_dept_text: false
      urgent: true
      must_be_on_card: ["reset-style outlet in garage keeps popping out", "trips soon after freezer is plugged in", "freezer full of food", "detached garage", "home built 1998"]
      must_not_be_on_card: ["fuse", "freezer is bad", "overloaded", "any price", "any cause"]
      max_questions: 5
      notes: "She names the wrong part. The AI should write the symptom and the photo-visible device without correcting her in a lecturing way or adding a cause. The food-at-risk detail makes it urgent for businesses."

  - id: electrical_s03
    kind: wrong_self_diagnosis
    persona: "man in his 60s, handy, read a few forums"
    opening_message: "I need a new 20 amp breaker, the one for the kitchen keeps tripping. Have it replaced, I already know that is the problem"
    photo: "panel with the door open; one breaker in the off-middle position, a handwritten label reading 'kitchen'"
    hidden_facts:
      - "the breaker trips only when the microwave and the toaster oven run together"
      - "it has done this for about a year, getting more frequent in summer"
      - "the breaker feels slightly warm when he touches it after a trip"
      - "kitchen was remodeled by a previous owner, new outlets added along the counter"
      - "home built in 1986"
      - "a second kitchen breaker has never tripped"
    homeowner_behavior: "insists on his own diagnosis; answers factual questions correctly but steers back to 'just replace the breaker'; will say the warm breaker only if asked about heat"
    traps:
      - "wrong diagnosis: he wants breaker replacement; the card must record the symptom and what runs when it trips, not 'replace breaker'"
      - "hidden: warm breaker after a trip is a safety-adjacent fact a business would want, but it is not sparking or burning so no 911 text"
      - "hidden: previous owner's remodel means unknown wiring; only surfaces if asked who did the kitchen work"
    expected:
      category: electrical
      job_type: breaker_tripping
      bank_job_type: "breaker trips"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["kitchen breaker trips", "when microwave and toaster oven run together", "about a year, worse in summer", "breaker warm to touch after trip", "kitchen remodeled by previous owner", "home built 1986"]
      must_not_be_on_card: ["replace the breaker", "bad breaker", "overloaded circuit", "needs rewiring", "any price"]
      max_questions: 5
      notes: "A forum-informed homeowner dictates the fix. The AI must record his request as his words at most ('he asks for a new breaker') and keep the card to observable facts. Tests that 'warm' does not flip fire_dept_text."

  - id: electrical_s04
    kind: misleading_photo
    persona: "woman in her 30s, new homeowner, anxious, types fast"
    opening_message: "my outlet in the hallway looks burnt, I just bought the house and the inspector didnt say anything. pic attached. want it checked"
    photo: "outlet cover plate and outlet face with an even tan-yellow discoloration; no black marks around the slots, no melted plastic, a faint paint smear along one edge"
    hidden_facts:
      - "the discoloration looks like age and a paint smear; there is no black or brown scorch at the slots"
      - "the outlet works; she plugged a phone charger in this morning and it charged"
      - "it is not warm, makes no noise, nothing smells like burning"
      - "no sparks have ever been seen"
      - "house built in 1974"
      - "she would also like to know if the other outlets in the hall are the same type, but has not looked"
    homeowner_behavior: "worried; answers danger questions plainly when asked; escalates her word choice ('burnt') but gives the real details when asked one at a time"
    traps:
      - "misleading: she says burnt, the photo shows discoloration with no scorching; the card must say what is visible, not burnt and not fine"
      - "the danger question is answered no, so fire_dept_text is false despite the word 'burnt'"
      - "hidden: 1974 home may have older wiring; asking home age matters for the quote"
    expected:
      category: electrical
      job_type: outlet_switch
      bank_job_type: "outlet repair"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["hallway outlet with tan-yellow discoloration", "outlet works", "not warm, no noise, no burning smell, no sparks", "home built 1974", "owner asks for it to be checked"]
      must_not_be_on_card: ["burnt outlet", "safe", "unsafe", "fire hazard", "needs replacing", "any price"]
      max_questions: 5
      notes: "The text says burnt, the photo does not show scorching. The AI should rely on the answers to the danger question and the photo, not the word. Avoids a false 911 text and a false reassurance."

