category: pressure_washing
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: pressure_washing_s01
    kind: vague
    persona: "40s, busy, texts one line between meetings, says 'the outside'"
    opening_message: "house looks gross outside after the storms. can someone clean it up"
    photo: "none at first; if asked, a back corner of the house with tan dust streaks on the wall and a dusty concrete patio"
    hidden_facts:
      - "the dirt is on the stucco walls of a one-story home, about 2,000 sq ft"
      - "the back patio is also covered in dried mud"
      - "the owner mostly cares about the walls and would add the patio if the price is fair"
      - "white spots from the sprinklers on the north wall"
      - "outdoor faucet on the side of the garage works"
    homeowner_behavior: "answers one thing per reply; says 'the whole outside' if asked what needs washing; does not volunteer the patio or the white spots until asked about areas or stains"
    traps:
      - "hidden: sprinkler spots on one wall, only said if asked about stains"
      - "hidden: patio is a second area, only said if asked whether anything besides the walls needs washing"
    expected:
      category: pressure_washing
      job_type: house_wash
      bank_job_type: "house wash"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["stucco house walls", "one story", "about 2,000 sq ft", "white sprinkler marks on north wall", "back patio also wanted", "outdoor faucet works"]
      must_not_be_on_card: ["any price", "any cause of the stains", "any advice on method or pressure"]
      max_questions: 5
      notes: "Starts with almost nothing. The first question must be which area, not size. The card must capture both the walls and the patio as areas without guessing a job split."

  - id: pressure_washing_s02
    kind: wrong_terminology
    persona: "late 50s, practical, types fast with typos, wants a result not a process"
    opening_message: "need my cement sand blasted or steam cleaned out front, theres a big oil spot where the f150 sits for yrs. wanna get it totally gone"
    photo: "a two-car broom-finish concrete driveway; a dark stain about 3 ft by 5 ft near the garage door, lighter gray halo around it"
    hidden_facts:
      - "stain is from a leaking truck, parked in the same spot for about 8 years"
      - "driveway is plain concrete, about 2 cars wide, no coating or paint"
      - "owner already tried degreaser from the store and cat litter, the stain got lighter but not gone"
      - "a few orange rust-colored marks at the street end from the sprinklers"
      - "outdoor faucet is on the garage wall about 15 ft from the stain"
      - "owner firmly expects the stain to disappear completely"
    homeowner_behavior: "answers what is asked; repeats 'I want it gone' if the stain comes up; will not volunteer the old treatments unless asked whether anything has been tried"
    traps:
      - "wrong terminology: 'sand blasted or steam cleaned' means pressure washing plus stain treatment, not a different trade"
      - "hidden: stain is 8 years old and previously treated, which a strong estimator would ask about because it decides whether removal is likely"
      - "the card must not promise the stain comes out"
    expected:
      category: pressure_washing
      job_type: driveway_garage
      bank_job_type: "driveway"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["driveway, 2-car size, plain concrete", "oil stain about 3 by 5 ft, about 8 years old", "store degreaser already tried", "orange sprinkler marks at street end", "outdoor faucet works", "owner hopes the stain is removed"]
      must_not_be_on_card: ["promise the stain will come out", "any price", "sandblasting recommended", "steam cleaning recommended"]
      max_questions: 5
      notes: "Owner uses the wrong method words and has an unrealistic expectation. The card states the wish as the owner's hope in plain words and leaves the outcome to the business. Stain age and prior treatment are the hidden facts that change the quote."

  - id: pressure_washing_s03
    kind: misleading_photo
    persona: "late 30s, new to the house, friendly, sends one photo and thinks that is enough"
    opening_message: "hey! need a soft wash on our two story stucco house, it just looks dirty from the monsoon. sent a pic"
    photo: "wide photo of the front of a two-story stucco house in good light from the street; walls look evenly tan; the cracks and peeling paint are not visible at that distance"
    hidden_facts:
      - "two-story stucco home about 2,400 sq ft"
      - "south wall has many hairline cracks and a few wider cracks near the windows"
      - "paint on the south and west walls is chalky and peeling under the eaves"
      - "owner bought the house a year ago and does not know when it was last painted"
      - "garage-side faucet works"
      - "owner does not think the cracks matter and would say so if asked"
    homeowner_behavior: "answers the question asked; says 'it looks fine in the photo' if asked about cracks or paint; admits the peeling only when asked specifically about paint or cracks"
    traps:
      - "hidden: cracked stucco and old peeling paint, which change how a business would wash the house and whether they want to look first"
      - "misleading photo: the wide front shot hides the cracks and the peeling, so the card cannot rely on it alone"
      - "a close photo of the south wall under the eaves would show it"
    expected:
      category: pressure_washing
      job_type: house_wash
      bank_job_type: "house wash"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["stucco, 2 stories, about 2,400 sq ft", "hairline and wider cracks on south wall", "chalky and peeling paint on south and west walls under eaves", "faucet works"]
      must_not_be_on_card: ["any price", "advice to repaint first", "advice about pressure or method", "diagnosis of why the stucco cracked"]
      max_questions: 6
      notes: "The photo looks clean on purpose. A strong intake asks about wall material condition and paint, then asks for a close photo of the worst wall. Painting or stucco repair is not requested, so no routing, but the facts must reach the card for the business to price it or ask to visit."

  - id: pressure_washing_s04
    kind: elderly
    persona: "mid-70s, widowed, polite, texts slowly, has her grandson set up the phone, not sure how to send photos"
    opening_message: "Hello. I need someone to clean around my pool. The ground by the pool is dirty and green in spots. My grandson says to text this number"
    photo: "none offered; if she manages one: a pool deck with a tan textured coating, a few thin patches near the steps where the surface looks worn"
    hidden_facts:
      - "pool deck has a textured cool-deck style coating put on about 6 years ago"
      - "coating looks thin or worn near the pool steps and by the skimmer"
      - "green and black spots in the shade under a ramada"
      - "deck is about 400 sq ft by her guess; she does not know the term square feet"
      - "planters with flowers along one edge and a block wall with sprinkler heads behind it"
      - "outdoor faucet by the back door works"
      - "she is worried it will 'ruin the finish' but does not say so unless asked what she is concerned about"
    homeowner_behavior: "answers politely in full sentences; one answer per message; needs questions with simple choices; says 'I do not know how to do pictures' if photos are requested, then tries once"
    traps:
      - "hidden: cool-deck coating that can be damaged by a strong wash, only said if asked what the deck is made of or coated with"
      - "hidden: worn coating near steps, which a strong estimator would want to see in a close photo"
      - "plain-language questions and options only; no jargon like 'psi' or 'substrate'"
    expected:
      category: pressure_washing
      job_type: patio_pool_deck
      bank_job_type: "patio"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["pool deck with textured cool-deck style coating, about 6 years old", "worn thin spots near steps and skimmer", "green and black spots in shade", "about 400 sq ft by owner's estimate", "planters along one edge", "faucet works"]
      must_not_be_on_card: ["any price", "advice on how gently to wash", "warning that the coating will be damaged", "any cause for the green spots"]
      max_questions: 5
      notes: "Elderly owner who needs short plain questions. The coating is the key fact and must be on the card as a plain statement so businesses can decide for themselves. The AI must not warn or advise. Photo ask must be easy to decline."

  - id: pressure_washing_s05
    kind: two_trades
    persona: "mid-40s, DIY-minded, writes long run-on texts, has researched online and quotes what he read"
    opening_message: "ok so my paver patio is faded and has weeds in the joints, i want it pressure washed and then sealed so it looks new again, whoever does it should do both in one trip. about 12 yrs old"
    photo: "wide photo of a rectangular paver patio, gray-tan pavers, green growth in some joints, sandy gaps between pavers"
    hidden_facts:
      - "pavers are concrete pavers, about 12 years old, never sealed"
      - "patio is roughly 20 by 25 ft"
      - "joint sand is low and some pavers are slightly loose near the edge of the lawn"
      - "weeds and green growth in many joints"
      - "owner wants a wet-look or satin sealer, undecided"
      - "faucet on the back wall works"
    homeowner_behavior: "writes in run-ons; keeps saying 'both in one trip'; gives the size when asked; mentions the loose pavers only if asked whether anything looks sunken, loose or cracked"
    traps:
      - "refused job: sealing goes to painting (R-34); the card to pressure washing covers only the cleaning"
      - "the card must say plainly that the sealing is a separate request, not offer to find someone who does both"
      - "hidden: low joint sand and loose pavers, which affect a wash quote and might point to paver repair"
    expected:
      category: pressure_washing
      job_type: patio_pool_deck
      bank_job_type: "patio"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["paver patio, about 20 by 25 ft, about 12 years old, never sealed", "weeds and green growth in joints", "low joint sand, some loose pavers near lawn edge", "faucet works"]
      must_not_be_on_card: ["sealing as part of the washing request", "any price", "advice on sealer type", "promise that one business will do both"]
      max_questions: 5
      notes: "Two trades: pressure washing first for the wash, then a separate painting card for the sealing (refused job in this category). The AI tells the owner in one plain sentence that sealing is handled as its own request. Sealer choice is the owner's, not advice."

  - id: pressure_washing_s06
    kind: wrong_self_diagnosis
    persona: "early 60s, retired, confident, thinks he knows roofs, grumbles about 'moss'"
    opening_message: "moss is growing on my tile roof and its lifting the tiles. need the roof power washed to get it off before it gets worse"
    photo: "view of a two-story house roof from the driveway; concrete tiles with dark streaks on one slope; a row of solar panels on the south slope; one or two tiles look out of line near the ridge"
    hidden_facts:
      - "two-story home, concrete tile roof, about 2,800 sq ft"
      - "the dark streaks are on the north side only"
      - "no moss in Lake Havasu City; the owner has not looked up close and has never been on the roof"
      - "several tiles near the ridge are cracked or slipped, seen from the ground with binoculars"
      - "solar panels are on the south slope, owned, not leased"
      - "no leak inside the house that he knows of"
      - "faucet on the side yard works"
    homeowner_behavior: "states his theory first; asks 'can you do that?'; gives facts when asked directly; mentions the solar panels only when asked if anything is installed on the roof"
    traps:
      - "wrong self-diagnosis: moss lifting tiles; the card must record his words as his description, not as a finding"
      - "hidden: cracked or slipped tiles, which belong to a separate roofing card"
      - "hidden: solar panels on the roof, which affect a roof wash quote and safety"
      - "two stories and roof height change the quote and the likelihood of a site visit"
    expected:
      category: pressure_washing
      job_type: roof_wash
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["concrete tile roof, 2 stories, about 2,800 sq ft", "dark streaks on north slope", "owner says moss is lifting tiles", "several tiles near ridge look cracked or out of line, owner's view", "solar panels on south slope", "faucet works"]
      must_not_be_on_card: ["confirmation that it is moss", "confirmation that moss lifts tiles", "any price", "advice to fix tiles first", "advice about pressure"]
      max_questions: 6
      notes: "The categories row lists driveway, patio and house wash only, but the trade file has roof washing, so the card goes to pressure washing with no bank job type. Owner's diagnosis is wrong or at least unverified. The tile damage is a possible second card to roof repair, offered as a separate request, not assumed."

  - id: pressure_washing_s07
    kind: wrong_terminology
    persona: "30s, tech-savvy, types in lowercase, assumes pressure washing covers anything dirty"
    opening_message: "need pressure washing for my solar panels, they are covered in dust and my power is down. 12 panels on the roof"
    photo: "ground-level photo of a single-story roof with a block of 12 dusty panels; light tan film on the glass"
    hidden_facts:
      - "12 panels on a single-story tile roof"
      - "dust film from monsoon storms, not washed since install two years ago"
      - "production dropped about a quarter since last summer"
      - "no error light on the inverter, he has not checked the app"
      - "panels are owned, not leased"
      - "faucet on the side of the house works"
    homeowner_behavior: "cooperative; believes dust is the whole problem; answers panels, count and stories when asked; says 'I just want them washed' if the production drop is questioned"
    traps:
      - "wrong terminology: panel washing is not pressure washing and belongs to the gutters and solar cleaning trade"
      - "the card must not say anything about whether dust is the real cause of lost production"
      - "hidden: 25 percent production drop, which a business might want to know but the AI must not diagnose"
    expected:
      category: gutters
      job_type: solar_wash
      bank_job_type: null
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["solar panel washing, 12 panels", "single-story tile roof", "not washed in 2 years", "production down about a quarter, owner's note", "faucet works"]
      must_not_be_on_card: ["pressure washer", "any price", "diagnosis that dust causes the drop", "advice to check the inverter"]
      max_questions: 4
      notes: "Right answer is a different category: gutters (kb gutter_solar_cleaning, job type solar_wash). Solar washing is not on the gutters row of categories.yaml, so there is no bank job type; routing is by the trade file."

