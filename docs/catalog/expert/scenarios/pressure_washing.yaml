    hidden_facts:
      - "tenant, not the owner; landlord told him by text to get it cleaned before move-out"
      - "two-car garage with a bare concrete floor, stain under the old car spot"
      - "smaller stain on the driveway just outside"
      - "landlord has not said who pays or who the business should talk to"
      - "lease ends in about 3 weeks; he would like it done within 2 weeks"
      - "the outdoor faucet is on the garage wall and works"
      - "landlord's property manager lives out of town and has not given permission for a business to enter"
    homeowner_behavior: "asks for a price; accepts that nothing can be quoted by the assistant; answers who is paying only when asked; says 'I think my landlord would be fine with it' if asked about permission"
    traps:
      - "tenant, not owner: the card must record that he is a tenant and that approval from the owner or manager is a loose end"
      - "hidden: deadline of 3 weeks, so timing matters"
      - "the AI must not give a price when asked 'how much'"
    expected:
      category: pressure_washing
      job_type: driveway_garage
      bank_job_type: "driveway"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["renter, landlord asked for cleaning before move-out", "two-car garage floor oil stain about 4 ft", "small driveway stain about 2 ft", "wants done within 2 weeks, lease ends in 3", "outdoor faucet works", "property manager's permission not yet confirmed"]
      must_not_be_on_card: ["any price", "who pays the cost", "advice about the deposit or lease"]
      max_questions: 5
      notes: "Tenant asks 'how much' on the first message; the AI says it does not price and moves on. Timing and permission are the card facts. No legal advice about deposits."

