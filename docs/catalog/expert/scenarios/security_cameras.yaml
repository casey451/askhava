      job_type: cameras
      bank_job_type: "camera install"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["3 outdoor plug-in cameras about 4 years old", "all three offline since last Thursday", "internet modem and router were replaced the day before", "has not checked the cameras in person", "wants work done before leaving on the 8th"]
      must_not_be_on_card: ["burnt out", "heat damage", "router is the problem", "need replacing", "any price", "any cause"]
      max_questions: 5
      notes: "She asks for new cameras but the facts point to a network change, not dead hardware. The AI must not agree that they are burnt out and must not say it is the router. It records both the symptom and the router swap so a business can decide. Hard because she volunteers a confident cause and a deadline, and the real clue only shows if asked what changed."

