    hidden_facts:
      - "three battery-free plug-in outdoor cameras, about 4 years old, same brand"
      - "all three went offline the same afternoon, last Thursday"
      - "the internet provider swapped her modem and router the day before"
      - "she did not set the new router up with the old network name; her husband handled it and he is away until next week"
      - "the cameras are under eaves, shaded, one on a west wall"
      - "she has not looked at the cameras themselves, just the app"
      - "leaving for two weeks on the 8th"
    homeowner_behavior: "confident about her diagnosis; answers fully but only the question asked; mentions the provider swap only if asked about anything that changed at the house or internet recently"
    traps:
      - "her diagnosis (burnt out from heat) is wrong or unproven; all three offline at once right after a router swap points elsewhere; the card records the symptom and the timing, not her cause"
      - "hidden: modem and router replaced the day before; only said if asked what changed recently or about the internet"
      - "hidden: she has not checked the cameras in person"
      - "timing: trip on the 8th is a real deadline a business needs"
