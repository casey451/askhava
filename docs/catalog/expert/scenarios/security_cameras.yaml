  - id: security_cameras_s01
    kind: vague
    persona: "man in his 30s, new homeowner, texts in short lowercase lines, never says the word camera"
    opening_message: "want to see who comes to my door when im not home"
    photo: "front entry under a covered porch, stucco wall beside the door, no button or chime box visible anywhere on the wall"
    hidden_facts:
      - "wants a video doorbell at the front door"
      - "there has never been a doorbell at this house; no button, no chime inside, no doorbell wires he knows of"
      - "stucco wall beside the front door, covered entry"
      - "Wi-Fi router is at the back of the house; phone signal at the front door is weak"
      - "he has not bought a unit yet"
      - "house built in 2006, single story"
      - "he is fine with a battery model if that works, does not care which"
      - "wants it done within a couple weeks, no rush"
    homeowner_behavior: "answers one thing per reply; says 'doorbell thing' or 'door cam'; gives a fact only when a question clearly calls for it; gets short after 4 questions"
    traps:
      - "hidden: no existing doorbell wiring at all; this decides battery unit versus new wiring, and only comes out if asked whether there is a doorbell or wires there now"
      - "hidden: weak Wi-Fi at the front door; only said if asked about Wi-Fi at the door"
      - "hidden: stucco wall; only said if asked what the wall is made of"
      - "he has not bought a unit; the card should say business supplies or he buys, not assume"
    expected:
      category: security_cameras
      job_type: cameras
      bank_job_type: "doorbell camera"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["video doorbell at the front door", "no existing doorbell, button or wiring", "stucco wall, covered entry", "Wi-Fi weak at the front door, router at the back", "does not have a unit yet", "open to a battery model"]
      must_not_be_on_card: ["any price", "any cause", "needs an electrician", "wired is better", "recommended brand"]
      max_questions: 5
      notes: "Vague opener never names the product. The point is to find out there is no doorbell wiring and the Wi-Fi is weak at the door. The AI must not steer him to battery or wired; it records the facts. A battery unit on stucco can be small handyman work, a wired new run is not."

