      - "the whole conversation and the card text she sees must stay in Spanish; the card for businesses is in English"
      - "hidden: west-side rooms are the hottest, only said if asked which rooms"
    expected:
      category: solar_screens
      job_type: screens
      bank_job_type: "solar screens"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["solar screens, about 11 windows plus one patio slider", "one story stucco, built about 2001", "2 front windows have security bars on the outside", "hottest rooms on the west side", "dark color, no HOA", "available Saturdays", "Spanish speaker"]
      must_not_be_on_card: ["any price", "a made-up range", "a recommended color"]
      max_questions: 5
