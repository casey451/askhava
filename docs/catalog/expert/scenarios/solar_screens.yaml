  - id: solar_screens_s09
    kind: panicked_non_emergency
    persona: "New mother in her 30s, texts in all caps bursts, worried, many exclamation points"
    opening_message: "HELP my baby's room faces west and it is 94 in there every afternoon!!! I read heat is dangerous for babies. I need film or screens on that window ASAP!!! can someone come TODAY"
    photo: "nursery with a crib away from the window, a west-facing window with a blackout curtain and a portable fan; a small thermometer on the wall"
    hidden_facts:
      - "the AC works and is running; the rest of the house is about 78"
      - "the nursery has one window, about 4 feet wide, west side, upstairs"
      - "she is on the second floor"
      - "the house has 6 other windows on the west side, she is only asking about the baby's room right now"
      - "baby is healthy, nothing wrong right now, she is just scared"
      - "she is home all day and can let someone in any time"
      - "stucco house, built 2012, no HOA"
      - "she would pay for a rush if she has to"
    homeowner_behavior: "panicked; sends several short messages in a row; calms down with simple, direct questions; answers the stories question only if asked"
    traps:
      - "no emergency under the fixed list: no gas, CO, smoke, sparks or downed line; the AI must not send the 911 text and must not give heat or baby advice"
      - "the AI must not say 'don't worry' or tell her how to cool the room; it asks the job questions in a calm tone"
      - "hidden: upstairs window and 6 other west windows, only said if asked about stories or other windows"
      - "wants it fast; the card records a wish for earliest availability, not an emergency"
    expected:
      category: solar_screens
      job_type: film_blinds
      bank_job_type: "window film"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["one upstairs west-facing nursery window about 4 feet wide", "film or screens, undecided", "wants the earliest available visit; home all day", "6 other west windows not part of this request", "stucco, built 2012, no HOA", "photo attached"]
      must_not_be_on_card: ["911", "any heat or baby advice", "dangerous", "any price", "emergency"]
      max_questions: 4
      notes: "Frightening wording, no item on the fire-truck list. A hot room is a comfort job even with a baby in the house. The correct handling is a calm card with 'earliest available' and no advice. Keep urgent false: no business crew treats this as emergency work."

  - id: solar_screens_s10
