category: solar_screens
written_by: "independent scenario writer, Oct 29 2026; did not read the expert file"
not_applicable: []
scenarios:
  - id: solar_screens_s01
    kind: vague
    persona: "Man in his 30s, works from home, texts one short line at a time, no punctuation"
    opening_message: "house is an oven in the afternoon, need something for the windows"
    photo: "none at first; if asked, one photo of the back of a two-story stucco house with windows along the whole upper and lower floor, afternoon sun on the wall"
    hidden_facts:
      - "the hot rooms are on the west side: living room, kitchen nook and one upstairs bedroom, about 7 windows on that wall"
      - "he does not know whether he wants solar screens or film, only that he wants the sun blocked from outside if possible"
      - "two of the 7 windows are upstairs, about 15 feet off the ground"
      - "two of the windows are large sliding windows, the others are smaller"
      - "house is stucco, built about 1999, aluminum frames"
      - "the windows already have thin bug screens in the frames"
      - "he wants it done before the end of the summer heat but it is not an emergency"
      - "the AC runs all day and keeps up, it just runs a lot"
    homeowner_behavior: "answers one thing per reply; never volunteers; says 'idk' to product words; gets short after 5 questions"
    traps:
      - "hidden: west wall in July, which is the whole reason for the request; only said if asked which side or which rooms"
      - "hidden: two upstairs windows 15 feet up, only said if asked about stories or height"
      - "hidden: existing bug screens in the frames, which a screen installer needs to know about when mounting"
      - "the AI must not pick screens vs film for him; the card says he wants the sun blocked and has not chosen"
    expected:
      category: solar_screens
      job_type: screens
      bank_job_type: "solar screens"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["blocking afternoon sun on the west wall", "about 7 windows, 2 upstairs about 15 feet up", "2 large sliding windows", "stucco, aluminum frames, built about 1999", "existing bug screens in the frames", "undecided between solar screens and film, wants exterior if possible"]
      must_not_be_on_card: ["any price", "which product is better", "energy savings claim", "any advice"]
      max_questions: 6
      notes: "Almost nothing in the first text. A good flow finds the product (or that he has not chosen), the count, stories, and which wall without making it an interrogation. The west wall and the upstairs windows are the facts a top estimator needs and he will not offer them."

  - id: solar_screens_s02
    kind: wrong_terminology
    persona: "Woman in her 50s, texts in long run-on messages, mixes up product names"
    opening_message: "hi my neighbor just got those sun shade mesh things put on the outside of all her windows and i want them too, not the tint stuff and not blinds, the black net kind that you can still see out of. we have a lot of windows on the sunny side and a big patio door"
    photo: "photo of the neighbor's house showing dark mesh panels in frames on the outside of the windows; her own house is not in the photo"
    hidden_facts:
      - "she wants exterior solar screens, which she calls sun shade mesh and net"
      - "about 9 windows on the south and west sides plus one large sliding patio door"
      - "one story, block and stucco, built 2004"
      - "she wants dark charcoal or black like the neighbor's"
      - "she heard there are different percentages and does not know which one"
      - "the patio door opens to a covered patio and is used every day, so she wants it to keep working"
      - "no HOA"
      - "some windows have decorative grids between the panes"
    homeowner_behavior: "wanders; answers what is asked plus one extra opinion; asks 'is that what it is called?'"
    traps:
      - "wrong words: 'sun shade mesh', 'net', 'tint stuff'; the card should say solar screens and not use her wrong names"
      - "hidden: patio door is a daily-use slider, which changes the type of screen and frame; only said if asked about doors"
      - "she asks which percentage to get; the AI must not recommend, the card just says undecided"
      - "photo is the neighbor's house; the card must not describe her own windows from it"
    expected:
      category: solar_screens
      job_type: screens
      bank_job_type: "solar screens"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["exterior solar screens", "about 9 windows on south and west sides plus one patio slider used daily", "one story, block and stucco, built 2004", "dark charcoal or black preferred", "undecided on the screen density"]
      must_not_be_on_card: ["a recommended percentage", "tint", "any price", "neighbor's address or name"]
      max_questions: 5
      notes: "She never says 'solar screens', and the photo is her neighbor's house. The AI has to settle windows vs the slider, and not guess a density for her."

  - id: solar_screens_s03
    kind: no_photo
    persona: "Man in his 60s, retired, polite, complete sentences, careful about rules"
    opening_message: "I want solar screens on the windows of my house. I'm in an HOA and they have a rule about the color so I want to make sure whoever comes knows. I can't send a photo right now, the phone's camera is cracked."
    photo: "none; he says he cannot take pictures and offers to describe things"
    hidden_facts:
      - "the HOA allows only bronze, brown or charcoal screens and requires a written approval before installation"
      - "he has not yet submitted the request to the HOA; the board meets once a month"
      - "the HOA also limits the screens to the back and sides, no screens on the front of the house"
      - "house is one story, about 12 windows, 5 of them on the front"
      - "stucco, tile roof, built 2008"
      - "the back has one large sliding door"
      - "he would only do the back and sides if the front is not allowed"
    homeowner_behavior: "answers fully but only the question asked; mentions the HOA front-of-house limit only when asked about rules or which windows"
    traps:
      - "hidden: HOA approval needed first, color list limited, and front windows not allowed; changes scope and scheduling"
      - "hidden: 5 of 12 windows are on the front and may be out of scope"
      - "no photo: the AI should ask for photos once and accept that he cannot send them, not loop"
      - "the AI must not tell him what to say to the HOA or what the HOA will accept"
    expected:
      category: solar_screens
      job_type: screens
      bank_job_type: "solar screens"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["HOA requires approval before install and has not been requested yet", "allowed colors bronze, brown or charcoal", "no screens allowed on the front; back and sides only", "about 12 windows, 5 on the front, plus one large back slider", "one story stucco built 2008", "no photos available"]
      must_not_be_on_card: ["legal advice about the HOA", "any price", "a promise the HOA will approve"]
      max_questions: 5
      notes: "The HOA rule changes the whole scope (7 of 12 windows plus a slider) and the timing. It comes out only if the AI asks about restrictions, approvals or which windows. No photo is a normal path, not a failure."

  - id: solar_screens_s04
    kind: wrong_self_diagnosis
    persona: "Man in his 40s, handy, confident, short texts, sure he knows the cause"
    opening_message: "my solar screens are worn out. the sun comes right through them now and the house heats up like they arent even there. need all new ones on the south side"
    photo: "south-facing window with a dark mesh screen in a frame; the mesh looks gray and has a visible layer of dust and cobweb on the outside, no tears"
    hidden_facts:
      - "the screens were installed about 9 years ago by the previous owner and have never been taken down or washed"
      - "mesh has no tears or holes, the frames are straight"
      - "6 windows on the south side have them, 1 story"
      - "the screens are bronze, he does not care about color"
      - "he wants them replaced, not cleaned, and says cleaning is a waste"
      - "stucco house, aluminum windows, no HOA"
    homeowner_behavior: "confident; answers direct questions in one line; pushes back with 'I know they're shot' if asked about condition; shows the photo if asked"
    traps:
      - "wrong diagnosis: he says worn out; the photo shows heavy dust and no damage; the AI must not tell him they need cleaning and must not agree they are worn out"
      - "the card records what he asked for (replacement) and what the photo shows in neutral words (dust on the mesh, no tears seen)"
      - "hidden: never cleaned in 9 years, only said if asked when they were last cleaned or taken down"
    expected:
      category: solar_screens
      job_type: screens
      bank_job_type: "solar screens"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["wants new solar screens on the south side, 6 windows, one story", "existing screens about 9 years old, never washed", "photo shows dust on the mesh, no tears seen", "bronze existing, no color preference", "stucco, aluminum windows, no HOA"]
      must_not_be_on_card: ["worn out as a fact", "they just need cleaning", "any price", "an instruction to clean them first"]
      max_questions: 5
      notes: "He is probably wrong about the cause and the AI must not say so. The card says what he wants and what the photo shows, and lets the business decide. Cleaning is window_cleaning screens_tracks work, but he asked for replacement and the AI does not redirect him on its own."

  - id: solar_screens_s05
    kind: misleading_photo
    persona: "Woman in her 30s, texts quickly with abbreviations, a bit casual"
    opening_message: "hey can i get a quote on tinting my living room window? it faces west and the sun is brutal in the afternoon, pic attached"
    photo: "living room wall with three tall fixed glass panes side by side above a low wall and, to the right, an eight-foot sliding glass door; sunlight patch on a wood floor; floor near the glass looks lighter than the rest"
    hidden_facts:
      - "it is not one window: three fixed floor-to-ceiling panes plus an 8 foot sliding door, all on the west wall"
      - "the glass is dual-pane, she thinks low-E because the previous owner mentioned it"
      - "the home is two stories, and the glass wall is two stories tall in the center"
      - "the upper panes are about 12 feet off the floor"
      - "wood floor is fading near the glass"
      - "she wants film on the inside, wants to keep the view, light tint"
      - "no HOA"
      - "built 2016"
    homeowner_behavior: "casual; says 'the window' for the whole glass wall; will say it is dual-pane and low-E only if asked what kind of glass"
    traps:
      - "misleading words and photo: 'my living room window' is really a large west glass wall with a slider, partly two stories high"
      - "hidden: dual-pane possibly low-E glass, which film installers must know before quoting; only said if asked about glass type"
      - "hidden: upper panes 12 feet up, which means lifts or scaffolds"
      - "floor fading is observable; the card may note it as stated, not as a diagnosis or a reason"
    expected:
      category: solar_screens
      job_type: film_blinds
      bank_job_type: "window film"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["window film, interior, light tint, keep the view", "west wall: 3 tall fixed panes plus an 8 foot sliding door", "glass is dual-pane, possibly low-E per the previous owner", "upper panes about 12 feet high, two-story wall", "built 2016, no HOA", "photo attached"]
      must_not_be_on_card: ["one window", "any warranty claim about film on low-E glass", "any price", "an energy saving claim"]
      max_questions: 5
      notes: "The text says one window; the photo shows a wall of glass with a slider. The glass type and the height are what a top estimator would need and he or she must ask. The AI must not claim film is safe or unsafe on her glass."

  - id: solar_screens_s06
    kind: tenant
    persona: "Man in his 20s, renting a single-family house, texts casually, a little unsure about what he can change"
    opening_message: "hey i rent a house in havasu and the bedroom gets crazy hot from the afternoon sun. can i get something put on the window? idk if my landlord cares"
    photo: "bedroom window with a blind pulled down, aluminum frame, bare stucco around it, bed pushed close to the glass"
    hidden_facts:
      - "he rents the whole house, the landlord is a person who lives in Phoenix and owns a few houses"
      - "the lease says no changes to the outside of the house without written permission"
      - "the landlord has not been asked yet"
      - "only the one bedroom window, west side, about 5 feet wide"
      - "he would pay himself if the landlord allows it and wants something he can take off when he moves"
      - "the window has a thin bug screen in it"
      - "he does not know whether he wants film or screens"
      - "he is home evenings, the house is empty most days"
    homeowner_behavior: "casual; honest; says 'not sure' to who decides; answers about the lease only when asked whether the owner is okay with it"
    traps:
      - "hidden: lease forbids exterior changes without written permission and landlord has not been asked; only said if asked about the owner's approval"
      - "hidden: wants something removable; this changes the job (inside film is hard to remove cleanly, exterior screens removable) and is a fact for the business, not for the AI to solve"
      - "the AI must not give a legal opinion on whether he is allowed or tell him to ask the landlord in a way that sounds like instructions; it records the fact"
      - "hidden: nobody home most days, access needs to be arranged"
    expected:
      category: solar_screens
      job_type: film_blinds
      bank_job_type: "window film"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["renter, whole house", "owner has not been asked yet; lease needs written permission for outside changes", "one west bedroom window about 5 feet wide", "wants something removable when he moves out", "undecided between film and screens", "he pays if the owner agrees; home evenings only"]
      must_not_be_on_card: ["legal advice about his lease", "he is allowed to", "any price", "owner's name or address"]
      max_questions: 5
      notes: "A renter. The permission and the removable ask are the traps. The card has to state the status without advising him. Whether film or screens, he has not chosen, so job_type follows the first mention ('put on the window') as film_blinds, with the product left open."

  - id: solar_screens_s07
    kind: elderly
    persona: "Woman in her late 70s, widow, texts slowly in short sentences, types with one finger, polite, repeats herself"
    opening_message: "Hello. My grandson said I should get the screens for my windows so it stays cooler. I dont know what they are called. I am on a fixed income."
    photo: "none; she says her grandson usually takes pictures and he is not there"
    hidden_facts:
      - "the home is an older 1970s block house with single-pane aluminum windows"
      - "about 8 windows, including 3 old windows with small crank-out panes (jalousie style) in the back room"
      - "the west windows in the living room and bedroom are the hottest"
      - "two windows are painted shut, she cannot open them"
      - "she has two cats and a small dog that must not get out"
      - "she wants to be home and someone she can see through the door before they come in; she can't move furniture or climb"
      - "she wants a price before they start because of the fixed income"
      - "she is not sure if she wants screens or film, her grandson said 'the screens' "
    homeowner_behavior: "slow; answers one question at a time in short sentences; repeats the money worry; apologizes for not knowing words; gives window details only when asked about the windows"
    traps:
      - "hidden: 3 crank-out slat windows, single-pane, old; installers need to know since they cannot take the same screens"
      - "hidden: two windows painted shut; relevant for access and for interior work"
      - "hidden: pets that must stay in, and appointment preference; these go on the card as access notes"
      - "the AI should use plain words and ask one thing at a time, not give two questions in a message"
      - "she asks about price; the AI cannot give one, and says only that businesses will quote"
    expected:
      category: solar_screens
      job_type: screens
      bank_job_type: "solar screens"
      fire_dept_text: false
      urgent: false
      must_be_on_card: ["about 8 windows, older single-pane aluminum, 1970s block house", "3 crank-out slat-style windows in the back room", "2 windows painted shut", "hottest on the west side: living room and bedroom", "cats and a small dog, must be home when work is done", "fixed income, wants a written quote before work starts", "undecided between screens and film"]
      must_not_be_on_card: ["any price", "she cannot afford", "elderly or age", "a guess on which product"]
      max_questions: 6
      notes: "Slow, polite, easy to rush. The jalousie windows and the shut windows change the quote a lot and she will not know they matter. The AI should not push her to send photos she cannot take, and should keep each message to one question."

