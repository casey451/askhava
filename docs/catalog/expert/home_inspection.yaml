business_side:
  how_they_get_customers: ["Real estate agent referrals (the largest single source)", "Google Business Profile and reviews", "Paid search and Local Services Ads", "Repeat agents and past clients", "Lead marketplaces that sell the same request to several inspectors"]
  customer_acquisition_benchmarks:
    - channel: "Home inspection, all tracked channels (one marketing agency's clients)"
      figure: "About $40 per lead on average; paid ads were 49% of tracked leads and Google Business Profile 26%, Jan to Jul 2026. Marketing-vendor figure; the agency says its mix skews to ads"
      source: wolfpack_leads
      unverified: false
    - channel: "Angi and similar shared-request marketplaces (home inspection)"
      figure: "Same request sold to several inspectors; no reliable per-request price found"
      source: null
      unverified: true
    - channel: "Lake Havasu City home inspectors specifically"
      figure: "No local figures found; agent referral share likely higher in a small market"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["The same request sold to three or more inspectors", "Price shoppers who book whoever is cheapest", "Monthly fees with no bookings", "Programs that look like pay-to-play with agents, which the Board bars", "Requests with no size, year or deadline"]
  what_makes_a_lead_worth_paying_for: ["Size, year, pool and other buildings stated, so the price is firm", "The contract or lender deadline stated", "Access and utilities stated", "No fee on sale and loan inspections", "The homeowner picked them from every quote"]
  their_words: ["inspection period", "BINSR", "WDIIR", "pre-listing", "11-month", "sewer scope", "add-on", "report turnaround", "agreement", "repair request", "walk-through", "lockbox"]
  signup_objections:
    - objection: "What does it cost me?"
      answer: "Buyer, pre-listing, refinance and termite-report cards carry no introduction fee. A home condition check with no sale or loan has a set fee by job size, $25, $75 or $199, paid only if the homeowner picks your quote. Nothing to join, nothing monthly."
    - objection: "Is this a pay-to-play program? The Board bars those."
      answer: "Ask Hava is not a real estate company. Cards tied to a sale, purchase, refinance or termite report carry no fee at all, and nobody pays for placement or ranking."
    - objection: "Agents send me my work. Why would I need this?"
      answer: "Keep your agents. These are homeowners who texted us directly, including owners who aren't in a sale. You quote only the cards you want."
    - objection: "Can I take the termite-report cards?"
      answer: "Only if your business also holds a pest-management license with an applicator certified for wood-destroying organisms. Arizona lets only that applicator sign the report. Leave that job type off otherwise."
    - objection: "Will you send me repair work from homes I inspect?"
      answer: "You pick your job types. An inspection card asks only for an inspection price, never for repairs."
    - objection: "I can't quote without seeing the house."
      answer: "Most cards give size, year built, pool, other buildings, access and the deadline, which is what you'd ask on the phone. Quote a firm price and say what would change it on site."
    - objection: "Will you rank me against other inspectors?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, Board certificate number and review links. Ask Hava never sorts or scores a business."
    - objection: "What if the deal falls through after I'm picked?"
      answer: "On a fee-free card there is nothing to refund. On a fee card, if the homeowner cancels before you have spoken, the fee is refunded."
    - objection: "I need my agreement signed before I inspect."
      answer: "That stays between you and the homeowner. After the pick you get her contact details and send your agreement as you do now."
  quote_tips_for_card: ["Give one firm price and list what it covers: pool and spa, other buildings, termite report", "Say how soon the report arrives after the inspection", "Give your earliest date, since many buyers have about 10 days", "Say what would change the price on site, like a casita not on the card", "If your business holds a pest license for termite reports, say so in the quote"]
