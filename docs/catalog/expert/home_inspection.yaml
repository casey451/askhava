# Ask Hava expert layer: home_inspection (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set home_inspection and trade_kb/trades/home_inspection.yaml. Fake data only.
# Ask Hava never diagnoses, predicts what an inspection will find, prices, judges safety or recommends a business;
# every string here keeps that.
#
# NOTES FOR REVIEW
# 1. Termite report (kb wdiir) stays mapped to "termite report for a sale or loan" in this category, as the
#    catalog says. But under A.A.C. R3-8-307(A) and A.R.S. 3-3633 only an applicator certified in the
#    wood-destroying organism category, employed by a pest-management business licensee, may complete a WDIIR.
#    A Board-certified home inspector may not be able to sign one. Unless the inspector's firm also holds a pest
#    license, a wdiir card sent to home inspectors only may reach nobody who can do it. pest_control.yaml raises
#    the same problem (its note 1). Needs a catalog decision, for example: send fee-free termite-report cards to
#    pest licensees who attest to the wood-destroying organism category, or add a fee-free "termite report for a
#    sale or loan" job type in pest_control. Routing it to pest_control "termites" today would charge an
#    introduction fee on a sale or loan report, which the fee-free rule (FEE-045, D-403) exists to avoid, so this
#    file routes only treatment requests there (misdiagnosis checks).
# 2. Two new job types, because the kb has no match: refinance_inspection (category job type "refinance
#    inspection") and condition_check ("home condition inspection (no sale or refinance)"). The independent
#    scenario file (scenarios/home_inspection.yaml s07, s08, s15) expects job_type buyer_inspection with bank job
#    type "home condition inspection"; under this file those requests are condition_check. The scenario's
#    bank_job_type is unchanged.
# 3. manufactured_home and addons map to "buyer inspection" (the usual case, and what the scenarios expect). A
#    manufactured-home or pool add-on request with the bank sale question answered "No" is a home condition
#    inspection and must not be fee-free. Suggest routing code pick the bank job type from the sale answer, not
#    from the kb job type alone.
# 4. The question set's only photo ask is p1 ("listing photos are enough"). For a home not on the market there are
#    no listing photos; the card is still complete without photos.
# 5. A.A.C. R4-30-301.01(C)(3) bars an inspector from repairs on a home their firm inspected for 24 months.
#    Ask Hava cannot know which homes an inspector inspected. Open question whether sign-up should remind an
#    inspector who also holds a trade license.
# 6. Septic transfer-of-ownership inspections (A.A.C. R18-9-A316) are seller-arranged and done by other licensees;
#    they route to septic_pumping "tank inspection", which is not fee-free. Same fee-free question as note 1.
