trade_brief:
  price_drivers:
    - driver: "Square footage of the main home"
      why: "Inspection time scales with size, and most inspectors price in size bands; the bank's home_size question sets the band. [judgment]"
      source: null
    - driver: "Pool or spa on the property"
      why: "A pool and spa check is optional for a home inspector and follows a separate Board pool and spa standard, so it is priced as an add-on."
      source: aac_r4_30_301_01
    - driver: "Buildings beyond the house and its garage or carport (casita, guest house, shop, shed)"
      why: "The Board standard covers the home with its garage or carport and excludes other outbuildings, so each one is extra scope."
      source: btr_sop
    - driver: "Add-ons other licensees do: termite report, septic transfer inspection, sewer camera"
      why: "A termite report needs a pest-licensed WDO applicator and a septic transfer inspection a qualified septic inspector, so the inspector subs it out or the homeowner books it separately."
      source: aac_r3_8_307
    - driver: "How soon it must be done (contract or lender deadline)"
      why: "The standard Arizona resale contract gives the buyer 10 days to inspect, so rush and weekend slots are common and some inspectors charge for them."
      source: aar_contract
    - driver: "Age of the home"
      why: "Older homes take longer: more past repairs, older wiring and plumbing to describe. [judgment]"
      source: null
    - driver: "Manufactured home versus site-built, and crawl space entry"
      why: "Under-floor entry and skirting access change the time on site; some inspectors price manufactured homes separately. [judgment]"
      source: null
    - driver: "Utilities on or off at a vacant home"
      why: "The inspector does not operate shut-down systems, so a home with water, gas or power off can mean a second trip."
      source: btr_sop
  hidden_conditions:
    - condition: "Water, gas or power off at a vacant, bank-owned or seasonal home"
      how_a_pro_spots_it: "Owner is away, listing says vacant, or the homeowner mentions a winterized or shut-down home"
      question_or_photo: fu_utilities_on
      source: btr_sop
    - condition: "Casita, guest house or room addition not counted in the stated square feet"
      how_a_pro_spots_it: "Listing photo shows a second building or a long low wing; homeowner gives only the main-home size"
      question_or_photo: p1
      source: btr_sop
    - condition: "Pool and spa equipment beyond a basic pump and filter (gas heater, salt cell, raised spa with spillway)"
      how_a_pro_spots_it: "Equipment pad in the listing photo; the bank's extras answer"
      question_or_photo: extras
      source: aac_r4_30_301_01
    - condition: "Home on a septic tank instead of city sewer"
      how_a_pro_spots_it: "Lot outside city sewer areas; homeowner or listing mentions septic"
      question_or_photo: fu_septic_or_sewer
      source: aac_r18_9_a316
    - condition: "Attic or crawl space opening blocked or too small to enter"
      how_a_pro_spots_it: "Older manufactured home with low skirting, stored items in the garage under the attic hatch; found on site"
      question_or_photo: null
      source: btr_sop
    - condition: "Requester is a tenant and the owner has not agreed, or nobody can open the home"
      how_a_pro_spots_it: "Words like landlord, rent or lease; owner out of state"
      question_or_photo: fu_owner_ok
      source: null
    - condition: "Wood touching the house (patio cover, pergola, wood pile) that a termite report must list"
      how_a_pro_spots_it: "Listing photo of the back yard; homeowner mentions a patio cover or pergola"
      question_or_photo: fu_other_structures
      source: aac_r3_8_307
  misdiagnosis_checks:
    - sounds_like: "termite report for a sale or loan (homeowner says spray, treat or clearance)"
      might_be: "termites treatment in pest_control"
      one_question: fu_report_or_treatment
      if_other_route_to: {category: pest_control, job_type: "termites"}
      source: aac_r3_8_307
    - sounds_like: "home condition inspection (mud tubes or wood damage, not selling)"
      might_be: "termites treatment in pest_control"
      one_question: fu_report_or_treatment
      if_other_route_to: {category: pest_control, job_type: "termites"}
      source: null
    - sounds_like: "home condition inspection (one problem: roof leak or ceiling stain)"
      might_be: "roof leak repair; an inspection is a visual report, not a repair"
      one_question: fu_what_for
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: btr_sop
    - sounds_like: "home condition inspection (drains backing up, wants the sewer line looked at)"
      might_be: "drain clearing in plumbing_repair"
      one_question: fu_what_for
      if_other_route_to: {category: plumbing_repair, job_type: "drain clearing"}
      source: null
    - sounds_like: "buyer inspection add-on (septic inspection for the sale)"
      might_be: "septic transfer of ownership inspection, a different licensee"
      one_question: fu_septic_or_sewer
      if_other_route_to: {category: septic_pumping, job_type: "tank inspection"}
      source: aac_r18_9_a316
    - sounds_like: "manufactured home buyer inspection (lender wants a foundation certification)"
      might_be: "an engineer's foundation letter, which no Ask Hava category covers; the card states it as the lender's requirement only"
      one_question: fu_lender_extras
      if_other_route_to: null
      source: null
    - sounds_like: "home condition inspection (floor slopes, wants a cause confirmed)"
      might_be: "an engineer's evaluation, which no Ask Hava category covers; the card lists what she sees"
      one_question: fu_what_for
      if_other_route_to: null
      source: btr_sop
  photo_reading:
    - photo_id: p1
      reads: ["One or two stories", "Roof type (tile, shingle, flat or foam)", "Pool, spa, equipment pad", "Casita, shop, shed or carport", "Manufactured home skirting, porch or carport added on", "Solar panels or a roof cooler", "Whether the photo is a current or an old listing photo"]
      neutral_wording: "Listing photo shows a one-story home with a tile roof, a pool with a raised spa, and a separate small building behind the pool."
  local_factors:
    - fact: "Arizona monsoon runs June 15 to September 30"
      effect: "Ceiling stains and roof or drainage questions come up after storms; buyers ask whether a stain is old or new [judgment]"
      source: nws_monsoon
    - fact: "Manufactured homes built after June 15, 1976 carry a HUD label; older ones do not"
      effect: "Year built and the label matter to buyers and lenders, so the card carries the year [judgment]"
      source: hud_label
    - fact: "Manufactured home installers are licensed by the Arizona Department of Housing"
      effect: "Setup and tie-down questions go to an installer, not the inspector; the card states what the lender asked for and nothing more [judgment]"
      source: adoh_mh
    - fact: "City water hardness is about 19 grains per gallon, and the Board standard excludes water conditioning systems"
      effect: "Scale at the water heater and fixtures shows in reports, but a softener or RO unit is outside the standard inspection"
      source: lhc_ccr
    - fact: "The Board standard excludes solar systems and does not name evaporative coolers"
      effect: "Inspectors differ on roof coolers and solar; the card says whether either is there so the quote can say what is covered"
      source: btr_sop
    - fact: "Many homes have pools, casitas or RV garages, and many owners are seasonal and away for months"
      effect: "Size and extras are understated, and vacant homes may have utilities off or need a neighbor to open up [judgment]"
      source: null
    - fact: "Some lots outside city sewer areas use septic tanks, which need a transfer inspection before a sale"
      effect: "Septic is a separate inspection by a different licensee, arranged by the seller"
      source: aac_r18_9_a316
  seasonality:
    busy: "February to May (spring listings and snowbird buyers) and October to December as seasonal owners return [judgment]"
    slow: "July and August, when attics are very hot and fewer homes go under contract [judgment]"
    source: null

job_types:
  - id: buyer_inspection
    label: "Buyer's whole-home inspection during a purchase"
    bank_job_type: "buyer inspection"
    recurring: false
    homeowner_phrasings: ["buying a house need inspection", "inspection period", "my agent said get an inspector", "under contract"]
    must_know:
      - fact: "Size of the main home and stories"
        bank_question: home_size
        follow_up: null
        photo: p1
        why_it_moves_price: "Size band sets the base price and time on site. [judgment]"
        skip_if: "Homeowner gave square feet"
      - fact: "Pool, spa or buildings beyond the garage"
        bank_question: extras
        follow_up: null
        photo: p1
        why_it_moves_price: "Pool and spa follow a separate standard and outbuildings are outside the standard scope, so each is an add-on."
        skip_if: "Homeowner already listed them"
      - fact: "When the contract inspection period ends"
        bank_question: null
        follow_up: fu_inspection_deadline
        photo: null
        why_it_moves_price: "The default resale contract allows 10 days; a short window means a rush slot."
        skip_if: "Homeowner gave the date or the timing answer covers it"
      - fact: "Year built"
        bank_question: null
        follow_up: fu_year_built
        photo: null
        why_it_moves_price: "Older homes take longer to inspect and report. [judgment]"
        skip_if: "Homeowner gave the year or decade"
      - fact: "Whether utilities are on"
        bank_question: null
        follow_up: fu_utilities_on
        photo: null
        why_it_moves_price: "Shut-down systems are not operated, which can mean a return trip."
        skip_if: "Seller lives in the home"
    allowed_follow_ups:
      - id: fu_inspection_deadline
        ask_when: "A purchase, sale or loan is involved and no deadline was given"
        text_en: "Is there a contract or lender deadline for the inspection, and how far away is it?"
        text_es: "¿Hay una fecha límite del contrato o del prestamista para la inspección, y para cuándo es?"
        options_en: ["Within 3 days", "4 to 7 days", "8 days or more", "No deadline"]
        options_es: ["En 3 días o menos", "De 4 a 7 días", "En 8 días o más", "No hay fecha límite"]
        card_field: true
        why: "Buyer inspection periods default to 10 days in the Arizona resale contract, so the deadline decides who can take it."
      - id: fu_year_built
        ask_when: "Home age not given"
        text_en: "About what year was the home built?"
        text_es: "¿Más o menos en qué año se construyó la casa?"
        options_en: ["2010 or newer", "1990 to 2009", "1970 to 1989", "Before 1970"]
        options_es: ["2010 o más nueva", "De 1990 a 2009", "De 1970 a 1989", "Antes de 1970"]
        card_field: true
        why: "Age changes time on site and what the inspector plans for. [judgment]"
      - id: fu_utilities_on
        ask_when: "Home may be vacant, bank-owned, a second home or the owner is away"
        text_en: "Will the water, power and gas be on at the home for the inspection?"
        text_es: "¿Va a estar conectada el agua, la luz y el gas en la casa para la inspección?"
        options_en: ["All on", "Some are off", "Don't know yet"]
        options_es: ["Todo conectado", "Algo está desconectado", "Todavía no sé"]
        card_field: true
        why: "The Board standard does not require operating shut-down systems, so utilities off can mean a second visit."
      - id: fu_septic_or_sewer
        ask_when: "Home may be outside city sewer, or the homeowner mentions a septic tank"
        text_en: "Is the home on city sewer or a septic tank?"
        text_es: "¿La casa está conectada al drenaje de la ciudad o tiene fosa séptica?"
        options_en: ["City sewer", "Septic tank"]
        options_es: ["Drenaje de la ciudad", "Fosa séptica"]
        card_field: true
        why: "A septic transfer inspection is a separate job by a different licensee, arranged by the seller."
    photos_priority: [p1]
    urgency:
      fire_dept_triggers: ["Gas or propane smell at the home", "CO alarm sounding"]
      urgent_capable_triggers: ["Contract inspection period ends within 3 days"]
      regular: "Deadline more than a week away"
    scope_line_en: "Buyer inspection, one-story home about 1,900 sq ft built in 1996, pool and spa; inspection period ends in 8 days."
    scope_line_es: "Inspección para comprador, casa de un piso de unos 1,900 pies² construida en 1996, con alberca y spa; el plazo de inspección termina en 8 días."
    quote_format: firm
    business_fills: ["price for the inspection", "what is included (pool and spa, other buildings)", "earliest date", "how soon the report arrives"]
    card_template: |
      REQ-<id> | Home inspection | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: buyer inspection, size, year, extras, deadline>
      For: purchase. Size: <band>, <stories if given>. Built: <year or decade>. Extras: <pool / spa / other buildings / none>.
      Add-ons asked about: <termite report / pool and spa / sewer camera / none>. Deadline: <days left>. Utilities: <on / some off / not known>. Access: <buyer there / agent lockbox>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Homes that age usually have roof problems.", "You'll be fine on your earnest money.", "Ask your agent for an extension.", "The inspector will tell you if it meets code.", "Inspections here run about four hundred."]

  - id: pre_listing
    label: "Seller's pre-listing inspection before the home goes on the market"
    bank_job_type: "pre-listing inspection"
    recurring: false
    homeowner_phrasings: ["inspect before I sell", "pre-listing inspection", "want to know problems first", "agent said get an inspection before listing"]
    must_know:
      - fact: "Size and extras, including buildings the stated size leaves out"
        bank_question: home_size
        follow_up: fu_changes_made
        photo: p1
        why_it_moves_price: "A casita, addition or converted garage adds time; sellers often give only the main-home size. [judgment]"
        skip_if: "Homeowner listed every building"
      - fact: "Pool, spa or detached building"
        bank_question: extras
        follow_up: null
        photo: p1
        why_it_moves_price: "Each is an add-on outside the standard home scope."
        skip_if: "Answered"
      - fact: "Who opens the home and whether utilities are on"
        bank_question: null
        follow_up: fu_who_opens
        photo: null
        why_it_moves_price: "Sellers away for the season need a lockbox or neighbor; a second trip costs the business. [judgment]"
        skip_if: "Seller will be home"
      - fact: "Year built"
        bank_question: null
        follow_up: fu_year_built
        photo: null
        why_it_moves_price: "Older homes take longer. [judgment]"
        skip_if: "Given"
    allowed_follow_ups:
      - fu_year_built
      - id: fu_changes_made
        ask_when: "Seller gave a size and no other buildings or changes"
        text_en: "Has anything been added or changed since the home was built, like a room addition, a garage made into a room, or a casita?"
        text_es: "¿Se le ha agregado o cambiado algo a la casa desde que se construyó, como un cuarto extra, una cochera convertida en cuarto o una casita?"
        options_en: ["Yes", "No"]
        options_es: ["Sí", "No"]
        card_field: true
        why: "Added space is time on site the stated size misses. [judgment]"
      - id: fu_who_opens
        ask_when: "Owner may be away or the home may be empty"
        text_en: "Who will let the inspector in?"
        text_es: "¿Quién le va a abrir al inspector?"
        options_en: ["I will be there", "An agent or a lockbox", "A neighbor or friend"]
        options_es: ["Yo voy a estar", "Un agente o una caja de llaves", "Un vecino o amigo"]
        card_field: true
        why: "Access sets scheduling and who gets the walk-through. [judgment]"
      - fu_utilities_on
    photos_priority: [p1]
    urgency:
      fire_dept_triggers: ["Gas or propane smell at the home", "CO alarm sounding"]
      urgent_capable_triggers: []
      regular: "All pre-listing requests"
    scope_line_en: "Pre-listing inspection, home about 2,200 sq ft built in 1992, tile roof, no pool; owners away, a neighbor can open up."
    scope_line_es: "Inspección antes de poner la casa en venta, unos 2,200 pies² construida en 1992, techo de teja, sin alberca; los dueños están fuera y un vecino puede abrir."
    quote_format: firm
    business_fills: ["price for the inspection", "what is included", "earliest date", "how soon the report arrives"]
    card_template: |
      REQ-<id> | Home inspection | <town>, <general area> | <kind of place>
      <one scope line: pre-listing, size, year, extras>
      For: sale (pre-listing). Size: <band>. Built: <year or decade>. Extras: <pool / spa / other buildings / none>. Added or changed: <yes, what she said / no>.
      Access: <owner there / agent lockbox / neighbor>. Utilities: <on / some off / not known>. Listing planned: <when, if given>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That garage conversion was probably done without a permit.", "Fix the roof before you list.", "Buyers always ask for that.", "A pre-listing inspection will help you sell faster."]

  - id: manufactured_home
    label: "Manufactured or mobile home inspection, usually for a purchase"
    bank_job_type: "buyer inspection"
    recurring: false
    homeowner_phrasings: ["mobile home inspection", "buying a double-wide", "casa móvil", "manufactured home in a park"]
    must_know:
      - fact: "Single-wide, double-wide or larger"
        bank_question: home_size
        follow_up: fu_mh_width
        photo: p1
        why_it_moves_price: "Sections and size set crawl and roof time. [judgment]"
        skip_if: "Homeowner said which"
      - fact: "Year built (before or after the HUD label began)"
        bank_question: null
        follow_up: fu_year_built
        photo: null
        why_it_moves_price: "Homes built after June 15, 1976 carry a HUD label; lenders and buyers ask about it."
        skip_if: "Given"
      - fact: "Anything special the lender asked for"
        bank_question: null
