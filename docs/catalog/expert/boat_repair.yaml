trade_brief:
  price_drivers:
    - driver: "Engine type: outboard, sterndrive (I/O), inboard or jet"
      why: "An outboard is open on the transom; a sterndrive or inboard means working in an engine bay, often with the drive off, and many jobs need the boat out of the water. It sets labor hours before anything else. [judgment]"
      source: null
    - driver: "Where the boat is: on a trailer at home, in a marina slip, on a lift, or in a storage lot"
      why: "A trailer at home is a mobile visit; a slip may mean a haul-out or working from the dock under marina rules; a storage lot may have no water to run the engine on a flush muff. [judgment]"
      source: null
    - driver: "What it does now: won't start, overheats, runs rough, electrical, or routine service"
      why: "Routine service is a set menu a shop can price; a no-start or overheat is diagnosis time first, and the fix is unknown until then. [judgment]"
      source: null
    - driver: "How long it sat and when it was last serviced"
      why: "Ethanol fuel left for months can damage the fuel system, and a skipped 100-hour or yearly service adds the water pump, plugs and gear oil to the job."
      source: boatus_ethanol
    - driver: "Make, horsepower and age or hours"
      why: "Parts and dealer tools differ by make; out-of-production engines such as Evinrude still get service parts but take longer to source and fewer shops take them."
      source: brp_evinrude
    - driver: "For trailers: axle count and brakes"
      why: "A tandem axle doubles the hubs, and a trailer of 3,000 pounds or more must have brakes, so bearing and brake work scales with both."
      source: ars_28_952
    - driver: "For canvas and seats: how many pieces, and whether they come off and go to the shop"
      why: "Shop work on pieces the owner drops off is quicker to price than patterns made on the boat in a slip. [judgment]"
      source: null
    - driver: "Spring rush and a fixed trip date"
      why: "Marine shops book out weeks in spring and before holiday weekends; a hard date narrows who can quote. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Fuel left in the tank for months, with water and ethanol settled at the bottom"
      how_a_pro_spots_it: "Owner says it last ran months ago or the boat came out of storage; a no-start after sitting"
      question_or_photo: fu_last_ran
      source: boatus_ethanol
    - condition: "Water got inside the engine (boat flipped, swamped, sank at the dock, or a PWC rolled)"
      how_a_pro_spots_it: "A no-start that began right after an event on the water; damp film in the engine bay photo"
      question_or_photo: fu_before_stop
      source: null
    - condition: "Mussel shells or crust in water intakes and cooling passages on a boat kept in the lake"
      how_a_pro_spots_it: "Boat lives in a slip or on a lift; shells on the lower unit or hull in the photo; overheat complaint"
      question_or_photo: location
      source: blm_ais
    - condition: "Cracked sterndrive bellows letting water reach the gimbal bearing and the bilge"
      how_a_pro_spots_it: "Sterndrive answer, older boat, water in the bilge or a roar at the stern; bellows past about six years"
      question_or_photo: drive
      source: boattrader_bellows
    - condition: "Trailer bearings with water in the grease after hot hubs were dunked at the ramp"
      how_a_pro_spots_it: "Grinding or heat at one wheel; grease flung on the inside of the rim in the trailer photo"
      question_or_photo: fu_trailer_what
      source: mercury_bearings
    - condition: "Marina rules on outside mechanics, gate codes, or a slip where the drive cannot be reached"
      how_a_pro_spots_it: "Location answer says in the water or on a lift; owner mentions a marina office"
      question_or_photo: fu_marina_access
      source: s46_havasu_docks
    - condition: "Engine out of production, so parts are slow and fewer shops will take it"
      how_a_pro_spots_it: "Engine label photo or make answer shows Evinrude, Johnson or an older two-stroke"
      question_or_photo: p1
      source: brp_evinrude
    - condition: "Warnings last season the owner did not mention, which turn a routine service into a repair"
      how_a_pro_spots_it: "Service request with a photo showing white crust or streaks on the powerhead; no service in years"
      question_or_photo: fu_warnings_last_season
      source: null
  misdiagnosis_checks:
    - sounds_like: "electrical_marine (dead battery, only clicks)"
      might_be: "engine_repair after water got into the engine (flipped, swamped or sank)"
      one_question: fu_before_stop
      if_other_route_to: {category: boat_repair, job_type: "engine repair"}
      source: null
    - sounds_like: "outboard service (routine tune-up)"
      might_be: "engine_repair: a warning alarm or loss of power last season the owner thinks is normal"
      one_question: fu_warnings_last_season
      if_other_route_to: {category: boat_repair, job_type: "engine repair"}
      source: null
    - sounds_like: "engine repair (boat on a lift will not go up or down)"
      might_be: "boat_lift: the lift motor, cables or cradle, which is refused here"
      one_question: fu_lift_or_boat
      if_other_route_to: {category: boat_repair, job_type: "dock, boat lift or seawall work"}
      source: null
    - sounds_like: "electrical_marine (no power to the boat at the slip)"
      might_be: "dock_electrical: the power post or dock outlets, licensed electrical work refused here"
      one_question: fu_shore_or_boat
      if_other_route_to: {category: boat_repair, job_type: "dock, boat lift or seawall work"}
      source: s2_aac_r4_9_103
    - sounds_like: "canvas and upholstery repair (seats look bad)"
      might_be: "boat_detailing interior detail: seats that are dirty, stained or faded but not torn"
      one_question: fu_damage_kind
      if_other_route_to: {category: boat_detailing, job_type: "interior detail"}
      source: null
    - sounds_like: "canvas and upholstery repair (fix the hull and seats)"
      might_be: "boat_detailing waxing: a dull or chalky hull with no cracks or damage"
      one_question: fu_damage_kind
      if_other_route_to: {category: boat_detailing, job_type: "waxing"}
      source: null
    - sounds_like: "engine repair (smoke from the engine)"
      might_be: "white steam with an overheat, which is not on the fire-truck list; gray or black smoke gets the 911 text by code"
      one_question: fu_steam_or_smoke
      if_other_route_to: {category: boat_repair, job_type: "engine repair"}
      source: null
  photo_reading:
    - photo_id: p1
      reads: ["Make, model and horsepower", "Serial number range, which dates the engine", "Two-stroke or four-stroke", "Out-of-production makes"]
      neutral_wording: "Engine label shows a Yamaha 150 horsepower four-stroke."
    - photo_id: p2
      reads: ["Boat type and rough length", "Outboard, sterndrive or inboard at the stern", "Trailer, slip or lift", "Cover, bimini top and seats in view", "Shells or crust at the waterline"]
      neutral_wording: "Side view of a pontoon on a trailer in a driveway with a single outboard."
    - photo_id: p3
      reads: ["White crust or orange streaks on the engine", "Damp film or water in the engine bay", "Shells on the lower unit", "Split seams or cracked vinyl on seats"]
      neutral_wording: "Close-up shows white crusty deposits and orange streaks low on the side of the engine."
    - photo_id: p6
      reads: ["Single or tandem axle", "Grease flung on the inside of a rim", "Tire sidewall cracks and tread", "Light condition and wiring", "Brake lines or a surge coupler"]
      neutral_wording: "Tandem axle trailer; dark grease is spread on the inside of the left rear wheel."
    - photo_id: p4
      reads: ["Lift or dock type", "Whether a boat is on the lift", "At a home or a marina"]
      neutral_wording: "Cable boat lift with a boat resting on it about halfway up."
    - photo_id: p5
      reads: ["Dock power post or outlets", "Cords running to the boat"]
      neutral_wording: "Dock power post with one cord running to the boat."
  local_factors:
    - fact: "Summer average highs run 103 F in June, 108 F in July and 106 F in August"
      effect: "Overheat and battery calls peak in summer, and sun breaks down seat vinyl and canvas thread fast [judgment for the effect]"
      source: azsp_weather
    - fact: "Boats launched, moored, docked or trailered in Lake Havasu may carry invasive mussels, which damage boat motors and hide in intakes"
      effect: "Slip and lift boats can come with shells in the cooling intakes; the card states where the boat lives so a mechanic plans for it"
      source: blm_ais
    - fact: "A boat on listed waters 6 or more days in a row must be decontaminated before it is moved, and the lower unit must be drained"
      effect: "A slip boat hauled to a shop across the state line or to another lake has a step before transport; mechanics who haul boats ask how long it has been in the water"
      source: azgfd_ais
    - fact: "Most lifts and docks on the lake are at marinas"
      effect: "Many repair jobs are in a marina slip, where gate codes, vendor check-in and limits on engine work apply [judgment for the rules]"
      source: s46_havasu_docks
    - fact: "Monsoon storms June to September bring strong afternoon wind"
      effect: "Torn bimini tops, ripped covers and bent frames come in after storms [judgment for the effect]"
      source: azsp_weather
    - fact: "Seasonal residents and second-home owners leave boats in storage lots or side yards for months"
      effect: "Boats come back with old fuel, dead batteries and flat trailer tires, and the owner may be out of town when the mechanic comes [judgment]"
      source: null
    - fact: "City tap water is hard, about 19 grains per gallon"
      effect: "Owners flush outboards with a garden hose at home; some mechanics ask how and how often it is flushed [judgment for the effect]"
      source: lhc_ccr
    - fact: "Many HOA neighborhoods limit boats and trailers in driveways"
      effect: "A mobile mechanic may not be able to work at the home, so the boat goes to a storage lot or shop [judgment]"
      source: null
  seasonality:
    busy: "February to May (spring prep, spring break, the run to Memorial Day, when boating spikes) and summer breakdowns June to September [judgment except the Memorial Day uptick]"
    slow: "November to January [judgment]"
    source: kjzz_memorial_day

job_types:
  - id: engine_repair
    label: "Engine, outboard, sterndrive or jet ski won't start, overheats, runs rough or loses power"
    bank_job_type: "engine repair"
    recurring: false
    homeowner_phrasings: ["boat won't start", "motor keeps overheating", "outboard bogs down", "jet ski just clicks", "lancha no arranca"]
    must_know:
      - fact: "Engine type and make"
        bank_question: drive
        follow_up: null
        photo: p1
        why_it_moves_price: "Sets who can take it, access to the engine and which parts and tools come along. [judgment]"
        skip_if: "Engine label photo sent"
      - fact: "What it does now"
        bank_question: symptom
        follow_up: fu_crank
        photo: null
        why_it_moves_price: "Nothing, clicks, cranks without starting and starts-then-dies are four different starting points for a diagnosis. [judgment]"
        skip_if: "Homeowner's words already say what happens at the key"
      - fact: "When it last ran normally and what happened right before"
        bank_question: null
        follow_up: fu_last_ran
        photo: null
        why_it_moves_price: "Months of sitting points the visit at fuel; a flip or swamping turns a quick visit into a full engine check."
        skip_if: "Homeowner said when it last ran and what happened"
      - fact: "Where the boat is and who lets the mechanic in"
        bank_question: location
        follow_up: null
        photo: p2
        why_it_moves_price: "Trailer at home is a mobile visit; a slip may mean a haul-out or marina rules. [judgment]"
        skip_if: "Answered"
      - fact: "Hours or age"
        bank_question: hours_year
        follow_up: null
        photo: p1
        why_it_moves_price: "High hours and older engines change the odds of a long repair and the parts search. [judgment]"
        skip_if: "Engine label photo dates it or the owner gave it"
    allowed_follow_ups:
      - id: fu_last_ran
        ask_when: "Won't start or runs rough, and the homeowner did not say when it last ran"
        text_en: "When did the engine last run normally?"
        text_es: "¿Cuándo funcionó bien el motor por última vez?"
        options_en: ["This week", "Within the last month", "1 to 6 months ago", "Over 6 months ago"]
        options_es: ["Esta semana", "En el último mes", "Hace 1 a 6 meses", "Hace más de 6 meses"]
        card_field: true
        why: "Time sitting is the first fact a marine mechanic asks for on a no-start; old fuel changes the visit."
      - id: fu_before_stop
        ask_when: "The engine quit, won't start or only clicks, and nothing was said about what happened before"
        text_en: "Did anything happen right before it started, like hitting something, the boat flipping or taking on water, or fueling up?"
        text_es: "¿Pasó algo justo antes de que empezara, como pegarle a algo, voltearse o entrarle agua a la lancha, o cargar gasolina?"
        options_en: ["Hit something or ran aground", "Flipped or took on water", "Just fueled or ran out of gas", "Nothing I noticed"]
        options_es: ["Le pegó a algo o encalló", "Se volteó o le entró agua", "Recién cargó gasolina o se le acabó", "Nada que haya notado"]
        card_field: true
        why: "A flip or swamping turns a battery or starter request into an engine inspection; a strike points at the lower unit. [judgment]"
      - id: fu_crank
        ask_when: "Won't start, or the homeowner names the battery or starter"
        text_en: "When you turn the key or press start, what happens?"
        text_es: "Cuando gira la llave o presiona el botón de arranque, ¿qué pasa?"
        options_en: ["Nothing at all", "Clicks only", "Turns over but won't start", "Starts, then dies"]
        options_es: ["Nada", "Solo hace clic", "Da marcha pero no arranca", "Arranca y se apaga"]
        card_field: true
        why: "Separates an electrical visit from a fuel or engine visit without naming either. [judgment]"
      - id: fu_steam_or_smoke
        ask_when: "Homeowner mentions vapor, steam or smoke from the engine and did not say which"
        text_en: "Is it white steam, or gray or black smoke?"
        text_es: "¿Es vapor blanco, o humo gris o negro?"
        options_en: ["White steam", "Gray or black smoke", "Not sure"]
        options_es: ["Vapor blanco", "Humo gris o negro", "No sé"]
        card_field: true
        why: "Steam with an overheat alarm is a repair card; smoke is on the fire-truck list and code sends the 911 text. [judgment]"
    photos_priority: [p1, p2, p3]
    urgency:
      fire_dept_triggers: ["Gas or fuel smell in the bilge or engine area", "Smoke or fire from the engine or wiring", "CO alarm going off in the cabin"]
      urgent_capable_triggers: ["Boat is taking on water in the slip", "Trip or rental booked within the next few days"]
      regular: "Boat is out of the water or tied up dry and no trip is booked"
    scope_line_en: "20 ft bowrider with a Mercury outboard turns over but will not start; on a trailer at home, last ran in May."
    scope_line_es: "Lancha bowrider de 20 pies con motor fuera de borda Mercury que da marcha pero no arranca; en remolque en casa, funcionó por última vez en mayo."
    quote_format: diagnostic_visit
    business_fills: ["visit fee", "what the visit covers (test run, compression, written estimate)", "earliest visit and whether you work in a slip"]
    card_template: |
      REQ-<id> | Boat repair | <town>, <general area> | <in the water / on a lift / on a trailer at home / in storage>
      <one scope line: boat length and type, engine, what it does, where it is>
      Engine: <outboard / inboard / sterndrive / jet>, <make>, <hours or age band>. Doing: <won't start / overheats / runs rough / electrical>.
      Last ran normally: <when>. Before it started: <hit something / flipped or took on water / fueled or ran out / nothing noticed>. At the key: <nothing / clicks / turns over / starts then dies>.
      Access: <open / gate code or call ahead / marina check-in / not said>. Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["It's probably old gas.", "Sounds like the impeller.", "That's just a dead battery.", "A diagnosis runs about a hundred and fifty.", "Run the blower before you start it."]

  - id: service_tuneup
    label: "Outboard service: yearly or 100-hour service, impeller, lower unit oil, get ready after storage"
    bank_job_type: "outboard service"
    recurring: false
    homeowner_phrasings: ["annual service on my outboard", "spring tune-up", "change the impeller", "lower unit oil", "servicio del motor fuera de borda"]
    must_know:
      - fact: "Make, horsepower and two-stroke or four-stroke"
        bank_question: make
        follow_up: null
        photo: p1
        why_it_moves_price: "The service kit and hours are set by make and size; a firm price needs them. [judgment]"
        skip_if: "Engine label photo sent or owner gave make and horsepower"
      - fact: "When it was last serviced and what is wanted"
        bank_question: null
