business_side:
  how_they_get_customers: ["Word of mouth at marinas, launch ramps and storage lots [judgment]", "Dealer service departments and the brands they are certified on [judgment]", "Google Maps listing and reviews [judgment]", "Local Facebook groups and boating forums [judgment]", "Truck signage and mobile service at storage lots [judgment]", "Home-service marketplaces such as Thumbtack"]
  customer_acquisition_benchmarks:
    - channel: "Thumbtack (most home-service trades; marine work not broken out)"
      figure: "About $25 to $75 per lead, sent to several pros; marketing-vendor estimate, not a published price"
      source: superdupr_thumbtack
      unverified: false
    - channel: "Angi (most home-service trades)"
      figure: "About $15 to $85 per lead plus a yearly membership of a few hundred dollars; leads go to several contractors; marketing-vendor estimate"
      source: superdupr_thumbtack
      unverified: false
    - channel: "Lake Havasu marine mechanics and canvas shops specifically"
      figure: "No local or marine-specific figures found; most local work appears to come by word of mouth and marina staff"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a request five other mechanics also got", "Owners who want a price over the phone for an engine no one has heard run", "Boats that are out of the area or in a slip they can't get to", "Monthly fees in the slow winter months", "Being ranked or reviewed by the site itself"]
  what_makes_a_lead_worth_paying_for: ["Make, horsepower and engine type up front, ideally a label photo", "Where the boat sits and how to get in", "When it last ran and what happened before it quit", "Pay only on the pick, nothing monthly", "A real date the boat is needed"]
  their_words: ["impeller", "water pump", "lower unit", "gear lube", "powerhead", "compression", "sterndrive", "I/O", "outdrive", "bellows", "gimbal bearing", "raw water", "closed cooling", "fogging", "winterize", "de-winterize", "haul-out", "flush muffs", "anodes", "surge brakes", "bunks", "Bearing Buddy", "bimini", "marine vinyl", "snaps"]
  signup_objections:
    - objection: "I can't quote an engine I haven't heard run."
      answer: "You don't have to. Engine repair cards take a visit fee, and you say what the visit covers. Each card gives the make, engine type, where the boat sits, when it last ran and what happened before it quit."
    - objection: "I'm booked six weeks out every spring. Why would I pay for more work?"
      answer: "You pick the job types you want and change them any time. If you only want outboard service in the fall, tick that. You pay nothing unless a homeowner picks your quote."
    - objection: "Shared request sites send the same boat to five mechanics."
      answer: "Every mechanic who takes that job type sees the card, and the homeowner picks one quote. Only the picked business pays, and only that business gets her name and address."
    - objection: "I only work on Mercury and Yamaha."
      answer: "The make is on every engine card, so you can skip the rest. Nothing is charged for a card you don't quote."
    - objection: "What does it cost?"
      answer: "Nothing to join and nothing monthly. You pay one set introduction fee when you confirm a pick: $25, $75 or $199 by job size. A visit-fee quote pays $25."
    - objection: "Half these boats are in marina slips I can't work in."
      answer: "The card says where the boat sits and whether there is a gate code or marina check-in, so you can pass on the ones you can't reach."
    - objection: "Will you rank me against the other shops?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "What if the owner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Do you send dock and lift jobs too?"
      answer: "Not to boat repair businesses. Dock, lift and seawall work is held for licensed contractors, so boat repair cards are boat, engine, trailer and canvas work only."
  quote_tips_for_card: ["Say what the visit fee covers and whether it comes off the repair", "For outboard service, list what the price includes: plugs, gear oil, impeller, anodes, filters", "Say whether you work in marina slips or only on trailers and at the shop", "Give your earliest day; spring wait times matter to owners with a trip booked", "If you need a label photo or a photo of something else, say which"]
