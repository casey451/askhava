# Ask Hava expert layer: boat_repair (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set boat_repair and trade_kb/trades/boat_dock.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The boat_dock kb file serves boat_repair and boat_detailing. Kept here: engine_repair ("engine repair"),
#   service_tuneup ("outboard service", firm), electrical_marine ("engine repair", the closest home; the
#   bank's work question already offers "Electrical or gauges"), trailer ("trailer repair") and detailing,
#   used here ONLY for its upholstery part ("canvas and upholstery repair"). boat_detailing.yaml uses the
#   same kb id "detailing" for the full detail package. The id is kept so the scenario file (boat_repair_s12)
#   and the kb id line up; a cleaner fix is a kb id "canvas_upholstery".
# - New job type inboard_jet_service: routine service, winterize or de-winterize on an inboard, sterndrive,
#   jet boat or PWC. The category's only service job type is "outboard service" (firm). A shop that ticks
#   outboard service may not work on sterndrives, so these ride on "engine repair" and are quoted as a
#   diagnostic visit (the business can quote the service as the visit fee). Suggest renaming
#   "outboard service" to "engine service" or adding "inboard and sterndrive service" with firm quotes.
# - Left out: mobile_service. It is how the work is done, not a job; the bank's location question and
#   fu_marina_access put it on the card.
# - boat_lift, dock_repair, dock_new and dock_electrical sit under the refused row "dock, boat lift or
#   seawall work" so the intake recognizes them and declines without building a boat repair card. They are
#   construction on real property (A.R.S. 32-1101 covers structures and improvements), need Army Corps
#   approval for anything in or over the water, and dock power is R-11 work. license_map.yaml grants this
#   row to no class today, so the card_template on those entries is only the shape a licensed-only card
#   would take if Casey opens a route. Seawalls have no kb id; they ride on dock_repair.
# - Boat repair needs no ROC license: a boat is not a building, structure or improvement under A.R.S.
#   32-1101 [judgment; attorney may confirm, as categories.yaml says]. A city business license may apply.
# - Fire-truck list: a gas or fuel smell in the bilge, smoke or fire, and a CO alarm on a cabin boat get
#   the fixed 911 text by code. The kb's blower and ventilation steps are not used (D-436). A tingle or
#   shock in the water near a dock is not on the list; it appears only as a plain urgent fact.
# - Bank photos are [p1, p2, p3]. Trailer cards need p6 (trailer tires, lights, hubs). Canvas and seat
#   cards have no fitting kb photo; suggest a new kb photo "seats, bimini or cover, close up".
# - Bank make options miss common Havasu engines: Evinrude or Johnson, Honda, Sea-Doo and Kawasaki
#   (scenarios s03, s06, s10 use them). Suggest adding them or a PWC row.
# - Every Lake Havasu cost figure is unverified; no marine-specific lead-cost data was found.
