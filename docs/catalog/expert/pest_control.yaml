      figure: "No local figures found; a small market with fewer bidders may run below national vendor figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a lead that 3 or 4 other companies also bought", "Price shoppers who want a number over the phone and never sign up", "Monthly fees whether or not jobs come", "Fake or wrong-number leads", "Lead sites that rank or review them"]
  what_makes_a_lead_worth_paying_for: ["She already picked them, so no phone bidding war", "Pay only on the pick, nothing monthly", "Pest, home size, inside or outside and schedule stated up front", "A photo of the pest, tubes or yard", "Ongoing customers: one fee for a customer who may stay years"]
  their_words: ["initial service", "quarterly", "bimonthly", "perimeter", "eaves sweep", "door sweeps", "blacklight", "granules", "re-service", "callback", "WDIIR", "TARF", "trench and treat", "drill and treat", "bait stations", "pre-em", "post-em", "bare ground", "exclusion"]
  signup_objections:
    - objection: "How is the fee figured on a monthly plan?"
      answer: "Four months of the monthly price, and an ongoing service never pays more than $75. A quarterly plan at $135 is $45 a month, so the basis is $180 and the fee is $25."
    - objection: "Do you check my pest license?"
      answer: "Pest jobs go only to businesses that tell us at sign-up they hold an Arizona Department of Agriculture pest-management license and give the number. Each quote card shows that number, says Ask Hava has not checked it, and links to the Department's search."
    - objection: "Will I get termite and pre-emergent jobs?"
      answer: "Only if you also tell us you hold the matching category: wood-destroying organism for termites, weed control for pre-emergent. Otherwise you get general pest and scorpion cards."
    - objection: "I can't quote termites without seeing the house."
      answer: "Termite treatment is quoted as one price for the work the card describes. Say in your notes what you would confirm on site. Most cards come with a photo of the tubes or damage, the floor type and the home size."
    - objection: "Why pay a fee when I get pest customers from Google?"
      answer: "You pay only when the homeowner picks your quote, and nobody else gets that job. There is nothing to join and nothing monthly."
    - objection: "What if the customer cancels the plan after two months?"
      answer: "The fee is a one-time introduction fee and is not refunded if a plan ends later. If the homeowner cancels before you have spoken with them, the fee is refunded."
    - objection: "Will you rank me against other pest companies?"
      answer: "No. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town, photos when she has them, and answers to the questions a pest company asks. Her name and address go only to the business she picks."
    - objection: "I only want scorpion and general service, not rodents or weeds."
      answer: "You pick the job types you want at sign-up and can change them any time. You get cards only for those."
  quote_tips_for_card: ["State the visit schedule and the monthly figure, or the per-visit price with the schedule", "Say whether the first visit costs more", "Say whether visits between scheduled ones are free", "For termites, say what the price covers and any yearly renewal", "Give your earliest start"]
