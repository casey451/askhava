business_side:
  how_they_get_customers: ["Google Maps listing and reviews", "Google Local Services Ads and search ads", "Door-to-door summer sales crews [judgment]", "Repeat customers and neighbor word of mouth", "Realtor and title referrals for termite reports [judgment]", "Local Facebook groups, truck signage and yard signs [judgment]"]
  customer_acquisition_benchmarks:
