trade_brief:
  price_drivers:
    - driver: "What she is seeing: general pests, scorpions, rodents, termites or weeds"
      why: "Scorpion plans take more labor (eaves, block walls, door sweeps) because pesticide alone does little, and termites are a one-time treatment priced on its own."
      source: ua_ipm_scorpion
    - driver: "Service schedule: monthly, every other month or quarterly, plus any first-visit charge"
      why: "The schedule sets the monthly figure, and most companies charge more for the first visit that knocks numbers down. [judgment]"
      source: null
    - driver: "Home size and lot size"
      why: "Perimeter length and yard area set product and minutes per visit; for termites the length of foundation to trench and drill sets the job. [judgment]"
      source: null
    - driver: "Inside and outside, or outside only"
      why: "Interior service means a booked time with someone home and more minutes per visit. [judgment]"
      source: null
    - driver: "Yard features: hollow block walls, rock, palms, wood or debris piles"
      why: "Hollow block walls are where bark scorpions prefer to hide, so walls and rock add treatment area and time."
      source: ua_ipm_scorpion
    - driver: "Termites: slab, crawl space or manufactured home, and how much concrete or patio meets the house"
      why: "Liquid treatment means trenching and drilling through concrete along the foundation; baits avoid drilling but need repeat monitoring visits."
      source: ua_az1356
    - driver: "Weeds: area treated, rock or grass, and whether weeds are already up"
      why: "Pre-emergent stops seedlings; weeds already up need a second product or pulling first, which changes the visit. [judgment]"
      source: null
    - driver: "How heavy it is and how long it has gone on (a sighting now and then versus many every day)"
      why: "Heavy activity means extra early visits before a regular schedule. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Uncapped hollow block walls and rock borders around the yard"
      how_a_pro_spots_it: "Yard photo; the homeowner names a block wall; scorpions seen near walls or the pool"
      question_or_photo: fu_yard_features
      source: ua_ipm_scorpion
    - condition: "Small roaches breeding inside the kitchen rather than large ones wandering in from outside"
      how_a_pro_spots_it: "Size of the roach in the photo; seen in daytime in kitchen cabinets"
      question_or_photo: fu_roach_size
      source: null
    - condition: "Termite damage hidden behind baseboards, drywall or door frames beyond the tubes she can see"
      how_a_pro_spots_it: "Tubes at several spots, soft or hollow trim, swarmers indoors; wood touching soil"
      question_or_photo: p2
      source: aac_r3_8_307
    - condition: "An active termite warranty with another company, which may cover the re-treat"
      how_a_pro_spots_it: "Homeowner mentions a past treatment, a yearly renewal or a sticker in the garage"
      question_or_photo: fu_prior_treatment
      source: ua_az1356
    - condition: "Rodent entry gaps (garage door seals, roof vents, skirting on a manufactured home) that keep letting them back in"
      how_a_pro_spots_it: "Where droppings show up; the attic or skirting named; chewed items in the garage photo"
      question_or_photo: fu_rodent_where
      source: null
    - condition: "Weeds already tall or seeded across the rock yard"
      how_a_pro_spots_it: "Rock yard photo; homeowner says weeds are up now"
      question_or_photo: fu_weeds_now
      source: null
    - condition: "Second home that sits empty for months, so activity built up and inside service needs someone to open up"
      how_a_pro_spots_it: "Homeowner says she is out of town or arriving for the season; the card's timing answer"
      question_or_photo: where
      source: null
    - condition: "A bee colony already built inside a wall, roof or box, with comb that has to come out"
      how_a_pro_spots_it: "Bees going in and out of one opening for days rather than hanging in a ball; more each day"
      question_or_photo: fu_bee_where
      source: lhc_bees
  misdiagnosis_checks:
    - sounds_like: "general pest service (flying ants)"
      might_be: "termites"
      one_question: fu_termite_signs
      if_other_route_to: {category: pest_control, job_type: "termites"}
      source: ua_az1369
    - sounds_like: "termites"
      might_be: "general_pest (winged ants, no tubes or wood damage)"
      one_question: fu_termite_signs
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
    - sounds_like: "termites (selling or buying the house, needs a termite letter)"
      might_be: "termite_inspection, a report for a sale or loan"
      one_question: fu_for_sale
      if_other_route_to: {category: home_inspection, job_type: "termite report for a sale or loan"}
      source: azda_wdiir
    - sounds_like: "pre-emergent weed control (weeds everywhere after the rain)"
      might_be: "weed pulling and haul-away, yard work for a gardener"
      one_question: fu_weed_work
      if_other_route_to: {category: landscape_maintenance, job_type: "yard cleanup"}
      source: ars_3_3613
    - sounds_like: "termites (mud tubes on the house)"
      might_be: "bees_wasps (mud built high under the eaves, insects flying in and out)"
      one_question: fu_termite_signs
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
    - sounds_like: "bed_bugs_other (bites at night, homeowner says bed bugs)"
      might_be: "bed_bugs_other (fleas from a pet that goes outside)"
      one_question: fu_pets_outside
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
  photo_reading:
    - photo_id: p1
      reads: ["Size, color and shape of the pest (bark scorpion features: thin tail and pincers, about 1.5 inches)", "Roach size: large outdoor type or small kitchen type", "Live or dead, inside or outside", "Where it was found (bed, tub, garage)"]
      neutral_wording: "Light brown scorpion about an inch long on a bathroom floor."
    - photo_id: p2
      reads: ["Pencil-width mud tubes on a stem wall or garage wall", "Light yellow hard tubes versus flatter dark brown tubes", "Hollow or soft wood, kick holes with small pellets below", "Piles of wings near a window or light"]
      neutral_wording: "Thin mud lines running up the garage wall from the floor, about two feet tall."
    - photo_id: p5
      reads: ["Droppings size and how many", "Chewed boxes, wiring or insulation", "Nest material in a garage, engine bay or under a stored boat"]
      neutral_wording: "Small dark droppings along the garage wall and a chewed cardboard box."
    - photo_id: p6
      reads: ["Rock or gravel versus grass", "Weeds up now and how tall", "Plants, drip lines and trees inside the area", "Block walls and rock borders"]
      neutral_wording: "Front rock yard with a few small green weeds and three shrubs on drip lines."
    - photo_id: p3
      reads: ["Hanging cluster in a tree or bush versus bees going in and out of one opening", "Opening in a wall, roof, meter box, valve box or ground", "Height off the ground and nearby doors, pool or walkways"]
      neutral_wording: "Football-sized cluster of bees on a low tree branch about 6 feet up, near the pool equipment."
    - photo_id: p4
      reads: ["Gap under the panel edge", "Nest material and droppings on the roof under the panels", "Number of panels and roof type"]
      neutral_wording: "Twigs and droppings under the edge of a row of roof solar panels on a tile roof."
  local_factors:
    - fact: "Bark scorpions shelter in hollow block walls, under rocks and bark, and are active most of the year when nights stay above 70 F"
      effect: "Block-wall yards and rock borders, common in Lake Havasu City, widen the treatment area; pros ask about walls and how often scorpions show up inside"
      source: ua_ipm_scorpion
    - fact: "The bark scorpion is the only one of about 30 Arizona species seen as life-threatening, and it climbs well; most stings are at night in warm months"
      effect: "Homeowners with small children often ask for monthly service and inside treatment; the card states children or a crib only if she says so [judgment]"
      source: azpoison_scorpions
    - fact: "Arizona's most destructive subterranean termite swarms at dusk after monsoon rains, July to September"
      effect: "A late-summer run of 'flying ants' requests that need sorting from termites by tubes and wings"
      source: ua_az1369
    - fact: "Liquid termite treatment can break down in hot, dry Arizona soil, and many liquid jobs carry an annual renewable warranty"
      effect: "Termite quotes often include a yearly renewal; a homeowner with an old warranty may already be covered"
      source: ua_az1356
    - fact: "Gardeners lose their herbicide exemption for any preemergent, and for advertising weed control"
      effect: "Pre-emergent jobs go only to Department licensees with the weed control category; gardeners pulling weeds stay in yard maintenance"
      source: ars_3_3613
    - fact: "Pre-emergent works when applied at soil about 50 to 55 F (by early to mid February in Yuma, the closest listed low-desert city) and must be watered in by irrigation or rain"
      effect: "Rock-yard pre-emergent requests bunch up in fall before winter rain and again in January and February [judgment on Lake Havasu timing]"
      source: ua_preemergent
    - fact: "Bees swarm in spring and fall, and the city fire department does not remove swarms or hives"
      effect: "Bee requests come to pest businesses in spring and fall; whether bees are hanging in a ball or going into an opening changes the job"
      source: lhc_bees
    - fact: "Seasonal residents, vacant second homes, manufactured homes with skirting, and boats and RVs in storage are common"
      effect: "Rodent and scorpion activity builds up in empty homes and stored vehicles; inside visits need an access plan [judgment]"
      source: null
  seasonality:
    busy: "April to October for scorpions and general pests (nights above 70 F), July to September for termite swarms after monsoon rain, and fall plus January to February for pre-emergent [judgment on pre-emergent timing]"
    slow: "November to March for scorpions, which are least active then; December is slow overall [judgment]"
    source: ua_ipm_scorpion

job_types:
  - id: general_pest
    label: "General pests (ants, roaches, crickets, spiders), one-time or ongoing"
    bank_job_type: "general pest service"
    recurring: true
    homeowner_phrasings: ["ants in the kitchen", "roaches in the garage", "black widows by the door", "crickets everywhere", "need a bug guy", "spray for bugs"]
    must_know:
      - fact: "What she sees and where (inside, outside, both)"
        bank_question: pest
        follow_up: null
        photo: p1
        why_it_moves_price: "Inside service means a booked visit and more minutes; outside-only is a perimeter route stop. [judgment]"
        skip_if: "Her words name the pest and the place"
      - fact: "Service schedule wanted"
        bank_question: how_often
        follow_up: null
        photo: null
        why_it_moves_price: "Monthly, every other month or quarterly sets the monthly figure the quote is built on. [judgment]"
        skip_if: "She named a schedule"
      - fact: "Home size"
        bank_question: home_size
        follow_up: null
        photo: null
        why_it_moves_price: "Perimeter and square footage set product and time per visit. [judgment]"
        skip_if: "Answered"
      - fact: "For roaches: large ones or small ones"
        bank_question: null
        follow_up: fu_roach_size
        photo: p1
        why_it_moves_price: "Small roaches breeding indoors need several close-together inside treatments; large ones from outside are a routine perimeter job. [judgment]"
        skip_if: "No roaches mentioned, or the photo shows the roach"
      - fact: "Whether a pest company treats the home now"
        bank_question: null
        follow_up: fu_prior_service
        photo: null
        why_it_moves_price: "A home already on service often skips the heavier first visit. [judgment]"
        skip_if: "She said she has never had service"
    allowed_follow_ups:
      - id: fu_roach_size
        ask_when: "She mentions roaches and sent no photo of one"
        text_en: "Are the roaches large, over an inch, or small, about half an inch?"
        text_es: "¿Las cucarachas son grandes, de más de una pulgada, o chicas, de media pulgada más o menos?"
        options_en: ["Large, over an inch", "Small, about half an inch", "Both sizes"]
        options_es: ["Grandes, más de una pulgada", "Chicas, media pulgada más o menos", "De los dos tamaños"]
        card_field: true
        why: "Roach size is the first thing a pest estimator asks; it separates an indoor job from a perimeter job without naming a species. [judgment]"
      - id: fu_seen_how_often
        ask_when: "She did not say how often she sees them"
        text_en: "How often do you see them, or signs of them?"
        text_es: "¿Cada cuánto los ve, o ve rastros de ellos?"
        options_en: ["Once in a while", "Most days", "Many at once or every day"]
        options_es: ["De vez en cuando", "Casi todos los días", "Muchos a la vez o todos los días"]
        card_field: true
        why: "Heavy activity means extra early visits before the regular schedule. [judgment]"
      - id: fu_prior_service
        ask_when: "She wants ongoing service and did not say whether anyone treats the home now"
        text_en: "Has a pest company treated the home in the last 6 months?"
        text_es: "¿Alguna compañía de control de plagas ha tratado la casa en los últimos 6 meses?"
        options_en: ["Yes, and still does", "Yes, but it stopped", "No"]
        options_es: ["Sí, y todavía viene", "Sí, pero ya no viene", "No"]
        card_field: true
        why: "A home switching companies often needs no heavy first visit; a home never treated usually does. [judgment]"
      - id: fu_termite_signs
        ask_when: "She mentions flying ants, winged bugs, mud on a wall, wood damage or termites"
        text_en: "Have you seen any of these: thin mud tubes on a wall, piles of small wings, damaged or hollow wood, or small pellets like sand?"
        text_es: "¿Ha visto algo de esto: tubitos de lodo en una pared, montones de alitas, madera dañada o hueca, o bolitas como arena?"
        options_en: ["Mud tubes near the ground or foundation", "Mud high up under the roof edge", "Piles of small wings", "Damaged or hollow wood", "Small pellets like sand", "None of these"]
        options_es: ["Tubitos de lodo cerca del suelo o el cimiento", "Lodo arriba, bajo la orilla del techo", "Montones de alitas", "Madera dañada o hueca", "Bolitas como arena", "Nada de esto"]
        card_field: true
        why: "Tubes near the ground, wing piles, wood damage and pellets send a card to termite-category businesses; mud high under the eaves is often a wasp job instead. [judgment]"
    photos_priority: [p1]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Many pests inside every day", "Black widows near where children play"]
      regular: "Pests seen now and then, or a request for an ongoing plan"
    scope_line_en: "Ants in the kitchen and large roaches in the garage, seen most days; wants service every other month."
    scope_line_es: "Hormigas en la cocina y cucarachas grandes en la cochera, casi todos los días; quiere servicio cada dos meses."
    quote_format: monthly
    business_fills: ["monthly price, or price per visit with the visit schedule", "first-visit charge, if any", "inside, outside or both", "whether visits between scheduled ones are free", "earliest start"]
    card_template: |
      REQ-<id> | Pest control | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: what she sees, where, how often>
      Seeing: <pest answer, her words>. Where: <inside / outside / both>. How often: <once in a while / most days / every day>.
      Schedule wanted: <one-time / monthly / every other month / quarterly>. Home: <size band>. Current pest service: <yes / stopped / none / not said>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Those sound like German roaches.", "Quarterly is usually enough.", "Keep the kids and pets inside after they spray.", "Most companies charge about forty a month.", "Those flying ants aren't termites."]

  - id: scorpions
    label: "Scorpions: ongoing treatment, blacklight check"
    bank_job_type: "scorpions"
    recurring: true
    homeowner_phrasings: ["scorpions in the bathroom", "found one in the bed", "scorpion in the tub every night", "bark scorpions", "alacranes en la casa"]
    must_know:
      - fact: "How often scorpions show up inside, and where"
        bank_question: where
        follow_up: fu_seen_how_often
        photo: p1
        why_it_moves_price: "Several a week inside points to monthly service with inside work; one now and then may be a lighter plan. [judgment]"
        skip_if: "She gave a count and the rooms"
      - fact: "Yard features: block wall, rock, palms, wood or debris piles"
        bank_question: null
        follow_up: fu_yard_features
        photo: p6
        why_it_moves_price: "Hollow block walls are where scorpions prefer to hide, so they add treatment area and time."
        skip_if: "Yard photo shows the walls and ground"
      - fact: "Service schedule wanted"
        bank_question: how_often
        follow_up: null
        photo: null
        why_it_moves_price: "Sets the monthly figure. [judgment]"
        skip_if: "She named a schedule"
      - fact: "Home size"
        bank_question: home_size
        follow_up: null
        photo: null
        why_it_moves_price: "Perimeter, eaves and door count scale with size. [judgment]"
        skip_if: "Answered"
    allowed_follow_ups:
      - fu_seen_how_often
      - id: fu_yard_features
        ask_when: "Scorpion request and no yard photo"
        text_en: "Does the yard have any of these: a block wall, rock or gravel, palm trees, or wood or debris piles?"
