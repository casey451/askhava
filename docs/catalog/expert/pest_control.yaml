# Ask Hava expert layer: pest_control (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set pest_control and trade_kb/trades/pest_control.yaml. Fake data only.
# Ask Hava never diagnoses, names a pest, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# 1. termite_inspection (kb) is left out. A termite report for a sale or loan is the fee-free home_inspection job
#    type "termite report for a sale or loan" (LIC-015, FEE-045), and this file routes it there (fu_for_sale).
#    Open problem: under A.A.C. R3-8-307 and the Department's WDIIR guidance, only a certified applicator in the
#    wood-destroying organism category, employed by a pest-management business licensee, may complete a WDIIR.
#    home_inspection cards go to Board-certified home inspectors only, so the sale-report card may reach nobody
#    who can sign the report unless the inspector also works under a pest license. Needs a catalog decision
#    (for example a fee-free "termite report for a sale or loan" job type inside pest_control).
# 2. bees_wasps, pigeons_birds, bed_bugs_other and rodents (kb) map to "general pest service", the only bank job
#    type that fits, so their quote format is forced to monthly. Bee removal, bird exclusion and bed bug treatment
#    are one-time jobs; under REC-010 a quote with no period would bounce. Suggest adding one-time job types
#    ("bee removal", "bird exclusion", "bed bug treatment", "rodent trapping and sealing") to one_time_job_types,
#    quoted firm. The bank's "pest" question also has no bee, bird or bed bug option. Bird exclusion with no
#    pesticide may not need a Department license at all (kb open question, A.R.S. 3-3601).
# 3. The independent scenario file (scenarios/pest_control.yaml) expects all four of those kb job types here.
# 4. The bank's how_often question offers "One-time", but general pest service, scorpions and pre-emergent weed
#    control are not one_time_job_types, so a one-time quote for them would bounce under REC-010. Pre-emergent
#    is usually applied once or twice a year; REC-004 converts quarterly and yearly prices but names no
#    twice-a-year period.
# 5. The question set's photos are [p1, p2, p3]; p4 (solar panels), p5 (droppings) and p6 (rock yard) are not in
#    the set, so rodent, bird and weed cards miss their key photo. Suggest the app order photos by the job type's
#    photos_priority below (PROMPT_ASSEMBLY section 6) and widen the set's list.
