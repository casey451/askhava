        text_en: "Which of these have you seen: small bugs or dark spots on the mattress, bites only on ankles and legs, or bugs jumping in carpet or on a pet?"
        text_es: "¿Cuál de estas cosas ha visto: bichitos o manchas oscuras en el colchón, piquetes solo en tobillos y piernas, o bichos que brincan en la alfombra o en una mascota?"
        options_en: ["Bugs or dark spots on the mattress", "Bites only on ankles and legs", "Bugs jumping in carpet or on a pet", "Bites, nothing else seen"]
        options_es: ["Bichitos o manchas oscuras en el colchón", "Piquetes solo en tobillos y piernas", "Bichos que brincan en la alfombra o en una mascota", "Piquetes, no he visto nada más"]
        card_field: true
        why: "These are the facts a pest business uses to decide what to bring, recorded without naming the bug. [judgment]"
      - id: fu_pets_outside
        ask_when: "Bites or bugs indoors and she did not mention pets"
        text_en: "Do you have a dog or cat, and does it go outside?"
        text_es: "¿Tiene perro o gato, y sale afuera?"
        options_en: ["Yes, and it goes outside", "Yes, indoor only", "No pets"]
        options_es: ["Sí, y sale afuera", "Sí, solo adentro", "No tengo mascotas"]
        card_field: true
        why: "An outdoor pet is the fact that separates a flea job from a bed bug job for the business, without Ask Hava saying which. [judgment]"
