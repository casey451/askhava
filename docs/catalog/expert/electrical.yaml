business_side:
  how_they_get_customers: ["Repeat customers, word of mouth and realtor or inspector referrals", "Google Maps listing and reviews", "Google Local Services Ads and search ads", "Home-service marketplaces (Angi, HomeAdvisor, Thumbtack)", "Subcontract work for general contractors, HVAC and solar companies", "Truck signage and local Facebook groups [judgment]"]
