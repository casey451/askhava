      figure: "Meta about $52 per lead, SEO about $28 per lead, referrals $0 to $15 per lead; marketing-vendor figures"
      source: webtonic_electrical
      unverified: false
    - channel: "Shared marketplace leads (electricians)"
      figure: "Typically sold to more than one contractor; the fastest callback usually wins the job"
      source: elevarus_angi_lsa
      unverified: false
    - channel: "Lake Havasu City electricians specifically"
      figure: "No local figures found; a small market with fewer bidders may run below national marketing-vendor figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a lead that several other electricians also bought", "Homeowners who want free troubleshooting over the phone", "Wrong-area or fake requests", "Monthly fees whether or not jobs come", "Being ranked or reviewed by the site itself", "Small jobs (one outlet) priced like big ones"]
  what_makes_a_lead_worth_paying_for: ["A panel photo with the label before the first call", "Clear scope: device count, ceiling height, distance from the panel", "Home age and kind of place, so aluminum wiring or a manufactured home is no surprise", "Pay only when picked, nothing monthly", "Neighbors-have-power answer on no-power calls", "Permit-type work flagged up front"]
  their_words: ["service call", "trip charge", "troubleshoot", "change-out", "service upgrade", "load calc", "home run", "dedicated circuit", "pigtail", "GFCI", "AFCI", "tandem", "meter-main", "service drop", "mast", "fan-rated box", "old-work box", "fish the wall"]
  signup_objections:
    - objection: "Why pay $25 or more when Google already sends me calls?"
      answer: "You pay only when the homeowner picks your quote, and nobody else gets that job. There is nothing to join and nothing monthly. The fee is set by job size: $25, $75 or $199."
    - objection: "I can't price electrical without seeing it."
      answer: "You can quote a range and say what puts it at the high end. Most cards come with a panel photo, the home's age, a device count and the distance from the panel, so the range can be tight."
    - objection: "These sites send me people who want me to diagnose it on the phone."
      answer: "The homeowner sees your quote in writing and picks it before you talk. You get her contact details after the pick, with the job already scoped."
    - objection: "Will you rank me against other electricians?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license numbers and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "I don't want small outlet jobs."
      answer: "You choose your job types at sign-up and can change them any time. If you only want panels and new circuits, you only get those cards."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Do handymen get these cards too?"
      answer: "No. Electrical cards go only to businesses with an R-11 or CR-11 license, and hardwired smoke alarms and new circuits are never sent to handymen."
    - objection: "Does Ask Hava take a cut of the job?"
      answer: "No. It is one fixed introduction fee by job size, paid when you confirm a pick. It is never a share of the job."
  quote_tips_for_card: ["Give the low and high end and say what puts it at the high end", "Say whether permit and inspection fees are in the range", "Say if the range assumes open spaces in the panel", "Give your earliest arrival, and say if you take same-day no-power calls", "If you need another photo, like the meter or the inside of the panel door, say which"]
