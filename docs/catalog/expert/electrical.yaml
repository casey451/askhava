trade_brief:
  price_drivers:
    - driver: "Find-the-fault work (tripping, dead circuits, flicker, partial power) versus a known install (swap, fixture, new circuit)"
      why: "Troubleshooting is priced by the hour with a range because nobody knows the cause until the cover is off; an install is priced per device. The bank's what question splits these. [judgment]"
      source: null
    - driver: "Panel capacity and condition from the panel photo: main breaker size, open spaces, brand"
      why: "A new circuit into a 200 amp panel with open spaces is a short job; a full 100 amp panel, or an older brand where breakers are hard to source, turns it into a panel or sub-panel conversation. [judgment]"
      source: null
    - driver: "Permit-type work: panel change-out, electrical updates, rewires, PV, power to a small detached structure"
      why: "Lake Havasu City requires a permit for these, so the quote carries permit time, an inspection visit and, for a service change, utility coordination."
      source: lhc_permits
    - driver: "Wire run and access: distance from the panel, attic or no attic, ceiling height, trench to a detached garage, shed or spa"
      why: "Feet of wire, attic crawling in heat, tall ladders and trenching through rock or caliche are where labor hours go. [judgment]"
      source: null
    - driver: "Home age and wiring type: aluminum branch wiring, two-slot ungrounded outlets, cloth-covered wire"
      why: "Homes wired 1965 to the mid-1970s may have aluminum branch wiring, which changes how every device is connected; CPSC lists copper rewire, COPALUM and AlumiConn as repairs."
      source: cpsc_alwire
    - driver: "Code rules on replacement devices"
      why: "Under NEC 406.4(D) a replacement receptacle must add GFCI, AFCI, tamper-resistant or weather-resistant protection where the current code calls for it, so a simple swap can mean pricier devices or a breaker change."
      source: ecm_406_4d
    - driver: "How many devices or fixtures"
      why: "Per-device pricing drops with count once the electrician is on site; the bank's count question sets it. [judgment]"
      source: null
    - driver: "Same-day, after-hours or no-power call versus a scheduled visit"
      why: "Burning smells, no power in summer heat and dead AC circuits get same-day rates. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Aluminum branch wiring behind a routine outlet or switch swap"
      how_a_pro_spots_it: "Home built about 1965 to 1975; dull silver wire or AL marks if a device is pulled; warm faceplates or flicker in the homeowner's words"
      question_or_photo: home_age
      source: cpsc_alwire
    - condition: "Two-wire ungrounded circuits, so three-prong replacements need GFCI protection or a ground"
      how_a_pro_spots_it: "Two-slot outlets in the device photo; older home"
      question_or_photo: fu_prong
      source: ecm_406_4d
    - condition: "Panel full, no open spaces, tandem breakers, or an older brand (Federal Pacific, Zinsco) where parts are hard to find"
      how_a_pro_spots_it: "Panel photo with the door open and the label inside the door"
      question_or_photo: p1_panel
      source: cpsc_fpe
    - condition: "Ceiling box not rated for a fan, so a fan job needs a new box or brace"
      how_a_pro_spots_it: "A light there now rather than a fan; a box over 35 lb needs a weight marking and over 70 lb needs separate support"
      question_or_photo: fu_fixture_what
      source: ecm_fan_box
    - condition: "Fault on the utility's side (meter base, service line), not inside the house"
      how_a_pro_spots_it: "Neighbors out too, half the house out with big 240-volt items dead, lights that flicker in wind"
      question_or_photo: fu_neighbors_power
      source: null
    - condition: "Heat-damaged meter base or main lugs on a south or west wall"
      how_a_pro_spots_it: "Discoloration or melted plastic at the meter and panel in the outside photo"
      question_or_photo: p4_meter
      source: null
    - condition: "Manufactured home, where alterations must be done by a licensed or certified person and wiring methods differ"
      how_a_pro_spots_it: "Kind of place on the card; panel inside a hallway closet"
      question_or_photo: null
      source: ars_41_4047
    - condition: "A run to a detached garage, shed, spa or RV pad that needs a trench through rock or caliche, plus an Arizona 811 call"
      how_a_pro_spots_it: "Location photo shows a yard run; homeowner says detached or yard"
      question_or_photo: fu_run_distance
      source: ues_safety
  misdiagnosis_checks:
    - sounds_like: "breaker trips (trips when the AC starts)"
      might_be: "AC unit fault, a different category"
      one_question: fu_trip_when
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "breaker trips (trips only when the dryer runs)"
      might_be: "appliance fault, a different category"
      one_question: fu_trip_when
      if_other_route_to: {category: appliance_repair, job_type: "dryer"}
      source: null
    - sounds_like: "outlet repair (one dead outlet)"
      might_be: "breaker_tripping (a tripped GFCI or breaker that feeds several outlets)"
      one_question: fu_other_dead
      if_other_route_to: {category: electrical, job_type: "breaker trips"}
      source: null
    - sounds_like: "partial_power (half the house is out)"
      might_be: "utility-side loss at the meter or service line; the card carries the neighbors answer so the business can decide"
      one_question: fu_neighbors_power
      if_other_route_to: {category: electrical, job_type: "breaker trips"}
      source: ues_outage
    - sounds_like: "flicker_dim (lights dim when the AC starts)"
      might_be: "AC unit starting fault, a different category"
      one_question: fu_flicker_when
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "hardwired smoke alarm (chirping)"
      might_be: "a smoke or CO alarm sounding, which is on the 911 list and gets the fixed text first"
      one_question: fu_alarm_sound
      if_other_route_to: {category: electrical, job_type: "hardwired smoke alarm"}
      source: nfpa_smoke
    - sounds_like: "light fixture (outdoor string or holiday lights)"
      might_be: "plug-in light hanging, a different category"
      one_question: fu_outdoor_power
      if_other_route_to: {category: holiday_lights, job_type: "plug-in light hanging"}
      source: null
    - sounds_like: "outlet repair (outlet looks brown or felt hot)"
      might_be: "burning_sparks, on the 911 list when sparking or burning"
      one_question: danger
      if_other_route_to: {category: electrical, job_type: "outlet repair"}
      source: nfpa_electrical
  photo_reading:
    - photo_id: p1_panel
      reads: ["Brand on the label (Federal Pacific, Zinsco, Square D, Siemens, Eaton, GE)", "Main breaker size on the main handle", "Open spaces and tandem breakers", "Fuses instead of breakers", "Scorch marks, rust or water stains", "Any breaker in the middle or off position"]
      neutral_wording: "Panel label reads Zinsco, 100 amp main; no open spaces; one breaker handle sits in the middle position."
    - photo_id: p2_device
      reads: ["Two-slot or three-prong outlet", "GFCI test and reset buttons", "Brown or melted faceplate", "Fixture type and whether a fan or light is there now", "Loose or cracked device"]
      neutral_wording: "Two-slot outlet in the living room; faceplate shows brown marks around the left slot."
    - photo_id: p3_location
      reads: ["Distance and path to the panel", "Wall type (drywall, block, stucco)", "Yard run or attic access", "Ceiling height and slope"]
      neutral_wording: "Wants a 240-volt outlet on the far garage wall, about 30 ft from the panel; block wall."
    - photo_id: p4_meter
      reads: ["Overhead wire or underground service", "Meter and main breaker in one box", "Panel inside or outside", "Heat marks or rust at the meter base"]
      neutral_wording: "Meter and main breaker in one box on the west wall; underground service; paint faded around the box."
    - photo_id: p5_alarm
      reads: ["Wires on the back (hardwired) or battery only", "Date on the back label", "Smoke only or smoke and CO combo", "Brand and plug shape"]
      neutral_wording: "Hardwired smoke alarm with a wire plug on the back; label dated 2013."
  local_factors:
    - fact: "Lake Havasu City uses the 2023 NEC with local amendments: the service disconnect goes outside nearest the point of entrance, and NEC 230.85 is deleted"
      effect: "A change-out of an inside panel may raise where the main disconnect sits, which a pro will want to see in the meter photo. [judgment]"
      source: lhc_nec_amend
    - fact: "Panel change-outs, electrical updates, rewires, PV systems and power to small detached structures need a city permit"
      effect: "Pros price permit time and an inspection into these quotes; the card flags them as permit-type work"
      source: lhc_permits
    - fact: "The city amends pool and spa bonding to four points on the shell"
      effect: "Spa and hot tub circuit quotes include bonding work, so the card says if the spa is new or existing. [judgment]"
      source: lhc_nec_amend
    - fact: "UniSource is the electric utility; it warns against tampering with the meter and says to keep 15 ft from overhead lines"
      effect: "Service changes need UniSource for the disconnect and reconnect, and roof work near the service drop (swamp coolers, palms) is a factor in the quote. [judgment]"
      source: ues_safety
    - fact: "Arizona 811 must be called at least two working days before digging, under state law"
      effect: "Trenched runs to a shed, spa or yard lights add lead time before work starts"
      source: ues_safety
    - fact: "Summer AC load and monsoon storms bring trips, flicker, surges, outages and wet outdoor GFCIs"
      effect: "July to September tripping and no-power requests spike; the trip-when-it-rains answer matters on the card. [judgment]"
      source: null
    - fact: "Manufactured homes are common, and alterations to them must be done by a licensed or certified person"
      effect: "The card must say manufactured home so the business can decide; panels are often indoors in a hallway. [judgment on the panel location]"
      source: ars_41_4047
    - fact: "Seasonal residents return in fall to vacant homes"
      effect: "October and November bring chirping smoke alarms (10-year end of life, dead batteries) and tripped GFCIs found on arrival. [judgment]"
      source: nfpa_smoke
  seasonality:
    busy: "June to September (AC load, heat, monsoon outages and surges) and October to December (returning seasonal residents, alarm swaps, holiday lighting) [judgment]"
    slow: "January to March [judgment]"
    source: null

job_types:
  - id: burning_sparks
    label: "Burning smell, sparks, smoke, hot or melted outlet or panel"
    bank_job_type: "outlet repair"
    recurring: false
    homeowner_phrasings: ["outlet smells like burning plastic", "sparks when I plug in", "panel buzzing and smells hot", "switch plate melted"]
    must_know:
      - fact: "Whether anything is sparking, hot, buzzing or smoking now"
        bank_question: danger
        follow_up: fu_burn_stopped
        photo: null
        why_it_moves_price: "Sets same-day or scheduled and is the 911-list check; the code sends the fixed text, the card states the fact. [judgment]"
        skip_if: "Never skip the bank question; skip the follow-up when she said it stopped"
      - fact: "Where it was: outlet, switch, light, panel or meter"
        bank_question: what
        follow_up: fu_burn_where
        photo: p2_device
        why_it_moves_price: "A burned outlet is a device and maybe a short wire repair; a burned panel or meter base is a much bigger job and may involve UniSource. [judgment]"
        skip_if: "Her words name the spot"
      - fact: "Home age"
        bank_question: home_age
        follow_up: null
        photo: null
        why_it_moves_price: "A burned device in a home wired 1965 to the mid-1970s raises the aluminum wiring question for every other device."
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_burn_where
        ask_when: "Homeowner reports a burning smell, sparks or heat but not where"
        text_en: "Where did you notice it: an outlet, a switch, a light or fan, or the electrical panel or meter?"
        text_es: "¿Dónde lo notó: en un enchufe, un apagador, una lámpara o ventilador, o en el panel eléctrico o el medidor?"
        options_en: ["An outlet", "A switch", "A light or fan", "The panel or meter"]
        options_es: ["Un enchufe", "Un apagador", "Una lámpara o ventilador", "El panel o el medidor"]
        card_field: true
        why: "The spot sets the size of the job and whether the business brings panel parts. [judgment]"
      - id: fu_burn_stopped
        ask_when: "The danger answer was yes and she has not said whether it is still going on"
        text_en: "Is the smell, heat or sparking still happening now, or has it stopped?"
        text_es: "¿El olor, el calor o las chispas siguen ahora, o ya pararon?"
        options_en: ["Still happening", "It stopped"]
        options_es: ["Siguen", "Ya pararon"]
        card_field: true
        why: "A business taking urgent jobs wants to know if it is still active before it drives out. [judgment]"
    photos_priority: [p2_device, p1_panel, p4_meter]
    urgency:
      fire_dept_triggers: ["Sparking, smoke or a burning smell at an outlet, switch, light or panel"]
      urgent_capable_triggers: ["Smell or heat came back after it stopped", "Power is off to part of the home because of it"]
      regular: "A brown mark noticed on an old outlet with no heat, smell or sparks now"
    scope_line_en: "Bedroom outlet smelled like burning plastic last night and the faceplate is brown; it has stopped; nothing is plugged in."
    scope_line_es: "El enchufe de la recámara olía a plástico quemado anoche y la tapa está café; ya paró; no hay nada conectado."
    quote_format: range
    business_fills: ["low and high end of the range", "what puts it at the high end", "earliest arrival"]
    card_template: |
      REQ-<id> | Electrical | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: what was noticed, where, still happening or stopped>
      Spot: <outlet / switch / light or fan / panel or meter>. Now: <still happening / stopped>. Built: <home age answer>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That outlet is a fire hazard.", "It's probably a loose wire.", "Turn off that breaker and don't use it.", "Your panel is unsafe.", "That's a quick outlet swap."]

  - id: partial_power
    label: "Part of the home has no power; breaker won't reset"
    bank_job_type: "breaker trips"
    recurring: false
    homeowner_phrasings: ["half my house has no power", "kitchen outlets all dead", "breaker won't reset", "lights half bright", "AC and dryer don't work but lights do"]
    must_know:
      - fact: "What is out: a few outlets in one area, about half the house, or the big 240-volt items"
        bank_question: what
        follow_up: fu_what_is_out
        photo: null
        why_it_moves_price: "One dead circuit is a short troubleshooting visit; half the house or dead big items points toward the panel, the main or the utility side, a longer and pricier visit. [judgment]"
        skip_if: "Her words say which"
      - fact: "Whether neighbors have power"
        bank_question: null
        follow_up: fu_neighbors_power
        photo: null
        why_it_moves_price: "If the street is out, the visit may be wasted; the business wants this before it rolls a truck. [judgment]"
        skip_if: "She said the neighbors have power"
      - fact: "Panel brand, main size and any breaker out of position"
        bank_question: null
        follow_up: null
        photo: p1_panel
        why_it_moves_price: "Tells the business which breakers to bring and whether the panel is one where parts are hard to find. [judgment]"
        skip_if: "Panel photo sent"
      - fact: "Home age"
        bank_question: home_age
        follow_up: null
        photo: null
        why_it_moves_price: "Older homes carry older panels and wiring types that change the repair. [judgment]"
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_what_is_out
        ask_when: "Homeowner says part of the home has no power without saying what"
        text_en: "What is out: outlets or lights in one area, about half the house, or big items like the AC, dryer or range?"
        text_es: "¿Qué no funciona: enchufes o luces en un área, como la mitad de la casa, o aparatos grandes como el aire, la secadora o la estufa?"
        options_en: ["Outlets or lights in one area", "About half the house", "Big items like AC, dryer or range", "Lights work but look dim or half bright"]
        options_es: ["Enchufes o luces en un área", "Como la mitad de la casa", "Aparatos grandes como aire, secadora o estufa", "Las luces prenden pero se ven bajas"]
        card_field: true
        why: "Separates one circuit from a panel, main or utility-side fault without naming either. [judgment]"
      - id: fu_neighbors_power
        ask_when: "Half the house, the whole house, or the big items are out, or lights look dim"
        text_en: "Do your neighbors have power right now?"
        text_es: "¿Sus vecinos tienen luz ahora mismo?"
        options_en: ["Yes, they have power", "No, they're out too", "Don't know"]
        options_es: ["Sí, tienen luz", "No, también están sin luz", "No sé"]
        card_field: true
        why: "UniSource handles outages and the line to the meter; a business wants to know before it drives out."
      - id: fu_breaker_or_gfci
        ask_when: "Homeowner says something will not reset but not what"
        text_en: "Is it a breaker in the panel that won't reset, or an outlet with test and reset buttons?"
        text_es: "¿Es un breaker del panel que no se reinicia, o un enchufe con botones de prueba y reinicio?"
        options_en: ["A breaker in the panel", "An outlet with test and reset buttons", "Haven't found either"]
        options_es: ["Un breaker del panel", "Un enchufe con botones de prueba y reinicio", "No encontré ninguno"]
        card_field: true
        why: "A GFCI outlet in a garage, bath or outside often feeds other outlets; a breaker that will not reset is a different visit. [judgment]"
    photos_priority: [p1_panel, p4_meter]
