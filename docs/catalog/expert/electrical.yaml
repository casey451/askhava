# Ask Hava expert layer: electrical (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set electrical and trade_kb/trades/electrical.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - All 12 kb job types are kept. Six have no exact category job type and sit under the closest one:
#   burning_sparks -> "outlet repair" (a burning panel may suit "panel upgrade" businesses better);
#   partial_power, flicker_dim and whole_home_out -> "breaker trips" (the troubleshooting family);
#   rewire -> "new circuit" (branch-circuit work; it is permit work like a panel job);
#   outdoor_lighting -> "light fixture". A "troubleshooting" category job type would route these more cleanly.
# - The kb test message electrical_t07 sends EV chargers to the generator_ev trade, but no enabled category
#   serves generator_ev today, so EV charger circuits and generator inlets ride on new_circuit here.
# - Low-voltage yard lighting is in the R-21 scope (A.A.C. R4-9-103), but this category routes only to R-11,
#   so R-21 businesses never see those cards. Decide whether low-voltage-only lighting should also reach R-21.
# - Whole-home outages that are the utility's go to UniSource per the kb file; this file only puts the
#   neighbors answer on the card. The product rule for an outage with no card belongs in the intake flow.
# - Lake Havasu City deletes NEC 230.85 and requires the service disconnect outside (local amendment to
#   230.70(A)(1)). How the Building Division applies that on a panel change-out with an inside panel is not
#   confirmed; the effect lines say [judgment].
