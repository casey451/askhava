business_side:
  how_they_get_customers: ["Google Maps listing and reviews", "Repeat customers, realtors and word of mouth", "HVAC, roofing and pest control companies that pass along attic work [judgment]", "Utility weatherization program work through WACOG [judgment]", "Home-service marketplaces (Angi, HomeAdvisor, Thumbtack)", "Google search and Local Services Ads", "Door hangers and local Facebook groups after a hot month [judgment]"]
  customer_acquisition_benchmarks:
    - channel: "Shared marketplace requests (Angi, HomeAdvisor, Thumbtack), all home services"
      figure: "About $20 to $75 per request, with 5 to 12 contractors getting the same one (marketing-vendor figure, not trade-specific)"
      source: pipeline_construction_leads
      unverified: false
    - channel: "Angi and HomeAdvisor, general contracting and remodeling"
      figure: "About $40 to over $100 per request, sent to 3 to 8 other contractors at once (marketing-vendor figure; no insulation-only figure given)"
      source: valley_angi_cpl
      unverified: false
    - channel: "Google Local Services Ads, all home services"
      figure: "About $53 per request on average (marketing-vendor figure citing Searchlight Digital)"
      source: pipeline_construction_leads
      unverified: false
    - channel: "Google search ads, construction and contracting"
      figure: "About $165 per request on average (marketing-vendor figure citing LocaliQ)"
      source: pipeline_construction_leads
      unverified: false
    - channel: "Insulation contractors specifically"
      figure: "No insulation-specific figure found from a source worth citing"
      source: null
      unverified: true
    - channel: "Lake Havasu City insulation businesses"
      figure: "No local figures found; a small market with few R-40 shops may pay less than national vendor figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a request 5 other shops also bought", "Homeowners who want a per-foot price over the phone and never let anyone up in the attic", "Requests that turn out to be an AC problem", "Monthly fees whether or not jobs come", "Being ranked or reviewed by the site itself"]
  what_makes_a_lead_worth_paying_for: ["Square feet and add-or-remove stated", "A depth photo with a tape in it", "A wide attic photo from the hatch showing ducts, can lights and eaves", "Droppings, water or odd fill called out before they drive out", "Pay only when picked, nothing monthly", "Real town and timing"]
  their_words: ["top-up", "blow-in", "loose fill", "batts", "cellulose", "fiberglass", "R-38", "R-49", "settled depth", "baffles", "rafter vents", "can covers", "IC-rated", "hatch dam", "air sealing", "vacuum-out", "radiant barrier", "duct wrap", "vermiculite"]
  signup_objections:
    - objection: "Why pay a fee when I can get these jobs myself?"
      answer: "You pay only when the homeowner picks your quote. Nothing to join and nothing per month. The fee is set by job size: $25, $75 or $199."
    - objection: "I can't price an attic without going up there."
      answer: "Quote a range and say what puts it at the high end. Each card lists the area, add or remove, the depth she sees and what is on the attic floor, with photos when she sends them. Your final price can follow your look."
    - objection: "Half these calls are really AC problems."
      answer: "Before a card goes out, we ask whether cold air comes out of the vents when the AC runs. If it doesn't, the request goes to AC businesses instead."
    - objection: "Rat jobs need the pest guy first."
      answer: "The card says whether animals are still getting in. If they are, she also gets a pest control card, so you know where it stands before you quote."
    - objection: "How do I know these homeowners are serious?"
      answer: "Each request comes from a texted phone number we check, with a town, answers to the questions an insulation estimator asks, and photos when she has them. Her name and address go only to the business she picks."
    - objection: "What if I quote and don't get picked?"
      answer: "Then you pay nothing. The introduction fee is charged only when a homeowner picks your quote and you confirm."
    - objection: "Will you rank me against other shops?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license number and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "I only do attics, not walls or shops."
      answer: "You pick the job types you want at sign-up and change them any time. You get cards only for those."
    - objection: "What if she cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
  quote_tips_for_card: ["Name the target R-value or settled depth and the material", "Say whether baffles, can-light covers and a hatch dam are in the range", "For removal, say whether haul-away and sanitizing are included", "Give the earliest day and whether you start early in summer", "If you need a photo of something else, say which", "Your receipt will need coverage area, installed and settled thickness, R-value and bag count under the FTC rule"]
