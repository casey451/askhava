trade_brief:
  price_drivers:
    - driver: "Square feet of attic floor, wall or ceiling to cover"
      why: "Insulation is priced by area at a set depth; the bank's size answer is the first number an estimator writes down. [judgment]"
      source: null
    - driver: "Add over what is there, or remove it first"
      why: "Removal adds a vacuum truck or bagging crew, hauling and cleanup before any new material goes in, often doubling the labor. [judgment]"
      source: null
    - driver: "Depth there now against the target R-value"
      why: "DOE lists R-38 to R-49 for a zone 3 attic that already has 3 to 4 inches and R-49 to R-60 for an empty one; the gap sets the bag count."
      source: doe_insulation
    - driver: "Droppings, nests, water stains or a pebble-like fill in the old insulation"
      why: "Rodent waste brings protective gear and wet cleanup; vermiculite is treated as asbestos and may stop the job until it is handled."
      source: epa_vermiculite
    - driver: "Room to work: hatch size and spot, roof pitch, AC air handler and flex ducts across the attic floor"
      why: "A small closet hatch, a low tile-roof attic or ducts laid on the joists slow the crew and can mean a second opening. [judgment]"
      source: null
    - driver: "Prep before the blow: rafter baffles at the eaves, covers or dams at can lights and flues, sealing the hatch"
      why: "ENERGY STAR says never block soffit vents, keep insulation off non-IC cans and away from flues, and seal leaks first; each is a line item."
      source: energystar_diy
    - driver: "Site-built house or manufactured home"
      why: "Many manufactured homes have a shallow roof cavity with no walk-in attic, so the method and the gear change. [judgment]"
      source: null
    - driver: "Wall jobs: outside finish and stories"
      why: "Drilling and patching stucco, filling block cores or pulling siding are different jobs, and two stories add ladders or a lift. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Pebble-like gray-brown or silver-gold fill under newer insulation (looks like vermiculite)"
      how_a_pro_spots_it: "Loose granules in the close-up depth photo, often near the joists under a top layer; older home"
      question_or_photo: p2_existing_depth
      source: epa_vermiculite
    - condition: "Rodent droppings, nests and tunnels under a clean-looking top layer, which turns a top-up into a removal"
      how_a_pro_spots_it: "Dark specks or matted trails along the eaves in the close-up; pack rat or mouse mention in her words"
      question_or_photo: fu_animals_now
      source: ua_hantavirus
    - condition: "Older recessed can lights that are not rated for insulation contact and need covers or a 3 inch gap"
      how_a_pro_spots_it: "Metal cans with holes on top poking through the insulation in the wide attic photo; can lights in the ceiling below"
      question_or_photo: p1_attic_wide
      source: pnnl_non_ic
    - condition: "Soffit vents already buried, or no baffles, so a top-up would block attic airflow"
      how_a_pro_spots_it: "Insulation packed to the roof deck at the eaves in the wide photo; no daylight at the eave line"
      question_or_photo: p1_attic_wide
      source: energystar_diy
    - condition: "Gas water heater or furnace flue running through the attic that needs a metal dam"
      how_a_pro_spots_it: "Metal pipe rising through the attic floor in the wide photo; gas appliance in a closet below"
      question_or_photo: p1_attic_wide
      source: energystar_diy
    - condition: "Air handler, flex ducts and wiring laid across the joists, leaving no path to walk or blow from"
      how_a_pro_spots_it: "Ducts on top of the insulation and a unit near the hatch in the wide photo"
      question_or_photo: p1_attic_wide
      source: null
    - condition: "Insulation wet from a roof or AC drain leak that is still active"
      how_a_pro_spots_it: "Dark, matted or sagging patches in the close-up; ceiling stain below; recent storm in her words"
      question_or_photo: fu_wet_source
      source: null
    - condition: "Shallow roof cavity with no hatch, common on manufactured homes"
      how_a_pro_spots_it: "Low-slope metal or rolled roof in the outside photo; no hatch photo sent; manufactured home answer"
      question_or_photo: fu_home_type
      source: null
  misdiagnosis_checks:
    - sounds_like: "attic_top_up (house is hot, bills are high)"
      might_be: "ac_not_cooling (hvac kb), a different category"
      one_question: fu_ac_cooling
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "radiant_barrier_ventilation (some rooms too hot)"
      might_be: "sun through west or south windows, a solar screen job"
      one_question: fu_hot_where
      if_other_route_to: {category: solar_screens, job_type: "solar screens"}
      source: null
    - sounds_like: "attic_remove_replace (rats in the attic insulation)"
      might_be: "rodents still getting in (pest_control kb rodents)"
      one_question: fu_animals_now
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
    - sounds_like: "attic_remove_replace (wet insulation after a storm)"
      might_be: "roof leak still open (roofing kb leak_repair)"
      one_question: fu_wet_source
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "attic_remove_replace (wet insulation near the attic AC unit, no rain)"
      might_be: "AC drain leak (hvac kb), a different category"
      one_question: fu_wet_source
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "duct_insulation (ducts sweating, one room hot)"
      might_be: "ductwork_airflow (hvac kb): torn, loose or fallen ducts"
      one_question: fu_duct_want
      if_other_route_to: {category: hvac_repair, job_type: "duct repair"}
      source: null
    - sounds_like: "garage_shop_ceiling (garage is an oven)"
      might_be: "an uninsulated garage door, a garage door job"
      one_question: fu_garage_parts
      if_other_route_to: {category: garage_doors, job_type: "door replacement"}
      source: null
  photo_reading:
    - photo_id: p1_attic_wide
      reads: ["Loose fill, batts or bare joists", "Whether joist tops show above the insulation", "Air handler and flex ducts on the attic floor", "Can lights or junction boxes in the insulation", "Flue pipes", "Eave vents clear or buried", "Foil already on the rafters", "Roof pitch and headroom"]
      neutral_wording: "Loose fill about level with the joist tops, flex ducts lying on top, a metal flue pipe near the hatch."
    - photo_id: p2_existing_depth
      reads: ["Depth on the tape", "Fiberglass (pink, yellow, white) or cellulose (gray flakes)", "Pebble-like gray-brown or gold granules", "Droppings, nests, tunnels", "Water stains or matted patches"]
      neutral_wording: "Tape shows about 4 inches of yellow loose fill; dark specks along the eave side."
    - photo_id: p3_access
      reads: ["Hatch in a closet, hallway or garage", "Opening size", "Pull-down ladder or none", "Shelving or storage under the hatch"]
      neutral_wording: "Small hatch in the hallway closet ceiling, no ladder, shelves below."
    - photo_id: p4_house_outside
      reads: ["Stucco, block or siding", "One or two stories", "Tile, shingle, foam or metal roof", "Gable vents, roof vents or attic fan", "Manufactured home skirting"]
      neutral_wording: "Single-story stucco home, tile roof, gable vents at both ends."
    - photo_id: p5_garage_ceiling
      reads: ["Drywall ceiling or open rafters", "Metal building or framed", "Room above", "Opener and lights in the way", "Insulated garage door or not"]
      neutral_wording: "Open metal roof panels, no ceiling, two-car shop with a roll-up door."
    - photo_id: p6_ducts
      reads: ["Flex or metal duct", "Torn or missing wrap", "Drips or stains on or under the ducts", "Ducts sagging or apart at a joint"]
      neutral_wording: "Metal trunk duct with no wrap; flex runs with a torn outer jacket."
  local_factors:
    - fact: "Mohave County is declared climate zone 3, dry (3B)"
      effect: "DOE and code tables for zone 3 are the numbers businesses quote against; R-38 is the zone 3 ceiling level for new homes in Bullhead City's amended code"
      source: bhc_energy
    - fact: "Summer highs average 105 to 109 F from June to August"
      effect: "Attic crews work at first light in summer, so start dates stretch and the timing answer matters more [judgment]"
      source: lhc_climate
    - fact: "Monsoon runs June 15 to September 30 with outflow winds of 50 mph or more and dense dust"
      effect: "Dust blows in through attic vents and onto foil, and storm leaks wet insulation; wet-insulation requests come after storms [judgment]"
      source: nws_monsoon
    - fact: "Wood rats (pack rats) and deer mice carry Sin Nombre hantavirus, and the western deer mouse is more common in western Arizona"
      effect: "Rodent-soiled insulation is a removal job with protective gear and wet cleanup, never a top-up"
      source: ua_hantavirus
    - fact: "The city's permit page lists insulation in neither the permit nor the no-permit list"
      effect: "Whether a re-insulation job needs a permit is the business's call; the card never says either way [judgment]"
      source: lhc_permits
    - fact: "UniSource offers free attic, wall and duct insulation to income-qualifying electric customers through WACOG in Mohave County, and no attic insulation rebate"
      effect: "Some homeowners will already have asked about the program; Ask Hava never says who qualifies [judgment]"
      source: ues_weatherization
    - fact: "Manufactured homes are common and many have a shallow roof cavity with no walk-in attic"
      effect: "The card says manufactured home in the first line so businesses that do roof-cavity blowing can see it [judgment]"
      source: null
    - fact: "Seasonal residents and vacant second homes"
      effect: "Work is often done while the owner is away; access is arranged by the business after the pick, never on the card [judgment]"
      source: null
  seasonality:
    busy: "March to June, before the heat and when the first summer bill lands; a second bump in September and October [judgment]"
    slow: "December to February, and midday hours all summer [judgment]"
    source: null

job_types:
  - id: attic_top_up
    label: "Attic top-up (blown-in over existing insulation)"
    bank_job_type: "blown-in insulation"
    recurring: false
    homeowner_phrasings: ["blow more insulation in the attic", "attic looks thin", "can see the beams in the attic", "upstairs is so hot", "electric bill is crazy"]
    must_know:
      - fact: "Square feet of attic floor"
        bank_question: size
        follow_up: null
        photo: null
        why_it_moves_price: "Bags and hours scale with area. [judgment]"
        skip_if: "She gave the house size"
      - fact: "How deep the old insulation is, against the joist tops"
        bank_question: existing
        follow_up: fu_depth_now
        photo: p2_existing_depth
        why_it_moves_price: "Level with or below the joists means a full top-up; DOE's zone 3 target over 3 to 4 inches is R-38 to R-49."
        skip_if: "Depth photo with a tape sent"
      - fact: "What the old insulation is made of"
        bank_question: null
        follow_up: fu_old_material
        photo: p2_existing_depth
        why_it_moves_price: "Fiberglass or cellulose sets the top-up material; pebble-like fill may stop the job until it is handled. [judgment]"
        skip_if: "Close-up photo shows the material"
      - fact: "How the crew gets in and what is on the attic floor"
        bank_question: null
        follow_up: null
        photo: p3_access
        why_it_moves_price: "A small closet hatch or ducts across the joists slow the blow and may need a walkway. [judgment]"
        skip_if: "Hatch and wide attic photos sent"
      - fact: "Site-built house or manufactured home"
        bank_question: null
        follow_up: fu_home_type
        photo: p4_house_outside
        why_it_moves_price: "A shallow roof cavity is blown through the roof or ceiling, a different method. [judgment]"
        skip_if: "Her words or the outside photo say which"
    allowed_follow_ups:
      - id: fu_depth_now
        ask_when: "Top-up request, no depth photo, and she has seen the attic"
        text_en: "In the attic, is the old insulation below the tops of the wood beams on the floor, about level with them, or covering them?"
        text_es: "En el ático, ¿el aislamiento viejo está por debajo de las vigas de madera del piso, más o menos al nivel, o las cubre?"
        options_en: ["Below the beams", "About level", "Covering the beams", "Haven't looked"]
        options_es: ["Por debajo de las vigas", "Más o menos al nivel", "Cubre las vigas", "No he visto"]
        card_field: true
        why: "ENERGY STAR uses the joist tops as the quick depth check; it sets the bag count."
      - id: fu_old_material
        ask_when: "No close photo of the old insulation, or the photo is unclear"
        text_en: "What does the old insulation look like: fluffy pink, yellow or white, gray flakes like shredded paper, rolls or sheets, or small gray-brown or gold pebbles?"
        text_es: "¿Cómo se ve el aislamiento viejo: esponjoso rosa, amarillo o blanco, hojuelas grises como papel picado, rollos o láminas, o piedritas color café grisáceo o dorado?"
        options_en: ["Fluffy pink, yellow or white", "Gray flakes like paper", "Rolls or sheets", "Small gray-brown or gold pebbles", "Can't tell"]
        options_es: ["Esponjoso rosa, amarillo o blanco", "Hojuelas grises como papel", "Rollos o láminas", "Piedritas café grisáceo o doradas", "No sé"]
        card_field: true
        why: "Material sets the top-up method, and the pebble answer flags fill EPA treats as asbestos."
      - id: fu_home_type
        ask_when: "Her words and photos do not say whether it is a manufactured home"
        text_en: "Is it a site-built house or a manufactured home?"
        text_es: "¿Es una casa construida en el sitio o una casa prefabricada (manufacturada)?"
        options_en: ["Site-built house", "Manufactured home"]
        options_es: ["Casa construida en el sitio", "Casa prefabricada"]
        card_field: true
        why: "Many manufactured homes have no walk-in attic, so a different crew and method. [judgment]"
      - id: fu_ac_cooling
        ask_when: "She says the house is hot or bills are high and does not mention the AC"
        text_en: "When the AC runs, does cold air come out of the vents?"
        text_es: "Cuando el aire acondicionado está prendido, ¿sale aire frío de las rejillas?"
        options_en: ["Yes, cold air", "Air comes out but not cold", "Weak air or none", "No central AC"]
        options_es: ["Sí, aire frío", "Sale aire pero no frío", "Poco aire o nada", "No hay aire central"]
        card_field: true
        why: "Air that is not cold is an AC repair card, not an insulation card. [judgment]"
    photos_priority: [p2_existing_depth, p1_attic_wide, p3_access]
    urgency:
      fire_dept_triggers: ["Smoke, fire or sparks in the attic"]
      urgent_capable_triggers: []
      regular: "All top-up requests"
    scope_line_en: "Attic top-up over old loose fill about level with the joists; about 1,500 sq ft; single-story house."
    scope_line_es: "Agregar aislamiento soplado en el ático sobre el relleno viejo, más o menos al nivel de las vigas; unos 1,500 pies cuadrados; casa de un piso."
    quote_format: range
    business_fills: ["low and high price", "what the range covers (target R-value or settled depth, material, baffles and can-light covers)", "earliest day", "Range to be confirmed on site, if needed"]
    card_template: |
      REQ-<id> | Insulation | <town>, <general area> | <house / manufactured home>
      <one scope line: top-up, area, depth now>
      Area: <size answer>. Old insulation: <below / level with / covering the joists>, <material, neutral, from photo or answer>.
      Attic: <hatch spot and ladder, from photo>. On the attic floor: <ducts, air handler, can lights, flue, neutral> or <not visible>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["You need R-49 up there.", "That's vermiculite, it has asbestos.", "A top-up runs about a dollar a foot.", "Insulation will cut your bill in half.", "Your AC is fine, it's the insulation."]

  - id: attic_remove_replace
    label: "Attic removal and replace (rodent or water damage, old or flat insulation)"
    bank_job_type: "attic insulation"
    recurring: false
    homeowner_phrasings: ["rats in the attic insulation", "pack rat nest up there", "insulation got wet from the roof", "pull out the old insulation", "attic cleanout"]
    must_know:
      - fact: "Why it is coming out: droppings or nests, water, or flat and old"
        bank_question: existing
        follow_up: fu_animals_now
