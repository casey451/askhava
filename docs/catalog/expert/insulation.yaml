# Ask Hava expert layer: insulation (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set insulation and trade_kb/trades/insulation.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Mapping. The category has two job types (attic insulation, blown-in insulation); the kb has six.
#   attic_top_up and wall_blown_in -> "blown-in insulation" (both are blown-in work over or into what is there);
#   attic_remove_replace, radiant_barrier_ventilation, duct_insulation and garage_shop_ceiling -> "attic insulation".
#   Nearly every R-40 shop does both, so the split matters little for routing today. No kb job type was left out
#   and no new_job_type was needed.
# - garage_shop_ceiling has no clean home. A metal shop with open roof panels is not an attic job and often not
#   blown-in work (batts or spray foam). It sits under "attic insulation" because a garage ceiling with an attic
#   above is the common case. A "garage or shop insulation" job type would route it more cleanly.
# - Radiant barrier is R-40 by name, but cutting a new roof vent (R-42 roofing) and wiring a powered attic fan
#   (R-11 electrical) are [judgment] on class. Today these cards go to R-40 businesses only. Worth a license_map
#   look, or a split into "radiant barrier" (R-40) and "attic vents or fan" (R-42 / R-11).
# - Vermiculite: EPA says assume it holds asbestos, do not disturb it, and hire a professional asbestos contractor
#   before work that could disturb it. Whether an R-40 business may remove it, or only an asbestos abatement
#   contractor, is an open question (kb intake_notes). The card states only what the photo shows.
# - The bank set has three questions (where, size, existing). The kb's access (q5), wall finish (q6) and home type
#   (q7) are carried as follow-ups, but only one follow-up runs per request. Adding "site-built or manufactured
#   home" to the bank would free the follow-up for the job-specific question. The bank's "where" options also
#   lack Ducts and Radiant barrier; those requests answer "Attic".
# - Lake Havasu City's permit page lists insulation in neither the permit nor the no-permit list; whether a
#   re-insulation job needs a permit is unverified.
