wording_rules: 'Every answer keeps the rules: pay only on the pick, no monthly fee, fees $25/$75/$199 by job size, no ranking
  or rating, refund before contact, Ask Hava is not a contractor. Banned words and the AI-smell list apply (scripts/check_expert.py
  checks the source files).'
shared_answers:
- objection: What does it cost to join?
  answer: 'Nothing. There is no sign-up fee and nothing monthly. You pay a set introduction fee only when a homeowner picks
    your quote and you confirm: $25, $75 or $199 by job size.'
- objection: Do other businesses get the same job?
  answer: Every business that covers the job type gets the card, and each one quotes in its own words. The homeowner sees
    every quote and picks one. Only the business she picks pays, and only that business gets her contact details.
- objection: Do you rank or rate us?
  answer: No. Quotes are shown in the order they came in, with each business's name, license numbers and links to its own
    Google and Yelp pages. Ask Hava never scores, sorts or recommends a business.
- objection: What if the homeowner cancels after I pay?
  answer: If you have not spoken with the homeowner yet, the fee is refunded.
- objection: Do I have to quote every card?
  answer: No. Quote the ones you want. You pick the job types you take at sign-up and can change them any time, and you can
    pause with one word when you are busy.
- objection: Is Ask Hava a contractor or a middleman that marks up the job?
  answer: Neither. Ask Hava is not a contractor and does not perform, bid on or supervise work. It passes the homeowner's
    request to you and shows her your quote as you wrote it. You and the homeowner deal with each other directly.
- objection: How do I know the request is real?
  answer: Each request comes from a texted phone number we check, with the town, the answers to the questions a pro asks,
    and usually photos. Names and addresses are shared only with the business the homeowner picks.
