    - objection: What happens if the job turns out bigger than $1,000?
      answer: A handyman quote has to be the full job price under $1,000, labor and materials together. The quote form won't
        take one at $1,000 or more. Licensed businesses in this category can still quote the bigger job.
    - objection: Why pay $25 when I get plenty of work by word of mouth?
      answer: 'Keep your word of mouth. This is extra work you choose. You pay only when a homeowner picks your quote: $25
