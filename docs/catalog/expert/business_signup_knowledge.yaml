        the owner, or a renter, and whether the owner''s OK is confirmed. Names and addresses go only to the business the
        homeowner picks.'
    - objection: Will you put gate or lockbox codes on the card?
      answer: No. Codes and keys never go on a card. The homeowner gives them to the business she picks, on the call.
    - objection: Will you send me property management or rental work?
      answer: No. Ask Hava never sends rent collection, tenant finding or leasing requests.
    - objection: Do I need a license to sign up?
      answer: No state contractor license covers home watch visits, so Ask Hava does not ask for one. Lake Havasu City has
        its own business license rule for businesses working inside city limits. Any repair you spot goes out as its own request
        to the matching trade.
    - objection: Owners want to know I'm insured and bonded.
      answer: Your quote can say whether you carry liability insurance and a bond. The homeowner sees it with your name and
        review links. Ask Hava shows insurance as yes or no and does not check it.
    - objection: Will you rank me against other home watch businesses?
      answer: No. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business.
    - objection: What if the owner cancels before the first visit?
      answer: If you haven't spoken with the homeowner yet, the fee is refunded. After that the fee stands. It is a fixed
        introduction fee by job size, not a share of the job.
    quote_tips_for_card:
    - Give a price per visit and the monthly total for the schedule asked
    - Say what each visit includes and whether a dated photo report is sent
    - Say what you charge for storm call-outs and for meeting contractors
    - Say whether there is a minimum number of months
    - Say whether you carry liability insurance and a bond
    - Give the date of your first walk-through
