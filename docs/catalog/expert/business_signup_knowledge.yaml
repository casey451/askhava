      answer: No. Cleaning is not contractor work under Arizona law. Check with the city about a business license.
    - objection: I only do linens, not full cleans.
      answer: You pick the job types you want at sign-up and change them any time. You get cards only for those.
    - objection: How do I know these are real owners?
      answer: Each request comes from a phone number we check, with a town, photos and answers to the questions a turnover
        cleaner asks. The address goes only to the business the owner picks.
