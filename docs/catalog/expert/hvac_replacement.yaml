  what_they_dislike_about_lead_services: ["Paying for a replacement lead that 4 other shops also bought", "Homeowners who only want a price by phone for a system nobody has seen", "Tire-kickers collecting bids for an insurance claim or a home sale", "Monthly fees whether or not a job comes", "Being ranked or reviewed by the lead site"]
  what_makes_a_lead_worth_paying_for: ["Data plate photo with the refrigerant and age readable", "Home size, stories and unit location up front", "Like-for-like or a change stated, so they know about the permit", "Only pay when the homeowner picks them", "Real timing: stopped in July versus planning for spring"]
  their_words: ["change-out", "like-for-like", "tonnage", "SEER2", "matched system", "AHRI", "line set", "pad", "curb adapter", "crane lift", "gas pack", "air handler", "coil", "disconnect", "whip", "Manual J", "R-410A", "R-454B", "A2L"]
  signup_objections:
    - objection: "I don't quote a replacement without a load calc and a look at the ducts."
      answer: "Quote a range and say what your visit confirms. The card gives home size, stories, unit location, the data plate and whether she wants the same size or a change. You can narrow the price once you are on site."
    - objection: "What does it cost me on a replacement?"
      answer: "The fee is set by job size. Almost every replacement quote is over $1,500, so it is usually $199. You pay it only when the homeowner picks your quote and you confirm. Nothing to join, nothing per month."
    - objection: "I'm already paying for shared replacement calls that go nowhere."
      answer: "Here nobody pays to see a card. You quote in your own words, and you pay only if she picks you. No other business gets her contact details."
    - objection: "Homeowners just collect three bids and pick the cheapest."
      answer: "She sees every quote in the order it came in, with each business's name, license numbers and review links. Ask Hava never sorts or ranks them. A quote that lists brand, size, refrigerant and what is included gives her more than a price."
    - objection: "Do I need a particular license to get these cards?"
      answer: "Cards go only to businesses whose Arizona contractor license covers the work, such as R-39. You choose the job types you want at sign-up and can change them any time."
    - objection: "I only do change-outs, not new ducts or mini-splits."
      answer: "Pick the job types you want. You get cards only for those."
    - objection: "What if she picks me and then backs out?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Will you push financing or brands on my customers?"
      answer: "No. Ask Hava never mentions brands, prices or financing to the homeowner. Your quote is in your words."
  quote_tips_for_card: ["List brand, tonnage, SEER2 and refrigerant", "Say what the range includes: permit, line set, pad or curb, thermostat, crane, haul-away", "Say what your visit confirms before the final price", "Give your earliest install day", "If you need a photo of the indoor unit or panel, say which"]
