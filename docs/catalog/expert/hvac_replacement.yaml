      - fu_like_for_like
      - id: fu_home_type
        ask_when: "Kind of place is not clear from her words"
        text_en: "Is the home a site-built house, a manufactured home, or a condo or townhome?"
        text_es: "¿La casa es construida en sitio, una casa manufacturada, o un condominio o casa adosada?"
        options_en: ["Site-built house", "Manufactured home", "Condo or townhome"]
        options_es: ["Casa construida en sitio", "Casa manufacturada", "Condominio o casa adosada"]
        card_field: true
        why: "Manufactured home alterations must be done by a licensed or certified person, and duct layouts differ; condos may have HOA rules on roof equipment. [judgment]"
    photos_priority: [p2_whole_unit, p1_data_plate]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Unit has stopped and the home has no cooling in summer"]
      regular: "Unit still running; planning a replacement"
    scope_line_en: "Replace the rooftop gas pack on a flat roof; street-side; 1,800 sq ft, one story; label shows R-22."
    scope_line_es: "Cambiar la unidad de gas del techo plano; del lado de la calle; 1,800 pies², un piso; la etiqueta dice R-22."
    quote_format: range
