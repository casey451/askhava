trade_brief:
  price_drivers:
    - driver: "What is being replaced: outdoor unit only, a full split system, a rooftop package unit, or a new install where there was none"
      why: "Each step adds equipment and labor; a new install adds ducts, a line set, a pad or curb and a circuit. [judgment]"
      source: null
    - driver: "Size of the home (tonnage) and the efficiency level of the new equipment"
      why: "Tonnage sets the equipment price; new split AC installed in the Southwest must meet at least 14.3 SEER2 and an EER2 floor, so the old efficiency level cannot be reinstalled."
      source: doe_cac_2023
    - driver: "Where the unit sits: flat roof, sloped roof, two stories up, ground, attic or closet"
      why: "A rooftop package unit usually needs a crane and a curb adapter; an attic air handler adds hours in summer heat. [judgment]"
      source: null
    - driver: "Same kind, size and spot, or a change (bigger, smaller, heat pump, new spot)"
      why: "Lake Havasu City needs no permit for a replacement that keeps unit weight, capacity, location and ampacity; any change needs a permit, and a size change calls for a load calculation."
      source: lhc_permits
    - driver: "Refrigerant on the old unit (R-22, R-410A) and on the new one (R-410A from older stock, R-454B or R-32)"
      why: "There is no drop-in for R-22, so an R-22 system usually means matching the inside coil and often the line set; the refrigerant change also moves equipment prices and supply."
      source: epa_r22
    - driver: "How the home heats: heat pump, gas furnace or gas pack, electric heat strips"
      why: "Gas means a gas connection and a flue; heat strips add amps; a heat pump changes the outdoor unit and the thermostat. [judgment]"
      source: null
    - driver: "Ducts and electrical: duct condition and size, disconnect, breaker and wire size, panel space"
      why: "Ducts that are crushed, leaky or undersized, or a panel with no room, turn a change-out into a bigger job or a second trade. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Old R-22 inside coil or air handler left in place behind a new outdoor unit"
      how_a_pro_spots_it: "Refrigerant on the outdoor data plate reads R-22; the indoor unit label shows the same age"
      question_or_photo: p1_data_plate
      source: epa_r22
    - condition: "Panel full, too small, or an old brand that an electrician must replace; R-39 may add a circuit but not a new panel or sub-panel"
      how_a_pro_spots_it: "Panel photo with the door open: main breaker size, open spaces, brand label"
      question_or_photo: p8_panel
      source: aac_r4_9_103
    - condition: "Roof curb does not fit the new package unit, or the roof under the old unit is soft or leaking"
      how_a_pro_spots_it: "Whole-unit photo shows the curb, rust at the base, patched roof around it; home age"
      question_or_photo: p2_whole_unit
      source: null
    - condition: "Ducts in a hot attic that are crushed, torn, rodent-chewed or too small for the new system"
      how_a_pro_spots_it: "Indoor unit photo shows the plenum and duct connections; home age; swamp-cooler ducts in a conversion"
      question_or_photo: p3_indoor_unit
      source: null
    - condition: "Size or spot change that triggers a permit and a load calculation"
      how_a_pro_spots_it: "Homeowner wants a bigger unit, a heat pump with a different footprint, or the unit moved"
      question_or_photo: fu_like_for_like
      source: lhc_permits
    - condition: "Manufactured home, where alterations must be done by a licensed or certified person and duct layouts differ"
      how_a_pro_spots_it: "Kind of place on the card; a ground package unit with a crossover duct under the home"
      question_or_photo: fu_home_type
      source: ars_41_4047
    - condition: "Line set buried in a wall or slab, too long, or with sun-rotted insulation"
      how_a_pro_spots_it: "Whole-unit photo shows where the copper lines enter the house and the state of the foam"
      question_or_photo: p2_whole_unit
      source: null
    - condition: "Attic air handler with a rusted drain pan, soft platform or no secondary drain"
      how_a_pro_spots_it: "Indoor unit photo: rust, water stains, the pan under the unit"
      question_or_photo: p3_indoor_unit
      source: null
  misdiagnosis_checks:
    - sounds_like: "full system replacement (AC stopped or blows warm)"
      might_be: "ac_not_cooling"
      one_question: fu_fix_or_replace
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "condenser replacement"
      might_be: "ac_replacement (outdoor and indoor units together, common when the old system runs R-22)"
      one_question: fu_what_to_replace
      if_other_route_to: {category: hvac_replacement, job_type: "full system replacement"}
      source: epa_r22
    - sounds_like: "full system replacement (new ducts)"
      might_be: "ductwork_airflow"
      one_question: fu_what_to_replace
      if_other_route_to: {category: hvac_repair, job_type: "duct repair"}
      source: null
    - sounds_like: "full system replacement (the unit on the roof)"
      might_be: "evaporative cooler replacement, a different trade file"
      one_question: system_type
      if_other_route_to: {category: hvac_repair, job_type: "evaporative (swamp) cooler repair"}
      source: null
    - sounds_like: "full system replacement (new heater or furnace)"
      might_be: "heat_not_working"
      one_question: fu_fix_or_replace
      if_other_route_to: {category: hvac_repair, job_type: "furnace repair"}
      source: null
    - sounds_like: "full system replacement (new AC for the garage or casita)"
      might_be: "mini_split_install"
      one_question: fu_mini_rooms
      if_other_route_to: {category: hvac_replacement, job_type: "full system replacement"}
      source: null
  photo_reading:
    - photo_id: p1_data_plate
      reads: ["Brand, model and serial (build year)", "Refrigerant type (R-22, R-410A, R-454B, R-32)", "Tonnage hint in the model number", "MCA and max breaker amps", "Heat pump or AC only"]
      neutral_wording: "Data plate readable: refrigerant R-22 shown, model number suggests 3 tons, serial suggests about a 2006 build."
    - photo_id: p2_whole_unit
      reads: ["Package unit, split condenser or heat pump", "Roof curb and roof around it", "Disconnect box and whip", "Line set path and insulation", "Gas line to a gas pack", "Pad or stand on the ground"]
      neutral_wording: "Package unit on a flat roof on a metal curb; gas pipe runs to the unit; roof coating around the curb looks patched."
    - photo_id: p3_indoor_unit
      reads: ["Air handler or gas furnace", "Indoor label and age", "Drain pan, rust, water stains", "Plenum and duct connections", "Closet or attic and how much room around it"]
      neutral_wording: "Air handler in a hall closet; label shows the same brand as the outside unit; rust stain on the pan."
    - photo_id: p8_panel
      reads: ["Main breaker size", "Open spaces", "Panel brand", "Existing AC breaker size"]
      neutral_wording: "Panel label reads 125 amps; two open spaces at the bottom; a 40 amp double breaker is marked AC."
    - photo_id: p6_minisplit_spot
      reads: ["Wall type (block, stucco, frame)", "Outdoor spot and surface", "Line set path and distance", "Outlet or panel nearby"]
      neutral_wording: "Garage back wall is block; outdoor spot is gravel about 10 feet away on the other side of the wall."
  local_factors:
    - fact: "Average highs are about 105 F in June, 109 F in July and 108 F in August (1991 to 2020 normals)"
      effect: "A stopped system in summer turns a planned change-out into a next-day install; equipment runs long hours in high outdoor heat"
      source: lhc_climate
    - fact: "Lake Havasu City needs no permit to replace an existing AC without increasing unit weight, capacity, location or ampacity; the city has adopted the 2024 I-codes and the 2023 NEC"
      effect: "Like-for-like quotes skip the permit; a size, heat-pump footprint or location change carries a permit and inspection"
      source: lhc_permits
    - fact: "New split AC installed in the Southwest region since Jan 1, 2023 must meet at least 14.3 SEER2 (under 45,000 Btu/h) and an EER2 floor"
      effect: "An old 10 or 13 SEER system is replaced with newer-standard equipment, which shapes every quote"
      source: doe_cac_2023
    - fact: "EPA's May 2026 rule lets residential AC and heat pump equipment made or imported before Jan 1, 2025 be installed until supplies run out"
      effect: "Quotes may offer R-410A stock or newer R-454B or R-32 equipment; the refrigerant belongs on the quote"
      source: achr_410a_deadline
    - fact: "Manufactured home alterations must be done by a licensed or certified person"
      effect: "Businesses want the home type on the card; ground package units with crossover ducts are common in parks [judgment]"
      source: ars_41_4047
    - fact: "The federal 25C credit covered property placed in service before Dec 31, 2025"
      effect: "Homeowners may still ask about it; the card never mentions credits or rebates"
      source: irs_25c
    - fact: "Many homes use rooftop package units or gas packs, and many older homes are swamp-cooled"
      effect: "Crane and curb-adapter questions and cooler-to-AC conversions come up more here than in most markets [judgment]"
      source: null
    - fact: "Second homes sit empty in summer; owners request replacements from out of town"
      effect: "The card should say whether someone local can let a tech in; never collect lockbox or gate codes [judgment]"
      source: null
    - fact: "Bullhead City, Kingman and unincorporated Mohave County may have different permit rules for replacements"
      effect: "Do not assume the Lake Havasu City no-permit rule applies outside the city"
      source: null
      unverified: true
  seasonality:
    busy: "May to September, with the first 105 F week bringing a rush of stopped-system replacements; planned replacements cluster in March to April and October [judgment]"
    slow: "November to February [judgment]"
    source: null

job_types:
  - id: ac_replacement
    label: "Replace a whole split system (outdoor unit plus air handler or furnace), including a switch to a heat pump"
    bank_job_type: "full system replacement"
    recurring: false
    homeowner_phrasings: ["new ac unit", "replace the whole system", "ac is old need new", "quote for new hvac", "upgrade to heat pump", "r22 unit replace"]
    must_know:
      - fact: "What is there now and which parts to replace"
        bank_question: system_type
        follow_up: fu_what_to_replace
        photo: p1_data_plate
        why_it_moves_price: "Outdoor only, both units, or ducts too are three different equipment lists. [judgment]"
        skip_if: "Homeowner said the whole system"
      - fact: "Home size and stories"
        bank_question: home_size
        follow_up: null
        photo: null
        why_it_moves_price: "Sets tonnage, which sets the equipment price; the business confirms with its own load calculation. [judgment]"
        skip_if: "Never skipped; stories is a separate bank question"
      - fact: "Same kind, size and spot, or a change"
        bank_question: null
        follow_up: fu_like_for_like
        photo: null
        why_it_moves_price: "A change in weight, capacity, location or ampacity needs a Lake Havasu City permit."
        skip_if: "Homeowner said same size, same spot"
      - fact: "Refrigerant and age of the current system"
        bank_question: null
        follow_up: null
        photo: p1_data_plate
        why_it_moves_price: "R-22 has no drop-in replacement, so line set and coil reuse depend on it. [judgment]"
        skip_if: "No photo possible; the card says so"
      - fact: "How the home heats now"
        bank_question: null
        follow_up: fu_heat_source
        photo: p3_indoor_unit
        why_it_moves_price: "Gas furnace, heat strips or heat pump each change the indoor unit and hookups. [judgment]"
        skip_if: "Indoor photo shows a gas furnace, or the homeowner said heat pump"
    allowed_follow_ups:
      - id: fu_fix_or_replace
        ask_when: "Her words could mean a repair (it stopped, it blows warm, the heater quit) and she did not say she wants a new system"
        text_en: "Are you asking for quotes on a new system, or for someone to look at the one you have first?"
        text_es: "¿Busca cotizaciones de un sistema nuevo, o que alguien revise primero el que tiene?"
        options_en: ["Quotes on a new system", "Look at it first", "Both, I want options"]
        options_es: ["Cotizaciones de un sistema nuevo", "Que lo revisen primero", "Las dos, quiero opciones"]
        card_field: true
        why: "Her choice, never ours. Look-first is a repair visit in hvac_repair with a different quote format. [judgment]"
      - id: fu_what_to_replace
        ask_when: "Split system (outside unit plus inside unit) and she did not say which parts to replace"
        text_en: "Which parts do you want quoted: the outside unit only, the outside and inside units together, or the ducts only?"
        text_es: "¿Qué partes quiere cotizar: solo la unidad de afuera, la de afuera y la de adentro juntas, o solo los ductos?"
        options_en: ["Outside unit only", "Outside and inside units", "Ducts only", "Open to quotes on either unit option"]
        options_es: ["Solo la unidad de afuera", "La de afuera y la de adentro", "Solo los ductos", "Acepto cotizaciones de cualquiera de las dos"]
        card_field: true
        why: "Separates condenser replacement, full system replacement and duct work, which route differently. [judgment]"
      - id: fu_like_for_like
        ask_when: "Any replacement where she did not say whether size, kind or spot changes"
        text_en: "Do you want the same kind and size of system in the same spot, or a change?"
        text_es: "¿Quiere el mismo tipo y tamaño de sistema en el mismo lugar, o un cambio?"
        options_en: ["Same kind, size and spot", "Switch to a heat pump", "Bigger or smaller", "Move it to a new spot", "Not decided"]
        options_es: ["Mismo tipo, tamaño y lugar", "Cambiar a bomba de calor", "Más grande o más chico", "Moverlo a otro lugar", "No lo he decidido"]
        card_field: true
        why: "Lake Havasu City needs a permit when unit weight, capacity, location or ampacity change; the business prices the permit in."
      - id: fu_heat_source
        ask_when: "She did not say how the home heats and no indoor photo shows it"
        text_en: "How does the home heat now?"
        text_es: "¿Cómo se calienta la casa ahora?"
        options_en: ["Same system (heat pump)", "Gas furnace or gas pack", "Electric heat in the unit", "Wall or baseboard heaters", "No heat"]
        options_es: ["El mismo sistema (bomba de calor)", "Calentón de gas o unidad de gas", "Calor eléctrico en la unidad", "Calentadores de pared o zoclo", "No tiene calefacción"]
        card_field: true
        why: "Gas adds a gas connection and flue; heat strips add amps; each changes the equipment list. [judgment]"
    photos_priority: [p1_data_plate, p3_indoor_unit, p2_whole_unit]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Current system has stopped and the home has no cooling in summer"]
      regular: "Old system still running; planning a replacement"
    scope_line_en: "Replace the whole split system, outside unit and hall-closet air handler; R-22 on the label; 1,600 sq ft, one story."
    scope_line_es: "Cambiar todo el sistema dividido, la unidad de afuera y la manejadora de aire del clóset del pasillo; R-22 en la etiqueta; 1,600 pies², un piso."
    quote_format: range
    business_fills: ["price range", "equipment brand, size and refrigerant", "what is included (permit, line set, pad, thermostat, haul-away)", "earliest install day"]
    card_template: |
      REQ-<id> | Heating and cooling replacement | <town>, <general area> | <kind of place>
      <one scope line: what to replace, what is there now, size>
      Now: <central AC / heat pump / package unit>. Replace: <outside only / outside and inside / ducts only>. Change: <same kind and spot / heat pump / size / new spot / not decided>.
      Home: <size band>, <stories>. Units at: <roof / ground / attic or closet>. Heat: <heat pump / gas / electric / wall heaters / none>.
      Data plate: <brand, refrigerant, build year, neutral, from photo> or <no photo>. Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Your system is too old to fix.", "R-22 units have to be replaced now.", "A new 3-ton system runs about nine thousand.", "You need a bigger unit.", "Heat pumps are cheaper to run here.", "You'll still get a tax credit for this."]

  - id: condenser_replacement
    new_job_type: true
    label: "Replace only the outdoor unit (condenser or heat pump) of a split system"
    bank_job_type: "condenser replacement"
    recurring: false
    homeowner_phrasings: ["change out condenser", "replace the outside unit", "new compressor unit", "outside ac unit died"]
    must_know:
      - fact: "That only the outdoor unit is to be replaced"
        bank_question: system_type
        follow_up: fu_what_to_replace
        photo: p2_whole_unit
        why_it_moves_price: "An outdoor-only quote has to match the existing inside coil; if it cannot, the job becomes a full system. [judgment]"
        skip_if: "Homeowner said outside unit only"
      - fact: "Refrigerant and age of both the outdoor and indoor units"
        bank_question: null
        follow_up: null
        photo: p1_data_plate
        why_it_moves_price: "There is no drop-in for R-22; an R-22 indoor coil cannot simply be kept with newer-refrigerant equipment."
        skip_if: "No photo possible; the card says so"
      - fact: "Whether the current unit still runs"
        bank_question: null
        follow_up: fu_running_now
        photo: null
        why_it_moves_price: "A stopped unit in summer is a next-day install with a stocked unit, scheduled differently. [judgment]"
        skip_if: "Her words already say it stopped or still runs"
      - fact: "Home size"
        bank_question: home_size
        follow_up: null
        photo: p1_data_plate
        why_it_moves_price: "Confirms whether the current tonnage stays; a capacity change needs a city permit. [judgment]"
        skip_if: "Never skipped"
    allowed_follow_ups:
      - fu_what_to_replace
      - id: fu_running_now
        ask_when: "She wants a unit replaced and did not say whether the current one still cools"
        text_en: "Is the system you have still cooling, or has it stopped?"
        text_es: "¿El sistema que tiene todavía enfría, o ya dejó de funcionar?"
        options_en: ["Still cooling", "Running but not keeping up", "Stopped"]
        options_es: ["Todavía enfría", "Prende pero no alcanza a enfriar", "Dejó de funcionar"]
        card_field: true
        why: "Sets timing and stock: a stopped unit in summer heat is a next-day install request. [judgment]"
      - fu_like_for_like
      - fu_fix_or_replace
    photos_priority: [p1_data_plate, p3_indoor_unit, p2_whole_unit]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Current unit has stopped and the home has no cooling in summer"]
      regular: "Unit still runs; planning a change-out"
