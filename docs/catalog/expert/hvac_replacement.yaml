  - id: package_unit_replacement
    label: "Replace a rooftop or ground package unit (cooling and heat in one box, may need a crane and curb adapter)"
    bank_job_type: "full system replacement"
    recurring: false
    homeowner_phrasings: ["rooftop unit", "roof top ac replacement", "package unit", "gas pack replace", "crane for ac"]
    must_know:
      - fact: "Where the unit sits and roof type"
        bank_question: unit_location
        follow_up: null
        photo: p2_whole_unit
