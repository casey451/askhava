        skip_if: "Answered"
      - fact: "Gas or electric heat in the unit"
        bank_question: null
        follow_up: fu_heat_source
        photo: p1_data_plate
        why_it_moves_price: "A gas pack needs the gas connection redone and a different unit than a heat pump package. [judgment]"
        skip_if: "Data plate or her words say gas pack or heat pump"
      - fact: "Where a crane or truck can set up"
        bank_question: null
        follow_up: fu_crane_access
        photo: null
        why_it_moves_price: "Crane size and setup time depend on how far the unit sits from the street. [judgment]"
        skip_if: "Ground unit"
      - fact: "Home size and stories"
        bank_question: home_size
        follow_up: null
        photo: null
        why_it_moves_price: "Sets tonnage; two stories adds crane reach. [judgment]"
        skip_if: "Never skipped"
    allowed_follow_ups:
      - id: fu_crane_access
        ask_when: "Unit is on the roof and she did not say which side of the house"
        text_en: "Can a truck park close to the side of the house where the roof unit sits?"
        text_es: "¿Puede estacionarse un camión cerca del lado de la casa donde está la unidad del techo?"
        options_en: ["Yes, street or driveway side", "Side yard behind a wall or gate", "Over the back of the house"]
        options_es: ["Sí, del lado de la calle o la entrada", "Patio lateral detrás de una barda o reja", "Del lado de atrás de la casa"]
        card_field: true
        why: "Crane reach decides crane size and setup time. [judgment]"
