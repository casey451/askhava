# Ask Hava expert layer: hvac_replacement (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set hvac_replacement and trade_kb/trades/hvac.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The hvac kb file also serves hvac_repair. Only its replacement-type job types are here:
#   ac_replacement, package_unit_replacement, mini_split_install. All other hvac kb job types
#   (ac_not_cooling, ac_not_turning_on, ac_leaking_water, ac_noise_smell, heat_not_working,
#   heat_pump_issue, mini_split_repair, ac_maintenance, thermostat_issue, ductwork_airflow)
#   belong to hvac_repair and are left out on purpose.
# - new_job_type condenser_replacement: the kb's ac_replacement covers "whole system or the
#   outdoor unit" in one id, but the category routes two job types. ac_replacement carries
#   "full system replacement"; the outdoor-unit-only change-out gets its own id so
#   "condenser replacement" has a home.
# - new_job_type cooler_to_central_ac: a home with a swamp cooler or no cooling that wants
#   refrigerated central air. The bank's system_type question already offers "Swamp cooler"
#   and "Nothing yet", and these quotes differ sharply (ducts, roof, electrical). It overlaps
#   evaporative_coolers.yaml cooler_remove_convert, which hvac_repair routes; review which
#   category should own the conversion.
# - mini_split_install routes to "full system replacement" because the category has no
#   "new install" job type. A category job type "mini-split install" may be cleaner.
# - Furnace-only replacement has no kb job type and no category job type here; it falls to
#   hvac_repair "furnace repair" through fu_fix_or_replace, or to full system replacement.
# - photos_priority uses kb photos p6_minisplit_spot and p8_panel, which the question bank's
#   3-photo list for this set does not include. Consider adding them to the set.
