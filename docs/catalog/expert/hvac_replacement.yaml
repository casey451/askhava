      Home: <size band>, <stories>. Change: <same kind and spot / heat pump / size / not decided>.
      Data plate: <brand, refrigerant, build year, from photo> or <no photo>. Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
