  - id: mini_split_install
    label: "Install a new ductless mini-split (garage, casita, shop, add-on room, or several rooms)"
    bank_job_type: "full system replacement"
    recurring: false
    homeowner_phrasings: ["mini split install", "ductless for garage", "minisplit", "wall unit ac for casita", "ac for my shop"]
    must_know:
      - fact: "How many rooms or spaces to cool"
        bank_question: null
        follow_up: fu_mini_rooms
        photo: null
        why_it_moves_price: "Each indoor head adds equipment, a line set and labor. [judgment]"
        skip_if: "Homeowner named the rooms"
      - fact: "Distance between the indoor spot and the outdoor spot"
        bank_question: null
        follow_up: fu_mini_distance
        photo: p6_minisplit_spot
        why_it_moves_price: "Line-set length, wall type and cover sets labor hours. [judgment]"
        skip_if: "Spot photo shows both sides"
      - fact: "Panel space for a new circuit"
        bank_question: null
        follow_up: null
        photo: p8_panel
        why_it_moves_price: "R-39 may add a circuit to the existing panel; a full panel means an electrician and a second quote."
        skip_if: "Panel photo sent"
      - fact: "Space size and insulation"
        bank_question: home_size
        follow_up: fu_space_insulated
        photo: null
        why_it_moves_price: "An open garage or shop needs more capacity than a finished room of the same size. [judgment]"
        skip_if: "Her words say finished room and size"
    allowed_follow_ups:
      - id: fu_mini_rooms
        ask_when: "Mini-split or new AC for part of the home, and the number of rooms is not given"
        text_en: "How many rooms or spaces should the mini-split cool?"
        text_es: "¿Cuántos cuartos o espacios debe enfriar el minisplit?"
        options_en: ["One room or garage", "Two rooms", "Three or more rooms", "The whole house"]
        options_es: ["Un cuarto o la cochera", "Dos cuartos", "Tres cuartos o más", "Toda la casa"]
        card_field: true
        why: "Sets the number of indoor heads and separates a one-room install from whole-house work. [judgment]"
      - id: fu_mini_distance
        ask_when: "No spot photo, or it does not show both sides of the wall"
        text_en: "About how far is the inside spot from where the outside unit would sit?"
        text_es: "¿Más o menos a qué distancia está el lugar de adentro del lugar donde iría la unidad de afuera?"
        options_en: ["Back to back through one wall", "Under 15 feet", "15 to 30 feet", "More than 30 feet"]
        options_es: ["Uno detrás del otro en la misma pared", "Menos de 15 pies", "15 a 30 pies", "Más de 30 pies"]
        card_field: true
        why: "Line-set length is the biggest labor variable on a single-head install. [judgment]"
      - id: fu_space_insulated
        ask_when: "Garage, shop or casita and insulation is not mentioned"
        text_en: "Is the space finished and insulated, like a bedroom, or more like an open garage or shop?"
        text_es: "¿El espacio está terminado y con aislamiento, como una recámara, o es más como una cochera o taller abierto?"
        options_en: ["Finished and insulated", "Garage or shop with some insulation", "No insulation"]
        options_es: ["Terminado y con aislamiento", "Cochera o taller con algo de aislamiento", "Sin aislamiento"]
        card_field: true
        why: "Insulation sets the size of unit a business quotes. [judgment]"
    photos_priority: [p6_minisplit_spot, p8_panel]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: []
      regular: "All new mini-split installs"
    scope_line_en: "New single-room mini-split for a two-car garage; block wall; outdoor spot about 10 feet away; some insulation."
    scope_line_es: "Minisplit nuevo de un cuarto para una cochera de dos autos; pared de block; la unidad de afuera a unos 10 pies; algo de aislamiento."
    quote_format: range
    business_fills: ["price range", "equipment brand, size and number of heads", "whether the circuit and permit are included", "earliest install day"]
    card_template: |
      REQ-<id> | Heating and cooling replacement | <town>, <general area> | <kind of place>
      <one scope line: new mini-split, which space, size>
      Rooms: <one / two / three or more / whole house>. Distance inside to outside: <back to back / under 15 ft / 15 to 30 ft / over 30 ft>. Space: <finished / some insulation / none>.
      Wall: <block / stucco / frame, from photo>. Panel: <neutral, from photo> or <no photo>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["A 12,000 BTU unit is enough for that.", "You can install it yourself and have someone charge it.", "Your panel can handle it.", "Mini-splits run about three thousand a head."]

  - id: cooler_to_central_ac
    new_job_type: true
    label: "Add refrigerated central air where there is a swamp cooler or no cooling now"
    bank_job_type: "full system replacement"
