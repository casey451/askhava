# Ask Hava expert layer: car_detailing (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set car_detailing and trade_kb/trades/car_detailing.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - All six kb job types are kept. ceramic_paint_correction routes as "exterior detail" and
#   odor_pet_hair as "interior detail" (the scenario file expects the same). No new_job_type was
#   needed: every category job type has a kb match.
# - The bank set has no condition question (kb q4_condition) and no paint-work question (kb q5_paint).
#   fu_condition and fu_paint_work fill the gap, but condition moves every interior quote; Casey may
#   want it added to the bank so it is always asked rather than spending the one follow-up.
# - The bank photo list is [p1_vehicle_wide, p3_worst_area, p5_parking_spot]. p2_interior and
#   p4_paint_closeup are named in photos_priority for interior, odor and paint jobs; suggest the app
#   order photos by job type.
# - The bank water question asks about water and power, not shade. fu_shade covers paint work.
# - The bank's service option "Roof cleaning and sealing (RV)" overlaps the kb note that RV roof
#   repair or resealing goes to rv_services, which no enabled category takes. Kept under
#   "RV detailing"; fu_roof_why puts stains or drips on the card as a plain observation so a
#   business that does not do roof sealing can pass. Casey to decide where roof coating belongs.
# - Body or paint-shop work (peeling clear coat, dents, deep scratches) has no enabled category.
# - Boats go to boat_detailing. No golf cart category is enabled, so carts stay here if asked.
