trade_brief:
  price_drivers:
    - driver: "Vehicle type and size: car, two-row SUV or truck, three-row van, side-by-side, or RV and trailer by the foot"
      why: "Most RV and trailer exterior work is priced per foot and interiors by the hour, so length and class set the base; the bank's vehicle and rv_length questions settle it."
      source: mobiletechrx_rv
    - driver: "Inside condition: normal use, sand, heavy pet hair, set-in smoke, spills soaked into the padding"
      why: "Woven-in dog hair and smoke in the headliner can double or triple interior hours compared with a kept-up car; this is where most interior quotes go wrong. [judgment]"
      source: null
    - driver: "Paint work wanted: wash and wax, machine polish (one step or more), or a ceramic coating"
      why: "A wash and wax is a couple of hours; polish and coating work runs from most of a day to several days and needs indoor or shaded cure time. [judgment]"
      source: null
    - driver: "Finish condition on RVs and older trucks: chalky, streaked or sun-faded"
      why: "Heavy sun damage on an RV needs compounding, priced well above a wash, and polishing cannot fix paint that is peeling."
      source: mobiletechrx_rv
    - driver: "What is on site: water, power, shade or a garage"
      why: "A mobile rig with no spigot or outlet must bring a water tank and a generator, and full sun in summer pushes the work to early morning. [judgment]"
      source: null
    - driver: "RV extras: roof cleaning, number of slide-outs, bugs on the front cap"
      why: "Roof work and bug and tar removal are per-foot add-ons and slide-outs a flat add-on each."
      source: mobiletechrx_rv
    - driver: "Hard-water spots on glass and paint"
      why: "City water runs about 19 grains per gallon, so dried spots often need a polish step, and many detailers bring filtered water."
      source: lhc_ccr
    - driver: "How many vehicles in one visit"
      why: "A second vehicle at the same stop saves the drive and setup, so many detailers price it lower than a separate trip. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Pet hair woven into the rear carpet, cargo liner or seat seams that the front-seat photo does not show"
      how_a_pro_spots_it: "Asks for the worst spot, not the front seat; the answer on where most of the hair is"
      question_or_photo: fu_hair_where
      source: null
    - condition: "Smoke smell set into the headliner and seat foam, with a brown film on the glass"
      how_a_pro_spots_it: "Used vehicle with a smoking previous owner; the smell answer; haze on the inside of the windshield in the interior photo"
      question_or_photo: fu_smell_what
      source: null
    - condition: "A spill (milk, food, drink) soaked through the carpet into the padding"
      how_a_pro_spots_it: "Sour smell that came back after a surface clean; the stain close-up"
      question_or_photo: p3_worst_area
      source: null
    - condition: "Paint that is peeling or flaking, which no polish or coating will fix"
      how_a_pro_spots_it: "Lighter, flaky patch on the roof or hood edge in the daylight paint photo; the paint-look answer"
      question_or_photo: fu_paint_look
      source: null
    - condition: "No water or power at a storage lot space, or lot and park rules on hours and runoff"
      how_a_pro_spots_it: "The bank's where and water answers, then the lot-rules answer; the city asks that wash water stay out of storm drains and washes"
      question_or_photo: fu_lot_rules
      source: lhc_stormwater
    - condition: "Rodent droppings or a nest in a stored RV, trailer or seldom-driven car"
      how_a_pro_spots_it: "Droppings or chewed material in the interior photo; a musty smell after months in storage"
      question_or_photo: p2_interior
      source: null
    - condition: "Stains or drips inside an RV that the owner calls a roof job, with cracked sealant at vents or seams"
      how_a_pro_spots_it: "The roof answer says stains or drips inside; caulk cracks in a roof photo. Roof cleaners also check caulking and seals while they work."
      question_or_photo: fu_roof_why
      source: simplegreen_rv_roof
    - condition: "Hard-water spots etched into glass and paint after sprinkler overspray or washing in the sun"
      how_a_pro_spots_it: "White spots on glass in the worst-spot photo; the extras answer"
      question_or_photo: fu_extras
      source: lhc_ccr
  misdiagnosis_checks:
    - sounds_like: "exterior detail (owner asks for a wash)"
      might_be: "ceramic_paint_correction: dull, chalky or marked paint that a wash will not change"
      one_question: fu_paint_look
      if_other_route_to: {category: car_detailing, job_type: "exterior detail"}
      source: null
    - sounds_like: "interior detail (smoke smell in a used vehicle)"
      might_be: "odor_pet_hair: set-in smoke from a previous owner, a longer process than a clean"
      one_question: fu_smell_what
      if_other_route_to: {category: car_detailing, job_type: "interior detail"}
      source: null
    - sounds_like: "interior detail (bad or musty smell)"
      might_be: "rodent droppings or a nest in a stored vehicle or RV (pest_control trade file)"
      one_question: fu_smell_what
      if_other_route_to: {category: pest_control, job_type: "general pest service"}
      source: null
    - sounds_like: "RV detailing (roof cleaning and sealing)"
      might_be: "an RV roof or vent leak repair (kb rv_services), which no enabled category takes; the wash and roof cleaning stay here with the stain stated as seen"
      one_question: fu_roof_why
      if_other_route_to: {category: car_detailing, job_type: "RV detailing"}
      source: null
    - sounds_like: "full detail (pontoon or boat, 'detail it like a car')"
      might_be: "boat detailing (kb boat_dock detailing); her own words usually settle it before any question"
      one_question: vehicle
      if_other_route_to: {category: boat_detailing, job_type: "hull cleaning"}
      source: null
    - sounds_like: "exterior detail (peeling paint, deep scratches, dents)"
      might_be: "body or paint-shop work, which no enabled category takes"
      one_question: fu_paint_look
      if_other_route_to: {}
      source: null
  photo_reading:
    - photo_id: p1_vehicle_wide
      reads: ["Vehicle type and size; RV class and length", "Slide-outs, ladder, bike racks", "Dust, mud or black streaks", "Dull or chalky paint", "License plate or VIN in the frame (crop before the card goes out)"]
      neutral_wording: "Side view of a white fifth wheel with dark streaks below the roof line and two slide-outs."
    - photo_id: p2_interior
      reads: ["Seat material (cloth, leather or vinyl)", "Rows of seats", "Pet hair on seats and floor", "Items left inside", "Droppings or chewed material", "Haze on the inside of the glass"]
      neutral_wording: "Cloth seats with light-colored hair across the back seat and floor."
    - photo_id: p3_worst_area
      reads: ["Stain size and color", "Caked mud or sand", "White spots on glass or paint", "Hair woven into carpet"]
      neutral_wording: "Dark stain about the size of a hand on the driver seat."
    - photo_id: p4_paint_closeup
      reads: ["Fine circular marks in sunlight", "Scratches", "Chalky or faded areas", "Peeling or flaking patches", "Bird droppings or tree sap marks"]
      neutral_wording: "Hood in sunlight shows fine circular marks; a lighter, flaky patch about the size of a hand on the roof edge."
    - photo_id: p5_parking_spot
      reads: ["Driveway, gravel lot space or RV pad", "Spigot or outlet in view", "Shade, carport or garage", "Room to walk around the vehicle", "Paved or unpaved ground"]
      neutral_wording: "RV on a gravel lot space between other RVs; no spigot or outlet in view."
  local_factors:
    - fact: "City water hardness averages about 19 grains per gallon, range 18 to 20, with TDS about 753 ppm"
      effect: "Tap water that dries on paint or glass leaves white spots, so many detailers bring filtered or deionized water and ask about water spots [judgment on the detailer response]"
      source: lhc_ccr
    - fact: "Average highs run 101 to 109 F from June through September"
      effect: "Panels get too hot to work in full sun by mid-morning; mobile detailers start at dawn or need shade, and the card should say whether shade or a garage is there"
      source: climate_normals
    - fact: "Coating makers say not to apply in direct sunlight and to work between about 41 and 77 F, then keep the vehicle indoors about 12 hours"
      effect: "Summer coating jobs need a garage, an early start or the shop's own bay; this is why the garage and shade answer matters for paint work"
      source: gtechniq_csl
    - fact: "Hot panels shorten the working time of wash products and minerals spot faster"
      effect: "Pros plan summer washes for early morning or evening"
      source: autofinesse_sun
    - fact: "The city asks residents washing at home to wash on an unpaved surface and keep wash water out of storm drains and washes; it names no rule for mobile detailers"
      effect: "Storage lots, RV parks and HOAs may set their own washing rules; the card states what the homeowner knows"
      source: lhc_stormwater
    - fact: "Monsoon season runs June 15 to September 30 and brings dust storms"
      effect: "Vehicles and RVs get coated after storms; a wash booked before a storm may need redoing, so some detailers ask about flexible dates [judgment on detailer practice]"
      source: adwr_monsoon
    - fact: "Seasonal residents store RVs, trailers, side-by-sides and cars at storage lots or vacant second homes for months"
      effect: "Cleaning before arrival or before storage is common, someone else may hold the key, and stored units can have dust, droppings or a musty smell [judgment]"
      source: null
    - fact: "No ROC license class covers vehicle detailing; contracting covers buildings and structures"
      effect: "Any detailer may receive these cards; Lake Havasu City still requires a city business license for business done in city limits"
      source: ars_32_1101
    - fact: "Side-by-sides and lifted trucks come back from desert trails caked in mud and dust"
      effect: "Heavy mud adds pre-rinse time and water use, and the business wants to know before it fills its tank [judgment]"
      source: null
  seasonality:
    busy: "October to April, with peaks when seasonal residents arrive in the fall and before they store vehicles and leave in spring; holiday weekends [judgment]"
    slow: "July and August midday heat; work shifts to dawn and garages [judgment]"
    source: null

job_types:
  - id: interior_detail
    label: "Interior detail (vacuum, seats, carpets, dash, glass)"
    bank_job_type: "interior detail"
    recurring: false
    homeowner_phrasings: ["clean my car inside", "shampoo the seats", "stains on my seats", "vacuum and wipe it down", "limpiar el interior del carro"]
    must_know:
      - fact: "Inside condition: normal use, sand, pet hair, a smell or stains"
        bank_question: null
        follow_up: fu_condition
        photo: p3_worst_area
        why_it_moves_price: "Hair, smells and soaked-in spills add hours that a plain 'clean the inside' hides. [judgment]"
        skip_if: "Homeowner already described the condition"
      - fact: "Vehicle type and rows of seats"
        bank_question: vehicle
        follow_up: fu_rows
        photo: p2_interior
        why_it_moves_price: "A third row or a full-size cab adds seat and carpet area. [judgment]"
        skip_if: "Vehicle is a car, or the photo shows the rows"
      - fact: "Seat material"
        bank_question: null
        follow_up: fu_seats
        photo: p2_interior
        why_it_moves_price: "Cloth gets shampoo and extraction with dry time; leather gets cleaned and conditioned. [judgment]"
        skip_if: "Interior photo shows the seats"
      - fact: "Where it is parked and whether power is there"
        bank_question: water
        follow_up: null
        photo: p5_parking_spot
        why_it_moves_price: "Vacuums and extractors need an outlet or a generator. [judgment]"
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_condition
        ask_when: "Homeowner wants the inside done and has not said what shape it is in"
        text_en: "How is the inside right now?"
        text_es: "¿Cómo está el interior ahorita?"
        options_en: ["Normal use", "Heavy dirt or sand", "Lots of pet hair", "Smoke or other smell", "Stains or spills"]
        options_es: ["Uso normal", "Mucha tierra o arena", "Mucho pelo de mascota", "Olor a humo u otro olor", "Manchas o algo derramado"]
        card_field: true
        why: "Condition is the biggest swing in interior hours and the bank does not ask it. [judgment]"
      - id: fu_seats
        ask_when: "Inside work and no interior photo shows the seats"
        text_en: "Are the seats cloth or leather?"
        text_es: "¿Los asientos son de tela o de piel?"
        options_en: ["Cloth", "Leather or vinyl", "Some of each"]
        options_es: ["Tela", "Piel o vinil", "De los dos"]
        card_field: true
        why: "Cloth and leather take different methods, products and dry time. [judgment]"
      - id: fu_rows
        ask_when: "Vehicle is a truck, SUV or van and the rows of seats are not known"
        text_en: "How many rows of seats does it have?"
        text_es: "¿Cuántas filas de asientos tiene?"
        options_en: ["One row", "Two rows", "Three rows or more"]
        options_es: ["Una fila", "Dos filas", "Tres filas o más"]
        card_field: true
        why: "Rows set seat and carpet area, which most interior price sheets go by. [judgment]"
      - fu_smell_what
    photos_priority: [p2_interior, p3_worst_area, p1_vehicle_wide]
    urgency:
      fire_dept_triggers: ["Propane or gas smell inside an RV or trailer", "Smoke or flames coming from the vehicle now"]
      urgent_capable_triggers: []
      regular: "All interior requests, including ones needed by a set date"
    scope_line_en: "Interior detail on a three-row minivan; cloth seats, crumbs on the floor, sour spill smell under the second row."
    scope_line_es: "Detallado interior de una minivan de tres filas; asientos de tela, migajas en el piso, olor agrio de algo derramado bajo la segunda fila."
    quote_format: tiers
    business_fills: ["up to 3 packages, each with a price", "what each package includes", "hours on site and whether you need power", "earliest day"]
    card_template: |
      REQ-<id> | Car, truck and RV detailing | <town>, <general area> | <home / storage lot / RV park>
      <one scope line: vehicle, inside only, main condition>
      Vehicle: <type, rows of seats>. Seats: <cloth / leather or vinyl / mixed>. Condition: <normal / dirt or sand / pet hair / smell / stains>.
      Site: <where parked>. Water and power: <yes / no / water only>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That stain won't come out.", "An ozone treatment will fix the smell.", "Interiors run about a hundred and fifty.", "Try vinegar on it first."]

  - id: exterior_detail
    label: "Exterior detail (hand wash, wax or sealant, wheels, trim)"
    bank_job_type: "exterior detail"
    recurring: false
    homeowner_phrasings: ["wash and wax", "hand wash at my house", "water spots on my truck", "headlight restoration", "lavar la troca"]
    must_know:
      - fact: "Vehicle type and size"
        bank_question: vehicle
        follow_up: null
        photo: p1_vehicle_wide
        why_it_moves_price: "Size sets wash, wax and wheel time. [judgment]"
        skip_if: "Answered"
      - fact: "How the paint looks in daylight"
        bank_question: null
        follow_up: fu_paint_look
        photo: p4_paint_closeup
        why_it_moves_price: "Sound paint is a wash and wax; dull, chalky or marked paint turns it into polish work. [judgment]"
        skip_if: "Daylight paint photo sent"
      - fact: "How dirty the outside is"
        bank_question: null
        follow_up: fu_mud
        photo: p1_vehicle_wide
        why_it_moves_price: "Caked trail mud adds pre-rinse time and water. [judgment]"
        skip_if: "Wide photo shows it"
      - fact: "Water, power and shade where it is parked"
        bank_question: water
        follow_up: fu_shade
        photo: p5_parking_spot
        why_it_moves_price: "No spigot means bringing a tank; full sun in summer means a dawn start. [judgment]"
        skip_if: "Parking-spot photo shows it"
      - fact: "Extras: cloudy headlights, hard-water spots, bugs or tar"
        bank_question: null
        follow_up: fu_extras
        photo: p3_worst_area
        why_it_moves_price: "Each is a set add-on on most detail price sheets. [judgment]"
        skip_if: "Homeowner listed what she wants"
    allowed_follow_ups:
      - id: fu_paint_look
        ask_when: "Outside work and no daylight paint photo, or the homeowner mentions dull, faded or scratched paint"
        text_en: "In daylight, how does the paint look?"
        text_es: "Con luz del día, ¿cómo se ve la pintura?"
        options_en: ["Shiny, just dirty", "Dull or chalky", "Fine swirls or light scratches", "Peeling or flaking in spots"]
        options_es: ["Brillosa, solo sucia", "Opaca o como gis", "Rayitas finas o rayones leves", "Se está pelando en partes"]
        card_field: true
        why: "Separates a wash and wax from polish work, and flags peeling paint that detailers may pass on. [judgment]"
      - id: fu_mud
        ask_when: "Outside work and the homeowner has not said how dirty it is"
        text_en: "How dirty is the outside?"
        text_es: "¿Qué tan sucio está por fuera?"
        options_en: ["Normal dust", "Heavy dust or bugs", "Caked mud from trails"]
        options_es: ["Polvo normal", "Mucho polvo o insectos", "Lodo pegado de las brechas"]
        card_field: true
        why: "Trail mud changes water use and time on site. [judgment]"
      - id: fu_shade
        ask_when: "Outside or paint work and the homeowner has not said whether there is shade or a garage"
        text_en: "Where it is parked, is there a garage or shade?"
        text_es: "Donde está estacionado, ¿hay garaje o sombra?"
        options_en: ["Garage", "Carport or shade", "Full sun"]
        options_es: ["Garaje", "Techo abierto o sombra", "Pleno sol"]
        card_field: true
        why: "Hot panels spot and coatings should not go on in direct sun, so shade sets the time of day."
      - id: fu_extras
        ask_when: "Outside work and the homeowner has not named extras"
        text_en: "Anything extra on the outside?"
        text_es: "¿Algo extra por fuera?"
        options_en: ["Cloudy headlights", "White water spots on glass or paint", "Bugs or tar", "Wheels and tires deep clean", "None of these"]
        options_es: ["Faros opacos", "Manchas blancas de agua en vidrios o pintura", "Insectos o chapopote", "Limpieza a fondo de rines y llantas", "Nada de esto"]
        card_field: true
        why: "Extras are priced one by one, and hard-water spots are common here. [judgment]"
    photos_priority: [p1_vehicle_wide, p4_paint_closeup, p5_parking_spot]
    urgency:
      fire_dept_triggers: ["Smoke or flames coming from the vehicle now"]
      urgent_capable_triggers: []
      regular: "All exterior requests"
    scope_line_en: "Hand wash and wax on a full-size pickup at home; dusty, paint shiny; spigot in the driveway, full sun."
    scope_line_es: "Lavado a mano y cera para una troca grande en casa; con polvo, pintura brillosa; llave de agua en la entrada, pleno sol."
    quote_format: tiers
    business_fills: ["up to 3 packages, each with a price", "what each package includes (wash, wax or sealant, wheels, glass)", "whether you bring your own water", "earliest day and start time"]
    card_template: |
      REQ-<id> | Car, truck and RV detailing | <town>, <general area> | <home / storage lot / RV park>
      <one scope line: vehicle, outside only, what she wants>
