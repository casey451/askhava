business_side:
  how_they_get_customers: ["Google Business Profile and reviews", "Before-and-after posts on Instagram and Facebook, and local Facebook groups", "Repeat customers on maintenance washes", "Word of mouth at RV parks, storage lots and dealerships [judgment]", "Search ads and marketplaces such as Thumbtack and Yelp"]
  customer_acquisition_benchmarks:
    - channel: "Google search ads, high-intent detailing terms"
      figure: "About $5 to $15 per click for terms like 'car detailing near me'; the agency gives no cost per lead"
      source: clicksgeek_detailing
      unverified: false
    - channel: "Ads in general, cost to book one detail"
      figure: "About $40 to $60 to book a job on an average $350 detail; a software vendor's margin rule of thumb, not a measured average"
      source: hcp_detailing_ads
      unverified: false
    - channel: "Thumbtack, all trades"
      figure: "About $10 to over $100 per lead by service and customer; no detailing-specific figure found"
      source: leadcapture_thumbtack
      unverified: false
    - channel: "Lake Havasu City detailers specifically"
      figure: "No local figures found; a small market with seasonal demand may run below national vendor figures"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a contact that four other detailers also bought", "People who want a price for 'a detail' with no vehicle or condition", "Monthly fees whether or not jobs come", "Price shoppers comparing a full detail with a gas-station wash", "Being rated or ranked by the site itself"]
  what_makes_a_lead_worth_paying_for: ["Vehicle, size and condition stated up front, with photos", "Water, power and shade at the spot known before driving out", "Pay only when picked, nothing monthly", "A real date and place", "Lot or park rules stated for storage-lot and RV park jobs"]
  their_words: ["maintenance wash", "one-step polish", "two-step correction", "decon", "clay bar", "extraction", "ozone", "sealant", "ceramic", "DI water", "spot-free rinse", "per foot", "slide toppers", "front cap"]
  signup_objections:
    - objection: "A $25 fee on an $80 wash doesn't work for me."
      answer: "Any quote under $500 carries the $25 fee, and only when the homeowner picks you. You choose your job types, so you can take full details, RVs and coatings and skip quick washes."
    - objection: "I can't price a coating or correction without seeing the paint."
      answer: "Quote up to three packages and say in each one what you would check when you arrive. The card asks for a daylight photo of the paint and how she says it looks."
    - objection: "Other sites charge me for people who never answer."
      answer: "Here you pay nothing to see a card or to quote. The fee is charged only when the homeowner picks your quote and you confirm. If you haven't spoken with her yet and she cancels, the fee is refunded."
    - objection: "I'm mobile. How do I know there's water and power?"
      answer: "Each card says where the vehicle is parked and whether water and power are there. For storage lots and RV parks it also says any washing rules she knows of."
    - objection: "Will you rank me against other detailers?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "Is there a monthly fee or a contract?"
      answer: "No. Nothing to join and nothing monthly. The fee is $25, $75 or $199 by quote size, charged only when you are picked."
    - objection: "Do I need a contractor license for this?"
      answer: "No contractor license applies to detailing. Lake Havasu City requires a city business license for business done inside city limits."
    - objection: "I only do cars, not RVs."
      answer: "You pick the job types you want at sign-up and can change them any time. You get cards only for those."
  quote_tips_for_card: ["Name each package plainly and list what it includes", "Say whether you bring your own water and power", "Give hours on site and the earliest day", "For coatings, say what you would check on arrival and where the work is done", "In summer, say what time of day you would start"]
