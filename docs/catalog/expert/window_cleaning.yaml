# Ask Hava expert layer: window_cleaning (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set window_cleaning and trade_kb/trades/window_cleaning.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - kb job type repair_route (broken glass or torn screens) is left out. It is repair work
#   (R-65 Glazing or R-7 per A.A.C. R4-9-103), not cleaning, and window_cleaning has no refused
#   job for it. Torn, bent or missing screens route to solar_screens "solar screens" (that set
#   already asks "Repair existing screens"). Broken or fogged dual-pane glass has no enabled
#   category today (no windows_doors category; handyman has no glass job type), so those
#   misdiagnosis checks carry an empty route. Casey may want a "glass repair" job type, likely
#   under solar_screens since those businesses hold R-65.
# - kb job type high_windows sits under "inside and outside windows"; it is a height add-on to the
#   same wash, not a separate job a business opts into.
# - Window tracks and sills ride with "screens" (kb screens_tracks).
# - No new_job_type was needed: the kb ids cover all three category job types.
# - Bank set: the service question is single choice, so "Inside and outside" and "Screens too"
#   can't both be picked; the AI recovers screens from her words or fu_screen_type. The count
#   options stop at "Over 20"; the kb file has 21 to 35 and 36+, which a pane-count quote needs.
#   Both are logged catalog changes for Casey, not made here.
# - "Clean windows and gutters" and solar panel washing (kb gutter_solar_cleaning) have no
#   enabled cleaning category; gutters is install and repair (R-45) only.
