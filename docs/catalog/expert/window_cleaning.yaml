  what_they_dislike_about_lead_services: ["Same lead sold to 3 or 4 companies", "Calls that go to voicemail and emails nobody answers", "Customers who pick on price alone", "Paying a deposit or monthly fee before any job comes", "Counts that turn out wrong on arrival"]
  what_makes_a_lead_worth_paying_for: ["Window count, stories, inside or outside and screens stated", "Front, back and close-up photos", "Spot level and which glass for hard-water jobs", "Pay only when picked, nothing monthly", "Town, timing and whether someone will be home"]
  their_words: ["per pane", "per window", "inside and out", "squeegee", "strip washer", "water-fed pole", "pure water", "DI resin", "hard-water stain removal", "screens and tracks", "sills", "French panes", "construction clean", "solar screens", "first clean"]
  signup_objections:
    - objection: "Why pay a fee when I can knock on doors?"
      answer: "You pay only when a homeowner picks your quote. There is nothing to join and nothing monthly. The fee is set by job size: $25 for a job under $500, $75 for $500 to $1,500, $199 over $1,500."
    - objection: "I can't quote windows without counting them myself."
      answer: "Each card has the window count band, stories, inside or outside, screens and spot level, with photos of the front, back and a close-up. Say in your quote what count your price assumes and how you handle a different count on arrival."
    - objection: "Hard-water jobs scare me. What if the spots don't come off?"
      answer: "The card says how heavy the spots are, which glass, whether sprinklers still hit it, and has a close-up photo. Say in your quote what the price covers and what happens if some spots stay."
    - objection: "Will you rank me against other window cleaners?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "I don't do two-story or screens."
      answer: "You choose the job types you want at sign-up and change them any time. You get cards only for those."
    - objection: "Do I need a contractor license to sign up?"
      answer: "No state contractor license covers window cleaning. You get cleaning cards only, never glass or screen repair."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "What if I quote and don't get picked?"
      answer: "Then you pay nothing. The fee is charged only when a homeowner picks your quote and you confirm."
  quote_tips_for_card: ["Say what the price includes: inside, outside, screens, tracks, sills", "State the window or pane count your price assumes", "For hard-water work, say what happens if some spots stay", "Give your earliest day, and say if summer work is early morning"]
