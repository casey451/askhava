trade_brief:
  price_drivers:
    - driver: "How many windows, and how many panes each (sliders, picture windows, small divided panes)"
      why: "Window cleaners price by the window or the pane; a 22-window house with French panes can take twice the time of one without. [judgment]"
      source: null
    - driver: "Inside and outside, or outside only"
      why: "Inside work means moving blinds and furniture and wiping sills; it roughly doubles the time on each window. [judgment]"
      source: null
    - driver: "Hard-water spots and how heavy they are"
      why: "Mineral deposits bond to glass and are hard to remove, so spot removal is a slower, separate service from a wash."
      source: pilkington_ats126
    - driver: "Height: second story, tall entry or stairway glass, windows above a roof or patio cover"
      why: "High glass needs taller ladders or a water-fed pole and more setup per window. [judgment]"
      source: null
    - driver: "Screens: how many, regular mesh or solar screens, and whether solar screens must come off"
      why: "Solar screens are often screwed or clipped on, so removing, washing and refitting them adds time per window. [judgment]"
      source: null
    - driver: "Paint, stucco, tape or stickers on the glass from building or remodel work"
      why: "Construction residue needs careful scraping or restoration work, which GANA treats as non-routine cleaning."
      source: gana_cleaning
    - driver: "Access: rock or slope under windows, cactus and shrubs, pool decks, locked side yards, dogs"
      why: "Ladder setup and walking time change per window when the ground is uneven or blocked. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Hard-water deposits so thick and old they have held water on the glass and left marks that do not come off"
      how_a_pro_spots_it: "Crust visible from across the yard in the close-up, sprinkler heads or misters aimed at the glass in the back photo"
      question_or_photo: p3
      source: pilkington_ats126
    - condition: "Coated or low-E exterior glass that blades and some cleaners can harm"
      how_a_pro_spots_it: "Newer replacement windows, a slight tint or reflection; low-E coatings are hard to see, so pros ask before scraping"
      question_or_photo: p3
      source: gana_cleaning
    - condition: "Tempered glass in sliders and doors that scratches when scraped over specks fused in the surface"
      how_a_pro_spots_it: "Sliding doors and large panes near the floor are tempered; a pro plans no blade on them"
      question_or_photo: p2
      source: gana_cleaning
    - condition: "Haze or fog between the two panes of dual-pane glass that no cleaning reaches"
      how_a_pro_spots_it: "Cloudy look that stays after a wipe on both sides; the homeowner says it looks dirty inside the glass"
      question_or_photo: fu_spot_side
      source: null
    - condition: "Solar screens with brittle frames, rusted screws or bent clips that break on removal"
      how_a_pro_spots_it: "Faded, sagging or torn screen fabric in the front or back photo; west and south faces get the most sun"
      question_or_photo: fu_screen_type
      source: null
    - condition: "Overhead service line near a second-story window or roof edge, so a ladder or pole can't be set there"
      how_a_pro_spots_it: "Wire from the pole to the house in the front or back photo; UES says keep tools and body 15 feet from overhead lines"
      question_or_photo: p1
      source: ues_safety
    - condition: "Paint overspray, stucco or labels left from building work"
      how_a_pro_spots_it: "Specks or film in the close-up, a new build or recent remodel in her words"
      question_or_photo: fu_construction
      source: gana_cleaning
    - condition: "A cracked pane found on arrival"
      how_a_pro_spots_it: "Line across the glass in a photo; the pro notes it before touching the glass"
      question_or_photo: p3
      source: null
  misdiagnosis_checks:
    - sounds_like: "inside and outside windows (glass stays cloudy after cleaning)"
      might_be: "glass_repair (fog between dual panes, windows_doors kb); no enabled category takes it"
      one_question: fu_spot_side
      if_other_route_to: {}
      source: null
    - sounds_like: "hard-water removal (white haze that won't come off)"
      might_be: "glass_repair (fog between dual panes, windows_doors kb); no enabled category takes it"
      one_question: fu_spot_side
      if_other_route_to: {}
      source: null
    - sounds_like: "screens (solar screens need cleaning)"
      might_be: "screens in windows_doors kb (torn, bent, missing or new solar screens)"
      one_question: fu_screen_need
      if_other_route_to: {category: solar_screens, job_type: "solar screens"}
      source: null
    - sounds_like: "inside and outside windows (dust on the whole house after a storm)"
      might_be: "pressure washing house wash (walls, eaves and glass)"
      one_question: fu_walls_too
      if_other_route_to: {category: pressure_washing, job_type: "house wash"}
      source: null
  photo_reading:
    - photo_id: p1
      reads: ["Window count on the front and stories", "Small divided panes or grids on the glass surface", "Solar screens and their color", "Overhead service line near windows", "Rock, cactus or slope under windows"]
      neutral_wording: "Front of a single-story house, 8 windows in view, dark solar screens on 4, rock beds under the windows."
    - photo_id: p2
      reads: ["Back glass count, sliders and large lake-view panes", "Sprinkler heads or patio misters near glass", "Pool deck or patio cover under high windows", "Second-story or above-roof windows"]
      neutral_wording: "Back of the house, two large sliding doors and 5 windows, a patio cover runs below two upper windows."
    - photo_id: p3
      reads: ["Spot level: light haze, raised spots, heavy crust", "Spots on the outside face or between panes", "Paint specks, labels or tape", "Cracks or chips", "Tint or reflective look on the glass"]
      neutral_wording: "Close-up of a back window, white spots across the lower half of the outside glass."
  local_factors:
    - fact: "City water hardness is about 19 grains per gallon with TDS about 753 ppm"
      effect: "Sprinkler and mister overspray leaves white mineral spots on glass, so many requests are hard-water jobs, and the card states spot level"
      source: lhc_ccr
    - fact: "Pure-water window washing calls for rinse water at 20 ppm TDS or less; tap water is not acceptable"
      effect: "With city water near 753 ppm, water-fed pole businesses carry heavy filtering, which shows up in their price for high glass"
      source: gana_cleaning
    - fact: "Monsoon season runs June 15 to September 30, and dust storms come most often early in it"
      effect: "Post-storm wash requests come in bursts in July and August; the card should say if the request follows a storm"
      source: nws_monsoon
    - fact: "Coated or tinted glass should not be cleaned in direct sun when the glass is hot"
      effect: "Summer jobs run early in the morning, so earliest-day answers in July often say a morning slot [judgment]"
      source: gana_cleaning
    - fact: "Solar screens are common on west and south windows"
      effect: "Many outside washes include screens that must come off and back on [judgment]"
      source: null
    - fact: "Seasonal residents and vacant second homes"
      effect: "Many jobs are at empty homes before owners arrive in fall or before a sale; the card states whether someone will be home [judgment]"
      source: null
    - fact: "Hillside lots with lake views have tall back glass over rock slopes or pool decks"
      effect: "Ladder placement and pole work set the time more than the count [judgment]"
      source: null
  seasonality:
    busy: "October to April (seasonal residents arrive, spring cleaning before the heat) and after early-monsoon dust storms in July and August [judgment]"
    slow: "June to early July midday heat, when work moves to early mornings [judgment]"
    source: null

job_types:
  - id: regular_wash
    label: "Window washing inside and outside, or outside only"
    bank_job_type: "inside and outside windows"
    recurring: false
    homeowner_phrasings: ["window washing", "clean my windows", "window cleaner", "streaky windows", "post-monsoon wash", "limpiar ventanas"]
    must_know:
      - fact: "About how many windows"
        bank_question: count
        follow_up: null
        photo: p1
        why_it_moves_price: "Count is the base of a window cleaner's price. [judgment]"
        skip_if: "Homeowner gave a count"
      - fact: "Inside and outside, or outside only"
        bank_question: service
        follow_up: null
        photo: null
        why_it_moves_price: "Inside work roughly doubles the time on each window. [judgment]"
        skip_if: "Her words already say which"
      - fact: "One story or two"
        bank_question: stories
        follow_up: null
        photo: p2
        why_it_moves_price: "Second-story glass means ladders or a pole and more setup. [judgment]"
        skip_if: "Photos show the whole house or she said single story"
      - fact: "Small panes or grids on the glass surface"
        bank_question: null
        follow_up: fu_divided_panes
        photo: p1
        why_it_moves_price: "Each small pane is cleaned on its own, so a French-pane window can take several times longer. [judgment]"
        skip_if: "Front photo shows plain glass"
      - fact: "Paint, stucco, tape or stickers from building work"
        bank_question: null
        follow_up: fu_construction
        photo: p3
        why_it_moves_price: "Construction residue is slow restoration work, not a wash."
        skip_if: "No new build or remodel mentioned"
    allowed_follow_ups:
      - id: fu_divided_panes
        ask_when: "Count is known but no front photo shows the glass, or she mentions French or grid windows"
        text_en: "Do any windows have small panes or grids on the outside of the glass you can touch?"
        text_es: "¿Alguna ventana tiene cuadritos o rejillas por fuera del vidrio que se puedan tocar?"
        options_en: ["No, plain glass", "A few windows", "Most windows", "Grids are between the glass"]
        options_es: ["No, vidrio liso", "Unas cuantas ventanas", "La mayoría", "Las rejillas están entre los vidrios"]
        card_field: true
        why: "Surface grids multiply the panes to clean; grids sealed between the glass do not. [judgment]"
      - id: fu_construction
        ask_when: "New build, recent remodel, new stucco or paint, or she mentions specks or stickers"
        text_en: "Is there paint, stucco, tape or stickers on the glass from building or painting work?"
        text_es: "¿Hay pintura, estuco, cinta o etiquetas en el vidrio por obra o pintura?"
        options_en: ["Yes, on many windows", "Yes, on a few", "No"]
        options_es: ["Sí, en muchas ventanas", "Sí, en unas cuantas", "No"]
        card_field: true
        why: "Construction residue needs careful removal that GANA treats as non-routine work, priced apart from a wash."
      - id: fu_spot_side
        ask_when: "She says the glass stays cloudy, foggy or dirty after cleaning, or the spots won't come off"
        text_en: "Is the cloudy look on the outside of the glass, the inside, or between the two panes where nobody can reach?"
        text_es: "¿Lo opaco está por fuera del vidrio, por dentro, o entre los dos vidrios donde no se alcanza?"
        options_en: ["Outside", "Inside", "Between the panes", "Can't tell"]
        options_es: ["Por fuera", "Por dentro", "Entre los vidrios", "No se distingue"]
        card_field: true
        why: "Haze between panes is glass work that no cleaning reaches, a different trade. [judgment]"
      - id: fu_walls_too
        ask_when: "She mentions dust or dirt on the house after a storm, or asks for the outside of the house"
        text_en: "Is this just the glass, or should the walls and eaves be washed too?"
        text_es: "¿Es solo el vidrio, o también hay que lavar las paredes y los aleros?"
        options_en: ["Just the glass", "Walls and eaves too"]
        options_es: ["Solo el vidrio", "También paredes y aleros"]
        card_field: true
        why: "Walls and eaves are a house wash, which pressure-washing businesses quote. [judgment]"
    photos_priority: [p1, p2, p3]
    urgency:
      fire_dept_triggers: ["Downed power line near the house"]
      urgent_capable_triggers: ["Needed for a move-in, sale closing or event within 3 days"]
      regular: "Any routine wash"
    scope_line_en: "Inside and outside wash, about 18 windows, single story, plain glass, no screens."
    scope_line_es: "Lavado por dentro y por fuera, unas 18 ventanas, un piso, vidrio liso, sin mallas."
    quote_format: firm
    business_fills: ["price for the job as described", "what is included (inside, outside, sills, screens)", "earliest day"]
    card_template: |
      REQ-<id> | Window cleaning | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: inside and outside or outside only, about how many windows, stories>
      Windows: <under 10 / 10 to 20 / over 20>. Stories: <1 / 2 or more>. Panes: <plain / some grids / most grids>.
      Building residue: <many / a few / none>. Someone home: <yes / no, empty home / not said>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["That's just dust, it'll wipe right off.", "Most cleaners charge by the pane, about five dollars each.", "Your seals are gone.", "You can do the inside yourself to save money."]

  - id: high_windows
    label: "High or two-story windows, tall entry or stairway glass, clerestory"
    bank_job_type: "inside and outside windows"
    recurring: false
    homeowner_phrasings: ["high windows", "two story windows", "clerestory", "windows over the front door", "lake-view windows up top"]
    must_know:
      - fact: "How many stories"
        bank_question: stories
        follow_up: null
        photo: p1
        why_it_moves_price: "Two-story glass sets the ladder or pole gear for the whole job. [judgment]"
        skip_if: "Answered"
      - fact: "Where the highest glass is"
        bank_question: null
        follow_up: fu_high_glass
        photo: p2
        why_it_moves_price: "A window above a roof or patio cover means roof work; a tall entry window inside needs an indoor ladder. [judgment]"
        skip_if: "Photos show every high window"
      - fact: "What is under the high windows"
        bank_question: null
        follow_up: fu_ladder_ground
        photo: p2
        why_it_moves_price: "Rock slopes, pool decks and planters change ladder setup time per window. [judgment]"
        skip_if: "Back photo shows the ground under the windows"
      - fact: "Overhead power line near any high window"
        bank_question: null
        follow_up: null
        photo: p1
        why_it_moves_price: "UES asks for 15 feet from overhead lines, so a window near a line may need other gear or be left out."
        skip_if: "Photos show no line near the house"
      - fact: "Inside high glass too, or outside only"
        bank_question: service
        follow_up: null
        photo: null
        why_it_moves_price: "Tall inside glass over stairs or an entry is its own setup. [judgment]"
        skip_if: "Answered"
    allowed_follow_ups:
      - id: fu_high_glass
        ask_when: "Two stories or high windows mentioned and photos don't show all of them"
        text_en: "Where is the highest glass: second-story windows, a tall entry or stairway window, or windows above a roof or patio cover?"
        text_es: "¿Dónde está el vidrio más alto: ventanas del segundo piso, una ventana alta en la entrada o escalera, o ventanas arriba de un techo o techito del patio?"
        options_en: ["Second-story windows", "Tall entry or stairway window", "Above a roof or patio cover", "More than one of these"]
        options_es: ["Ventanas del segundo piso", "Ventana alta en entrada o escalera", "Arriba de un techo o techito del patio", "Más de una de estas"]
        card_field: true
        why: "Each answer is different gear and setup to a window cleaner. [judgment]"
      - id: fu_ladder_ground
        ask_when: "High windows on a side the photos don't show"
        text_en: "What is on the ground under the high windows?"
        text_es: "¿Qué hay en el suelo debajo de las ventanas altas?"
        options_en: ["Flat ground or concrete", "Rock or a slope", "Pool or pool deck", "Plants or cactus"]
        options_es: ["Suelo plano o concreto", "Piedra o pendiente", "Alberca o el piso de la alberca", "Plantas o cactus"]
        card_field: true
        why: "Ladder footing sets setup time per window and whether a pole is used instead. [judgment]"
      - fu_divided_panes
    photos_priority: [p2, p1, p3]
    urgency:
      fire_dept_triggers: ["Downed power line near the house"]
      urgent_capable_triggers: ["Needed for a move-in, sale closing or event within 3 days"]
      regular: "Any routine high-glass wash"
    scope_line_en: "Outside wash of a two-story house, about 24 windows, three upper windows sit above the patio cover."
    scope_line_es: "Lavado por fuera de una casa de dos pisos, unas 24 ventanas, tres ventanas de arriba quedan sobre el techito del patio."
    quote_format: firm
    business_fills: ["price for the job as described", "what is included (which high glass, inside or outside)", "earliest day"]
    card_template: |
      REQ-<id> | Window cleaning | <town>, <general area> | <kind of place>
      <one scope line: stories, about how many windows, where the high glass is>
      Windows: <under 10 / 10 to 20 / over 20>. Stories: <1 / 2 or more>. Highest glass: <second story / entry or stairway / above a roof or cover>.
      Ground under high windows: <flat / rock or slope / pool deck / plants>. Service: <inside and outside / outside only>.
      Photos: <n> (<neutral description, including any overhead line in view>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Nobody can reach that window safely.", "You'll need a lift for that.", "High windows usually add fifty percent.", "Stay off the roof and let them do it."]

  - id: hard_water
    label: "Hard-water spot removal on windows, sliders or shower glass"
    bank_job_type: "hard-water removal"
    recurring: false
    homeowner_phrasings: ["hard water spots", "sprinkler spots on windows", "white spots on glass", "water stains on windows", "spots on the slider", "manchas blancas"]
    must_know:
      - fact: "How heavy the spots are"
        bank_question: null
        follow_up: fu_spot_level
        photo: p3
        why_it_moves_price: "A light haze comes off in a wash; heavy crust is slow, careful work that may not come fully clean."
        skip_if: "Close-up photo shows the spots clearly"
      - fact: "Which glass and how many pieces"
        bank_question: count
        follow_up: fu_spot_where
        photo: p2
        why_it_moves_price: "Spot removal is priced per piece of glass, and sliders and shower doors are large. [judgment]"
        skip_if: "Her words name the glass and the count"
      - fact: "Whether sprinklers or misters still spray the glass"
        bank_question: null
        follow_up: fu_sprinkler_hits
        photo: p2
        why_it_moves_price: "Spots come back when overspray goes on, so some businesses quote a wash plan rather than a one-time job. [judgment]"
        skip_if: "Back photo shows no sprinkler or mister near the glass"
      - fact: "Spots on the outside, inside or between panes"
        bank_question: null
        follow_up: fu_spot_side
        photo: p3
        why_it_moves_price: "Between the panes is glass work, not cleaning. [judgment]"
        skip_if: "Close-up shows spots on the outer face"
    allowed_follow_ups:
      - id: fu_spot_level
        ask_when: "Spots mentioned and no close-up photo sent"
        text_en: "How heavy are the white spots: a light haze, spots you can feel with a finger, or a thick crust you can see from across the yard?"
        text_es: "¿Qué tan fuertes son las manchas blancas: una capa ligera, manchas que se sienten con el dedo, o una costra gruesa que se ve desde lejos?"
        options_en: ["Light haze", "Spots you can feel", "Thick crust"]
        options_es: ["Capa ligera", "Manchas que se sienten", "Costra gruesa"]
        card_field: true
        why: "Spot level sets the method and time, and whether the business quotes a test spot first. [judgment]"
      - id: fu_spot_where
        ask_when: "Spots mentioned but not which glass"
        text_en: "Which glass has the spots?"
        text_es: "¿Qué vidrios tienen las manchas?"
