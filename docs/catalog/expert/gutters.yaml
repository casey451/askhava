      figure: "About $80 to $250 per booked appointment; marketing-vendor figure with no source given"
      source: pipeline_gutters
      unverified: false
    - channel: "Angi standard leads (all trades)"
      figure: "Sold to 3 to 8 contractors at once; general contracting and remodeling about $40 to $100 or more per lead; no gutter-specific figure"
      source: valley_angi
      unverified: false
    - channel: "Lake Havasu City gutter businesses specifically"
      figure: "No local figures found; few homes have full gutter systems, so jobs are smaller and a costly lead eats more of the margin"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a lead that several other gutter companies also bought", "Tiny jobs (one downspout piece) sold at the same price as a full install", "Homeowners who want a price by phone without a photo", "Monthly fees whether or not work comes", "Fake numbers and people just shopping"]
  what_makes_a_lead_worth_paying_for: ["Linear feet, stories and roof type on the card", "Photos of the run and a close-up of the edge", "Fascia condition and ladder room stated before the drive", "Pay only when picked, nothing monthly", "Real town and real timing"]
  their_words: ["K-style", "half-round", "5-inch", "6-inch", "one-piece run", "sectional", "hangers", "hidden hangers", "end caps", "miters", "outlets", "downspout", "elbows", "leaders", "extensions", "splash block", "fascia", "rafter tails", "drip edge", "scupper", "conductor head", "gutter guards", "coil", "pitch"]
  signup_objections:
    - objection: "Why pay $25 when I can get gutter work myself?"
      answer: "You pay only when the homeowner picks your quote and you confirm. There is nothing to join and nothing monthly. The fee is set by job size: $25, $75 or $199."
    - objection: "I can't quote gutters without measuring."
      answer: "Quote from the card if you can, or quote a price and say it is firm after you look. Most cards come with feet, stories, roof type, photos and the condition of the board at the edge."
    - objection: "Most of my calls are small repairs. Is that worth a fee?"
      answer: "The fee goes by job size, so a small repair carries the smallest fee. You pick the job types you want and can change them any time."
    - objection: "Do you send cleaning jobs?"
      answer: "Yes. Cleaning requests come under gutter repair for now and the card says cleaning only. Turn off gutter repair if you only want installs."
    - objection: "How do I know these are real homeowners?"
      answer: "Each request comes from a texted phone number we check, with a town, photos and answers to the questions a gutter business asks. Names and addresses go only to the business the homeowner picks."
    - objection: "Will you rank me against other gutter companies?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license number and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "Do I need a license to get these?"
      answer: "Gutter cards go only to businesses whose Arizona ROC license covers gutters. That class is R-45 Sheet Metal."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
  quote_tips_for_card: ["Say whether the price is firm or firm after a look at the edge", "Name the size, style and colors you offer", "Say if downspouts, tear-off and haul-away are included", "If the board at the edge needs work, say whether you do it or who should", "Give your earliest day"]
