# Ask Hava expert layer: gutters (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set gutters and trade_kb/trades/gutter_solar_cleaning.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The kb file is mostly cleaning (gutters, solar panels, roof debris, bird guards). The category has only
#   "gutter install" and "gutter repair" (R-45, handyman_allowed false). Mapping used here:
#   gutter_clean and roof_debris -> "gutter repair" (cleaning only, said on the card); gutter_repair_route ->
#   "gutter repair"; new_job_type gutter_install -> "gutter install" (the kb's gutter_repair_route covers both
#   repair and install; install is split out here because it scopes and prices differently).
# - Left out, with no route: solar_wash (solar panel washing; no category job type anywhere), critter_guard
#   (bird mesh around panels; the kb puts it under R-11 / CR-11 and no enabled category takes it), and
#   solar_repair_route (cracked panel or panel wiring; R-11 per the kb, no solar category, and electrical has
#   no solar job type). Scenario gutters_s05 expects job_type solar_wash, which this file does not define,
#   so the checker prints one scenario line for it. Casey may want a "solar panel washing" job type in an
#   unlicensed cleaning category (window_cleaning businesses often do it).
# - Cleaning needs no ROC license (A.R.S. 32-1101 does not list cleaning), but routing cleaning to "gutter
#   repair" sends those cards only to R-45 businesses. Unlicensed gutter cleaners cannot get them. A "gutter
#   cleaning" job type in an unlicensed category would fit the work better.
# - Fascia: R-45 Sheet Metal names gutters, leaders, flashings and cornices, not fascia board. R-42 Roofing
#   allows fascia replacement up to 24 linear feet; R-3 names fascia panels for awnings and patio covers.
#   A soft or missing fascia is put on the card (fu_board_condition) so the gutter business can quote or
#   decline; there is no clean category for fascia carpentry today.
# - The scenario writer used gutter_repair_route for install requests (s04, s08, s12); this file routes those
#   to gutter_install. Both ids exist, so the checker passes, but the scenario expectations should be updated.
# - Bank photo p1 asks for "panels from the ground or a drone". For gutters a wide shot of the roof edge
#   from the ground would help more. p1 is used only for roof_debris here.
# - The bank set has no roof-type question (kb q4). Roof type is carried as follow-up fu_roof_type, but only
#   one follow-up is allowed per request; adding roof type to the bank would free the follow-up.
# - quote_format is firm for the whole category. The kb says gutter repair "sometimes" needs a visit and
#   install often does (measuring). Businesses can write "after a look" in a firm quote; Casey may want
#   diagnostic_visit for "gutter repair" in job_type_formats.
# - Gutters and downspouts appear on neither Lake Havasu City permit list (S17); permit need is [unverified].
schema: 1
category: gutters
question_set: gutters
kb_trade: gutter_solar_cleaning
as_of: "2026-10-29"
written_by: "Claude expert layer, Oct 29 2026. AI research, not legal advice."
