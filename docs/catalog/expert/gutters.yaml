business_side:
  how_they_get_customers: ["Google Business Profile and reviews", "Referrals from roofers, painters and home builders [judgment]", "Repeat and word of mouth", "Google Local Services Ads and search ads", "Facebook lead ads and local Facebook groups", "Home-service lead marketplaces and directories"]
