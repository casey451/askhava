trade_brief:
  price_drivers:
    - driver: "Linear feet of gutter and the number of downspouts"
      why: "Gutter work is priced by the running foot plus each downspout and corner, so the bank's length answer is the first number an estimator writes down."
      source: pipeline_gutters
    - driver: "Height and ladder room: one story or two, and whether a pool, block wall, slope or fence blocks the ladder"
      why: "A second story or no level ground means taller ladders, roof access or a lift, and more crew time. [judgment]"
      source: null
    - driver: "Roof type at the edge (tile, flat or foam, shingle, metal)"
      why: "Tile can crack under foot and changes how hangers attach; a flat roof drains through wall openings, a different setup. [judgment]"
      source: null
    - driver: "Condition of the fascia board, or no fascia at all (open rafter ends)"
      why: "Soft or missing board means wood repair or special brackets before a gutter can hang, and R-45 does not list fascia work. [judgment]"
      source: aac_r4_9_103
    - driver: "New where there are none, tear off and replace, repair a section, or covers on existing gutters"
      why: "Tear-off adds removal and haul-away; a short repair carries a minimum trip; covers are a separate product per foot. [judgment]"
      source: null
    - driver: "Size, style and color (5-inch or 6-inch K-style, half-round, stock or matched color)"
      why: "6-inch carries about two-thirds more water than 5-inch and costs more per foot; off-stock colors may need special coil. [judgment on color]"
      source: pipeline_gutters
    - driver: "For cleaning: how packed the gutters are and whether debris is hauled away"
      why: "Dry leaves blow out fast; packed dirt, palm bits or plants growing in the gutter take hand work and bagging. [judgment]"
      source: null
    - driver: "Where the downspouts drain (splash block, extension, buried pipe)"
      why: "Tying into or clearing a buried drain pipe is extra labor and sometimes digging. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Fascia board soft, cracked or missing behind a gutter that pulled away"
      how_a_pro_spots_it: "Gutter hanging with screws or spikes pulled out; dark or crumbly wood in a close-up; open rafter tails with no board"
      question_or_photo: fu_board_condition
      source: null
    - condition: "Downspout feeds a buried drain pipe that is cracked or full of dirt"
      how_a_pro_spots_it: "Downspout ends in a pipe at grade in the close-up photo; water backs up out of the downspout seam"
      question_or_photo: p3
      source: null
    - condition: "No room to set a ladder (pool deck, block wall or fence close to the house, steep or rocky slope)"
      how_a_pro_spots_it: "The homeowner sent only the easy front side; back of the house faces a pool or a wall"
      question_or_photo: fu_ladder_room
      source: null
    - condition: "Overhead service line running over the gutter or carport edge"
      how_a_pro_spots_it: "A line from the pole lands near the corner in the gutter photo; the utility says to keep tools 15 feet from overhead lines"
      question_or_photo: fu_overhead_line
      source: ues_safety
    - condition: "A roof leak behind what the homeowner calls a gutter leak"
      how_a_pro_spots_it: "Stain on a ceiling or inside wall a few feet in from the edge; slipped tiles above it"
      question_or_photo: fu_inside_stain
      source: null
    - condition: "Old sectional gutters with many seams, where one leaking seam means more to come"
      how_a_pro_spots_it: "Seams every 10 feet or so and rust or sealant at joints in the gutter photo"
      question_or_photo: p2
      source: null
    - condition: "Tile roof edge where gutter hangers sit under the first row of tile"
      how_a_pro_spots_it: "Tile overhangs the gutter in the photo; the hangers cannot be seen"
      question_or_photo: fu_roof_type
      source: null
    - condition: "HOA rules on gutter color or style"
      how_a_pro_spots_it: "Kind of place on the card says HOA, or the homeowner mentions approval"
      question_or_photo: null
      source: null
  misdiagnosis_checks:
    - sounds_like: "gutter repair (gutter leaking into the garage or house)"
      might_be: "leak_repair (roofing kb), a roof leak near the edge"
      one_question: fu_inside_stain
      if_other_route_to: {category: roof_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "gutter_clean (gutters overflowing)"
      might_be: "gutter_repair_route (sag, low spot or a downspout that is too small or blocked)"
      one_question: fu_full_or_clear
      if_other_route_to: {category: gutters, job_type: "gutter repair"}
      source: null
    - sounds_like: "roof_debris (fronds and debris after a windstorm)"
      might_be: "storm_damage or tile_repair (roofing kb), broken or slipped tiles under the debris"
      one_question: fu_tiles_broken
      if_other_route_to: {category: roof_repair, job_type: "tile replacement"}
      source: null
    - sounds_like: "gutter install (a salesman said I need gutter guards)"
      might_be: "covers on gutters that already exist, not a new system"
      one_question: fu_install_what
      if_other_route_to: {category: gutters, job_type: "gutter install"}
      source: null
    - sounds_like: "gutter_clean (roof drain or scupper plugged on a flat roof)"
      might_be: "flat-roof drain opening, which some gutter businesses do not take"
      one_question: fu_drain_kind
      if_other_route_to: {category: gutters, job_type: "gutter repair"}
      source: null
  photo_reading:
    - photo_id: p2
      reads: ["Gutter style (K-style or half-round) and color", "Seams along the run or one long piece", "Sag, gaps or brackets pulled out", "Debris or plants in the gutter", "Roof type at the edge", "Service line near the corner"]
      neutral_wording: "White K-style gutter along the front, pulled away about 2 inches at the left end; concrete tile roof above."
    - photo_id: p3
      reads: ["Condition of the fascia board", "Downspout elbow or bottom piece missing or crushed", "Downspout ending in a buried pipe", "Rust or sealant at seams"]
      neutral_wording: "Downspout bottom piece is crushed; it ends in a plastic pipe at ground level."
    - photo_id: p1
      reads: ["How much debris is on the roof", "Fronds in valleys and at the edge", "Tiles that look out of line"]
      neutral_wording: "Palm fronds and leaves across the back half of a tile roof, some in the valley."
  local_factors:
    - fact: "Lake Havasu City gets about 4 to 5 inches of rain in a typical year"
      effect: "Many homes have gutters only over doors, patios or one side, so runs are short and repair calls follow storms [judgment on gutter coverage]"
      source: lhc_weather_2014
    - fact: "Monsoon season runs June 15 to September 30, with outflow winds of 50 mph or more and heavy short rain"
      effect: "Gutters pulled off, downspouts knocked loose and fronds on the roof come in bursts after storms [judgment on job mix]"
      source: nws_monsoon
    - fact: "Rain also comes in winter months (January and March were among the most active in 2015)"
      effect: "A smaller second run of overflow and cleaning calls in winter [judgment]"
      source: lhc_weather_2015
    - fact: "City gutters, storm drains and washes flow mostly untreated to the lake; any discharge not entirely stormwater is illicit"
      effect: "Cleaners bag gutter debris instead of washing it into the street, which adds haul-away time [judgment on effect]"
      source: lhc_stormwater
    - fact: "Tile roofs and palm trees are common"
      effect: "Tile changes access and hanger choice; palm bits pack gutters harder than leaves [judgment]"
      source: null
    - fact: "Second homes sit empty for months"
      effect: "Debris builds up and damage is found on return; the owner may not be on site, so access and gate details matter [judgment]"
      source: null
    - fact: "Gutters on a manufactured home: accessory structures attached to one go to Department of Housing installers (I-10C, I-10D); gutters are not named"
      effect: "Whether a gutter on a manufactured home is R-45 work or installer work is [judgment]; the card states the kind of place"
      source: aac_r4_34_204
    - fact: "Gutters and downspouts are on neither Lake Havasu City permit list"
      effect: "Whether a new gutter system needs a permit is not stated; businesses decide [judgment]"
      source: lhc_permits
  seasonality:
    busy: "July to October, after monsoon storms, and a shorter run in winter rain months [judgment]"
    slow: "April to early June, dry and before the monsoon [judgment]"
    source: null

job_types:
  - id: gutter_clean
    label: "Gutter, downspout or roof-drain cleaning (cleaning only, no repair)"
    bank_job_type: "gutter repair"
    recurring: false
    homeowner_phrasings: ["clean my gutters", "gutters overflowing", "downspout clogged", "leaves in the gutters", "scupper plugged"]
    must_know:
      - fact: "About how many feet of gutter, and how many stories"
        bank_question: length
        follow_up: null
        photo: p2
        why_it_moves_price: "Cleaning is priced by the run and the ladder height. [judgment]"
        skip_if: "Homeowner gave both"
      - fact: "What is in the gutters, or whether they are clear and still spill over"
        bank_question: null
        follow_up: fu_full_or_clear
        photo: p2
        why_it_moves_price: "Packed dirt or plants take hand work; a clear gutter that spills is a repair job, not a cleaning. [judgment]"
        skip_if: "Photo shows inside the gutter"
      - fact: "Roof type at the edge"
        bank_question: null
        follow_up: fu_roof_type
        photo: p2
        why_it_moves_price: "Tile edges are worked from a ladder, not by walking the roof; flat roofs drain through wall openings. [judgment]"
        skip_if: "Photo shows the roof edge"
      - fact: "Whether a service line runs over the gutters"
        bank_question: stories
        follow_up: fu_overhead_line
        photo: p2
        why_it_moves_price: "Crews keep ladders and poles 15 feet from overhead lines, which changes the setup at that corner."
        skip_if: "Photo shows the corners clearly"
    allowed_follow_ups:
      - id: fu_full_or_clear
        ask_when: "Homeowner says the gutters overflow or need cleaning and no photo shows inside them"
        text_en: "When you look at the gutters, are they full of debris, or clear with water still spilling over?"
        text_es: "Cuando ve las canaletas, ¿están llenas de basura, o limpias y aun así el agua se desborda?"
        options_en: ["Full of leaves, dirt or palm bits", "Plants growing in them", "Clear, but water spills over", "Can't see inside"]
        options_es: ["Llenas de hojas, tierra o palma", "Con plantas creciendo", "Limpias, pero el agua se desborda", "No se ve adentro"]
        card_field: true
        why: "Separates a cleaning from a slope or downspout repair without naming either. [judgment]"
      - id: fu_roof_type
        ask_when: "Roof type not said and not clear in a photo"
        text_en: "What is the roof made of?"
        text_es: "¿De qué material es el techo?"
        options_en: ["Tile", "Flat or foam", "Shingle", "Metal"]
        options_es: ["Teja", "Plano o de espuma", "Tejamanil (shingle)", "Metal"]
        card_field: true
        why: "Tile and flat roofs change access and hangers more than anything but height. [judgment]"
      - id: fu_drain_kind
        ask_when: "Homeowner mentions a flat roof, a roof drain, a scupper or a pipe through a wall"
        text_en: "Is this a gutter along the roof edge, or an opening in a low wall around a flat roof?"
        text_es: "¿Es una canaleta en la orilla del techo, o una abertura en un muro bajo alrededor de un techo plano?"
        options_en: ["A gutter along the roof edge", "An opening in a low wall on a flat roof", "Both"]
        options_es: ["Una canaleta en la orilla del techo", "Una abertura en un muro bajo de techo plano", "Las dos"]
        card_field: true
        why: "Flat-roof drain openings mean roof access and some gutter businesses skip them; the card says which. [judgment]"
      - id: fu_overhead_line
        ask_when: "Cleaning or debris job and no photo shows the corners where a service line could land"
        text_en: "Does a power, phone or cable line run over or close to the gutters?"
        text_es: "¿Pasa algún cable de luz, teléfono o cable cerca o por encima de las canaletas?"
        options_en: ["Yes", "No"]
        options_es: ["Sí", "No"]
        card_field: true
        why: "The utility tells people to keep tools and ladders 15 feet from overhead lines, so a business plans that corner differently."
    photos_priority: [p2, p3]
    urgency:
      fire_dept_triggers: ["Power line down on the roof, carport or ground"]
      urgent_capable_triggers: ["Water spilling into a doorway, garage or patio when it rains, with rain forecast"]
      regular: "Routine cleaning"
    scope_line_en: "Clean about 100 feet of gutter on a one-story tile-roof home; gutters packed with palm bits and dirt."
    scope_line_es: "Limpiar unos 100 pies de canaleta en una casa de un piso con techo de teja; canaletas llenas de palma y tierra."
    quote_format: firm
    business_fills: ["price to clean", "whether debris is hauled away", "earliest day"]
    card_template: |
      REQ-<id> | Gutters (cleaning only) | <town>, <general area> | <kind of place>
      <one scope line: about how many feet, what is in them>
      Length: <bank answer>. Stories: <1 / 2 or more>. Roof: <tile / flat or foam / shingle / metal / not said>.
      Gutters: <full of debris / plants growing / clear but spill over>. Line over gutters: <yes / no / not said>. Access: <gate, dog, owner home or not>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Clogged gutters will ruin your foundation.", "Gutter cleaning usually runs about a hundred dollars.", "Stay off the roof and let a pro do it.", "That's probably just leaves.", "Get a gutter guard so this doesn't happen again."]

  - id: roof_debris
    label: "Roof debris and valley cleanup (fronds, leaves, branches), cleaning only"
    bank_job_type: "gutter repair"
    recurring: false
    homeowner_phrasings: ["palm fronds all over the roof", "leaves on the roof", "debris in the roof valleys", "branch on the roof after the wind"]
    must_know:
      - fact: "Roof type"
        bank_question: null
        follow_up: fu_roof_type
        photo: p1
        why_it_moves_price: "Tile cannot be walked freely; crews work from ladders or poles, which takes longer. [judgment]"
        skip_if: "Photo shows the roof"
      - fact: "Size of the debris: leaves and small bits, or whole fronds and branches"
        bank_question: null
        follow_up: fu_debris_size
        photo: p1
        why_it_moves_price: "Whole fronds and branches need cutting and more trips down the ladder. [judgment]"
        skip_if: "Photo shows it"
      - fact: "Whether the business hauls the debris away"
        bank_question: null
        follow_up: fu_haul_away
        photo: null
        why_it_moves_price: "Haul-away adds a dump run and fees; leaving it bagged does not. [judgment]"
        skip_if: "Homeowner said"
      - fact: "Stories"
        bank_question: stories
        follow_up: null
        photo: null
        why_it_moves_price: "A second story changes the ladder and the time. [judgment]"
        skip_if: "Answered"
    allowed_follow_ups:
      - fu_roof_type
      - id: fu_debris_size
        ask_when: "Homeowner reports debris on the roof without saying what kind"
        text_en: "Is it scattered leaves and small bits, or whole palm fronds and branches?"
        text_es: "¿Son hojas y pedazos chicos, o pencas de palma y ramas enteras?"
        options_en: ["Leaves and small bits", "Whole fronds or branches", "Both"]
        options_es: ["Hojas y pedazos chicos", "Pencas o ramas enteras", "Las dos"]
        card_field: true
        why: "Whole fronds and branches are a different amount of work. [judgment]"
      - id: fu_haul_away
        ask_when: "Debris or cleaning job and the homeowner did not say what happens to the debris"
        text_en: "Should the business haul the debris away, or leave it bagged or piled for you?"
        text_es: "¿Quiere que el negocio se lleve la basura, o que la deje en bolsas o amontonada?"
        options_en: ["Haul it away", "Leave it bagged or piled"]
        options_es: ["Que se la lleve", "Que la deje en bolsas o amontonada"]
        card_field: true
        why: "Haul-away is a separate line in most cleaning quotes. [judgment]"
      - id: fu_tiles_broken
        ask_when: "Debris came down in wind or a storm, on a tile roof"
        text_en: "Can you see any roof tiles that are broken, slipped or missing?"
        text_es: "¿Se ven tejas rotas, movidas o que faltan?"
        options_en: ["Yes", "No", "Can't see the roof"]
        options_es: ["Sí", "No", "No se ve el techo"]
        card_field: true
        why: "Broken or slipped tile is roofing work, a different category; the card should say so before a cleaner climbs up. [judgment]"
    photos_priority: [p1, p3, p2]
    urgency:
      fire_dept_triggers: ["Power line down on the roof, carport or ground"]
      urgent_capable_triggers: ["Branch on the roof after a storm with rain forecast"]
      regular: "Leaves and fronds with no damage seen"
    scope_line_en: "Clear palm fronds and leaves off a one-story tile roof after a windstorm; haul debris away."
    scope_line_es: "Quitar pencas de palma y hojas de un techo de teja de un piso después de un ventarrón; llevarse la basura."
    quote_format: firm
    business_fills: ["price to clear the roof", "whether haul-away is included", "earliest day"]
    card_template: |
      REQ-<id> | Gutters (roof debris, cleaning only) | <town>, <general area> | <kind of place>
      <one scope line: what is on the roof, where>
      Roof: <tile / flat or foam / shingle / metal>. Stories: <1 / 2 or more>. Debris: <leaves / whole fronds or branches / both>.
      Tiles seen broken or slipped: <yes / no / can't see>. Haul away: <yes / leave bagged / not said>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["The wind cracked your tiles.", "Don't walk on a tile roof.", "That's a quick job.", "You should trim that palm so this stops."]

  - id: gutter_repair_route
    label: "Gutter or downspout repair: pulled away, sagging, leaking seam, bent or missing downspout"
    bank_job_type: "gutter repair"
    recurring: false
    homeowner_phrasings: ["gutter fell", "gutter pulled off the fascia", "gutter leaking at the seam", "downspout bent", "the edge thing came down"]
    must_know:
      - fact: "What the gutter is doing: pulling away or hanging, sagging, leaking at a seam or corner, or a downspout bent or missing a piece"
        bank_question: service
        follow_up: fu_gutter_what
        photo: p3
        why_it_moves_price: "A rehang, a reslope, a reseal and a downspout piece are four different jobs and parts lists. [judgment]"
        skip_if: "Homeowner's words or a photo already say which"
      - fact: "How much is affected (feet of gutter) and how many stories"
        bank_question: length
        follow_up: null
        photo: p2
        why_it_moves_price: "A short section is a minimum-trip repair; a long run that is failing is a replacement conversation. [judgment]"
        skip_if: "Homeowner gave the length"
      - fact: "Condition of the board the gutter hangs from"
        bank_question: null
        follow_up: fu_board_condition
        photo: p3
        why_it_moves_price: "Soft or missing fascia must be fixed before the gutter can hold, and R-45 does not list fascia work. [judgment]"
        skip_if: "Close-up photo shows solid wood, or the job is a downspout only"
      - fact: "Ladder room on the side that needs work"
        bank_question: stories
        follow_up: fu_ladder_room
        photo: p2
        why_it_moves_price: "A pool, wall or slope under the gutter can mean roof access or a lift. [judgment]"
        skip_if: "One story with open ground in the photo"
      - fact: "Whether water shows inside the house or garage"
        bank_question: null
        follow_up: fu_inside_stain
        photo: null
        why_it_moves_price: "An inside stain points at a roof leak, a different category, and the gutter business would want to know before quoting. [judgment]"
        skip_if: "Homeowner did not mention a leak inside"
    allowed_follow_ups:
      - id: fu_gutter_what
        ask_when: "Homeowner reports a gutter problem without saying what it is doing"
        text_en: "What is the gutter doing: pulling away or hanging down, sagging in the middle, leaking at a seam or corner, or a downspout bent or loose?"
        text_es: "¿Qué pasa con la canaleta: se está despegando o cuelga, se hunde en medio, gotea en una unión o esquina, o la bajante está doblada o floja?"
        options_en: ["Pulling away or hanging down", "Sagging in the middle", "Leaking at a seam or corner", "Downspout bent, loose or missing a piece"]
        options_es: ["Se despega o cuelga", "Se hunde en medio", "Gotea en una unión o esquina", "Bajante doblada, floja o le falta una pieza"]
        card_field: true
        why: "The four answers are four different repairs to a gutter business. [judgment]"
      - id: fu_board_condition
        ask_when: "Gutter pulled away or hanging, or new gutters wanted, and no close-up photo of the roof edge"
        text_en: "Is the board at the roof edge where the gutter hangs solid, or soft, cracked or missing in spots?"
        text_es: "¿La tabla de la orilla del techo donde va la canaleta está firme, o está blanda, rajada o falta en partes?"
        options_en: ["Looks solid", "Soft or cracked in spots", "No board there, open rafter ends", "Can't tell"]
        options_es: ["Se ve firme", "Blanda o rajada en partes", "No hay tabla, se ven las vigas", "No sé"]
        card_field: true
        why: "Fascia condition is the most common surprise on a rehang or a new install. [judgment]"
      - id: fu_inside_stain
        ask_when: "Homeowner says a gutter leaks into the house, garage or patio, or mentions a stain"
        text_en: "Is there a water stain or drip on a ceiling or inside wall?"
        text_es: "¿Hay una mancha de agua o goteo en un techo o pared de adentro?"
        options_en: ["Yes, on a ceiling", "Yes, on an inside wall", "No, only outside"]
        options_es: ["Sí, en un techo", "Sí, en una pared de adentro", "No, solo afuera"]
        card_field: true
        why: "Water inside points at the roof, a different category; water only outside stays a gutter job. [judgment]"
      - id: fu_ladder_room
        ask_when: "Two stories, a back or side wall, or a pool or wall mentioned, and no photo of that side"
        text_en: "Is there open, level ground to set a ladder along each side that needs work?"
        text_es: "¿Hay suelo plano y libre para poner una escalera en cada lado donde se va a trabajar?"
        options_en: ["Yes, on every side", "A pool, wall or fence is in the way", "Slope, rocks or plants are in the way"]
        options_es: ["Sí, en cada lado", "Una alberca, muro o cerca estorba", "Una pendiente, rocas o plantas estorban"]
        card_field: true
        why: "Ladder room decides the crew, the equipment and the time. [judgment]"
    photos_priority: [p3, p2]
    urgency:
      fire_dept_triggers: ["Power line down on the roof, carport or ground"]
      urgent_capable_triggers: ["Gutter or downspout hanging over a doorway or walkway", "Rain falling or forecast and water pouring against the house at a missing downspout"]
      regular: "Sag, seam drip or bent downspout with no rain coming"
    scope_line_en: "About 20 feet of gutter hanging loose on the west side of a one-story tile-roof home; board behind it feels soft."
    scope_line_es: "Unos 20 pies de canaleta colgando en el lado oeste de una casa de un piso con techo de teja; la tabla de atrás se siente blanda."
    quote_format: firm
    business_fills: ["price for the repair", "what is included (parts, sealing, haul-away)", "earliest day"]
    card_template: |
      REQ-<id> | Gutter repair | <town>, <general area> | <kind of place>
      <one scope line: what the gutter is doing, where, how many feet>
      Doing: <pulling away / sagging / seam leak / downspout bent or missing>. Stories: <1 / 2 or more>. Roof: <tile / flat or foam / shingle / metal / from photo>.
      Board at the edge: <solid / soft or cracked / none / can't tell>. Ladder room: <open / pool, wall or fence / slope>. Water inside: <yes, where / no>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["The fascia is rotted.", "The wind did that.", "A handyman can put that back up.", "Your foundation will be fine.", "That's a cheap fix."]

  - id: gutter_install
    new_job_type: true
    label: "New gutters, replace old gutters, or covers on existing gutters"
    bank_job_type: "gutter install"
