where_playbook_lost_to_human:
  - "Equipment never asked on any cleaning card: filter and sanitizer were missing in s01, s02, s03, s04, s06, s08, s09, s10 and s11, and the s05 tab habit was the scenario's main point. The human asked 'size, spa, filter type, and how do you chlorinate?' in one turn. Fix: merge size_band and the spa question into one turn that also asks filter and chlorine, or make fu_sanitizer plus a filter question standard for weekly_service, green_pool and one_time_clean."
  - "The one follow-up went to fu_extra_visits in eight scenarios (s01, s02, s03, s06, s07, s10, s11, and s03 where the opening had already said it). It changed nothing in seven. Fix: ask fu_extra_visits only when a rental or vacation home is mentioned and turnovers were not stated; when turnovers are stated (s03), ask how many a week instead. Spend the slot on fu_debris (s01 palms, s11 skimmer basket) or fu_sanitizer (s05)."
  - "Access never asked: s02 lockbox and dog, s07 padlock and two large dogs, s10 pad on the west side, s04 unlocked side gate, s14 side yard. The human asked 'how will the tech get in, gate locked, any pets?' every time. Fix: add a fixed access question to every recurring cleaning job type (fu_access exists only under vacation_service), or fold gate and pets into the timing question."
  - "s02: the human asked what happens May to October and wrote 'undecided'; the playbook card says 'not said'. Fix: when a homeowner gives a season window, route through vacation_service's fu_season, or add a 'Months:' and off-season line to weekly_service and ask it."
  - "s09: the human asked about a dust storm, the pump and access in four questions; the playbook used eight, re-asked the deadline, and missed the storm, pump, equipment and that he is home today. Fix: when water is brown, gray or 'black', ask about wind or a dust storm and whether the pump runs; skip the timing question when the opening gives a deadline."
  - "s06: the human asked about spots that don't wipe off and took the finish color from the homeowner; the playbook relied on the photo text. Fix: when the homeowner says algae but the water is clear, ask 'any spots or patches that don't brush off?'"
  - "s05: routed to one_time_clean, whose allowed follow-ups do not include fu_sanitizer, so the six-year tab habit and the never-drained fact could not be asked; the cartridge correction was never asked either ('Filter: not confirmed'). Fix: add fu_sanitizer and a filter-look question to one_time_clean, or route rebalance requests to chem_only."
  - "s08: the human asked how long it has been green and the filter type; the playbook got neither, nor the empty tab feeder. Fix: for green_pool, ask how long it has been green; use fu_sanitizer when tabs or a floater are likely."
  - "s03: the human got the turnover count, daily spa use and cloudiness, salt and cartridge, the report-after-each-visit request and the house cleaner on the same days. Fix: see the fu_extra_visits fix; add 'any report after each visit?' for rentals."
  - "s14, s15: the brand question returned 'not sure' twice. The human asked speed and age (s14), and fuel, age and gas smell (s15), and marked the heater card licensed-only. Fix: ask brand, speed and age from the label in one turn; for gas heaters ask the fuel and 'any gas smell?', and put 'Licensed only: R-6 or B-6' on the card."
  - "Bank questions that never move a cleanup quote cost turns: 'chemicals included?' on green and one-time jobs (s04, s05, s08), and water on a pool the owner can't see (s02, s03). Playbook median questions 7 against the human's 5. Fix: skip chemicals on green_pool and one_time_clean (always included) and skip water when the homeowner is away."
  - "Routing labels: bank_job_type 'green pool cleanup' for a clear-water rebalance (s05, expected 'chemical balancing') and 'gas pool heater' for a heater replacement (s15, expected 'equipment replacement'). The human and baseline_none carried the expected labels. Fix: map a one-time rebalance to 'chemical balancing' and a heater the homeowner wants replaced to 'equipment replacement', or have the scenario writer and the expert file agree on one label."

compliance:
  violations:
    - {scenario_id: pool_cleaning_s02, code: C11, where: "questions_asked 9 (intake messages 2 to 9 plus the photo ask)", text: "9 questions; the limit is 8"}
    - {scenario_id: pool_cleaning_s02, code: C11, where: "intake message 8", text: "When do you need this? 1 Today 2 This week 3 Flexible 4 By a date"}
    - {scenario_id: pool_cleaning_s03, code: C11, where: "intake message 5", text: "Besides the regular visit, will it need extra visits, like between rental guests? 1 No, just the regular visit 2 Yes, between rental guests 3 Yes, for another reason"}
    - {scenario_id: pool_cleaning_s09, code: C11, where: "intake message 7", text: "When do you need this? 1 Today 2 This week 3 Flexible 4 By a date"}
  count: 4
  clean_scenarios: 12
  notes:
    - "s02 message 8 re-asks timing after the opening said 'We come down the first of November'. s03 message 5 re-asks extra visits after the opening said 'a weekly visit plus a quick check between guest stays'. s09 message 7 re-asks timing after the opening said 'TOMORROW AFTERNOON' and the homeowner answered 'before tomorrow afternoon' to message 2."
    - "C10 clean: every follow_up_used is in allowed_follow_ups for the job type routed, at most one per scenario: fu_extra_visits (weekly_service: s01, s02, s03, s06, s07, s10, s11), fu_pump_running (green_pool: s04, s08), fu_debris (one_time_clean: s09), fu_breaker_trips (pool_repair pump_motor: s14), fu_heater_doing (pool_repair heater: s15). s05 used none."
    - "C3: the fixed 911 text went out in s10 only, once, which is the one fire-truck-list scenario (gas smell at a pool heater). No other safety, health or repair advice in any message or card."
    - "C1, C2, C4, C5, C7, C8, C9, C12: no hits in intake messages or cards. 'Should chemicals be included in the price?' asks about scope and names no price, so it is not counted under C2. No em dashes, exclamation marks or ai_smell words in intake messages; the 911 text is exempt under INT-004."
    - "C6: no card fact the homeowner did not say, apart from the header line. Not counted, per the run's instructions on the town and area line, but noted: the property type 'house' in the header of s01, s02, s04, s05, s06, s08, s09, s10 and s11 was never said. Fix: the template default for an unasked property type should be left blank or read 'not said'."
    - "Near miss, not counted: s07 'Homeowner adds' puts in quotation marks words the homeowner did not type ('im renting, and the landlord said i have to keep it up'); his words were 'im renting a house with a pool and the landlord said i have to keep it up'. Scrubbing may shorten a quote but should not add punctuation inside it."
    - "Expert-file findings for the routing team, not compliance codes: (1) weekly_service's fu_extra_visits ask_when ('or the homeowner said weekly with no other detail') fires on nearly every weekly request and conflicts with its own must_know skip_if ('Homeowner said plain weekly for her own home'); this is why the slot was spent seven times for nothing. (2) fu_access lives only under vacation_service, so weekly_service can never ask about gates or dogs. (3) one_time_clean maps to bank 'green pool cleanup' and has no fu_sanitizer, which blocked the key s05 question. (4) pool_repair heater maps to bank 'gas pool heater' while the scenario expects 'equipment replacement' for a wanted replacement. (5) The weekly_service and green_pool card templates have no filter or access line, so even a stated filter (s10) appears only in the scope line."
