judging_notes:
  - "Labels shuffled per scenario; mapping recorded in each block. Scored from the scenario file and the three run files only; docs/catalog/expert/pool_cleaning.yaml (and pool_repair.yaml for the two routed-out scenarios) was opened only afterwards, for compliance check C10."
  - "trap_caught is true only when every trap listed for the scenario surfaced on the card (or, for stops, when the stop behavior the traps describe was met). Where the main trap was caught but a smaller one was not, the panel notes say so."
  - "Stops for the expected reason (s12 outside_area for all three, s13 no_businesses for all three) score quotable null and routing_correct true. baseline_none s10 stopped at the 911 hold because the homeowner never replied SAFE and the scenario never says everyone is safe: quotable null, fire_dept_correct true, and trap_caught true because the trap the stop could test (the fixed 911 text on the buried gas smell, nothing more said about the heater) was met; the card-level trap could not be tested."
  - "Baseline job_type labels ('weekly pool service', 'chemical balancing', 'green pool cleanup', 'pump repair', 'equipment replacement') count as correct when they name the job type the scenario expects. baseline_none s09 'green pool cleanup' is accepted under the scenario note because its card says brown-gray after a dust storm and not algae."
  - "routing_correct follows README's bar literally: category and bank job type. The playbook recorded bank_job_type 'green pool cleanup' for s05 (expected 'chemical balancing') and 'gas pool heater' for s15 (expected 'equipment replacement'); both kb job_type ids match, but the bank job types do not, so both score false."
  - "The card's town or area line is not counted as an unstated fact (the harness assumes coverage). Not counted, but noted: the playbook header also carries a property type ('house') in s01, s02, s04, s05, s06, s08, s09, s10 and s11 that no homeowner said."
  - "quotable 3 was given only where the card holds size, spa, water, sanitizer, filter, chemicals and debris for a weekly account (baseline_none s11, baseline_human s11). The human may diagnose; SUSPECT and ON SITE lines were read as notes, not as facts, and do not count against it."
  - "Harness fidelity, not scored against any variant: in s10 the simulated homeowner replied SAFE in the playbook and human runs but not in baseline_none, with the same scenario facts."
