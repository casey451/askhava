      - Pump only; no weekly service wanted.
      - Photo: pump housing and motor on the pad, a wet ring below the lid.
      - Needed: not said.
      SUSPECT
      - Hum and no spin with a trip: bad start capacitor or seized bearings. A week-old leak at the lid could be the lid O-ring, or a shaft seal that has let water into the motor bearings.
      ON SITE
      - Spin the shaft by hand power off, test the capacitor, check amp draw.
      - Find the leak: lid O-ring vs shaft seal. If water got into the motor, price a motor or full pump.
      - At 11 years single speed, price a variable-speed replacement too.
