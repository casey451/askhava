    card: |
      REQ-0175 | Weekly pool cleaning | Lake Havasu City
      FACTS
      - One-time chemical balancing visit first; may want weekly after.
      - Homeowner's test strip shows pH way off and alkalinity high.
      - Water clear, no algae.
      - 3-inch chlorine tabs in a floating feeder for about six years.
      - Never drained; stabilizer never tested.
      - Cartridge filter (homeowner first said sand, corrected himself). Asked about changing the sand; it is a cartridge.
      - Small pool, no spa, about 15 years old, plaster.
      - No photo sent.
      - Needed: not said.
      SUSPECT
      - Stabilizer likely very high after six years of tabs with no drain; that can make chlorine weak and may mean a partial drain and refill, not just a rebalance. Havasu fill water is hard, so calcium is likely high too.
      ON SITE
      - Full drop test: CYA, calcium hardness, TA, pH, chlorine. Don't trust the strip.
      - If CYA is high, quote a partial drain and refill as an option; 15-year plaster, check surface condition before draining.
      - Clean the cartridge; "change the sand" is probably a filter cleaning or cartridge replacement request.
      - Suggest switching off tabs if weekly follows.
    facts_in_card_not_stated: []

