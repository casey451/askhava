      REQ-0183 | Pool and spa repair | Lake Havasu City
      FACTS
      - Pump motor hums and does not spin. Homeowner calls it a dead motor.
      - Single speed, about 11 years old.
      - Breaker tripped once yesterday; he reset it. Told to leave it off.
      - Water on the pad near the pump lid, started about a week ago.
