    card: |
      REQ-0174 | Weekly pool cleaning | Lake Havasu City
      FACTS
      - One-time green pool cleanup. Homeowner asked for shock and clean-up; he says it's the heat.
      - Can see the first step, not the second.
      - Pump has not run in about three weeks; hums and does not spin when switched on.
      - Pump about 9 years old.
      - Medium pool, no spa, cartridge filter, chlorine tabs.
      - Equipment through a side gate, not locked.
      - Photo: dark green water from the deck, a floating leaf or two, steps barely visible.
      - Needed: clean for a family party in nine days.
      SUSPECT
      - Green because nothing has circulated for three weeks, not the heat. Hum with no spin: start capacitor or seized motor. Shock without circulation will not clear it.
      ON SITE
      - Pump repair or replacement comes first or at the same visit (pool repair side); no point quoting the cleanup alone.
      - Then: brush, heavy chlorine, run 24/7, clean the cartridge more than once, vacuum to waste, test CYA (tab user).
      - Nine-day deadline is workable only if the pump is running in the first day or two.
