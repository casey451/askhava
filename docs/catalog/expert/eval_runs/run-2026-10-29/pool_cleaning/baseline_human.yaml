category: pool_cleaning
variant: baseline_human
model: "claude-opus-5-5"
run: "run-2026-10-29"
notes: >-
  The intake is played as the best pool-service estimator in Arizona (25 years, has priced thousands of
  Lake Havasu routes, knows the heat, the dust storms, the palms and mesquite, hard water and what six
  years of chlorine tabs does to stabilizer), texting one question at a time, with no question bank, no
  expert file and no trade file. The estimator may say what they suspect and may give the advice a real
  estimator would; the judge notes it, it does not count against this variant. The card holds the crew
  notes (FACTS the homeowner gave or a photo showed, SUSPECT, ON SITE). The homeowner is played strictly
  from the scenario: hidden facts only when a question clearly calls for them, "not sure" for anything
  outside them, busy after max_questions plus 2. Coverage is assumed confirmed for Lake Havasu City
  except in s12 (outside area) and s13 (no businesses), where the intake stops before any trade question
  as intake_agent.md says. questions_asked counts every question and photo ask the estimator sent (not
  the coverage line, not the gas-smell message, not the closing line). job_type values use the kb ids
  named in the scenario file where they fit the estimator's own call. In s11 the palm trimming goes out
  as a separate request in the extra key second_card, so the pool card stays pool only.
