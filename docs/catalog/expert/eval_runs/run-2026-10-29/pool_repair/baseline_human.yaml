    card: |
      REQ-0104 | Pool and spa repair | Lake Havasu City
      FACTS
      - Level drops about 1 inch a day, even on cooler nights.
      - Drop is about the same with the pump on or off.
      - Left alone, the level stops at about the middle of the skimmer opening.
      - Auto-fill has been running a lot; water bill went up.
      - Damp patch on the gravel near the equipment pad that never dries.
      - Pool about 25 years old, plaster, attached spa with spillover. No cover.
      - Homeowner believes it is evaporation; husband wants it checked. Estimator told her an inch a day is on the high side and worth a leak check.
      - No photo.
      - Needed: not said.
      SUSPECT
      - Stops at mid-skimmer: skimmer body, skimmer throat to plaster joint, or the skimmer suction line.
      - Damp gravel at the pad: a leak in pad plumbing or valves, a buried line near the pad, or the auto-fill supply line itself.
      - Same loss pump on or off makes a pressure-side-only leak less likely.
      ON SITE
      - Leak detection: dye test the skimmer throat and body, light niche, returns, spillover and spa; pressure test the skimmer and suction lines.
      - Dig/probe the damp spot; check pad unions and valves; check the auto-fill valve and its supply line for a leak or overfill.
      - Shut the auto-fill off for a 24-hour bucket test baseline so the real loss rate is known.
    facts_in_card_not_stated: []

