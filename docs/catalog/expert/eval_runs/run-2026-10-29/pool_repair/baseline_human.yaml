      REQ-0106 | Pool and spa repair | Lake Havasu City
      FACTS
      - Salt system display says check cell; low-salt light is not lit.
      - Hayward salt system, about 4 years old (from the label).
      - Store test strips read chlorine near zero.
      - White crust on the tile line and the waterfall edge.
      - About 12000 gallons. Water still clear for now.
      - No photos: homeowner's phone cannot send pictures. Texts only.
      - Needed: not said.
      SUSPECT
      - Scaled cell from hard Havasu water, or a cell near end of life at 4 years. Near-zero chlorine fits either.
      - Tile and waterfall crust point at high calcium and pH; same water that scales the cell.
      ON SITE
      - Pull and inspect the cell; acid wash if scaled; check cell hours and output in the diagnostic menu.
      - Test salt, pH, alkalinity, calcium hardness and CYA; balance to slow scaling.
      - Bring a replacement cell price in case the plates are worn.
      - Tile crust is a separate add-on: offer a tile cleaning or bead-blast price.
      - Get the cell model off the label on site (he can read it but was not asked).
