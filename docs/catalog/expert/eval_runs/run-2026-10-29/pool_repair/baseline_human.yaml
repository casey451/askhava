      REQ-0110 | Pool and spa repair | Lake Havasu City | TODAY OR TOMORROW
      FACTS
      - Water sprayed out around the top valve of the filter when the pump started after sitting off a week.
      - Gauge read about 35 psi right before it sprayed.
      - DE filter (white powder around the valve), about 7 years old.
      - Pump now off at the switch. Nobody hurt, nobody in the pool.
      - Pool water level lower now, still usable.
      - Photo: round filter tank, wet pad with water pooled on the concrete, multiport valve on top.
      - Told to leave the pump off.
      - Needed: today or tomorrow. Pool can sit; party is outside.
      SUSPECT
      - Multiport valve: blown spider gasket, lid O-ring, or a cracked valve body or lid, pushed by high pressure at startup.
      - 35 psi on a DE filter: grids loaded or the DE caked after sitting, maybe trapped air or a closed return.
      ON SITE
      - Check the tank clamp band and lid first before pressurizing.
      - Inspect the multiport lid, spider gasket and body; check the air relief and gauge.
      - Pull and clean the grids, recharge DE; check returns are open.
      - Bring a spider gasket, lid O-ring and price a multiport valve.
