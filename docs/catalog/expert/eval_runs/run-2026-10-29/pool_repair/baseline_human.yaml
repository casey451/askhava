      REQ-0112 | Pool and spa repair | Lake Havasu City | SOON (pool off)
      FACTS
      - Old pump: Pentair single speed, about 13 years old; motor hums and does not start.
      - Owner already bought a new variable-speed pump online; it is boxed in the garage. Install only, customer-supplied.
      - Pool off 4 days; water still clear.
      - Existing wiring: conduit from the garage subpanel to the timer box at the pad, about 25 feet. Subpanel has two open breaker slots.
      - Owner wants the old timer box removed.
      - Owner was told by a pump dealer the new pump needs a 240 circuit; nobody has looked at it yet.
      - Photo: old pump on the pad, gray timer box on the wall with conduit running up, open breaker subpanel in the garage.
      - Needed: not said.
      SUSPECT
      - A 13-year single-speed is often already on 230V; the VS pump may run on the existing circuit, and a new circuit may not be needed.
      - Removing the timer box still needs a disconnect at the pad and GFCI protection for the pump; the VS pump's own timer replaces the mechanical one.
      ON SITE
      - Measure voltage and check wire size and breaker at the subpanel before quoting any new circuit.
      - Confirm the new pump's model, voltage and plumbing size; plan unions and fittings.
      - Labor-only quote; state who warranties customer-supplied equipment.
      - If new wiring or a new circuit is needed, that part goes to the electrical card.

      REQ-0112-E | Electrical (separate card) | Lake Havasu City
      - Possible new 240V circuit from the garage subpanel to the pool pad for a new variable-speed pump; existing conduit run about 25 feet; two open breaker slots.
      - Owner also wants the old timer box removed; keep a disconnect and GFCI protection at the pad.
      - Nobody has confirmed a new circuit is needed; check the existing circuit first.
