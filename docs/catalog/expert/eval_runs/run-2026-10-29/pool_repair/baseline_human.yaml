      - Photo: filter tank on the pad with a wet stain and a drip at the base, pressure gauge on top.
      - Needed: not said.
      SUSPECT
      - Drip at the base: drain cap or its O-ring, a cracked bottom/bulkhead, or a hairline crack in an old tank.
