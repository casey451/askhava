      REQ-0102 | Pool and spa repair | Lake Havasu City | LICENSED ONLY (R-6 or B-6), gas heater
      FACTS
      - Gas pool heater (homeowner calls it the pool furnace), natural gas.
      - When it calls for heat it clicks a few times, then nothing lights. No code on the display.
      - Pool pump runs normally and water flows.
      - No gas smell, no hissing.
      - About 14 years old.
      - Heater is on the side of the house.
      - Photo: heater cabinet, data plate partly visible, light rust staining along the bottom edge, gray gas pipe entering the side.
      - Needed: warm for Thanksgiving (grandkids visiting).
      SUSPECT
      - Clicks with no light: ignition side (igniter or spark/pilot assembly, gas valve not opening) or a safety in the chain (pressure switch, high limit) opening during the try. No code on a unit that should throw one could also mean a control board fault.
      - 14 years with rust at the base: check the heat exchanger and burner tray; this may turn into a replace-vs-repair talk.
      ON SITE
      - Read the model from the plate; check gas pressure at the valve, igniter, flame sense, pressure switch and limits.
      - Inspect the burner tray and cabinet base for rust-through.
      - Price both repair and a replacement heater so he can decide before Thanksgiving.
