      - Confirm filter type and read the tank label for age.
      - Check the drain cap, base and tank for cracks; check the gauge is accurate.
      - Backwash and see if pressure drops; check return valves and lines.
      - Quote both a drain-cap or valve fix and a tank replacement; written quote for the landlord.
