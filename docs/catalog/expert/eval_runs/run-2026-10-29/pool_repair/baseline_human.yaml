    card: |
      REQ-0103 | Pool and spa repair | Lake Havasu City | SOON (no circulation, green)
      FACTS
      - Pump not running, no sound at all when the timer says it should be on.
      - Owners were away about 5 weeks; timer set to run daily.
      - Panel at the pad looks normal; one breaker in the garage subpanel is in the middle (tripped) position. Told to leave it for the tech.
      - Hayward variable-speed pump, about 6 years old.
      - Salt system.
      - About 15000 gallons, plaster, attached spa on the same equipment. Pool and spa are both green.
      - Photos: green pool with leaves on the surface; equipment pad with the pump lid dry and dusty.
      - Homeowner asked for shock and cleanup; told repair comes first, cleanup after. Second job: green-pool cleanup for a cleaning company once circulation is back.
      - Needed: asap (homeowner's word).
      SUSPECT
      - Something tripped that breaker while they were gone: failed VS drive, a shorted motor, water in the motor or junction box, or a monsoon storm surge. Pump ran dry at some point is possible (dusty lid).
      - Salt cell made no chlorine without flow, which is why it went green; the cell and flow switch may need a look too.
      ON SITE
      - Before resetting: check the circuit for a short to ground (motor, drive, wiring, light circuit if shared).
      - Reset, check the VS drive display for fault codes, prime the pump, check the lid O-ring and basket.
      - Check the salt cell and flow switch once running.
      - Hand the cleanup to the cleaning side: about 15000 gallons plus the spa, plaster, salt pool.
