    card: |
      REQ-0101 | Pool and spa repair | Lake Havasu City | SOON (pool off)
      FACTS
      - Pump motor hums when the timer kicks on; shaft does not turn.
      - Pool has been off about 3 days.
      - Pool breaker tripped twice this week.
      - Pentair, two-speed, about 8 years old.
      - Equipment is behind a locked side gate; homeowner is home most days.
      - Told homeowner to leave it off at the timer.
      - No photo. Water condition not asked.
      - Needed: not said.
      SUSPECT
      - Hum with no spin: failed start capacitor or seized shaft/bearings. Two breaker trips point at locked-rotor current or a shorting winding, so the motor may be done, not just the capacitor.
      ON SITE
      - Call ahead so he can open the gate.
      - Spin the shaft by hand with power off; test the start capacitor; check amp draw and the motor windings to ground.
      - Check the wiring at the timer and the breaker itself before condemning the motor.
      - Bring a capacitor and price a motor swap; at 8 years, also price a variable-speed pump.
