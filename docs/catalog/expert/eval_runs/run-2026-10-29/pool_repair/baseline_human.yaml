category: pool_repair
variant: baseline_human
model: "claude-opus-5-5"
run: "run-2026-10-29"
notes: >-
  The intake is played as the best pool and spa repair estimator in Arizona (25 years, knows Lake
  Havasu heat, hard water and equipment pads), texting one question at a time, with no question bank,
  no expert file and no trade file. The estimator may say what they suspect and may give the advice a
  real estimator would; the judge notes it, it does not count against this variant. The card holds the
  crew notes (facts got, suspicions, on-site checks). The homeowner is played strictly from the scenario:
  hidden facts only when a question clearly calls for them, "not sure" for anything outside them, busy
  after max_questions plus 2. Coverage is assumed confirmed for Lake Havasu City except in s13 (outside
  area) and s14 (no businesses), where the intake stops before any trade question as intake_agent.md
  says. questions_asked counts every question and photo ask the estimator sent (not the coverage line,
  not the gas-smell message, not the closing line). job_type values use the kb ids named in the
  scenario file where they fit the estimator's own call.
