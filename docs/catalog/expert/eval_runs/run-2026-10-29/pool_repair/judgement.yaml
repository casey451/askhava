where_playbook_lost_to_human:
  - "s04 leak: the playbook got only the loss rate. The human asked pump on versus off, where the level stops, autofill and water bill, wet spots, pool age with spillover spa, and cover. Fix: for leak, ask fu_loss_pump_off and fu_autofill as fixed questions (or allow two follow-ups for leak), and drop the surface question, which does not change a leak-search quote."
  - "Card template defaults state facts nobody gave: 'Pump on versus off: not compared' (s04) and 'Breaker or GFCI trips: not checked' (s05, s09) when the question was never asked. Fix: the default for an unasked field is 'not asked'."
  - "s01, s09: the brand question offers only brands, so speed and age never came out (s01 two-speed and 8 years; s09 single speed and 9 years). The human asked 'brand, one speed or two, and about how old' in one turn. Fix: reword equipment_brand for pumps to ask brand, speed and age from the motor label."
  - "s09: with two motors in the photo, the human asked which one is loud and where the water comes out; the playbook got 'the big one' only because the homeowner volunteered it, and never asked where the drip is or what the second motor does. Fix: when the photo shows two pumps, ask which one and what the other is for; for any pump drip, ask where on the pump the water shows (fu_wet_where-style)."
  - "s05: the human used the sprinkler riser in the photo to ask when the pad gets wet; the playbook described the riser but never asked. Fix: when a leak is reported and the photo shows irrigation near the pad, ask when the pad is wet and whether it is dry when the sprinklers are off."
  - "s03: pool_or_spa was skipped, so the green attached spa sharing the equipment is missing. Fix: never skip pool_or_spa when the water is green or the job may be followed by a cleanup."
  - "s07, s01, s12: no access question. The human asked who would be there and what days (s07 son, weekends only). Fix: add one fixed access line ('Anything about getting to the equipment: gate, who will be there, which days?') or fold it into the timing question."
  - "s02, s07: the first question re-asked the symptom the opening message already gave ('wont fire up', 'light does not come on'). The human spent those turns on the display code and gas smell (s02) and on access (s07). Fix: skip the symptom question when the opening names the failing equipment and what it does."
  - "s02: the card does not say licensed-only (R-6 or B-6) for a gas heater; both baselines put it on the card. Fix: the heater card template should carry a 'Licensed only: R-6 or B-6' line."
  - "s12: the human asked about the panel and open slots and whether anyone had checked the circuit; the playbook spent the turn on pool size, which does not move a labor-only install. It also left the card not urgent with the pool off 4 days. Fix: for equipment_replace with a wiring mention, ask about the panel instead of size; flag urgent when the old pump is dead and the pool is off."
  - "s08: drip rate not asked (human got 'one drop a second'). s15: surface not asked."
  - "s10: the playbook card says 'DE' as the homeowner's words, plus water level lower and 'okay with the pool sitting', none of which he said. The human asked filter type directly. Fix in the run agent and the card rule: only words from the transcript; ask filter type when the homeowner hasn't named it."

