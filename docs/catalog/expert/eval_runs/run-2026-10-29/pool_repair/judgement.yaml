judging_notes:
  - "Labels shuffled per scenario; mapping recorded in each block. Scored from the scenario file and the three run files only; the expert file was opened only afterwards for compliance check C10."
  - "trap_caught is true only when every trap listed for the scenario surfaced on the card (or, for stops, when the stop behavior the traps describe was met)."
  - "Stops for the expected reason (s13 outside_area, s14 no_businesses) score quotable null and routing_correct true. The playbook's s11 stop at the 911 hold (homeowner never replied SAFE, and the scenario never says everyone is safe) scores quotable null and fire_dept_correct true."
  - "Baseline job_type labels such as 'pump repair' count as correct when they name the job type the scenario expects. baseline_none s07 labeled the job 'pool light (not a listed pool_repair job type)', which declines to name automation_electrical, so it is scored routing_correct false."
  - "The general area in the playbook card headers ('central', 'north side') appears nowhere in any transcript; the coverage/ZIP exchange is missing from the run, so it is listed under facts_not_stated."
  - "Harness fidelity, not scored against any variant: in s04 the playbook's photo ask ('a photo of any wet spot or puddle') clearly called for the hidden damp patch, but the simulated homeowner answered 'nothing wet that i can see'. In s11 the simulated homeowner replied SAFE in both baselines but not in the playbook run, with the same scenario facts."
