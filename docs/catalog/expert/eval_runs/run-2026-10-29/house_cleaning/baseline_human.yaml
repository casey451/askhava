    card: |
      REQ-0103 | Plumbing repair (sent over from a cleaning request) | Lake Havasu City
      FACTS
      - Hall bathroom: floor around the toilet gets wet after every flush, not when nobody uses it.
      - Mopped dry in the morning, wet again by evening.
      - Toilet rocks a little when sat on.
      - Going on about 3 weeks. Smells bad.
      - Homeowner first asked for a bathroom scrub; she believes it is grime.
      - Photo: tile floor around the toilet base, dark grout lines, damp ring around the base.
      - Needed: not said.
      SUSPECT
      - Failed wax ring from a loose or rocking toilet; possibly a broken flange or loose closet bolts.
      - Water under the tile and grout soaking it up, hence the smell.
      ON SITE
      - Pull the toilet, check the flange and subfloor, reset on a new seal, shim if needed.
      - Floor may need drying; grout can be cleaned or regrouted after the repair.
