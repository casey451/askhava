      REQ-0107 | House cleaning: move-out | Lake Havasu City | DATE-CRITICAL
      FACTS
      - Move-out clean of a 2 bedroom, 1 bathroom apartment, about 900 sq ft.
      - Unit empty by Thursday noon. Landlord inspection Friday 10am. Clean must be done Thursday afternoon (or Wednesday if the tenant is out earlier).
      - Landlord's move-out list: oven, inside fridge, blinds, baseboards, and carpet cleaning.
      - Carpet in both bedrooms is stained; landlord wants a carpet-cleaning receipt. Question for the business: do you do carpet cleaning with a receipt, or does the tenant need a separate carpet cleaner?
      - Tenant (not owner) is booking; tenant has the key until Friday morning.
      - Photos: greasy stovetop and grease on the oven door glass; soap scum on the tub.
      - Needed: by Thursday, before the Friday 10am inspection.
      SUSPECT
      - Oven is the long pole: heavy degrease, glass scraped. Tub needs scum removal.
      - Blinds and baseboards add real time in a 2/1; plan two people for a half day.
      - Carpet: stains in both bedrooms may need a pro extraction; book a carpet cleaner the same afternoon if the crew doesn't do it.
      SITE / FIRST VISIT
      - Work from the landlord's list line by line; photo each item when done for the tenant.
      - Arrange key handoff Thursday noon.
