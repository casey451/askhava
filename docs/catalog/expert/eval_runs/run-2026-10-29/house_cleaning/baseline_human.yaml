category: house_cleaning
variant: baseline_human
model: "claude-opus-5-5"
run: "run-2026-10-29"
notes: >-
  The intake is played as the top house-cleaning estimator in Arizona (25 years, knows Lake Havasu
  City homes, hard water, dust and heat), texting one question at a time, with no question bank,
  no expert file and no trade file. The estimator may say what they suspect and may give the advice
  a real estimator would; the card holds the crew notes (facts got, suspicions, on-site checks).
  The homeowner is played strictly from the scenario and quits after max_questions plus 2.
  Coverage is assumed confirmed for Lake Havasu City (3 businesses) except in s12 (outside area)
  and s13 (no businesses), where the intake stops before any trade question as intake_agent.md says.
  job_type values use the kb ids that appear in the scenario file where one fits the estimator's
  own call. In s10 the estimator sends their own gas warning instead of the app's fixed text and
  keeps taking the cleaning details without a SAFE reply (a human is not bound by the app's hold);
  fire_dept_text is true because a 911 message was sent. In s11 the dryer is written up as a
  separate request in the extra key second_card, so the cleaning card stays cleaning only.
