      REQ-0109 | House cleaning: one-time deep clean | Lake Havasu City
      FACTS
      - One-time deep clean, whole house.
      - 3 bedrooms, 2 bathrooms. About 8 months since a thorough clean.
      - Dark spots in the shower caulk and shower grout, and in two window tracks only.
      - Walls and ceilings: no stains, no bubbling, no soft spots. No musty smell. No known leak or flood.
      - Photo: dark speckled spots along shower caulk and grout and in a bedroom window track; walls and ceiling around them look clean and dry.
      - Homeowner is worried it is mold; calls it black mold.
      - Needed: any day this week.
      SUSPECT
      - Surface mildew in caulk, grout and window tracks; not a remediation job from what was described.
      - Grout and tracks clean up; caulk stained through will not, and may need recaulking (offer or refer).
