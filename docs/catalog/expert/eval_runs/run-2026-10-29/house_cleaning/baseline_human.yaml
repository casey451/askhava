      REQ-0108 | House cleaning: post-construction | Lake Havasu City | Homeowner texts in Spanish
      FACTS
      - After-remodel dust clean. New tile floors installed last week throughout the house.
      - 4 bedrooms, 3 bathrooms, one story. Empty; contractor finished and gone, nobody living there yet.
      - Tile has a white cloudy haze that wipes off a little but comes back.
      - Dust is in the air vents, ceiling fans and inside the kitchen cabinets.
      - Dried paint drips on some baseboards and window frames.
      - Photo: fine pale dust on shelves and windowsills, paint-splatter marks at the base of a wall, hazy white film on the new tile.
      - Needed: within 10 days, before furniture arrives.
      SUSPECT
      - Haze is grout or thinset residue from the install; needs a haze remover and a test spot, and may be the installer's to remove.
      - Fine drywall/tile dust will resettle: plan two passes, vacuum before wiping, inside all cabinets.
      - Return-air vents and the HVAC filter are full of dust; replace the filter and run the system before the final wipe.
      SITE / FIRST VISIT
      - Test the haze in a corner before quoting the floors.
      - Bring razor scrapers for paint drips; confirm finish on frames before scraping.
      - Owner speaks Spanish and some English; send a Spanish-speaking lead if possible.
