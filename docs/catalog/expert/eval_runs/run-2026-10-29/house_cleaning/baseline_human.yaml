      REQ-0101 | House cleaning | Lake Havasu City
      FACTS
      - Recurring clean every two weeks.
      - 3 bedrooms, 2 bathrooms, two-story. Stairs are carpeted.
      - 3 large dogs that shed; one is a husky mix.
      - About 5 months since the last professional clean.
      - Shower glass in both bathrooms covered in white hard-water spots.
