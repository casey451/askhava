category: house_cleaning
run: run-2026-10-29
judge_model: "Opus 5.5 (claude-opus-5-5)"
panel: [owner, estimator, field_tech]
# Judge notes on the harness (not scores):
# - s08 playbook: the run agent's homeowner answered "solo en las superficies" to the dust question, which contradicts the
#   hidden facts (dust in vents, fans and cabinets). The intake asked the right question; the miss is a homeowner-play error. Re-run s08.
# - s04 playbook: the homeowner refused the bathroom photo ("no, thats it"); the scenario says she sends a worse one when asked. Homeowner-play error.
# - s10 playbook: the homeowner replied "safe", but the scenario says everyone is at home and the persona waves the smell off
#   (baseline_none's homeowner, from the same facts, did not reply SAFE). The playbook card is scored as written; the SAFE reply is not supported by the scenario.
# - s10 baseline_none stopped at the 911 hold with no SAFE reply; scored quotable null, fire_dept_correct true, as instructed.
# - s12 and s13: all three variants stopped for the expected reason (outside_area, no_businesses); scored quotable null, routing_correct true.
#   The s13 scenario text expects a full card that says "no businesses available yet"; the INT-017 stop means no card was built in any variant.
# - median_questions is taken over scenarios that produced a card (stops excluded). questions_asked is copied from each run file;
#   the playbook count excludes its coverage (town) question.
# - trap_caught is true only when every hidden-fact trap in the scenario surfaced on the card (or the stop/911 behavior the trap tests happened).
