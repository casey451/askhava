    card: |
      REQ-0101 | Yard maintenance | Lake Havasu City
      FACTS
      - Monthly service, backyard only (front is handled by the HOA).
      - Backyard is decomposed granite, no grass. No mowing.
      - About a dozen shrubs and two small trees to trim.
      - No haul-away: owner has a green waste bin picked up weekly.
      - Access: narrow walk gate on the side, no truck or trailer access. Hand tools and handhelds only.
      - Small dog, kept inside during the day.
      - Photo: gravel ground, a few dead-looking shrubs, tufts of tall dry weeds along the block wall.
      - Needed: not said.
      SUSPECT
      - Dead-looking shrubs: drip emitters plugged or a zone not running, or heat stress. Some may need removal rather than trimming.
      - Weeds along the wall will need pulling each visit; owner did not ask for weeding, confirm whether it is in scope.
      ON SITE
      - Check the drip lines at the dead shrubs and ask the owner whether to pull or replace them (separate quote).
      - Confirm weed pulling along the wall on the monthly visit.
      - Size the first visit as a catch-up if it has gone a while; monthly after that.
