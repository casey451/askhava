    card: |
      REQ-0103 | Yard maintenance | Lake Havasu City
      FACTS
      - Gravel raking only, side yard, about 30 feet affected. Owner will buy rock himself later if needed.
      - Has been washing out every few weeks; owner believes it is monsoon runoff.
      - Dip is damp even on days it has not rained.
      - Dip runs along the line of the black drip tubing.
      - Water bill higher for the last two months.
      - Yard slopes slightly toward the side gate.
      - Owner has not touched the drip system or the timer.
      - Photo: bare dip about a foot wide in tan gravel, dark wet soil in the dip, black tube with a clamp-on fitting partly exposed at one end.
      - Needed: not said.
      SUSPECT
      - Drip leak at or near the exposed clamp fitting (blown fitting or split tube), washing fines out along the slope. Rain is not the main cause.
      - Raking without fixing the leak will wash out again and the crew will get blamed.
      ON SITE
      - Before raking, run the drip zone and look for the wet spot or bubbling at the fitting. Photograph it for the owner.
      - If it is a leak: tell the owner, recommend a drip repair (simple fitting swap, or an irrigation company if it is the lateral or valve). Get his OK before raking.
      - Rake the gravel back over the 30 ft; do not bury the exposed tube until it is checked.
      - Owner is sure it is monsoon; show him, do not argue.
