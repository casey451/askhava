    card: |
      REQ-0106 | Yard maintenance | Lake Havasu City
      FACTS
      - One-time trim, front of the house. Not recurring (once a year is what she can afford).
      - Three large oleanders, about 9 ft tall, and a hedge about 25 ft long against the front window and walkway.
      - Haul away all clippings.
      - Bees or wasps flying in and out of the hedge near the front window lately.
      - Owner walks with a walker; front walkway is narrow. Text before arriving, she cannot get to the door quickly.
      - Photo: three large overgrown oleanders, thick green hedge right against the front window and walkway.
      - Needed: not said.
      SUSPECT
      - Likely a nest inside the hedge by the window. May be honeybees (common in hedges here) or paper wasps.
      - Cost-sensitive elderly owner: quote a clear one-time price, no service plan pitch.
      ON SITE
      - Check the hedge for the nest before cutting. If there is a nest, do not trim that section; recommend a bee removal or pest company (separate trade).
      - Oleander is toxic: gloves and long sleeves, bag it, no chipping into mulch for her beds, never burn it.
      - Keep the walkway clear the whole time she may use it; tarps, not debris on the walk.
      - Clear the window and walkway back far enough to last a year.
    facts_in_card_not_stated: []

