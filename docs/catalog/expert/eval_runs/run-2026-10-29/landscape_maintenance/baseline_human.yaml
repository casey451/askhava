notes: >-
  The intake is played as the best yard-maintenance and landscaping estimator in Arizona (25 years,
  knows Lake Havasu City rock yards, Bermuda lawns, palms, drip systems and monsoon season), texting
  one question at a time, with no question bank, no expert file and no trade file. The estimator may
  say what they suspect and may give the advice a real estimator would; the card holds the crew notes
  (facts got, suspicions, on-site checks). The homeowner is played strictly from the scenario: hidden
  facts only when a question calls for them, traps never volunteered. Coverage is assumed confirmed
  for Lake Havasu City (3 businesses) except in s12 (outside area) and s13 (no businesses), where the
  intake stops before any trade question as intake_agent.md says. job_type values use the kb ids that
  appear in the scenario file (maintenance, cleanup, weed_control, leak_active). questions_asked counts
  every question and photo ask sent; the SAFE request in s10 and the coverage lines are not counted.
