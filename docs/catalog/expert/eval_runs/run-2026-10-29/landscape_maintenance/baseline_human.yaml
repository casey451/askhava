    card: |
      REQ-0108 | Mantenimiento de jardín / Yard maintenance | Lake Havasu City
      DATOS (en palabras del cliente)
      - Cada dos semanas: cortar el pasto y podar arbustos, patio de atrás y de adelante.
      - Atrás: como 2,500 pies cuadrados de pasto. Adelante: grava, chico, con dos arbustos.
      - Setos de como 7 pies en la barda de atrás.
      - Bugambilia con espinas pasada a la cerca del vecino.
      - Hay alberca; el pasto llega hasta la orilla.
      - Llevarse todo lo que se corte.
      - Perrito; se queda adentro cuando trabajan.
      - Necesita: no dijo.
      FACTS (English, for the crew)
      - Every two weeks: mow and trim, front and back. Haul away clippings.
      - Back lawn about 2,500 sq ft; front is small gravel with two shrubs.
      - Hedges along the back wall about 7 ft tall.
      - Thorny bougainvillea climbing the side fence and grown over onto the neighbor's side.
      - Pool in the back; lawn runs right up to the pool edge.
      - Small dog, kept inside during work.
      - Photo: back lawn about two thirds green, tall hedges along the back wall, bougainvillea on the side fence, garden hose coiled on the grass.
      - Owner texts in Spanish; reply in Spanish.
      SUSPECT
      - Brown third of the lawn: irrigation coverage gap or a head out. Not in scope; mention to owner.
      ON SITE
      - Blow discharge away from the pool; bag or side-discharge away from the water. Skim anything that lands in it.
      - Bougainvillea over the neighbor's fence: get owner's OK on how far to cut on the neighbor side; thorn gloves, haul it all.
      - 7 ft hedges need a pole trimmer or short ladder.
