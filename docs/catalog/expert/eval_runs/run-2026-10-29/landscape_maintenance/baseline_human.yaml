    card: |
      REQ-0115 | Plumbing repair (urgent) | Lake Havasu City
      FACTS
      - Water spraying up out of the ground in the front yard gravel from a pressurized pipe (owner: a real pipe, not drip tube), about 10 ft from the garage.
      - Turning off the irrigation timer did not stop it.
      - Cannot shut off: owner does not know where the main shutoff is (told to check the meter box at the street).
      - Running about 20 minutes; water has reached the garage door apron, not inside yet.
      - Gravel washing out in a channel.
      - No one has dug there recently.
      - Photo: front gravel flooded about two inches deep with muddy water, fountain spraying up from a bare spot between two plants, water running toward the garage door apron.
      - Needed: now.
      SUSPECT
      - Timer off and still flowing means it is upstream of the zone valves: the irrigation mainline (often PVC) between the house supply or backflow and the valves, or the house supply itself. Likely a split or blown PVC fitting.
      ON SITE
      - Shut off at the meter or the irrigation isolation valve first; bring a meter key.
      - Locate the backflow preventer and valve manifold, dig at the fountain, repair the line.
      - Gravel and drainage re-set after repair is a yard job (refer).
