  # quotable_share = scores of 2 or 3 over scored scenarios (nulls left out), the way scripts/expert_eval_report.py computes it.
  # median_questions covers all 16 scenarios, stops at 0 included, as the script does.
  playbook: {median_quotable: 2, quotable_share: 0.58, median_questions: 5, routing_correct_share: 1.0, fire_dept_correct_share: 1.0, trap_caught_share: 0.21, facts_not_stated_count: 0}
  baseline_none: {median_quotable: 2, quotable_share: 1.0, median_questions: 6, routing_correct_share: 1.0, fire_dept_correct_share: 1.0, trap_caught_share: 0.86, facts_not_stated_count: 0}
  baseline_human: {median_quotable: 2, quotable_share: 1.0, median_questions: 5.5, routing_correct_share: 1.0, fire_dept_correct_share: 1.0, trap_caught_share: 1.0, facts_not_stated_count: 1}
# Playbook detail: 7 of 12 scored scenarios quotable (s02, s03, s05, s06, s08, s10, s11); scored 1 on s01, s04, s07, s09, s16. Null on s12, s13, s14, s15.
# Playbook traps caught: 3 of 14 (s07, s09, s10). Baselines: 14 of 14 scored scenarios quotable each.
where_playbook_lost_to_human:
  - "Plant size for trimming is never asked. The card read 'Tallest: not said' on s01, s06, s10 and s16. The human asked how many plants and how tall (a dozen shrubs and 2 small trees; oleanders 9 ft and a 25 ft hedge; meter bushes 5 ft; palms 25 to 30 ft). Fix: make a trimming bank question 'How many bushes or trees, and about how tall is the tallest?' required, ahead of yard size."
  - "The Small/Medium/Large yard-size question throws away the numbers. s02's 'two-car driveway plus a strip' became 'small'; s04's back yard of 3,000 sq ft Bermuda on a steep slope to a wash, with 120 ft of 8 ft hedge, never reached the card. Fix: ask 'What's in the yard, front and back, and about how big?' as free text, keep her numbers, and for mowing ask 'Is any of it on a slope?'"
  - "There is no 'anything the crew should watch for' question. The human got stinging insects in the hedge (s06), the pool at the lawn edge (s08), loose drip lines (s02), pop-up sprinkler heads (s05), the car under the palms and fronds on the roof (s16), the walk gate (s01) and the walker and narrow walkway with text-first (s06). Fix: one fixed question 'Anything the crew should know about: pets, a pool, sprinkler heads, a narrow gate, things on the ground?'"
  - "s03: fu_water_issue asks the homeowner to judge his own system ('Is anything wrong with the watering system?'), and he said no. The human asked what can be seen: 'Is the dip damp on days it hasn't rained?', 'Does it run along the tubing?', 'Has the water bill gone up?' Fix: change the gravel-raking follow-up to the neutral 'Is that spot damp on days it hasn't rained?' Also keep 'raking only or new rock' as an asked question; the card said rock was wanted, and it wasn't."
  - "Cleanup haul volume is never asked (s07, s09). The human got 4 cubic yards of trimmings, and 6 cubic yards of fronds plus 4 pallets. Fix: for yard cleanup, use the follow-up on pile size ('About how big is the pile: a pickup load, a trailer, more?') instead of fu_pile_only, which only repeated what the photo showed."
  - "Access when nobody is home (s07 unlocked side gate, s09 lockbox) and tenant authorization (s07 landlord OK) were missed. The one follow-up went elsewhere. Fix: when the requester says they rent, ask 'Has the owner OK'd the work?'; ask access ('How will the crew get in?') as a bank question for cleanup rather than spending the single follow-up."
  - "Questions already answered in her own words were asked again: timing after 'asap' (s02), after 'Saturday / today or tomorrow' (s09) and after 'b4 monsoon' (s16); haul after 'take away the clippings' (s06); a photo ask after 'my camera is broken' (s05); the water follow-up after 'zone 3 doesn't come on' (s11). Fix: apply the skip rule to the fixed INT-030 timing question and the photo ask too, and put her stated timing on the card as 'Needed:'."
  - "s14 and s15: the routed_elsewhere stop ends with no card. Both baselines carried on in the right trade and wrote quotable cards: pest control with 4,000 sq ft DG, dogs and a veg bed; plumbing with 'cannot shut off, water at the garage apron, 10 ft from the garage'. For an active flood, no card is the worst outcome. Fix: after the routing line, run the target category's question set and write that category's card."
  - "s08: the card is English only. The human wrote it in Spanish with an English section for the crew, as the scenario asks."
  - "s10: the outdoor gas smell at the meter was left off the card. Both baselines kept it as the homeowner's words. This is a harness decision; at minimum, add a neutral crew note quoting the homeowner."

compliance:
  # Playbook run only, checked against compliance_judge.md C1 to C12 and docs/ai_smell.yaml.
  # C10: docs/catalog/expert/landscape_maintenance.yaml was opened only here. Each follow_up_used was checked against the
  #   allowed_follow_ups of the job type the card template shows the intake landed on: s03 fu_water_issue (maintenance),
  #   s04, s05 and s08 fu_access (lawn_mowing), s11 fu_water_issue (lawn_mowing lists it), s07 and s09 fu_pile_only (cleanup),
  #   s16 fu_near_wires (shrub_tree_trim). Every one is allowed, and no scenario used more than one. No C10 violation.
  # C3: the 911 text went out in s10 (gas smell, a fire-truck-list fact) and nowhere else. s15 (flood) and s16 (wire near a palm,
  #   not down) correctly got none. No other safety, shutoff or repair advice.
  # C4, C7, C8, C9, C12: no hits. No em dashes, exclamation marks or ai_smell words or patterns in any intake message (the 911 text is exempt under INT-004).
  violations:
    - {scenario_id: landscape_maintenance_s15, code: C1, where: "intake message 1 (read)", text: "This sounds like a leaking water line, not yard work."}
    - {scenario_id: landscape_maintenance_s15, code: C5, where: "intake message 1 (read)", text: "It goes to plumbing repair, so I can't take it here.", note: "Tells the homeowner where her active flood goes, but the run stopped with no card, so nothing went to plumbing."}
    - {scenario_id: landscape_maintenance_s14, code: C5, where: "intake message 1 (read)", text: "I can't take it here, so it goes to pest control.", note: "Same as s15: the run ended with no card, so nothing went to pest control."}
    - {scenario_id: landscape_maintenance_s03, code: C1, where: "card line 4", text: "Homeowner adds: he says it is the monsoon washout", note: "A cause on the card. It is the homeowner's belief and labelled as his, but C1 bars a cause on the card. The standing rules should say whether a cause the homeowner states can be quoted."}
    - {scenario_id: landscape_maintenance_s06, code: C2, where: "card line 5", text: "Homeowner adds: once a year is all she can afford.", note: "Cost or budget talk on the card. These are her words, but the scrub rule should drop them."}
    - {scenario_id: landscape_maintenance_s09, code: C2, where: "card line 4", text: "Homeowner adds: wants it as soon as possible; will pay extra.", note: "Cost talk on the card that invites rush pricing, which the scenario lists in must_not_be_on_card."}
    - {scenario_id: landscape_maintenance_s08, code: C6, where: "card line 1", text: "REQ-0108 | Yard maintenance | Lake Havasu City | house", note: "The homeowner never said what kind of place it is, and the photo shows only the back lawn, hedges and fence."}
    - {scenario_id: landscape_maintenance_s02, code: C11, where: "intake message 6 (timing)", text: "When do you need this? 1 Today 2 This week 3 Flexible 4 By a date", note: "Her opening message already said asap. She replied 'asap, like I said'."}
    - {scenario_id: landscape_maintenance_s05, code: C11, where: "intake message 2 (photo)", text: "A photo or two helps businesses quote. No photo is fine too. Send a photo of the whole area from a corner.", note: "His opening message said he can't send photos because his camera is broken. The photo ask counts as a question in questions_asked."}
    - {scenario_id: landscape_maintenance_s06, code: C11, where: "intake message 3", text: "Should the trimmings be hauled away? 1 Yes 2 No", note: "Her opening message said 'take away the clippings'."}
    - {scenario_id: landscape_maintenance_s09, code: C11, where: "intake message 5 (timing)", text: "When do you need this? 1 Today 2 This week 3 Flexible 4 By a date", note: "Her opening message said Saturday and 'TODAY or tomorrow at the latest'."}
    - {scenario_id: landscape_maintenance_s11, code: C11, where: "intake message 3 (follow_up)", text: "Is anything wrong with the watering system right now, like a leak, a wet spot or a zone that won't come on?", note: "Her opening message said zone 3 doesn't come on anymore."}
    - {scenario_id: landscape_maintenance_s16, code: C11, where: "intake message 5 (timing)", text: "When do you need this? 1 Today 2 This week 3 Flexible 4 By a date", note: "His opening message said 'b4 monsoon'. The card then reads 'Needed: not said'."}
  count: 13
  clean_scenarios: 6   # s01, s04, s07, s10, s12, s13
  # Borderline, not counted: s02 re-asked the service question after she said 'mow'. The photo contradicted her, which is what the scenario
  #   wants, so this is not counted as C11. s03 asked 'How often?' after 'been doing this every few weeks', which describes his own raking, not a service frequency.
  # Fixes these point to: (1) apply the skip rule to the INT-030 timing question and the photo ask; (2) after a routed_elsewhere read, either run
  #   the target category's intake and write its card, or don't tell the homeowner where it goes; (3) in the read line, drop 'sounds like' and say only which trade the request goes to;
  #   (4) scrub budget and payment remarks out of 'Homeowner adds'; (5) leave the kind-of-place field 'not said' unless she said it or the photo shows it.
