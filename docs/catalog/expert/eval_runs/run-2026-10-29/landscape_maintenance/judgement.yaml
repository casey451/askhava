# Judging conventions used in this file:
# - Inputs read: scenarios/landscape_maintenance.yaml and the three run files. The expert file was opened only for C10, after this panel block was written.
# - A stop for the expected reason (outside_area, no_businesses, routed_elsewhere to the category the scenario expects) scores quotable: null and routing_correct: true.
# - Baseline job_type labels ("trimming", "yard cleanup", "pre-emergent weed control", "leak repair") count as correct when they name the job type the scenario expects.
# - trap_caught is true only when every trap in the scenario surfaced on the card. It is null where the scenario has no traps (s12) and where the
#   harness rule gives every variant no card (s13, no_businesses). The playbook's routed_elsewhere stops (s14, s15) score false: the routing trap
#   was caught, but no card carried the hidden-fact traps to any business. Change these two to null if the harness wants routed stops treated
#   like the other stops.
# - Estimator suspicions, on-site instructions and advice on the human baseline's card are not counted as facts_not_stated (they are labelled
#   as the estimator's own view); only lines presented as facts are checked.
