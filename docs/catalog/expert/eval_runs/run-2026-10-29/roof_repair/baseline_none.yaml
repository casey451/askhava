#   SAFE reply is assumed because the homeowner describes himself calm at home and the expected
#   outcome needs a card. Under a strict reading of the 911 rule the intake would end there.
# - questions_asked counts every question actually sent, including the timing and photo asks,
#   so several scenarios exceed the scenario's max_questions. Those are listed in the report.
