judge_model: "claude-opus-5-5"
panel: [owner, estimator, field_tech]
judging_notes:
  - "All three variant files were present (playbook, baseline_none, baseline_human). Labels were shuffled per scenario and the mapping is in each block. The panel was scored from the scenario file and the three run files only. The expert file was opened only afterwards, for compliance check C10."
  - "trap_caught is true only when every trap listed for the scenario surfaced on the card, or for a stop, when the stop behavior the trap describes was met. s14's traps are hidden facts that a correct no_businesses stop cannot surface, so trap_caught is null for all three variants there."
  - "Stops for the expected reason (s13 outside_area, s14 no_businesses) score quotable null and routing_correct true. baseline_none s14 recorded job_type null even though the scenario notes say the intake should still capture foam_coating; it still scores routing_correct true under the stop rule, and the gap is noted."
  - "routing_correct means the category and bank job type match what the scenario expects. Baseline job_type labels from categories.yaml ('tile replacement', 'leak repair', 're-roof') count as correct when they name the job type the scenario expects. baseline_none s02 ('leak repair', unsure) and playbook s09 (bank 'leak repair' for storm_damage) name the wrong bank job type, so both score false. playbook s08 routed to job_type active_leak where the scenario expects leak_repair, but its category and bank job type ('leak repair') match, so it scores true; the mismatch is noted."
  - "questions_asked is copied from each run file. baseline_none's own counts are off by one in s02 (8 questions sent, 7 recorded) and s05 (6 sent, 7 recorded); noted in the panel notes, not changed."
  - "urgent is not a scored field, but it is noted where it differs from the scenario: playbook s11 (false, expected true), baseline_none s09, s10 and s11 (false, expected true; its run header says the variant cannot judge urgency)."
  - "Every playbook run entry recorded facts_in_card_not_stated: [], but the panel found 5 card facts the homeowner never said (s01, s03 x2, s08, s10). The run agent's self-check is not reliable."
  - "Panel finding across the playbook run: leak_where was skipped in 12 of the 13 carded scenarios, and roof equipment (solar, cooler) was asked only once, as a follow-up in s15. Those two gaps account for most of the missed traps (solar in s01 and s12, the cooler in s06, the flat sections in s08, the electrical signs in s10)."
