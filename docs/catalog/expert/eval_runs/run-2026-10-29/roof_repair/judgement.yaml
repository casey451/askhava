where_playbook_lost_to_human:
  - "Roof equipment (solar, AC or swamp cooler) is only a follow-up, used once (s15). The human asked 'anything on the roof' in s01, s06, s12 and s15 and found solar in three and the cooler over the leak in one. Fix: make 'What is mounted on the roof?' a fixed question for every roof_repair job type. It is the biggest single driver of the quote and of who has to be scheduled."
  - "leak_where was skipped in 12 of 13 carded scenarios. The human's 'What's the roof like over that room?' found the flat foam section in s05 and s08. When the playbook did ask it, as the roof-type question in s05, it worked. Fix: never skip leak_where when water shows inside; word it as 'What is the roof like right above that room?'"
  - "Roof age and whether it was ever redone were missing in s01, s02, s07, s09 and s12 because the one follow-up slot went elsewhere. The human asked it in every tile scenario. Fix: make roof or house age, and whether it was redone, a fixed question, so the follow-up is free for the job-specific fact."
  - "The home size question was wasted. It got 'not sure' in s02, s06, s07 and s08, and it doesn't move a tile reset or a leak visit. The human asked size only for the skylight, re-roof and lift-and-relay jobs. Fix: ask home_size only for re-roof, tile_underlayment, foam_coating and manufactured_home_roof."
  - "Already-answered questions were re-asked: the problem question after the opening named it (s02, s07, s09), timing after 'asap' or 'NOW' (s03, s10), roof type after 'under the tile' (s15), and the roof-now follow-up after 'old silver coating that is peeling' (s06). Fix: skip a bank question when the opening or an earlier reply answers it; for timing, take 'now', 'asap' or 'today' from the opening."
  - "When and how the leak shows was not asked in s04 (hard rain only), s07 (after September's heavy rain), s08 (hard rain), s11 (grows after each rain) and s12 (after September storms). The human asked 'every rain or only hard rain?' and 'has it grown?'. Fix: for leak_repair and flashing_skylight, ask when it shows up and whether it has grown, in place of the size question."
  - "s03: the follow-up answer never confirmed the shower link, but the card wrote 'Drips: when the upstairs bathroom is used'. It also dropped the soft, sagging ceiling and the damp floor, which the human got with 'Is the ceiling soft or sagging?' and 'Is the floor near the tub damp?'. Fix: on a reroute to plumbing, use the turn for the ceiling's state, not stories or roof type, and only write an option the homeowner actually picked."
  - "s04: she said 'no other stains anywhere in the house' and the card dropped it. That is the fact that argues against her re-roof request. Fix in the card writer: every fact the homeowner states in reply to a question goes on the card."
  - "s06: year built (1974, pre-HUD) and owning the home on a rented park space were never asked; the human asked both. Fix: for manufactured_home_roof, make year built and 'own the home and rent the space?' fixed questions, and drop stories (a single-wide) and size."
  - "s07: the elderly widow got 7 numbered multiple-choice messages, and the card is missing text-only contact and the door-knocker's written figure. The human asked 'Did the man at the door give you a price in writing?' and 'Is texting the best way for roofers to reach you?' in plain words. Fix: when the opening mentions another company, ask whether anyone else has looked at it. When the homeowner signals phone or hearing trouble, ask her contact preference and put 'text only' on the card. Use plain-word questions, not numbered lists, for slow typists."
  - "s08: 'owner approves and pays' is not stated plainly on the card, and the flat section above the closet was missed (see leak_where). Fix: for tenants, the card line should read 'Tenant; owner approves and pays', and the job type should be leak_repair, not active_leak, for a leak that is not dripping now."
  - "s09: storm_damage carried bank_job_type 'leak repair' where the scenario expects 'tile replacement'. Roof age, saved tiles and the wet spot were not asked; the insurance follow-up took the slot. Fix: map storm_damage with tiles off to 'tile replacement'. For tiles off, the follow-up should be 'Did you keep any whole tiles?'"
  - "s10: water beside a light fixture, but the electrical-signs question was never asked. The human's first question was 'Any sparks or burning smell?', which both guards the 911 rule and tells the crew what they're walking into. Fix: when water shows at a light or fan, the follow-up is 'Any sparks, buzzing or burning smell? Is the light off?'"
  - "s11: urgent was left false after a fire-truck-list hit, and stain growth and the outlet still being in use were not asked. Fix: set urgent when the 911 text goes out; for a dry stain, ask whether it has grown after each rain."
  - "s15: 'Has anyone worked on the roof before?' was not asked, so his three roofing-cement patches are missing; the card also drops 'never redone' and which rooms. Fix: add a worked-on question for tile_underlayment and leak_repair."

