      REQ-0106 | Roof repair | Lake Havasu City (mobile home park, 86406)
      FACTS
      - Manufactured home (he calls it a trailer); he owns the home and rents the space in the park.
      - Built 1974.
      - Flat-ish metal roof with old silver coating that is peeling.
      - Drip over the kitchen sink when it rains.
      - Swamp cooler on the roof at the kitchen end.
      - He wants a peaked roof-over on the whole home, like his neighbor's; asked how much.
      - No photos; no ladder. Needed: not said.
      SUSPECT
      - Leak at the swamp cooler curb or its penetrations near the kitchen, or open seams and fasteners under the failed silver coating.
      - 1974 is pre-HUD-code (before June 1976); roof framing load capacity for a roof-over needs an engineer or approved system.
      ON SITE
      - Roof-over is a manufactured-home alteration: only an installer licensed by the Arizona Dept of Housing with a permit; confirm park approval before quoting the build.
      - Quote two lines: (1) leak repair now (cooler curb and seams, elastomeric recoat of the metal); (2) roof-over if licensed for it.
      - Check whether the swamp cooler stays, moves, or comes off with a roof-over; check the cooler for leaks too.
      - Take your own photos from the ladder for the homeowner.
