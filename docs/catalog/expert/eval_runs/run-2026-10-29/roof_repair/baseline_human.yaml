notes: >-
  The intake is played as the best roofing estimator in Arizona (25 years, knows Lake Havasu City
  tile, foam and manufactured-home roofs, monsoon wind and heat), texting one question at a time,
  with no question bank, no expert file and no trade file. The estimator may say what they suspect
  and may give the advice a real estimator would (the judge notes it; it does not count against the
  human here). The card holds the crew notes: FACTS (only what the homeowner said or a photo showed),
  SUSPECT (the estimator's own read), ON SITE (what to check). The homeowner is played strictly from
  the scenario's hidden facts and behavior; anything outside hidden_facts is answered "not sure".
  Coverage: the town or ZIP is confirmed before any trade question (not counted in questions_asked);
  3 roofing businesses assumed in Lake Havasu City, except s13 (outside area) and s14 (no businesses),
  where the intake stops before any trade question as intake_agent.md says. For the fire-truck fact
  in s11 the estimator sends their own safety and 911 message, as a real estimator would;
  fire_dept_text records that it went out. job_type values use the kb ids named in the scenario
  file where one matches the estimator's own call. questions_asked counts every question and photo
  ask the estimator sent.
