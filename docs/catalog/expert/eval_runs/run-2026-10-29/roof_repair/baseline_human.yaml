      REQ-0101 | Roof repair | Lake Havasu City
      FACTS
      - Concrete tile roof, one story.
      - Three tiles slid down over the back patio after the last wind.
      - No water inside that he has seen.
      - Solar panels on the south side of the roof.
      - Roof about 22 years old, never redone.
      - No photo. Square footage not asked (pull from county records).
      - Needed: not said.
      SUSPECT
      - Wind lifted and slid tiles where the fastening has let go; on a 22-year original roof the felt under the tile is near the end of its life, so the patio side may show worn or brittle underlayment once tiles are lifted.
      - Patch and reset is the likely quote; be ready to price a section lift-and-relay if the paper is shot.
      ON SITE
      - Bring matching concrete tile profile and color; check whether the slid tiles are broken or reusable.
      - Check the felt and battens where the tiles slid; photograph for the homeowner.
      - Note whether the patio-side work is near the solar array on the south side; if panels must come off, the solar company has to be scheduled.
      - Walk the rest of the roof for other loose or cracked tiles from the same wind.
      - Homeowner is short on patience by text; keep updates brief.
