where_playbook_lost_to_human:
  - "Fixed bank questions spend the budget on menus that don't fit the job: 'Where is the water showing up?' and 'Is the water shut off right now?' were asked on clogs, a faucet swap, a laundry move and a water heater replacement (s02, s03, s06, s08, s10, s12, s15), and 'What kind of floor' on a faucet swap and a garage water heater. Fix: give each job type its own bank question set, or skip leak_where, shutoff and floor when the job type has no leak or no floor-dependent access."
  - "s05: never asked when the floor gets wet. The shower timing is the whole case, and the card reads as a wax ring job. Fix: for toilet_issue 'leaking at base', the first follow-up should be 'When is the floor wet: all the time, after a flush, after a shower or bath, not sure'. Also ask about the floor condition near the tub and toilet, and describe the whole photo (the tub caulk gap was dropped)."
  - "s15: never asked fuel type, gallons or age. Fix: for water heater replacement, require 'gas or electric', 'gallons and age from the label' and 'still have hot water'. Also give it a kb job type of its own instead of the bank label."
  - "s06: never asked the sink hole count, countertop material or new faucet type. Fix: fixture_replace must_know should include 'how many holes in the sink or counter', 'countertop material' and 'new fixture type and whether it came with a plate'. Drop the leak and floor questions for a faucet swap."
  - "s02, s08: never asked 'what have you tried'. Chemical drain opener in standing water is missing from both cards. Fix: make 'tried anything yet, plunger, drain cleaner, other' a required question for clogged_drain, and print the chemical on the card."
  - "s01: never asked which sink or what is dripping (valve, pipe, faucet). Fix: for leak_slow, ask 'kitchen or bathroom' and 'what is it dripping from' before the drip-timing follow-up."
