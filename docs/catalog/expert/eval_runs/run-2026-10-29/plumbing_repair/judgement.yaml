  playbook: {median_quotable: 2, quotable_share: 0.71, median_questions: 4, routing_correct_share: 0.94, fire_dept_correct_share: 1.0, trap_caught_share: 0.43, facts_not_stated_count: 1}
  baseline_none: {median_quotable: 2, quotable_share: 0.93, median_questions: 6, routing_correct_share: 1.0, fire_dept_correct_share: 1.0, trap_caught_share: 0.93, facts_not_stated_count: 0}
  baseline_human: {median_quotable: 2, quotable_share: 1.0, median_questions: 5, routing_correct_share: 0.94, fire_dept_correct_share: 1.0, trap_caught_share: 1.0, facts_not_stated_count: 4}
  playbook_v2: {median_quotable: 2, quotable_share: 0.62, median_questions: 4.5, routing_correct_share: 0.88, fire_dept_correct_share: 1.0, trap_caught_share: 0.36, facts_not_stated_count: 5}
  playbook_v3: {median_quotable: 2, quotable_share: 1.0, median_questions: 5, routing_correct_share: 0.94, fire_dept_correct_share: 1.0, trap_caught_share: 1.0, facts_not_stated_count: 4}
  # playbook_v3 notes: quotable_share is 13 of 13 scored cards (s11, s13, s14 null). s11 is null for a correct 911 hold, so v3 wrote one card
  # fewer than baseline_human, which scored 14 of 14. Firm-from-card (3) on 2 of 13 (s02, s15) vs 3 of 14 for the human (s02, s06, s15).
  # trap_caught_share is 13 of 13 (s11, s13, s14 null). routing miss is s12 (bank job type). median_questions counts all 16, stops included.

where_playbook_lost_to_human:
  - "Fixed bank questions spend the budget on menus that don't fit the job: 'Where is the water showing up?' and 'Is the water shut off right now?' were asked on clogs, a faucet swap, a laundry move and a water heater replacement (s02, s03, s06, s08, s10, s12, s15), and 'What kind of floor' on a faucet swap and a garage water heater. Fix: give each job type its own bank question set, or skip leak_where, shutoff and floor when the job type has no leak or no floor-dependent access."
  - "s05: never asked when the floor gets wet. The shower timing is the whole case, and the card reads as a wax ring job. Fix: for toilet_issue 'leaking at base', the first follow-up should be 'When is the floor wet: all the time, after a flush, after a shower or bath, not sure'. Also ask about the floor condition near the tub and toilet, and describe the whole photo (the tub caulk gap was dropped)."
  - "s15: never asked fuel type, gallons or age. Fix: for water heater replacement, require 'gas or electric', 'gallons and age from the label' and 'still have hot water'. Also give it a kb job type of its own instead of the bank label."
  - "s06: never asked the sink hole count, countertop material or new faucet type. Fix: fixture_replace must_know should include 'how many holes in the sink or counter', 'countertop material' and 'new fixture type and whether it came with a plate'. Drop the leak and floor questions for a faucet swap."
  - "s02, s08: never asked 'what have you tried'. Chemical drain opener in standing water is missing from both cards. Fix: make 'tried anything yet, plunger, drain cleaner, other' a required question for clogged_drain, and print the chemical on the card."
  - "s01: never asked which sink or what is dripping (valve, pipe, faucet). Fix: for leak_slow, ask 'kitchen or bathroom' and 'what is it dripping from' before the drip-timing follow-up."
  - "s10: the card went out as not urgent (expected urgent: sewage on the floor, kids home). It also never asked whether the water has stopped or what she tried, though a plunger was in the photo. Fix: set urgent for sewage on the floor in an occupied home, and ask 'has it stopped' first."
  - "s12: bank job type 'leak repair' instead of the expected 'faucet replacement'. No floor-drain question, no deadline, and no second electrical card for the 240-volt outlet even though the intake said it would write one. A template permit line was added that the homeowner never said. Fix: drop 'Permit-type work' from the fixture_add_move card template, add 'is there a floor drain at the new spot' and 'when do you need it', and write the second-trade card."
  - "s07, s08, s16: missed access and timing facts (mornings only, evenings and weekends, home age) and the damp rug over the warm spot. Fix: add 'when can someone be there' to every card, add 'anything wet near the spot' to the slab_leak follow-up, and put home age in high_water_bill and slab_leak must_know."
  - "s04: the card drops the standpipe bucket test that proves the house drain works, and turns 'about 6 years' into '5 to 10 years'. Fix: when a plumbing opening reroutes to appliance repair, carry the homeowner's test result onto the card, and keep the homeowner's exact age when it is given."
  - "s07: elderly homeowner got four menus she could not answer and a meter photo ask that the scenario warns against. Fix: for high_water_bill, skip the fixture and leak_where menus when the opening says she doesn't know where, and drop the meter photo ask."

where_v2_still_lost_to_human:
  - "v2 scores below the first playbook run (quotable share 0.62 vs 0.71, traps 0.36 vs 0.43, routing 0.88 vs 0.94). The per-job-type question sets dropped the floor question where it was the only path to a trap: s01 and s09 lost the manufactured home (and s01 the soft cabinet floor), s05 and s11 lost slab and home age. Fix: keep 'What kind of floor is the home on' (or 'what kind of home') in every leak_slow, toilet_issue and slab set; skip it only when her words answered it."
  - "The shutoff question is now asked on every plumbing job (emergency: true) and was wasted on 10 of 13 cards (s02, s03, s05, s06, s07, s08, s10, s11, s12, s16), including clogs, a faucet swap, a drain backup and an elderly homeowner; it paid off only in s01 (seized valve) and, by accident, in s15 ('still has hot water'). Fix: make the shutoff question emergency only for active water (leak_active, a burst, water still running); for leaks, ask it as 'can you shut the water off at the valve under it'."
  - "Photo asks come from photos_priority without reading the job or the earlier answer: under-sink photos on a shower clog (s08), a toilet overflow (s10) and a garage water heater (s15); a pipe-printing photo on a drain pipe (s09) and a slab hallway (s16); two photo asks to s06 after he said twice he can't send photos; a damage photo after 'nothing has come up' (s03). Fix: filter photo asks by job type and fixture, and stop all photo asks after the first decline or an 'I can't send pics' in the opening."
  - "Cards claim photos that were never sent (s02, s08, s10: 'Photos: 1' with the scenario's photo description after the only ask was declined) and add facts nobody said (s10 'about 20 minutes ago', s15 'no brand preference'). The run file's own facts_in_card_not_stated lists were all empty. Fix: the card writer may cite a photo only when a photo appears in the transcript, and a check should diff every card line against the transcript."
  - "Facts heard but dropped from the card: s10 'it stopped coming up', s12 'the pipe is inside the hallway wall', s16 '1980s' and 'the rug', s01 'every few seconds' and 'whenever' (card says 'Needed: not said'). Fix: every homeowner answer must land on the card in her words, including timing answers like 'whenever' and 'not sure'."
  - "The second follow-up slot went unused where it was needed: s08 never asked what he tried (drain opener in standing water missing again), s10 never asked what she tried, s05 still never asked when the floor gets wet. Fix: for clogged_drain, fu_tried is required, not optional; for toilet_issue 'leaking at base', the 'when is the floor wet' follow-up is required."
  - "s04: routed to appliance repair on the word 'washing machine' with zero questions and no card, so the bucket test, the OE code and the age never reached anyone. Fix: on a cross-category reroute, keep intaking in the new category (or ask 'does the wall drain take a bucket of water') and write the card there, as baseline_human did."
  - "s06: v2 still never asks about sink holes, countertop or the new faucet type, and it lost the old-valve fact the first run got. Fix: same as the first list; fixture_replace needs 'how many holes', 'countertop material', 'what kind of faucet did you buy, did it come with a plate' and 'have the valves under the sink been turned lately'."
  - "s15: bank job type regressed from 'water heater replacement' to 'leak repair' (routing now false), and it still never asks gallons and age from the label; it spent a question on 'where exactly is the water' that he answered 'just replace it'. Fix: route 'need a new one installed' to the water heater replacement bank type and ask the label question (fuel, gallons, age) first."
  - "s12: still 'leak repair' instead of 'faucet replacement', no floor-drain question, no electrical card for the 240-volt outlet, and the drain route he gave was dropped. The template permit line is gone (an improvement). Fix: as in the first list, plus put 'where does the old drain run' on the card when said."
  - "s16: eight questions, five wasted, and still neither the damp rug nor the bill made the card. Fix: for slab_leak, ask 'is anything damp near the warm spot, like a rug' and 'has the water bill gone up' instead of the meter follow-up, and hold the set to 5."
  - "Question counts over the scenario max: s02, s03, s07, s12 (6 vs 5), s10 (5 vs 4), s16 (8 vs 5). Median rose from 4 to 4.5 while quotability fell. Fix: when the set reaches max_questions, write the card; the timing question and photo asks count toward the cap."
  - "What v2 fixed: s02 now gets the drain cleaner (fu_tried); s07 now gets mornings only and the yard spot by the meter box; s08 now puts the landlord-approves line on the card; s11 now gets one drop a minute; s12 lost the template permit line and gained the deadline. Keep these."

where_v3_still_lost_to_human:
  - "s06: the only scenario where the human was firm (3) and v3 was not (2). v3 got holes, granite, faucet type and the valves, then spent its fourth and last question on timing ('not sure', then dropped from the card) instead of 'did it come with a cover plate for the extra holes'. It also wrote 'New fixture: on site' when he said only that he bought it online. Fix: for fixture_replace, rank 'did the new fixture come with a plate' above timing, and drop timing when the cap is reached; never write 'on site' unless she says it is at the house."
  - "s11: v3 held at the 911 text and wrote no card because she never replied SAFE; the human wrote the sink card with the gas flag on top. The hold is correct under the standing rules and scores null, but no drip rate, home age, slab or garage gas appliances were collected. Fix: none in the intake; the scenario should script whether she replies SAFE so the card path after the hold is tested."
  - "s10: the card went out as not urgent with sewage on the floor (expected urgent), and it never asked who is home or whether there is a second bathroom (the human got both and marked it urgent). Fix: urgency should flag sewage on the floor in an occupied home without asking, and 'is this the only bathroom' belongs in the toilet-overflow must_know."
  - "s12: no question on where the existing washer drain runs (the human got it), no electrical card for the 240-volt outlet and no panel-location question, and the bank job type is still 'leak repair', not the expected 'faucet replacement'. The card calls the dryer 'electric', which he never said, and the intake says the outlet is 'named on this card' while the card says 'not on this card'. Fix: add 'where does the old drain run' to fixture_add_move must_know; write the second-trade card or say plainly that it is not written; route laundry moves to the expected bank type."
  - "s01: never asked what is dripping (valve, supply line, trap) or how fast; the card says 'slow drip' and its own Drips line says not asked. Fix: for leak_slow, ask 'what is it dripping from' after the fixture, and write the scope line from her words, not the job type name."
  - "s03: never asked whether the toilet itself flushes and stays dry (the human ruled out his theory with it), or about trees in the yard; the neighbors question went to 'dont know'. Fix: in main_line_backup, when the opening blames a fixture, ask 'does the toilet flush fine and stay dry at the base' in place of the neighbors question."
  - "s16: never asked whether hot water runs out faster (the human's question that points at the hot line) or where the spot is (near the bedroom door). Fix: add 'does hot water run out faster than before' to slab_leak must_know, ahead of home age."
  - "s09: never asked what the water drips from; the card shows only a bucket under the drain pipe. The shutoff question went to a drain-side leak. The card doesn't note she texts in Spanish (the human's does). Fix: for leak_slow, 'what is it dripping from' before shutoff, and add the homeowner's language to the card header."
  - "s04: no brand or model, and no 'anything else happen' question, so the socks are missing (the human got both with one question). The read question was answered wrong and only the bucket test routed it. Fix: on an appliance reroute, ask brand and model (or a label photo) and one open 'anything else' question; lead with the bucket test instead of the either/or read question."
  - "s05: the photo line still drops the tub caulk gap the human described, and the card prints 'New toilet on site: n/a', a default nobody gave. Fix: photo_reading should name every visible defect in frame without a cause; template blanks must say 'not asked'."
  - "s13: asked for the ZIP after he had named Parker in the opening (the human and earlier runs stopped at once). Fix: when the opening names a town outside the list, stop without the ZIP question."
  - "s07: still opens with a meter test ('with all the water off ... was the small dial moving') and offers 'Concrete slab' as an option to the elderly homeowner the scenario warns about; it got every fact anyway. Fix: for an elderly or unsure homeowner on high_water_bill, skip the meter question and ask 'what is the house built on, or not sure' in plain words."
  - "s15: asked 'where exactly is the water coming from' after he said he wants it replaced, and asked gas or electric after the photo showed a gas unit, bundling fuel, size and age in one message (rule 1 is one question per message). The card is still firm. Fix: skip the leak-source question when the homeowner asks for replacement; read fuel from the photo and ask only 'gallons and age from the label'."
  - "Question count: v3 sits at the scenario max on 11 of 13 cards (median 5 vs the human's 5), and the pass bar is a median of 5 or fewer, so there is no slack. Where it hit the max, the last question was often the weakest (timing in s06, neighbors in s03, shutoff in s09). Fix: order by must_know rank and drop timing first when the cap is near."
  - "What v3 fixed (keep): s05 asks when the floor gets wet first and gets the lifting vinyl; s06 gets holes, granite, faucet type and valves with no photo ask after the decline; s02 and s08 get the chemical, the disposal, the duplex and the access hours; s15 gets fuel, gallons, age and the furnace closet with the right bank type; s04 keeps intaking after the appliance reroute and carries the bucket test; s16 gets the bill and the damp rug; s01 and s09 keep the manufactured home and the soft cabinet floor; s03 gets the 1980s age; s07 gets every must-know fact in her words. No photo is claimed that was not sent, and no time or preference is invented."

# Compliance judge (compliance_judge.md) on playbook.yaml only. The expert file was opened for C10 after the panel was scored.
# Not counted: the "Lake Havasu City, area not said" town default (the harness coverage default), and the s15
# "Licensed plumbers only" line (a category routing rule the scenario requires on the card, not a homeowner fact).
# The s12 card's "from ... to the garage" regex hit (C9 "from X to Y range") is a literal move description on the card, not an intake message, so it is not counted.
compliance:
