# Blind pro panel judgement, plumbing_repair, run-2026-10-29.
# Panel scored from the scenario file and the three run files only; the expert file was opened
# only afterwards, for compliance check C10.
# Judge conventions used throughout:
# - routing_correct compares category and bank_job_type with expected (the panel prompt's rule);
#   a kb job_type that differs is noted in panel_notes but does not flip the score.
# - trap_caught is null for s13 and s14: no card exists by design, and the correct stop is credited in routing_correct.
# - The "Lake Havasu City" town on playbook and baseline_human cards is the harness coverage default
#   (intake_agent.md step 1 tells the run agent to assume Lake Havasu City coverage). It is not counted
#   in facts_not_stated for any variant. baseline_none asked the town.
# Label D (playbook_v2), added in a second pass from playbook_v2.yaml and the scenario file, with the same panel and rules.
# - D is always playbook_v2 (fixed by the task, not shuffled), so the blind is weaker for D than for A to C.
# - v2 asks the town as its coverage step; the town on its cards is homeowner-stated and not counted.
# - "house" in a v2 card header is not counted in facts_not_stated, the same as "House (type not said)" on the first playbook run.
# - The v2 timing question is a counted question (the run file counts it). It is listed as wasted only where its answer was lost.
# - A card that claims a photo the transcript never shows (the ask was declined and no photo came with the opening) is counted
#   in facts_not_stated. The run file's own facts_in_card_not_stated lists are all empty and were not trusted.
# - s04 stopped with stopped_before_card "routed_elsewhere" (to appliance_repair, the expected category) and no card. Per the task's
#   routing rule it scores routing_correct true and quotable null. The panel prompt's own null rule names only outside_area and
#   no_businesses, and the scenario expects an appliance card; under that reading s04 would be quotable 0. trap_caught is false:
#   it routed on the word "washing machine" with no fact showing the wall drain works.
# Label E (playbook_v3), added in a third pass from playbook_v3.yaml and the scenario file (hidden facts re-read), with the same panel and rules.
# - E is always playbook_v3 (fixed by the task, not shuffled), so the blind is weaker for E, as it is for D.
# - s11 stopped at the 911 hold: the fixed text went out and the homeowner never replied SAFE, so no card was due. Per the task it
#   scores quotable null and fire_dept_correct true. trap_caught is null: the 911 half of the trap is credited in fire_dept_correct,
#   and the card half was correctly never reached. s13 (outside_area) and s14 (no_businesses) score quotable null, routing_correct true.
# - The "Lake Havasu City, general area not said" town/area line on v3 cards is the harness default and is not counted. Any other card
#   line that states a fact or a default the homeowner never gave ("slow", "n/a", "on site", "electric") is counted in facts_not_stated,
#   under v3's own rule 7 ("never a default"). The run file's facts_in_card_not_stated lists were not trusted.
# - v3 has no follow-up list, so wasted_questions judges every intake question and photo ask the same way.
