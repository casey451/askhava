      REQ-0104 | Appliance repair (washer) | Lake Havasu City
      FACTS
      - Front-load washer, about 6 years old. Water stays in the drum, will not drain.
      - Display shows code OE.
      - Homeowner poured a bucket of water into the wall standpipe; it drained fine. House drain not the problem.
      - A pair of socks went missing last month.
      - Photo: door open, standing water in the drum, OE on the display.
      - Needed: not said.
