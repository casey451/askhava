    card: |
      REQ-0105 | Plumbing repair | Lake Havasu City
      FACTS
      - Homeowner reports the toilet leaking at the base; floor around the base gets wet.
      - Floor is wet only after someone showers. Toilet base is dry when nobody has showered for a day.
      - Toilet not worked on; flushes normally.
      - Ground-floor bathroom, home on a concrete slab.
      - Vinyl plank flooring near the tub edge is lifting at the seams.
      - Photo: wet patch around the toilet base, towel on floor, visible gap along the tub caulk line.
      - Needed: not said.
      SUSPECT
      - Water from the tub/shower (failed caulk at the tub edge, or splash past the curtain/door) running under the vinyl to the toilet. Tub drain shoe or shower valve leak less likely but possible.
      ON SITE
      - Run the shower and watch the tub edge and the floor; dye/flood test the tub with the drain plugged.
      - Check the toilet only to rule it out (dry with no shower).
      - Check the tub drain and overflow gaskets; recaulk; flag the lifting vinyl for flooring repair.
      - Homeowner asked for toilet repair; explain the finding before quoting.
