      REQ-0102 | Plumbing repair | Lake Havasu City
      FACTS
      - Kitchen sink will not drain at all, standing gray water, since last night.
      - Kitchen only: both bathrooms, tub and washer drain normally (homeowner calls it the sewer line).
      - Garbage disposal hums when switched on, nothing drains.
      - Dishwasher drains into the disposal; not run since the clog.
      - Homeowner used a plunger and a full bottle of chemical drain cleaner this morning. Standing water may be caustic.
      - Single-story home on a concrete slab.
      - Photo: sink full of gray water, dish rack beside it.
      - Needed: not said.
      SUSPECT
      - Jammed disposal (hum, no spin) plus a blockage in the kitchen branch past the trap. Not a main line.
      ON SITE
      - Gloves and eye protection; treat the water as chemical. Bail before pulling the trap.
      - Free the disposal (hex key at the bottom), check the reset, then clear the trap and the branch.
      - Slab home: snake from the trap arm or a kitchen cleanout if one exists; check dishwasher drain hose and knockout.
