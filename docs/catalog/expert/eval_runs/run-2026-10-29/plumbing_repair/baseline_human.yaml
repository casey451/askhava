notes: >-
  The intake is played as a top Arizona plumbing estimator (25 years, Lake Havasu City), texting
  one question at a time, with no question bank, no expert file and no trade file. The estimator
  may say what they suspect and may give the advice a real estimator would; the card holds the
  crew notes (facts got, suspicions, on-site checks). The homeowner is played strictly from the
  scenario. Coverage is assumed confirmed for Lake Havasu City except in s13 (outside area) and
  s14 (no businesses), where the intake stops before any trade question as intake_agent.md says.
  job_type values use the kb ids that appear in the scenario file where one fits the estimator's
  own call; where none fits, the estimator's own label is used and the entry says so.
