    card: |
      REQ-0101 | Plumbing repair | Lake Havasu City
      FACTS
      - Kitchen sink: cold-side shutoff valve under the sink drips, about every few seconds.
      - Valve handle will not turn (homeowner tried last month), so the sink cannot be isolated.
      - Cabinet floor under the sink is soft with a dark stain.
      - Manufactured home.
      - No photo. How long it has dripped: not asked (homeowner ran out of patience).
      - Needed: not said.
      SUSPECT
      - Old multi-turn angle stop leaking at the stem/packing; seized, so plan to replace both stops.
      - Particleboard cabinet floor and possibly the subfloor wet for a while.
      ON SITE
      - Bring a main shutoff plan: locate the home's main (often under the home or at the meter on a manufactured home) and confirm it closes before starting.
      - Check supply pipe material at the stops (poly, PEX or copper) and bring matching stops.
      - Probe the cabinet floor and subfloor for rot; flag carpentry if it is past the cabinet deck.
      - Ask the homeowner how long it has been dripping.
    facts_in_card_not_stated: []

