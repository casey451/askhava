# Run agent output for variant baseline_human (the human bar). The intake is played as the best
# pest-control estimator in Arizona: 25 years, prices jobs from a text and a photo, knows Lake Havasu
# homes, rock yards, block walls, monsoon swarms and bark scorpions. Per baseline_human_estimator.md the
# run agent did not open question_bank.yaml, the expert file or trade_kb; it had categories.yaml for
# routing, so job_type holds the categories.yaml job type label where one exists (general pest service,
# scorpions, termites, pre-emergent weed control; home_inspection's termite report for a sale or loan),
# and otherwise the estimator's plain words for the job (bees/wasps, rodents, bed bugs/fleas/other,
# pigeons/birds), with bank_job_type null. The estimator asks in their own words, may tell the homeowner
# what they suspect and may give safety advice (the judge notes it; it does not count against the human).
# Only the privacy rules bind the notes. The homeowner is played strictly from the scenario's persona,
# behavior and hidden facts; anything not in hidden_facts is answered "not sure". Coverage: 3 businesses
# in Lake Havasu City, 0 for the no_businesses scenario. The town question is step coverage and is not
# counted in questions_asked. fire_dept_text records whether the estimator sent a 911/safety message for
# a fire-truck-list fact.
