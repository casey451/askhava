    card: |
      REQ-0121 | pest_control / roaches, ongoing service | Lake Havasu City
      FACTS
      - Roaches at night, mostly kitchen and laundry room, a few in the garage.
      - Single story, about 2,200 sq ft, rock yard front and back.
      - Wants ongoing service, not a one-time spray.
      - Toddler who crawls on the kitchen floor; dog eats from a bowl in the laundry room.
      - Access weekday evenings only.
      - Photo: blurry, one small dark brown insect at a kitchen baseboard corner.
      - Needed: not said.
      SUSPECT (my read, not told to owner)
      - Night activity in kitchen, laundry and garage with a rock yard reads like outdoor roaches (American or Turkestan) coming in from sewer lines, irrigation boxes and the rock. Small and dark in the photo could also be German roaches; if so it is an inside bait job with follow-ups, priced differently.
      CHECK ON SITE
      - ID the roach first (German vs American/Turkestan) and set the price from that.
      - Look under the range, fridge and washer, the water heater closet, garage door seals, weep screed, sewer cleanout caps and valve boxes.
      - Toddler and dog: gel bait and IGR only, placed out of reach; no broadcast spray on the kitchen floor; nothing near the dog bowl. Exterior perimeter and garage granules.
      - Book weekday evening visits.
