category: pest_control
run: run-2026-10-29
judge_model: claude-opus-5-5
panel:
- owner
- estimator
- field_tech
judge_notes:
- "Scored blind by label from the three run files and scenarios/pest_control.yaml. docs/catalog/expert/pest_control.yaml was opened only for compliance code C10. It was opened after all run files had been read and before this panel block was written, so the order was not exactly what the prompt asks. Every panel score below rests only on the run files and the scenario file."
- "The town on playbook cards is the harness default (the run file says so). It is not counted as a fact not stated. SUSPECT, CHECK ON SITE and TOLD OWNER lines on the human cards are the estimator's own read, which that variant is allowed. facts_not_stated covers only that variant's FACTS lines."
- "routing_correct compares category plus job type and bank job type with expected. For s04, s05, s07, s10 and s16 the playbook routed to the right kb job type but set bank_job_type 'general pest service'. The scenario expects null for those (header note: bees, pigeons, rodents and bed bugs have no bank job type name). They are scored false. The playbook's run file follows its own expert file there, so the two files disagree. See where_playbook_lost_to_human."
- "Baseline job_type labels count as correct when they name the scenario's job type, and null counts when the scenario expects a null bank job type (caller rule). s05 baseline_none's 'general pest service' is accepted under the scenario note, because its card records both the height and the flying insects."
- "Stops for the expected reason (s13 outside_area, s14 no_businesses, s15 playbook routed to home_inspection) score quotable null and routing_correct true. Their traps are about the stop and score caught. Hidden facts behind the stop could not be reached and are not held against the run."
- "s11: the playbook stopped at the 911 hold because the homeowner never replied SAFE ('ok. its probably nothing'). It scores quotable null and fire_dept_correct true (caller rule). baseline_none's homeowner replied 'SAFE'. Nothing in the scenario says she would, so that reply came from the run agent."
- "urgent is not a scored field. Playbook: s10 true (correct), s14 false (expected true). baseline_none is false everywhere. The human set s10 and s14 true."
- "'Droppings' (s07) appears on all three cards, but the homeowner said only 'little black things like rice' or 'pellets'. It is listed as not stated for all three, even though the scenario's must_be_on_card uses the word."
