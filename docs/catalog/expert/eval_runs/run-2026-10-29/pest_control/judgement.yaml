where_playbook_lost_to_human:
- "Routing (s04, s05, s07, s10, s16): the playbook set bank_job_type 'general pest service' for bed_bugs_other, bees_wasps, rodents and pigeons_birds. The scenario file expects null for these (no bank job type name). The playbook followed its expert file, so the two files disagree. Fix: change one of them so the bank job type for these four kb types is the same in both."
- "s01: never asked who lives there or when someone can get in, so the toddler, the dog and evening-only access are missing. The human asked 'Any kids or pets in the house?' and 'When can we get in?'. Fix: for general_pest with inside service, ask kids/pets and the access window. Keep 'at night' on the card when she says it."
- "s02: never asked where they come in or whether anything stays wet, so the drip-line leak is missing. The human asked 'Anywhere around the house that stays wet?'. Fix: for crickets (and roaches), allow a moisture/entry follow-up."
- "s03: 'where' was skipped after the termite-signs follow-up, so the window-crack entry, no wings, slab and 'never had service' are missing. The human asked where the line starts and ends, and about prior service. Fix: when fu_termite_signs comes back 'None of these', ask where the line starts, and ask fu_prior_service when the schedule is one-time to start."
- "s04: the one follow-up went to pets. Where the bites are, whether the mattress is clean and which room has carpet were never asked. The human asked all three. Fix: make fu_bite_signs the first follow-up for bed_bugs_other (it already offers 'Bites only on ankles and legs'), and ask rooms and floors instead of home size."
- "s05: the one follow-up was termite signs. After 'Mud high up under the roof edge', nobody asked what is flying, how long, home size, stories or ladder access. The human asked 'Is anything flying in and out of them?'. Fix: when that option is picked, the next question is 'Is anything flying in and out of it?', and the eave height and stories go on the card."
- "s06: the yard follow-up got 'block wall' only. The vacant debris lot next door, the wall gap, the rooms, the kids and dog, and what the last company did were all missed. The human asked 'What's around the house on that side? Neighbors, desert, an empty lot?' and 'What did the last company do?'. Fix: add an empty lot or debris next door to fu_yard_features, and ask what the earlier service did when she says it didn't help."
- "s07: no attic-access question and no who-lives-there question, so the blocked hatch, the walker and the cat are missing. The questions were long menus for an elderly homeowner. The human asked 'Where is the opening to your attic?' and 'Who lives with you? Any pets?'. Fix: for rodents, ask attic access and household/pets, in short single questions."
- "s08: never asked about the other unit, who approves and pays, pets or access. The human asked all four. Fix: when she says she rents or lives in a duplex or apartment, ask 'Does the other unit have them too?' and 'Who approves and pays: you, the landlord or a manager?'. Keep 'landlord decides' on the card."
- "s09: the earlier-treatment question and slab/year were never asked, so the 2011 paperwork is missing. The human asked 'Have you had the house treated before? Do you have paperwork?'. Fix: for termites, ask fu_prior_treatment along with fu_termite_signs."
- "s10: stung, distance and location, gate access and live removal were never asked. The human asked about stings and access, and live or not. Fix: for a hanging swarm, ask 'Has anyone been stung?' as a fact question, plus access and fu_live_removal. Drop the timing question when he already said now."
- "s12: rock area, fabric and plants were never asked, and the yard work got no second card. The human asked area, fabric and plants and sent the yard work on. Fix: for weed_control, ask area (fu_weed_area) and what is planted in the rock, and write or offer the landscape_maintenance request."
- "s16: no-poison preference, stories and the installer warranty were never asked, and panel cleaning was dropped. The human asked 'Who installed the panels and how long ago?'. Fix: for pigeons under panels, ask installer/warranty and stories, and send panel cleaning as its own request."
- "Timing question re-asked after the homeowner had already given timing (s04 'asap', s10 'NOW', s12 'before the winter weeds'). The photo ask was sent after she said she had no picture (s06) or had already sent one (s05). Fix: fill Needed and Photos from her own words."
