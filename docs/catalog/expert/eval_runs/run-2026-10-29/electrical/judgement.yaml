where_playbook_lost_to_human:
- 's01 flicker_dim: the human asked when it started and how often (storm onset, once an hour); the playbook card says ''When: not said''. Fire fu_flicker_when for dimming in one area too, or add an onset question to flicker_dim.'
- 's01, s09: the danger answer (''no'') is taken but not written on the card. Add a ''Now: nothing sparking, hot, buzzing or smoking'' line to the flicker_dim and every other card template, as outlet_switch already has.'
- 's02 breaker_tripping in a garage or outbuilding: the human asked attached or detached and whether it has its own panel; add that check (or allow fu_run_distance) when the trip is in a garage, shed or yard.'
- 's02, s08: food at risk. The human asked what is plugged in and whether the fridge or freezer is warming; the playbook card has neither. Add ''what is on it'' to the trip and no-power cards so urgency has a stated basis.'
- 's05 new_circuit: the human asked the welder''s amperage, the main breaker size and panel space, the wall finish and other planned loads; the playbook asked the danger question and the count (both wasted) instead. Skip danger and count on install requests and ask main size and wall finish; drop the ''EV: n/a'' default.'
- 's06 smoke_alarm: the human asked hardwired or battery, alarm age, ceiling height and access day; the playbook asked home age (not sure) and recorded only ''linked''. Use fu_alarm_wired and add age and ceiling height to the smoke_alarm must-know list.'
- 's07 partial_power: the human asked what was reset, the two-button bathroom outlet and panel access; the playbook spent the ''what'' menu re-asking what the opener said. Skip ''what'' when the opener names the problem, and ask what was already reset and who can open the panel.'
- 's08: the human asked what was running when it went out, the fridge state and where the panel is; add these to partial_power when one area is out and a breaker will not hold.'
- 's09: the human asked about recent work on the dryer outlet, other loads that dim and whether the panel is original; the playbook skipped all three.'
- 's10: the playbook used 3 questions and never asked for the outlet photo (dark ring) or the fan''s ceiling height and existing fixture. When a card carries a second job, allow its key question (fu_ceiling_height) and always ask for the device photo on burning_sparks.'
- 's11: the human asked what the outdoor unit does, its age and size, reset count and who is home, and flagged a second AC repair card; the playbook asked 3 questions and sent no second card. Add the hvac_repair second card when a breaker trips on AC start, and ask the misdiagnosis check (fu_trip_when) even when ''when the AC starts'' is given, to get the hum-then-trip detail.'
- 's15 appliance route: the human asked gas or electric, what has been checked and the vent hose; the playbook asked an error-code question instead. Carry the electrical facts (outlet tested live, breaker on) across when rerouting to appliance_repair.'
- Home age buckets (before 1980) lose the exact year for 1969, 1974 and 1976 homes, which the human used for the aluminum-wiring window; keep the year she types on the card.
- 'Card builder writes facts the homeowner never said: s05 ''attached'', s08 husband after 5, s11 reset today and a dog and a parent at home, s14 a second (meter) photo. Fix the card step so only transcript text and photo descriptions reach the card.'
