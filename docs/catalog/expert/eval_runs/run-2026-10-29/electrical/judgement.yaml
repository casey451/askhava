where_playbook_lost_to_human:
- 's01 flicker_dim: the human asked when it started and how often (storm onset, once an hour); the playbook card says ''When: not said''. Fire fu_flicker_when for dimming in one area too, or add an onset question to flicker_dim.'
- 's01, s09: the danger answer (''no'') is taken but not written on the card. Add a ''Now: nothing sparking, hot, buzzing or smoking'' line to the flicker_dim and every other card template, as outlet_switch already has.'
- 's02 breaker_tripping in a garage or outbuilding: the human asked attached or detached and whether it has its own panel; add that check (or allow fu_run_distance) when the trip is in a garage, shed or yard.'
- 's02, s08: food at risk. The human asked what is plugged in and whether the fridge or freezer is warming; the playbook card has neither. Add ''what is on it'' to the trip and no-power cards so urgency has a stated basis.'
- 's05 new_circuit: the human asked the welder''s amperage, the main breaker size and panel space, the wall finish and other planned loads; the playbook asked the danger question and the count (both wasted) instead. Skip danger and count on install requests and ask main size and wall finish; drop the ''EV: n/a'' default.'
- 's06 smoke_alarm: the human asked hardwired or battery, alarm age, ceiling height and access day; the playbook asked home age (not sure) and recorded only ''linked''. Use fu_alarm_wired and add age and ceiling height to the smoke_alarm must-know list.'
- 's07 partial_power: the human asked what was reset, the two-button bathroom outlet and panel access; the playbook spent the ''what'' menu re-asking what the opener said. Skip ''what'' when the opener names the problem, and ask what was already reset and who can open the panel.'
- 's08: the human asked what was running when it went out, the fridge state and where the panel is; add these to partial_power when one area is out and a breaker will not hold.'
- 's09: the human asked about recent work on the dryer outlet, other loads that dim and whether the panel is original; the playbook skipped all three.'
- 's10: the playbook used 3 questions and never asked for the outlet photo (dark ring) or the fan''s ceiling height and existing fixture. When a card carries a second job, allow its key question (fu_ceiling_height) and always ask for the device photo on burning_sparks.'
- 's11: the human asked what the outdoor unit does, its age and size, reset count and who is home, and flagged a second AC repair card; the playbook asked 3 questions and sent no second card. Add the hvac_repair second card when a breaker trips on AC start, and ask the misdiagnosis check (fu_trip_when) even when ''when the AC starts'' is given, to get the hum-then-trip detail.'
- 's15 appliance route: the human asked gas or electric, what has been checked and the vent hose; the playbook asked an error-code question instead. Carry the electrical facts (outlet tested live, breaker on) across when rerouting to appliance_repair.'
- Home age buckets (before 1980) lose the exact year for 1969, 1974 and 1976 homes, which the human used for the aluminum-wiring window; keep the year she types on the card.
- 'Card builder writes facts the homeowner never said: s05 ''attached'', s08 husband after 5, s11 reset today and a dog and a parent at home, s14 a second (meter) photo. Fix the card step so only transcript text and photo descriptions reach the card.'
where_v2_still_lost_to_human:
- 'No town or ZIP question in any v2 transcript except where the homeowner named a town (s12 Parker, s13 Lake Havasu City); 12 cards still print ''Lake Havasu City'' and some an area (''central'', ''north'') the homeowner never gave. The human asked the town first every time. Put the coverage question back before the danger question.'
- '''When do you need this?'' was asked on every card and came back ''not sure'' on 8 of 12, and twice repeated an opener that already said today or ASAP (s09, s11). It is part of why 8 of 12 cards went over the scenario cap (s01, s02, s03, s04, s06, s09, s14, s15 at 6 or 7). Skip it when the opener gives the timing, and count it inside the cap.'
- 'Second and third photo asks from photos_priority cost questions without facts: meter photo after a refused or sent panel photo (s01, s07, s08, s09, s14), outlet photo on breaker and AC jobs (s03, s11), model label and error-code photos on a dryer with no display (s15). The human asked for one photo, the one that mattered. Stop after one refused photo ask and skip asks that do not fit the job.'
- '''How many items?'' is still asked when the opener names one thing (s02, s03, s04, s11), and the danger question still runs on install and upgrade requests (s05, s14). Skip both when the opener answers them.'
- 's01: fu_flicker_when asks the pattern (AC, storms, random), not the onset; the human asked when it started and got ''two weeks ago, after the monsoon storm''. Add ''When did it start?'' to flicker_dim. Panel location in the garage still not asked.'
- 's02: detached garage, outside wall and full freezer still missing; no allowed breaker_tripping question reaches them, and urgent stayed false. The human asked attached or detached, own panel, and what is plugged in. Allow fu_run_distance (or an attached/detached check) on breaker_tripping when the trip is in a garage, shed or yard, and add ''what is plugged in'' so food at risk sets urgent.'
- 'Home age: rule 1 drops home_age for breaker_tripping and new_circuit (s02, s03, s05, s11 all ''Built: not asked''), and where it is asked the card still buckets the typed year (1974, 1976, 1979 shown as ''before 1980''). The human had the year on every card. Keep home_age on every electrical job type and write the year as typed.'
- 's03: still no ''how long has it done this'' or ''who did the kitchen work''; the human got about a year, worse in summer, and the previous owner''s remodel. Add a duration question to breaker_tripping and a who-did-the-work question when the trip is in a kitchen or remodeled room.'
- 's05: still no welder amperage, main breaker size or panel space, wall finish or other planned loads, and ''EV: n/a'' is still written by default. The human asked all four. On new_circuit, skip danger and timing, ask main size and wall finish, and drop the EV default.'
- 's06: alarm age, ceiling height and access day still not asked; the human got 12 years, nine foot and vaulted ceilings, grandson Saturday. Add alarm age and ceiling height to smoke_alarm, and an access question when the homeowner says she lives alone or cannot do it herself.'
- 's07: panel shared with the other half not asked; bank_job_type changed to ''breaker trips'' (expected ''outlet repair''), which v1 had right. The card also writes that the button outlet ''won''t reset'' and that the lights work, neither said. Restore the partial_power-to-outlet-repair mapping for dead outlets, and record fu_breaker_or_gfci answers as the homeowner''s words.'
- 's08: no question about what was running, the fridge state or where the panel is; the human got the microwave, the warm fridge and the outside panel by the back door. The husband after 5 is now missing too. Add ''what was running when it went out'' and panel location to partial_power. Card is Spanish only where the human wrote it bilingual.'
- 's09: fu_neighbors_power went on a two-second dimming instead of recent work; the human asked about work on the dryer outlet, other loads that dim and whether the panel is original. Use the second follow-up on recent electrical work for flicker_dim.'
- 's10: v2 sent the 911 text and held for SAFE with no card; the human sent its own safety advice and then built a full card (outlet leads, warm cover, 1500 watt heater, photo of the dark ring, fan on an existing fixture at 12 feet, 1969). Decide the rule for a 911 hold with no SAFE reply (time out to a card, or ask once more) so a fire-list job where nobody leaves still reaches a business.'
- 's11: no question on what the outdoor unit does, its age and size, the reset count or who is home, and still no hvac_repair second card. Same fix as v1: add the second card when a breaker trips on AC start, and ask fu_trip_when even when ''when the AC starts'' is given.'
- 's14: the service-wire rating is unreachable (fu_service_drop asks only overhead or underground), and the card drops the ''Licensed electricians only'' line v1 carried. Change fu_service_drop to ask about the service wire and meter, and print the licensed-only line on panel_upgrade cards.'
- 's15: v1 asked ''what is it doing'' and got the age, warm-not-hot and two or three cycles; v2 skipped that question and age for three photo asks, so the card is thinner than v1. The human also asked what had been checked (outlet live, breaker on) and the vent. Keep ''what is it doing'' and age on dryer, and add ''what has been checked''.'
where_v3_lost_to_human:
- "s01: panel location (garage) never asked, and the danger answer 'no' was dropped from the card again. Print a 'Now: nothing sparking, hot, buzzing or smoking' line whenever the danger question is answered."
- "s02: outside wall and old garage door seal not asked; the human's card told the tech to bring a WR GFCI and in-use cover. Ask 'Is the outlet on an outside wall?' for garage and yard GFCI trips."
- "s05: welder amperage never asked; the human got 50 amp, which sets the wire size on a 60 foot run. Ask the nameplate amps on any new_circuit for a named machine."
- "s07: bank job type 'breaker trips' (from the expert file's partial_power mapping); expected and the human: 'outlet repair'. Map dead outlets with working lights to outlet repair."
- "s10: no outlet photo (the dark ring) and no existing-fixture question for the fan; the human got both. The kb rule 'skip the device photo when it is hot' blocked the photo; on burning_sparks ask for it after the 911 text and SAFE."
- "s11: AC age and tonnage not asked, and the AC request went as one line on the electrical card, not a separate hvac_repair card. playbook_v3.md rule 6 causes this; change it to produce the second card."
- "s14: 'Licensed electricians only' not printed on the card; v1 printed it. Put it in the panel_upgrade card template."
- "Re-asks: 8 questions repeated what the opener already said (s02 device, s04 count, s07 landlord, s08 timing, s09 when, s10 what is plugged in, s11 when, s14 size). The human asked for the missing detail directly ('how long do they dim', 'how many watts'). Rewrite the misdiagnosis checks to ask the detail, not the fact already given."
- "Length: over the scenario cap on 11 of 13 cards (s06 at 8 for an elderly homeowner on a five-question job); the timing question came back 'not sure' on 7 cards. Count timing toward the stop rule and skip it unless the job has a date driver."
- "Card slots still write things she did not say: 'Trips: one appliance' (s03), 'Won't reset: not found' (s07), 'Breaker: no' (s15), plus inferences 'attached' (s05), 'electric' (s09), 'for about a second and come back' (s01). Empty slots must read 'not asked' or 'not said'."
where_v3_beat_playbook:
- "Quotable on 13 of 13 cards against v1's 7 of 13; traps surfaced on 13 of 15 against 4 of 15; facts not stated 6 against 9."
- "s01: asked onset and frequency (two weeks ago after the monsoon storm, once an hour); v1 wrote 'When: not said'."
- "s02: asked what is plugged in and how the garage is fed (freezer full of meat, detached 40 ft from the house), so urgent has a stated basis; v1 invented 'right away when reset'."
- "s03: asked how long and who did the kitchen work (a year, worse in summer; previous owner's remodel)."
- "s05: skipped the danger and count questions and asked main size, wall finish and other planned loads; no 'EV: n/a' default."
- "s06: asked hardwired or battery, alarm age, ceiling height and access (12 years, 9 ft and vaulted, grandson Saturday); the supply slot says not asked instead of v1's 'either'."
- "s07, s08: got the reset already tried, the neighbor's panel key and a maybe-shared panel; what was running, the warm fridge and the outside panel. The husband after 5 now comes from her words."
- "s09: asked recent dryer-outlet work, panel age and whether the dryer is still in use, and the danger 'no' is on the card."
- "s10, s11: got the 1500 watt heater and the 12 ft vaulted ceiling; got hum-then-trip, three resets and who is home from his words, and named the AC request."
- "s15: asked gas or electric, what was checked (outlet live, breaker on) and the vent; dropped the error-code question."
- "Exact build years kept as typed (1969, 1974, 1976, 1979), and no photo re-ask in s04."
