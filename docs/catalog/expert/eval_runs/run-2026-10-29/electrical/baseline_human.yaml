      REQ-0115 | appliance_repair / dryer not heating fully | Lake Havasu City
      (Owner asked for an electrician; routed to appliance repair.)
      FACTS
      - Electric dryer, about 9 years old, owner says Whirlpool.
      - Drum spins; clothes get warm but never hot or dry. A load takes two or three cycles.
      - Breaker is on; husband checked the dryer outlet with a tester and it read live.
      - Vent hose behind the dryer: not checked.
      - No burning smell, sparks or smoke.
      - Photo: dryer door open, damp clothes, drum visible. No model sticker photo.
      - Home built: not asked. Timing: not said.
      SUSPECT (told owner it sounds like the dryer or vent, not the wiring)
      - Warm-not-hot with long cycles is classic restricted airflow (crushed transition hose, lint-packed vent run) cycling the high-limit, or a weak/partially open element or cycling thermostat. The "drill-style" tester is likely non-contact and does not prove both 120 V legs; but warm air means the element is seeing 240 V, so the receptacle is probably fine.
      CHECK ON SITE
      - Pull the dryer: transition hose and full vent run airflow; recommend dryer-vent cleaning (separate trade) if restricted.
      - Meter the receptacle leg-to-leg (240 V) to close out the electrical question.
      - Element resistance, high-limit and cycling thermostats, thermal fuse.
