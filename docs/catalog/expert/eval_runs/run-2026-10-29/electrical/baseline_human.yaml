    card: |
      REQ-0101 | electrical / dimming lights, one area | Lake Havasu City
      FACTS
      - Lights in the two back bedrooms dim for about a second and come back, roughly once an hour.
      - Front of the house and kitchen are normal.
      - Started about two weeks ago, after the monsoon storm.
      - No buzzing, no warm plates or outlets, no burning smell, no sparks.
      - House built 1979, original panel in the garage.
      - No panel photo (owner busy). Timing: not said.
      SUSPECT (my read, not told to owner)
      - Localized to the back bedrooms points to one branch circuit, not the service. Top of the list: a loose neutral or hot on a shared (multiwire) circuit, a backstabbed receptacle or splice in the back rooms, or a loose breaker/neutral-bar termination on that circuit. Storm timing makes me want to rule out surge damage at the panel.
      CHECK ON SITE
      - Identify the back-bedroom circuit(s); look for a shared neutral / handle-tied pair.
      - Torque and inspect that breaker and the neutral bar; look for heat discoloration.
      - Voltage at a back-bedroom receptacle under load, both legs; compare to the kitchen.
      - Pull receptacles/switches in those rooms for backstabs and loose wire nuts; check for aluminum branch wiring given the age.
      - If it shows up house-wide on the meter, look at the service neutral and call the utility.
