    card: |
      REQ-0102 | electrical / GFCI tripping, detached garage | Lake Havasu City | SAME DAY
      FACTS
      - GFCI receptacle in the detached garage keeps tripping; reset will not hold. (Owner called it a fuse; photo shows a GFCI with test/reset buttons, reset sitting out.)
      - Trips within a minute of plugging in a chest freezer. Freezer is full of meat. Owner wants it fixed today.
      - Not known whether it trips with nothing plugged in.
      - Detached garage, about 40 ft from the house. Not known if the garage has its own panel.
      - Outlet is on an outside wall; garage door seal is old.
      - Not known whether other garage outlets go dead when it trips.
      - House built 1998.
      SUSPECT (told owner it's a GFCI, not a fuse; cause not told)
      - Either moisture/dust in the box on the exterior wall, a worn 1998-era GFCI, or ground-fault leakage from the freezer compressor/defrost circuit. Could also be a downstream device on the same GFCI.
      CHECK ON SITE
      - Bring a new weather-resistant GFCI and an in-use cover. Open the box: moisture, corrosion, wire condition.
      - Test GFCI with no load, then with the freezer; plug freezer into a known-good GFCI to split device vs appliance.
      - Trace what's downstream of this GFCI; check the feed to the detached garage (sub-panel or single circuit, grounding electrode if a sub).
      - If the freezer is leaking to ground, tell the owner it's the appliance and get the food on a temporary circuit.
