# electrical estimator in Arizona: 25 years, prices jobs from a text and a photo, knows Lake Havasu
# homes. Per baseline_human_estimator.md the run agent did not open question_bank.yaml, the expert
# file or trade_kb; it had categories.yaml for routing, so job_type holds the categories.yaml job
# type label (no kb ids). The estimator asks in their own words, may tell the homeowner what they
# suspect and may give safety advice (the judge notes it; it does not count against the human).
# Only the privacy rules bind the notes. The homeowner is played strictly from the scenario's
# hidden facts and behavior; anything not in hidden_facts is answered "not sure".
# fire_dept_text records whether the estimator sent a 911/safety message for a fire-truck-list fact.
