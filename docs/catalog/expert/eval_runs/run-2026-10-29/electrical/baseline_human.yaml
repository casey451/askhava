      - Confirm welder nameplate (input amps, breaker size) before settling on 50 A.
      - Attic path from panel to garage; surface conduit option on the garage side vs fishing drywall.
      - Quote two ways: circuits only off the existing panel, and a garage sub-panel sized for the future EV charger.
