    card: |
      REQ-0103 | electrical / kitchen breaker tripping | Lake Havasu City
      FACTS
      - Owner asks for a new 20 A breaker for the kitchen circuit; says he already knows it's the breaker.
      - Trips only when the microwave and the toaster oven run together.
      - About a year, more often in summer.
      - Breaker feels slightly warm after a trip. No smell, no buzzing.
      - Kitchen remodeled by a previous owner; outlets added along the counter.
      - A second kitchen breaker exists and has never tripped.
      - House built 1986. Photo: panel open, one breaker in the tripped (middle) position, handwritten label "kitchen".
      SUSPECT (told owner the load alone can trip a good breaker)
      - Most likely both appliances are on one 20 A counter circuit, about 2,500-2,900 W together, so it's tripping as designed. Warm handle could be load, or a loose/oxidized lug or a tired breaker. Unknown remodel wiring (counter outlets possibly daisy-chained off one circuit, possibly undersized wire).
      CHECK ON SITE
      - Map which counter receptacles are on which kitchen breaker.
      - Clamp the circuit with both appliances running; check wire gauge at the breaker (must be 12 AWG for 20 A).
      - Inspect the breaker lug and bus stab for heat damage; IR the breaker under load.
      - Quote two options: replace breaker plus re-torque (his ask), and re-split counter receptacles / add a dedicated circuit for the microwave.
