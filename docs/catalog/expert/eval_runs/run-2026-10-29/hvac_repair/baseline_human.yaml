      REQ-0151 | Heating and cooling repair | Lake Havasu City
      FACTS
      - Rooftop package unit (one box on the roof). One-story home, flat roof.
      - No roof hatch; tech needs a ladder on the side of the house.
      - Runs and air comes out of the vents, but only mildly cool. House was 86 inside when she texted (afternoon).
      - Started about 3 days ago, worse each afternoon.
      - About 12 years old; came with the house.
      - No photo (she will not go on the roof; not asked to).
      - Needed: not said.
      SUSPECT
      - Weak cooling that fades in the afternoon heat: dirty condenser coil, failing capacitor or condenser fan motor, or low charge from a leak.
      - About 12 years puts it around 2014, so most likely R-410A; confirm on the plate.
      - Rooftop package unit: check the roof curb and supply/return duct connections for leaks or a disconnected duct dumping cold air into the roof cavity.
      ON SITE
      - Bring an extension ladder; flat roof, walk carefully on the roofing.
      - Read the data plate (refrigerant, tonnage, year). Check filter (often in the unit or a return grille), condenser coil, capacitor, fan motor amps, superheat/subcool.
      - Measure supply/return split at the registers.
      - Yard/gate access not asked; ask on arrival.
    facts_in_card_not_stated: []

