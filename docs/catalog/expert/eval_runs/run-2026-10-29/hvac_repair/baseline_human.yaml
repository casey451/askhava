    card: |
      REQ-0154 | Heating and cooling repair | Lake Havasu City
      FACTS
      - Thermostat screen went blank this morning and stays blank with fresh batteries. AC not running.
      - Outdoor unit completely silent, no hum.
      - Brown stain on the hallway ceiling, appeared this week. Water dripped from around the attic hatch two days ago.
      - Air handler is in the attic above the hallway; access through the second-floor hall closet. Two-story home.
      - About 7 years old.
      - Photo: thermostat with dark screen, cover open, two AA batteries on the floor. No photo of the stain.
      - Needed: not said.
      SUSPECT
      - Condensate backup tripping the float/safety switch, which kills 24 V so the thermostat goes dark (if it is a powered stat). Clogged primary drain likely.
      - Second possibility: blown 3 A fuse on the control board or a failed transformer.
      ON SITE
      - Attic work through a second-floor closet: bring drop cloths, a wet vac, and a nitrogen/CO2 drain-clearing kit.
      - Check the secondary pan and float switch, clear the primary drain, check for pan rust-through.
      - Check board fuse and transformer output; test the thermostat only after 24 V is restored.
      - Note the ceiling drywall damage for the homeowner; drywall is not HVAC scope.
    facts_in_card_not_stated: []

