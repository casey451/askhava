      REQ-0152 | Heating and cooling repair | Lake Havasu City
      FACTS
      - House won't cool. Ice on the large copper (suction) line where it enters the outdoor unit; foam sleeve frosted; water dripping onto the pad.
      - Homeowner first said "compressor in the attic"; corrected: ice is at the outdoor unit, the indoor air handler is in a ground-floor garage closet, attic holds ducts only.
