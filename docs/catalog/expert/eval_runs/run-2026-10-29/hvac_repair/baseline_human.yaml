notes: >-
  The intake is played as a top Arizona HVAC estimator (25 years, Lake Havasu City), texting one
  question at a time, with no question bank, no expert file and no trade file. The estimator may say
  what they suspect and may give the advice a real estimator would; the card holds the crew notes
  (facts got, suspicions, on-site checks). The homeowner is played strictly from the scenario.
  Coverage is assumed confirmed for Lake Havasu City except in s13 (outside area) and s14 (no
  businesses), where the intake stops before any trade question as intake_agent.md says. job_type
  values use the kb ids named in the scenario file where one fits the estimator's own call. Photos
  are only described from the scenario's photo field; where the scenario gives no photo content, the
  estimator does not get one.
