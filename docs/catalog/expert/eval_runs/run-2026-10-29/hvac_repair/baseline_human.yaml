      REQ-0153 | Heating and cooling repair | Lake Havasu City
      FACTS
      - AC runs, air lukewarm, getting worse over two summers.
      - Homeowner added refrigerant himself with a can kit last July; cooled for a few weeks. He believes it just needs freon.
      - About 18 years old. Data plate reads R-22 (per homeowner; plate partly covered by a vine in the photo).
      - Photo: outdoor condenser, small oily stain on one copper fitting, rusty data plate partly behind a vine.
      - Homeowner is price-focused and expects a quick top-off.
      - Needed: not said.
