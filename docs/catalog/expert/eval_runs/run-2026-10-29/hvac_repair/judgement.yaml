where_playbook_lost_to_human:
- 's01: the symptom options do not separate ''runs but only a little cool'' from ''not cooling'', and ''one box'' was turned into ''System: not sure''. The human asked first ''not turning on at all, or
  running but not cooling?''. Fix: give the symptom question ''Runs, air only a little cool / Runs, air warm / Won''t turn on'' and record a one-box answer as a package unit.'
- 's02: the follow-up went to the outdoor fan on a unit already shut off. The human asked when the filter was last changed, how many return grilles, and where the indoor unit is. Fix: for ice on the lines,
  the follow-up should be the filter question; ask ''Is it running now?'' before any fan question and do not record fan state for a unit that is off.'
- 's03: the refrigerant on the label (R-22) was never asked; both baselines asked it. Fix: when age is over 15 years and the label photo is unreadable or covered, ask ''What refrigerant does the label say?
  1 R-22 2 R-410A 3 Not sure''.'
- 's04: never asked whether the outdoor unit makes any sound or where the indoor unit is, so the silent condenser, the attic air handler reached through a second-floor closet and the earlier drip from the
  attic hatch are missing. Fix: for ac_not_turning_on, ask the outdoor-sound question and the indoor-unit location before the error-code question; widen the water follow-up to ''any drip, stain or wet spot
  on a ceiling or near the indoor unit''.'
- 's05: after spotting the furnace label the playbook re-asked for the outdoor label instead of asking whether the outdoor unit was replaced. The human asked ''Is the AC outside the same age, or has it
  been replaced?'' and got the 2019-on-2004 mixed system. Fix: when the photo is a furnace label, ask the outdoor unit''s age or replacement year.'
- 's06: the human asked when the system was last checked (not since April). Minor; add ''last service'' for absentee-owner no-run calls.'
- 's08: the human asked how many blinks of each color (one green, two orange); the card has only ''green blinking, orange blinking''. Fix: ask the blink count without decoding it.'
- 's15: the cooler follow-up merged ''pads last changed'' with ''last cleaned'', so the card says pads were changed last year while they are five or more years old; the pump and the dry corner were never
  asked. Fix: split pad age from last cleaning and ask ''Are the pads wet all over, and does the pump run?''.'
- 's16: the card turned ''about 1800'' into the 1,200 to 2,000 band, dropped the gas furnace and coil in the hall closet, and never got ''before summer''. Fix: keep the stated number next to the band and
  ask the indoor equipment and its location for a replacement.'
- 'All scenarios: the fixed timing question (INT-030) was never asked, so every card says ''Needed: not said'', even when she asked for today (s09), he asked for someone now (s10) or said whenever (s11).
  Fix: ask the timing question, or fill Needed from the homeowner''s own words.'
- 's02, s05, s06, s15: the playbook re-asked ''What''s happening?'' after the opening already said it, spending a question the human did not; s01, s05, s06, s16 went over the scenario''s max_questions.'
where_v2_still_lost_to_human:
- 'All scenarios: v2 dropped the open ''Anything else?'' question that the first playbook run used, and the facts it used to bring in are now missing: s01 start date, s05 unit access, s08 landlord approval and the after-4 window, s10 the sequence, two stories and no sparks, s12 the shared garage closet and one story. The human got each of these with a direct question. Fix: keep the open question after the must-know questions, or ask each of these directly.'
- 'All scenarios: the timing question is now asked and Needed is filled, but v2 asks it even when the opening already gave the timing (s09 ''hoy'', s10 ''come now''). Median questions went from 5 to 6 against the human''s 5, and 10 of 13 carded scenarios went over max_questions (s01, s03, s04, s05, s06, s07, s09, s12, s15, s16). Fix: fill Needed from the opening when it is there, and count photo asks against the cap before adding a second or third photo ask.'
- 's01: ''Runs but not cold'' fixed the run-or-dead gap, but ''the big box thing. not sure'' was left as ''System: not sure''. The human got the one-box rooftop package unit. Fix: when the system answer is unsure and the unit is on a roof, ask ''Is it one box, or a box outside plus a unit inside?'' and record one box as a package unit.'
- 's02: still no filter, return or ''Is it running now?'' question; three of five questions were photo asks. The human asked the filter date, the return count and where the indoor unit is. Fix: for ice on the lines, ask the filter date and whether it is running now before any photo ask.'
- 's03: the label refrigerant (R-22) is still not asked on an over-15-year unit with an unreadable plate, and ''worse over two summers'' is gone. Fix: same as the first run; ask the refrigerant on the label when age is over 15 and the plate is covered.'
- 's04: system, age, access and the outdoor-unit sound were all skipped as not in must_know, and the error-code question was asked after a blank screen. The card lacks the new batteries, the silent outdoor unit, the attic air handler through a second-floor closet, the earlier drip and the age. The human had all of them. Fix: for ac_not_turning_on, ask ''Does the outside unit make any sound?'' and where the indoor unit is; skip the error code when the screen is blank.'
- 's05: after spotting the furnace label and getting the 2019 outdoor label, v2 asked system type and age, both already answered by the labels, and never asked access. Fix: let a readable label answer system and age, and spend the question on unit location.'
- 's06: four of six questions (what is happening, error code, breaker, photo) could not be answered by an owner in Minnesota, and ''who can let a tech in?'' was never asked, so the neighbor key, park check-in and the cats are all missing. The human asked access and occupants. Fix: when the owner is away, ask who can let a tech in and whether anyone or any animals are inside, and skip on-site checks.'
- 's07: the locked gate is on the card but not that a neighbor can meet the tech, nor ''since last night''; six questions to an 81-year-old against a cap of four. Fix: when the gate is locked, ask who can open it or meet the tech; drop the system-type question when the access answer places the unit.'
- 's08: the tenant is recorded but not that the landlord has not approved the call or that the lease needs approval; blink count still not asked. Fix: for a tenant, ask ''Has the owner said yes to this visit?'' and record the answer; ask the blink count without decoding it.'
- 's09: never asked whether she owns or rents, so the aunt''s text approval and the boxes in the path are missing and the package unit stays ''no sé''. The human got all three. Fix: ask own or rent on every card; ask ''Is the path to the unit clear?''.'
- 's11: not comparable. In this run the homeowner never replied SAFE, so the 911 hold ended the intake with no card; the human run got SAFE and a full card. No fix proposed to the hold itself.'
- 's12: the shared garage closet and one story were never asked, seven questions against a cap of five, and v2 said the water heater needs its own request without offering to start it. Fix: ask where the indoor unit is and what else is in that space; offer the second request at the end.'
- 's15: the swamp-or-refrigerated opener works, but the pad follow-up still merges ''changed'' with ''cleaned'', so the card shows pads changed last fall when they are five or more years old; pump and dry corner not asked; the smell-kind question was asked after he said wet dog; eight questions. Fix: split pad age from last cleaning, ask ''Are the pads wet all over, and does the pump run?'', and skip the smell kind when the smell is already named and is not gas or burning.'
- 's16: ''about 1800'' is still cut to the band, and stories, unit location, the locked gate and the gas furnace and coil in the hall closet were all skipped as not in must_know. The human had them all. Fix: keep the stated number next to the band, and add unit location, stories and heat source to ac_replacement must_know.'
where_v3_still_lost_to_human:
- 'Cards carry facts nobody said: 12 facts_not_stated against the human''s 2, several matching the scenario''s hidden facts word for word (s04 ''only thermostat in the house'', s07 ''son lives out of town'', s08 landlord approval status, s09 ''rented'', s15 ''since the monsoon'', s16 ''before summer''). Fix: write the card only from transcript lines, and check that the v3 card writer cannot see the scenario file.'
- 's02: still no return-count question, and the air handler location (garage closet, not the attic he named) was never asked. The human asked both.'
- 's04: never asked whether the outdoor unit makes any sound; the card says ''Outside unit: not asked''. The human had the silent condenser.'
- 's06: last service date (not since April) still not asked; the human asked it.'
- 's08: blink count still not asked (the human asked how many of each color), and the remote question spent one of six questions where the cap is five.'
- 's09: re-asked ''¿Qué está pasando?'' after her opening said it, spent a question on square feet, and never asked own or rent, owner approval or the outdoor fan. The human got the aunt''s approval by text.'
- 's10: never asked about sparks, smoke or burning smell, and wrote ''Needed: not said'' after ''SOMEONE COME NOW''; five questions against a cap of four. The human had both.'
- 's15: pad age is still merged with last cleaning and the pump is not asked; the human split them. The symptom question repeated the opening.'
- 's16: heat source (gas furnace) and the house age (1996, about 28 years) were not asked; the human had both.'
- 's09, s12, s15: the symptom question was re-asked after the opening had answered it (C11), and s08, s09, s10, s12, s15 went over the scenario max_questions.'
where_v3_beat_playbook:
- 's01: got ''one box on the roof'', ''only mildly cool'' and ''three days ago, worse each afternoon'' in five questions; the scripted playbook missed the package unit and weak cooling in six.'
- 's02: asked the filter date and ''Is the system running right now?''; the scripted playbook asked the outdoor fan on a unit already shut off and missed the filter.'
- 's03: the data plate photo ask got R-22 on an 18-year unit; the scripted playbook never got the refrigerant.'
- 's04: asked new batteries, water or stain, indoor-unit location and age; got the attic air handler through a second-floor closet and the drip two days ago, which the scripted playbook missed, and wrote no ''Breaker: not checked'' default.'
- 's05: the age question drew out the 2019 outdoor unit on a 2004 furnace; the scripted playbook left AC age ''not sure''.'
- 's06: asked occupants and pets instead of an error code an owner in Minnesota cannot read.'
- 's07: four questions at the cap of four (the scripted playbook used five), with the neighbor who can meet the tech on the card.'
- 's09: took Needed: hoy from her words; the scripted playbook wrote ''Necesita: no dicho''.'
- 's11: sent the INT-004 911 text word for word; the scripted playbook paraphrased it and added ''and your gas company'' (C3).'
- 's12: offered to start the water heater request next and named it on the card as a separate request.'
- 's16: kept ''about 1,800 sq ft'' as stated and got the indoor coil in the hall closet, ground side yard and the locked gate; the scripted playbook cut 1,800 to the band and missed the closet.'
