judge_model: claude-opus-5-5
panel:
- owner
- estimator
- field_tech
judge_notes:
- Scored blind by label from the three run files and scenarios/hvac_repair.yaml; the expert file was opened only for compliance code C10, after the panel scores below were written.
- The town on the playbook and human cards comes from the harness-assumed coverage check (intake_agent.md step 1), not from the homeowner; it is not counted as a fact not stated.
- SUSPECT and ON SITE sections on the human cards are the estimator's own suspicions, allowed for that variant; facts_not_stated covers only the FACTS lines.
- baseline_none job_type labels are compared with the scenario's bank_job_type; s04 'thermostat' does not match the expected 'AC not cooling' (kb ac_not_turning_on).
- Stops for the expected reason (s13 outside_area, s14 no_businesses) score quotable null and routing_correct true; s13's traps are all about the stop and are scored caught, s14's capped-wire trap cannot
  be reached and is null.
- urgent is not a scored field; the playbook and human set it as expected in s06, s07, s09, s10, s11, baseline_none set it false everywhere.
- playbook s08's transcript in the run file starts at the intake's age question; the homeowner's opening message is missing from the file.
