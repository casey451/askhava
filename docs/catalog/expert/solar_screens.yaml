  signup_objections:
    - objection: "Why would I pay a fee when I can get the job myself?"
      answer: "You pay only when the homeowner picks your quote. Nothing to join and nothing per month. The fee is set by job size: $25, $75 or $199."
    - objection: "I can't price screens or film without measuring."
      answer: "Quote a range and say what puts it at the high end. Each card lists the window count, stories, large openings and anything mounted outside the windows, with photos when she sends them. Your final price can follow your measure."
    - objection: "How do I know these homeowners are serious?"
      answer: "Each request comes from a texted phone number we check, with a town, answers to the questions a screen or film shop asks, and photos when she has them. Her name and address go only to the business she picks."
    - objection: "What if I quote and don't get picked?"
      answer: "Then you pay nothing. The introduction fee is charged only when a homeowner picks your quote and you confirm."
    - objection: "Will you rank me against other shops?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license number and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "I only do screens, not film."
      answer: "You pick the job types you want at sign-up and can change them any time. You get cards only for those."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Which license do I need for these cards?"
      answer: "Cards in this category go to businesses whose ROC license is R-65 or CR-65 Glazing. We check the license at sign-up and again at each pick."
