# Ask Hava expert layer: solar_screens (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set solar_screens and trade_kb/trades/windows_doors.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The kb file covers windows and doors broadly. Only two kb job types fit this category:
#   screens -> "solar screens" and film_blinds -> "window film".
# - Left out: glass_repair (broken or foggy glass). R-65 covers glass, but it is neither a screen
#   nor a film job, and no category job type routes glass repair. The intake treats it as a
#   misdiagnosis check with no category (if_other_route_to: null). If Casey wants glass repair
#   offered, add a "glass repair" job type here (R-65, range) and map glass_repair to it.
# - Left out as other trades with no enabled category: window_replace, slider_repair,
#   door_replace, security_door, door_adjust (R-7 / R-60 work). window_replace and security_door
#   appear below only as misdiagnosis checks routed to null.
# - film_blinds also holds blinds and shutters (both in the R-65 scope). The category keywords and
#   the bank's product question name only screens and film, so this entry is written for film.
#   A blinds or shutters request would land on "window film", a poor fit. Recommend adding a
#   "blinds and shutters" job type, or leaving blinds out of the keywords on purpose.
# - The R-65 scope text names glass products, window film, blinds and shutters and glass-holding
#   members. It does not name exterior solar screens (checked 2026-10-29). The categories.yaml
#   review line already asks the attorney to confirm which class, if any, screen-only shops need.
# - Photo p4 (tape measure across width and height) is in the kb file but not in the question
#   set's photos [p1, p2, p3]. It is the most useful photo for both job types; recommend adding it.
#   photo_reading covers p4 in case a homeowner sends one; photos_priority uses only p1 to p3.
schema: 1
