# Ask Hava expert layer: home_watch (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set home_watch and trade_kb/trades/home_watch.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Mapping. The category has two job types, "weekly house check" (recurring, monthly) and "storm check"
#   (one-time, firm). All six kb job types are kept:
#     weekly_house_check -> "weekly house check" (monthly).
#     storm_check -> "storm check" (firm).
#     arrival_departure and meet_and_greet -> "storm check", because it is the only one-time job type and
#       both are a single visit quoted firm. A business that opts into storm checks will get open-up,
#       close-up and let-someone-in cards too. Suggest renaming "storm check" to "one-time check" or adding
#       "open or close the house" and "let someone in" as one-time job types.
#     key_holding -> "weekly house check" (monthly), because holding a key is an ongoing service. Suggest a
#       "key holding" job type later so businesses can opt in to it alone.
#     leasing_refused -> the refused name "rent collection, finding tenants or leasing" (LIC-018). Its
#       card_template is the internal decline record; no card goes to a business. Its quote_format reads
#       monthly only because the checker takes the category's format; nothing is quoted.
# - No new_job_type was needed.
# - The bank set has no home-size question, but the kb has one (home_size) and size is the second price
#   driver. Here size is the follow-up fu_home_size, which spends the one follow-up allowed. Suggest adding
#   home_size to the bank set. Suggest adding p3_thermostat (summer away) and p5_storm_area (storm checks)
#   to the bank photo list, which holds only p1, p2 and p4.
# - The bank tasks options leave out pool, boat or vehicle checks, mail, trash bins and pet feeding. Pet
#   feeding is not home watch and there is no pet category; the card states a pet in the home plainly so
#   the business can decline. Open question for the catalog.
# - A lockout happening now has no route: there is no enabled locksmith category. key_holding covers only a
#   spare key set up ahead of time.
# - A.R.S. 32-2601 defines a security guard as a watchman or patrolman employed by a private security guard
#   service. NHWA says home watch is not a security service. Cards and follow-ups here avoid "security",
#   "patrol" and "guard". Whether a business that sells patrols needs a security license is not decided
#   here and is a question for counsel, not for the intake AI.
# - Lake Havasu City vacation rentals need a 24/7 emergency point of contact. Acting as that contact is not
#   a job type in any category; a request for it is carded as home watch only for the visit work. Open.
