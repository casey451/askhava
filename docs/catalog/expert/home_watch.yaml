business_side:
  how_they_get_customers: ["Word of mouth among part-year neighbors and in 55-plus parks [judgment]", "Realtors, insurance agents and HOA or park offices passing their name along [judgment]", "Google Maps listing and reviews [judgment]", "Local Facebook groups for winter visitors and lake-home owners [judgment]", "NHWA's searchable member directory, for accredited businesses"]
  customer_acquisition_benchmarks:
    - channel: "Thumbtack (all trades)"
      figure: "Pros report about $10 to over $100 per lead by trade and market; customers often contact several pros at once (software vendor)"
      source: hcp_thumbtack
      unverified: false
    - channel: "Thumbtack and Angi (low-ticket services)"
      figure: "About $8 per lead for small cleaning jobs, $25 to $75 for most home-service trades; Angi $15 to $85 plus an annual fee (marketing vendor citing third-party reports)"
      source: superdupr_thumbtack
      unverified: false
    - channel: "Angi (shared requests)"
      figure: "No single published price; each request goes to 3 or 4 pros, sometimes more, and each is billed"
      source: nextphone_angi
      unverified: false
    - channel: "What a home watch client is worth (context for the fee)"
      figure: "Watchers profiled in one 2024 article charge $50 to $100 per visit, weekly or every two weeks"
      source: boston_homewatch
      unverified: false
    - channel: "Home watch businesses specifically, and Lake Havasu City"
      figure: "No published cost-per-client figures found for home watch or for this market; most clients appear to come by word of mouth"
      source: null
      unverified: true
  what_they_dislike_about_lead_services: ["Paying for a one-time storm check that four other businesses also bought", "Requests from people who wanted a house sitter to live in", "Monthly fees whether or not clients come", "Being sorted or rated by the site", "Requests with no away dates and no way to get in"]
  what_makes_a_lead_worth_paying_for: ["Away dates, visit schedule and tasks stated up front", "Home size, casita and pool or vehicles on site stated", "Access type and any gate pass stated, with codes kept for the call", "A season-long client for one fee", "Pay only when picked, nothing monthly"]
  their_words: ["home watch", "house check", "visit report", "walk-through", "checklist", "open-up", "close-up", "flush and run", "snowbird", "part-year", "vacant", "unoccupied", "key holder", "vendor pass", "storm check", "call-out", "insured and bonded", "NHWA accredited"]
  signup_objections:
    - objection: "Why pay a fee for a home watch client?"
      answer: "You pay once, only when the homeowner picks your quote. A monthly account counts as 4 months of its price: under $125 a month the fee is $25, and $125 to $375 a month it is $75. A one-time storm check under $500 is $25. If that owner picks you again through Ask Hava, there is no fee."
    - objection: "Most of my clients come from referrals. Why do I need this?"
      answer: "You may not. It costs nothing to be listed and nothing per month, so a card you don't want costs you nothing. You quote only the ones that fit your route."
    - objection: "Storm checks are one-offs. I want regular clients."
      answer: "You choose your job types at sign-up and can change them any time. Pick weekly house checks only and you won't get storm check cards."
    - objection: "I don't quote without walking the house first."
      answer: "Each card gives away dates, how often, size, casita or pool, tasks and access type. Quote your monthly price and say that it starts after a first walk-through with the owner or their local contact."
    - objection: "How do I know these are real owners and not renters?"
      answer: "Each request comes from a texted phone number we check. The card says who is asking: the owner, family for the owner, or a renter, and whether the owner's OK is confirmed. Names and addresses go only to the business the homeowner picks."
    - objection: "Will you put gate or lockbox codes on the card?"
      answer: "No. Codes and keys never go on a card. The homeowner gives them to the business she picks, on the call."
    - objection: "Will you send me property management or rental work?"
      answer: "No. Ask Hava never sends rent collection, tenant finding or leasing requests."
    - objection: "Do I need a license to sign up?"
      answer: "No state contractor license covers home watch visits, so Ask Hava does not ask for one. Lake Havasu City has its own business license rule for businesses working inside city limits. Any repair you spot goes out as its own request to the matching trade."
    - objection: "Owners want to know I'm insured and bonded."
      answer: "Your quote can say whether you carry liability insurance and a bond. The homeowner sees it with your name and review links. Ask Hava shows insurance as yes or no and does not check it."
    - objection: "Will you rank me against other home watch businesses?"
      answer: "No. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "What if the owner cancels before the first visit?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded. After that the fee stands. It is a fixed introduction fee by job size, not a share of the job."
  quote_tips_for_card: ["Give a price per visit and the monthly total for the schedule asked", "Say what each visit includes and whether a dated photo report is sent", "Say what you charge for storm call-outs and for meeting contractors", "Say whether there is a minimum number of months", "Say whether you carry liability insurance and a bond", "Give the date of your first walk-through"]
