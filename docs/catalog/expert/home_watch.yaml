trade_brief:
  price_drivers:
    - driver: "Visits per month: weekly, every two weeks or monthly"
      why: "The monthly quote is the per-visit price times the visit count; the bank's schedule question settles it. Weekly and every-two-weeks visits are the norm in the trade."
      source: boston_homewatch
    - driver: "Time on site: home size, stories, a casita, detached garage or second building"
      why: "Visits run about 20 to 40 minutes inside and out; a big home or a casita adds a second walk-through."
      source: boston_homewatch
    - driver: "Tasks on each visit: run taps and flush toilets, AC and thermostat, plants, fridge, starting a car or golf cart, trash bins"
      why: "Each task adds minutes to every visit, so a walk-through-only check and a full checklist are different prices. [judgment]"
      source: null
    - driver: "Which months and how many: summer only, winter only, year-round, off and on"
      why: "Months set the total visits; summer checks add AC and heat items, and a short season may carry a minimum. [judgment]"
      source: null
    - driver: "Call-outs beyond the schedule: after storms, to meet a contractor, to let the owner in"
      why: "Extra trips are priced per trip or folded into a higher monthly rate; the owner's words on storms and contractors tell the business which. [judgment]"
      source: null
    - driver: "A dated photo report after each visit"
      why: "Writing and sending the report adds time; owners ask for it because standard HO-3 vacancy terms change after 60 days empty, though Ask Hava gives no insurance advice."
      source: adjusters_vacancy
    - driver: "Access: someone local lets them in, lockbox, smart lock, plus a gate pass"
      why: "A gated community or park office pass, or a key held by a neighbor, adds setup time to the first visit and to any same-day call. [judgment]"
      source: null
    - driver: "Drive time to outlying areas beyond the city core"
      why: "A home well outside town adds windshield time to every visit on a route. [judgment]"
      source: null
  hidden_conditions:
    - condition: "A leak, wet floor or AC fault already found on an earlier look and never fixed"
      how_a_pro_spots_it: "Owner says 'nothing special' but a neighbor or last visit found something; the known-problem answer"
      question_or_photo: fu_known_problem
      source: iii_homeowners
    - condition: "Gated community or 55-plus park where the owner or the office must add a vendor pass"
      how_a_pro_spots_it: "Gate or guard shack in the entry photo; the access answer; manufactured home in a park"
      question_or_photo: fu_gate_pass
      source: null
    - condition: "The home is cooled by an evaporative cooler, not central AC, or the AC is off with a fridge still running"
      how_a_pro_spots_it: "Thermostat photo; cooler on the roof in the front photo; owner says the AC is set high for summer"
      question_or_photo: p3_thermostat
      source: null
    - condition: "Pool, spa, boat, RV or golf cart on site that nobody is looking after"
      how_a_pro_spots_it: "RV pad, boat or pool in the front photo; the pool answer"
      question_or_photo: fu_pool_service
      source: null
    - condition: "A pet stays in the home and needs feeding, which is not home watch work"
      how_a_pro_spots_it: "The homeowner's words mention a cat or dog staying behind"
      question_or_photo: tasks
      source: null
    - condition: "Someone other than the owner is asking (a renter or adult child) and owner approval for keys is not confirmed"
      how_a_pro_spots_it: "Texter says 'I rent' or 'my mom's house'; the card's arranged-by line"
      question_or_photo: access
      source: null
    - condition: "The home is rented or used by guests between visits, so it is not a vacant-home check"
      how_a_pro_spots_it: "Owner mentions guests, a rental or a property manager"
      question_or_photo: fu_rent_out
      source: ah_lic_018
    - condition: "Water left on at the main with the water heater running in an empty home, and no one knows where the shutoff is"
      how_a_pro_spots_it: "Shutoff or water-heater photo, or none sent because the owner does not know where it is"
      question_or_photo: p4_water_shutoff
      source: adjusters_vacancy
  misdiagnosis_checks:
    - sounds_like: "storm check (water in the garage or house after a storm)"
      might_be: "leak_active (plumbing kb), a different category"
      one_question: fu_storm_what
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "storm check (roof tiles off or a ceiling stain after wind or rain)"
      might_be: "roof damage (roofing kb), a different category"
      one_question: fu_storm_what
      if_other_route_to: {category: roof_repair, job_type: "tile replacement"}
      source: null
    - sounds_like: "yard cleanup after a wind storm (landscape_maintenance)"
      might_be: "storm_check"
      one_question: fu_inside_checked
      if_other_route_to: {category: home_watch, job_type: "storm check"}
      source: null
    - sounds_like: "weekly house check with a pool"
      might_be: "vacation_service (pool_cleaning kb), a second card"
      one_question: fu_pool_service
      if_other_route_to: {category: pool_cleaning, job_type: "weekly pool service"}
      source: null
    - sounds_like: "weekly house check (owner asks for a property manager)"
      might_be: "leasing_refused"
      one_question: fu_rent_out
      if_other_route_to: {category: home_watch, job_type: "rent collection, finding tenants or leasing"}
      source: ah_lic_018
    - sounds_like: "weekly house check (checks between guest stays)"
      might_be: "str_turnover (house_cleaning kb), a different category"
      one_question: fu_rent_out
      if_other_route_to: {category: turnover_cleaning, job_type: "turnover clean"}
      source: null
    - sounds_like: "arrival_departure (turn the AC on before we arrive)"
      might_be: "AC not cooling (hvac kb), a different category"
      one_question: fu_known_problem
      if_other_route_to: {category: hvac_repair, job_type: "AC not cooling"}
      source: null
    - sounds_like: "weekly house check (keep an eye on it, nothing special)"
      might_be: "leak_slow found on an earlier visit (plumbing kb), a second card"
      one_question: fu_known_problem
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
  photo_reading:
    - photo_id: p1_home_front
      reads: ["One or two stories", "Rough size of the home", "Casita, detached garage, RV pad or boat parking", "Rooftop evaporative cooler", "Rock, grass or plants in the yard", "Gate or guard shack in view"]
      neutral_wording: "Photo shows a one-story home with a two-car garage, rock front yard and an RV pad."
    - photo_id: p2_entry_access
      reads: ["Front door, side door or gate", "Keypad or smart lock (no code visible)", "Courtyard or walkway gate", "Lockbox or code showing, which needs a new photo"]
      neutral_wording: "Photo shows a front door with a keypad lock and a courtyard gate."
    - photo_id: p3_thermostat
      reads: ["Basic, programmable or smart thermostat", "Cooling, heating or off", "Set point on the screen", "Cooler switch instead of a thermostat"]
      neutral_wording: "Photo shows a programmable thermostat set to cooling."
    - photo_id: p4_water_shutoff
      reads: ["Where the main shutoff or water heater sits (garage, closet, outside)", "Valve handle type", "Water heater in a hall closet or garage"]
      neutral_wording: "Photo shows the water heater in the garage with a valve on the line above it."
    - photo_id: p5_storm_area
      reads: ["Palm fronds, branches or debris in the yard or pool", "Patio items moved by wind", "Standing water", "A door or window that looks open", "Roof tiles on the ground"]
      neutral_wording: "Photo shows palm fronds and patio cushions in the back yard and pool, and the sliding door appears partly open."
  local_factors:
    - fact: "About 1 in 5 Lake Havasu City housing units has no household living in it (35,394 units, 28,463 households), and the median age is 56.1"
      effect: "A large stock of part-year and second homes sits empty for months, which is the whole market for house checks"
      source: census_lhc
    - fact: "Summer heat: the official city station logged 120 days at or above 100 F and 23 days at or above 110 F in 2014, with a high of 117 F"
      effect: "An AC that stops in an empty home may not be found until the next visit, so summer owners ask for AC and thermostat checks and some ask for weekly visits"
      source: lhc_weather_2014
    - fact: "Monsoon season runs June 15 to September 30, with strong winds, dust storms and local flash flooding"
      effect: "Storm checks come in bursts after a wind or dust event, often after a neighbor texts the owner"
      source: adwr_monsoon
    - fact: "City water hardness is about 19 grains per gallon"
      effect: "Running taps and flushing toilets is a standard visit task in a home left dry for months [judgment]"
      source: lhc_ccr
    - fact: "Under the standard HO-3 form, glass and vandalism coverage changes after more than 60 days vacant"
      effect: "Some owners ask for dated photo reports for their records; the card notes it as a task, with no insurance advice"
      source: adjusters_vacancy
    - fact: "Water damage and freezing were 22.6 percent of US homeowners insurance losses in 2023 (national, not local)"
      effect: "Finding water early is the main reason owners pay for checks; a found leak goes out as its own plumbing card"
      source: iii_homeowners
    - fact: "Vacation rentals in the city need a permit and an emergency contact available around the clock"
      effect: "Rental owners may ask a home watch business to be that contact; that role and anything about bookings or rent stays off the card"
      source: lhc_vacation_rentals
    - fact: "Manufactured homes in age-55-plus parks and gated HOAs are common, often with an office-issued vendor pass"
      effect: "The gate pass is the most missed access detail on a first visit [judgment]"
      source: null
  seasonality:
    busy: "Summer away season, roughly May to October, when winter residents are gone; storm checks spike during the monsoon, June 15 to September 30"
    slow: "December to February, when most part-year owners are home [judgment]"
    source: adwr_monsoon

job_types:
  - id: weekly_house_check
    label: "Regular checks while away (weekly, every two weeks or monthly)"
    bank_job_type: "weekly house check"
    recurring: true
    homeowner_phrasings: ["snowbird house check", "check on my house while we're gone for the summer", "house sitter, nobody staying", "keep an eye on my place", "empty house checks", "revisar mi casa cada semana"]
    must_know:
      - fact: "How often: weekly, every two weeks or monthly"
        bank_question: schedule
        follow_up: null
        photo: null
        why_it_moves_price: "Visit count times the per-visit price is the monthly quote."
        skip_if: "Homeowner already said how often"
      - fact: "Which months the owner is away"
        bank_question: season
        follow_up: null
        photo: null
        why_it_moves_price: "Sets how many months the account runs and whether summer AC items apply. [judgment]"
        skip_if: "Away dates already given"
      - fact: "Home size and any casita or second building"
        bank_question: null
        follow_up: fu_home_size
        photo: p1_home_front
        why_it_moves_price: "Minutes on site per visit, about 20 to 40 for a typical home."
        skip_if: "Size given or the front photo shows it"
      - fact: "What each visit includes"
        bank_question: tasks
        follow_up: null
        photo: p3_thermostat
        why_it_moves_price: "A walk-through with photos is quick; taps, toilets, AC, plants and a fridge add minutes to every visit. [judgment]"
        skip_if: "Homeowner listed the tasks"
      - fact: "Anything already known to need a look"
        bank_question: null
        follow_up: fu_known_problem
        photo: null
        why_it_moves_price: "A known leak or AC fault changes the first visit and goes out as its own trade card. [judgment]"
        skip_if: "Homeowner already described a problem, or said nothing is wrong"
    allowed_follow_ups:
      - id: fu_home_size
        ask_when: "Size of the home not given and no front photo sent"
        text_en: "About how big is the home, counting any casita or guest house?"
        text_es: "¿Más o menos qué tamaño tiene la casa, contando casita o cuarto de huéspedes?"
        options_en: ["Under 1,500 sq ft", "1,500 to 2,500 sq ft", "Over 2,500 sq ft"]
        options_es: ["Menos de 1,500 pies cuadrados", "1,500 a 2,500 pies cuadrados", "Más de 2,500 pies cuadrados"]
        card_field: true
        why: "Size and extra buildings set the minutes on site, the second biggest part of the quote. [src:boston_homewatch]"
      - id: fu_known_problem
        ask_when: "Ongoing checks or an arrival visit, and the homeowner has not said whether anything at the house needs a look"
        text_en: "Is anything at the house already known to need a look, like water on a floor, cooling trouble or storm damage?"
        text_es: "¿Ya sabe de algo en la casa que necesite revisión, como agua en el piso, problemas con el aire o daños por tormenta?"
        options_en: ["Nothing I know of", "Water on a floor or a drip", "Cooling trouble", "Roof or storm damage", "Something else"]
        options_es: ["Nada que yo sepa", "Agua en el piso o un goteo", "Problemas con el aire", "Daño en el techo o por tormenta", "Otra cosa"]
        card_field: true
        why: "A known problem goes out as its own plumbing, hvac or roofing card, and the home watch card notes it so the first visit plans for it. [judgment]"
      - id: fu_pool_service
        ask_when: "Homeowner mentions a pool or spa, or the front photo shows one, and did not say who looks after it"
        text_en: "Is there a pool or spa, and does someone already take care of it?"
        text_es: "¿Hay alberca o jacuzzi, y ya hay alguien que le da servicio?"
        options_en: ["No pool or spa", "Yes, already serviced", "Yes, no service now"]
        options_es: ["No hay alberca ni jacuzzi", "Sí, ya tiene servicio", "Sí, sin servicio ahora"]
        card_field: true
        why: "Pool service while away is a separate pool cleaning card; the home watch card says who handles the pool. [judgment]"
      - id: fu_rent_out
        ask_when: "Homeowner mentions renting, guests, tenants or a property manager"
        text_en: "Will anyone stay in the home or rent it while you are away?"
        text_es: "¿Alguien se va a quedar en la casa o la va a rentar mientras usted no está?"
        options_en: ["No, it stays empty", "Family or friends at times", "Short stays for paying guests", "A long-term renter"]
        options_es: ["No, se queda vacía", "Familia o amigos a veces", "Huéspedes por estancias cortas", "Un inquilino de largo plazo"]
        card_field: true
        why: "Guest stays point to turnover cleaning, and rent or tenant work is never carded. [src:ah_lic_018]"
    photos_priority: [p1_home_front, p3_thermostat, p2_entry_access]
    urgency:
      fire_dept_triggers: ["Neighbor reports a gas or propane smell at the home", "Neighbor reports smoke or fire at the home"]
      urgent_capable_triggers: ["Water on a floor already found and not looked at", "No cooling at the empty home in summer heat"]
      regular: "Checks to start on a set date, nothing known wrong"
    scope_line_en: "Checks every two weeks while the owner is away for the summer: walk-through and photos, run taps and flush toilets, check the AC."
    scope_line_es: "Revisiones cada dos semanas mientras el dueño está fuera en el verano: recorrido y fotos, abrir llaves y jalar inodoros, revisar el aire."
    quote_format: monthly
    business_fills: ["monthly price", "visits per month and what each visit includes", "whether a photo report is sent after each visit", "first visit date", "minimum months, if any"]
    card_template: |
      REQ-<id> | Home watch | <town>, <general area> | <house / manufactured home / condo>
      <one scope line: how often, while away when, main tasks>
      Away: <months or season>. Visits: <weekly / every two weeks / monthly>. Size: <size band, stories, casita or other buildings>.
      Each visit: <tasks>. Cooling: <central AC / evaporative cooler / not said>. Pool or vehicles: <what is on site and who services it>. Pet in home: <none / as said>.
      Access: <someone lets them in / lockbox / smart lock>, code given on the call. Gate pass: <none / owner adds / office issues>. Arranged by: <owner / family for the owner / renter, owner approval not confirmed>.
      Known issues: <none / as reported>. Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>. Needed: <timing answer>.
    never_say: ["Your insurance needs someone there every 30 days.", "Set the AC to 85 while you're gone.", "Shut the water off at the main before you leave.", "Weekly checks run about 150 a month.", "We can find you a renter too."]

  - id: storm_check
    label: "One-time check after a storm or monsoon"
    bank_job_type: "storm check"
    recurring: false
