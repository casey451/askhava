# Ask Hava expert layer: turnover_cleaning (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set turnover_cleaning and trade_kb/trades/house_cleaning.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Mapping. The kb file serves two categories: house_cleaning and this one. Kept here: str_turnover
#   ("turnover clean"). Added with new_job_type: linen_change ("linen change") and restock ("restock"),
#   because the kb has no linen-only or restock-only job type.
# - Left out, because they belong to house_cleaning: recurring (regular cleaning), deep_clean (deep
#   cleaning), move_out (move-out cleaning), post_construction (no catalog job type today; nearest is
#   house_cleaning deep cleaning). specialty_route (sewage, mold, hoarding, biohazard) goes to restoration,
#   which has no category; an active backup goes to plumbing_repair "drain clearing".
# - Refused: rent collection, finding tenants or leasing (LIC-018). In Arizona those acts for another
#   person are real estate broker acts (A.R.S. 32-2101(51)). fu_cleaning_only catches the ambiguous
#   "someone to take care of my Airbnb" request.
# - The bank's how_often question offers "Once", but this category has no one_time_job_types, so a one-off
#   turnover still needs a period on its quote (REC-010). Suggest adding "turnover clean" to
#   one_time_job_types for a "Once" answer, or dropping "Once" and sending one-offs to house_cleaning.
# - Bank photos are [p1, p2, p3] (kitchen, main bath, living area). A turnover estimator also wants the
#   bedrooms (bed count, bunks) and the laundry area. Suggest adding kb photos for "bedrooms" and
#   "washer and dryer" and using them for linen_change.
# - For linen_change the bank's linens question is answered by the job type itself; the AI should skip it.
