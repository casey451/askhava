# Ask Hava expert layer: appliance_repair (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set appliance_repair and trade_kb/trades/appliance_repair.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Mapping. The category's job types are washer, dryer, refrigerator, dishwasher repair. kb ids kept:
#     fridge -> "refrigerator"; washer -> "washer"; dryer -> "dryer" (electric dryers);
#     dishwasher -> "dishwasher repair";
#     range_oven -> "gas appliance repair (gas dryer, range or oven)" (the refused, licensed-only R-63 row).
#       The category has no electric range or oven job type, so electric ranges, wall ovens and cooktops
#       ride on the licensed-only row too. That keeps gas safe but shuts handymen out of electric range
#       work. Suggest adding a "range or oven repair" job type, with gas units staying licensed-only.
#     appliance_install -> "washer" (washer and dryer hookups are the usual install request). A fridge or
#       dishwasher install then reaches only businesses that opted into "washer". Suggest an
#       "appliance install" job type.
# - Added with new_job_type: gas_dryer -> the refused gas appliance row, so a gas dryer never reaches a
#   handyman (A.R.S. 32-1121(D)(2)). Scenario appliance_repair_s10 (gas dryer) expects job_type `dryer`;
#   either the scenario moves to gas_dryer or the intake switches job type on the fu_fuel answer.
# - Left out, with no home in this category:
#     microwave: no category job type. Countertop units are rarely repaired; over-the-range installs
#       touch cabinets and a dedicated circuit.
#     dryer_vent: belongs to the dryer_vent_cleaning category; the misdiagnosis check below routes there.
# - The question set has no gas-or-electric question and no warranty question, and the AI may ask only
#   one follow-up. On a dryer or range the fuel answer decides who may quote, so it should be a bank
#   question (kb q2_fuel), not a follow-up. Warranty (kb q6_warranty) changes who can be paid for the
#   work and is the second-best bank addition.
# - The set's photos are [p1, p2, p3]; p4 (hookups behind: cord, gas line, water line, vent) is in the kb
#   and is the photo that shows gas, vent and install conditions. Suggest adding p4 to the set.
# - Whether a repair-only visit on an existing appliance needs an ROC license is [unverified] (foundation
#   az_license_master.md). This file follows the catalog row (R-63, handyman allowed).
# - Scenario files use bank_job_type strings such as "washer repair" and "range/oven repair" that are not
#   the names in categories.yaml.
# - Refrigerant work needs EPA Section 608 certification (Type I covers small appliances such as home
#   refrigerators). Ask Hava does not check 608 cards; a business attests at sign-up, if anything.
