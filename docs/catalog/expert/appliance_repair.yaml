trade_brief:
  price_drivers:
    - driver: "Gas or electric"
      why: "Any work connecting to natural gas or propane is never handyman work, so a gas dryer or range goes only to licensed businesses; R-63 itself does not cover gas lines."
      source: ars_32_1121
    - driver: "Model and serial number in hand before the visit"
      why: "With the label photo a tech checks parts and stock first and can fix on the first trip; without it, many jobs become a diagnose visit plus a second trip for parts. [judgment]"
      source: null
    - driver: "Sealed refrigeration system versus a fan, control or defrost part (refrigerators)"
      why: "Opening the sealed system needs an EPA 608 certified tech, recovery gear and hours; on an older unit it turns the repair into a repair-or-replace talk. [judgment]"
      source: epa_608_types
    - driver: "Age and brand"
      why: "Over about 10 years, parts get scarce and many owners replace instead; some brands carry pricier boards and longer part waits. [judgment]"
      source: null
    - driver: "Warranty status (maker's warranty, store plan or home warranty)"
      why: "Maker's warranty work must go to the maker's designated service company, so an independent shop may only be able to quote it as a paid visit."
      source: whirlpool_warranty
    - driver: "Access: stacked in a closet, upstairs, built into cabinets, in a hot garage"
      why: "Pulling a stacked pair or a built-in unit can take two techs and more time; a second-floor washer raises the stakes on any water. [judgment]"
      source: null
    - driver: "Error code shown"
      why: "A code narrows the parts list before the visit and shortens the diagnosis. [judgment]"
      source: null
    - driver: "Town and drive time (Lake Havasu City, Bullhead City, Kingman are far apart)"
      why: "Many shops cover one town and add a trip charge for the others. [judgment]"
      source: null
  hidden_conditions:
    - condition: "Water damage already under a dishwasher, fridge or washer (soft subfloor, swollen cabinet base)"
      how_a_pro_spots_it: "Puddle photo, stained or lifted flooring at the toe kick, manufactured home with particle-board floor"
      question_or_photo: p3
      source: null
    - condition: "Old or kinked gas connector, or no shutoff valve, behind a gas dryer or range"
      how_a_pro_spots_it: "Hookups photo shows the flex line and valve; age of the unit"
      question_or_photo: p4
      source: null
    - condition: "Crushed, foil or very long dryer vent behind a dryer that runs but dries slowly"
      how_a_pro_spots_it: "Hookups photo shows the duct; slow drying getting worse over months; vent goes through the roof"
      question_or_photo: fu_vent_cleaned
      source: usfa_dryer
    - condition: "Seized or scaled water valve behind a washer or fridge that will not close or leaks when moved"
      how_a_pro_spots_it: "White crust on the valve in the hookups photo; hard city water"
      question_or_photo: p4
      source: lhc_ccr
    - condition: "Sealed-system fault on a fridge that turns a part swap into a repair-or-replace decision"
      how_a_pro_spots_it: "Both sections warm, unit over 10 years, frost on the freezer back wall in a photo"
      question_or_photo: fu_fridge_symptom
      source: null
    - condition: "Unit still under the maker's warranty, found out at the door"
      how_a_pro_spots_it: "Age under 1 to 2 years, recent purchase mentioned, model label photo"
      question_or_photo: fu_warranty
      source: whirlpool_warranty
    - condition: "Range missing its anti-tip bracket when it is pulled out for service"
      how_a_pro_spots_it: "Hookups photo with the range pulled out; no bracket at the back foot"
      question_or_photo: p4
      source: cpsc_range
    - condition: "The appliance is fine and the circuit or breaker is the fault"
      how_a_pro_spots_it: "Dead unit with a blank display; breaker tripped recently or will not reset"
      question_or_photo: fu_breaker
      source: null
  misdiagnosis_checks:
    - sounds_like: "dryer (runs but clothes stay damp, takes two or three cycles)"
      might_be: "dryer_vent (clogged or long vent run), a different category"
      one_question: fu_vent_cleaned
      if_other_route_to: {category: dryer_vent_cleaning, job_type: "dryer vent cleaning"}
      source: nfpa_dryer
    - sounds_like: "dishwasher repair (water on the floor in front of it)"
      might_be: "sink drain or disposal leak in the cabinet next to it"
      one_question: fu_dw_leak_when
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "dishwasher repair (water left in the bottom)"
      might_be: "kitchen drain clog shared with the sink"
      one_question: fu_sink_drains
      if_other_route_to: {category: plumbing_repair, job_type: "drain clearing"}
      source: null
    - sounds_like: "washer (water on the floor while it drains)"
      might_be: "standpipe or laundry drain backing up"
      one_question: fu_washer_leak_when
      if_other_route_to: {category: plumbing_repair, job_type: "drain clearing"}
      source: null
    - sounds_like: "washer (water on the floor even when it is off)"
      might_be: "supply valve or hose leak at the wall"
      one_question: fu_washer_leak_when
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "dryer, range or oven dead with a blank display"
      might_be: "tripped or failed breaker or circuit"
      one_question: fu_breaker
      if_other_route_to: {category: electrical, job_type: "breaker trips"}
      source: null
    - sounds_like: "appliance_install (hook up a new dryer or range)"
      might_be: "new 240-volt outlet or circuit needed first"
      one_question: fu_existing_hookups
      if_other_route_to: {category: electrical, job_type: "new circuit"}
      source: aac_r4_9_103
    - sounds_like: "dryer (homeowner never says gas)"
      might_be: "gas_dryer, licensed-only work in this category"
      one_question: fu_fuel
      if_other_route_to: {category: appliance_repair, job_type: "gas appliance repair (gas dryer, range or oven)"}
      source: ars_32_1121
  photo_reading:
    - photo_id: p1
      reads: ["Brand, model and serial (serial often encodes the build year)", "Style: top-freezer, side-by-side, French door; top-load or front-load", "Gas or electric from the model letters or label text"]
      neutral_wording: "Model label photo is readable; brand and model number are on the card."
    - photo_id: p2
      reads: ["Exact error code and which lights flash", "Whether the display is lit at all"]
      neutral_wording: "Display shows the code OE with the start light blinking."
    - photo_id: p3
      reads: ["Where the water sits: front, under the door, behind, at the toe kick", "Size of the wet area and flooring type", "Frost or ice on a freezer back wall"]
      neutral_wording: "Water on the tile in front of the dishwasher, about 2 feet across."
    - photo_id: p4
      reads: ["Cord type (3-prong or 4-prong) or hardwired", "Gas flex line, valve and its age", "Water valve crust, braided or rubber hoses", "Vent duct: foil, flexible or rigid metal, crushed or kinked", "Anti-tip bracket on a range"]
      neutral_wording: "Behind the dryer: 4-prong cord, flexible foil vent duct bent at the wall."
  local_factors:
    - fact: "City water hardness averages about 19 grains per gallon, TDS about 753 ppm"
      effect: "Scale builds in dishwasher spray arms and valves, washer inlet screens and ice makers; pros ask about a softener and expect crusted valves"
      source: lhc_ccr
    - fact: "Average highs run 105 to 109 F from June to August"
      effect: "Garage fridges and freezers struggle in summer; makers rate standard and many garage-ready units to 110 F, so where the fridge stands goes on the card"
      source: lhc_climate
    - fact: "GE says not to install a standard refrigerator where the temperature goes above 110 F; garage-ready models are rated to about 110 F"
      effect: "A warm garage fridge in July may be a location question more than a part; the card says garage so the business can plan"
      source: ge_fridge_location
    - fact: "UniSource supplies natural gas in Mohave County; homes outside the gas mains use propane [judgment]"
      effect: "Gas and propane dryers and ranges are common, so the fuel answer decides who may quote"
      source: ues_about
    - fact: "Many manufactured homes, with laundry in hall closets and stacked or compact units [judgment]"
      effect: "Tight access and particle-board floors change labor and water-damage risk"
      source: null
    - fact: "Seasonal residents and vacant second homes; problems found on return in October and November [judgment]"
      effect: "Fridges found warm, ice makers leaking, washers with standing water after months off; cards should say how long the home was empty"
      source: null
    - fact: "Vacation rentals turn over on tight schedules [judgment]"
      effect: "Owners and managers want a dated visit before the next guest; timing answer matters more than usual"
      source: null
  seasonality:
    busy: "June to September (fridges, freezers and ice makers in the heat) and October to December (seasonal residents return, holiday ovens) [judgment]"
    slow: "February to April [judgment]"
    source: null

job_types:
  - id: fridge
    label: "Refrigerator or freezer not cooling, leaking, frosting up, ice maker or water dispenser"
    bank_job_type: "refrigerator"
    recurring: false
    homeowner_phrasings: ["fridge not cold", "freezer works but fridge is warm", "ice maker quit", "water under the fridge", "icebox making noise"]
    must_know:
      - fact: "Which part has the trouble: fridge section, both sections, ice and water, or a leak"
        bank_question: details
        follow_up: fu_fridge_symptom
        photo: p3
        why_it_moves_price: "Fridge-only warm points at fans or defrost parts; both warm can mean the sealed system and an EPA 608 tech; ice and water is a valve or ice-maker part. [judgment]"
        skip_if: "Her words already say which section and what it does"
      - fact: "Brand, model and serial"
        bank_question: brand
        follow_up: null
        photo: p1
        why_it_moves_price: "Lets the business check parts before the visit and fix on the first trip. [judgment]"
        skip_if: "Label photo sent or model typed in"
      - fact: "Age"
        bank_question: age
        follow_up: null
        photo: null
        why_it_moves_price: "Over 10 years shifts many fridge jobs to repair-or-replace. [judgment]"
        skip_if: "Answered"
      - fact: "Where it stands: kitchen, garage, outdoor kitchen"
        bank_question: null
        follow_up: fu_fridge_location
        photo: null
        why_it_moves_price: "A garage unit in summer heat may be running past its rated range, which changes the visit."
        skip_if: "Her words say where it is"
      - fact: "Warranty status"
        bank_question: null
        follow_up: fu_warranty
        photo: null
        why_it_moves_price: "Maker's warranty work goes to the maker's service company; others quote a paid visit."
        skip_if: "Age over 5 years"
    allowed_follow_ups:
      - id: fu_fridge_symptom
        ask_when: "Homeowner says the fridge has a problem without saying which part"
        text_en: "Which fits it: the fridge side is warm but the freezer is cold, both are warm, the ice maker or water stopped, or water is on the floor?"
        text_es: "¿Cuál le queda: el lado del refrigerador está tibio pero el congelador frío, los dos están tibios, el hielo o el agua dejó de salir, o hay agua en el piso?"
        options_en: ["Fridge warm, freezer cold", "Both warm", "Ice maker or water dispenser", "Water on the floor"]
        options_es: ["Refrigerador tibio, congelador frío", "Los dos tibios", "Máquina de hielo o dispensador de agua", "Agua en el piso"]
        card_field: true
        why: "The four answers send a different tech and parts list. [judgment]"
      - id: fu_fridge_location
        ask_when: "Fridge or freezer is not cooling and her words do not say where it stands"
        text_en: "Where does it stand: in the kitchen, in the garage, or outside on a patio?"
        text_es: "¿Dónde está: en la cocina, en la cochera, o afuera en un patio?"
        options_en: ["Kitchen or inside the house", "Garage", "Outside or patio"]
        options_es: ["Cocina o dentro de la casa", "Cochera", "Afuera o en el patio"]
        card_field: true
        why: "Makers rate many units to about 110 F; a Havasu garage passes that in summer."
      - id: fu_warranty
        ask_when: "Appliance is under about 5 years old, or she mentions buying it recently"
        text_en: "Is it still under the maker's warranty, or a store or home warranty plan?"
        text_es: "¿Todavía tiene la garantía del fabricante, o un plan de garantía de la tienda o de la casa?"
        options_en: ["Maker's warranty", "Store or home warranty plan", "No warranty"]
        options_es: ["Garantía del fabricante", "Plan de la tienda o de la casa", "Sin garantía"]
        card_field: true
        why: "Warranty work must go to the maker's designated service company, so businesses need to know before quoting."
    photos_priority: [p1, p3, p2]
    urgency:
      fire_dept_triggers: ["Smoke or burning smell from the fridge or its outlet"]
      urgent_capable_triggers: ["Food inside and the fridge or freezer is warm", "Water spreading on the floor"]
      regular: "Ice maker or dispenser only, food is cold"
    scope_line_en: "Side-by-side fridge, about 8 years old; fresh-food side warm since yesterday, freezer still cold; food inside."
    scope_line_es: "Refrigerador de dos puertas verticales, unos 8 años; el lado de refrigeración está tibio desde ayer, el congelador sigue frío; hay comida adentro."
    quote_format: diagnostic_visit
    business_fills: ["visit fee", "whether the fee comes off the repair", "earliest visit"]
    card_template: |
      REQ-<id> | Appliance repair | <town>, <general area> | <house / condo / manufactured home>
      <one scope line: style, age, which part, since when>
      Refrigerator: <brand>, <model from label or not sent>, <age>. Trouble: <fridge warm / both warm / ice or water / water on floor>.
      Stands in: <kitchen / garage / outside>. Warranty: <maker / store or home plan / none / not said>. Code: <code or none>. Food inside: <yes / no / not said>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["It's probably the compressor.", "Sounds like a refrigerant leak.", "Your food should be fine for a day.", "At that age you should just replace it.", "A defrost fix is cheap."]

  - id: washer
    label: "Washer not draining, not spinning, leaking, won't start, loud"
    bank_job_type: "washer"
    recurring: false
    homeowner_phrasings: ["washer won't drain", "water stuck in the drum", "washer won't spin", "washer leaking", "washer walks across the floor"]
    must_know:
      - fact: "What it does and whether water is standing in the drum"
        bank_question: details
        follow_up: null
        photo: p2
        why_it_moves_price: "Standing water means the tech brings a way to drain it before working; a leak, a no-spin and a dead unit are different visits. [judgment]"
        skip_if: "Her words say it"
      - fact: "When water shows on the floor: filling, draining, or even when off"
        bank_question: null
        follow_up: fu_washer_leak_when
        photo: p3
        why_it_moves_price: "Water while draining or when off can be the drain or the wall valve, plumbing work and not the washer. [judgment]"
        skip_if: "No leak mentioned"
      - fact: "Top-load, front-load or stacked"
        bank_question: null
        follow_up: fu_washer_type
        photo: p1
        why_it_moves_price: "A stacked pair in a closet may need two techs to pull; front-loads have door seals and pumps reached from the front. [judgment]"
        skip_if: "Label photo or her words show the type"
      - fact: "Where it sits: garage, main-floor closet or upstairs"
        bank_question: null
        follow_up: fu_laundry_location
        photo: null
        why_it_moves_price: "Upstairs over a finished room and tight closets add time and care. [judgment]"
        skip_if: "Her words say where"
      - fact: "Error code and brand"
        bank_question: error_code
        follow_up: null
        photo: p2
        why_it_moves_price: "A code plus the model narrows parts before the trip. [judgment]"
        skip_if: "Code photo sent"
    allowed_follow_ups:
