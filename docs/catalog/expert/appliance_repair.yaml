  signup_objections:
    - objection: "My diagnostic fee is the only sure money on a call. Why give you some of it?"
      answer: "You keep your diagnostic fee. The $25 introduction fee is charged only when a homeowner picks your quote and you confirm. Nothing to join and nothing monthly."
    - objection: "Most of these will be people who want a price over the phone."
      answer: "Every card has the appliance, brand, age, what it does and photos when she has them. You quote your visit fee in your own words, and she picks knowing that."
    - objection: "Half my calls turn out to be under warranty and I can't bill the maker."
      answer: "When the homeowner says it is under warranty, the card says so before you quote. You decide whether to quote it."
    - objection: "I don't do gas work."
      answer: "You pick your job types at sign-up and can change them any time. Gas dryers and ranges are sent only to licensed businesses that chose them."
    - objection: "What if I quote, drive out, and she decides to buy a new one instead?"
      answer: "Your visit fee is yours to set and collect. The introduction fee is the same either way, and it is refunded if she cancels before you have spoken."
    - objection: "Will you rank me against other shops?"
      answer: "No. The homeowner sees every quote in the order it came in, with each business's name, license number and review links. Ask Hava never sorts, rates or scores a business."
    - objection: "I'm a one-man shop and can't take every card."
      answer: "Quote only the cards you want. Skipping a card costs nothing."
    - objection: "Do I need an ROC license to get cards?"
      answer: "Cards go to businesses whose license or exemption covers the job. Gas appliance work always needs a license; you list your license numbers at sign-up and the homeowner sees them."
  quote_tips_for_card: ["Say what the visit fee covers and whether it comes off the repair", "Give your earliest day", "Say if you carry parts for this brand", "Say if you do warranty work for this maker", "If you need the model label first, say so"]
