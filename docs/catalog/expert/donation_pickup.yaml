# Ask Hava expert layer: donation_pickup (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set donation_pickup and trade_kb/trades/junk_removal.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - The junk_removal kb file serves three categories: donation_pickup (this file), estate_cleanout and the
#   disabled junk_removal category. Only kb job type furniture_items maps here, to "furniture donation pickup".
# - Left out on purpose: cleanout (estate_cleanout "whole-house cleanout"); yard_debris, construction_debris and
#   hazmat_route (junk haul-away, and the junk_removal category is off until the city-code check, LIC-005);
#   demo_small (tear-down is junk work or licensed R-57, R-11 or R-37 work). appliances is also left out as a
#   job type: a working fridge, washer or dryer given away is carried inside furniture_items through fu_hookups
#   and photo p2, and a dead appliance to the scrap yard is junk haul-away. If Casey wants working-appliance
#   donations as their own job type, add one with new_job_type: true.
# - No new_job_type added. "Sorting for donation" is an estate_cleanout job type; a request to sort a house is
#   routed there by the misdiagnosis check on the bank's items answer ("More than a room").
# - A request to haul to the dump, or one where nothing is usable, routes to junk_removal "junk haul-away".
#   Because that category is disabled, the homeowner gets the plain no-coverage reply (INT-017), not a card.
# - Bank gaps: no condition question (the top hidden condition: a charity turning pieces away), the stairs
#   question has no floor or elevator option, and where_to does not separate a charity from a person's home.
#   fu_condition and fu_destination cover the first and last; a bank condition question would be stronger.
# - Charity pickup rules cited here come from Habitat for Humanity's national page and one regional affiliate
#   (Los Angeles), not from a Lake Havasu City store. Local charity pickup rules are unverified.
schema: 1
category: donation_pickup
question_set: donation_pickup
kb_trade: junk_removal
as_of: "2026-10-29"
