trade_brief:
  price_drivers:
    - driver: "What has to come out first and what is under it: bare dirt, rock, grass, old concrete, or a hard caliche layer"
      why: "Demolition, haul-off and digging through lime-cemented caliche can match the cost of the pavers; the pro reads it off the whole-area photo and fu_surface_now. Caliche runs a few inches to several feet thick."
      source: ua_caliche
    - driver: "Access: machine through a gate or the street, or wheelbarrow only"
      why: "A skid steer or mini-ex through a wide gate moves base in hours; hand-carrying tons of base and pavers through a narrow side gate adds days of labor. The bank's access question and the street-path photo carry it. [judgment]"
      source: null
    - driver: "Square footage and shape (straight edges versus curves, steps and many cuts)"
      why: "Labor and material scale with area; curves, borders and steps add cutting time. The bank's size question sets the band. [judgment]"
      source: null
    - driver: "Material: concrete pavers, travertine, flagstone, or gravel and decomposed granite"
      why: "Material cost spreads several times over from gravel to travertine, and natural stone sets slower. The bank has no material question, so fu_material or the inspiration pictures carry it. [judgment]"
      source: null
    - driver: "What drives or parks on it: foot traffic, cars, or an RV, boat or trailer"
      why: "Pavers for a patio or walk sit on 4 to 6 inches of compacted base; a driveway needs thicker pavers on 8 to 12 inches, more where soil or drainage is poor."
      source: nicolock_thickness
    - driver: "Grade and where water goes: slope toward the house, water standing at a door, downspouts onto the area"
      why: "Regrading, a drain or a raised base to move water away from the house is extra work the pro has to see coming; fu_water_goes and the drainage photo surface it. [judgment]"
      source: null
    - driver: "Extras built with it: seat walls, retaining walls, steps, fire pits, borders"
      why: "Each is its own line item; any gas, electric or plumbing for a fire pit or kitchen must be subcontracted under R-21, and a retaining wall over 2 ft 6 in with slope needs a city permit."
      source: s2_aac_r4_9_103
    - driver: "For irrigation: how much yard, how many zones, and whether a backflow device and controller are new"
      why: "Zone count drives valves, wire and trenching; a new potable connection needs an approved backflow device under the plumbing code. fu_yard_area and fu_controller carry it."
      source: icc_backflow
  hidden_conditions:
    - condition: "Caliche a few inches down that a shovel will not go through"
      how_a_pro_spots_it: "Whitish crusty ground in the whole-area photo; the homeowner says a shovel or pick bounced off"
      question_or_photo: fu_surface_now
      source: ua_caliche
    - condition: "Yard slopes toward the house and water stands at the slider or stucco after rain"
      how_a_pro_spots_it: "Stain line low on the stucco, ground lower at the wall, puddles in the drainage photo"
      question_or_photo: fu_water_goes
      source: null
    - condition: "Buried lines in the footprint: sprinkler or drip lines, a valve box, a water meter, a propane tank lid or gas line"
      how_a_pro_spots_it: "Valve box lids, sprinkler heads, a meter box or tank lid in the whole-area photo; any digging needs an Arizona 811 ticket first"
      question_or_photo: fu_in_the_area
      source: s24_az811
    - condition: "A downspout, sprinkler zone or pool splash-out emptying onto the sunken or lifted pavers"
      how_a_pro_spots_it: "Downspout elbow or corrugated pipe ending at the low spot; wet edges; low spot next to the pool coping"
      question_or_photo: fu_water_at_spot
      source: null
    - condition: "A pool losing water under a sunken pool-side paver area"
      how_a_pro_spots_it: "Sinking right along the coping with no downspout nearby; the homeowner adds water to the pool more often"
      question_or_photo: fu_pool_losing
      source: null
    - condition: "Driveway widening that reaches the city strip by the street"
      how_a_pro_spots_it: "No visible property line in the photo; work at the curb; the city has a driveway permit and an encroachment agreement for driveway pavers in city right-of-way"
      question_or_photo: fu_property_line
      source: lhc_building_forms
    - condition: "A wall that holds back soil and is taller than it looks"
      how_a_pro_spots_it: "Grade change across the wall line in the photo; the city requires a permit over 2 ft 6 in with slope or 3 ft with none, and R-21 stops at 3 ft"
      question_or_photo: fu_wall_what
      source: s17_lhc_permit_list
    - condition: "An old irrigation tie-in with no backflow device or a cracked, sun-faded valve manifold"
      how_a_pro_spots_it: "Gray or white PVC above ground near the hose bib, no vacuum breaker; the homeowner says the system is old"
      question_or_photo: fu_irrigation_scope
      source: icc_backflow
  misdiagnosis_checks:
    - sounds_like: "paver patio (with a fire pit)"
      might_be: "gas line work for a gas or propane fire pit, licensed-only work in plumbing_repair"
      one_question: fu_fire_fuel
      if_other_route_to: {category: plumbing_repair, job_type: "gas line work"}
      source: s2_aac_r4_9_103
    - sounds_like: "paver patio (sunken pavers by the pool)"
      might_be: "a pool leak under the deck"
      one_question: fu_pool_losing
      if_other_route_to: {category: pool_repair, job_type: "pool leak"}
      source: null
    - sounds_like: "paver patio (sunken pavers in the yard)"
      might_be: "a broken sprinkler or drip line washing out the base"
      one_question: fu_water_at_spot
      if_other_route_to: {category: pavers_hardscape, job_type: "irrigation install"}
      source: null
    - sounds_like: "irrigation install (patio cooling)"
      might_be: "a misting system, which the catalog routes to water_treatment"
      one_question: fu_irrigation_what
      if_other_route_to: {category: water_treatment, job_type: "misting system"}
      source: null
    - sounds_like: "walkway (cracked concrete)"
      might_be: "a concrete driveway, which R-21 excludes"
      one_question: fu_concrete_where
      if_other_route_to: {category: pavers_hardscape, job_type: "walkway"}
      source: s2_aac_r4_9_103
    - sounds_like: "irrigation install"
      might_be: "drip_repair: a repair of an existing system, with no repair job type in the catalog"
      one_question: fu_irrigation_scope
      if_other_route_to: {category: pavers_hardscape, job_type: "irrigation install"}
      source: null
  photo_reading:
    - photo_id: p1
      reads: ["Bare dirt, rock, grass or old concrete now", "Whitish crusty ground", "Slope toward the house", "Sprinkler heads, valve box lids, meter or tank lid in the area", "Trees and roots near the edge", "Existing hose bib or irrigation manifold"]
      neutral_wording: "Bare packed dirt with a whitish crust, ground lower near the house wall, two sprinkler heads in the area."
    - photo_id: p2
      reads: ["Depth of the dip against a shoe or coin", "Joint sand missing", "One side of a crack higher than the other", "Broken or chipped pavers"]
      neutral_wording: "Pavers dipped about two inches over a three-foot area next to a shoe; joint sand missing at the dip."
    - photo_id: p3
      reads: ["Gate width and whether it opens fully", "Steps, slope or a pool in the way", "Distance to the street", "Overhead wires"]
      neutral_wording: "Side gate about 4 feet wide with a step down into the back yard."
    - photo_id: p4
      reads: ["Downspout outlets", "Puddles or stain lines", "Which way the ground falls"]
      neutral_wording: "Roof downspout ends at the low corner of the patio; dirt stain line on the stucco about two inches up."
    - photo_id: p5
      reads: ["Pool coping and equipment pad", "Block wall footing", "House foundation edge and weep screed"]
      neutral_wording: "Pavers meet the pool coping; pool equipment pad about 10 feet away."
  local_factors:
    - fact: "Caliche, a lime-cemented soil layer from a few inches to several feet thick, is common in Arizona desert soils and slows water movement"
      effect: "Digging for base and trenching for irrigation can take far longer than the size suggests, and water can pond on it; pros ask what is under the surface"
      source: ua_caliche
    - fact: "By law, Arizona 811 must be contacted before digging, and locators have two working days to mark lines"
      effect: "Patio and irrigation start dates sit at least two working days out; buried lines in the footprint change the dig plan"
      source: ars_40_360_22
    - fact: "The city requires a permit for retaining walls over 2 ft 6 in with slope or over 3 ft with no slope, and for patio covers and gas lines; privacy walls up to 6 ft need none"
      effect: "Hillside lots with terraces and requests for a pergola or gas fire pit carry permit time and other trades; the card notes height and extras as facts"
      source: s17_lhc_permit_list
    - fact: "Lake Havasu City has a residential driveway permit, and an encroachment agreement for driveway pavers and stamped concrete in city right-of-way"
      effect: "Driveway widening toward the curb carries permit time and paperwork; the card notes whether the work reaches the street strip"
      source: lhc_building_forms
    - fact: "60 to 70 percent of the community's water use goes to landscape irrigation and pools"
      effect: "Most yards are rock and desert plants on drip; new systems are mostly drip zones, with some lawn spray zones [judgment]"
      source: lhc_conservation
    - fact: "City water hardness averages about 19 grains per gallon"
      effect: "White scale clogs drip emitters and stains pavers near spray heads and pools; pros ask about filters and emitter type [judgment]"
      source: lhc_ccr
    - fact: "Monsoon season runs June 15 to September 30"
      effect: "Storm runoff washes out paver base near downspouts, washes and pool edges, so repair requests spike after storms [judgment]"
      source: nws_monsoon
    - fact: "Drip zones run through a pressure-regulating filter, about 30 psi on common kits"
      effect: "A drip zone tied into house pressure without one is a redo item the pro wants to see"
      source: rainbird_drip_zone
    - fact: "Summer heat limits crews to early mornings, and HOAs in planned neighborhoods review front-yard changes"
      effect: "Summer jobs run longer on the calendar; an HOA front yard adds approval time before work starts [judgment]"
      source: null
    - fact: "Seasonal residents and vacant second homes"
      effect: "Owners often want work done while away; gate codes and water access must be arranged [judgment]"
      source: null
  seasonality:
    busy: "October to May for new patios, walkways and irrigation installs (cool weather, seasonal residents back); repair calls after June 15 to September 30 monsoon storms [judgment on the months outside the monsoon dates]"
    slow: "June to August for new installs because of heat [judgment]"
    source: nws_monsoon

job_types:
  - id: new_patio_walk
    label: "New paver, stone or gravel patio (back yard, side yard, courtyard, patio extension)"
    bank_job_type: "paver patio"
    recurring: false
    homeowner_phrasings: ["want pavers in the back yard", "extend my patio", "cobblestone patio", "travertine patio", "ripped out the grass, want pavers"]
    must_know:
      - fact: "What is on the ground now and what has to come out"
        bank_question: null
        follow_up: fu_surface_now
        photo: p1
        why_it_moves_price: "Removing old concrete, rock or grass and digging hard ground can match the cost of the pavers. [judgment]"
        skip_if: "Whole-area photo or her words show it"
      - fact: "Size and access"
        bank_question: size
        follow_up: null
        photo: p3
        why_it_moves_price: "Area sets material; a narrow gate turns machine work into hand work. [judgment]"
        skip_if: "Answered"
      - fact: "Material and look wanted"
        bank_question: project
        follow_up: fu_material
        photo: null
        why_it_moves_price: "Concrete pavers, travertine and gravel are different price bands. [judgment]"
        skip_if: "Inspiration pictures or her words name the material"
      - fact: "Where rain water goes in that spot"
        bank_question: null
        follow_up: fu_water_goes
        photo: p4
        why_it_moves_price: "Slope toward the house means grading or a drain before any pavers go down. [judgment]"
        skip_if: "Drainage photo sent and it shows the fall"
      - fact: "Lines, boxes or a tank lid inside the area"
        bank_question: null
        follow_up: fu_in_the_area
        photo: p1
        why_it_moves_price: "Sprinkler lines must be capped or moved and gas or meter boxes change the layout. [judgment]"
        skip_if: "Photo shows the area clear"
    allowed_follow_ups:
      - id: fu_surface_now
        ask_when: "New patio, walkway or wall and the homeowner did not say what is there now"
        text_en: "What is on the ground there now?"
        text_es: "¿Qué hay ahora en el suelo de esa área?"
        options_en: ["Bare dirt", "Rock or gravel", "Grass", "Old concrete or pavers", "Very hard ground a shovel won't go into"]
        options_es: ["Tierra sola", "Piedra o grava", "Pasto", "Concreto o adoquín viejo", "Suelo muy duro donde no entra la pala"]
        card_field: true
        why: "Removal and hard digging are the biggest unseen cost on a new patio. [judgment]"
      - id: fu_material
        ask_when: "No inspiration pictures and the homeowner did not name a material"
        text_en: "What material do you have in mind?"
        text_es: "¿Qué material tiene en mente?"
        options_en: ["Concrete pavers", "Travertine or natural stone", "Flagstone", "Gravel or decomposed granite", "Want to see options"]
        options_es: ["Adoquín de concreto", "Travertino o piedra natural", "Laja", "Grava o granito descompuesto", "Quiero ver opciones"]
        card_field: true
        why: "Material is the second number an estimator writes down after square feet. [judgment]"
      - id: fu_water_goes
        ask_when: "New hardscape next to the house, or the homeowner mentions slope or puddles"
        text_en: "When it rains, where does the water go in that spot?"
        text_es: "Cuando llueve, ¿a dónde se va el agua en esa área?"
        options_en: ["Runs away from the house", "Runs toward the house or a door", "Stands in puddles", "A downspout empties there"]
        options_es: ["Se va lejos de la casa", "Corre hacia la casa o una puerta", "Se queda en charcos", "Ahí cae una bajada de agua del techo"]
        card_field: true
        why: "Water toward the house means grading or a drain, priced before any pavers. [judgment]"
      - id: fu_in_the_area
        ask_when: "New hardscape and the photo does not show the whole area clearly"
        text_en: "Is anything in the spot now, like sprinkler lines, a valve box, a meter, a tank lid or a tree?"
        text_es: "¿Hay algo ahora en esa área, como líneas de riego, una caja de válvulas, un medidor, la tapa de un tanque o un árbol?"
        options_en: ["Sprinkler or drip lines", "A meter, valve box or tank lid", "A tree or large plant", "Nothing I know of"]
        options_es: ["Líneas de riego o goteo", "Un medidor, caja de válvulas o tapa de tanque", "Un árbol o una planta grande", "Nada que yo sepa"]
        card_field: true
        why: "Buried lines and lids change the layout and the dig plan. [judgment]"
    photos_priority: [p1, p4, p3]
    urgency:
      fire_dept_triggers: ["Gas or propane smell or hiss in the yard", "Downed power line in the yard"]
      urgent_capable_triggers: ["Water spraying from a broken line in the work area"]
      regular: "Any new patio"
    scope_line_en: "New concrete paver patio about 14 by 18 feet off the back slider, bare dirt now, side gate about 4 feet wide."
    scope_line_es: "Patio nuevo de adoquín de concreto de unos 14 por 18 pies junto a la puerta corrediza de atrás, ahora es tierra, portón lateral de unos 4 pies."
