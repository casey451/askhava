  what_they_dislike_about_lead_services: ["Same request sold to four other crews", "People who only want a price per square foot over the phone", "Driving out to measure a job that was never real", "Monthly fees whether or not jobs come", "Requests for work outside their license, like gas lines or concrete driveways"]
  what_makes_a_lead_worth_paying_for: ["Size, access and what is on the ground now, stated up front", "A whole-area photo and the gate width", "Material and look, with her own pictures", "Timing stated, so they can fit it before summer heat", "The homeowner already picked them, and they pay only then"]
  their_words: ["base", "ABC", "compaction", "plate compactor", "bedding sand", "polymeric sand", "edge restraint", "soldier course", "cuts", "herringbone", "travertine", "flagstone", "DG", "caliche", "skid steer", "mini-ex", "sleeve", "drip zone", "manifold", "PVB", "anti-siphon valve", "emitter", "half-inch poly", "controller"]
  signup_objections:
    - objection: "I can't price a patio from a text. I have to see it."
      answer: "You don't give a final price. You quote a low and high range and say what puts it at the high end. Most cards come with size, gate width, what is on the ground now and photos, so you can tell whether it is worth a visit."
    - objection: "Why pay up to $199 for a patio job?"
      answer: "The fee is set by job size: $25, $75 or $199. You pay it only when the homeowner picks your quote and you confirm. Nothing to join and nothing monthly."
    - objection: "Is this the same request sent to every crew in town?"
      answer: "It goes to the local businesses whose license covers the work and who chose that job type. She sees each quote in the order it came in and picks one. Only the business she picks pays, and only that business gets her contact details."
    - objection: "Will you rank me against other crews?"
      answer: "No. Ask Hava never sorts, rates or scores a business. Each quote shows the business's own words, license numbers and review links."
    - objection: "I only do pavers, not irrigation."
      answer: "You pick the job types you want at sign-up and can change them any time. You get cards only for those."
    - objection: "Homeowners send Pinterest pictures of things that can't be built here."
      answer: "Her pictures are marked as the look she wants, not her yard. Any concept image is labeled AI-generated, not exact, may not be feasible. Quote from her photos and answers, and say in your quote what you would change."
    - objection: "What if she cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Half these jobs turn into gas lines and electrical I can't do."
      answer: "The card lists any gas, power or wall she asked for as her words, so you can quote your part and say what others would need to do."
  quote_tips_for_card: ["Give a low and high range and say what moves it to the high end", "Say whether haul-off of old concrete, rock or grass is included", "Say what base depth and material the range assumes", "Name any part you would leave to another trade, like a gas line or outlet", "Give your earliest start and how many working days the job takes"]
