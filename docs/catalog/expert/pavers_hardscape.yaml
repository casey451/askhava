      - fact: "New, added, redone, or a fix"
        bank_question: project
        follow_up: fu_irrigation_scope
        photo: p1
        why_it_moves_price: "A new system needs a tie-in, backflow device, valves and controller; adding a zone uses what is there. [judgment]"
        skip_if: "Her words say which"
      - fact: "Which parts of the yard"
        bank_question: size
        follow_up: fu_yard_area
        photo: p1
        why_it_moves_price: "Front, back or both sets zone count, trenching and valves; square feet is a weak proxy for a yard. [judgment]"
        skip_if: "She named the area"
      - fact: "What it will water"
        bank_question: null
        follow_up: fu_irrigation_what
        photo: p1
        why_it_moves_price: "Drip for desert plants and spray zones for a lawn are different parts lists; misters are a different trade in this catalog. [judgment]"
        skip_if: "Her words say which"
      - fact: "Whether a working controller is there"
        bank_question: null
        follow_up: fu_controller
        photo: null
        why_it_moves_price: "A new controller and wire runs add a line item. [judgment]"
        skip_if: "New system with no existing parts"
    allowed_follow_ups:
      - id: fu_irrigation_scope
        ask_when: "Any watering-system request that does not say new, added or fix"
        text_en: "Is this a new system, adding to the one you have, redoing an old one, or fixing what's there?"
        text_es: "¿Es un sistema nuevo, agregar al que ya tiene, rehacer uno viejo, o arreglar lo que hay?"
        options_en: ["Brand new system", "Add zones or lines", "Redo an old system", "Fix what's there"]
        options_es: ["Sistema nuevo", "Agregar zonas o líneas", "Rehacer un sistema viejo", "Arreglar lo que hay"]
        card_field: true
        why: "Install, add-on, redo and repair are four different quotes; the answer keeps a repair from being sold as a new system. [judgment]"
      - id: fu_yard_area
        ask_when: "Irrigation request with no area named"
        text_en: "Which parts of the yard would it cover?"
        text_es: "¿Qué partes de la yarda cubriría?"
        options_en: ["One bed or strip", "Front yard", "Back yard", "Front and back"]
        options_es: ["Una jardinera o franja", "Yarda de enfrente", "Yarda de atrás", "Enfrente y atrás"]
        card_field: true
        why: "Area is how irrigation crews size zones and trenching. [judgment]"
      - id: fu_irrigation_what
        ask_when: "Irrigation request that does not say what it is for"
        text_en: "What is it for?"
        text_es: "¿Para qué es?"
        options_en: ["Desert plants and trees", "A lawn", "Pots, planters or a garden bed", "A mix of these", "Patio misters"]
        options_es: ["Plantas del desierto y árboles", "Pasto", "Macetas, jardineras o un huerto", "Una mezcla", "Nebulizadores para el patio"]
        card_field: true
        why: "Drip versus spray sets the parts list; patio misters route to water_treatment. [judgment]"
      - id: fu_controller
        ask_when: "Add-on, redo or fix, and the controller is not mentioned"
        text_en: "Is there a timer or controller now, and does it work?"
        text_es: "¿Hay un timer o controlador ahora, y funciona?"
        options_en: ["Yes, it works", "Yes, but the screen is blank or it won't run", "No timer now"]
        options_es: ["Sí, funciona", "Sí, pero la pantalla está apagada o no corre", "No hay timer"]
        card_field: true
        why: "A dead or missing controller is its own line item. [judgment]"
    photos_priority: [p1]
    urgency:
      fire_dept_triggers: ["Gas or propane smell or hiss in the yard"]
      urgent_capable_triggers: ["Water spraying from a line that won't shut off"]
      regular: "Any install, add-on or redo"
    scope_line_en: "New drip system for the front yard, desert plants and two trees, no system there now, hose bib on the garage wall."
    scope_line_es: "Sistema de goteo nuevo para la yarda de enfrente, plantas del desierto y dos árboles, no hay sistema ahora, llave de manguera en la pared de la cochera."
    quote_format: range
    business_fills: ["low and high end of the range", "what puts it at the high end (zones, controller, backflow device, trenching)", "earliest start"]
    card_template: |
      REQ-<id> | Pavers and hardscape: irrigation | <town>, <general area> | <kind of place>
      <one scope line: new, add, redo or fix; what it waters; which yard>
      Scope: <brand new / add zones / redo / fix what's there>. Covers: <one bed / front / back / front and back>. For: <desert plants / lawn / pots / mix / misters>.
      Controller now: <works / blank or won't run / none>. What she sees: <her words on broken parts, scrubbed>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Your timer is bad.", "Drip is the way to go in the desert.", "You need a backflow preventer by code.", "A front-yard drip system runs about a thousand."]

business_side:
  how_they_get_customers: ["Google Maps listing, reviews and photo galleries of past patios", "Word of mouth, repeat customers and neighbors who see the job", "Yard signs during the job and truck lettering [judgment]", "Referrals from paver and stone yards, pool builders and realtors [judgment]", "Google Local Services Ads and search ads", "Angi, Thumbtack and similar sites", "Local Facebook groups [judgment]"]
