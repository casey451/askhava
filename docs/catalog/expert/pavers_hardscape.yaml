# Ask Hava expert layer: pavers_hardscape (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set pavers_hardscape and trade_kb/trades/pavers_concrete.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - Mapping. The category routes only R-21 work (A.A.C. R4-9-103: uncovered patios, walkways and driveways
#   of brick, stone, pavers or gravel; non-loadbearing concrete; garden walls to 6 ft; retaining walls to
#   3 ft; freestanding fire pits; irrigation and backflow devices). Kept from pavers_concrete.yaml:
#     new_patio_walk -> "paver patio" (patios only; walkways get their own id below)
#     paver_repair   -> "paver patio" (sunk, lifted or loose pavers; re-sand and re-seal)
#     driveway       -> "paver patio" (paver or gravel driveway work only; see below)
#     garden_wall    -> "paver patio" (seat walls, short garden and retaining walls, fire pits)
#     pool_deck      -> "paver patio" (pavers or travertine around a pool only; see below)
#     crack_repair   -> "walkway" (cracked or lifted concrete walkways and patios; non-loadbearing concrete)
# - new_job_type new_walkway ("walkway"): the kb's new_patio_walk covers patios and walkways in one id, but
#   each kb id may appear once and the category routes both job types. Scenarios pavers_hardscape_s05,
#   s06 and s13 name job_type new_patio_walk with bank_job_type "walkway"; routing should read new_walkway
#   for those. Scenario s04 names paver_repair with bank "walkway"; here paver_repair carries "paver patio".
#   Suggest a "paver repair" category job type so repair cards are not opted into with new-patio work.
# - new_job_type irrigation_install ("irrigation install"): the kb file has no irrigation job type. Questions
#   and must-knows draw on landscaping_irrigation.yaml's new_system entry; photos use only pavers_concrete.yaml
#   ids (p1 whole area). The bank's photos [p1, p2, p3] do not fit irrigation (p2 is a crack close-up, p3 the
#   street path); the landscaping_irrigation photos (controller p2, valve box p3, backflow p5) would serve it
#   far better if the set could draw on two kb files.
# - Irrigation REPAIR has no catalog home. landscape_maintenance routes watering problems here as the closest
#   fit, and scenario s14 expects the card to keep "repair" and "drip". This file lets irrigation_install take
#   "fix what's there" as a fu_irrigation_scope answer so the card says repair honestly. Suggest an
#   "irrigation repair" job type in this category.
# - Left out, with no R-21 home:
#     slab_pad: concrete slabs and RV or shed pads are R-9 concrete work in the kb's license_classes. A paver or
#       gravel pad rides on driveway. No enabled category takes R-9 work.
#     coating_stain: stamped, stained or coated concrete is concrete or painting work, and R-21 excludes pool
#       deck coatings. Paver re-sand and re-seal is kept inside paver_repair (the kb label includes it).
#     demo_remove: stand-alone concrete removal is R-9 in the kb. Removal before new pavers is caught by
#       fu_surface_now and goes on the patio or walkway card.
# - Concrete driveways are excluded from R-21. driveway here is pavers or gravel only; fu_driveway_now puts the
#   material on the card. A concrete driveway or concrete driveway crack has no route today.
# - pool_deck: R-21 covers uncovered paver patios but excludes "pool deck coatings". A Kool Deck or coating
#   request has no home; fu_deck_now puts the surface on the card so a business can decline cleanly.
# - Bank gaps: (1) no material question (concrete pavers, travertine, flagstone, gravel), the second-biggest
#   price driver; fu_material carries it. (2) size is in square feet, which homeowners guess poorly for paths
#   and yards; fu_walk_length and fu_yard_area carry better proxies. (3) access option "No hand access only"
#   reads oddly; suggest "No, hand access only" and a third option "Only through a narrow side gate".
#   (4) Suggest photos [p1, p4, p3] for new work: where water drains moves a patio quote more than a crack
#   close-up.
# - fire_dept_triggers here are only gas or propane smell or hiss, and a downed power line, from the D-436 list.
#   A hole or collapse under pavers (kb emergency signal) is urgent-capable for businesses, never a 911 text.
