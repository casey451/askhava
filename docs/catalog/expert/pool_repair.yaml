  what_they_dislike_about_lead_services: ["Paying for a lead that several other pool companies also bought", "Price shoppers who want a pump price over the phone", "Weekly cleaning requests sent as repair jobs", "Monthly fees whether or not jobs come", "No brand or model, so they drive out blind"]
  what_makes_a_lead_worth_paying_for: ["Pad photo and motor label before the first call", "Brand, model and error code on the card", "Fix or replace already asked", "Water condition stated, so they know whether a green-to-clean comes with it", "Pay only when picked, nothing monthly"]
  their_words: ["equipment pad", "capacitor", "shaft seal", "lid o-ring", "prime", "VS pump", "multiport", "grids", "laterals", "cell", "check cell", "flow switch", "pressure test", "dye test", "bonding", "first disconnect", "green-to-clean"]
  signup_objections:
    - objection: "My route customers already call me. Why pay $25?"
      answer: "You pay only when a homeowner who isn't already yours picks your quote. Nothing to join, nothing per month. The fee is set by job size: $25, $75 or $199."
    - objection: "I can't quote a pump without seeing it."
      answer: "You don't have to. Quote a visit fee and say what it covers. Most cards come with a pad photo, the motor label and what the pump is doing."
    - objection: "Will I get weekly cleaning requests?"
      answer: "Only if you sign up for weekly cleaning too. Repair cards go only to businesses that picked repair job types, and you choose those at sign-up."
    - objection: "I'm R-6. Will I get gas heater jobs I can't do?"
      answer: "No. Gas heater cards go only to license classes that cover gas heater work. You see the job types your license covers, and you pick which ones you want."
    - objection: "I'm not licensed. Can I join?"
      answer: "Yes, for repair jobs under $1,000 total that need no permit and have no gas work. Your quote has to stay inside that limit, and your ads must say you are not a licensed contractor."
    - objection: "Will you rank me against other pool companies?"
      answer: "No. The homeowner sees every quote in the order it came in. Ask Hava never sorts, rates or scores a business."
    - objection: "What if I quote and don't get the job?"
      answer: "Then you pay nothing. The fee is charged only when a homeowner picks your quote and you confirm."
    - objection: "What if the homeowner cancels after I pay?"
      answer: "If you haven't spoken with the homeowner yet, the fee is refunded."
    - objection: "Half these calls are from people out of town."
      answer: "The card says when it's needed and what the homeowner told us. Many seasonal owners text from out of town, and you get their contact details once they pick you."
  quote_tips_for_card: ["Say what the visit fee covers and whether it comes off the repair", "For a replacement, name the brand and model you would install", "Say if wiring or replumbing could change the price", "Give your earliest arrival", "If you need a photo of the motor label or gauge, say which"]
