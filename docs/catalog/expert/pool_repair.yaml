# Ask Hava expert layer: pool_repair (schema 1, docs/catalog/expert/schema.yaml).
# Extends question set pool_repair and trade_kb/trades/pool_spa_repair.yaml. Fake data only.
# Ask Hava never diagnoses, prices, judges safety or recommends a business; every string here keeps that.
#
# NOTES FOR REVIEW
# - kb job type surface_tile (calcium on the tile line, rough plaster, loose tile, replaster) is left out:
#   none of the category's job types (pump repair, filter repair, pool leak, equipment replacement) fits,
#   and full replaster is outside R-6 (R-36 or B-5/B-6 work). Casey may add a "surface or tile" job type
#   or a separate category; until then the intake has no route for it.
# - The category's four job types are coarse. Heat pump, automation and lights, and stand-alone hot tub
#   requests are mapped to "pump repair" (diagnostic visit); salt system and drain cover requests to
#   "equipment replacement" (range). A fifth job type, "equipment repair", would fit them better.
# - heat_pump is a new_job_type split out of the kb's heater: gas heaters are licensed-only work
#   ("gas pool heater", B-6 per license_map.yaml), while an electric heat pump has no gas line. Keeping
#   them together would send every heat pump card to B-6 holders only.
# - The kb's safety steps (shock or tingle in the water, broken drain cover, chemical fumes) are not used
#   (D-436). A shock or tingle in the water is not on the fire-truck list, so it gets no 911 text here;
#   it is listed only as a plain urgent fact. Casey may want to confirm that choice for pools.
# - B-10 (pre-manufactured spas and hot tubs) receives no pool_repair job types in license_map.yaml, so a
#   hot-tub-only business with B-10 gets no cards for spa_hot_tub.
