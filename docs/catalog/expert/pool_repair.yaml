trade_brief:
  price_drivers:
    - driver: "Repair the part or replace the unit (motor or seal versus a whole new pump, filter, heater or salt cell)"
      why: "A seal kit or capacitor is a short visit; a new variable-speed pump, heater or cell is a parts-heavy job with a much larger total. [judgment]"
      source: null
    - driver: "Single-speed pump being replaced"
      why: "Since July 19, 2021 most single- and two-speed pumps of 1 HP or more can no longer be made for pools, so a like-for-like swap usually becomes a variable-speed pump, sometimes with new wiring or automation."
      source: jandy_doe
    - driver: "Gas heater versus electric heat pump, and any gas line work"
      why: "R-6 excludes gas lines and gas work is never handyman work, so gas heater jobs go only to B-6 holders and may add gas piping and a city permit."
      source: aac_r4_9_103
    - driver: "Where a leak is: at the equipment pad, underground in the plumbing, or in the shell, light niche or skimmer"
      why: "A pad leak is a fitting or seal; an underground or shell leak needs pressure testing and dye work first, and may mean cutting deck. [judgment]"
      source: null
    - driver: "Electrical work past the first disconnect (new circuit, breaker, subpanel, bonding)"
      why: "R-6 stops at the first disconnect, so a pool tech may have to bring in an electrician, which adds a second visit and a second bill."
      source: aac_r4_9_103
    - driver: "Brand, model and age of the equipment"
      why: "Pentair, Hayward and Jandy parts for current models are on the truck; older or odd brands mean ordering parts or replacing the unit. [judgment]"
      source: null
    - driver: "Pool size and whether a spa is attached"
      why: "Gallons set pump, filter and heater size; a spa adds valves, a spillover and often a second heater circuit. [judgment]"
      source: null
    - driver: "Water condition (clear, cloudy, green)"
      why: "A green pool after days without a pump adds cleanup and can hide a leak or a dye test. [judgment]"
      source: null
  hidden_conditions:
    - condition: "A single-speed pump that cannot be replaced in kind, so the job becomes a variable-speed pump with wiring or controls"
      how_a_pro_spots_it: "Motor label shows a single-speed motor of 1 HP or more and no screen or keypad on the pump"
      question_or_photo: p2
      source: jandy_doe
    - condition: "Salt cell or heater heat exchanger heavily scaled with calcium"
      how_a_pro_spots_it: "White crust on the cell plates or at the heater unions; check cell or inspect cell on the display; city water near 19 grains per gallon"
      question_or_photo: p4
      source: hayward_turbocell
    - condition: "Underground suction or return line leak behind what the homeowner calls a pump problem"
      how_a_pro_spots_it: "Water drops faster with the pump running; air bubbles from the returns; pump loses prime overnight"
      question_or_photo: fu_loss_pump_off
      source: scottsdale_evap
    - condition: "Sun-brittle PVC and old unions at the pad that crack when the pro cuts in a new pump or filter"
      how_a_pro_spots_it: "Chalky, faded or white pipe in the wide pad photo; mismatched glue joints and old repairs"
      question_or_photo: p1
      source: null
    - condition: "Breaker, wiring or bonding problem past the first disconnect, which is electrician work"
      how_a_pro_spots_it: "Breaker or GFCI trips when the pump or light starts; scorched wire or melted insulation in the pad photo"
      question_or_photo: fu_breaker_trips
      source: aac_r4_9_103
    - condition: "Gas heater on a recall list, or rusted burner tray and cabinet"
      how_a_pro_spots_it: "Model plate in the pad photo (for example Hayward HDFS400); rust streaks or scorch marks at the heater cabinet"
      question_or_photo: p1
      source: cpsc_hayward_recall
    - condition: "Pool turned green while the pump was down, so cleanup comes before or with the repair"
      how_a_pro_spots_it: "Bank water answer is green or cloudy; seasonal or vacant home"
      question_or_photo: water
      source: null
    - condition: "Drain cover past its marked expiration date, cracked, or missing"
      how_a_pro_spots_it: "Drain cover photo from above; date stamped on the cover; homeowner mentions a cracked or loose cover"
      question_or_photo: p8
      source: poolsafely_drain
  misdiagnosis_checks:
    - sounds_like: "pump repair (pump runs but no water moving)"
      might_be: "filter"
      one_question: fu_pump_doing
      if_other_route_to: {category: pool_repair, job_type: "filter repair"}
      source: null
    - sounds_like: "pump repair (pump won't run)"
      might_be: "breaker or wiring past the first disconnect, a different category"
      one_question: fu_breaker_trips
      if_other_route_to: {category: electrical, job_type: "breaker trips"}
      source: aac_r4_9_103
    - sounds_like: "pool leak (water level dropping)"
      might_be: "normal summer evaporation, no repair job"
      one_question: fu_water_loss
      if_other_route_to: {}
      source: scottsdale_evap
    - sounds_like: "pool leak (wet equipment pad)"
      might_be: "pump_motor (pump lid or shaft seal leak)"
      one_question: fu_wet_where
      if_other_route_to: {category: pool_repair, job_type: "pump repair"}
      source: null
    - sounds_like: "pool leak (high water bill, autofill runs)"
      might_be: "autofill valve or yard water line, plumbing"
      one_question: fu_autofill
      if_other_route_to: {category: plumbing_repair, job_type: "leak repair"}
      source: null
    - sounds_like: "gas pool heater (heater not heating)"
      might_be: "heat_pump (electric, no gas line)"
      one_question: fu_heater_fuel
      if_other_route_to: {category: pool_repair, job_type: "pump repair"}
      source: aac_r4_9_103
    - sounds_like: "pump repair (pool turned green)"
      might_be: "green pool with working equipment, pool cleaning"
      one_question: fu_pump_doing
      if_other_route_to: {category: pool_cleaning, job_type: "green pool cleanup"}
      source: null
  photo_reading:
    - photo_id: p1
      reads: ["Pump, filter, heater, salt cell and controls in one frame", "Single-speed or variable-speed pump (screen or keypad on the motor)", "Filter type: cartridge tank, or DE or sand with a multiport or push-pull valve", "Faded or chalky PVC, old repairs", "Gas line to a heater, rust on the cabinet", "Wet ground under the pad"]
      neutral_wording: "Equipment pad with a pump, a tall filter tank with a valve on top, and a gas heater; pipe looks faded; ground under the pump is wet."
    - photo_id: p2
      reads: ["Brand, model, horsepower and voltage on the motor label", "Speed type", "Rust or water marks at the motor end"]
      neutral_wording: "Motor label shows a Hayward 1.5 HP single-speed motor, 230 volt."
    - photo_id: p3
      reads: ["Filter brand and model", "Cartridge, DE or sand", "Square feet or tank size", "Cracks or water at the tank band or clamp"]
      neutral_wording: "Filter label shows a Pentair cartridge filter; water marks below the tank clamp."
    - photo_id: p4
      reads: ["Error code on a salt system or heater display", "Salt reading", "White crust on cell plates if the cell is out"]
      neutral_wording: "Salt system display shows an inspect cell light and a salt reading of 2,800."
    - photo_id: p5
      reads: ["Filter pressure reading", "Gauge stuck at zero or cracked face"]
      neutral_wording: "Filter pressure gauge reads about 32."
    - photo_id: p6
      reads: ["Drip at the pump lid, union, motor end or a pipe joint", "Wet soil or a sinkhole near the pad or deck", "Crack in the deck or shell"]
      neutral_wording: "Water dripping where the pump meets the motor; puddle under the pump."
    - photo_id: p7
      reads: ["White scale on the tile line", "Loose or missing tile", "Rough or stained plaster", "Size of the problem area against a hand"]
      neutral_wording: "White crust along the tile line on two sides of the pool."
    - photo_id: p8
      reads: ["Cover cracked, loose, or missing", "Date stamped on the cover", "One drain or two"]
      neutral_wording: "Main drain cover at the deep end shows a crack across one side."
  local_factors:
    - fact: "City water hardness averages about 19 grains per gallon (range 18 to 20)"
      effect: "Scale builds fast on salt cells, heater exchangers and the tile line, so pros ask about cell error codes and expect crusted parts"
      source: lhc_ccr
    - fact: "In Phoenix-area summers a typical pool loses about 10.8 inches to evaporation in June, a third of an inch or more a day"
      effect: "Havasu homeowners often report a leak that is evaporation; the rate and a pump-on versus pump-off answer separate the two. Havasu runs hotter and windier, so loss may be higher [judgment]"
      source: scottsdale_evap
    - fact: "Lake Havasu City requires a permit for pools, spas, above-ground pools and gas lines; pool equipment replacement is not on either list"
      effect: "A new gas line to a heater is permit work; a like-for-like pump or filter swap usually is not, but a pro confirms with the city [judgment]"
      source: lhc_permits
    - fact: "Arizona requires a five foot barrier with self-closing, self-latching gates around a home pool unless every resident is six or older"
      effect: "Gate and barrier repairs come in with pool calls; barrier installation is B-5 or B-6 work, not R-6"
      source: ars_36_1681
    - fact: "Heat pumps run efficiently down to about 45 F and may not keep a spa warm where winters drop below 50 F"
      effect: "Havasu winter nights dip into the 40s, so spa owners lean on gas heaters and heat pump calls rise on cold mornings [judgment]"
      source: hayward_heat_pump
    - fact: "Seasonal residents leave pools on timers while away for months"
      effect: "A failed pump or timer goes unnoticed, and the call comes from out of town with a green pool; the card should say whether anyone is on site [judgment]"
      source: null
    - fact: "Summer pad temperatures and full-sun equipment pads"
      effect: "Motors run hot and long hours June to September, bearings and capacitors fail, and PVC goes brittle in the sun [judgment]"
      source: null
    - fact: "Monsoon dust storms and power blips in July to September"
      effect: "Filters load up after a storm, and outages or surges trip GFCIs and reset timers [judgment]"
      source: null
  seasonality:
    busy: "March to May (spring startup, heater and heat pump calls before swim season) and June to September (pump motors, filters, green pools) [judgment]"
    slow: "December to January for pump and filter work; spa heater calls stay steady in winter [judgment]"
    source: null

job_types:
  - id: pump_motor
    label: "Pump or motor not running, humming, loud, or leaking"
    bank_job_type: "pump repair"
    recurring: false
    homeowner_phrasings: ["pool pump humming but not spinning", "pump screaming", "pump won't turn on", "water dripping under the pump", "la bomba no prende"]
    must_know:
      - fact: "What the pump does when it should be running: hums, nothing at all, loud, runs with no flow, or leaks"
        bank_question: symptom
        follow_up: fu_pump_doing
        photo: p6
        why_it_moves_price: "A hum is often a capacitor or a seized motor, a leak a seal kit, no flow a filter or suction job; each is a different visit and parts list. [judgment]"
        skip_if: "Homeowner's words already say which"
      - fact: "Brand, model, horsepower and speed type from the motor label"
        bank_question: equipment_brand
        follow_up: null
        photo: p2
        why_it_moves_price: "Sets the parts on the truck, and whether a single-speed pump can be fixed or must become variable-speed."
        skip_if: "Motor label photo sent"
      - fact: "Fix it, replace it, or quotes for both"
        bank_question: null
        follow_up: fu_repair_or_replace
        photo: null
        why_it_moves_price: "A repair visit and a new pump are quoted very differently; asking up front saves a second trip. [judgment]"
        skip_if: "Homeowner said fix only or wants a new pump"
      - fact: "Whether a breaker or GFCI trips"
        bank_question: null
        follow_up: fu_breaker_trips
        photo: p1
        why_it_moves_price: "A trip points the visit at wiring, which may need an electrician past the first disconnect. [judgment]"
        skip_if: "Pump runs and only noise or leaking was reported"
    allowed_follow_ups:
      - id: fu_pump_doing
        ask_when: "Homeowner says the pump has a problem without saying what it does, or reports a green pool and no word on the pump"
        text_en: "When the pump should be running, what does it do?"
        text_es: "Cuando la bomba debería estar funcionando, ¿qué hace?"
        options_en: ["Hums but won't spin", "Nothing at all", "Runs but loud", "Runs but no water moving", "Runs fine", "Leaks water"]
        options_es: ["Zumba pero no gira", "Nada", "Funciona pero hace mucho ruido", "Funciona pero no mueve agua", "Funciona bien", "Gotea agua"]
        card_field: true
        why: "Separates motor, seal and flow jobs, and catches a green pool where the pump runs fine. [judgment]"
      - id: fu_breaker_trips
        ask_when: "Equipment will not start, or the homeowner mentions power, a breaker or a GFCI"
        text_en: "Does a breaker or a GFCI outlet trip when the equipment turns on?"
        text_es: "¿Se bota un breaker o un enchufe GFCI cuando se prende el equipo?"
        options_en: ["Yes, it trips", "No", "Haven't checked"]
        options_es: ["Sí, se bota", "No", "No lo he revisado"]
        card_field: true
        why: "A trip tells the business to plan for electrical work, which R-6 limits to the first disconnect."
      - id: fu_repair_or_replace
        ask_when: "Pump, filter, salt system or heater job and the homeowner did not say whether they want a fix or new equipment"
        text_en: "Do you want it fixed if possible, or are you open to new equipment?"
        text_es: "¿Quiere que lo reparen si se puede, o le interesa equipo nuevo?"
        options_en: ["Fix it if possible", "Open to replacing", "Quotes for both"]
        options_es: ["Repararlo si se puede", "Puedo cambiarlo", "Cotización de las dos"]
        card_field: true
        why: "The kb's repair_or_replace question; the business quotes a visit, a unit, or both. [judgment]"
    photos_priority: [p2, p1, p6]
    urgency:
      fire_dept_triggers: ["Smoke or a burning smell from the pump motor or its wiring"]
      urgent_capable_triggers: ["Pump off in summer heat and the water is turning cloudy or green", "Water spraying from the pump and it can't be shut off"]
      regular: "Pump runs but is loud, or a slow drip"
    scope_line_en: "Pool pump hums but will not spin; Hayward single-speed motor (label photo); pool is clear for now."
    scope_line_es: "La bomba de la alberca zumba pero no gira; motor Hayward de una velocidad (foto de la etiqueta); el agua sigue clara."
    quote_format: diagnostic_visit
    business_fills: ["visit fee", "what the visit covers", "earliest arrival"]
    card_template: |
      REQ-<id> | Pool and spa repair | <town>, <general area> | <pool / spa / both>
      <one scope line: what the pump does, brand if known, water now>
      Pump: <hums / nothing / loud / no flow / leaks>. Breaker or GFCI trips: <yes / no / not checked>. Wants: <fix / replace / quotes for both>.
      Equipment: <brand, model, HP from label, neutral> or <not visible>. Pool: <size band>, water <clear / cloudy / green>.
      Photos: <n> (<neutral description of each>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["It's the capacitor.", "The bearings are shot.", "You'll have to buy a variable-speed pump now.", "A motor swap is about four hundred.", "Flip the breaker and try again."]

  - id: filter
    label: "Filter problem (cartridge, DE or sand), high pressure, leaking tank, sand or powder back in the pool"
    bank_job_type: "filter repair"
    recurring: false
    homeowner_phrasings: ["filter pressure is high", "sand in the pool", "white powder blowing back in", "filter tank leaking", "need new cartridges"]
    must_know:
      - fact: "What the filter is doing: high pressure, leaking, media back in the pool, or cartridges due"
        bank_question: symptom
        follow_up: fu_filter_doing
        photo: p3
        why_it_moves_price: "A clean or new cartridges is routine; media in the pool means torn grids or laterals; a cracked tank is a replacement. [judgment]"
        skip_if: "Homeowner's words say which"
      - fact: "Filter type and size from the label"
        bank_question: equipment_brand
        follow_up: null
        photo: p3
        why_it_moves_price: "Cartridge, DE and sand filters take different parts, labor and disposal. [judgment]"
        skip_if: "Filter label or pad photo sent"
      - fact: "Pressure reading now"
        bank_question: null
        follow_up: fu_gauge_reading
        photo: p5
        why_it_moves_price: "Tells the pro how loaded the filter is before the visit. [judgment]"
        skip_if: "Gauge photo sent"
    allowed_follow_ups:
      - id: fu_filter_doing
        ask_when: "Homeowner says the filter has a problem without saying what"
        text_en: "What is the filter doing?"
        text_es: "¿Qué está pasando con el filtro?"
        options_en: ["Pressure is high", "Leaking from the tank", "Sand or powder getting into the pool", "Cartridges need replacing", "Something else"]
        options_es: ["La presión está alta", "Gotea del tanque", "Entra arena o polvo a la alberca", "Hay que cambiar los cartuchos", "Otra cosa"]
        card_field: true
        why: "Each answer is a different visit and parts list. [judgment]"
      - id: fu_gauge_reading
        ask_when: "Filter or flow complaint and no gauge photo"
        text_en: "About what does the filter pressure gauge read right now?"
        text_es: "¿Más o menos cuánto marca ahora el manómetro del filtro?"
        options_en: ["Under 15", "15 to 25", "Over 25", "Gauge broken or missing"]
        options_es: ["Menos de 15", "15 a 25", "Más de 25", "Manómetro roto o no hay"]
        card_field: true
        why: "The reading is what a pro asks first on any filter call. [judgment]"
      - fu_repair_or_replace
    photos_priority: [p3, p5, p1]
    urgency:
      fire_dept_triggers: []
      urgent_capable_triggers: ["Tank cracked and water spraying when the pump runs"]
      regular: "High pressure, cartridges due, or a slow leak"
    scope_line_en: "Cartridge filter pressure reads over 30 after cleaning; Pentair filter (label photo); water cloudy."
    scope_line_es: "El filtro de cartucho marca más de 30 después de limpiarlo; filtro Pentair (foto de la etiqueta); agua turbia."
    quote_format: diagnostic_visit
    business_fills: ["visit fee", "what the visit covers (clean, new cartridges, repair)", "earliest arrival"]
    card_template: |
      REQ-<id> | Pool and spa repair | <town>, <general area> | <pool / spa / both>
      <one scope line: what the filter does, type, water now>
      Filter: <high pressure / leaking / media in pool / cartridges due>. Type: <cartridge / DE / sand, from label or photo>. Gauge: <reading or broken>.
      Wants: <fix / replace / quotes for both>. Pool: <size band>, water <clear / cloudy / green>.
      Photos: <n> (<neutral description>). Homeowner adds: <her words, scrubbed>.
      Needed: <timing answer>.
    never_say: ["Your grids are torn.", "Just backwash it.", "Cartridges run about two hundred.", "That filter is too small for your pool."]

  - id: salt_system
    label: "Salt system or salt cell error, low chlorine, scaled cell"
