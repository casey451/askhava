name: name-test
on:
  push:
    branches: ["claude/check-name-test"]
permissions:
  contents: read
  statuses: write
jobs:
  security:
    name: "security"
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
      - name: Report status with the ruleset's exact name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success -f context="Security " -f description="mirror of security job"
