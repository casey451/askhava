# Required check "Ally" (ruleset protect-main). Job name must stay exactly "Ally".
# Runs the Playwright accessibility suite (tests/a11y, axe-core at 320, 768 and 1280 px on every page
# and state; docs/test-design.md section 6; T173, D-453, D-481) against the app with stand-ins: the
# suite's globalSetup (tests/e2e/webserver.ts, T227) runs `server migrate` and starts the stand-in
# server and the test-control build of server and worker on the Postgres service. Any axe violation,
# any unreviewed axe "incomplete" result (A11Y-025, TD-A11Y-01) or any other failed check fails Ally.
# Every incomplete result is listed in the job summary and the JSON report is kept as an artifact.
name: a11y
on:
  # Push only, no pull_request trigger (D-1087): exactly one run per head commit. A second,
  # pull_request-started run of the same head doubled the minutes and the exposure to a flaky test
  # (runner/verify.py needs every run of a required check on the head green) and, finishing after the
  # merge, made governance.yml post a false failure. A check run attaches to its commit, so these push
  # runs satisfy a pull request with that head (the ruleset matches checks by name and app on the head
  # SHA). Every pull request here comes from claude/** or dependabot/**.
  push:
    branches: ["claude/**", "dependabot/**", "!claude/kit-state"]
  workflow_call:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
jobs:
  a11y:
    name: "Ally"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned by digest (SEC-021, SEC-045), the same image as ci.yml.
    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: askhava_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: askhava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askhava_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://askhava_ci@localhost:5432/askhava_ci
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Database roles the migrations grant to (askhava_app, askhava_migrator; D-092, D-491)
        run: |
          for role in askhava_app askhava_migrator; do
            psql "$DATABASE_URL" -qtc "SELECT 1 FROM pg_roles WHERE rolname = '${role}'" | grep -q 1 \
              || psql "$DATABASE_URL" -qc "CREATE ROLE ${role} NOLOGIN"
            psql "$DATABASE_URL" -qc "GRANT ${role} TO askhava_ci" >/dev/null
          done

      - name: Rust toolchain (the pinned release from rust-toolchain.toml)
        run: |
          rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

      - name: Rust build cache (the same build as ci.yml's E2e job, D-693)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e

      - name: Build server and worker with test-control (never the release build, SEC-035)
        run: |
          cargo build -p askhava-server --bins --locked --features askhava-core/test-control

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: npm ci and the browser scripts (npm run build writes the .js beside each .ts)
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Playwright browser cache (keyed by package-lock.json, which pins @playwright/test)
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium and its system libraries
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: The accessibility suite (axe at 320, 768 and 1280 px, keyboard, reflow, spacing)
        env:
          CI: "true"
        run: |
          npx playwright test --config tests/a11y/playwright.config.ts

      - name: Every axe incomplete result, listed in the job summary (A11Y-025)
        if: always() && hashFiles('test-results/a11y-report/results.json') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          def specs(suite):
              yield from suite.get("specs", [])
              for child in suite.get("suites", []):
                  yield from specs(child)

          report = json.load(open("test-results/a11y-report/results.json"))
          print("## axe incomplete results (A11Y-025)\n")
          lines = []
          for suite in report.get("suites", []):
              for spec in specs(suite):
                  for test in spec.get("tests", []):
                      for note in test.get("annotations", []):
                          if note.get("type") == "axe incomplete (A11Y-025)" and note.get("description") != "none":
                              lines.append(f"- {spec['title']}: {note['description']}")
          print("\n".join(lines) if lines else "None.")
          PY

      - name: Keep the JSON report
        if: always() && hashFiles('test-results/a11y-report/results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-report
          path: test-results/a11y-report/results.json
          retention-days: 30
