# Required check "Ci" (ruleset protect-main). Job name must stay exactly "Ci".
name: ci
on:
  push:
    branches: ["claude/**", "!claude/kit-state"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  ci:
    name: "Ci"
    runs-on: ubuntu-latest
    # Postgres for the Rust integration tests (D-453); T169 pins the image by digest.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askhava_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: askhava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askhava_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://askhava_ci@localhost:5432/askhava_ci
      SQLX_OFFLINE: "true"
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sources unchanged (fingerprint)
        run: |
          sha256sum -c --quiet kit/sources.sha256
          test "$(find sources -type f | wc -l)" -eq "$(wc -l < kit/sources.sha256)"
          echo "sources/ matches kit/sources.sha256"

      - name: Secret scan (gitleaks, working tree)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --no-banner --redact --exit-code 1

      - name: PII scan
        run: |
          python3 scripts/pii_scan.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit, contract and drill tests (pytest)
        run: |
          python3 -m pip install --quiet pytest==9.1.1 PyYAML==6.0.1
          python3 -m pytest tests -q -p no:cacheprovider

      - name: Rust format, lint and tests (once the workspace exists, D-453)
        run: |
          if [ -f Cargo.toml ]; then
            rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c clippy -c rustfmt
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --locked
          else
            echo "rust checks skipped: no Cargo workspace yet"
          fi

      - name: Rust dependency audit (cargo-audit, cargo-deny)
        run: |
          if [ -f Cargo.lock ]; then
            cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
            cargo audit
            cargo deny check licenses bans sources advisories
          else
            echo "cargo-audit and cargo-deny skipped: no Cargo.lock yet"
          fi

      - name: TypeScript checks and npm audit
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npx tsc --noEmit
            if [ -f eslint.config.js ]; then npx eslint .; fi
            npm audit --audit-level=low
          else
            echo "npm checks skipped: no package-lock.json yet"
          fi
