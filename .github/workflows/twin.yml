# Required check "Twin" (ruleset protect-main). Job name must stay exactly "Twin".
# Runs the hard-failing twin gate (D-107, docs/twin-warnings.md section 6): every *_fixed scenario,
# seeds 1-5, fails on any instance not waived by twin/waivers.json. The twin's fee, quiet hours, status
# arrows and card matching are the app's own: rules_bridge is built from this commit first and the gate
# runs through it, so Twin checks app/ (T074, D-453, D-481, D-491).
name: twin
on:
  # Push only, no pull_request trigger (D-1087): exactly one run per head commit. A second,
  # pull_request-started run of the same head doubled the minutes and the exposure to a flaky test
  # (runner/verify.py needs every run of a required check on the head green) and, finishing after the
  # merge, made governance.yml post a false failure. A check run attaches to its commit, so these push
  # runs satisfy a pull request with that head (the ruleset matches checks by name and app on the head
  # SHA). Every pull request here comes from claude/** or dependabot/**.
  # The merge train's throwaway refs prove nothing here (D-4281, T640); nor does a claude/wip/** ref, a failed
  # attempt's kept work, never a pull request head (D-4720).
  push:
    branches: ["claude/**", "dependabot/**", "!claude/kit-state", "!claude/train/**", "!claude/wip/**"]
  workflow_call:
# D-5554: a newer push to the same branch cancels its older run, freeing a shared runner; a push to main,
# the nightly's workflow_call and any other event get a group of their own (the run id) and never cancel.
# A literal prefix, never github.workflow (under workflow_call it names the caller, nightly-main.yml).
concurrency:
  group: twin-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  twin:
    name: "Twin"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The bridge compiles every crate and its query macros; no database here (D-491).
      SQLX_OFFLINE: "true"
      ASKHAVA_RULES_BRIDGE: target/debug/rules_bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 200
      - name: Does this change touch what Twin builds, reads or runs? (fail closed, D-489, D-5554)
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Twin's rule, from this file's steps: rules_bridge compiles the workspace (twin/, app/, the manifests,
          # the toolchain pin, .cargo/, the offline queries in .sqlx/, and what app/ embeds: migrations/ through
          # migrate! in app/core/src/db.rs, schemas/, stand_ins/, docs/legal/, docs/catalog/, docs/architecture.md and
          # docs/copy/mail-app-steps.md); the contract test runs tests/contract/ under tests/conftest.py; the gate
          # runs twin/ (docs/decisions.md it reads only for waiver IDs: append-only, check_pr_change.py, so a change
          # cannot remove one). The job always runs and passes when it skips, so the required name Twin reports on every head.
          # Main, the nightly (it calls this workflow with its own event name) and any workflow_call run in full.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_call" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "run=true: a full run ($EVENT_NAME on $GITHUB_REF_NAME)"; exit 0
          fi
          # Fail closed: a failed fetch, merge-base or diff sets run=true, never reads as "nothing changed".
          run=false
          if ! git fetch --no-tags --depth=200 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" main:refs/remotes/origin/main; then run=true; fi
          if ! base="$(git merge-base origin/main HEAD)"; then run=true; fi
          if ! git diff --no-renames --name-only "$base" HEAD > "$RUNNER_TEMP/changed-files.txt"; then run=true; fi
          < "$RUNNER_TEMP/changed-files.txt" grep -Eq '^(twin/|app/|migrations/|schemas/|stand_ins/|docs/legal/|docs/catalog/|docs/architecture\.md|docs/copy/mail-app-steps\.md|tests/contract/|tests/conftest\.py|Cargo\.(toml|lock)|rust-toolchain\.toml|\.cargo/|\.sqlx/|\.github/workflows/twin\.yml)' && run=true
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then echo "run=true: this change touches what Twin tests"; else echo "run=false: no Twin input changed, so the build and gate are skipped and Twin passes"; fi
      - name: Rust toolchain (the pinned release from rust-toolchain.toml)
        if: steps.changes.outputs.run == 'true'
        run: |
          rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Rust build cache (registry, git deps and target/, D-693)
        if: steps.changes.outputs.run == 'true'
        # Its own key: this job builds one binary. Cargo's fingerprints decide what rebuilds.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: twin
          # Restored on every run, saved only on main, where the nightly calls this workflow (D-2782).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build rules_bridge from this commit (T074)
        if: steps.changes.outputs.run == 'true'
        run: cargo build -p askhava-server --bin rules_bridge --locked
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bridge contract, Python side (app/server/rules_bridge.schema.json, D-481)
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 -m pip install --quiet pytest==9.1.1 PyYAML==6.0.1
          python3 -m pytest tests/contract/test_rules_bridge.py -q -p no:cacheprovider
      - name: Twin gate through the app's rules
        if: steps.changes.outputs.run == 'true'
        run: PYTHONHASHSEED=0 python3 twin/gate.py --bridge "$ASKHAVA_RULES_BRIDGE" --report "$RUNNER_TEMP/twin-report.json"
      - name: Upload the gate report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twin-report
          path: ${{ runner.temp }}/twin-report.json
          if-no-files-found: ignore
