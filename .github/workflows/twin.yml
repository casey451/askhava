# Required check "Twin" (ruleset protect-main). Job name must stay exactly "Twin".
# Runs the hard-failing twin gate (D-107, docs/twin-warnings.md section 6): every *_fixed scenario,
# seeds 1-5, fails on any instance not waived by twin/waivers.json. Standard library only.
name: twin
on:
  push:
    branches: ["claude/**", "!claude/kit-state"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  twin:
    name: "Twin"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Twin gate
        run: PYTHONHASHSEED=0 python3 twin/gate.py --report "$RUNNER_TEMP/twin-report.json"
      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-report
          path: ${{ runner.temp }}/twin-report.json
          if-no-files-found: ignore
