# Opens a PR for each pushed runner task branch (REST) and comments the review-gate decision
# (D-486, D-479). It never enables auto-merge: the runner does that itself after its review, as its own
# identity, so the merge starts workflows (pull_request.closed starts backup-runner). The decision is
# runner/verify.py auto_merge_reason, read from main (never from the pushed branch), over the task's
# reviewed_sha and review lease in kit/state.json on claude/kit-state and the lease on claude/lease
# (the lane map `leases` when lease.json has one, else the single `lease`; verify accepts both, D-515).
# The branch ruleset still enforces the required checks (Ci, Twin, Ally).
name: auto-pr
on:
  push:
    branches: ["claude/task/**"]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  auto-pr:
    name: auto-pr
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read main's decision code and the review record
        run: |
          set -euo pipefail
          # The checkout keeps no credentials (persist-credentials: false) and the repo is private,
          # so each fetch passes the job token for that one command (D-540).
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          fetch() { git -c "http.https://github.com/.extraheader=${auth}" fetch --quiet --depth=1 origin "$1"; }
          fetch main
          git show FETCH_HEAD:runner/verify.py > "$RUNNER_TEMP/verify_main.py"
          if fetch claude/kit-state 2>/dev/null; then
            git show FETCH_HEAD:kit/state.json > "$RUNNER_TEMP/state.json" 2>/dev/null || echo '{"tasks": []}' > "$RUNNER_TEMP/state.json"
          else
            echo '{"tasks": []}' > "$RUNNER_TEMP/state.json"
          fi
          if fetch claude/lease 2>/dev/null; then
            git show FETCH_HEAD:lease.json > "$RUNNER_TEMP/lease.json" 2>/dev/null || echo '{"lease": null}' > "$RUNNER_TEMP/lease.json"
          else
            echo '{"lease": null}' > "$RUNNER_TEMP/lease.json"
          fi
      - name: Decide auto-merge
        id: decide
        run: |
          set -euo pipefail
          reason="$(python3 -I -c '
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("verify_main", sys.argv[1])
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          state = json.load(open(sys.argv[2]))
          doc = json.load(open(sys.argv[3]))
          lease = doc.get("leases") or doc.get("lease")
          if not hasattr(mod, "auto_merge_reason"):
              print("main has no runner review gate yet (runner/verify.py auto_merge_reason)")
          else:
              print(mod.auto_merge_reason(state, sys.argv[4], sys.argv[5], lease))
          ' "$RUNNER_TEMP/verify_main.py" "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/lease.json" "$BRANCH" "$HEAD_SHA")"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "decision: ${reason:-auto-merge allowed}"
      - name: Open the PR (REST)
        id: pr
        run: |
          set -euo pipefail
          task="${BRANCH#claude/task/}"
          id="${task%%-*}"
          slug="${task#*-}"
          if [ "$slug" = "$task" ]; then slug=""; fi
          title="${id}: ${slug//-/ }"
          title="${title%: }"
          pr="$(gh api "repos/${REPO}/pulls?head=${OWNER}:${BRANCH}&state=open" --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            body="$(printf 'Opened by auto-pr for runner task %s.\n\nBuild status: https://github.com/%s/blob/claude/kit-state/STATUS.md\n' "$id" "$REPO")"
            pr="$(gh api "repos/${REPO}/pulls" -f title="$title" -f head="$BRANCH" -f base=main -f body="$body" --jq .number)"
            echo "opened PR #$pr"
          else
            echo "PR #$pr already open"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: Comment the review-gate decision (REST)
        env:
          PR: ${{ steps.pr.outputs.number }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          if [ -n "$REASON" ]; then
            body="$(printf 'Review gate for %s: no auto-merge (%s). The runner turns on auto-merge only for a head it reviewed under the task lease (D-486).\n' "${HEAD_SHA:0:12}" "$REASON")"
          else
            body="$(printf 'Review gate for %s: reviewed by the runner under the task lease; the runner turns on auto-merge.\n' "${HEAD_SHA:0:12}")"
          fi
          gh api "repos/${REPO}/issues/${PR}/comments" -f body="$body" > /dev/null
          echo "${REASON:-review record matches}"
