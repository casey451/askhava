# The Actions runner (primary since D-483): runs `python3 -m runner` (D-486) through the Claude Code
# GitHub Action (subscription token, not pay-per-use) with RUNNER_STARTER=actions, so every state
# commit names this starter. Off unless kit/state.json on claude/kit-state has "backup_runner": "on"
# AND the secret CLAUDE_CODE_OAUTH_TOKEN is set. Starts hourly, by hand, and on every PR merged into
# main, so the next task starts at once instead of at the next hourly tick (BUILD_BRIEF.md:213).
# The concurrency group keeps two starts from overlapping; the lease on claude/lease is the real lock.
name: backup-runner
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  pull_request:
    types: [closed]
permissions:
  contents: read
concurrency:
  group: backup-runner
  cancel-in-progress: false
jobs:
  gate:
    name: gate
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the flag on claude/kit-state
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -u
          echo "run=false" >> "$GITHUB_OUTPUT"
          # The branch may not exist yet; exit quietly if so.
          if ! git fetch --quiet --depth=1 origin claude/kit-state 2>/dev/null; then
            echo "claude/kit-state not found: nothing to do"
            exit 0
          fi
          if ! git show FETCH_HEAD:kit/state.json > "$RUNNER_TEMP/state.json" 2>/dev/null; then
            echo "kit/state.json not found: nothing to do"
            exit 0
          fi
          flag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("backup_runner",""))' "$RUNNER_TEMP/state.json" 2>/dev/null || true)"
          if [ "$flag" != "on" ]; then
            echo "backup_runner is not on: nothing to do"
            exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "backup_runner is on but the OAuth token secret is not set: nothing to do"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
  backup:
    name: backup
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The runner smokes main before every claim (scripts/smoke.sh) and the worker runs the same
    # checks on its branch, so this job carries what Ci carries: Postgres 16, pytest and PyYAML.
    # The first cycle under the token marked main red because none of these were here (D-498).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askhava_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: askhava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askhava_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://askhava_ci@localhost:5432/askhava_ci
      SQLX_OFFLINE: "true"
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # persist-credentials: false so pushes go out as the Claude GitHub App,
      # not as GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke-test prerequisites (what Ci installs for itself)
        run: |
          python3 -m pip install --quiet pytest==9.1.1 PyYAML==6.0.1
          for role in askhava_app askhava_migrator; do
            psql "$DATABASE_URL" -qtc "SELECT 1 FROM pg_roles WHERE rolname = '${role}'" | grep -q 1 \
              || psql "$DATABASE_URL" -qc "CREATE ROLE ${role} NOLOGIN"
            psql "$DATABASE_URL" -qc "GRANT ${role} TO askhava_ci" >/dev/null
          done
      - uses: anthropics/claude-code-action@v1
        env:
          RUNNER_STARTER: actions
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model claude-sonnet-5-5 --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,Agent,TodoWrite,WebFetch,WebSearch"
          prompt: |
            You are the Ask Hava build runner. Read BUILD_BRIEF.md sections 2, 7 and 16 now. The runner code (runner/) does the cycle; you do only the task it hands you (D-486).

            Do exactly this:
            1. Run `python3 -m runner` (RUNNER_STARTER=actions is already set). It prints a result line and a JSON line.
            2. If the result is anything but `handed_off`, stop. Never do the runner's steps by hand; a live lease naming another session means stop (D-171).
            3. If it is `handed_off`, the JSON `handoff` names the task, branch, prompt and models. Run that one task through a worker subagent on that model (alias haiku, sonnet or opus, D-170) with only the prompt and the files it lists; commit to the local branch; do not push it.
            4. Run the fresh-eyes reviewer subagent on the reviewer model over the diff and the task's spec files; findings go back to the worker once.
            5. Run `python3 -m runner --after --worker-agent <worker agent id> --reviewer-agent <reviewer agent id>` (add `--outcome tests_failed --log "<summary>"` if the work failed, `--outcome usage_limit` at a usage limit).
            6. While the task runs longer than 30 minutes, run `python3 -m runner --renew` every 30 minutes.
            7. Never edit kit/state.json, claude/kit-state or claude/lease yourself, never push to main, never force-push.
            8. Report the runner's output lines and stop.

            Never break section 2. Never claim a test passed unless you ran it here.
