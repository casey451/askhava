# The Actions runner (primary since D-483): runs `python3 -m runner` (D-486) through the Claude Code
# GitHub Action (subscription token, not pay-per-use) with RUNNER_STARTER=actions, so every state
# commit names this starter. Off unless kit/state.json on claude/kit-state has "backup_runner": "on"
# AND the secret CLAUDE_CODE_OAUTH_TOKEN is set. Starts the moment `ci` finishes on a task branch (the
# gate then waits for the task's auto-merge, which lands once Governance follows), on every
# PR merged into main by a person, by hand, and hourly as a safety net; a cycle that clears a red main
# or a false red starts the next one at once (D-500). So the next task starts within minutes of the
# last one finishing, never on a fixed clock (BUILD_BRIEF.md:213).
# The concurrency group keeps two starts of one lane from overlapping; the lease on claude/lease is the
# real lock. Lanes (D-620): kit/runner.json "lanes" says how many tasks may be in flight. The gate picks
# the lane a run serves (`run_lane` in runner/state.py: a merged pull request's own lane when it holds no
# live lease, D-723; else a lane with no task in flight, the event's task's first, then a lane with no
# live lease, else lane 1); the backup job's concurrency group is per lane (lane 1 keeps the old name
# `backup-runner`), the runner gets the lane as RUNNER_LANE and claims only on it, and with two or more
# lanes the hourly tick and the chain step start one run per lane that needs one, and a cycle that hands
# off starts its refill runs at once (D-723). GitHub keeps one pending job per group and cancels the
# older, so a dropped run is always replaced by a newer run for the same lane. With "lanes": 1 every run
# serves lane 1 and every step behaves exactly as before.
name: backup-runner
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "The lane this run serves (D-620); empty lets the gate pick"
        required: false
        default: ""
        type: string
  pull_request:
    types: [closed]
  workflow_run:
    # `ci`, not `governance`: governance is itself started by workflow_run, so its own head_branch
    # is main and could never name the task (D-500 review).
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
jobs:
  gate:
    name: gate
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'))
      && (github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'claude/task/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      run: ${{ steps.tick.outputs.run || steps.check.outputs.run }}
      lane: ${{ steps.lane.outputs.lane || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the flag on claude/kit-state
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -u
          echo "run=false" >> "$GITHUB_OUTPUT"
          # The branch may not exist yet; exit quietly if so.
          if ! git fetch --quiet --depth=1 origin claude/kit-state 2>/dev/null; then
            echo "claude/kit-state not found: nothing to do"
            exit 0
          fi
          if ! git show FETCH_HEAD:kit/state.json > "$RUNNER_TEMP/state.json" 2>/dev/null; then
            echo "kit/state.json not found: nothing to do"
            exit 0
          fi
          flag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("backup_runner",""))' "$RUNNER_TEMP/state.json" 2>/dev/null || true)"
          if [ "$flag" != "on" ]; then
            echo "backup_runner is not on: nothing to do"
            exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "backup_runner is on but the OAuth token secret is not set: nothing to do"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Pick the lane this run serves (D-620)
        id: lane
        if: steps.check.outputs.run == 'true'
        env:
          WANTED: ${{ github.event.inputs.lane || '' }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || '' }}
          # A merged pull request's run serves its task's own lane, which that merge frees (D-723); a
          # closed pull request that did not merge is not one.
          MERGED: ${{ github.event.pull_request.merged == true }}
        run: |
          set -u
          # lease.json on claude/lease holds the lane map; state.json was saved by the step above.
          if ! { git fetch --quiet --depth=1 origin claude/lease 2>/dev/null && git show FETCH_HEAD:lease.json > "$RUNNER_TEMP/lease.json" 2>/dev/null; }; then
            echo '{"lease": null}' > "$RUNNER_TEMP/lease.json"
          fi
          picked="$(python3 -I -c '
          import importlib.util, json, re, sys
          from datetime import datetime, timezone
          spec = importlib.util.spec_from_file_location("runner_state_main", sys.argv[1])
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          state = json.load(open(sys.argv[2]))
          doc = json.load(open(sys.argv[3]))
          state["lease"] = doc.get("lease")
          state["leases"] = doc.get("leases") if isinstance(doc.get("leases"), dict) else {}
          try:
              lanes = json.load(open(sys.argv[4])).get("lanes", 1)
          except (OSError, ValueError):
              lanes = 1
          lanes = lanes if isinstance(lanes, int) and not isinstance(lanes, bool) and lanes >= 1 else 1
          lanes = 1 if state.get("lanes_fallback") else lanes
          now = datetime.now(timezone.utc)
          held = mod.live_leases(state, now) if hasattr(mod, "live_leases") else {}
          free = [str(n) for n in range(1, lanes + 1) if str(n) not in held]
          wanted, found = sys.argv[5].strip(), re.match(r"^claude/task/(FIX-MAIN|[A-Za-z]+[0-9]+[A-Za-z]?)", sys.argv[6])
          merged = len(sys.argv) > 7 and sys.argv[7] == "true"
          if wanted.isdigit() and 1 <= int(wanted) <= lanes:
              lane = wanted
          elif hasattr(mod, "run_lane"):
              task = found.group(1) if found else ""
              try:
                  lane = mod.run_lane(state, now, lanes, task, merged=merged)
              except TypeError:  # a checkout whose runner/state.py predates `merged` (D-723)
                  lane = mod.run_lane(state, now, lanes, task)
          else:
              lane = "1"
          print(lane, lanes, " ".join(free) or "-")
          ' runner/state.py "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/lease.json" kit/runner.json "$WANTED" "$BRANCH" "$MERGED" 2>/dev/null || echo "1 1 -")"
          read -r lane lanes free <<< "$picked"
          { echo "lane=${lane}"; echo "lanes=${lanes}"; echo "free=${free}"; } >> "$GITHUB_OUTPUT"
          echo "lane ${lane} of ${lanes}; lanes with no live lease: ${free}"
      - name: Hourly tick hands over to a dispatched run (D-518)
        # A scheduled run cannot get the Claude App token (the OIDC exchange answers "User does not have
        # write access"), while a dispatched run can; so the tick only dispatches the real cycle. With two
        # or more lanes it dispatches one run for each lane that holds no live lease (D-620).
        if: github.event_name == 'schedule' && steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LANES: ${{ steps.lane.outputs.lanes || '1' }}
          FREE: ${{ steps.lane.outputs.free || '-' }}
        run: |
          if [ "$LANES" = "1" ]; then
            gh workflow run backup-runner.yml --ref main --repo "$GITHUB_REPOSITORY"
          else
            for n in $FREE; do
              [ "$n" = "-" ] || gh workflow run backup-runner.yml --ref main --repo "$GITHUB_REPOSITORY" -f lane="$n"
            done
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
        id: tick
      - name: A task's checks finished - wait for its auto-merge (D-500)
        if: github.event_name == 'workflow_run' && steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -u
          # A failed check goes straight to the runner (it records the failure and retries the task).
          # A green one is merged by auto-merge once Governance follows; give it up to fifteen minutes, then run
          # anyway (the runner reports merge_pending and the next event picks it up).
          if [ "$CONCLUSION" != "success" ]; then echo "checks ${CONCLUSION}: run now"; exit 0; fi
          for _ in $(seq 1 60); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&state=all&per_page=1" \
              --jq '.[0] | if .merged_at then "merged" else .state end' 2>/dev/null || echo unknown)"
            [ "$state" = "open" ] || { echo "PR ${state}: run now"; exit 0; }
            sleep 15
          done
          echo "PR still open after fifteen minutes: run anyway"
  backup:
    name: backup
    needs: gate
    # On the job, not the workflow: a gate waiting for a merge must not hold up the group. One backup
    # job per lane runs at a time and at most one waits; the lease on claude/lease is the real lock.
    # Lane 1 keeps the group name it always had (D-620).
    concurrency:
      group: ${{ needs.gate.outputs.lane == '1' && 'backup-runner' || format('backup-runner-lane-{0}', needs.gate.outputs.lane) }}
      cancel-in-progress: false
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The runner smokes main before every claim (scripts/smoke.sh) and the worker runs the same
    # checks on its branch, so this job carries what Ci carries: Postgres 16, pytest and PyYAML.
    # The first cycle under the token marked main red because none of these were here (D-498).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askhava_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: askhava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askhava_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://askhava_ci@localhost:5432/askhava_ci
      SQLX_OFFLINE: "true"
      # The same pinned gitleaks as ci.yml, so scripts/smoke.sh runs Ci's secret scan here (D-582).
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
      # The runner reads check runs (a task's PR checks, the false-red test of D-498); without this the
      # job's token gets 403 "Resource not accessible by integration" (D-501).
      checks: read
    steps:
      # persist-credentials: false so pushes go out as the Claude GitHub App,
      # not as GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Note when this job started (for the chaining step)
        run: echo "JOB_START=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust build cache (D-514)
        # The smoke and the worker's own cargo runs reuse the build; Cargo's fingerprints decide what rebuilds.
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          # One entry per commit of main (D-1178): actions/cache never updates an existing key, so a key
          # by Cargo.lock alone froze the target directory at the last dependency change and every cycle
          # rebuilt everything since, until the smoke test outran the runner's timeout. The restore keys
          # take the newest snapshot of the same lock, then any.
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-${{ runner.os }}-
      - name: Smoke-test prerequisites (what Ci installs for itself)
        run: |
          python3 -m pip install --quiet pytest==9.1.1 PyYAML==6.0.1
          for role in askhava_app askhava_migrator; do
            psql "$DATABASE_URL" -qtc "SELECT 1 FROM pg_roles WHERE rolname = '${role}'" | grep -q 1 \
              || psql "$DATABASE_URL" -qc "CREATE ROLE ${role} NOLOGIN"
            psql "$DATABASE_URL" -qc "GRANT ${role} TO askhava_ci" >/dev/null
          done
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          RUNNER_STARTER: actions
          # The lane this run serves: the runner claims only on it (D-620).
          RUNNER_LANE: ${{ needs.gate.outputs.lane }}
          GH_TOKEN: ${{ github.token }}
          # The action replaces GH_TOKEN with the Claude App's token, which cannot read check runs;
          # the runner uses this job token (checks: read) for those reads only (D-502).
          RUNNER_CHECKS_TOKEN: ${{ github.token }}
          # Task-branch pushes only: the Claude App cannot push workflow files (D-509). Empty if unset.
          RUNNER_PUSH_TOKEN: ${{ secrets.RUNNER_PUSH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The session's own turns in the job log (private repository; secrets stay masked), so a session
          # that stops early can be diagnosed (D-503).
          show_full_output: true
          # A task's PR is merged by the Claude App's auto-merge, so the merge and ci events that start
          # the next cycle carry the bot as actor; the action refuses bot-started runs unless named here.
          # The prompt is fixed in this file, never taken from the event (D-505).
          # github-actions: the chaining step and the hourly tick dispatch with the job token (D-508).
          allowed_bots: "claude,github-actions"
          claude_args: --model claude-sonnet-5-5 --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,Agent,TodoWrite,WebFetch,WebSearch" --disallowedTools "SendMessage"
          prompt: |
            You are the Ask Hava build runner. Read BUILD_BRIEF.md sections 2, 7 and 16 now. The runner code (runner/) does the cycle; you do only the task it hands you (D-486).

            Do exactly this:
            1. Run `python3 -m runner` (RUNNER_STARTER=actions is already set) in the foreground with the Bash tool's longest timeout (600000 ms); never with run_in_background. It prints a result line and a JSON line. If a call still times out, run it again: the runner picks up where it stopped. Never end your turn before you have its result line: this job ends when you stop, and a runner still running is killed mid-cycle (D-510).
            2. If the result is anything but `handed_off`, stop. Never do the runner's steps by hand; a live lease naming another session means stop (D-171).
            3. If it is `handed_off`, the JSON `handoff` names the task, branch, prompt and models. Run that one task through a worker subagent on that model (alias haiku, sonnet or opus, D-170) with only the prompt and the files it lists (when `prompt` is not a file path, as for FIX-MAIN, it is the prompt text itself: follow it, revert first); commit to the local branch; do not push it. Tell the worker to number new `docs/decisions.md` entries only from the handoff's `decision_ids`, in order (D-530).
            3b. When the handoff's `branch_ready` is true, the runner has already made that local branch (on top of the task's earlier pushed attempt when there is one, with main merged in): pass the handoff's `branch_note` to the worker word for word and tell it to `git switch` to the branch and never create, reset or rebase it, which replaces step 6 of the prompt's start routine. A branch rebuilt from main cannot be pushed, because the runner never force-pushes (D-583).
            3c. When the handoff's `resync` is not empty, the task's reviewed work is finished and only merging main into it conflicts: give the worker the prompt and the `resync` text word for word, and its only job is to merge main into the branch with a normal merge commit, resolve each conflict keeping both sides, change nothing else, run the smoke test and commit. The reviewer in step 4 then reviews the whole diff against main as usual (D-891).
            3a. Run every subagent in the foreground (run_in_background: false) and wait for it to finish. Never end your turn while a subagent is running: this job ends when you stop, and anything still running is killed with it (D-503).
            4. Run the fresh-eyes reviewer subagent on the reviewer model over the diff and the task's spec files; findings go back to the worker once, as a NEW foreground worker subagent call (run_in_background: false) given the findings and told to commit on the same branch; never resume an agent by message, which runs it in the background and ends the job before it commits (D-522).
            5. Run `python3 -m runner --after --worker-agent <worker agent id> --reviewer-agent <reviewer agent id>` (add `--outcome tests_failed --log "<summary>"` if the work failed, `--outcome usage_limit` at a usage limit).
            5a. Run `--after` the same way: foreground, longest timeout, and wait for its result line.
            6. While the task runs longer than 30 minutes, run `python3 -m runner --renew` every 30 minutes.
            7. Never edit kit/state.json, claude/kit-state or claude/lease yourself, never push to main, never force-push.
            8. Report the runner's output lines and stop.

            Never break section 2. Never claim a test passed unless you ran it here.
      - name: Keep the plan usage the session reported, for pacing (D-1155)
        if: always()
        env:
          RUNNER_STARTER: actions
          RUNNER_LANE: ${{ needs.gate.outputs.lane }}
          GH_TOKEN: ${{ github.token }}
          RUNNER_CHECKS_TOKEN: ${{ github.token }}
          RUNNER_PUSH_TOKEN: ${{ secrets.RUNNER_PUSH_TOKEN }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -u
          # The action streams rate_limit_event messages with the plan's own windows and writes every
          # message to its execution file; the last one is the figure Casey reads under /usage. No token
          # is involved: the file is read after the session ended (D-1155).
          [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ] || { echo "no execution file"; exit 0; }
          python3 -m runner --usage-reading "$EXECUTION_FILE" 2>&1 || true
      - name: Hand in for a session that stopped without handing in (D-503)
        if: always()
        id: safety
        env:
          RUNNER_STARTER: actions
          RUNNER_LANE: ${{ needs.gate.outputs.lane }}
          GH_TOKEN: ${{ github.token }}
          RUNNER_CHECKS_TOKEN: ${{ github.token }}
          RUNNER_PUSH_TOKEN: ${{ secrets.RUNNER_PUSH_TOKEN }}
        run: |
          set -u
          # A session that claimed a task but ended without `--after` would hold the lease for three hours.
          # `--after` finishes only a task this run's session still holds; otherwise it answers
          # not_lease_holder and changes nothing.
          [ -f .git/runner_handoff.json ] || { echo "no handoff in this run"; exit 0; }
          out="$(python3 -m runner --after --outcome tests_failed --log "session ended without handing in" 2>&1 || true)"
          echo "$out"
          case "$out" in *not_lease_holder*|*" is "*) echo "released=no" >> "$GITHUB_OUTPUT";; *) echo "released=yes" >> "$GITHUB_OUTPUT";; esac
      - name: Start the next cycle at once when this one cleared the way (D-500)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # Chain only on a result that leaves work for the very next cycle: a cleared red, or a red
          # main that this cycle has just turned into a queued FIX-MAIN. A red still waiting on the
          # nightly, a lost race and every other result wait for an event or the hourly tick, so the
          # chain can never spin without progress (D-500 review).
          log="$(gh api "repos/${GITHUB_REPOSITORY}/contents/kit/runner_log.jsonl?ref=claude/kit-state" \
            -H 'Accept: application/vnd.github.raw' 2>/dev/null || true)"
          # Only this job's own rows (its session), so another lane's job running at the same time is never
          # read as this one (D-620).
          again="$(printf '%s' "$log" | SESSION="actions-${GITHUB_RUN_ID}" python3 -c '
          import json, os, sys
          start, session = os.environ.get("JOB_START", "9999"), os.environ.get("SESSION", "")
          rows = [json.loads(l) for l in sys.stdin if l.strip()]
          mine = [r for r in rows if str(r.get("at", "")) >= start and r.get("session") == session]
          def moved(r):
              return bool((r.get("changed") or {}).get("tasks"))
          go = any(r.get("result") in ("false_red_cleared", "main_cleared") or (r.get("result") == "main_red" and moved(r)) for r in mine)
          print("yes" if go else "no")
          ' 2>/dev/null || echo no)"
          echo "chain: ${again}"
          # A safety hand-in (D-503) frees the lease for the task's retry; the runner's retry ladder bounds it.
          if [ "${{ steps.safety.outputs.released }}" = "yes" ]; then again=yes; fi
          # Two or more lanes (D-620): this run's last report names the free lanes a task could be claimed on
          # (`refill`); after a result that moved a task (an attempt handed in or failed, a merge resolved, a
          # red main cleared), or a row whose `changed.tasks` shows any task moved (D-723), one run is
          # started per such lane (a cycle that hands off has already started its refill runs itself,
          # D-723). A run that then claims nothing reports idle, paced, lease_live or no_free_lane and
          # starts nothing, so the chain never spins; the lane's concurrency group and the lease keep a
          # second start from doing anything twice. Rows that
          # did nothing (a lease renewal, an `--after` from a session holding no lease) are skipped, so the
          # hand-in's own row decides.
          refill="$(printf '%s' "$log" | SESSION="actions-${GITHUB_RUN_ID}" python3 -c '
          import json, os, re, sys
          start, session = os.environ.get("JOB_START", "9999"), os.environ.get("SESSION", "")
          moved = {"MERGE_PENDING", "QUEUED", "BLOCKED", "DONE", "RETRY_LATER", "RETRY_AFTER_RESET", "done", "check_failed",
                   "no_changes", "unreviewed_head", "not_done", "push_failed", "update_conflict", "update_push_failed", "resync",
                   "main_cleared", "false_red_cleared", "main_red"}
          def quiet(r):
              result = str(r.get("result", ""))
              return result in ("not_lease_holder", "renewed") or result.startswith("renew_refused") or re.fullmatch(r"\S+ is \S+", result)
          rows = [json.loads(l) for l in sys.stdin if l.strip()]
          mine = [r for r in rows if str(r.get("at", "")) >= start and r.get("session") == session and not quiet(r)]
          last = mine[-1] if mine else {}
          # A row moved a task by its result, or by the tasks it changed: a run whose own lane still waits
          # (merge_pending) may have resolved the merge of another lane and freed that lane (D-723).
          went = last.get("result") in moved or bool((last.get("changed") or {}).get("tasks"))
          lanes = [str(n) for n in last.get("refill") or [] if str(n).isdigit()] if went else []
          print(" ".join(lanes))
          ' 2>/dev/null || true)"
          if [ -n "$refill" ]; then
            echo "refill lanes: ${refill}"
            for n in $refill; do gh workflow run backup-runner.yml --ref main --repo "$GITHUB_REPOSITORY" -f lane="$n"; done
          elif [ "$again" = "yes" ]; then gh workflow run backup-runner.yml --ref main --repo "$GITHUB_REPOSITORY"; fi
