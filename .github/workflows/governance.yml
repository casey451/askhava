# Required check "Governance" (docs/governance.md, D-479). Runs from main's copy of this
# workflow and main's copy of the scripts, never from the branch under test, so a pull
# request cannot edit the rules it is checked against (workflow_run always uses the
# default branch's workflow file). The check attaches to the triggering run's head SHA.
name: governance
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
  checks: write
  pull-requests: read
jobs:
  governance:
    # Not named "Governance": a workflow_run job's own check lands on main; the published check run below
    # carries that name on the head commit instead.
    name: governance-runner
    runs-on: ubuntu-latest
    if: github.event.workflow_run.head_branch != 'claude/kit-state'
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
    steps:
      - name: Skip a head whose pull request already merged (D-1077)
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A ci run that finishes after its head was squash-merged (a manual re-run, or a pull_request run
          # already started when D-1077 landed) would compare the head with a main that already holds its
          # decision entries and post a false failure; the Governance result from before the merge stands.
          # Any answer that is not a plain count (an API error prints its body) counts as not merged, so
          # the rules still run. This assumes a merged head is on main; that is false only when a FIX-MAIN revert
          # is followed by the same SHA proposed again (a retry merges main first, so it gets a new SHA).
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .head.sha == env.HEAD_SHA)] | length' 2>/dev/null)" || merged=0
          case "$merged" in ''|*[!0-9]*) merged=0 ;; esac
          if [ "$merged" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "head $HEAD_SHA is already merged: Governance not evaluated again"
          fi

      - name: Check out main (the rules)
        if: steps.merged.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: rules

      - name: Refuse heads from forks
        if: steps.merged.outputs.skip != 'true'
        run: |
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY" || { echo "head from another repository"; exit 1; }

      - name: Fetch the head under test into a worktree
        if: steps.merged.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd rules
          git fetch --no-tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$HEAD_SHA"
          git worktree add ../head "$HEAD_SHA"

      - name: Run main's rules against the head
        if: steps.merged.outputs.skip != 'true'
        run: |
          cd head
          python3 ../rules/scripts/check_plan_lock.py --root .
          python3 ../rules/scripts/check_pr_change.py --root . --base origin/main --branch "$HEAD_BRANCH"

      - name: Publish the result on the head commit
        if: always() && steps.merged.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          conclusion=$([ "$RESULT" = "success" ] && echo success || echo failure)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=Governance -f head_sha="$HEAD_SHA" -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=Governance" -f "output[summary]=main's plan lock and change rules run against $HEAD_SHA: $conclusion"
